<script>

// LOGIN

function loginBot(){

const pwd =
document.getElementById('password').value.trim();

if(pwd === "Pak786"){

document.getElementById('loginBox').style.display = "none";

document.getElementById('mainBot').style.display = "block";

updateChart();

}else{

alert("❌ WRONG PASSWORD");

}

}

// ENTER KEY

document
.getElementById('password')
.addEventListener('keypress',function(e){

if(e.key === "Enter"){
loginBot();
}

});

// LIVE CLOCK

setInterval(()=>{

const now = new Date();

document.getElementById('clock').innerHTML =
"🕒 " + now.toLocaleTimeString();

},1000);

// CHART UPDATE

function updateChart(){

const pair =
document.getElementById('pair').value;

const symbol =
pair.replace(":","%3A");

document.getElementById('chart').src =

`https://s.tradingview.com/widgetembed/?symbol=${symbol}&interval=1&theme=dark&hideideas=1&studies=RSI%2CMACD%2CBB%40tv-basicstudies`;

}

// CANDLE PATTERNS

function getPattern(){

const patterns = [

"Bullish Engulfing",
"Bearish Engulfing",
"Hammer",
"Strong Breakout",
"Morning Star",
"Evening Star",
"Momentum Candle"

];

return patterns[
Math.floor(Math.random()*patterns.length)
];

}

// TREND DETECTION

function detectTrend(rsi,macd,emaFast,emaSlow){

if(
rsi > 58 &&
macd > 0.30 &&
emaFast > emaSlow
){
return "STRONG_UP";
}

if(
rsi < 42 &&
macd < -0.30 &&
emaFast < emaSlow
){
return "STRONG_DOWN";
}

return "SIDEWAYS";

}

// MAIN SIGNAL ENGINE

function generateSignal(){

const btn =
document.getElementById('scanBtn');

const loader =
document.getElementById('loader');

const fill =
document.getElementById('fill');

const result =
document.getElementById('resultBox');

if(btn.disabled) return;

btn.disabled = true;

btn.innerHTML =
"📡 ANALYZING MARKET...";

loader.style.display = "block";

result.style.display = "none";

fill.style.width = "0%";

setTimeout(()=>{
fill.style.width = "100%";
},50);

// MARKET VALUES

let rsi =
Math.floor(Math.random()*40)+30;

let emaFast =
Math.floor(Math.random()*15)+100;

let emaSlow =
Math.floor(Math.random()*15)+95;

let volatility =
Math.floor(Math.random()*40)+60;

let macd =
((emaFast - emaSlow)/8).toFixed(2);

let trend =
detectTrend(
rsi,
parseFloat(macd),
emaFast,
emaSlow
);

let candle =
getPattern();

let signal =
"⚠️ WAIT";

let color =
"#ffaa33";

let confidence =
55;

let strategy =
"WAITING FOR MARKET";

// STRONG CALL

if(
trend === "STRONG_UP" &&
volatility > 65
){

signal =
"🟢 STRONG CALL";

color =
"#00ff99";

confidence =
92 + Math.floor(Math.random()*5);

strategy =
`🔥 BUY PRESSURE | ${candle}`;

}

// STRONG PUT

else if(
trend === "STRONG_DOWN" &&
volatility > 65
){

signal =
"🔴 STRONG PUT";

color =
"#ff4444";

confidence =
92 + Math.floor(Math.random()*5);

strategy =
`📉 SELL PRESSURE | ${candle}`;

}

// SIDEWAYS

else{

signal =
"⚠️ NO TRADE";

color =
"#cccccc";

confidence =
50 + Math.floor(Math.random()*10);

strategy =
"⛔ MARKET SIDEWAYS";

}

// SHOW RESULT

setTimeout(()=>{

loader.style.display = "none";

btn.disabled = false;

btn.innerHTML =
"⚡ SCAN SIGNAL";

result.style.display = "block";

// SIGNAL

const signalText =
document.getElementById('signalText');

signalText.innerHTML =
signal;

signalText.style.color =
color;

// CONFIDENCE

const accuracy =
document.getElementById('accuracy');

accuracy.innerHTML =
`🎯 CONFIDENCE: ${confidence}%`;

accuracy.style.color =
color;

// MARKET DATA

document.getElementById('marketData').innerHTML =

`📊 RSI: ${rsi}
 | MACD: ${macd}
 | EMA FAST: ${emaFast}
 | EMA SLOW: ${emaSlow}
 | VOLATILITY: ${volatility}%`;

// STRATEGY

document.getElementById('strategy').innerHTML =
strategy;

// BORDER

result.style.borderColor =
color;

},2200);

}

</script>
