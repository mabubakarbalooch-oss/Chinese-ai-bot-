<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>ABU BAKAR TRADER - QUOTEX BOT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
display:flex;
justify-content:center;
padding:8px;
overflow-x:hidden;
}

.bot{
width:100%;
max-width:360px;
background:#050505;
border:2px solid #ffd400;
border-radius:22px;
padding:10px;
box-shadow:0 0 18px rgba(255,212,0,0.4);
overflow:hidden;
}

.logo{
width:68px;
height:68px;
border-radius:50%;
background:#ffd400;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
font-size:30px;
font-weight:800;
color:#000;
box-shadow:0 0 18px #ffd400;
}

.title{
text-align:center;
font-size:20px;
font-weight:800;
color:#ffd400;
margin-top:8px;
}

.sub{
text-align:center;
font-size:10px;
color:#aaa;
margin-bottom:10px;
}

.select{
width:100%;
padding:11px;
background:#0b0b0b;
border:1px solid #ffd400;
border-radius:14px;
color:#fff;
font-size:14px;
margin-bottom:8px;
outline:none;
}

.pairs{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:5px;
margin-bottom:8px;
}

.pair{
padding:5px 10px;
background:#101010;
border:1px solid #222;
border-radius:10px;
font-size:11px;
color:#fff;
}

.chart{
height:190px;
background:#050505;
border:1px solid #1d1d1d;
border-radius:18px;
padding:10px;
position:relative;
overflow:hidden;
}

.market{
font-size:12px;
font-weight:700;
color:#ffd400;
}

.price{
font-size:34px;
font-weight:800;
color:#00ff88;
margin-top:4px;
}

.candles{
position:absolute;
left:8px;
right:8px;
bottom:14px;
height:95px;
display:flex;
align-items:flex-end;
gap:3px;
}

.candle{
width:6px;
border-radius:4px;
position:relative;
}

.green{
background:#00ff88;
box-shadow:0 0 8px #00ff88;
}

.red{
background:#ff3b3b;
box-shadow:0 0 8px #ff3b3b;
}

.scan{
position:absolute;
top:0;
bottom:0;
width:3px;
background:#ffd400;
box-shadow:0 0 16px #ffd400;
animation:scanmove 2s linear infinite;
}

@keyframes scanmove{
0%{left:-5px;}
100%{left:100%;}
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:15px;
background:linear-gradient(135deg,#ffd400,#ffb300);
font-size:22px;
font-weight:800;
color:#000;
margin-top:10px;
box-shadow:0 0 16px rgba(255,212,0,0.4);
cursor:pointer;
}

.signalBox{
margin-top:10px;
background:#080808;
border-radius:16px;
padding:12px;
border:1px solid #222;
text-align:center;
}

.signal{
font-size:52px;
font-weight:800;
}

.buy{
color:#00ff88;
text-shadow:0 0 14px #00ff88;
}

.sell{
color:#ff4444;
text-shadow:0 0 14px #ff4444;
}

.wait{
color:#ffaa00;
text-shadow:0 0 14px #ffaa00;
}

.conf{
font-size:34px;
font-weight:800;
color:#ffd400;
margin-top:5px;
}

.info{
margin-top:8px;
font-size:12px;
line-height:1.7;
color:#ddd;
}

.lock{
text-align:center;
font-size:11px;
color:#888;
margin-top:8px;
}

</style>
</head>

<body>

<div class="bot">

<div class="logo">QX</div>

<div class="title">ABU BAKAR TRADER</div>

<div class="sub">QUOTEX LIVE SIGNAL BOT</div>

<select class="select" id="pair">

<option>🇧🇷 USD/BRL OTC</option>
<option>🇲🇽 USD/MXN OTC</option>
<option>🇮🇳 USD/INR OTC</option>
<option>🇵🇰 USD/PKR OTC</option>
<option>🇺🇸 EUR/USD OTC</option>
<option>🇬🇧 GBP/USD OTC</option>

</select>

<select class="select" id="timeframe">

<option>15 Seconds</option>
<option>30 Seconds</option>
<option>1 Minute</option>
<option>5 Minutes</option>

</select>

<div class="pairs">

<div class="pair">🇧🇷 USD/BRL</div>
<div class="pair">🇲🇽 USD/MXN</div>
<div class="pair">🇮🇳 USD/INR</div>
<div class="pair">🇵🇰 USD/PKR</div>
<div class="pair">🇺🇸 EUR/USD</div>
<div class="pair">🇬🇧 GBP/USD</div>

</div>

<div class="chart">

<div class="scan"></div>

<div class="market">LIVE MARKET</div>

<div class="price" id="price">4.9721</div>

<div class="candles" id="candles"></div>

</div>

<button class="btn" onclick="getSignal()">

GET SIGNAL

</button>

<div class="signalBox">

<div class="signal wait" id="signal">

WAIT

</div>

<div class="conf" id="confidence">

0%

</div>

<div class="info">

<div id="rsi">RSI : 0</div>

<div id="ema9">EMA 9 : 0</div>

<div id="ema21">EMA 21 : 0</div>

<div id="macd">MACD : 0</div>

<div id="trend">TREND : WAIT</div>

<div id="time">TIMEFRAME : 15s</div>

</div>

</div>

<div class="lock">

🔒 PASSWORD : 786786

</div>

</div>

<script>

let price = 4.97;
let history = [];

function updateMarket(){

price += (Math.random()-0.5)*0.02;

document.getElementById("price").innerHTML =
price.toFixed(4);

history.push(price);

if(history.length > 100){
history.shift();
}

drawCandles();

}

setInterval(updateMarket,800);

function drawCandles(){

let wrap = document.getElementById("candles");

wrap.innerHTML = "";

for(let i=0;i<38;i++){

let h = Math.random()*70+15;

let d = document.createElement("div");

d.classList.add("candle");

if(Math.random()>0.5){
d.classList.add("green");
}else{
d.classList.add("red");
}

d.style.height = h+"px";

wrap.appendChild(d);

}

}

function ema(data,period){

if(data.length < period) return 0;

let k = 2/(period+1);

let e = data[0];

for(let i=1;i<data.length;i++){

e = data[i]*k + e*(1-k);

}

return e;

}

function rsi(data,period=14){

if(data.length < period+1) return 50;

let gains=0;
let losses=0;

for(let i=1;i<=period;i++){

let diff=data[i]-data[i-1];

if(diff>0){
gains+=diff;
}else{
losses-=diff;
}

}

if(losses===0)return 100;

let rs=gains/losses;

return 100-(100/(1+rs));

}

function macd(){

let ema12=ema(history,12);

let ema26=ema(history,26);

return ema12-ema26;

}

function getSignal(){

if(history.length<30){

alert("WAITING LIVE DATA");

return;

}

let RSI=rsi(history);

let EMA9=ema(history,9);

let EMA21=ema(history,21);

let MACD=macd();

let signal="WAIT";
let cls="wait";
let confidence=70;

if(EMA9>EMA21 && RSI>55 && MACD>0){

signal="BUY";
cls="buy";
confidence=92;

}

else if(EMA9<EMA21 && RSI<45 && MACD<0){

signal="SELL";
cls="sell";
confidence=91;

}

document.getElementById("signal").innerHTML=signal;

document.getElementById("signal").className=
"signal "+cls;

document.getElementById("confidence").innerHTML=
confidence+"%";

document.getElementById("rsi").innerHTML=
"RSI : "+RSI.toFixed(1);

document.getElementById("ema9").innerHTML=
"EMA 9 : "+EMA9.toFixed(4);

document.getElementById("ema21").innerHTML=
"EMA 21 : "+EMA21.toFixed(4);

document.getElementById("macd").innerHTML=
"MACD : "+MACD.toFixed(4);

document.getElementById("trend").innerHTML=
"TREND : "+signal;

document.getElementById("time").innerHTML=
"TIMEFRAME : "+
document.getElementById("timeframe").value;

}

drawCandles();

</script>

</body>
</html>
