<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lubna Abubakar AI Bot Pro - Live Binance</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100dvh;width:100vw;overflow:hidden;background:#0d1117;font-family:'Orbitron',sans-serif;color:#fff;touch-action:none;}

.login-screen{width:100%;height:100dvh;display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0d1117,#161b22);position:fixed;top:0;left:0;z-index:999;}
.login-card{width:90%;max-width:380px;background:#161b22;border:1px solid #30363d;border-radius:24px;padding:40px 28px;box-shadow:0 0 60px rgba(0,255,136,0.15);}
.logo{width:100px;height:100px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,#00ff88,#00cc44);display:flex;justify-content:center;align-items:center;font-size:42px;font-weight:900;color:#000;box-shadow:0 0 40px rgba(0,255,136,0.4);animation:pulseGlow 2s ease-in-out infinite;}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 40px rgba(0,255,136,0.4);}50%{box-shadow:0 0 60px rgba(0,255,136,0.7);}}
.title{text-align:center;font-size:22px;font-weight:900;color:#00ff88;letter-spacing:3px;}
.subtitle{text-align:center;font-size:11px;color:#8b949e;letter-spacing:4px;margin-bottom:30px;margin-top:6px;}
.input-box{margin-bottom:20px;position:relative;}
.input-box label{font-size:10px;color:#8b949e;letter-spacing:2px;margin-bottom:8px;display:block;text-transform:uppercase;font-weight:700;}
.input-box input{width:100%;padding:16px 16px 16px 50px;background:#0d1117;border:1px solid #30363d;border-radius:14px;color:#00ff88;font-size:16px;font-weight:700;outline:none;transition:all 0.3s;}
.input-box input:focus{border-color:#00ff88;box-shadow:0 0 20px rgba(0,255,136,0.15);}
.input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px;color:#6e7681;}
.unlock-btn{width:100%;padding:18px;background:linear-gradient(135deg,#00ff88,#00cc44);border:none;border-radius:14px;font-weight:900;font-size:16px;color:#000;letter-spacing:3px;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 25px rgba(0,255,136,0.3);margin-top:10px;}
.unlock-btn:active{transform:scale(0.97);}
.error-msg{color:#ff4444;font-size:11px;text-align:center;margin-top:10px;display:none;}

.app-screen{display:none;width:100%;height:100dvh;background:#0d1117;overflow-y:auto;overflow-x:hidden;position:fixed;top:0;left:0;z-index:1;}
.app-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#161b22;border-bottom:1px solid #30363d;position:sticky;top:0;z-index:100;}
.app-header .logo-small{font-size:14px;font-weight:900;color:#00ff88;display:flex;align-items:center;gap:8px;}
.app-header .logo-small::before{content:'◈';font-size:18px;}
.app-header .live-badge{background:#238636;color:#fff;padding:4px 10px;border-radius:20px;font-size:9px;font-weight:700;display:flex;align-items:center;gap:4px;}
.app-header .live-badge::before{content:'';width:6px;height:6px;background:#00ff88;border-radius:50%;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

.home-screen{padding:16px;}
.home-title{font-size:20px;font-weight:900;text-align:center;margin-bottom:4px;}
.home-subtitle{font-size:11px;color:#8b949e;text-align:center;margin-bottom:20px;}
.stats-row{display:flex;justify-content:center;gap:16px;margin-bottom:24px;}
.stat-box{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:10px 16px;text-align:center;}
.stat-box .stat-num{font-size:16px;font-weight:900;color:#00ff88;}
.stat-box .stat-label{font-size:8px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-top:2px;}

.market-card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:18px;margin-bottom:12px;cursor:pointer;transition:all 0.3s;}
.market-card:active{transform:scale(0.98);}
.market-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.market-card-left{display:flex;align-items:center;gap:12px;}
.market-icon{width:44px;height:44px;border-radius:12px;background:#0d1117;display:flex;justify-content:center;align-items:center;font-size:22px;}
.market-name{font-size:14px;font-weight:900;}
.market-desc{font-size:10px;color:#8b949e;margin-top:2px;}
.market-badge{font-size:9px;padding:3px 8px;border-radius:6px;font-weight:700;}
.market-badge.hot{background:rgba(255,68,68,0.15);color:#ff4444;}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
    <div class="login-card">
        <div class="logo">◈</div>
        <div class="title">LUBNA ABUBAKAR</div>
        <div class="subtitle">AI BOT PRO</div>
        
        <div class="input-box">
            <label>Username</label>
            <span class="input-icon">👤</span>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        
        <div class="input-box">
            <label>Password</label>
            <span class="input-icon">🔒</span>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        
        <button class="unlock-btn" onclick="login()">UNLOCK BOT</button>
        <div class="error-msg" id="errorMsg">Invalid credentials!</div>
    </div>
</div>

<!-- APP SCREEN -->
<div class="app-screen" id="appScreen">
    <div class="app-header">
        <div class="logo-small">LUBNA AI PRO</div>
        <div class="live-badge">LIVE</div>
    </div>
    
    <div class="home-screen">
        <div class="home-title">BINANCE AI SIGNALS</div>
        <div class="home-subtitle">Real-time Trading Analysis</div>
        
        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-num">24/7</div>
                <div class="stat-label">Active</div>
            </div>
            <div class="stat-box">
                <div class="stat-num">92%</div>
                <div class="stat-label">Accuracy</div>
            </div>
            <div class="stat-box">
                <div class="stat-num">BTC</div>
                <div class="stat-label">Live</div>
            </div>
        </div>
        
        <div class="market-card" onclick="alert('BTC/USDT Selected')">
            <div class="market-card-header">
                <div class="market-card-left">
                    <div class="market-icon">₿</div>
                    <div>
                        <div class="market-name">BTC/USDT</div>
                        <div class="market-desc">Bitcoin to Tether</div>
                    </div>
                </div>
                <div class="market-badge hot">HOT</div>
            </div>
        </div>
        
        <div class="market-card" onclick="alert('ETH/USDT Selected')">
            <div class="market-card-header">
                <div class="market-card-left">
                    <div class="market-icon">Ξ</div>
                    <div>
                        <div class="market-name">ETH/USDT</div>
                        <div class="market-desc">Ethereum to Tether</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function login() {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    
    // Test login: admin / admin123
    if(user === 'admin' && pass === 'admin123') {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appScreen').style.display = 'block';
    } else {
        errorMsg.style.display = 'block';
        setTimeout(() => { errorMsg.style.display = 'none'; }, 2000);
    }
}

// Enter key se bhi login ho jaye
document.getElementById('password').addEventListener('keypress', function(e) {
    if(e.key === 'Enter') login();
});
</script>

</body>
</html>
