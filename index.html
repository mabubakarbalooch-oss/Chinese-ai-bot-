<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bot Pro v3.0 - Auto Trade</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0b0e11;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e2329;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 85%;
        }
        h1 { color: #f0b90b; font-size: 22px; }
        .status-box {
            background: #2b2f36;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        #signal-display { font-size: 30px; font-weight: bold; }
        .up { color: #0ecb81; }
        .down { color: #f6465d; }
        .neutral { color: #848e9c; }

        /* Ye raha wo Gol Icon (Floating Button) jo aapne manga tha */
        #ai-bot-icon {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #f0b90b, #9a7605);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10000;
            box-shadow: 0 0 20px rgba(240, 185, 11, 0.6);
            border: 3px solid #ffffff;
        }
        .icon-text { color: white; font-weight: bold; font-size: 14px; text-align: center; line-height: 1.2; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI BOT PRO v3.0</h1>
        <div class="status-box">
            <p>Next Signal:</p>
            <div id="signal-display" class="neutral">READY</div>
        </div>
        <p style="font-size: 11px; color: #848e9c;">Note: Keep Quotex open in another tab in Via Browser</p>
    </div>

    <div id="ai-bot-icon" onclick="generateAndSendSignal()">
        <div class="icon-text">AI<br>AUTO</div>
    </div>

    <script>
        // Signal nikalne aur Quotex ko bhejne ka function
        function generateAndSendSignal() {
            const display = document.getElementById('signal-display');
            display.innerText = "ANALYZING...";
            display.className = "neutral";

            // 2 second baad signal generate hoga (RSI/SMA logic yahan add ho sakta hai)
            setTimeout(() => {
                const signals = ["UP", "DOWN"];
                const result = signals[Math.floor(Math.random() * signals.length)];

                // 1. Bot screen par signal dikhaye
                display.innerText = result;
                display.className = result.toLowerCase();

                // 2. Via Browser ko message bheje taaki Quotex par trade lage
                if (window.parent) {
                    window.parent.postMessage({
                        action: "TRADING_SIGNAL",
                        signal: result
                    }, "*");
                }
            }, 2000);
        }
    </script>
</body>
</html>
