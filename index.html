<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>👑 Lubna AI Board - Login</title>
<style>
body { background: linear-gradient(135deg, #1a0033 0%, #4a148c 100%); color:#fff; font-family:'Poppins', Arial; text-align:center; padding:20px; min-height:100vh;}
.login-box { background: rgba(138, 43, 226, 0.2); backdrop-filter: blur(12px); padding:30px; border-radius:20px; margin:100px auto; width:350px; border:2px solid #9c27b0; box-shadow: 0 0 25px rgba(156, 39, 176, 0.6);}
input { padding:12px; width:85%; margin:10px 0; border-radius:10px; border:1px solid #9c27b0; background: rgba(0,0,0,0.3); color:#fff; text-align:center; font-size:15px;}
button { padding:14px 28px; background: linear-gradient(135deg, #d500f9, #9c27b0); border:none; border-radius:12px; color:#fff; font-weight:bold; font-size:17px; cursor:pointer; width:90%;}
</style>
</head>
<body>

<div class="login-box" id="loginPage">
  <h2>👑 LUBNA AI BOARD 👑</h2>
  <h3>Login کریں</h3>
  <input type="text" id="username" placeholder="Username لکھیں"><br>
  <input type="password" id="password" placeholder="Password لکھیں"><br>
  <button onclick="login()">LOGIN</button>
  <p style="font-size:12px; color:#f48fb1;">Default: Username = admin | Password = 1234</p>
</div>

<div id="mainBoard" style="display:none;">
  <!-- یہاں پچھلا والا پورا Signal Board کا کوڈ آ جائے گا -->
  <h2>Login Success ✅</h2>
  <p>اب یہاں Lubna AI Board کا سگنل والا حصہ آئے گا</p>
</div>

<script>
function login(){
  let user = document.getElementById('username').value;
  let pass = document.getElementById('password').value;
  
  if(user == "admin" && pass == "1234"){
    document.getElementById('loginPage').style.display = "none";
    document.getElementById('mainBoard').style.display = "block";
  } else {
    alert("❌ غلط Username یا Password!");
  }
}
</script>

</body>
</html>
