<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ABU BAKAR TRADER - TIGER ELITE AI BOT</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;font-family:'Rajdhani', sans-serif;}

body{background:#02060c; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:10px; color:#e2e8f0; overflow-x:hidden;}

/* --- MAIN INTERFACE PANEL --- */
.bot-container{width:100%;max-width:440px;background:linear-gradient(185deg, #050d1a 0%, #020710 100%);border:2px solid rgba(255,170,0,0.15);border-radius:28px;padding:18px;box-shadow:0 25px 65px rgba(0,0,0,0.85);position:relative;display:none;}

/* --- LOCK SCREEN --- */
.lock-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#02050a;display:flex;justify-content:center;align-items:center;z-index:9999;}
.lock-box{width:90%;max-width:350px;background:#050d1a;border:1px solid rgba(255,170,0,0.25);border-radius:22px;padding:25px;text-align:center;}
.lock-title{font-family:'Orbitron',sans-serif;font-size:20px;color:#ffaa00;margin-bottom:15px;font-weight:900;}
.lock-input{width:100%;padding:12px;border:1px solid rgba(255,255,255,0.1);border-radius:10px;background:#020710;color:#fff;text-align:center;margin-bottom:15px;}
.lock-btn{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg, #ffaa00, #ff5500);color:#000;font-weight:bold;cursor:pointer;}
.error-msg{margin-top:10px;color:#ff3b3b;display:none;font-size:13px;}

/* --- HEADER & AVATAR --- */
.bot-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;border-bottom:1px solid rgba(255,255,255,0.05);padding-bottom:12px;}
.brand-wrapper {display:flex;align-items:center;gap:12px;}
.avatar-ring{width:54px;height:54px;border-radius:50%;border:2px solid #ffaa00;box-shadow:0 0 12px rgba(255,170,0,0.4);overflow:hidden;display:flex;justify-content:center;align-items:center;background:#020710;}
.avatar-ring img{width:100%;height:100%;object-fit:cover;}
.title-main{font-family:'Orbitron', sans-serif;font-size:18px;font-weight:900;color:#fff;}
.title-sub{font-size:11px;letter-spacing:2px;color:#ffaa00;font-weight:700;}

/* --- UI ELEMENTS --- */
.selector-row{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:12px;padding:10px;margin-bottom:15px;display:flex;gap:10px;}
.dropdown-control{flex:1;background:#020710;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:8px;color:#fff;font-size:13px;font-weight:600;}
.live-viewport{background:#010409;border:1px solid rgba(255,255,255,0.04);border-radius:16px;padding:12px;margin-bottom:15px;}
.live-price{font-family:'Orbitron',monospace;font-size:32px;font-weight:900;color:#ffaa00;margin-bottom:10px;}
.spark-candles{height:100px;display:flex;align-items:flex-end;gap:3px;overflow:hidden;}
.spark-bar{flex:1;border-radius:1px;position:relative;}
.spark-bar.up{ background:#00e676; }
.spark-bar.down{ background:#ff3b3b; }

.scanning-status-frame{background:rgba(255,170,0,0.02);border:1px solid rgba(255,170,0,0.1);border-radius:16px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;}
.radar-circle{width:36px;height:36px;border-radius:50%;border:2px dashed #00b0ff;position:relative;}
.radar-circle.active{animation:spin 2s linear infinite;}
@keyframes spin{ 100%{transform:rotate(360deg);} }

.trigger-action-btn{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg, #ff9900, #ff5500);color:#000;font-family:'Orbitron', sans-serif;font-weight:900;cursor:pointer;margin-bottom:15px;}
.signal-txt-output{font-family:'Orbitron',sans-serif;font-size:52px;font-weight:900;text-align:center;}
.signal-txt-output.wait{ color:#64748b; }
.signal-txt-output.buy{ color:#00e676; }
.signal-txt-output.sell{ color:#ff3b3b; }
.telemetry-matrix{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px;}
.matrix-node{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:10px;padding:8px 12px;display:flex;align-items:center;font-size:12px;}
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <div class="lock-title">TIGER ELITE AI TERMINAL</div>
    <input type="password" id="terminalAccessKey" class="lock-input" placeholder="ENTER ACCESS KEY">
    <button class="lock-btn" onclick="unlockTerminalEngine()">CONNECT BOT</button>
    <div class="error-msg" id="lockError">SECURE ACCESS KEY INVALID</div>
  </div>
</div>

<div class="bot-container" id="botApp">
  <div class="bot-header">
    <div class="brand-wrapper">
      <div class="avatar-ring">
        <img src="https://i.imgur.com/W2SHevC.jpeg" alt="Abu Bakar">
      </div>
      <div>
        <div class="title-main">ABU BAKAR TRADER</div>
        <div class="title-sub">TIGER ELITE AI BOT</div>
      </div>
    </div>
  </div>

  <div class="live-viewport">
    <div class="live-price" id="liveTickerPrice">1.2472</div>
    <div class="spark-candles" id="chartCandlesContainer"></div>
  </div>

  <button class="trigger-action-btn" id="analyzeBtn" onclick="runMarketAnalysisSequence()">⚡ ANALYZER MARKET</button>

  <div class="signal-txt-output wait" id="signalOutput">WAIT</div>
  
  <div class="telemetry-matrix">
    <div class="matrix-node"><span>RSI:</span> <span id="valRsi" style="margin-left:auto">61</span></div>
    <div class="matrix-node"><span>TREND:</span> <span id="valTrend" style="margin-left:auto">UP</span></div>
  </div>
</div>

<script>
const accessKey = "bakar786";
function unlockTerminalEngine(){
    if(document.getElementById("terminalAccessKey").value === accessKey){
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("botApp").style.display = "block";
    } else {
        document.getElementById("lockError").style.display = "block";
    }
}
function runMarketAnalysisSequence(){
    document.getElementById("signalOutput").innerText = "ANALYZING...";
    setTimeout(() => { 
        document.getElementById("signalOutput").innerText = "BUY";
        document.getElementById("signalOutput").className = "signal-txt-output buy";
    }, 2000);
}
</script>

</body>
</html>
