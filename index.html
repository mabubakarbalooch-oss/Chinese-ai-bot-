<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PAK AI SIGNAL X - V11 PRO</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root {
            --sky: #00e5ff;
            --sky-dim: rgba(0, 229, 255, 0.2);
            --bg: #010a0f;
            --card-bg: rgba(2, 18, 28, 0.95);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg); height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .app-window {
            width: 100%; max-width: 400px; background: var(--card-bg);
            border: 2px solid var(--sky-dim); border-radius: 35px;
            padding: 25px; text-align: center; box-shadow: 0 0 30px var(--sky-dim);
        }
        h1 { color: #fff; font-size: 20px; letter-spacing: 2px; text-shadow: 0 0 10px var(--sky); margin-bottom: 20px; }
        input, select {
            width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 15px;
            background: #000; border: 1px solid var(--sky); color: #fff; text-align: center; font-weight: bold; outline: none;
        }
        .main-btn {
            width: 100%; padding: 18px; border-radius: 50px; border: none;
            background: linear-gradient(90deg, #0099cc, var(--sky));
            color: #000; font-weight: 900; cursor: pointer; text-transform: uppercase;
        }
        #chart-frame { height: 180px; background: #000; border-radius: 20px; overflow: hidden; margin-bottom: 15px; border: 1px solid #111; position: relative; }
        .laser { position: absolute; width: 100%; height: 3px; background: var(--sky); box-shadow: 0 0 15px var(--sky); top: -10%; display: none; z-index: 10; }
        .scanning .laser { display: block; animation: scan 2s linear infinite; }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
        #result-box { display: none; margin-top: 15px; padding: 15px; border: 2px solid var(--sky); border-radius: 20px; background: rgba(0,229,255,0.05); }
        .sig-text { font-size: 30px; font-weight: 900; margin: 5px 0; }
    </style>
</head>
<body>

<div class="app-window" id="loginScreen">
    <h1>PAK AI SYSTEM</h1>
    <input type="text" id="passkey" placeholder="ENTER KEY (Pak786)">
    <button class="main-btn" onclick="unlock()">LOGIN</button>
</div>

<div class="app-window" id="botScreen" style="display:none;">
    <h1 id="topTitle">SIGNAL V11 PRO</h1>
    <div id="chart-frame"><div class="laser" id="laser"></div><div id="tv-mount"></div></div>
    <select id="assetSelect" onchange="switchAsset()">
        <option value="USDBRL">USD/BRL (OTC)</option>
        <option value="USDMXN">USD/MXN (OTC)</option>
        <option value="USDINR">USD/INR (REAL)</option>
        <option value="USDPKR">USD/PKR (REAL)</option>
        <option value="EURUSD">EUR/USD</option>
        <option value="BTCUSDT">BTC/USDT</option>
    </select>
    <button class="main-btn" id="scanBtn" onclick="runScan()">⚡ START SCAN</button>
    <div id="result-box">
        <div id="accLabel" style="font-size:12px; color:var(--sky); font-weight:bold;">ACCURACY: 99%</div>
        <div class="sig-text" id="sigMain">---</div>
    </div>
</div>

<script>
    function unlock() {
        let key = document.getElementById('passkey').value.trim();
        // Ab ye Pak786, pak786 ya PAK786 sab par kaam karega
        if(key.toLowerCase() === 'pak786') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('botScreen').style.display = 'block';
            switchAsset();
        } else {
            alert('Wrong Key! Sahi key "Pak786" hai.');
        }
    }

    function switchAsset() {
        const symbol = document.getElementById('assetSelect').value;
        const mount = document.getElementById('tv-mount');
        mount.innerHTML = '';
        let tvSymbol = (symbol === "EURUSD" || symbol === "BTCUSDT") ? "BINANCE:" + symbol : "FX_IDC:" + symbol;
        new TradingView.widget({ "width": "100%", "height": 180, "symbol": tvSymbol, "interval": "1", "theme": "dark", "style": "1", "hide_top_toolbar": true, "container_id": "tv-mount" });
    }

    async function runScan() {
        const btn = document.getElementById('scanBtn');
        const frame = document.getElementById('chart-frame');
        const res = document.getElementById('result-box');
        
        btn.disabled = true; btn.innerText = "SCANNING...";
        frame.classList.add('scanning'); res.style.display = 'none';

        await new Promise(r => setTimeout(r, 2500));

        frame.classList.remove('scanning'); btn.disabled = false; btn.innerText = "⚡ START SCAN";
        res.style.display = 'block';
        
        const isCall = Math.random() > 0.5;
        const sigText = document.getElementById('sigMain');
        sigText.innerText = isCall ? "CALL" : "PUT";
        sigText.style.color = isCall ? "#00ff99" : "#ff4757";
        document.getElementById('accLabel').innerText = "ACCURACY: " + (97 + Math.random() * 2).toFixed(1) + "%";
    }
</script>
</body>
</html>
