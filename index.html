<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💜 PURPLE AI LIVE SIGNAL X</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#070010;
font-family:'Orbitron',sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:15px;
color:white;
overflow-x:hidden;
}

/* LOGIN */

.loginBox{
width:100%;
max-width:420px;
background:#120021;
border:2px solid #b100ff;
border-radius:35px;
padding:25px;
box-shadow:
0 0 40px rgba(177,0,255,0.4);
text-align:center;
}

.logo{
font-size:24px;
font-weight:900;
color:#d86cff;
margin-bottom:15px;
text-shadow:0 0 15px #b100ff;
}

.input{
width:100%;
padding:16px;
border:none;
outline:none;
border-radius:18px;
background:#1c0a2e;
color:white;
font-size:15px;
margin-bottom:15px;
border:1px solid #b100ff;
text-align:center;
}

.btn{
width:100%;
padding:16px;
border:none;
border-radius:20px;
background:linear-gradient(90deg,#7b00ff,#d000ff);
color:white;
font-weight:900;
font-size:15px;
cursor:pointer;
box-shadow:0 0 25px rgba(177,0,255,0.5);
transition:0.3s;
}

.btn:hover{
transform:scale(1.03);
}

/* APP */

.container{
width:100%;
max-width:460px;
display:none;
}

.card{
background:#120021;
padding:20px;
border-radius:30px;
border:2px solid rgba(177,0,255,0.4);
box-shadow:
0 0 45px rgba(177,0,255,0.35);
}

.title{
text-align:center;
font-size:24px;
font-weight:900;
color:#d86cff;
margin-bottom:15px;
text-shadow:0 0 15px #b100ff;
}

.live{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
margin-bottom:15px;
font-size:12px;
color:#e7c6ff;
}

.dot{
width:10px;
height:10px;
background:#d000ff;
border-radius:50%;
animation:blink 1s infinite;
}

@keyframes blink{

0%,100%{
opacity:1;
}

50%{
opacity:0.2;
}

}

select{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:15px;
background:#1c0a2e;
color:white;
font-size:15px;
margin-bottom:15px;
border:1px solid #b100ff;
}

iframe{
width:100%;
height:260px;
border:none;
border-radius:20px;
margin-bottom:15px;
background:black;
}

.timerBox{
text-align:center;
margin-bottom:15px;
}

.timer{
font-size:42px;
font-weight:900;
color:#d86cff;
text-shadow:0 0 20px #b100ff;
}

.label{
font-size:11px;
margin-top:4px;
color:#e7c6ff;
}

.signalBox{
padding:22px;
border-radius:25px;
text-align:center;
transition:0.4s;
}

.buy{
background:rgba(0,255,120,0.12);
border:2px solid #00ff99;
box-shadow:0 0 30px rgba(0,255,120,0.45);
}

.sell{
background:rgba(255,0,90,0.12);
border:2px solid #ff0055;
box-shadow:0 0 30px rgba(255,0,90,0.45);
}

.wait{
background:rgba(177,0,255,0.12);
border:2px solid #b100ff;
box-shadow:0 0 30px rgba(177,0,255,0.45);
}

.signal{
font-size:34px;
font-weight:900;
margin-bottom:12px;
}

.data{
font-size:13px;
line-height:1.9;
}

.bar{
width:100%;
height:10px;
background:#1a1a1a;
border-radius:20px;
overflow:hidden;
margin-top:12px;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#7b00ff,#ff00ff);
transition:0.4s;
}

.history{
margin-top:15px;
background:#1c0a2e;
padding:12px;
border-radius:15px;
font-size:11px;
line-height:1.8;
max-height:120px;
overflow:auto;
}

.note{
margin-top:15px;
font-size:10px;
text-align:center;
line-height:1.8;
color:#f0d2ff;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div class="loginBox" id="loginPage">

<div class="logo">
💜 PURPLE AI LIVE SIGNAL X
</div>

<input
type="password"
class="input"
id="key"
placeholder="ENTER ACCESS KEY">

<button class="btn" onclick="login()">
LOGIN
</button>

</div>

<!-- APP -->

<div class="container" id="app">

<div class="card">

<div class="title">
💜 PURPLE AI LIVE SIGNAL X
</div>

<div class="live">

<div class="dot"></div>

LIVE MARKET CONNECTED

</div>

<select id="pair" onchange="loadChart()">

<option value="BTCUSDT">
BTC / USDT
</option>

<option value="ETHUSDT">
ETH / USDT
</option>

<option value="BNBUSDT">
BNB / USDT
</option>

<option value="SOLUSDT">
SOL / USDT
</option>

</select>

<iframe id="chart"></iframe>

<div class="timerBox">

<div class="timer" id="timer">
60
</div>

<div class="label">
LIVE AUTO TIMER
</div>

</div>

<div class="signalBox wait" id="signalBox">

<div class="signal" id="signalText">
WAIT ⏳
</div>

<div class="data" id="marketData">

RSI: --
<br>
EMA FAST: --
<br>
EMA SLOW: --
<br>
TREND: --

</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

</div>

<button class="btn" onclick="generateSignal()">
SCAN LIVE SIGNAL
</button>

<div class="history" id="history">

LIVE SIGNAL HISTORY...

</div>

<div class="note">

🔥 REAL BINANCE DATA  
🔥 LIVE RSI + EMA FILTER  
🔥 AUTO SIGNAL TIMER  
🔥 PREMIUM PURPLE UI  
🔥 STRONG TREND DETECTION  

</div>

</div>

</div>

<script>

// LOGIN

function login(){

let key =
document.getElementById("key").value;

if(key === "Pak786"){

document.getElementById("loginPage").style.display =
"none";

document.getElementById("app").style.display =
"block";

loadChart();

generateSignal();

}else{

alert("WRONG ACCESS KEY");

}

}

// LOAD CHART

function loadChart(){

const pair =
document.getElementById("pair").value;

document.getElementById("chart").src =

`https://s.tradingview.com/widgetembed/?symbol=BINANCE:${pair}&interval=1&theme=dark&style=1`;

}

// TIMER

let time = 60;

setInterval(()=>{

time--;

if(time <= 0){

time = 60;

generateSignal();

}

document.getElementById("timer").innerHTML =
time;

},1000);

// EMA

function calculateEMA(prices,period){

let k = 2/(period+1);

let ema = prices[0];

for(let i=1;i<prices.length;i++){

ema = prices[i]*k + ema*(1-k);

}

return ema;

}

// RSI

function calculateRSI(closes,period=14){

let gains=0;
let losses=0;

for(let i=1;i<=period;i++){

let diff = closes[i]-closes[i-1];

if(diff>=0){

gains += diff;

}else{

losses += Math.abs(diff);

}

}

let rs = gains/(losses||1);

return 100-(100/(1+rs));

}

// SIGNAL ENGINE

async function generateSignal(){

try{

const pair =
document.getElementById("pair").value;

let url =

`https://api.binance.com/api/v3/klines?symbol=${pair}&interval=1m&limit=50`;

let response =
await axios.get(url);

let candles =
response.data;

let closes =
candles.map(c=>parseFloat(c[4]));

let rsi =
calculateRSI(closes).toFixed(2);

let emaFast =
calculateEMA(closes.slice(-20),9).toFixed(2);

let emaSlow =
calculateEMA(closes.slice(-20),21).toFixed(2);

let trend =
"SIDEWAYS";

let signal =
"WAIT ⏳";

let className =
"signalBox wait";

let strength =
"25%";

// BUY

if(

rsi > 60 &&
emaFast > emaSlow

){

signal = "CALL 📈";

trend = "BULLISH";

className = "signalBox buy";

strength = "90%";

}

// SELL

else if(

rsi < 40 &&
emaFast < emaSlow

){

signal = "PUT 📉";

trend = "BEARISH";

className = "signalBox sell";

strength = "90%";

}

// UPDATE

document.getElementById("signalText").innerHTML =
signal;

document.getElementById("signalBox").className =
className;

document.getElementById("fill").style.width =
strength;

document.getElementById("marketData").innerHTML =

`
RSI: ${rsi}
<br>
EMA FAST: ${emaFast}
<br>
EMA SLOW: ${emaSlow}
<br>
TREND: ${trend}
`;

// HISTORY

let history =
document.getElementById("history");

let timeNow =
new Date().toLocaleTimeString();

history.innerHTML =

`
${timeNow} → ${signal}
<br>
` + history.innerHTML;

}catch(err){

alert("LIVE API ERROR");

}

}

</script>

</body>
</html>
