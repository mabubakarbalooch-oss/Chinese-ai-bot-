<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PAK PRO SIGNAL BOT</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Inter',sans-serif;

background:
linear-gradient(135deg,#01150b,#022617);

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:15px;

color:white;
}

.container{
width:100%;
max-width:450px;
}

.card{

background:#041b10;

border-radius:28px;

padding:22px;

border:1px solid rgba(0,255,153,0.2);

box-shadow:
0 0 25px rgba(0,255,153,0.15);
}

.logo{

font-size:60px;

text-align:center;

margin-bottom:10px;
}

.title{

text-align:center;

font-size:24px;

font-family:'Orbitron',sans-serif;

font-weight:900;

margin-bottom:18px;

background:
linear-gradient(90deg,#ffffff,#00ff99);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;
}

.input,
select{

width:100%;

padding:15px;

border:none;

outline:none;

border-radius:18px;

background:#082414;

color:white;

font-size:15px;

margin-bottom:15px;
}

.btn{

width:100%;

padding:16px;

border:none;

border-radius:30px;

font-family:'Orbitron',sans-serif;

font-weight:900;

font-size:13px;

background:
linear-gradient(90deg,#00994d,#00cc66);

color:white;

cursor:pointer;
}

iframe{

width:100%;

height:240px;

border:none;

border-radius:20px;

background:black;

margin-bottom:15px;
}

.loader{

width:100%;

height:5px;

background:#062014;

border-radius:20px;

overflow:hidden;

display:none;

margin-top:15px;
}

.fill{

width:0%;

height:100%;

background:
linear-gradient(90deg,#00aa55,#00ff99);

transition:2s;
}

.result{

display:none;

margin-top:18px;

padding:18px;

border-radius:22px;

background:#062514;

border:1px solid rgba(0,255,153,0.2);
}

.signal{

font-size:30px;

font-family:'Orbitron',sans-serif;

font-weight:900;

text-align:center;

margin-bottom:10px;
}

.info{

font-size:13px;

margin-top:8px;
}

.note{

margin-top:18px;

font-size:11px;

line-height:1.6;

opacity:0.9;
}

.clock{

text-align:center;

margin-bottom:15px;

font-size:14px;

font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div class="card" id="loginBox">

<div class="logo">🇵🇰</div>

<div class="title">
PAK PRO SIGNAL BOT
</div>

<input
type="password"
id="password"
class="input"
placeholder="ENTER ACCESS KEY">

<button
class="btn"
onclick="loginBot()">

ENTER BOT

</button>

<div class="note">

🔐 ACCESS KEY:
<b style="color:#00ff99;">Pak786</b>

</div>

</div>

<!-- MAIN -->

<div
class="card"
id="mainBot"
style="display:none;">

<div class="clock" id="clock"></div>

<div class="title">
PAK PRO SIGNAL BOT
</div>

<select id="pair" onchange="updateChart()">

<option value="FX:EURUSD">
EUR/USD
</option>

<option value="FX:GBPUSD">
GBP/USD
</option>

<option value="FX:USDJPY">
USD/JPY
</option>

<option value="FX:AUDUSD">
AUD/USD
</option>

</select>

<iframe
id="chart"
allowfullscreen>
</iframe>

<button
class="btn"
id="scanBtn"
onclick="generateSignal()">

⚡ SCAN SIGNAL

</button>

<div class="loader" id="loader">
<div class="fill" id="fill"></div>
</div>

<div class="result" id="resultBox">

<div
class="signal"
id="signalText">

---

</div>

<div
class="info"
id="accuracy">

CONFIDENCE: --%

</div>

<div
class="info"
id="marketData">

ANALYZING...

</div>

<div
class="info"
id="strategy">

WAITING...

</div>

</div>

<div class="note">

🎯 RSI + MACD + EMA SYSTEM ACTIVE

</div>

</div>

</div>

<script>

// LOGIN

function loginBot(){

const pwd =
document.getElementById('password').value.trim();

if(pwd === "Pak786"){

document.getElementById('loginBox').style.display = "none";

document.getElementById('mainBot').style.display = "block";

updateChart();

}else{

alert("Wrong Password");

}

}

// ENTER BUTTON

document
.getElementById('password')
.addEventListener('keypress',function(e){

if(e.key === "Enter"){

loginBot();

}

});

// CLOCK

setInterval(()=>{

const now = new Date();

document.getElementById('clock').innerHTML =
"🕒 " + now.toLocaleTimeString();

},1000);

// CHART

function updateChart(){

const pair =
document.getElementById('pair').value;

document.getElementById('chart').src =

`https://s.tradingview.com/widgetembed/?symbol=${pair}&interval=1&theme=dark`;

}

// SIGNAL

function generateSignal(){

const btn =
document.getElementById('scanBtn');

const loader =
document.getElementById('loader');

const fill =
document.getElementById('fill');

const result =
document.getElementById('resultBox');

btn.disabled = true;

btn.innerHTML =
"📡 ANALYZING...";

loader.style.display = "block";

fill.style.width = "0%";

result.style.display = "none";

setTimeout(()=>{

fill.style.width = "100%";

},100);

// RANDOM MARKET DATA

let rsi =
Math.floor(Math.random()*40)+30;

let macd =
(Math.random()*2-1).toFixed(2);

let trend =
Math.random()>0.5 ? "UP" : "DOWN";

let confidence =
85 + Math.floor(Math.random()*10);

let signal =
"🟢 CALL";

let color =
"#00ff99";

let strategy =
"BUY TREND ACTIVE";

// PUT

if(
trend === "DOWN" &&
macd < 0
){

signal =
"🔴 PUT";

color =
"#ff4444";

strategy =
"SELL TREND ACTIVE";

}

// SHOW RESULT

setTimeout(()=>{

loader.style.display = "none";

btn.disabled = false;

btn.innerHTML =
"⚡ SCAN SIGNAL";

result.style.display = "block";

const signalText =
document.getElementById('signalText');

signalText.innerHTML =
signal;

signalText.style.color =
color;

document.getElementById('accuracy').innerHTML =

`🎯 CONFIDENCE:
${confidence}%`;

document.getElementById('accuracy').style.color =
color;

document.getElementById('marketData').innerHTML =

`📊 RSI:
${rsi}
 | MACD:
${macd}`;

document.getElementById('strategy').innerHTML =
strategy;

result.style.borderColor =
color;

},2200);

}

</script>

</body>
</html>
