<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ABU BAKAR TRADER - MONO AI BOT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Rajdhani', sans-serif;
}

body{
background:#000;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:#fff;
}

/* Subtle white glow background */
body::before{
content:'';
position:absolute;
top:50%;
left:50%;
width:800px;
height:800px;
background:radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
transform:translate(-50%,-50%);
animation:pulse-bg 6s ease-in-out infinite;
}
@keyframes pulse-bg{
0%,100%{transform:translate(-50%,-50%) scale(1);}
50%{transform:translate(-50%,-50%) scale(1.1);}
}

.mono-board{
width:380px;
height:680px;
background:linear-gradient(135deg, 
  rgba(255,255,255,0.03) 0%, 
  rgba(0,0,0,0.9) 50%, 
  rgba(255,255,255,0.03) 100%);
border:1px solid rgba(255,255,255,0.15);
border-radius:35px;
padding:30px;
position:relative;
overflow:hidden;
backdrop-filter:blur(30px);
box-shadow:
 0 0 60px rgba(255,255,255,0.05),
 inset 0 1px 0 rgba(255,255,255,0.1);
}

/* Top shine effect */
.mono-board::before{
content:'';
position:absolute;
top:0;
left:0;
right:0;
height:40%;
background:linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 100%);
pointer-events:none;
}

.header{
text-align:center;
margin-bottom:25px;
position:relative;
z-index:2;
}
.logo-dot{
width:12px;
height:12px;
background:#fff;
border-radius:50%;
box-shadow:0 0 20px #fff, 0 0 40px #fff;
margin:0 auto 15px;
animation:pulse-dot 2s infinite;
}
@keyframes pulse-dot{
0%,100%{box-shadow:0 0 20px #fff, 0 0 40px #fff;}
50%{box-shadow:0 0 30px #fff, 0 0 60px #fff;}
}
.header h1{
font-family:'Orbitron',sans-serif;
font-size:18px;
font-weight:900;
letter-spacing:3px;
color:#fff;
}
.header p{
font-size:12px;
color:rgba(255,255,255,0.5);
letter-spacing:2px;
margin-top:5px;
}

.price-card{
background:rgba(255,255,255,0.03);
border:1px solid rgba(255,255,255,0.1);
border-radius:20px;
padding:25px;
text-align:center;
margin:20px 0;
position:relative;
overflow:hidden;
}
.price-card::after{
content:'';
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
animation:shine 3s infinite;
}
@keyframes shine{
0%{left:-100%;}
100%{left:100%;}
.price-label{
font-size:12px;
color:rgba(255,255,255,0.5);
letter-spacing:2px;
margin-bottom:8px;
}
.price-value{
font-family:'Orbitron',sans-serif;
font-size:38px;
font-weight:800;
color:#fff;
text-shadow:0 0 30px rgba(255,255,255,0.3);
}

.signal-box{
background:#fff;
color:#000;
border-radius:20px;
padding:25px;
text-align:center;
margin:20px 0;
box-shadow:0 0 40px rgba(255,255,255,0.2);
position:relative;
overflow:hidden;
}
.signal-box::before{
content:'';
position:absolute;
top:-50%;
left:-50%;
width:200%;
height:200%;
background:linear-gradient(45deg, transparent, rgba(0,0,0,0.05), transparent);
animation:rotate-light 4s linear infinite;
}
@keyframes rotate-light{
100%{transform:rotate(360deg);}
}
.signal-box h1{
font-family:'Orbitron',sans-serif;
font-size:45px;
font-weight:900;
position:relative;
z-index:2;
}
.signal-box p{
font-size:14px;
font-weight:700;
letter-spacing:1px;
margin-top:5px;
position:relative;
z-index:2;
}

.mono-btn{
width:100%;
padding:18px;
background:#fff;
border:none;
border-radius:15px;
color:#000;
font-family:'Orbitron',sans-serif;
font-size:14px;
font-weight:900;
letter-spacing:2px;
cursor:pointer;
transition:all 0.3s;
box-shadow:0 0 30px rgba(255,255,255,0.2);
}
.mono-btn:hover{
transform:scale(1.03);
box-shadow:0 0 50px rgba(255,255,255,0.4);
background:#f0f0f0;
}

.info-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin:20px 0;
}
.info-card{
background:rgba(255,255,255,0.03);
border:1px solid rgba(255,255,255,0.08);
border-radius:15px;
padding:15px;
text-align:center;
}
.info-card .label{
font-size:11px;
color:rgba(255,255,255,0.5);
margin-bottom:5px;
}
.info-card .value{
font-size:18px;
font-weight:700;
color:#fff;
}

.timer-ring{
width:60px;
height:60px;
margin:0 auto;
border:2px solid rgba(255,255,255,0.2);
border-top:2px solid #fff;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-family:'Orbitron',sans-serif;
font-size:18px;
animation:spin 3s linear infinite;
}
@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

.lock-screen{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}
.lock-box{
width:90%;
max-width:320px;
background:rgba(255,255,255,0.03);
border:1px solid rgba(255,255,255,0.15);
border-radius:25px;
padding:35px;
text-align:center;
backdrop-filter:blur(30px);
}
.lock-input{
width:100%;
padding:15px;
border:1px solid rgba(255,255,255,0.2);
border-radius:12px;
background:rgba(0,0,0,0.5);
color:#fff;
text-align:center;
margin:15px 0;
outline:none;
}
.lock-btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#fff;
color:#000;
font-weight:900;
cursor:pointer;
font-family:'Orbitron',sans-serif;
}
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <h2 style="color:#fff;font-family:Orbitron;font-size:20px;letter-spacing:2px;">MONO ACCESS</h2>
    <input type="password" id="passInput" class="lock-input" placeholder="PASSWORD">
    <button class="lock-btn" onclick="unlock()">ENTER</button>
  </div>
</div>

<div class="mono-board" id="botApp" style="display:none;">
  
  <div class="header">
    <div class="logo-dot"></div>
    <h1>ABU BAKAR TRADER</h1>
    <p>MONO AI SYSTEM</p>
  </div>

  <div class="price-card">
    <div class="price-label">LIVE PRICE</div>
    <div class="price-value" id="price">1.2476</div>
    <div style="font-size:12px;color:rgba(255,255,255,0.5);margin-top:5px;">USD/BRL OTC</div>
  </div>

  <div class="signal-box">
    <h4 style="font-size:12px;letter-spacing:2px;margin-bottom:8px;position:relative;z-index:2;">ANALYSIS RESULT</h4>
    <h1 id="signal">BUY</h1>
    <p id="confidence">96% CONFIDENCE</p>
  </div>

  <div class="info-grid">
    <div class="info-card">
      <div class="label">RSI</div>
      <div class="value" id="rsi">72</div>
    </div>
    <div class="info-card">
      <div class="label">TREND</div>
      <div class="value">UP</div>
    </div>
  </div>

  <div class="timer-ring" id="timer">03</div>

  <button class="mono-btn" onclick="getSignal()">GET SIGNAL</button>

</div>

<script>
let scanning=false;

function unlock(){
  if(document.getElementById('passInput').value==='bakar786'){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('botApp').style.display='block';
    updatePrice();
  }else{
    alert('WRONG PASSWORD');
  }
}

function updatePrice(){
  setInterval(()=>{
    let base=1.2476;
    let change=(Math.random()-0.5)*0.002;
    document.getElementById('price').innerText=(base+change).toFixed(4);
    document.getElementById('rsi').innerText = Math.floor(Math.random()*15)+70;
  },2000);
}

function getSignal(){
  if(scanning)return;
  scanning=true;
  
  let sec=3;
  document.getElementById('timer').innerText='0'+sec;
  
  let timer=setInterval(()=>{
    sec--;
    document.getElementById('timer').innerText='0'+sec;
    if(sec<=0){
      clearInterval(timer);
      scanning=false;
      
      let signal=Math.random()>0.5?'BUY':'SELL';
      let conf=Math.floor(Math.random()*4)+96;
      
      document.getElementById('signal').innerText=signal;
      document.getElementById('confidence').innerText=conf+'% CONFIDENCE';
      
      // Flip colors for SELL
      if(signal==='SELL'){
        document.querySelector('.signal-box').style.background='#000';
        document.querySelector('.signal-box').style.color='#fff';
        document.querySelector('.signal-box').style.border='2px solid #fff';
      }else{
        document.querySelector('.signal-box').style.background='#fff';
        document.querySelector('.signal-box').style.color='#000';
        document.querySelector('.signal-box').style.border='none';
      }
    }
  },1000);
}
</script>
</body>
</html>
