<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Bot Pro - Multi Tab Connector</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0e11; }
        
        /* Quotex Screen */
        #quotex-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Video wala Floating Icon */
        #ai-bot-icon {
            position: fixed;
            bottom: 100px; /* Video ki tarah thoda upar */
            right: 20px;
            width: 65px;
            height: 65px;
            background: radial-gradient(circle, #f0b90b, #9a7605);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999999; /* Sabse upar */
            box-shadow: 0 0 15px rgba(240, 185, 11, 0.8);
            border: 3px solid #fff;
            touch-action: none;
        }

        .icon-text { color: white; font-weight: bold; font-size: 12px; text-align: center; }
        
        /* Signal Popup */
        #signal-popup {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 20px;
            color: #fff;
            font-weight: bold;
            display: none;
            z-index: 1000000;
        }
    </style>
</head>
<body>

    <iframe src="https://market-qx.trade/" id="quotex-frame"></iframe>

    <div id="signal-popup">ANALYZING...</div>

    <div id="ai-bot-icon" onclick="executeAutoTrade()">
        <div class="icon-text">AI<br>AUTO</div>
    </div>

    <script>
        function executeAutoTrade() {
            const popup = document.getElementById('signal-popup');
            popup.style.display = 'block';
            popup.innerText = "AI ANALYZING...";
            popup.style.color = "#f0b90b";

            setTimeout(() => {
                const signals = ["UP", "DOWN"];
                const result = signals[Math.floor(Math.random() * signals.length)];
                
                popup.innerText = "SIGNAL: " + result;
                popup.style.color = (result === "UP") ? "#0ecb81" : "#f6465d";

                // Ye line seedha Quotex frame ko order bhejti hai
                const quotex = document.getElementById('quotex-frame').contentWindow;
                quotex.postMessage({
                    action: "TRADING_SIGNAL",
                    signal: result
                }, "*");

                setTimeout(() => { popup.style.display = 'none'; }, 3000);
            }, 1500);
        }
    </script>
</body>
</html>
