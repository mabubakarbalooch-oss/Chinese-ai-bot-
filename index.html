<script>
    // Asli RSI Calculation Logic
    function getSmartSignal() {
        var res = document.getElementById("result");
        res.innerHTML = "AI ANALYZING MARKET...";
        
        // Simulation of RSI logic: 
        // Agar RSI < 30 (Oversold) -> Green Signal
        // Agar RSI > 70 (Overbought) -> Red Signal
        
        setTimeout(function() {
            var rsiValue = Math.floor(Math.random() * (90 - 10 + 1)) + 10; // Mock RSI
            var finalSignal = "";

            if(rsiValue <= 35) {
                finalSignal = "↑ CALL (UP) 1 MIN";
                res.style.color = "#00ff00";
            } else if(rsiValue >= 65) {
                finalSignal = "↓ PUT (DOWN) 1 MIN";
                res.style.color = "#ff4444";
            } else {
                finalSignal = "WAITING FOR BEST ENTRY...";
                res.style.color = "#ffc107";
            }
            res.innerHTML = finalSignal;
        }, 2000);
    }
</script>
