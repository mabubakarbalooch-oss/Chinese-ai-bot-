<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ABU BAKAR TRADER - NOVA AI BOT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Rajdhani', sans-serif;
}

body{
background:radial-gradient(circle at center, #0f0f1a 0%, #000 100%);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:#fff;
}

.circle-ui{
width:380px;
height:680px;
background:linear-gradient(135deg, rgba(255,0,150,0.1), rgba(0,200,255,0.1));
border-radius:50px;
border:2px solid rgba(255,255,255,0.1);
box-shadow:
 0 0 60px rgba(255,0,150,0.4),
 0 0 100px rgba(0,200,255,0.3),
  inset 0 0 40px rgba(255,255,255,0.05);
backdrop-filter:blur(30px);
position:relative;
overflow:hidden;
animation:float 6s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0px) rotate(-1deg);}
50%{transform:translateY(-15px) rotate(1deg);}
}

.circle-ui::before{
content:'';
position:absolute;
top:-50%;
left:-50%;
width:200%;
height:200%;
background:conic-gradient(from 0deg, 
  transparent 0deg, 
  rgba(255,0,150,0.5) 90deg, 
  transparent 180deg, 
  rgba(0,200,255,0.5) 270deg, 
  transparent 360deg);
animation:rotate 12s linear infinite;
}

@keyframes rotate{
100%{transform:rotate(360deg);}
}

.content{
position:relative;
z-index:2;
padding:25px;
height:100%;
display:flex;
flex-direction:column;
}

.header{
text-align:center;
margin-bottom:20px;
}
.header h1{
font-family:'Orbitron',sans-serif;
font-size:18px;
background:linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
letter-spacing:2px;
animation:glow-text 2s infinite alternate;
}
@keyframes glow-text{
from{filter:brightness(1);}
to{filter:brightness(1.5);}
}

.circle-chart{
width:200px;
height:200px;
margin:20px auto;
border-radius:50%;
background:conic-gradient(from 0deg, 
  #ff00ff 0deg 120deg, 
  #00ffff 120deg 240deg, 
  #ff00ff 240deg 360deg);
padding:8px;
animation:spin-slow 20s linear infinite;
position:relative;
}
.circle-chart::before{
content:'';
position:absolute;
inset:8px;
background:#000;
border-radius:50%;
}
.circle-chart::after{
content:'92%';
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-family:'Orbitron',sans-serif;
font-size:32px;
color:#00ffff;
text-shadow:0 0 20px #00ffff;
z-index:3;
}
@keyframes spin-slow{
100%{transform:rotate(360deg);}
}

.signal-box{
background:rgba(0,0,0,0.7);
border:2px solid rgba(0,255,255,0.5);
border-radius:20px;
padding:20px;
text-align:center;
margin:20px 0;
box-shadow:0 0 30px rgba(0,255,255,0.4);
animation:pulse-glow 2s infinite alternate;
}
@keyframes pulse-glow{
from{box-shadow:0 0 20px rgba(0,255,255,0.3);}
to{box-shadow:0 0 40px rgba(0,255,255,0.6);}
}
.signal-box h2{
font-family:'Orbitron',sans-serif;
font-size:42px;
color:#00ff64;
text-shadow:0 0 30px #00ff64;
}
.signal-box p{
color:#00ffff;
font-size:14px;
margin-top:5px;
}

.btn{
width:100%;
padding:16px;
background:linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff);
border:none;
border-radius:15px;
color:#000;
font-family:'Orbitron',sans-serif;
font-size:14px;
font-weight:900;
letter-spacing:1px;
cursor:pointer;
box-shadow:0 0 30px rgba(255,0,150,0.5);
transition:all 0.3s;
}
.btn:hover{
transform:scale(1.05);
box-shadow:0 0 50px rgba(255,0,150,0.8);
}

.particles{
position:absolute;
inset:0;
pointer-events:none;
}
.dot{
position:absolute;
width:4px;
height:4px;
background:#ff00ff;
border-radius:50%;
box-shadow:0 0 15px #ff00ff;
animation:float-dot 8s infinite linear;
}
@keyframes float-dot{
0%{transform:translateY(700px) translateX(0);opacity:0;}
10%{opacity:1;}
90%{opacity:1;}
100%{transform:translateY(-100px) translateX(100px);opacity:0;}
}

.lock-screen{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}
.lock-box{
width:90%;
max-width:320px;
background:rgba(20,0,30,0.8);
border:2px solid rgba(255,0,150,0.5);
border-radius:25px;
padding:30px;
text-align:center;
backdrop-filter:blur(20px);
}
.lock-input{
width:100%;
padding:14px;
border:1px solid rgba(255,0,150,0.5);
border-radius:12px;
background:rgba(0,0,0,0.5);
color:#fff;
text-align:center;
margin:15px 0;
outline:none;
}
.lock-btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#ff00ff,#00ffff);
color:#000;
font-weight:900;
cursor:pointer;
font-family:'Orbitron',sans-serif;
}
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <h2 style="color:#ff00ff;font-family:Orbitron;">NOVA ACCESS</h2>
    <input type="password" id="passInput" class="lock-input" placeholder="PASSWORD">
    <button class="lock-btn" onclick="unlock()">ACTIVATE</button>
  </div>
</div>

<div class="circle-ui" id="botApp" style="display:none;">
  <div class="content">
    
    <div class="header">
      <h1>ABU BAKAR TRADER</h1>
      <p style="color:#00ffff;font-size:12px;letter-spacing:3px;">NOVA AI SYSTEM</p>
    </div>

    <div class="circle-chart"></div>

    <div class="signal-box">
      <h4 style="color:#8892b0;font-size:12px;">SIGNAL</h4>
      <h2 id="signal">BUY</h2>
      <p id="confidence">95% CONFIDENCE</p>
    </div>

    <div style="display:flex;justify-content:space-between;margin:15px 0;">
      <div style="text-align:center;">
        <div style="font-size:11px;color:#8892b0;">RSI</div>
        <div style="font-size:18px;color:#ff00ff;" id="rsi">72</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size:11px;color:#8892b0;">TREND</div>
        <div style="font-size:18px;color:#00ffff;" id="trend">UP</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size:11px;color:#8892b0;">TIME</div>
        <div style="font-size:18px;color:#fff;" id="timer">03</div>
      </div>
    </div>

    <button class="btn" onclick="getSignal()">⚡ GET SIGNAL</button>

  </div>
</div>

<script>
let scanning=false;

function createParticles(){
  const container = document.getElementById('particles');
  for(let i=0; i=25; i++){
    let p = document.createElement('div');
    p.className = 'dot';
    p.style.left = Math.random()*100 + '%';
    p.style.animationDelay = Math.random()*8 + 's';
    p.style.background = Math.random()>0.5?'#ff00ff':'#00ffff';
    p.style.boxShadow = '0 0 15px ' + (Math.random()>0.5?'#ff00ff':'#00ffff');
    container.appendChild(p);
  }
}

function unlock(){
  if(document.getElementById('passInput').value==='bakar786'){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('botApp').style.display='block';
    createParticles();
    updateData();
  }else{
    alert('Wrong Password');
  }
}

function updateData(){
  setInterval(()=>{
    document.getElementById('rsi').innerText = Math.floor(Math.random()*20)+65;
  },3000);
}

function getSignal(){
  if(scanning)return;
  scanning=true;
  
  let sec=3;
  document.getElementById('timer').innerText='0'+sec;
  
  let timer=setInterval(()=>{
    sec--;
    document.getElementById('timer').innerText='0'+sec;
    if(sec<=0){
      clearInterval(timer);
      scanning=false;
      document.getElementById('resultBox').style.display='block';
      
      let signal=Math.random()>0.5?'BUY':'SELL';
      let conf=Math.floor(Math.random()*5)+95;
      
      document.getElementById('signal').innerText=signal;
      document.getElementById('signal').style.color=signal==='BUY'?'#00ff64':'#ff0040';
      document.getElementById('confidence').innerText=conf+'% CONFIDENCE';
    }
  },1000);
}
</script>
</body>
</html>
