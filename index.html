<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA ABUBAKAR - ULTRA AI</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.1/dist/chartjs-chart-financial.min.js"></script>

<style>

:root{
--bg:#05060a;
--card:#11131b;
--primary:#00ff88;
--red:#ff4d67;
--text:#ffffff;
--muted:#7d8597;
--border:#1f2430;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:
radial-gradient(circle at top,#0d1b2a 0%,#05060a 60%);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
overflow:hidden;
color:var(--text);
}

body::before{
content:'';
position:absolute;
width:200%;
height:200%;
background:
linear-gradient(
45deg,
transparent,
rgba(0,255,136,0.03),
transparent
);

animation:bgmove 12s linear infinite;
}

@keyframes bgmove{

0%{
transform:translate(-20%,-20%) rotate(0deg);
}

100%{
transform:translate(-20%,-20%) rotate(360deg);
}

}

.container{
width:100%;
max-width:420px;
background:rgba(17,19,27,0.96);
border-radius:28px;
padding:20px;
border:1px solid rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
box-shadow:
0 0 35px rgba(0,255,136,0.15);
position:relative;
z-index:2;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{
display:flex;
align-items:center;
gap:12px;
}

.logo-icon{
width:56px;
height:56px;
border-radius:16px;
background:linear-gradient(135deg,#00ff88,#00c96d);
display:flex;
justify-content:center;
align-items:center;
font-family:'Orbitron';
font-size:20px;
font-weight:900;
color:#000;
box-shadow:
0 0 25px rgba(0,255,136,0.45);
}

.logo h1{
font-size:16px;
font-weight:700;
}

.logo p{
font-size:11px;
color:var(--muted);
}

.status{
padding:7px 15px;
border-radius:30px;
background:rgba(0,255,136,0.1);
border:1px solid rgba(0,255,136,0.2);
color:var(--primary);
font-size:11px;
font-weight:700;
}

.label{
font-size:12px;
font-weight:600;
color:var(--muted);
margin-bottom:8px;
display:block;
}

input,select{
width:100%;
padding:15px;
border-radius:15px;
background:#090b10;
border:1px solid var(--border);
color:#fff;
font-size:14px;
margin-bottom:15px;
outline:none;
}

.btn{
width:100%;
padding:17px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#00ff88,#00c96d);
font-family:'Orbitron';
font-size:14px;
font-weight:800;
cursor:pointer;
margin-bottom:15px;
color:#000;
box-shadow:
0 0 25px rgba(0,255,136,0.35);
transition:0.3s;
}

.btn:hover{
transform:scale(1.02);
}

.note{
font-size:12px;
text-align:center;
margin-bottom:15px;
color:#ffbf00;
}

.live-price{
text-align:center;
font-family:'Orbitron';
font-size:34px;
font-weight:900;
margin-bottom:15px;
color:var(--primary);
text-shadow:
0 0 18px rgba(0,255,136,0.5);
}

.pair-card{
background:#090b10;
border:1px solid var(--border);
border-radius:18px;
padding:15px;
margin-bottom:15px;
}

.pair-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.pair-name{
font-size:18px;
font-weight:700;
}

.toggle{
width:55px;
height:30px;
border-radius:30px;
background:#2d3442;
position:relative;
cursor:pointer;
transition:0.3s;
}

.toggle.active{
background:var(--primary);
box-shadow:
0 0 20px rgba(0,255,136,0.45);
}

.toggle::after{
content:'';
position:absolute;
width:24px;
height:24px;
border-radius:50%;
background:#fff;
top:3px;
left:3px;
transition:0.3s;
}

.toggle.active::after{
left:28px;
}

.pair-info{
font-size:11px;
line-height:1.8;
color:var(--muted);
}

#scanner{
height:170px;
background:#090b10;
border-radius:18px;
border:1px solid var(--border);
overflow:hidden;
position:relative;
display:none;
margin-bottom:15px;
}

.scan-line{
position:absolute;
width:100%;
height:4px;
background:
linear-gradient(
90deg,
transparent,
#00ff88,
transparent
);

box-shadow:
0 0 20px #00ff88;

animation:scan 1.5s linear infinite;
}

@keyframes scan{

0%{
top:0;
}

100%{
top:100%;
}

}

#chartContainer{
height:240px;
background:#090b10;
border-radius:18px;
border:1px solid var(--border);
padding:10px;
margin-bottom:15px;
}

#signalBox{
padding:22px;
border-radius:18px;
text-align:center;
font-size:30px;
font-family:'Orbitron';
font-weight:900;
display:none;
margin-bottom:15px;
}

.buy-style{
background:rgba(0,255,136,0.12);
border:1px solid rgba(0,255,136,0.25);
color:var(--primary);
box-shadow:
0 0 25px rgba(0,255,136,0.25);
}

.sell-style{
background:rgba(255,77,103,0.12);
border:1px solid rgba(255,77,103,0.25);
color:var(--red);
box-shadow:
0 0 25px rgba(255,77,103,0.25);
}

.wait-style{
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.08);
color:#fff;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.stat{
background:#090b10;
border:1px solid var(--border);
border-radius:15px;
padding:12px;
text-align:center;
}

.stat h3{
font-size:10px;
margin-bottom:5px;
color:var(--muted);
}

.stat p{
font-size:15px;
font-weight:700;
}

</style>
</head>

<body>

<div id="loginScreen" class="container">

<div class="header">

<div class="logo">

<div class="logo-icon">
QX
</div>

<div>
<h1>LUBNA ABUBAKAR</h1>
<p>ELITE ACCESS SYSTEM</p>
</div>

</div>

<div class="status">
● SAFE
</div>

</div>

<label class="label">
PASSWORD
</label>

<input type="password" id="password" placeholder="Enter Password">

<button class="btn" onclick="login()">
🔓 UNLOCK SYSTEM
</button>

</div>

<div id="mainBoard" class="container" style="display:none;">

<div class="header">

<div class="logo">

<div class="logo-icon">
QX
</div>

<div>
<h1>LUBNA ABUBAKAR</h1>
<p>LIVE AI SIGNAL SYSTEM</p>
</div>

</div>

<div class="status">
● LIVE
</div>

</div>

<div class="note">
⚠️ Use 1 Minute Expiry In Quotex
</div>

<div class="live-price" id="livePrice">
0.0000
</div>

<label class="label">
SELECT PAIR
</label>

<select id="assetSelect" onchange="changePair()">

<option value="BTCUSDT">
BTC/USDT
</option>

<option value="ETHUSDT">
ETH/USDT
</option>

<option value="BNBUSDT">
BNB/USDT
</option>

<option value="SOLUSDT">
SOL/USDT
</option>

<option value="XRPUSDT">
XRP/USDT
</option>

</select>

<div class="pair-card">

<div class="pair-header">

<div class="pair-name" id="pairName">
BTC/USDT
</div>

<div class="toggle active" id="toggleBtn" onclick="toggleSignal()"></div>

</div>

<div class="pair-info">

<div>● Binance Connected</div>
<div>● AI Scanner Active</div>
<div>● Timeframe: 1 Minute</div>

</div>

</div>

<button class="btn" onclick="generateSignal()">
⚡ GENERATE AI SIGNAL
</button>

<div id="scanner">
<div class="scan-line"></div>
</div>

<div id="chartContainer">
<canvas id="candleChart"></canvas>
</div>

<div id="signalBox"></div>

<div class="stats">

<div class="stat">
<h3>RSI</h3>
<p id="rsi">--</p>
</div>

<div class="stat">
<h3>MACD</h3>
<p id="macd">--</p>
</div>

<div class="stat">
<h3>TREND</h3>
<p id="trend">--</p>
</div>

<div class="stat">
<h3>CONF</h3>
<p id="conf">--</p>
</div>

</div>

</div>

<script>

let pair = 'BTCUSDT';
let signalActive = true;
let chart;
let liveCandles = [];

function login(){

let pass =
document.getElementById('password').value;

if(pass === 'Lubna786'){

document.getElementById('loginScreen')
.style.display='none';

document.getElementById('mainBoard')
.style.display='block';

startWebSocket();

}else{

alert('Wrong Password');

}

}

function changePair(){

pair =
document.getElementById('assetSelect').value;

document.getElementById('pairName')
.innerText =
pair.replace('USDT','/USDT');

startWebSocket();

}

function toggleSignal(){

signalActive = !signalActive;

document.getElementById('toggleBtn')
.classList.toggle('active');

}

async function startWebSocket(){

if(window.ws){
window.ws.close();
}

liveCandles = [];

try{

let response = await fetch(
`https://api.binance.com/api/v3/klines?symbol=${pair}&interval=1m&limit=50`
);

let data = await response.json();

liveCandles = data.map((candle,index)=>({

x:index,

o:parseFloat(candle[1]),

h:parseFloat(candle[2]),

l:parseFloat(candle[3]),

c:parseFloat(candle[4])

}));

drawChart();

}catch(e){

alert('Failed To Load Market');

}

window.ws = new WebSocket(
`wss://stream.binance.com:9443/ws/${pair.toLowerCase()}@kline_1m`
);

window.ws.onmessage = function(event){

let msg = JSON.parse(event.data);

if(!msg.k) return;

let k = msg.k;

document.getElementById('livePrice')
.innerText =
parseFloat(k.c).toFixed(2);

let newCandle = {

x:liveCandles.length,

o:parseFloat(k.o),

h:parseFloat(k.h),

l:parseFloat(k.l),

c:parseFloat(k.c)

};

liveCandles[liveCandles.length - 1] = newCandle;

drawChart();

};

}

function drawChart(){

const ctx =
document.getElementById('candleChart')
.getContext('2d');

if(chart){
chart.destroy();
}

chart = new Chart(ctx,{

type:'candlestick',

data:{

datasets:[{

label:pair,

data:liveCandles,

color:{

up:'#00ff88',

down:'#ff4d67',

unchanged:'#999'

}

}]

},

options:{

responsive:true,

maintainAspectRatio:false,

plugins:{
legend:{display:false}
},

scales:{

x:{
display:false,
grid:{color:'#222'}
},

y:{
ticks:{color:'#888'},
grid:{color:'#222'}
}

}

}

});

}

function calculateEMA(data,period){

let k = 2 / (period + 1);

let ema = [data[0]];

for(let i=1;i<data.length;i++){

ema.push(
data[i] * k +
ema[i-1] * (1-k)
);

}

return ema;

}

function calculateRSI(data,period=14){

if(data.length < period+1){
return 50;
}

let gains = 0;
let losses = 0;

for(let i=1;i<=period;i++){

let diff = data[i]-data[i-1];

if(diff >= 0){
gains += diff;
}else{
losses -= diff;
}

}

if(losses === 0){
return 100;
}

let rs = gains / losses;

return 100 - (100/(1+rs));

}

function generateSignal(){

if(!signalActive){

alert('Signal OFF');

return;

}

if(liveCandles.length < 10){

alert('Market Loading...');

return;

}

document.getElementById('scanner')
.style.display='block';

document.getElementById('signalBox')
.style.display='none';

setTimeout(()=>{

document.getElementById('scanner')
.style.display='none';

document.getElementById('signalBox')
.style.display='block';

let closes =
liveCandles.map(c=>c.c);

let rsi =
calculateRSI(closes);

let ema20 =
calculateEMA(closes,20);

let ema50 =
calculateEMA(closes,50);

let macd =
ema20[ema20.length-1] -
ema50[ema50.length-1];

let buyScore = 0;
let sellScore = 0;

if(rsi < 35){
buyScore += 3;
}

if(rsi > 65){
sellScore += 3;
}

if(macd > 0){
buyScore += 4;
}

if(macd < 0){
sellScore += 4;
}

let signalBox =
document.getElementById('signalBox');

if(buyScore > sellScore){

signalBox.innerHTML='📈 BUY';

signalBox.className='buy-style';

document.getElementById('trend')
.innerText='UP';

}else if(sellScore > buyScore){

signalBox.innerHTML='📉 SELL';

signalBox.className='sell-style';

document.getElementById('trend')
.innerText='DOWN';

}else{

signalBox.innerHTML='⏸ WAIT';

signalBox.className='wait-style';

document.getElementById('trend')
.innerText='SIDE';

}

document.getElementById('rsi')
.innerText=Math.floor(rsi);

document.getElementById('macd')
.innerText=
macd > 0 ? 'BULL' : 'BEAR';

document.getElementById('conf')
.innerText=
Math.floor(Math.random()*15+85)+'%';

let audio = new Audio(
'https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'
);

audio.play();

},1200);

}

</script>

</body>
</html>
