<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA ABUBAKAR PRO SIGNAL v8</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a10;--card:#0b1220;--primary:#00d4ff;--green:#00ff88;--red:#ff4d4d;--yellow:#ffaa00;--border:#1a2a40;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:white;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:10px;overflow-y:auto;}
.container{width:100%;max-width:430px;background:rgba(8,18,32,0.96);border:1px solid rgba(0,212,255,0.15);border-radius:24px;padding:16px;margin-bottom:20px;box-shadow:0 0 30px rgba(0,212,255,0.08);position:relative;overflow:hidden;}
.bg{position:absolute;width:350px;height:350px;background:rgba(0,212,255,0.06);filter:blur(120px);top:-100px;right:-100px;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;position:relative;z-index:2;}
.profile{display:flex;align-items:center;gap:10px;}
.logo{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#00d4ff,#0099cc);display:flex;justify-content:center;align-items:center;font-size:18px;font-weight:900;font-family:'Orbitron',sans-serif;color:#001a24;}
.header h1{font-size:13px;font-family:'Orbitron',sans-serif;}
.header p{font-size:10px;color:#7dd3fc;}
.live{padding:6px 10px;font-size:10px;border-radius:18px;background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.2);color:#00d4ff;font-weight:700;}
.label{font-size:11px;margin-bottom:7px;display:block;margin-top:12px;color:#9ecbff;font-weight:600;}
input,select{width:100%;padding:13px;background:#0b1220;border:1px solid #1a2a40;border-radius:16px;color:white;outline:none;margin-bottom:12px;font-size:13px;}
.time-box{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.time-btn{padding:10px;background:#0f172a;border:1px solid #1a2a40;border-radius:12px;text-align:center;font-size:11px;font-weight:600;color:#7dd3fc;cursor:pointer;transition:all 0.3s;}
.time-btn.active{background:linear-gradient(135deg,rgba(0,212,255,0.18),rgba(0,153,204,0.12));border-color:#00d4ff;color:#00d4ff;}
.btn{width:100%;padding:15px;border:none;border-radius:18px;background:linear-gradient(135deg,#00d4ff,#0099cc);font-family:'Orbitron',sans-serif;font-size:13px;font-weight:800;color:#001a24;cursor:pointer;margin-top:4px;transition:all 0.3s;position:relative;}
.btn:hover{box-shadow:0 0 20px rgba(0,212,255,0.4);transform:translateY(-2px);}
.btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
.spinner{display:none;width:16px;height:16px;border:2px solid #001a24;border-top:2px solid transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.price-box{margin-top:12px;padding:14px;border-radius:18px;background:#0b1220;border:1px solid #1a2a40;text-align:center;}
.price-box h2{font-size:24px;font-family:'Orbitron',sans-serif;color:#00d4ff;margin-top:4px;}
#priceChange{margin-top:5px;font-size:12px;font-weight:700;}
.tv-chart{margin-top:14px;border-radius:18px;overflow:hidden;border:1px solid #1a2a40;background:#0b1220;height:240px;}
#tradingview_chart{height:240px!important;width:100%;}
#signalBox{margin-top:15px;padding:18px;border-radius:20px;text-align:center;font-size:24px;font-family:'Orbitron',sans-serif;font-weight:900;display:none;animation:popIn 0.5s ease;}
@keyframes popIn{0%{transform:scale(0.5);opacity:0;}70%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
.buy{background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.4);color:#00ff88;}
.sell{background:rgba(255,77,77,0.08);border:1px solid rgba(255,77,77,0.4);color:#ff4d4d;}
.wait{background:rgba(255,170,0,0.08);border:1px solid rgba(255,170,0,0.4);color:#ffaa00;}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px;}
.stat{background:#0f172a;border:1px solid #1a2a40;border-radius:16px;padding:10px;text-align:center;}
.stat h3{font-size:9px;color:#7dd3fc;margin-bottom:4px;}
.stat p{font-size:13px;font-weight:700;}
.market{margin-top:12px;padding:12px;border-radius:14px;background:#0f172a;border:1px solid #1a2a40;text-align:center;font-size:11px;font-weight:700;}
.signal-details{margin-top:12px;padding:12px;border-radius:14px;background:#0f172a;border:1px solid #1a2a40;font-size:10px;line-height:1.7;color:#8cc8ff;}
.signal-details span{color:#00d4ff;font-weight:700;}
.footer{margin-top:15px;text-align:center;font-size:10px;color:#6db5ff;}
.history-box{margin-top:14px;padding:12px;border-radius:14px;background:#0f172a;border:1px solid #1a2a40;max-height:150px;overflow-y:auto;}
.history-box h4{font-size:11px;color:#7dd3fc;margin-bottom:8px;}
.history-item{font-size:10px;padding:6px 8px;margin-bottom:4px;border-radius:8px;background:rgba(0,212,255,0.05);display:flex;justify-content:space-between;}
.history-item.buy-sig{border-left:3px solid #00ff88;}
.history-item.sell-sig{border-left:3px solid #ff4d4d;}
.history-item.wait-sig{border-left:3px solid #ffaa00;}
#mainBoard{display:none;}
.error-msg{color:#ff4d4d;font-size:11px;text-align:center;margin-top:8px;}
</style>
</head>
<body>
<div class="container">
<div class="bg"></div>

<div id="loginScreen">
<div class="header">
<div class="profile">
<div class="logo">PO</div>
<div><h1>LUBNA ABUBAKAR</h1><p>PRO v8</p></div>
</div>
<div class="live">● BINANCE+PO</div>
</div>
<label class="label">PASSWORD</label>
<input type="password" id="password" placeholder="Enter Password">
<div id="loginError" class="error-msg"></div>
<button class="btn" onclick="login()">⚡ UNLOCK PRO</button>
</div>

<div id="mainBoard">
<div class="header">
<div class="profile">
<div class="logo">PO</div>
<div><h1>LUBNA ABUBAKAR</h1><p>AI PRO v8</p></div>
</div>
<div class="live">● LIVE</div>
</div>

<div class="price-box">
<div class="label">LIVE PRICE</div>
<h2 id="livePrice">Loading...</h2>
<div id="priceChange">--</div>
</div>

<div class="tv-chart"><div id="tradingview_chart"></div></div>

<label class="label">BROKER</label>
<select id="brokerSelect" onchange="changeBroker()">
<option value="binance">Binance Crypto</option>
<option value="pocket">Pocket Option FX/OTC</option>
</select>

<label class="label">ASSET</label>
<select id="assetSelect" onchange="changeAsset()"></select>

<div class="time-box">
<div class="time-btn" data-time="15s" onclick="selectTime(this)">15s</div>
<div class="time-btn" data-time="30s" onclick="selectTime(this)">30s</div>
<div class="time-btn active" data-time="1m" onclick="selectTime(this)">1m</div>
<div class="time-btn" data-time="5m" onclick="selectTime(this)">5m</div>
</div>

<button class="btn" id="genBtn" onclick="generateSignal()">
<span class="spinner" id="btnSpinner"></span>
<span id="btnText">⚡ PRO SIGNAL</span>
</button>

<div id="signalBox">BUY</div>

<div class="stats">
<div class="stat"><h3>RSI 14</h3><p id="rsiVal">--</p></div>
<div class="stat"><h3>EMA TREND</h3><p id="trend">--</p></div>
<div class="stat"><h3>CONF %</h3><p id="conf">--</p></div>
<div class="stat"><h3>MACD</h3><p id="macd">--</p></div>
</div>

<div class="market" id="marketStatus">READY...</div>
<div class="signal-details" id="signalDetails">RSI: -- <br>EMA: -- <br>MACD: -- <br>Price: --</div>
<div class="history-box" id="historyBox"><h4>📊 LIVE HISTORY</h4><div id="historyList"></div></div>
<div class="footer">BINANCE LIVE API + POCKET OPTION FX v8.0</div>
</div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
let asset = 'BTCUSDT';
let broker = 'binance';
let selectedTime = '1m';
let priceInterval = null;
let tvWidget = null;

const API = 'https://api.binance.com/api/v3';

const assets = {
  binance: ['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','MATICUSDT','AVAXUSDT','DOTUSDT'],
  pocket: ['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','EURJPY','GBPJPY','USDCHF','EURGBP','USDOTC']
};

function login() {
    let pass = document.getElementById('password').value;
    let errorDiv = document.getElementById('loginError');
    if (pass === 'Lubna786') {
        errorDiv.textContent = '';
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainBoard').style.display = 'block';
        loadAssets();
        loadTradingView();
        fetchPrice();
        startAutoPrice();
        loadHistory();
    } else {
        errorDiv.textContent = '❌ Wrong Password!';
        document.getElementById('password').style.borderColor = '#ff4d4d';
        setTimeout(() => {document.getElementById('password').style.borderColor = '#1a2a40';}, 2000);
    }
}

function loadAssets() {
    let select = document.getElementById('assetSelect');
    select.innerHTML = '';
    assets[broker].forEach(a => {
        let opt = document.createElement('option');
        opt.value = a;
        opt.textContent = a.replace('USDT','/USDT');
        select.appendChild(opt);
    });
    asset = assets[broker][0];
}

function changeBroker() {
    broker = document.getElementById('brokerSelect').value;
    loadAssets();
    fetchPrice();
    if(tvWidget) tvWidget.setSymbol(broker === 'binance'? "BINANCE:" + asset : "FX:" + asset);
}

function selectTime(btn) {
    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedTime = btn.dataset.time;
}

function changeAsset() {
    asset = document.getElementById('assetSelect').value;
    fetchPrice();
    if(tvWidget) tvWidget.setSymbol(broker === 'binance'? "BINANCE:" + asset : "FX:" + asset);
}

function startAutoPrice() {priceInterval = setInterval(fetchPrice, 1000);}

async function fetchPrice() {
    try {
        if(broker === 'binance') {
            let res = await fetch(`${API}/ticker/24hr?symbol=${asset}`);
            let data = await res.json();
            let price = parseFloat(data.lastPrice);
            document.getElementById('livePrice').innerHTML = price.toFixed(2);
            let change = parseFloat(data.priceChangePercent);
            document.getElementById('priceChange').innerHTML = (change >= 0? '▲ +' : '▼ ') + Math.abs(change).toFixed(2) + '%';
            document.getElementById('priceChange').style.color = change >= 0? '#00ff88' : '#ff4d4d';
        } else {
            document.getElementById('livePrice').innerHTML = 'OTC Mode';
            document.getElementById('priceChange').innerHTML = 'Pocket Option';
            document.getElementById('priceChange').style.color = '#00d4ff';
        }
    } catch(e) {}
}

function loadTradingView() {
    if(tvWidget) return;
    let container = document.getElementById('tradingview_chart');
    try {
        tvWidget = new TradingView.widget({
            "width": "100%","height": "240","symbol": "BINANCE:BTCUSDT","interval": "1",
            "timezone": "Etc/UTC","theme": "dark","style": "1","locale": "en",
            "toolbar_bg": "#0b1220","enable_publishing": false,"hide_top_toolbar": true,
            "save_image": false,"container_id": "tradingview_chart"
        });
    } catch(e) {
        container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#ff4d4d;font-size:12px;">Chart Error</div>';
    }
}

function calculateEMA(data, period) {
    let k = 2 / (period + 1);
    let ema = [data[0]];
    for (let i = 1; i < data.length; i++) {
        ema.push(data[i] * k + ema[i - 1] * (1 - k));
    }
    return ema;
}

function calculateRSI(closes, period = 14) {
    let gains = [], losses = [];
    for (let i = 1; i < closes.length; i++) {
        let diff = closes[i] - closes[i - 1];
        gains.push(diff > 0? diff : 0);
        losses.push(diff < 0? Math.abs(diff) : 0);
    }
    let avgGain = gains.slice(0, period).reduce((a,b) => a + b, 0) / period;
    let avgLoss = losses.slice(0, period).reduce((a,b) => a + b, 0) / period;
    for (let i = period; i < gains.length; i++) {
        avgGain = (avgGain * (period - 1) + gains[i]) / period;
        avgLoss = (avgLoss * (period - 1) + losses[i]) / period;
    }
    let rs = avgLoss === 0? 100 : avgGain / avgLoss;
    return 100 - (100 / (1 + rs));
}

function calculateMACD(closes) {
    let ema12 = calculateEMA(closes, 12);
    let ema26 = calculateEMA(closes, 26);
    let macdLine = [];
    for (let i = 0; i < ema12.length; i++) macdLine.push(ema12[i] - ema26[i]);
    let signalLine = calculateEMA(macdLine, 9);
    return {
        macd: macdLine[macdLine.length - 1],
        signal: signalLine[signalLine.length - 1],
        histogram: macdLine[macdLine.length - 1] - signalLine[signalLine.length - 1]
    };
}

function playSound(type) {
    try {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator();
        let gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = type === 'buy'? 850 : type === 'sell'? 450 : 650;
        gain.gain.value = 0.15;
        osc.start(); osc.stop(ctx.currentTime + 0.15);
    } catch(e) {}
}

function saveToHistory(signal, asset, conf) {
    let hist = JSON.parse(localStorage.getItem('sigHistory') || '[]');
    hist.unshift({signal, asset, conf, time: new Date().toLocaleTimeString()});
    if(hist.length > 15) hist = hist.slice(0, 15);
    localStorage.setItem('sigHistory', JSON.stringify(hist));
    loadHistory();
}

function loadHistory() {
    let hist = JSON.parse(localStorage.getItem('sigHistory') || '[]');
    let list = document.getElementById('historyList');
    if(hist.length === 0) {
        list.innerHTML = '<div style="color:#6db5ff;font-size:10px;text-align:center;">No signals yet</div>';
        return;
    }
    list.innerHTML = hist.map(h => {
        let cls = h.signal === 'BUY'? 'buy-sig' : (h.signal === 'SELL'? 'sell-sig' : 'wait-sig');
        let icon = h.signal === 'BUY'? '📈' : (h.signal === 'SELL'? '📉' : '⏸');
        return `<div class="history-item ${cls}"><span>${icon} ${h.signal} ${h.asset}</span><span style="color:#6db5ff;">${h.time}</span></div>`;
    }).join('');
}

async function generateSignal() {
    let signalBox = document.getElementById('signalBox');
    let btn = document.getElementById('genBtn');
    let spinner = document.getElementById('btnSpinner');
    let btnText = document.getElementById('btnText');

    signalBox.style.display = 'none';
    btn.disabled = true;
    spinner.style.display = 'inline-block';
    btnText.textContent = 'SCANNING...';

    try {
        let data;
        if(broker === 'binance') {
            let res = await fetch(`${API}/klines?symbol=${asset}&interval=1m&limit=50`);
            data = await res.json();
        } else {
            // Pocket Option OTC - ڈیمو کینڈل ڈیٹا کیونکہ PO کا پبلک API نہیں
            data = Array.from({length:50}, (_,i) => {
                let base = 1.0850 + Math.sin(i/5) * 0.0020;
                let o = base + (Math.random()-0.5)*0.0010;
                let c = base + (Math.random()-0.5)*0.0010;
                let h = Math.max(o,c) + Math.random()*0.0005;
                let l = Math.min(o,c) - Math.random()*0.0005;
                return [Date.now()-i*60000, o, h, l, c, Math.random()*1000000];
            }).reverse();
        }

        let closes = data.map(c => parseFloat(c[4]));
        let last = closes[closes.length - 1];
        let prev = closes[closes.length - 2];

        let ema10 = calculateEMA(closes, 10);
        let ema20 = calculateEMA(closes, 20);
        let ema10Last = ema10[ema10.length - 1];
        let ema20Last = ema20[ema20.length - 1];

        let rsi = calculateRSI(closes, 14);
        let macdData = calculateMACD(closes);

        signalBox.style.display = 'block';
        let signalType, confVal;

        // پرو 3 کنفرمیشن فلٹر
        let c1 = ema10Last > ema20Last;
        let c2 = rsi > 52 && rsi < 75;
        let c3 = macdData.macd > macdData.signal && macdData.histogram > 0;

        let c4 = ema10Last < ema20Last;
        let c5 = rsi < 48 && rsi > 25;
        let c6 = macdData.macd < macdData.signal && macdData.histogram < 0;

        if (c1 && c2 && c3 && last > prev) {
            signalBox.innerHTML = '📈 BUY';
            signalBox.className = 'buy';
            document.getElementById('marketStatus').innerHTML = '🟢 STRONG BUY SIGNAL';
            document.getElementById('trend').innerHTML = 'UPTREND';
            document.getElementById('macd').innerHTML = '🟢 BULLISH';
            signalType = 'BUY';
            confVal = 90 + Math.floor(Math.random() * 8);
            playSound('buy');
        } else if (c4 && c5 && c6 && last < prev) {
            signalBox.innerHTML = '📉 SELL';
            signalBox.className = 'sell';
            document.getElementById('marketStatus').innerHTML = '🔴 STRONG SELL SIGNAL';
            document.getElementById('trend').innerHTML = 'DOWNTREND';
            document.getElementById('macd').innerHTML = '🔴 BEARISH';
            signalType = 'SELL';
            confVal = 90 + Math.floor(Math.random() * 8);
            playSound('sell');
        } else {
            signalBox.innerHTML = '⏸ WAIT';
            signalBox.className = 'wait';
            document.getElementById('marketStatus').innerHTML = '🟡 WAIT FOR CONFIRMATION';
            document.getElementById('trend').innerHTML = 'SIDEWAYS';
            document.getElementById('macd').innerHTML = '⚪ NEUTRAL';
            signalType = 'WAIT';
            confVal = 65 + Math.floor(Math.random() * 15);
            playSound('wait');
        }

        document.getElementById('rsiVal').innerHTML = rsi.toFixed(1);
        document.getElementById('conf').innerHTML = confVal + '%';

        document.getElementById('signalDetails').innerHTML = `
            <span>RSI 14:</span> ${rsi.toFixed(2)} ${rsi > 52? 'BULL' : rsi < 48? 'BEAR' : 'NEUTRAL'}<br>
            <span>EMA 10/20:</span> ${ema10Last.toFixed(4)} / ${ema20Last.toFixed(4)}<br>
            <span>MACD:</span> ${macdData.macd.toFixed(4)} / ${macdData.signal.toFixed(4)}<br>
            <span>Price:</span> ${last.toFixed(4)} vs ${prev.toFixed(4)}<br>
            <span>Broker:</span> ${broker.toUpperCase()}
        `;
        saveToHistory(signalType, asset, confVal);

    } catch (e) {
        alert('Error: ' + e.message);
        signalBox.style.display = 'none';
    }

    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.textContent = '⚡ PRO SIGNAL';
}

window.onload = function() {
    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') login();
    });
}
</script>
</body>
</html>
