<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI TRADING BOT - V15.6 GOLDEN LIVE</title>
    <style>
        :root {
            --yellow: #ffcc00;
            --yellow-glow: rgba(255, 204, 0, 0.3);
            --bg: #000000;
            --card-bg: #0a0a0a;
            --green: #00ff99;
            --red: #ff4757;
            --border: rgba(255, 204, 0, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; overflow: hidden; }

        /* LOGIN SCREEN */
        .auth-container { display: flex; flex-direction: column; width: 100%; max-width: 380px; background: var(--card-bg); border: 2px solid var(--border); border-radius: 35px; padding: 30px; box-shadow: 0 0 35px var(--yellow-glow); text-align: center; }
        .auth-container h1 { color: #fff; font-size: 22px; margin-bottom: 20px; text-shadow: 0 0 10px var(--yellow); letter-spacing: 1px; }
        .auth-input { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 15px; background: #000; border: 1px solid var(--yellow); color: #fff; text-align: center; font-weight: bold; outline: none; font-size: 16px; }

        /* MAIN BOT PANEL */
        .bot-container { display: none; flex-direction: column; width: 100%; max-width: 380px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 35px; padding: 22px; box-shadow: 0 0 40px rgba(255, 204, 0, 0.15); }
        .bot-header { color: var(--yellow); font-size: 18px; text-align: center; font-weight: 800; text-shadow: 0 0 8px var(--yellow-glow); margin-bottom: 18px; text-transform: uppercase; letter-spacing: 1px; }

        .field-group { display: flex; flex-direction: column; margin-bottom: 12px; }
        .field-group label { color: #888888; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; margin-left: 5px; }
        select { width: 100%; padding: 14px; border-radius: 15px; background: #000; border: 1px solid var(--border); color: #fff; font-weight: 600; outline: none; font-size: 14px; }
        select:focus { border-color: var(--yellow); }

        /* LIVE FEED TICKER STATUS */
        .algo-radar { background: #000; border: 1px solid var(--border); padding: 12px 15px; border-radius: 15px; font-size: 11px; color: #666666; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .radar-pulse { width: 8px; height: 8px; background: #444444; border-radius: 50%; }
        .scanning .radar-pulse { background: var(--yellow); animation: radarBlink 0.5s infinite; box-shadow: 0 0 8px var(--yellow); }
        .live-connected .radar-pulse { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
        @keyframes radarBlink { 50% { opacity: 0.2; } }

        /* RECTANGLE ACTION BUTTON (BLACK & YELLOW STYLE) */
        .action-wrapper { margin-top: 5px; margin-bottom: 15px; }
        .get-signal-btn {
            width: 100%; padding: 16px; border-radius: 15px; border: none;
            background: linear-gradient(135deg, #e0b300, var(--yellow));
            color: #000; font-weight: 800; font-size: 15px; letter-spacing: 1px;
            cursor: pointer; text-transform: uppercase; transition: 0.3s;
            box-shadow: 0 0 15px var(--yellow-glow);
        }
        .get-signal-btn:active { transform: scale(0.97); }
        .get-signal-btn:disabled { background: #1a1a1a; color: #444444; border: 1px solid #222; box-shadow: none; }

        /* OUTPUT PANEL */
        .signal-display-box { display: none; background: rgba(0,0,0,0.6); border: 1px solid var(--border); border-radius: 20px; padding: 15px; text-align: center; margin-top: 5px; }
        .sig-alert-text { font-size: 30px; font-weight: 900; margin: 4px 0; }
        .up-style { color: var(--green); text-shadow: 0 0 15px rgba(0,255,153,0.3); }
        .down-style { color: var(--red); text-shadow: 0 0 15px rgba(255,71,87,0.3); }
        .timer-countdown { font-size: 12px; color: #fff; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

<div class="auth-container" id="authScreen">
    <h1>AI BOT SYSTEM</h1>
    <input type="text" id="botPass" class="auth-input" placeholder="ENTER SYSTEM KEY">
    <button onclick="handleLogin()" style="width:100%; padding:16px; border-radius:50px; background:linear-gradient(90deg, #e0b300, var(--yellow)); border:none; font-weight:900; color:#000; cursor:pointer;">VALIDATE ACCESS</button>
</div>

<div class="bot-container" id="mainBotScreen">
    <div class="bot-header">Sureshot AI Bot Live</div>

    <div class="field-group">
        <label>Select Platform</label>
        <select id="platformOpt">
            <option value="QUOTEX">QUOTEX PLATFORM</option>
            <option value="POCKET">POCKET OPTION</option>
        </select>
    </div>

    <div class="field-group">
        <label>Select Asset (Live Connection)</label>
        <select id="assetOpt" onchange="initLiveStream()">
            <option value="btcusdt">BTC/USDT (LIVE MARKET)</option>
            <option value="ethusdt">ETH/USDT (LIVE MARKET)</option>
            <option value="xrpusdt">XRP/USDT (LIVE MARKET)</option>
            <option value="solusdt">SOL/USDT (LIVE MARKET)</option>
        </select>
    </div>

    <div class="field-group">
        <label>Select Expiry Time</label>
        <select id="expiryOpt">
            <option value="1M">1 MINUTE</option>
            <option value="5M">5 MINUTES</option>
        </select>
    </div>

    <div class="algo-radar" id="algoRadar">
        <span id="indicatorsText">Connecting Live Pulse...</span>
        <div class="radar-pulse"></div>
    </div>

    <div class="action-wrapper">
        <button class="get-signal-btn" id="sigBtn" onclick="processLiveIndicators()">Get Live Signal</button>
    </div>

    <div class="signal-display-box" id="signalBox">
        <div style="color: #888888; font-size: 10px; font-weight: bold; letter-spacing: 0.5px;">LIVE SURESHOT ENGINE</div>
        <div class="sig-alert-text" id="signalResult">---</div>
        <div class="timer-countdown" id="timerDisplay">READY</div>
    </div>
</div>

<script>
    let soundEngine = null;
    let ws = null;
    let currentLivePrice = 0;
    let priceHistory = [];

    function handleLogin() {
        const key = document.getElementById('botPass').value.trim();
        if(key.toLowerCase() === "pak786") {
            document.getElementById('authScreen').style.display = "none";
            document.getElementById('mainBotScreen').style.display = "flex";
            soundEngine = new (window.AudioContext || window.webkitAudioContext)();
            initLiveStream(); // Start Live WebSocket Connection
        } else {
            alert("Wrong Key! Access Blocked.");
        }
    }

    // BINANCE LIVE WEBSOCKET CONNECTION
    function initLiveStream() {
        if(ws) { ws.close(); }
        const asset = document.getElementById('assetOpt').value;
        const logText = document.getElementById('indicatorsText');
        const radar = document.getElementById('algoRadar');
        
        radar.className = "algo-radar";
        logText.innerText = `Connecting to Binance ${asset.toUpperCase()}...`;
        logText.style.color = "#888888";

        ws = new WebSocket(`wss://stream.binance.com:9443/ws/${asset}@ticker`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            currentLivePrice = parseFloat(data.c); 
            radar.className = "algo-radar live-connected";
            logText.innerText = `Live Price: $${currentLivePrice.toFixed(2)}`;
            logText.style.color = "#ffffff";
            
            priceHistory.push(currentLivePrice);
            if(priceHistory.length > 20) priceHistory.shift();
        };

        ws.onerror = () => {
            logText.innerText = "Connection Error! Retrying...";
            logText.style.color = "#ff4757";
        };
    }

    // LIVE MATHEMATICAL RSI & MA COMPUTATION ENGINE
    async function processLiveIndicators() {
        const btn = document.getElementById('sigBtn');
        const radar = document.getElementById('algoRadar');
        const logText = document.getElementById('indicatorsText');
        const outBox = document.getElementById('signalBox');
        const sigRes = document.getElementById('signalResult');
        const timerDisp = document.getElementById('timerDisplay');

        if(priceHistory.length < 5) {
            alert("Please wait 3 seconds for Live Market Data compilation.");
            return;
        }

        btn.disabled = true;
        radar.className = "algo-radar scanning";
        outBox.style.display = "none";
        
        logText.innerText = "CALCULATING LIVE MOVING AVERAGE (MA)...";
        logText.style.color = "#ffcc00";
        await new Promise(r => setTimeout(r, 1500));
        
        logText.innerText = "EXTRACTING LIVE RSI MOMENTUM...";
        await new Promise(r => setTimeout(r, 1500));

        const sum = priceHistory.reduce((a, b) => a + b, 0);
        const avgPrice = sum / priceHistory.length;

        let liveRsi = 50 + ((currentLivePrice - avgPrice) / avgPrice) * 1000;
        liveRsi = Math.max(15, Math.min(85, liveRsi)); 

        radar.className = "algo-radar live-connected";
        btn.disabled = false;
        outBox.style.display = "block";
        logText.style.color = "#ffffff";

        if (currentLivePrice < avgPrice || liveRsi < 45) {
            sigRes.innerText = "🟢 BUY / UP";
            sigRes.className = "sig-alert-text up-style";
            logText.innerText = `RSI: ${liveRsi.toFixed(1)} (Oversold) | Trend: BULLISH`;
            triggerAudioTone(true);
        } else {
            sigRes.innerText = "🔴 CALL / DOWN";
            sigRes.className = "sig-alert-text down-style";
            logText.innerText = `RSI: ${liveRsi.toFixed(1)} (Overbought) | Trend: BEARISH`;
            triggerAudioTone(false);
        }

        let countdown = 5;
        const interval = setInterval(() => {
            timerDisp.innerText = "PREPARE QUOTEX ENTRY: " + countdown + "s";
            timerDisp.style.color = "#fff";
            countdown--;
            if(countdown < 0) {
                clearInterval(interval);
                timerDisp.innerText = "✅ EXECUTE 1-MIN TRADE NOW!";
                timerDisp.style.color = "#00ff99";
            }
        }, 1000);
    }

    function triggerAudioTone(isUpTrend) {
        if(!soundEngine) return;
        let oscillator = soundEngine.createOscillator();
        let gainNode = soundEngine.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(soundEngine.destination);
        oscillator.frequency.setValueAtTime(isUpTrend ? 1200 : 420, soundEngine.currentTime);
        gainNode.gain.setValueAtTime(0.1, soundEngine.currentTime);
        oscillator.start(); oscillator.stop(soundEngine.currentTime + 0.25);
    }
</script>
</body>
</html>
