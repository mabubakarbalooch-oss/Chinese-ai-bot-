<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ABU BAKAR TRADER - TIGER ELITE AI BOT</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

*{ margin:0; padding:0; box-sizing:border-box; font-family:'Rajdhani', sans-serif; }
body{ background:#02060c; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:10px; color:#e2e8f0; overflow-x:hidden; }

/* --- GLASSY PREMIUM PANEL --- */
.bot-container{
width:100%; max-width:440px; 
background: rgba(15, 20, 30, 0.7);
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 35px; padding: 25px;
box-shadow: 0 0 30px rgba(0, 255, 255, 0.2), inset 0 0 15px rgba(255,255,255,0.05);
backdrop-filter: blur(20px);
position:relative; display:none;
}

/* --- LOCK SCREEN --- */
.lock-screen{ position:fixed; top:0; left:0; width:100%; height:100%; background:#02050a; display:flex; justify-content:center; align-items:center; z-index:9999; }
.lock-box{ width:90%; max-width:350px; background:#050d1a; border:1px solid #C0C0C0; border-radius:22px; padding:25px; text-align:center; box-shadow:0 0 20px rgba(192, 192, 192, 0.3); }
.lock-title{ font-family:'Orbitron',sans-serif; font-size:20px; color:#C0C0C0; margin-bottom:15px; font-weight:900; text-shadow: 0 0 10px #C0C0C0; }
.lock-input{ width:100%; padding:12px; border:1px solid #444; border-radius:10px; background:#020710; color:#fff; text-align:center; margin-bottom:15px; outline:none; }
.lock-btn{ width:100%; padding:12px; border:none; border-radius:10px; background:#C0C0C0; color:#000; font-weight:bold; cursor:pointer; }

/* --- HEADER SECTION --- */
.bot-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:15px; }
.brand-wrapper { display:flex; align-items:center; gap:15px; }
.avatar-ring{ width:60px; height:60px; border-radius:50%; border:2px solid #C0C0C0; box-shadow:0 0 20px #00d4ff; overflow:hidden; }
.avatar-ring img{ width:100%; height:100%; object-fit:cover; }
.title-main{ font-family:'Orbitron', sans-serif; font-size:18px; font-weight:900; color:#fff; }
.title-sub{ font-size:12px; letter-spacing:2px; color:#C0C0C0; }

/* --- ASSET DROPDOWN --- */
.selector-row{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:15px; padding:12px; margin-bottom:15px; display:flex; gap:10px; }
.dropdown-control{ flex:1; background:transparent; border:none; color:#fff; font-size:14px; }

/* --- LIVE VIEWPORT --- */
.live-viewport{ background:rgba(0,0,0,0.4); border:1px solid rgba(255, 255, 255, 0.1); border-radius:20px; padding:15px; margin-bottom:15px; }
.live-price{ font-family:'Orbitron',monospace; font-size:38px; font-weight:900; color:#00ff9d; text-shadow:0 0 15px #00ff9d; margin-bottom:10px; }
.spark-candles{ height:100px; display:flex; align-items:flex-end; gap:3px; overflow:hidden; }
.spark-bar{ flex:1; border-radius:2px; }
.spark-bar.up{ background:#00ff9d; }
.spark-bar.down{ background:#ff3b3b; }

/* --- TRIGGER BUTTON --- */
.trigger-action-btn{
width:100%; padding:16px; border:1px solid rgba(255,255,255,0.2); border-radius:15px;
background:rgba(255,255,255,0.05); color:#fff;
font-family:'Orbitron', sans-serif; font-size:14px; font-weight:900;
cursor:pointer; box-shadow:0 0 20px rgba(255,255,255,0.1);
}

/* --- SIGNAL OUTPUT --- */
.signal-txt-output{ font-family:'Orbitron',sans-serif; font-size:52px; font-weight:900; margin-top:10px; }
.signal-txt-output.buy{ color:#00ff9d; text-shadow:0 0 30px #00ff9d; }
.signal-txt-output.sell{ color:#ff3b3b; text-shadow:0 0 30px #ff3b3b; }

/* --- TELEMETRY --- */
.telemetry-matrix{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px; }
.matrix-node{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:10px 15px; font-size:12px; color:#fff; }
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <div class="lock-title">TIGER ELITE AI TERMINAL</div>
    <input type="password" id="terminalAccessKey" class="lock-input" placeholder="ENTER ACCESS KEY">
    <button class="lock-btn" onclick="unlockTerminalEngine()">CONNECT BOT</button>
  </div>
</div>

<div class="bot-container" id="botApp">
  <div class="bot-header">
    <div class="brand-wrapper">
      <div class="avatar-ring">
        <img src="https://cdn-icons-png.flaticon.com/512/3670/3670151.png" alt="Logo">
      </div>
      <div>
        <div class="title-main">ABU BAKAR TRADER</div>
        <div class="title-sub">TIGER ELITE AI BOT</div>
      </div>
    </div>
  </div>

  <div class="selector-row">
    <select class="dropdown-control" id="assetSelect"><option>USD/BRL OTC</option></select>
    <select class="dropdown-control"><option>1M (Stable)</option></select>
  </div>

  <div class="live-viewport">
    <div class="live-price" id="liveTickerPrice">1.2476</div>
    <div class="spark-candles" id="chartCandlesContainer"></div>
  </div>

  <button class="trigger-action-btn" id="analyzeBtn" onclick="runMarketAnalysisSequence()">
    ⚡ ANALYZER MARKET (GET SIGNAL)
  </button>

  <div class="core-signal-block" style="text-align:center; margin-top:20px;">
    <div class="signal-txt-output wait" id="signalOutput">WAIT</div>
    <div class="confidence-lbl" id="accuracyOutput" style="color:#C0C0C0; margin-top:5px;">READY TO SCAN</div>
  </div>

  <div class="telemetry-matrix">
    <div class="matrix-node">RSI (14): 70</div>
    <div class="matrix-node" style="color:#00ff9d;">TREND: STRONG UP</div>
  </div>
</div>

<script>
function unlockTerminalEngine(){
    if(document.getElementById("terminalAccessKey").value === "bakar786"){
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("botApp").style.display = "block";
        generateCandles();
    }
}
function generateCandles(){
    const cont = document.getElementById("chartCandlesContainer");
    for(let i=0; i<30; i++){
        let bar = document.createElement("div");
        bar.className = "spark-bar " + (Math.random()>0.5 ? "up" : "down");
        bar.style.height = (Math.random()*60+20) + "px";
        cont.appendChild(bar);
    }
}
function runMarketAnalysisSequence(){
    const out = document.getElementById("signalOutput");
    out.innerText = "BUY";
    out.className = "signal-txt-output buy";
    document.getElementById("accuracyOutput").innerText = "92% CONFIDENCE MATCH";
}
</script>

</body>
</html>
