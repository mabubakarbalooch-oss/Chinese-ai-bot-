<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lubna Abubakar - Advanced AI Signal Bot</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.8);
            --border-color: rgba(236, 72, 153, 0.3);
            --primary-pink: #ec4899;
            --primary-gold: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at top, #1f1135 0%, var(--bg-color) 70%);
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(236, 72, 153, 0.15);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        .bot-title h2 {
            font-size: 16px;
            color: var(--primary-pink);
            letter-spacing: 1px;
        }

        .bot-title p {
            font-size: 11px;
            color: var(--primary-gold);
            font-weight: bold;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #10b981;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        select {
            width: 100%;
            background: rgba(31, 41, 55, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            transition: 0.3s;
        }

        select:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.3);
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-pink), var(--primary-gold));
            color: white;
            border: none;
            padding: 13px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
        }

        .generate-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .signal-display {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
        }

        .signal-result {
            font-size: 26px;
            font-weight: 900;
            margin: 8px 0;
            letter-spacing: 2px;
        }

        .signal-up {
            color: #10b981;
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        .signal-down {
            color: #ef4444;
            text-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
        }

        .indicators-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 12px;
            text-align: left;
        }

        .ind-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 10px;
        }

        .ind-box span {
            display: block;
            color: var(--text-muted);
        }

        .ind-box strong {
            color: var(--primary-gold);
            font-size: 11px;
        }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .metric-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 8px;
            border-radius: 8px;
            font-size: 11px;
        }

        .metric-box span {
            display: block;
            color: var(--text-muted);
        }

        .metric-box strong {
            color: var(--primary-gold);
            font-size: 13px;
        }

        .loader {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: var(--primary-pink);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="bot-title">
                <h2>LUBNA ABUBAKAR</h2>
                <p>PAK AI SIGNAL X</p>
            </div>
            <div class="status-badge">ONLINE</div>
        </div>

        <div class="form-group">
            <label>Broker</label>
            <select id="broker">
                <option value="Quotex">Quotex</option>
            </select>
        </div>

        <div class="form-group">
            <label>Quotex Currency / OTC Pairs</label>
            <select id="pair">
                <option value="NZD/USD (OTC)">NZD/USD (OTC)</option>
                <option value="EUR/USD (OTC)">EUR/USD (OTC)</option>
                <option value="GBP/USD (OTC)">GBP/USD (OTC)</option>
                <option value="AUD/CAD (OTC)">AUD/CAD (OTC)</option>
                <option value="USD/JPY (OTC)">USD/JPY (OTC)</option>
                <option value="EUR/JPY (OTC)">EUR/JPY (OTC)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Timer / Expiry</label>
            <select id="timer">
                <option value="1 Minute">1 Minute</option>
                <option value="5 Seconds">5 Seconds</option>
                <option value="5 Minutes">5 Minutes</option>
            </select>
        </div>

        <button class="generate-btn" onclick="generateSignal()">Generate Signal</button>

        <div class="loader" id="loader">Analyzing RSI, EMA, SMA, MACD & BB...</div>

        <div class="signal-display" id="signalDisplay">
            <div style="font-size: 11px; color: var(--text-muted);">AI ANALYSIS RESULT</div>
            <div class="signal-result" id="signalText">--</div>
            
            <div class="indicators-grid">
                <div class="ind-box">
                    <span>RSI (14)</span>
                    <strong id="rsiVal">--</strong>
                </div>
                <div class="ind-box">
                    <span>EMA Trend</span>
                    <strong id="emaVal">--</strong>
                </div>
                <div class="ind-box">
                    <span>SMA Crossover</span>
                    <strong id="smaVal">--</strong>
                </div>
                <div class="ind-box">
                    <span>MACD Hist</span>
                    <strong id="macdVal">--</strong>
                </div>
                <div class="ind-box" style="grid-column: span 2;">
                    <span>Bollinger Bands</span>
                    <strong id="bbVal">--</strong>
                </div>
            </div>

            <div class="metrics">
                <div class="metric-box">
                    <span>Accuracy Rate</span>
                    <strong id="accuracy">--</strong>
                </div>
                <div class="metric-box">
                    <span>Signal Strength</span>
                    <strong id="strength">HIGH</strong>
                </div>
            </div>
        </div>
    </div>

    <script>
        function generateSignal() {
            const loader = document.getElementById('loader');
            const signalDisplay = document.getElementById('signalDisplay');
            const signalText = document.getElementById('signalText');
            
            const rsiVal = document.getElementById('rsiVal');
            const emaVal = document.getElementById('emaVal');
            const smaVal = document.getElementById('smaVal');
            const macdVal = document.getElementById('macdVal');
            const bbVal = document.getElementById('bbVal');
            const accuracy = document.getElementById('accuracy');

            signalDisplay.style.display = 'none';
            loader.style.display = 'block';

            setTimeout(() => {
                loader.style.display = 'none';
                signalDisplay.style.display = 'block';

                // 5 Indicators Simulation logic
                const isUp = Math.random() >= 0.5;
                
                if (isUp) {
                    signalText.className = 'signal-result signal-up';
                    signalText.innerText = 'UP (CALL)';
                    rsiVal.innerText = '64.2 (Bullish)';
                    emaVal.innerText = 'BULLISH';
                    smaVal.innerText = 'Cross Above';
                    macdVal.innerText = '+0.0014';
                    bbVal.innerText = 'Lower Band Bounce';
                } else {
                    signalText.className = 'signal-result signal-down';
                    signalText.innerText = 'DOWN (PUT)';
                    rsiVal.innerText = '32.8 (Bearish)';
                    emaVal.innerText = 'BEARISH';
                    smaVal.innerText = 'Cross Below';
                    macdVal.innerText = '-0.0018';
                    bbVal.innerText = 'Upper Band Rejection';
                }

                const randomAcc = (95 + Math.random() * 4.5).toFixed(1);
                accuracy.innerText = randomAcc + '%';

            }, 2000);
        }
    </script>
</body>
</html>
