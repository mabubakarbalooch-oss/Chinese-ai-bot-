<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Generator</title>
<style>
body{
background:#0d1117;
min-height:100vh;
margin:0;
font-family:Arial, sans-serif;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
}

.login-screen{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#0d1117;
display:flex;
justify-content:center;
align-items:center;
}

.login-box{
background:#1e2329;
border:1px solid #00ff88;
border-radius:18px;
padding:30px 25px;
width:90%;
max-width:360px;
text-align:center;
}

.login-box h2{color:#00ff88;margin-bottom:12px;font-size:22px;}
.login-box p{color:#8b949e;font-size:14px;margin-bottom:20px;}
.login-box input{
width:100%;
padding:15px;
background:#0d1117;
border:1px solid #30363d;
border-radius:12px;
color:#fff;
font-size:16px;
margin-bottom:18px;
text-align:center;
outline:none;
box-sizing:border-box;
}
.login-box button{
width:100%;
padding:15px;
background:#00ff88;
border:none;
border-radius:12px;
color:#000;
font-size:16px;
font-weight:700;
cursor:pointer;
}
.error{color:#ff4444;font-size:13px;margin-top:12px;display:none;}

.container{
width:100%;
max-width:450px;
display:none;
padding:15px;
box-sizing:border-box;
}
.card{
background:#161b22;
border:1px solid #00ff88;
border-radius:16px;
padding:20px;
text-align:center;
}
.gen-btn{
width:100%;
padding:14px;
background:#00ff88;
border:none;
border-radius:12px;
color:#000;
font-size:15px;
font-weight:700;
cursor:pointer;
margin-top:15px;
}
</style>
</head>
<body>

<!-- Password Screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2>🔒 Access Locked</h2>
    <p>Password enter karein board kholne ke liye</p>
    <input type="password" id="passwordInput" placeholder="••••">
    <button onclick="checkPassword()">Unlock</button>
    <div class="error" id="errorMsg">Wrong Password!</div>
  </div>
</div>

<!-- Main Board -->
<div class="container" id="mainBoard">
  <div class="card">
    <h3 style="color:#00ff88;">Board Unlock Ho Gaya ✅</h3>
    <p style="color:#8b949e;">Ab yahan aapka signal wala hisa aayega</p>
    <button class="gen-btn" onclick="alert('Signal Generate ho gaya!')">GENERATE SIGNAL</button>
  </div>
</div>

<script>
const correctPassword = "bakar786";

function checkPassword(){
  let input = document.getElementById('passwordInput').value.trim();
  
  if(input === correctPassword){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainBoard').style.display = 'block';
  } else {
    document.getElementById('errorMsg').style.display = 'block';
    document.getElementById('passwordInput').value = '';
  }
}

document.getElementById('passwordInput').addEventListener('keypress', function(e){
  if(e.key === 'Enter'){
    checkPassword();
  }
});
</script>

</body>
</html>
