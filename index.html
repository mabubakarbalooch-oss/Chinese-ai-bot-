<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTIMATE LIVE AI TRADING SYSTEM</title>

<style>
body{
margin:0;
background:#040816;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:white;
}

.panel{
width:520px;
background:rgba(8,12,25,0.96);
border:1px solid rgba(255,255,255,0.08);
border-radius:18px;
padding:15px;
box-shadow:0 0 50px rgba(0,0,0,0.9);
}

.title{
text-align:center;
font-weight:bold;
color:#ffaa00;
letter-spacing:1px;
}

select,button{
width:100%;
padding:10px;
margin-top:8px;
border-radius:10px;
border:none;
background:#0b1b35;
color:white;
}

.price{
text-align:center;
font-size:32px;
font-family:monospace;
margin:10px 0;
color:#00e5ff;
}

canvas{
background:#050b16;
border-radius:12px;
margin-top:10px;
}

.signal{
text-align:center;
font-size:44px;
margin-top:10px;
font-weight:bold;
}

.buy{color:#00e676;text-shadow:0 0 18px #00e676;}
.sell{color:#ff3b3b;text-shadow:0 0 18px #ff3b3b;}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:10px;
}

.box{
background:rgba(255,255,255,0.03);
padding:8px;
border-radius:10px;
font-size:12px;
border:1px solid rgba(255,255,255,0.06);
}

.btn{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#ff9800,#ff5500);
font-weight:bold;
cursor:pointer;
}

</style>
</head>

<body>

<div class="panel">

<div class="title">ULTIMATE LIVE AI SYSTEM v3</div>

<select id="asset">
<option value="1.2472">USD/BRL</option>
<option value="17.82">USD/MXN</option>
<option value="278.4">USD/PKR</option>
<option value="1.08">EUR/USD</option>
<option value="1.26">GBP/USD</option>
<option value="83.2">USD/INR</option>
</select>

<div class="price" id="price">--</div>

<canvas id="chart" height="160"></canvas>

<button class="btn" onclick="generate()">RUN ULTIMATE AI SIGNAL</button>

<div class="signal" id="sig">WAIT</div>
<div style="text-align:center;color:#aaa" id="conf">READY</div>

<div class="grid">
<div class="box">RSI: <span id="rsi">--</span></div>
<div class="box">TREND: <span id="trend">--</span></div>
<div class="box">EMA9: <span id="ema9">--</span></div>
<div class="box">EMA21: <span id="ema21">--</span></div>
</div>

</div>

<script>

let price=1.2472;
let data=[];

let ctx=document.getElementById("chart").getContext("2d");

function init(){

price=parseFloat(document.getElementById("asset").value);

for(let i=0;i<80;i++){
price+=(Math.random()-0.5)*0.003;
data.push(price);
}

draw();
setInterval(tick,600);
}

document.getElementById("asset").onchange=()=>{
price=parseFloat(document.getElementById("asset").value);
data=[];
init();
};

function tick(){

// SMART MARKET BIAS (not random only)
let shortTrend=(data[data.length-1]-data[data.length-10]||0)*0.3;
let volatility=(Math.random()-0.5)*0.003;

price+=shortTrend+volatility;

data.push(price);
if(data.length>120)data.shift();

document.getElementById("price").innerText=price.toFixed(4);

draw();
}

function draw(){

let c=document.getElementById("chart");
let ctx=c.getContext("2d");

ctx.clearRect(0,0,c.width,c.height);

for(let i=0;i<data.length;i++){
let x=i*(c.width/data.length);
let y=c.height-(data[i]-Math.min(...data))*2000;

ctx.fillStyle=data[i]>data[i-1]?"#00e676":"#ff3b3b";
ctx.fillRect(x,y,2,c.height-y);
}
}

/* RSI */
function RSI(arr){
let g=0,l=0;
for(let i=1;i<arr.length;i++){
let d=arr[i]-arr[i-1];
if(d>0)g+=d; else l-=d;
}
let rs=g/(l||1);
return 100-(100/(1+rs));
}

/* EMA */
function EMA(arr,p){
let k=2/(p+1);
let e=arr[0];
for(let i=1;i<arr.length;i++){
e=arr[i]*k+e*(1-k);
}
return e;
}

/* MOMENTUM */
function momentum(arr){
return arr[arr.length-1]-arr[arr.length-8];
}

function play(sig){
let a=new AudioContext();
let o=a.createOscillator();
o.frequency.value=sig==="BUY"?850:280;
o.connect(a.destination);
o.start();
o.stop(a.currentTime+0.18);
}

function generate(){

let rsi=RSI(data);
let e9=EMA(data,9);
let e21=EMA(data,21);
let mom=momentum(data);

// MULTI LAYER AI SCORE
let score=0;

if(rsi<30)score+=2;
if(rsi>70)score-=2;

if(e9>e21)score+=2;
else score-=2;

if(mom>0)score+=1;
else score-=1;

// extra volatility filter
if(Math.abs(mom)>0.001)score+=1;

let sig="WAIT";

if(score>=3)sig="BUY";
else if(score<=-3)sig="SELL";
else sig=Math.random()>0.5?"BUY":"SELL";

document.getElementById("rsi").innerText=rsi.toFixed(2);
document.getElementById("ema9").innerText=e9.toFixed(4);
document.getElementById("ema21").innerText=e21.toFixed(4);
document.getElementById("trend").innerText=e9>e21?"UP":"DOWN";

document.getElementById("sig").innerText=sig;
document.getElementById("sig").className="signal "+sig.toLowerCase();

document.getElementById("conf").innerText=
"ULTIMATE AI SCORE "+(90+Math.floor(Math.random()*8))+"%";

play(sig);
}

init();

</script>

</body>
</html>
