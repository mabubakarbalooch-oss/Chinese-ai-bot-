<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ABU BAKAR TRADER - Signal Alerts</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* Base reset & fonts */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #02040a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: rgba(10, 15, 30, 0.8);
      border-radius: 28px;
      padding: 25px 30px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 240, 255, 0.15);
      text-align: center;
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 36px;
      color: #00f0ff;
      margin-bottom: 15px;
      text-shadow: 0 0 12px #00f0ff;
      user-select: none;
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      background: linear-gradient(to right, #fff, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .sub {
      font-size: 12px;
      letter-spacing: 3px;
      color: #00f0ff;
      margin-bottom: 30px;
      font-weight: 600;
    }

    select, button {
      width: 100%;
      padding: 14px 0;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0d1326;
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: 0.3s;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%204%205'%3e%3cpath%20fill='none'%20stroke='%23ffffff'%20stroke-width='1'%20d='M0%200l2%202%202-2'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 15px center;
      background-size: 10px 12px;
    }

    select:focus, button:hover {
      border-color: #00f0ff;
      box-shadow: 0 0 10px #00f0ff;
      outline: none;
    }

    .signal-message {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 700;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
      color: #00ff88;
      background: rgba(0, 255, 136, 0.1);
      user-select: none;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.4s, color 0.4s;
    }

    .signal-message.error {
      color: #ff4f6d;
      background: rgba(255, 79, 109, 0.1);
      box-shadow: 0 0 15px rgba(255, 79, 109, 0.6);
    }
  </style>
</head>
<body>

  <main class="container" role="main" aria-label="Trading Signal Interface">
    <div class="logo" aria-hidden="true">ABT</div>
    <h1 class="title">ABU BAKAR TRADER</h1>
    <p class="sub">PRO AI v2.0 - Signal Generator</p>

    <label for="signalSelect" class="sr-only">Select Signal Type</label>
    <select id="signalSelect" aria-describedby="signalDesc">
      <option value="" disabled selected>Select Signal</option>
      <option value="buy">BUY Signal</option>
      <option value="sell">SELL Signal</option>
      <option value="hold">HOLD Signal</option>
      <option value="error">Invalid Signal</option>
    </select>

    <button id="generateBtn" type="button">Generate Signal</button>

    <div id="signalDisplay" class="signal-message" aria-live="polite" aria-atomic="true" role="alert">
      Please select a signal and click "Generate Signal".
    </div>
  </main>

  <script>
    const signalSelect = document.getElementById('signalSelect');
    const generateBtn = document.getElementById('generateBtn');
    const signalDisplay = document.getElementById('signalDisplay');

    generateBtn.addEventListener('click', () => {
      const selected = signalSelect.value;

      if (!selected) {
        signalDisplay.textContent = '⚠️ Please select a signal first.';
        signalDisplay.classList.add('error');
        return;
      }

      let message = '';
      let isError = false;

      switch (selected) {
        case 'buy':
          message = '🟢 BUY Signal: Consider entering a long position.';
          break;
        case 'sell':
          message = '🔴 SELL Signal: Consider exiting or shorting the position.';
          break;
        case 'hold':
          message = '🟡 HOLD Signal: No action recommended currently.';
          break;
        case 'error':
          message = '❌ Invalid signal detected! Please check your data.';
          isError = true;
          break;
        default:
          message = '⚠️ Unknown signal type.';
          isError = true;
      }

      signalDisplay.textContent = message;

      if (isError) {
        signalDisplay.classList.add('error');
      } else {
        signalDisplay.classList.remove('error');
      }
    });
  </script>

  <style>
    /* Screen reader only class */
    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0,0,0,0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
  </style>

</body>
</html>
