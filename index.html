<!DOCTYPE html>
<html>
<head>
<title>Lubna AI Board v3 - LIVE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#050505; color:#FFD700; font-family:Arial; margin:0; padding:10px;}
.container{max-width:600px; margin:auto; background:#111; border:2px solid #FFD700; border-radius:20px; padding:20px;}
h1{text-align:center; color:#FFD700;}
.login-box input{width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #FFD700; background:#000; color:#FFD700;}
.login-btn{width:100%; padding:15px; background:#FFD700; color:#000; font-weight:bold; border:none; border-radius:10px; font-size:18px;}
.tabs{display:flex; justify-content:space-around; margin:20px 0;}
.tab{padding:10px; background:#222; border-radius:10px; cursor:pointer; border:1px solid #FFD700;}
.tab.active{background:#FFD700; color:#000; font-weight:bold;}
.price-box{background:#000; padding:15px; border-radius:10px; text-align:center; margin:15px 0; border:2px solid green;}
.signal-btn{width:100%; padding:20px; font-size:24px; background:#00C851; color:#fff; border:none; border-radius:15px; font-weight:bold;}
.signal{font-size:40px; text-align:center; padding:25px; margin:20px 0; border-radius:15px; font-weight:bold;}
.buy{background:green;} .sell{background:red;} .wait{background:gray;}
.live-dot{color:green; animation: blink 1s infinite;}
@keyframes blink {50% {opacity: 0;}}
</style>
</head>
<body>
<div class="container">
  
  <div id="loginPage">
    <h1>👑 LUBNA AI BOARD 👑</h1>
    <div class="login-box">
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button class="login-btn" onclick="login()">LOGIN KAREN</button>
    </div>
  </div>

  <div id="dashboard" style="display:none;">
    <h1>👑 LUBNA AI BOARD 👑</h1>
    
    <div class="tabs">
      <div class="tab active" onclick="selectMarket('BTCUSDT')">Binance BTC</div>
      <div class="tab" onclick="selectMarket('ETHUSDT')">Binance ETH</div>
      <div class="tab" onclick="selectMarket('EURUSD')">Forex EUR/USD</div>
      <div class="tab" onclick="selectMarket('GBPUSD')">Forex GBP/USD</div>
    </div>

    <div class="price-box">
      <h3 id="marketName">BTC/USDT <span class="live-dot">● LIVE</span></h3>
      <h2 id="livePrice">Loading...</h2>
    </div>

    <button class="signal-btn" onclick="getSignal()">GET STRONG SIGNAL</button>
    <div id="signalResult" class="signal wait">WAIT</div>
    <p>Confidence: <span id="conf">--</span>% | SL: <span id="sl">--</span> | TP: <span id="tp">--</span></p>
  </div>

</div>

<script>
function login(){
  if(document.getElementById('username').value != ""){
    document.getElementById('loginPage').style.display="none";
    document.getElementById('dashboard').style.display="block";
    startLivePrice(); // login کے بعد price شروع
  }
}

let currentSymbol = "BTCUSDT";
function selectMarket(symbol){
  currentSymbol = symbol;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('marketName').innerHTML = symbol + ' <span class="live-dot">● LIVE</span>';
}

// LIVE PRICE کا فنکشن
function startLivePrice(){
  setInterval(() => {
    // Binance API سے Crypto price
    if(currentSymbol.includes("USDT")){
      fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${currentSymbol}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById('livePrice').innerText = "$" + parseFloat(data.price).toFixed(2);
      });
    } 
    // Forex کے لیے Demo price
    else {
      let price = 1.08 + Math.random()*0.01;
      document.getElementById('livePrice').innerText = price.toFixed(5);
    }
  }, 2000); // ہر 2 سیکنڈ بعد اپڈیٹ
}

function getSignal(){
  let s = Math.random() > 0.5 ? "BUY" : "SELL";
  let conf = Math.floor(Math.random()*20)+80;
  document.getElementById('signalResult').className="signal " + s.toLowerCase();
  document.getElementById('signalResult').innerText=s;
  document.getElementById('conf').innerText=conf;
  document.getElementById('sl').innerText="1.5%";
  document.getElementById('tp').innerText="3%";
}
</script>
</body>
</html>
