<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TRADING BOT - ULTRA PREMIUM</title>
    <style>
        :root {
            --gold: #ffca2c;
            --neon: #00f3ff;
            --bg: #030508;
            --card-bg: rgba(20, 24, 30, 0.95);
            --success: #00ff9d;
            --danger: #ff3131;
        }

        body { 
            background: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #030508 100%);
            color: #e0e0e0;
            font-family: 'Orbitron', sans-serif, 'Segoe UI';
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container { width: 100%; max-width: 420px; padding: 15px; }

        .bot-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 35px;
            border: 1px solid rgba(255, 202, 44, 0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(0, 243, 255, 0.05);
            text-align: center;
            position: relative;
        }

        .header-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--gold);
            text-shadow: 0 0 15px rgba(255, 202, 44, 0.4);
            margin-bottom: 5px;
        }

        .status-header {
            font-size: 10px;
            color: var(--neon);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .dot { width: 6px; height: 6px; background: var(--success); border-radius: 50%; box-shadow: 0 0 8px var(--success); }

        select {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            background: #0d1117;
            color: var(--gold);
            border: 1px solid #333;
            margin-bottom: 20px;
            font-size: 14px;
            outline: none;
        }

        #tv-frame { 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.1); 
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .btn-analyze {
            background: linear-gradient(135deg, var(--gold), #ff9900);
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 18px;
            font-weight: 900;
            width: 100%;
            cursor: pointer;
            transition: 0.4s;
            font-size: 16px;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(255, 153, 0, 0.3);
        }

        .btn-analyze:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(255, 153, 0, 0.5); }
        .btn-analyze:disabled { opacity: 0.5; transform: scale(0.98); }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 25px;
            display: none;
            background: rgba(255,255,255,0.03);
            border: 1px dashed rgba(255,255,255,0.1);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .signal-text { font-size: 30px; font-weight: 900; margin: 0; text-shadow: 0 0 20px currentColor; }

        .loader-container { width: 100%; height: 6px; background: #111; border-radius: 10px; margin-top: 20px; display: none; overflow: hidden; }
        .loader-fill { height: 100%; width: 0%; background: var(--neon); box-shadow: 0 0 15px var(--neon); transition: 2s linear; }

        /* Login Styling */
        .login-input {
            width: 85%; padding: 15px; border-radius: 15px; background: #000; border: 1px solid #444; color: var(--gold);
            text-align: center; font-size: 18px; margin-bottom: 20px; outline: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="loginSection" class="bot-card">
        <div style="font-size: 40px; margin-bottom: 10px;">🛡️</div>
        <div class="header-title">SECURITY ACCESS</div>
        <p style="color: #666; font-size: 12px; margin-bottom: 20px;">CHINESE ENCRYPTED SERVER v5.0</p>
        <input type="password" id="passInput" class="login-input" placeholder="ACCESS KEY">
        <button class="btn-analyze" onclick="checkPass()">ACTIVATE SYSTEM</button>
    </div>

    <div id="botContent" style="display: none;">
        <div class="bot-card">
            <div class="status-header"><span class="dot"></span> AI CORE ACTIVE</div>
            <div class="header-title">PREMIUM SIGNALS</div>
            <div id="clock" style="font-size: 12px; color: #555; margin-bottom: 15px;">00:00:00</div>
            
            <select id="assetSelect" onchange="updateChart()">
                <option value="FX_IDC:USDBRL">USD/BRL (OTC)</option>
                <option value="FX_IDC:USDMXN">USD/MXN (OTC)</option>
                <option value="FX_IDC:USDINR">USD/INR (OTC)</option>
                <option value="FX:EURUSD">EUR/USD (OTC)</option>
                <option value="CRYPTOCAP:BTC">BITCOIN (Live)</option>
            </select>

            <iframe id="tv-frame" src="https://s.tradingview.com/widgetembed/?symbol=FX_IDC%3AUSDBRL&interval=1&theme=dark" width="100%" height="250" frameborder="0"></iframe>

            <button id="analyzeBtn" class="btn-analyze" onclick="getSignal()">ANALYZE MARKET</button>
            
            <div id="loader" class="loader-container"><div id="fill" class="loader-fill"></div></div>

            <div id="result">
                <p id="sigText" class="signal-text"></p>
                <div id="accBox" style="font-size: 16px; margin-top: 10px; font-weight: bold;"></div>
                <div id="strategyText" style="font-size: 10px; color: #888; margin-top: 10px; letter-spacing: 1px;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Real-time Clock
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    function checkPass() {
        if(document.getElementById("passInput").value === "Mybot786") {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("botContent").style.display = "block";
        } else {
            alert("ACCESS DENIED!");
        }
    }

    function updateChart() {
        const pair = document.getElementById("assetSelect").value.replace(":", "%3A");
        document.getElementById("tv-frame").src = `https://s.tradingview.com/widgetembed/?symbol=${pair}&interval=1&theme=dark`;
    }

    function getSignal() {
        const res = document.getElementById("result");
        const loader = document.getElementById("loader");
        const fill = document.getElementById("fill");
        const btn = document.getElementById("analyzeBtn");

        btn.disabled = true;
        btn.innerText = "SCANNING DATA...";
        res.style.display = "none";
        loader.style.display = "block";
        fill.style.width = "0%";
        
        setTimeout(() => fill.style.width = "100%", 100);

        setTimeout(function() {
            loader.style.display = "none";
            btn.disabled = false;
            btn.innerText = "ANALYZE MARKET";
            res.style.display = "block";

            const rsi = Math.floor(Math.random() * 100);
            let signal = rsi > 50 ? "↓ PUT / SELL" : "↑ CALL / BUY";
            let color = rsi > 50 ? "var(--danger)" : "var(--success)";
            let strat = rsi > 50 ? "BEARISH MOMENTUM DETECTED" : "BULLISH MOMENTUM DETECTED";
            
            const acc = (Math.random() * (99.2 - 93.5) + 93.5).toFixed(2);
            
            const sigEl = document.getElementById("sigText");
            sigEl.innerText = signal;
            sigEl.style.color = color;
            
            document.getElementById("accBox").innerText = `AI ACCURACY: ${acc}%`;
            document.getElementById("accBox").style.color = color;
            document.getElementById("strategyText").innerText = `STRATEGY: ${strat}`;
            
            res.style.border = `1px solid ${color}`;
            res.style.boxShadow = `0 0 20px ${color}33`;

        }, 2500);
    }
</script>
</body>
</html>
