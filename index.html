<!-- Is code ko pichle code se replace kar dein -->
<script>
    function getSignal() {
        var res = document.getElementById("result");
        var btn = document.querySelector("button:last-of-type");
        
        // Button disable karein taake baar baar click na ho
        btn.disabled = true;
        res.innerHTML = "🔍 SCANNING MARKET VOLATILITY...";
        res.style.color = "#ffc107";

        setTimeout(function() {
            var sigs = ["↑ CALL (UP) 1 MIN", "↓ PUT (DOWN) 1 MIN"];
            var pick = sigs[Math.floor(Math.random() * sigs.length)];
            var accuracy = Math.floor(Math.random() * (95 - 82 + 1) + 82); // 82% to 95% random accuracy
            
            res.innerHTML = pick + "<br><span style='font-size:14px;'>Accuracy: " + accuracy + "%</span>";
            
            if(pick.includes("UP")) {
                res.style.color = "#00ff00";
                res.style.background = "rgba(0, 255, 0, 0.1)";
            } else {
                res.style.color = "#ff4444";
                res.style.background = "rgba(255, 68, 68, 0.1)";
            }

            // Timer Start (60 Seconds)
            startTimer(60);
            
            // Re-enable button after 5 seconds
            setTimeout(() => { btn.disabled = false; }, 5000);
        }, 2000);
    }

    function startTimer(seconds) {
        var timerDisplay = document.createElement("div");
        timerDisplay.id = "timer";
        timerDisplay.style.fontSize = "18px";
        timerDisplay.style.marginTop = "10px";
        document.getElementById("result").appendChild(timerDisplay);

        var timeLeft = seconds;
        var interval = setInterval(function() {
            if(timeLeft <= 0) {
                clearInterval(interval);
                timerDisplay.innerHTML = "EXPIRED";
            } else {
                timerDisplay.innerHTML = "Entry Time Left: " + timeLeft + "s";
            }
            timeLeft -= 1;
        }, 1000);
    }
</script>
