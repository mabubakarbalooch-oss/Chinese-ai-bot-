<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abu Bakar Trader - Tiger Elite AI Bot v3.5</title>
    <style>
        :root {
            --bg-dark: #121212;
            --container-bg: #1A1A1A;
            --accent-gold: #FFC107;
            --accent-orange: #FF5722;
            --text-main: #FFFFFF;
            --text-secondary: #AAAAAA;
            --glow-gold: rgba(255, 193, 7, 0.4);
            --glow-orange: rgba(255, 87, 34, 0.4);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .phone-container {
            width: 375px;
            height: 812px;
            background-color: #000;
            border-radius: 40px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border: 8px solid #222;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 20px;
            padding-top: 50px; /* Space for notches */
        }

        /* --- Header Section with Animated Realistic Tiger --- */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        /* The container that defines the neon circle and holds the avatar */
        .avatar-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--accent-orange);
            box-shadow: 0 0 20px var(--glow-orange);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #000;
        }

        /* The image itself, absolute positioning and default size */
        #tiger-avatar {
            height: 130%; /* Set height, let width be auto for realistic scale */
            width: auto;
            position: absolute;
            object-fit: cover;
            object-position: center;
            transform: translateX(0); /* Default position */
        }

        /* Walking Animation: Moves left, then snaps back right and restarts */
        @keyframes walkCycle {
            0% { transform: translateX(50px); }    /* Start far right, mostly out of view */
            100% { transform: translateX(-50px); } /* Walk far left, mostly out of view */
        }

        /* Assign the animation to the avatar image */
        .avatar-circle #tiger-avatar {
            animation: walkCycle 2.5s infinite linear;
        }

        /* Red glow overlay for the avatar itself */
        .avatar-glow-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, var(--glow-orange) 100%);
            border-radius: 50%;
            pointer-events: none;
        }

        .titles {
            text-align: center;
            margin-top: 15px;
        }

        .main-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-gold);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 10px;
            font-weight: 400;
            color: var(--accent-orange);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- Sub-Header Metrics --- */
        .metrics {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .metric span { font-weight: 700; color: var(--accent-gold); }

        /* --- Input Fields (Selectors) --- */
        .inputs-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .select-input {
            background-color: #111;
            border: 1px solid #333;
            border-radius: 12px;
            color: var(--text-main);
            padding: 16px;
            font-size: 14px;
            appearance: none;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%2024%22%3E%3Cpath%20fill%3D%22%23AAAAAA%22%20d%3D%22M7.41%207.84L12%2012.42l4.59-4.58L18%209.25l-6%206-6-6z%22%2F%3E%3C%2Fsvg%2E');
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 16px;
        }

        /* --- Price Display & Chart --- */
        .chart-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .live-market-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            padding-left: 15px;
            margin-bottom: 5px;
        }
        .live-market-label::before {
            content: '';
            position: absolute;
            left: 0; top: 3px; width: 8px; height: 8px;
            background-color: var(--accent-gold);
            border-radius: 50%;
        }

        .price-display {
            font-size: 36px;
            font-weight: 900;
            color: var(--accent-gold);
            margin-bottom: 15px;
            font-family: 'Roboto Mono', monospace;
        }

        .chart-container {
            width: 100%;
            height: 120px;
            display: flex;
            align-items: flex-end;
            gap: 2px;
        }

        .candle {
            width: 8px;
            border-radius: 2px;
        }
        .candle.up { background-color: var(--accent-gold); height: 50%; }
        .candle.down { background-color: #B01A10; height: 30%; }
        /* Add different heights for realism */
        .c1 { height: 60%; } .c2 { height: 50%; } .c3 { height: 75%; }
        .c4 { height: 40%; } .c5 { height: 65%; }

        /* --- Get Signal Button --- */
        .btn-signal {
            background: linear-gradient(90deg, #E65100 0%, #FF9800 100%);
            border: none;
            border-radius: 12px;
            color: #000;
            padding: 18px;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, box-shadow 0.2s;
            margin-bottom: 25px;
        }
        .btn-signal:active { transform: translateY(1px); }
        .btn-signal:hover { box-shadow: 0 4px 15px rgba(255,152,0,0.4); }

        /* --- Signal Display & Metrics --- */
        .signal-display {
            text-align: center;
        }

        .signal-text {
            font-size: 48px;
            font-weight: 900;
            color: var(--accent-gold);
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px var(--glow-gold);
        }

        .accuracy-text {
            font-size: 18px;
            color: #fff;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }

        .signal-metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            font-size: 11px;
            color: var(--text-secondary);
            text-align: left;
            padding: 0 10px;
        }

        .met-item {
            display: flex;
            justify-content: space-between;
        }
        .met-label { color: #fff; font-weight: 400; }
        .met-val { color: #fff; font-weight: 700; font-family: 'Roboto Mono', monospace; }
        .met-val.green { color: #00E676; }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="phone-container">
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 25px; display: flex; justify-content: space-around; font-size: 12px; color: #fff; z-index: 10;">
            <span>12:31</span>
            <span>LTE</span>
            <span>R</span>
        </div>

        <div class="header">
            <div class="avatar-circle">
                <img src="walking-tiger.png" id="tiger-avatar" alt="Walking Tiger Elite AI">
                <div class="avatar-glow-overlay"></div>
            </div>
            <div class="titles">
                <p class="main-title">Abu Bakar Trader</p>
                <p class="subtitle">Tiger Elite AI Bot v3.5</p>
            </div>
        </div>

        <div class="metrics">
            <div class="metric">SERVER: <span>SECURE</span></div>
            <div class="metric">ACCURACY: <span>93.4%</span></div>
        </div>

        <div class="inputs-group">
            <select class="select-input">
                <option selected>USD/BRL OTC</option>
                <option>EUR/USD OTC</option>
                <option>GBP/USD OTC</option>
            </select>
            <select class="select-input">
                <option selected>15 Seconds (Fast)</option>
                <option>30 Seconds (Medium)</option>
                <option>1 Minute (Stable)</option>
            </select>
        </div>

        <div class="chart-section">
            <div class="live-market-label">Live Market</div>
            <div class="price-display">1.2475</div>
            <div class="chart-container">
                <div class="candle down c1"></div> <div class="candle down c2"></div> <div class="candle up c3"></div> <div class="candle down c4"></div> <div class="candle up c5"></div>
                <div class="candle down c1"></div> <div class="candle down c2"></div> <div class="candle up c3"></div> <div class="candle down c4"></div> <div class="candle up c5"></div>
                <div class="candle down c1"></div> <div class="candle down c2"></div> <div class="candle up c3"></div> <div class="candle down c4"></div> <div class="candle up c5"></div>
                <div class="candle down c1"></div> <div class="candle down c2"></div> <div class="candle up c3"></div> <div class="candle down c4"></div> <div class="candle up c5"></div>
                <div class="candle down c1"></div> <div class="candle down c2"></div> <div class="candle up c3"></div> <div class="candle down c4"></div> <div class="candle up c5"></div>
            </div>
        </div>

        <button class="btn-signal">Analyzer Market (Get Signal)</button>

        <div class="signal-display">
            <div class="signal-text">BUY</div>
            <div class="accuracy-text">93% Accuracy Match</div>
            <div class="signal-metrics-grid">
                <div class="met-item"><span class="met-label">RSI:</span> <span class="met-val green">58</span></div>
                <div class="met-item"><span class="met-label">EMA 9:</span> <span class="met-val">1.2591</span></div>
                <div class="met-item"><span class="met-label">Trend:</span> <span class="met-val green">Strong Up</span></div>
                <div class="met-item"><span class="met-label">EMA 21:</span> <span class="met-val">1.2585</span></div>
                <div class="met-item"><span class="met-label">MACD:</span> <span class="met-val green">Bullish Cross</span></div>
                <div class="met-item"><span class="met-label">ORDER ID:</span> <span class="met-val">000633216733</span></div>
                <div class="met-item"><span class="met-label">Pattern:</span> <span class="met-val green">3 White Soldiers</span></div>
                <div class="met-item"><span class="met-label">TIME:</span> <span class="met-val">12:11:50 AM</span></div>
            </div>
        </div>
    </div>
</body>
</html>
