<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAK AI SIGNAL X - V7.8 SCAN EFFECT</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ background:#000; color:#fff; font-family:sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:10px; }
        .bot-card{ width:100%; max-width:400px; background:#011a0d; border:3px solid #00ff99; border-radius:30px; padding:20px; text-align:center; }
        .header-title{ color:#00ff99; font-size:20px; margin-bottom:12px; font-weight:bold; }
        select, input{ width:100%; padding:12px; border-radius:15px; background:#000; border:1px solid #00ff99; color:#fff; margin-bottom:12px; text-align:center; font-weight:bold; }
        .action-btn{ width:100%; padding:16px; border-radius:40px; border:none; background:linear-gradient(90deg, #008f4a, #00ff99); color:#000; font-weight:900; font-size:15px; cursor:pointer; margin-top:10px; }
        .action-btn:disabled{ background:#555; cursor:not-allowed; }
        #result-box{ display:none; margin-top:15px; padding:15px; border-radius:25px; background:rgba(255,255,255,0.05); border:2px solid #00ff99; }
        .sig-val{ font-size:32px; font-weight:900; margin-top:8px; }
        .detail-text{ font-size:12px; color:#aaa; margin-top:6px; }
        .acc-text{ font-size:11px; background:#00ff99; color:#000; padding:4px 10px; border-radius:8px; font-weight:bold; display:inline-block; }
        
        /* Mini Chart + Scan Effect */
        #mini-chart{ height:160px; margin-bottom:12px; border-radius:15px; overflow:hidden; position:relative; }
        .scan-line{
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:3px;
            background:linear-gradient(90deg, transparent, #00ff99, transparent);
            box-shadow:0 0 10px #00ff99;
            display:none;
            z-index:10;
        }
        .scan-line.active{
            display:block;
            animation: scanMove 1.5s linear infinite;
        }
        @keyframes scanMove{
            0%{ top:0; }
            100%{ top:100%; }
        }
    </style>
</head>
<body>

<div class="bot-card" id="login">
    <h2 class="header-title">PAK AI SIGNAL X</h2>
    <input type="password" id="key" placeholder="Enter Key: Pak786">
    <button class="action-btn" onclick="startApp()">LOGIN</button>
</div>

<div class="bot-card" id="app" style="display:none;">
    <h2 class="header-title">SIGNAL V7.8</h2>
    
    <div id="mini-chart">
        <div class="scan-line" id="scanLine"></div>
    </div>
    
    <select id="pairList" onchange="changeMarket()">
        <option value="EURUSDT">EUR/USDT</option>
        <option value="BTCUSDT">BTC/USDT</option>
        <option value="ETHUSDT">ETH/USDT</option>
    </select>

    <button class="action-btn" id="scanBtn" onclick="runScan()">⚡ SCAN NOW</button>

    <div id="result-box">
        <span class="acc-text" id="accText">READY</span>
        <div class="sig-val" id="sigOutput">WAIT</div>
        <div class="detail-text" id="sigDetails">Press SCAN to get signal</div>
    </div>
</div>

<script>
    let currentPair = "EURUSDT";
    let audioCtx;

    function startApp(){
        if(document.getElementById('key').value === 'Pak786'){
            document.getElementById('login').style.display='none';
            document.getElementById('app').style.display='block';
            loadChart(currentPair);
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } else { 
            alert('غلط Key! صحیح key: Pak786'); 
        }
    }

    function playBeep(type){
        if(!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if(type === "CALL"){
            osc.frequency.value = 1000;
            gain.gain.value = 0.3;
        } else if(type === "PUT"){
            osc.frequency.value = 400;
            gain.gain.value = 0.3;
        }
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    }

    function loadChart(symbol){
        document.getElementById('mini-chart').innerHTML = '<div class="scan-line" id="scanLine"></div>';
        new TradingView.widget({
            "width": "100%",
            "height": 160,
            "symbol": "BINANCE:" + symbol,
            "interval": "1",
            "theme": "dark",
            "style": "1",
            "hide_top_toolbar": true,
            "hide_legend": true,
            "container_id": "mini-chart"
        });
    }

    function changeMarket(){
        currentPair = document.getElementById('pairList').value;
        loadChart(currentPair);
    }

    async function getRealCandles(symbol="EURUSDT"){
        try{
            let url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1m&limit=20`;
            let res = await fetch(url);
            let data = await res.json();
            return data.map(candle => parseFloat(candle[4]));
        } catch(e){
            alert("انٹرنیٹ Error! Connection چیک کریں");
            return [];
        }
    }

    function calculateRSI(prices, period=14){
        let gains=0, losses=0;
        for(let i=1; i<=period; i++){
            let diff = prices[i] - prices[i-1];
            if(diff > 0) gains += diff;
            else losses -= diff;
        }
        let avgGain = gains/period;
        let avgLoss = losses/period;
        if(avgLoss === 0) return 100;
        let rs = avgGain/avgLoss;
        return 100 - (100/(1+rs));
    }

    function calculateMA(prices, period=14){
        let sum = prices.slice(-period).reduce((a,b)=>a+b,0);
        return sum/period;
    }

    async function runScan(){
        let btn = document.getElementById('scanBtn');
        let scanLine = document.getElementById('scanLine');
        
        btn.disabled = true;
        btn.innerText = "🔍 SCANNING...";
        scanLine.classList.add('active'); // Scan line start

        // 1.5 سیکنڈ scan animation چلے گی
        await new Promise(resolve => setTimeout(resolve, 1500));

        let prices = await getRealCandles(currentPair);
        
        scanLine.classList.remove('active'); // Scan line stop

        if(prices.length < 15){
            alert("Data load نہیں ہوا۔ دوبارہ try کریں");
            btn.disabled = false;
            btn.innerText = "⚡ SCAN NOW";
            return;
        }

        let rsi = calculateRSI(prices);
        let ma = calculateMA(prices);
        let lastPrice = prices[prices.length-1];

        let signal, color, detail, accuracy;

        if(rsi < 45 && lastPrice > ma){
            signal = "CALL (UP)";
            color = "#00ff99";
            detail = `RSI: ${rsi.toFixed(2)} | Price: ${lastPrice.toFixed(4)}`;
            accuracy = "CONFIDENCE: 65%";
            playBeep("CALL");
        } else if(rsi > 55 && lastPrice < ma){
            signal = "PUT (DOWN)";
            color = "#ff4444";
            detail = `RSI: ${rsi.toFixed(2)} | Price: ${lastPrice.toFixed(4)}`;
            accuracy = "CONFIDENCE: 65%";
            playBeep("PUT");
        } else {
            signal = "WAIT";
            color = "#ffcc00";
            detail = `RSI: ${rsi.toFixed(2)} Neutral`;
            accuracy = "NO SIGNAL";
        }

        document.getElementById('result-box').style.display = 'block';
        document.getElementById('result-box').style.borderColor = color;
        document.getElementById('sigOutput').innerText = signal;
        document.getElementById('sigOutput').style.color = color;
        document.getElementById('sigDetails').innerText = detail;
        document.getElementById('accText').innerText = accuracy;

        btn.disabled = false;
        btn.innerText = "⚡ SCAN NOW";
    }
</script>

</body>
</html>
