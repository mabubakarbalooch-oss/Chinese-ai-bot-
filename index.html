<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>ABU BAKAR TRADER PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050816;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:6px;
color:white;
overflow:hidden;
}

/* LOGIN */

.login{
width:100%;
max-width:360px;
background:#08111f;
padding:20px;
border-radius:22px;
border:2px solid #00d9ff;
box-shadow:0 0 20px rgba(0,217,255,.3);
text-align:center;
}

.logo{
width:60px;
height:60px;
margin:auto;
margin-bottom:10px;
border-radius:50%;
background:linear-gradient(135deg,#00d9ff,#00ff99);
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
font-weight:900;
color:black;
}

h1{
font-size:22px;
color:#00d9ff;
font-weight:800;
}

.login p{
font-size:10px;
color:#aaa;
margin-top:5px;
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:#0c1728;
color:white;
margin-bottom:10px;
border:1px solid rgba(0,217,255,.2);
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00d9ff,#00ff99);
color:black;
font-size:16px;
font-weight:800;
cursor:pointer;
}

/* APP */

.app{
display:none;
width:100%;
max-width:390px;
background:#08111f;
border:2px solid #00d9ff;
border-radius:22px;
overflow:hidden;
box-shadow:0 0 20px rgba(0,217,255,.3);
}

/* HEADER */

.header{
padding:12px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.05);
}

.header h2{
font-size:20px;
font-weight:800;
color:#00d9ff;
}

.header p{
font-size:9px;
color:#aaa;
margin-top:3px;
}

/* MAIN */

.box{
padding:10px;
}

select{
width:100%;
padding:11px;
border-radius:12px;
border:none;
outline:none;
background:#0c1728;
color:white;
margin-bottom:8px;
border:1px solid rgba(0,217,255,.2);
font-size:12px;
}

/* FLAGS */

.flags{
display:flex;
flex-wrap:wrap;
gap:5px;
margin-bottom:8px;
justify-content:center;
}

.flag{
background:#0d1a2d;
padding:4px 8px;
border-radius:10px;
font-size:9px;
border:1px solid rgba(0,217,255,.2);
}

/* LIVE BOX */

.live-box{
background:#0b1422;
padding:10px;
border-radius:15px;
border:1px solid rgba(255,255,255,.06);
}

.live{
font-size:10px;
color:#00d9ff;
}

.price{
font-size:28px;
font-weight:800;
color:#00ff99;
margin-top:2px;
}

/* CHART */

.chart{
height:110px;
display:flex;
align-items:flex-end;
gap:2px;
margin-top:10px;
overflow:hidden;
}

.candle{
width:5px;
border-radius:5px;
}

.green{
background:#00ff99;
box-shadow:0 0 8px rgba(0,255,153,.5);
}

.red{
background:#ff4757;
box-shadow:0 0 8px rgba(255,71,87,.5);
}

/* RESULT */

.result{
margin-top:10px;
background:#091423;
padding:10px;
border-radius:15px;
border:1px solid rgba(255,255,255,.06);
display:none;
text-align:center;
}

.signal{
font-size:32px;
font-weight:900;
}

.buy{
color:#00ff99;
}

.sell{
color:#ff4757;
}

.wait{
color:#ffaa00;
}

.conf{
font-size:20px;
margin-top:4px;
color:#00d9ff;
font-weight:700;
}

.details{
font-size:10px;
margin-top:8px;
line-height:1.6;
color:#bbb;
}

/* FOOTER */

.footer{
display:flex;
justify-content:space-around;
padding:10px;
border-top:1px solid rgba(255,255,255,.05);
font-size:10px;
color:#00d9ff;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div class="login" id="loginBox">

<div class="logo">AB</div>

<h1>ABU BAKAR TRADER</h1>

<p>PRIVATE FOREX AI BOT</p>

<input type="password"
id="password"
placeholder="ENTER PASSWORD">

<button onclick="login()">

LOGIN

</button>

</div>

<!-- MAIN APP -->

<div class="app" id="app">

<div class="header">

<div class="logo">AB</div>

<h2>ABU BAKAR TRADER</h2>

<p>LIVE FOREX AI SIGNAL BOT</p>

</div>

<div class="box">

<select id="pairSelect">

<option value="usdbrl">🇧🇷 USD/BRL OTC</option>

<option value="usdmxn">🇲🇽 USD/MXN OTC</option>

<option value="usdinr">🇮🇳 USD/INR OTC</option>

<option value="usdpkr">🇵🇰 USD/PKR OTC</option>

<option value="eurusd">🇺🇸 EUR/USD OTC</option>

<option value="gbpusd">🇬🇧 GBP/USD OTC</option>

<option value="usdjpy">🇯🇵 USD/JPY OTC</option>

<option value="btcusdt">₿ BTC/USDT LIVE</option>

</select>

<select id="timeframe">

<option value="15s">15 Seconds</option>

<option value="30s">30 Seconds</option>

<option value="1m" selected>1 Minute</option>

<option value="5m">5 Minutes</option>

</select>

<div class="flags">

<div class="flag">🇧🇷 USD/BRL</div>

<div class="flag">🇲🇽 USD/MXN</div>

<div class="flag">🇮🇳 USD/INR</div>

<div class="flag">🇵🇰 USD/PKR</div>

<div class="flag">🇺🇸 EUR/USD</div>

<div class="flag">🇬🇧 GBP/USD</div>

</div>

<div class="live-box">

<div class="live">
LIVE MARKET
</div>

<div class="price" id="price">
0.0000
</div>

<div class="chart" id="chart"></div>

<button onclick="generateSignal()">

GET SIGNAL

</button>

<div class="result" id="result">

<div class="signal wait" id="signal">
WAIT
</div>

<div class="conf" id="confidence">
0%
</div>

<div class="details" id="details">
Waiting analysis...
</div>

</div>

</div>

</div>

<div class="footer">

<div>🏠 HOME</div>

<div>📈 SIGNALS</div>

<div>⚙ SETTINGS</div>

</div>

</div>

<script>

/* PASSWORD */

const BOT_PASSWORD = "Abu786";

/* LOGIN */

function login(){

let pass =
document.getElementById('password').value;

if(pass === BOT_PASSWORD){

document.getElementById('loginBox')
.style.display='none';

document.getElementById('app')
.style.display='block';

}else{

alert("Wrong Password");

}

}

/* LIVE */

let prices=[];

let currentPrice=0;

const chart=
document.getElementById('chart');

/* LIVE PRICE */

setInterval(()=>{

let pair=
document.getElementById('pairSelect').value;

let base=1;

if(pair=="usdbrl") base=5.11;
if(pair=="usdmxn") base=16.90;
if(pair=="usdinr") base=83.10;
if(pair=="usdpkr") base=278.50;
if(pair=="eurusd") base=1.08;
if(pair=="gbpusd") base=1.27;
if(pair=="usdjpy") base=156.20;
if(pair=="btcusdt") base=65000;

currentPrice=
base+(Math.random()-0.5);

prices.push(currentPrice);

if(prices.length>40){

prices.shift();

}

document.getElementById('price')
.innerText=
currentPrice.toFixed(4);

drawChart();

},1000);

/* CHART */

function drawChart(){

chart.innerHTML='';

for(let i=0;i<prices.length;i++){

let candle=
document.createElement('div');

let h=
Math.abs(prices[i]%100);

candle.className=
'candle '+
(
i>0 &&
prices[i]>prices[i-1]
?
'green'
:
'red'
);

candle.style.height=
(15+h)+'px';

chart.appendChild(candle);

}

}

/* RSI */

function RSI(period=14){

if(prices.length<period){

return 50;

}

let gains=0;
let losses=0;

for(let i=1;i<period;i++){

let diff=
prices[prices.length-i]
-
prices[prices.length-i-1];

if(diff>0){

gains+=diff;

}else{

losses-=diff;

}

}

if(losses===0){

return 100;

}

let rs=
gains/losses;

return 100-
(100/(1+rs));

}

/* EMA */

function EMA(period){

if(prices.length<period){

return currentPrice;

}

let k=
2/(period+1);

let ema=
prices[0];

for(let i=1;i<prices.length;i++){

ema=
prices[i]*k+
ema*(1-k);

}

return ema;

}

/* SIGNAL */

function generateSignal(){

if(prices.length<20){

return;

}

let rsi=
RSI();

let ema9=
EMA(9);

let ema21=
EMA(21);

let buy=0;
let sell=0;

if(rsi<35){

buy+=3;

}

if(rsi>65){

sell+=3;

}

if(ema9>ema21){

buy+=4;

}else{

sell+=4;

}

if(
prices[prices.length-1]
>
prices[prices.length-2]
){

buy+=2;

}else{

sell+=2;

}

let signal='WAIT';

let cls='wait';

let confidence=70;

if(buy>=6){

signal='BUY';

cls='buy';

confidence=92;

}

if(sell>=6){

signal='SELL';

cls='sell';

confidence=90;

}

document.getElementById('result')
.style.display='block';

let sig=
document.getElementById('signal');

sig.innerText=
signal;

sig.className=
'signal '+cls;

document.getElementById('confidence')
.innerText=
confidence+'%';

document.getElementById('details')
.innerHTML=

'RSI : '+rsi.toFixed(1)+

'<br>EMA 9 : '+ema9.toFixed(4)+

'<br>EMA 21 : '+ema21.toFixed(4)+

'<br>BUY SCORE : '+buy+

'<br>SELL SCORE : '+sell+

'<br>TIMEFRAME : '+document.getElementById('timeframe').value;

}

</script>

</body>
</html>
