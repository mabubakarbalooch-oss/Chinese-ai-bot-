<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>ABU BAKAR FORTIS BOT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--yellow:#ffcc00;
--black:#050505;
--card:#101010;
--green:#00ff88;
--red:#ff4d4d;
}

body{
background:
radial-gradient(circle at top,#3b2d00 0%,#050505 60%);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:6px;
color:white;
overflow:hidden;
}

/* LOGIN */

.login{
width:100%;
max-width:390px;
background:#0f0f0f;
border:2px solid var(--yellow);
border-radius:25px;
padding:25px;
box-shadow:0 0 25px rgba(255,204,0,.3);
text-align:center;
}

.logo{
width:70px;
height:70px;
margin:auto;
border-radius:50%;
background:linear-gradient(135deg,#ffcc00,#ffee00);
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
font-weight:900;
color:black;
margin-bottom:15px;
}

.login h1{
font-size:24px;
color:var(--yellow);
font-weight:900;
}

.login p{
font-size:11px;
color:#aaa;
margin-top:5px;
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
border-radius:14px;
border:none;
outline:none;
background:#1a1a1a;
color:white;
margin-bottom:12px;
border:1px solid rgba(255,204,0,.2);
}

button{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#ffcc00,#ffee00);
color:black;
font-size:17px;
font-weight:900;
cursor:pointer;
box-shadow:0 0 20px rgba(255,204,0,.3);
}

/* APP */

.app{
display:none;
width:100%;
max-width:390px;
background:#0f0f0f;
border:2px solid var(--yellow);
border-radius:25px;
overflow:hidden;
box-shadow:0 0 25px rgba(255,204,0,.3);
}

/* HEADER */

.header{
padding:15px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.05);
}

.header h2{
font-size:22px;
font-weight:900;
color:var(--yellow);
text-shadow:0 0 10px rgba(255,204,0,.5);
}

.header p{
font-size:10px;
color:#ccc;
margin-top:4px;
}

/* MAIN */

.main{
padding:10px;
}

select{
width:100%;
padding:12px;
border-radius:14px;
background:#151515;
color:white;
border:1px solid rgba(255,204,0,.2);
outline:none;
margin-bottom:10px;
font-size:13px;
}

/* FLAGS */

.flags{
display:flex;
flex-wrap:wrap;
gap:5px;
justify-content:center;
margin-bottom:10px;
}

.flag{
background:#181818;
padding:5px 9px;
border-radius:10px;
font-size:10px;
border:1px solid rgba(255,204,0,.2);
}

/* LIVE BOX */

.live-box{
background:#121212;
border-radius:18px;
padding:12px;
border:1px solid rgba(255,255,255,.05);
}

.live-title{
font-size:10px;
color:var(--yellow);
}

.price{
font-size:34px;
font-weight:900;
color:var(--yellow);
margin-top:5px;
text-shadow:0 0 10px rgba(255,204,0,.5);
}

/* CHART */

.chart{
height:120px;
display:flex;
align-items:flex-end;
gap:2px;
margin-top:10px;
overflow:hidden;
}

.candle{
width:5px;
border-radius:4px;
}

.green{
background:var(--green);
box-shadow:0 0 8px rgba(0,255,136,.5);
}

.red{
background:var(--red);
box-shadow:0 0 8px rgba(255,77,77,.5);
}

/* RESULT */

.result{
display:none;
margin-top:12px;
background:#151515;
padding:12px;
border-radius:16px;
border:1px solid rgba(255,204,0,.2);
text-align:center;
}

.signal{
font-size:38px;
font-weight:900;
}

.buy{
color:var(--green);
}

.sell{
color:var(--red);
}

.wait{
color:var(--yellow);
}

.confidence{
font-size:25px;
font-weight:800;
color:var(--yellow);
margin-top:5px;
}

.details{
font-size:11px;
color:#ccc;
margin-top:8px;
line-height:1.7;
}

/* FOOTER */

.footer{
display:flex;
justify-content:space-around;
padding:10px;
border-top:1px solid rgba(255,255,255,.05);
font-size:10px;
color:var(--yellow);
}

</style>
</head>

<body>

<!-- LOGIN -->

<div class="login" id="loginBox">

<div class="logo">AB</div>

<h1>ABU BAKAR TRADER</h1>

<p>FORTIS SIGNAL BOT</p>

<input type="password"
id="password"
placeholder="ENTER PASSWORD">

<button onclick="login()">

LOGIN

</button>

</div>

<!-- APP -->

<div class="app" id="app">

<div class="header">

<div class="logo">AB</div>

<h2>ABU BAKAR TRADER</h2>

<p>LIVE FORTIS SIGNAL BOT</p>

</div>

<div class="main">

<select id="pair">

<option value="usdbrl">🇧🇷 USD/BRL OTC</option>

<option value="usdmxn">🇲🇽 USD/MXN OTC</option>

<option value="usdinr">🇮🇳 USD/INR OTC</option>

<option value="usdpkr">🇵🇰 USD/PKR OTC</option>

<option value="eurusd">🇺🇸 EUR/USD OTC</option>

<option value="gbpusd">🇬🇧 GBP/USD OTC</option>

<option value="usdjpy">🇯🇵 USD/JPY OTC</option>

<option value="btcusdt">₿ BTC/USDT LIVE</option>

</select>

<select id="timeframe">

<option value="15s">15 Seconds</option>

<option value="30s">30 Seconds</option>

<option value="1m" selected>1 Minute</option>

<option value="5m">5 Minutes</option>

</select>

<div class="flags">

<div class="flag">🇧🇷 USD/BRL</div>
<div class="flag">🇲🇽 USD/MXN</div>
<div class="flag">🇮🇳 USD/INR</div>
<div class="flag">🇵🇰 USD/PKR</div>
<div class="flag">🇺🇸 EUR/USD</div>
<div class="flag">🇬🇧 GBP/USD</div>

</div>

<div class="live-box">

<div class="live-title">
LIVE MARKET
</div>

<div class="price" id="price">
0.0000
</div>

<div class="chart" id="chart"></div>

<button onclick="generateSignal()">

GET SIGNAL

</button>

<div class="result" id="result">

<div class="signal wait" id="signal">

WAIT

</div>

<div class="confidence" id="confidence">

0%

</div>

<div class="details" id="details">

Waiting live analysis...

</div>

</div>

</div>

</div>

<div class="footer">

<div>🏠 HOME</div>

<div>📈 SIGNALS</div>

<div>⚙ SETTINGS</div>

</div>

</div>

<script>

/* PASSWORD */

const PASSWORD = "Abu786";

/* LOGIN */

function login(){

let pass =
document.getElementById('password').value;

if(pass === PASSWORD){

document.getElementById('loginBox')
.style.display='none';

document.getElementById('app')
.style.display='block';

}else{

alert("Wrong Password");

}

}

/* LIVE MARKET */

let prices=[];
let currentPrice=0;

const chart =
document.getElementById('chart');

setInterval(()=>{

let pair =
document.getElementById('pair').value;

let base = 1;

if(pair=="usdbrl") base=5.10;
if(pair=="usdmxn") base=16.90;
if(pair=="usdinr") base=83.20;
if(pair=="usdpkr") base=278.40;
if(pair=="eurusd") base=1.08;
if(pair=="gbpusd") base=1.27;
if(pair=="usdjpy") base=156.20;
if(pair=="btcusdt") base=65000;

/* SMART MARKET MOVE */

let move =
(Math.random()-0.5)*0.2;

currentPrice =
base + move;

prices.push(currentPrice);

if(prices.length > 40){

prices.shift();

}

document.getElementById('price')
.innerText =
currentPrice.toFixed(4);

drawChart();

},1000);

/* DRAW CHART */

function drawChart(){

chart.innerHTML='';

for(let i=0;i<prices.length;i++){

let candle =
document.createElement('div');

let h =
Math.abs(prices[i]%100);

candle.className =
'candle '+
(
i>0 &&
prices[i] > prices[i-1]
?
'green'
:
'red'
);

candle.style.height =
(15+h)+'px';

chart.appendChild(candle);

}

}

/* RSI */

function RSI(period=14){

if(prices.length < period){

return 50;

}

let gains=0;
let losses=0;

for(let i=1;i<period;i++){

let diff =
prices[prices.length-i]
-
prices[prices.length-i-1];

if(diff > 0){

gains += diff;

}else{

losses -= diff;

}

}

if(losses===0){

return 100;

}

let rs =
gains/losses;

return 100-(100/(1+rs));

}

/* EMA */

function EMA(period){

if(prices.length < period){

return currentPrice;

}

let k =
2/(period+1);

let ema =
prices[0];

for(let i=1;i<prices.length;i++){

ema =
prices[i]*k +
ema*(1-k);

}

return ema;

}

/* SIGNAL */

function generateSignal(){

if(prices.length < 20){

alert("Collecting Live Market Data");

return;

}

let rsi = RSI();

let ema9 = EMA(9);

let ema21 = EMA(21);

let last =
prices[prices.length-1];

let prev =
prices[prices.length-2];

let buy=0;
let sell=0;

/* RSI */

if(rsi < 35){

buy += 3;

}

if(rsi > 65){

sell += 3;

}

/* EMA */

if(ema9 > ema21){

buy += 4;

}else{

sell += 4;

}

/* MOMENTUM */

if(last > prev){

buy += 2;

}else{

sell += 2;

}

/* STRONG TREND */

let power =
Math.abs(last-prev);

if(power > 0.05){

if(last > prev){

buy += 2;

}else{

sell += 2;

}

}

/* FINAL */

let signal="WAIT";
let cls="wait";
let confidence=70;

if(buy >= 7){

signal="BUY";
cls="buy";
confidence=94;

}

else if(sell >= 7){

signal="SELL";
cls="sell";
confidence=93;

}

document.getElementById('result')
.style.display='block';

let sig =
document.getElementById('signal');

sig.innerText =
signal;

sig.className =
'signal '+cls;

document.getElementById('confidence')
.innerText =
confidence+'%';

document.getElementById('details')
.innerHTML =

'RSI : '+rsi.toFixed(1)+

'<br>EMA 9 : '+ema9.toFixed(4)+

'<br>EMA 21 : '+ema21.toFixed(4)+

'<br>BUY SCORE : '+buy+

'<br>SELL SCORE : '+sell+

'<br>TIMEFRAME : '+document.getElementById('timeframe').value+

'<br>FORTIS AI ANALYSIS ACTIVE';

}

</script>

</body>
</html>
