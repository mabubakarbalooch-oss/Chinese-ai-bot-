<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA ABUBAKAR SIGNAL PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Poppins;
background:#06110a;
color:#fff;
display:flex;
justify-content:center;
padding:15px;
}

.container{
width:100%;
max-width:450px;
background:#0b1d13;
padding:20px;
border-radius:20px;
border:1px solid #145c34;
}

h2{
text-align:center;
font-family:Orbitron;
margin-bottom:10px;
}

select,button{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:none;
}

button{
background:linear-gradient(135deg,#00ff78,#00cc66);
font-weight:bold;
cursor:pointer;
}

#signal{
text-align:center;
font-size:28px;
margin:15px 0;
padding:15px;
border-radius:15px;
display:none;
}

.buy{background:rgba(0,255,120,0.15);color:#00ff78;}
.sell{background:rgba(255,77,77,0.15);color:#ff4d4d;}
.wait{background:rgba(255,208,0,0.15);color:#ffd000;}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:10px;
}

.box{
background:#102117;
padding:10px;
border-radius:10px;
text-align:center;
}

canvas{
margin-top:15px;
background:#0f2217;
border-radius:10px;
padding:10px;
}

</style>
</head>

<body>

<div class="container">

<h2>LUBNA ABUBAKAR SIGNAL PRO</h2>

<select id="asset">

<option>USD/PKR (OTC)</option>
<option>USD/INR (OTC)</option>
<option>USD/BRL (OTC)</option>
<option>USD/MXN (OTC)</option>

<option>EUR/USD</option>
<option>GBP/USD</option>
<option>BTC/USDT</option>

</select>

<button onclick="generate()">GENERATE SIGNAL</button>

<div id="signal"></div>

<div class="stats">
<div class="box">RSI <p id="rsi">--</p></div>
<div class="box">WIN <p id="win">0</p></div>
<div class="box">LOSS <p id="loss">0</p></div>
<div class="box">STATUS <p id="status">READY</p></div>
</div>

<canvas id="chart"></canvas>

</div>

<script>

/* SOUND */
function playSound(){
let audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
audio.play();
}

/* WIN LOSS */
let win = localStorage.getItem("win") || 0;
let loss = localStorage.getItem("loss") || 0;

document.getElementById("win").innerText = win;
document.getElementById("loss").innerText = loss;

/* CHART */
let ctx = document.getElementById("chart").getContext("2d");

let chart = new Chart(ctx,{
type:"line",
data:{
labels:["1","2","3","4","5","6","7"],
datasets:[{
label:"Market",
data:[10,12,9,14,13,15,12],
borderColor:"#00ff78",
tension:0.4
}]
},
options:{responsive:true}
});

/* SIGNAL ENGINE */
function generate(){

let rsi = Math.floor(Math.random()*100);
document.getElementById("rsi").innerText = rsi;

let signalBox = document.getElementById("signal");
signalBox.style.display="block";

let result,cls;

if(rsi < 40){
result="📈 BUY";
cls="buy";
win++;
localStorage.setItem("win",win);
playSound();
}

else if(rsi > 60){
result="📉 SELL";
cls="sell";
loss++;
localStorage.setItem("loss",loss);
playSound();
}

else{
result="⏳ WAIT";
cls="wait";
playSound();
}

signalBox.innerHTML=result;
signalBox.className=cls;

document.getElementById("win").innerText=win;
document.getElementById("loss").innerText=loss;
document.getElementById("status").innerText=result;

}

</script>

</body>
</html>
