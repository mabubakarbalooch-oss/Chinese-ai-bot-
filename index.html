<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chinese Signal Generator Pro</title>
<style>
    /* ہم نے سکرین کے حساب سے چھوٹا بڑا ہونے والا سسٹم ہٹا دیا ہے */
    body { background:#0a0e13; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }

    /* یہ مین بورڈ اب فکسڈ سائز (400px) کا ہے، یہ خود نہیں بدلے گا */
    #mainBoard { 
        width: 400px; 
        height: auto; 
        background:#0f1318; 
        border:2px solid #00ff88; 
        border-radius:25px; 
        padding:30px; 
        box-shadow:0 0 30px rgba(0,255,136,0.2); 
    }

    h1 { color:#00ff88; font-size:22px; text-align:center; margin-bottom:20px; }
    .label { color:#8b949e; font-size:14px; margin-bottom:5px; margin-top:15px; display:block; }
    .select-box { width:100%; padding:15px; background:#1a1f26; border:1px solid #30363d; border-radius:12px; color:#fff; font-size:15px; }
    
    .time-container { display:flex; gap:8px; margin-top:10px; }
    .time-btn { width: 65px; padding:12px 0; background:#1a1f26; border:1px solid #30363d; border-radius:10px; color:#8b949e; cursor:pointer; font-size:14px; text-align:center; }
    .time-btn.active { border:1px solid #00ff88; color:#00ff88; background:rgba(0,255,136,0.1); }
    
    .gen-btn { width:100%; padding:18px; background:linear-gradient(90deg, #00ff88, #00d977); border:none; border-radius:12px; font-weight:700; color:#000; cursor:pointer; font-size:16px; margin-top:25px; }
    
    #signalBox { margin-top:20px; padding:15px; border-radius:12px; text-align:center; font-size:20px; font-weight:bold; display:none; }
    .buy-style { background:rgba(0, 255, 136, 0.2); border:1px solid #00ff88; color:#00ff88; }
    .sell-style { background:rgba(255, 68, 68, 0.2); border:1px solid #ff4444; color:#ff4444; }

    .indicator-box { display:flex; gap:10px; margin-top:20px; }
    .ind-card { flex:1; background:#1a1f26; padding:12px; border-radius:10px; border:1px solid #30363d; text-align:center; font-size:11px; }
</style>
</head>
<body>

<div id="mainBoard">
    <h1>🚀 Chinese Signal Generator</h1>
    
    <label class="label">Select Broker</label>
    <select class="select-box"><option>Quotex</option></select>
    
    <label class="label">Trading Asset</label>
    <select class="select-box">
        <option>NZD/CHF (OTC)</option>
        <option>USD/BRL (OTC)</option>
        <option>USD/MXN (OTC)</option>
        <option>EUR/USD</option>
    </select>

    <label class="label">Time Frame</label>
    <div class="time-container">
        <div class="time-btn" onclick="setActive(this)">5s</div>
        <div class="time-btn active" onclick="setActive(this)">15s</div>
        <div class="time-btn" onclick="setActive(this)">30s</div>
        <div class="time-btn" onclick="setActive(this)">1m</div>
    </div>

    <button class="gen-btn" onclick="gen()">⚡ GENERATE SIGNAL ⚡</button>

    <div id="signalBox">---</div>

    <div class="indicator-box">
        <div class="ind-card">RSI<br><strong id="rsi" style="color:#00ff88">--</strong></div>
        <div class="ind-card">Trend<br><strong id="ma" style="color:#00ff88">--</strong></div>
        <div class="ind-card">Conf.<br><strong id="conf" style="color:#00ff88">--</strong></div>
    </div>
</div>

<script>
    function setActive(el) {
        document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
        el.classList.add('active');
    }
    
    function gen() {
        let isBuy = Math.random() > 0.5;
        let box = document.getElementById('signalBox');
        document.getElementById('rsi').innerText = Math.floor(Math.random() * 40 + 30);
        document.getElementById('ma').innerText = "Bullish";
        document.getElementById('conf').innerText = "96%";
        box.style.display = 'block';
        box.innerText = isBuy ? "BUY SIGNAL" : "SELL SIGNAL";
        box.className = isBuy ? "buy-style" : "sell-style";
        
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.frequency.value = isBuy ? 600 : 300;
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
    }
</script>
</body>
</html>
