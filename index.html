<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>💜 OTC SURESHOT BOT PRO</title>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<style>

:root{

--purple:#b100ff;
--purple2:#7b00ff;
--bg:#070010;

}

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;

}

body{

background:var(--bg);

height:100vh;

display:flex;

flex-direction:column;

overflow:hidden;

}

/* LIST SCREEN */

.screen{

display:flex;

flex-direction:column;

width:100%;

height:100%;

padding:20px;

}

.pair-title{

color:#fff;

font-size:22px;

text-align:center;

margin-bottom:20px;

font-weight:bold;

}

.pair-title span{

font-size:12px;

color:#d86cff;

font-weight:normal;

}

.pair-list{

display:flex;

flex-direction:column;

gap:12px;

overflow-y:auto;

flex:1;

padding-bottom:20px;

}

.pair-btn{

background:#120021;

border:1px solid rgba(255,255,255,0.08);

border-radius:18px;

padding:18px 20px;

color:#fff;

font-weight:700;

display:flex;

align-items:center;

justify-content:space-between;

cursor:pointer;

transition:0.3s;

}

.pair-btn:active{

transform:scale(0.97);

background:var(--purple);

}

.pair-btn span{

color:#f0b3ff;

font-size:12px;

}

/* TRADING SCREEN */

.trading-container{

display:none;

flex-direction:column;

width:100%;

height:100%;

position:relative;

}

.back-btn{

position:absolute;

top:15px;

left:15px;

background:rgba(0,0,0,0.6);

border:1px solid var(--purple);

color:#fff;

padding:8px 15px;

border-radius:20px;

font-size:11px;

font-weight:bold;

cursor:pointer;

z-index:1000;

}

/* CHART */

.chart-frame{

flex:1;

width:100%;

border:none;

background:#000;

}

/* BOTTOM PANEL */

.bottom-panel{

background:rgba(15,0,30,0.96);

border-top:2px solid rgba(177,0,255,0.5);

padding:20px;

text-align:center;

border-radius:35px 35px 0 0;

box-shadow:0 -10px 30px rgba(0,0,0,0.5);

position:relative;

z-index:999;

}

/* BUTTON */

.sureshot-wrapper{

display:flex;

justify-content:center;

margin-bottom:15px;

}

.sureshot-btn{

width:140px;

height:55px;

border-radius:35px;

background:
linear-gradient(135deg,var(--purple2),var(--purple));

border:2px solid #fff;

color:#fff;

font-weight:900;

font-size:16px;

letter-spacing:1px;

cursor:pointer;

box-shadow:
0 0 25px rgba(177,0,255,0.5);

transition:0.3s;

}

.sureshot-btn:active{

transform:scale(0.95);

}

.scanning .sureshot-btn{

background:#333;

color:#777;

border-color:#444;

animation:pulse 1s infinite;

}

@keyframes pulse{

0%{
opacity:0.5;
}

50%{
opacity:1;
}

100%{
opacity:0.5;
}

}

/* SIGNAL */

.signal-badge{

display:none;

width:190px;

margin:10px auto 0 auto;

padding:15px;

border-radius:25px;

font-size:28px;

font-weight:900;

text-align:center;

animation:popIn 0.3s ease;

}

@keyframes popIn{

from{

transform:scale(0);

}

to{

transform:scale(1);

}

}

.up-signal{

background:#00cc7a;

color:white;

box-shadow:
0 0 25px rgba(0,255,120,0.5);

}

.down-signal{

background:#ff3355;

color:white;

box-shadow:
0 0 25px rgba(255,0,90,0.5);

}

.wait-signal{

background:#b100ff;

color:white;

box-shadow:
0 0 25px rgba(177,0,255,0.5);

}

/* DATA */

.data-box{

margin-top:15px;

font-size:12px;

line-height:1.9;

color:#f0d2ff;

}

/* TIMER */

.timer{

margin-top:12px;

font-size:30px;

font-weight:900;

color:#d86cff;

text-shadow:
0 0 15px #b100ff;

}

</style>
</head>

<body>

<!-- PAIR SCREEN -->

<div class="screen" id="listScreen">

<div class="pair-title">

💜 OTC SURESHOT BOT PRO

<br>

<span>
LIVE RSI + EMA SIGNAL SYSTEM
</span>

</div>

<div class="pair-list">

<div class="pair-btn"
onclick="launchTrading('BTCUSDT')">

USD/BRL OTC

<span>
LIVE
</span>

</div>

<div class="pair-btn"
onclick="launchTrading('ETHUSDT')">

USD/MXN OTC

<span>
LIVE
</span>

</div>

<div class="pair-btn"
onclick="launchTrading('BNBUSDT')">

USD/INR OTC

<span>
LIVE
</span>

</div>

</div>

</div>

<!-- TRADE SCREEN -->

<div class="trading-container"
id="tradeScreen">

<button class="back-btn"
onclick="goBack()">

« PAIRS

</button>

<iframe class="chart-frame"
id="chartFrame">

</iframe>

<div class="bottom-panel"
id="panelArea">

<div class="sureshot-wrapper">

<button class="sureshot-btn"
id="sureBtn"
onclick="triggerSureshot()">

SURESHOT

</button>

</div>

<div class="signal-badge"
id="sigResult">

</div>

<div class="data-box"
id="marketData">

RSI: --
<br>
EMA FAST: --
<br>
EMA SLOW: --
<br>
TREND: --

</div>

<div class="timer"
id="timer">

60

</div>

</div>

</div>

<script>

let audioContext = null;

let selectedPair = "BTCUSDT";

// OPEN MARKET

function launchTrading(pair){

selectedPair = pair;

document.getElementById('listScreen').style.display =
"none";

document.getElementById('tradeScreen').style.display =
"flex";

if(!audioContext){

audioContext =
new(window.AudioContext ||
window.webkitAudioContext)();

}

// TRADINGVIEW CHART

document.getElementById('chartFrame').src =

`https://s.tradingview.com/widgetembed/?symbol=BINANCE:${pair}&interval=1&theme=dark&style=1`;

}

// BACK

function goBack(){

document.getElementById('tradeScreen').style.display =
"none";

document.getElementById('listScreen').style.display =
"flex";

}

// SOUND

function playBeep(isUp){

if(!audioContext) return;

let osc =
audioContext.createOscillator();

let gain =
audioContext.createGain();

osc.connect(gain);

gain.connect(audioContext.destination);

osc.frequency.setValueAtTime(

isUp ? 1200 : 350,

audioContext.currentTime

);

gain.gain.setValueAtTime(

0.15,

audioContext.currentTime

);

osc.start();

osc.stop(audioContext.currentTime + 0.3);

}

// EMA

function ema(data,period){

let k = 2/(period+1);

let value = data[0];

for(let i=1;i<data.length;i++){

value =
data[i]*k +
value*(1-k);

}

return value;

}

// RSI

function rsiCalc(data,period=14){

let gains=0;
let losses=0;

for(let i=1;i<=period;i++){

let diff =
data[i]-data[i-1];

if(diff>=0){

gains += diff;

}else{

losses += Math.abs(diff);

}

}

let rs =
gains/(losses||1);

return 100-(100/(1+rs));

}

// SIGNAL

async function triggerSureshot(){

const btn =
document.getElementById('sureBtn');

const panel =
document.getElementById('panelArea');

const sig =
document.getElementById('sigResult');

btn.disabled = true;

panel.classList.add('scanning');

sig.style.display = 'none';

// SCAN EFFECT

await new Promise(r =>
setTimeout(r,3000)
);

panel.classList.remove('scanning');

btn.disabled = false;

try{

// REAL BINANCE API

let response =
await axios.get(

`https://api.binance.com/api/v3/klines?symbol=${selectedPair}&interval=1m&limit=50`

);

let candles =
response.data;

// REAL CLOSES

let closes =
candles.map(c =>
parseFloat(c[4])
);

// RSI + EMA

let rsi =
rsiCalc(closes).toFixed(2);

let fast =
ema(closes.slice(-20),9).toFixed(2);

let slow =
ema(closes.slice(-20),21).toFixed(2);

let trend =
"SIDEWAYS";

let isUp = null;

// BUY

if(

rsi > 60 &&
fast > slow

){

isUp = true;

trend = "BULLISH";

}

// SELL

else if(

rsi < 40 &&
fast < slow

){

isUp = false;

trend = "BEARISH";

}

// WAIT

else{

sig.style.display = 'block';

sig.innerHTML =

"WAIT ⏳<br><small>SIDEWAYS</small>";

sig.className =
"signal-badge wait-signal";

document.getElementById('marketData').innerHTML =

`
RSI: ${rsi}
<br>
EMA FAST: ${fast}
<br>
EMA SLOW: ${slow}
<br>
TREND: ${trend}
`;

return;

}

// SHOW SIGNAL

sig.style.display = 'block';

if(isUp){

sig.innerHTML =

"UP ↑<br><small>BULLISH</small>";

sig.className =
"signal-badge up-signal";

}else{

sig.innerHTML =

"DOWN ↓<br><small>BEARISH</small>";

sig.className =
"signal-badge down-signal";

}

playBeep(isUp);

// UPDATE DATA

document.getElementById('marketData').innerHTML =

`
RSI: ${rsi}
<br>
EMA FAST: ${fast}
<br>
EMA SLOW: ${slow}
<br>
TREND: ${trend}
`;

}catch(e){

sig.style.display = 'block';

sig.innerHTML =
"API ERROR";

sig.className =
"signal-badge wait-signal";

}

}

// TIMER

let time = 60;

setInterval(()=>{

time--;

if(time <= 0){

time = 60;

triggerSureshot();

}

document.getElementById('timer').innerHTML =
time;

},1000);

</script>

</body>
</html>
