<html lang="en">
<head>

    <title>🇵🇰 PAK AI SIGNAL X - PRO V6</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>

        body{ background:#000; color:#fff; font-family:sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; overflow:hidden; }
        .bot-card{ width:90%; max-width:400px; background:#011a0d; border:3px solid #00ff99; border-radius:40px; padding:25px; box-shadow:0 0 50px rgba(0,255,153,0.4); text-align:center; }
        .header-title{ font-family:'Orbitron',sans-serif; color:#00ff99; font-size:22px; margin-bottom:15px; text-shadow:0 0 10px #00ff99; }
        select{ width:100%; padding:15px; border-radius:20px; background:#000; border:1px solid #00ff99; color:#fff; margin-bottom:15px; font-weight:bold; }
        #tv-widget-area{ width:100%; height:160px; border-radius:20px; border:1px solid #333; margin-bottom:15px; overflow:hidden; background:#000; }
        .action-btn{ width:100%; padding:20px; border-radius:50px; border:none; background:linear-gradient(90deg, #008f4a, #00ff99); color:#000; font-family:'Orbitron',sans-serif; font-weight:900; font-size:16px; cursor:pointer; }
        .loading-container{ width:100%; height:8px; background:#002b16; border-radius:10px; margin-top:15px; display:none; overflow:hidden; }
        .loading-bar{ width:0%; height:100%; background:#00ff99; transition:3s linear; }
        
        #result-box{ display:none; margin-top:20px; padding:20px; border-radius:30px; background:rgba(255,255,255,0.05); border:2px solid #00ff99; animation:zoom 0.3s ease; }
        @keyframes zoom{ from{transform:scale(0.5); opacity:0;} to{transform:scale(1); opacity:1;} }
        .sig-val{ font-family:'Orbitron',sans-serif; font-size:38px; font-weight:900; }
        .acc-text{ font-size:12px; background:#00ff99; color:#000; padding:3px 10px; border-radius:10px; font-weight:bold; }
        .timer-val{ color:#ffcc00; font-weight:bold; margin-top:10px; font-size:15px; }
        .detail-text{ font-size:11px; color:#aaa; margin-top:5px; }
    </style>
</head>
<body>

<div class="bot-card" id="login">
    <h2 class="header-title">PAK AI SIGNAL X</h2>
    <input type="password" id="key" placeholder="Enter Key: Pak786" style="width:100%; padding:15px; border-radius:15px; background:#000; color:#fff; border:1px solid #00ff99; text-align:center; margin-bottom:15px;">
    <button class="action-btn" onclick="startApp()">LOGIN</button>
</div>

<div class="bot-card" id="app" style="display:none;">

        <option value="USDINR">USD/INR (LIVE)</option>
        <option value="EURUSD">EUR/USD (LIVE)</option>
    </select>

    <div id="tv-widget-area">
        <div id="widget-box"></div>
    </div>

    <button class="action-btn" id="scanBtn" onclick="runScan()">⚡ SCAN PRECISION SIGNAL</button>
    
    <div class="loading-container" id="lcon"><div class="loading-bar" id="lbar"></div></div>

    <div id="result-box">
        <span class="acc-text" id="accText">ANALYZING...</span>
        <div class="sig-val" id="sigOutput">---</div>
        <div class="detail-text" id="sigDetails">Calculating indicators...</div>
        <div class="timer-val" id="countdown">WAIT...</div>
    </div>
</div>

<script>

        if(document.getElementById('key').value === 'Pak786'){
            document.getElementById('login').style.display='none';
            document.getElementById('app').style.display='block';
            changeMarket();
        } else { alert('Ghalat Key!'); }
    }

    function changeMarket(){
        const pair = document.getElementById('pairList').value;
        const box = document.getElementById('widget-box');
        box.innerHTML = '';
        const script = document.createElement('script');
        script.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";

            "symbol": `FX_IDC:${pair}`, "showIntervalTabs": false, "locale": "en", "colorTheme": "dark"
        });
        box.appendChild(script);
    }
