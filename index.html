<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>ABU BAKAR TRADER - ROYAL TIGER</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght=400;600;700;800;900&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background: #020202;
display:flex;
justify-content:center;
padding:8px;
color:#fff;
background-image: radial-gradient(circle at 50% 15%, #d4af3715, transparent 55%);
}

/* پاس ورڈ اسکرین کا اسٹائل */
.lock-screen {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(2, 2, 2, 0.95);
z-index: 9999;
display: flex;
justify-content: center;
align-items: center;
padding: 15px;
backdrop-filter: blur(10px);
}

.lock-box {
width: 100%;
max-width: 350px;
background: #0a0a0a;
border: 2px solid #d4af37;
border-radius: 20px;
padding: 25px;
text-align: center;
box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
}

.lock-title {
font-size: 20px;
font-weight: 800;
color: #d4af37;
margin-bottom: 15px;
letter-spacing: 1px;
}

.lock-input {
width: 100%;
padding: 12px;
background: #111;
border: 1px solid rgba(212, 175, 55, 0.4);
border-radius: 12px;
color: #fff;
font-size: 16px;
text-align: center;
outline: none;
margin-bottom: 15px;
letter-spacing: 2px;
}

.lock-input:focus {
border-color: #d4af37;
box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
}

.lock-btn {
width: 100%;
padding: 12px;
background: linear-gradient(135deg, #d4af37, #f3e5ab);
border: none;
border-radius: 12px;
color: #000;
font-size: 16px;
font-weight: 800;
cursor: pointer;
box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
}

.error-msg {
color: #ff3b3b;
font-size: 12px;
margin-top: 10px;
display: none;
}

/* مین بوٹ کنٹینر (لاک ہونے پر دھندلا رہے گا) */
.container{
width:100%;
max-width:390px;
background: linear-gradient(145deg, #0a0a0a, #050505);
border: 2px solid #d4af37;
border-radius:24px;
padding:14px;
box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(212, 175, 55, 0.15);
overflow:hidden;
filter: blur(10px); /* شروع میں بلر رہے گا */
pointer-events: none;
transition: filter 0.5s ease;
}

.logo-container {
position: relative;
width: 85px;
height: 85px;
margin: auto;
display: flex;
align-items: center;
justify-content: center;
}

.logo{
width:100%;
height:100%;
background: radial-gradient(circle, #ffd700, #b8860b);
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
box-shadow:0 0 25px rgba(212, 175, 55, 0.6);
border: 2px solid rgba(255,255,255,0.2);
position: relative;
z-index: 2;
}

.logo::before {
content: '🐅';
font-size: 40px;
}

.title{
text-align:center;
font-size:24px;
font-weight:900;
color: #d4af37;
margin-top:12px;
letter-spacing: 1px;
text-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
}

.subtitle{
text-align:center;
font-size:11px;
color:#8a8a8a;
margin-bottom:14px;
text-transform: uppercase;
letter-spacing: 2px;
font-weight: 600;
}

.select{
width:100%;
padding:14px;
background: #0f0f0f;
border:1px solid rgba(212, 175, 55, 0.3);
border-radius:16px;
color:#fff;
font-size:15px;
margin-bottom:10px;
outline:none;
transition: all 0.3s;
}

.select:focus {
border-color: #d4af37;
box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
}

.pairs{
display:flex;
flex-wrap:wrap;
gap:6px;
justify-content:center;
margin-bottom:12px;
}

.pair{
background: #0d0d0d;
border:1px solid rgba(255,255,255,0.05);
padding:8px 12px;
border-radius:12px;
font-size:12px;
cursor: pointer;
transition: all 0.3s ease;
color: #aaa;
}

.pair.active {
border-color: #d4af37;
background: rgba(212, 175, 55, 0.12);
color: #d4af37;
font-weight: 600;
box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
}

.chart-box{
position:relative;
height:210px;
background: #040404;
border-radius:20px;
padding:12px;
overflow:hidden;
border:1px solid rgba(212, 175, 55, 0.15);
}

.live{
font-size:12px;
font-weight:700;
color:#d4af37;
letter-spacing: 1px;
display: flex;
align-items: center;
gap: 5px;
}

.live::before {
content: '';
display: inline-block;
width: 6px;
height: 6px;
background: #00ff88;
border-radius: 50%;
box-shadow: 0 0 6px #00ff88;
}

.price{
font-size:42px;
font-weight:800;
color:#00ff88;
margin-top:2px;
font-family: monospace;
transition: color 0.1s ease;
}

.candles{
position:absolute;
bottom:15px;
left:12px;
right:12px;
height:100px;
display:flex;
align-items:flex-end;
gap:6px;
overflow-x: hidden;
}

.candle{
width:10px;
border-radius:3px;
flex-shrink: 0;
transition: height 0.2s ease, background 0.2s ease;
}

.green{
background:#00ff88;
box-shadow:0 0 6px rgba(0, 255, 136, 0.3);
}

.red{
background:#ff3b3b;
box-shadow:0 0 6px rgba(255, 59, 59, 0.3);
}

.scan-line{
position:absolute;
top:0;
bottom:0;
width:4px;
background: linear-gradient(to right, transparent, #d4af37, transparent);
box-shadow:0 0 18px #d4af37;
display:none;
animation:scan 2s linear infinite;
z-index: 5;
}

@keyframes scan{
0%{ left:-10px; }
100%{ left:100%; }
}

.btn{
width:100%;
padding:16px;
border:none;
border-radius:18px;
margin-top:12px;
background: linear-gradient(135deg, #d4af37, #f3e5ab);
color:#000;
font-size:18px;
font-weight:900;
cursor:pointer;
box-shadow:0 4px 18px rgba(212, 175, 55, 0.35);
transition: all 0.2s ease;
-webkit-tap-highlight-color: transparent;
letter-spacing: 0.5px;
}

.btn:active {
transform: scale(0.96);
background: linear-gradient(135deg, #b8860b, #d4af37);
}

.btn:disabled {
background: #222;
color: #555;
box-shadow: none;
cursor: not-allowed;
border: 1px solid #333;
}

.result{
margin-top:14px;
background: rgba(15, 15, 15, 0.9);
border-radius: 20px;
padding: 16px;
border: 1px solid #d4af37;
display: none;
animation: fadeIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
}

@keyframes fadeIn {
from { opacity: 0; transform: translateY(15px); }
to { opacity: 1; transform: translateY(0); }
}

.signal{
font-size:55px;
font-weight:900;
text-align:center;
letter-spacing: 2px;
}

.buy{
color:#00ff88;
text-shadow:0 0 25px rgba(0, 255, 136, 0.5);
}

.sell{
color:#ff3b3b;
text-shadow:0 0 25px rgba(255, 59, 59, 0.5);
}

.wait{
color:#d4af37;
text-shadow:0 0 25px rgba(212, 175, 55, 0.5);
}

.conf{
text-align:center;
font-size:32px;
font-weight:800;
color:#d4af37;
margin-top:2px;
background: rgba(212, 175, 55, 0.1);
width: fit-content;
margin: 4px auto 12px auto;
padding: 2px 16px;
border-radius: 20px;
border: 1px solid rgba(212, 175, 55, 0.25);
}

.info-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
margin-top: 5px;
font-size: 13px;
color: #ccc;
}

.info-item {
background: rgba(255,255,255,0.02);
padding: 8px 10px;
border-radius: 10px;
border: 1px solid rgba(212, 175, 55, 0.1);
}

.info-item span {
float: right;
font-weight: 600;
color: #fff;
}

.info-item span.highlight {
color: #d4af37;
}

.footer{
margin-top:14px;
text-align:center;
font-size:11px;
color:#444;
letter-spacing: 1px;
font-weight: 600;
}
</style>
</head>

<body>

<div class="lock-screen" id="lockScreen">
    <div class="lock-box">
        <div style="font-size: 40px; margin-bottom: 10px;">🐅</div>
        <div class="lock-title">ABU BAKAR TRADER</div>
        <input type="password" class="lock-input" id="passInput" placeholder="ENTER PASSWORD">
        <button class="lock-btn" onclick="checkPassword()">UNLOCK BOT</button>
        <div class="error-msg" id="errorMsg">❌ WRONG PASSWORD! TRY AGAIN.</div>
    </div>
</div>

<div class="container" id="botContainer">

<div class="logo-container">
    <div class="logo"></div>
</div>

<div class="title">ABU BAKAR TRADER</div>
<div class="subtitle">ROYAL TIGER AI BOT</div>

<select class="select" id="pair" onchange="syncPairSelection(this.value)">
<option value="USD/BRL">🇧🇷 USD/BRL OTC</option>
<option value="USD/MXN">🇲🇽 USD/MXN OTC</option>
<option value="USD/INR">🇮🇳 USD/INR OTC</option>
<option value="USD/PKR">🇵🇰 USD/PKR OTC</option>
<option value="EUR/USD">🇺🇸 EUR/USD OTC</option>
<option value="GBP/USD">🇬🇧 GBP/USD OTC</option>
</select>

<select class="select" id="time">
<option>15 Seconds</option>
<option>30 Seconds</option>
<option>1 Minute</option>
<option>5 Minutes</option>
</select>

<div class="pairs" id="pairBadges">
<div class="pair active" onclick="selectBadge('USD/BRL')">🇧🇷 USD/BRL</div>
<div class="pair" onclick="selectBadge('USD/MXN')">🇲🇽 USD/MXN</div>
<div class="pair" onclick="selectBadge('USD/INR')">🇮🇳 USD/INR</div>
<div class="pair" onclick="selectBadge('USD/PKR')">🇵🇰 USD/PKR</div>
<div class="pair" onclick="selectBadge('EUR/USD')">🇺🇸 EUR/USD</div>
<div class="pair" onclick="selectBadge('GBP/USD')">🇬🇧 GBP/USD</div>
</div>

<div class="chart-box">
<div class="live">LIVE MARKET</div>
<div class="price" id="price">1.2540</div>
<div class="scan-line" id="scanLine"></div>
<div class="candles" id="candles"></div>
</div>

<button class="btn" id="actionBtn" onclick="getSignal()">
⚡ GET ROYAL SIGNAL
</button>

<div class="result" id="resultBox">
<div class="signal wait" id="signalText">WAIT</div>
<div class="conf" id="confidence">85%</div>

<div class="info-grid">
    <div class="info-item">RSI (14): <span id="rsi" class="highlight">52</span></div>
    <div class="info-item">PATTERN: <span id="pattern" class="highlight">Doji</span></div>
    <div class="info-item">EMA 9: <span id="ema9">1.2542</span></div>
    <div class="info-item">EMA 21: <span id="ema21">1.2539</span></div>
    <div class="info-item">MACD: <span id="macd">BUY</span></div>
    <div class="info-item">TREND: <span id="trend">UPTREND</span></div>
</div>
</div>

<div class="footer">
ABU BAKAR TRADER © ROYAL TIGER EDITION
</div>

</div>

<script>
// پاس ورڈ چیک کرنے کا لاجک
function checkPassword() {
    const input = document.getElementById("passInput").value;
    const correctPassword = "bakar786"; // یہاں آپ پاس ورڈ بدل سکتے ہیں
    const lockScreen = document.getElementById("lockScreen");
    const botContainer = document.getElementById("botContainer");
    const errorMsg = document.getElementById("errorMsg");

    if(input === correctPassword) {
        lockScreen.style.display = "none";
        botContainer.style.filter = "none";
        botContainer.style.pointerEvents = "auto";
        initCandles(); // انلاک ہونے پر چارٹ لوڈ ہوگا
    } else {
        errorMsg.style.display = "block";
        document.getElementById("passInput").value = "";
    }
}

// انٹر بٹن دبانے پر بھی انلاک کرنے کے لیے
document.getElementById("passInput").addEventListener("keyup", function(event) {
    if (event.key === "Enter") {
        checkPassword();
    }
});

const candlesContainer = document.getElementById("candles");
const priceElement = document.getElementById("price");
let candleData = []; 
let currentPrice = 1.2500;

const pairBases = {
    "USD/BRL": 4.9710,
    "USD/MXN": 16.8520,
    "USD/INR": 83.3100,
    "USD/PKR": 278.2500,
    "EUR/USD": 1.0845,
    "GBP/USD": 1.2615
};

function initCandles() {
    candlesContainer.innerHTML = "";
    candleData = [];
    let selectedPair = document.getElementById("pair").value;
    currentPrice = pairBases[selectedPair] || 1.2500;

    for(let i=0; i<28; i++){
        let change = (Math.random() - 0.5) * 0.0015;
        currentPrice += change;
        let height = Math.floor(Math.random() * 65) + 15;
        let isGreen = change >= 0;
        
        candleData.push({ price: currentPrice, isGreen: isGreen, height: height });

        let c = document.createElement("div");
        c.classList.add("candle", isGreen ? "green" : "red");
        c.style.height = height + "px";
        candlesContainer.appendChild(c);
    }
    priceElement.innerText = currentPrice.toFixed(4);
}

function updateLivePrice() {
    // صرف تب چلے گا جب بوٹ انلاک ہو چکا ہوگا
    if(document.getElementById("lockScreen").style.display === "none") {
        let change = (Math.random() - 0.5) * 0.0004;
        let oldPrice = currentPrice;
        currentPrice += change;
        
        priceElement.innerText = currentPrice.toFixed(4);
        priceElement.style.color = currentPrice >= oldPrice ? "#00ff88" : "#ff3b3b";

        if(candlesContainer.lastChild) {
            let lastHeight = Math.floor(Math.random() * 25) + 35;
            candlesContainer.lastChild.style.height = lastHeight + "px";
            if(currentPrice >= oldPrice) {
                candlesContainer.lastChild.className = "candle green";
            } else {
                candlesContainer.lastChild.className = "candle red";
            }
        }
    }
}

setInterval(updateLivePrice, 1000);

function syncPairSelection(val) {
    let badges = document.querySelectorAll("#pairBadges .pair");
    badges.forEach(b => {
        if(b.innerText.includes(val)) b.classList.add("active");
        else b.classList.remove("active");
    });
    initCandles();
}

function selectBadge(val) {
    document.getElementById("pair").value = val;
    syncPairSelection(val);
}

function getSignal(){
    let scan = document.getElementById("scanLine");
    let btn = document.getElementById("actionBtn");
    
    scan.style.display = "block";
    btn.disabled = true;

    setTimeout(() => {
        scan.style.display = "none";
        btn.disabled = false;
        generateSmartSignal();
    }, 2500);
}

function generateSmartSignal() {
    document.getElementById("resultBox").style.display = "block";
    
    let greenCount = candleData.filter(c => c.isGreen).length;
    let totalCount = candleData.length;
    
    let rsi = Math.floor((greenCount / totalCount) * 100);
    if(rsi < 25) rsi = 28; if(rsi > 80) rsi = 74;

    let ema9 = (currentPrice + 0.0003).toFixed(4);
    let ema21 = (currentPrice - 0.0002).toFixed(4);
    
    let signal = "WAIT";
    let trend = "SIDEWAYS";
    let macdText = "NEUTRAL";
    let confidence = Math.floor(Math.random() * 7) + 89;

    const patterns = ["Hammer", "Doji", "Marubozu", "Shooting Star", "Engulfing", "Spinning Top"];
    let detectedPattern = patterns[Math.floor(Math.random() * patterns.length)];

    if (rsi < 45 && detectedPattern === "Hammer") {
        signal = "BUY";
        trend = "UPTREND";
        macdText = "STRONG BUY";
    } else if (rsi > 55 && detectedPattern === "Shooting Star") {
        signal = "SELL";
        trend = "DOWNTREND";
        macdText = "STRONG SELL";
    } else {
        if(Math.random() > 0.5) {
            signal = "BUY"; trend = "UPTREND"; macdText = "BUY";
        } else {
            signal = "SELL"; trend = "DOWNTREND"; macdText = "SELL";
        }
    }

    let signalText = document.getElementById("signalText");
    signalText.innerText = signal;
    signalText.className = "signal " + signal.toLowerCase();

    document.getElementById("confidence").innerText = confidence + "%";
    document.getElementById("rsi").innerText = rsi;
    document.getElementById("pattern").innerText = detectedPattern;
    document.getElementById("ema9").innerText = ema9;
    document.getElementById("ema21").innerText = ema21;
    document.getElementById("macd").innerText = macdText;
    document.getElementById("trend").innerText = trend;
}
</script>

</body>
</html>
