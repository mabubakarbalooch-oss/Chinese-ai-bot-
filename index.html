<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🇵🇰 PAK AI SIGNAL X - V3 PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ min-height:100vh; display:flex; justify-content:center; align-items:center; background:#010a05; font-family:'Inter',sans-serif; color:white; overflow:hidden; }
        .container{ width:100%; max-width:420px; padding:20px; position:relative; }
        
        /* Background Glow */
        .container::after{ content:''; position:absolute; top:50%; left:50%; width:300px; height:300px; background:rgba(0,255,153,0.15); filter:blur(100px); z-index:-1; transform:translate(-50%, -50%); }

        .card{ background:rgba(2,20,11,0.95); border:2px solid rgba(0,255,153,0.2); border-radius:40px; padding:30px 20px; box-shadow:0 15px 50px rgba(0,0,0,0.8); text-align:center; }
        
        .title{ font-family:'Orbitron',sans-serif; font-size:24px; color:#00ff99; text-shadow:0 0 15px rgba(0,255,153,0.5); margin-bottom:20px; }
        
        select{ width:100%; padding:15px; border-radius:20px; background:#041a0e; border:1px solid #00ff99; color:white; font-weight:bold; margin-bottom:20px; outline:none; }

        /* Real Market Meter Area */
        #meter-area{ width:100%; height:140px; background:#000; border-radius:25px; margin-bottom:20px; border:1px solid rgba(255,255,255,0.1); overflow:hidden; }

        .btn{ width:100%; padding:20px; border-radius:50px; border:none; background:linear-gradient(90deg, #008f4a, #00ff99); color:#001a0d; font-family:'Orbitron',sans-serif; font-weight:900; font-size:15px; cursor:pointer; transition:0.3s; box-shadow:0 8px 20px rgba(0,255,153,0.3); }
        .btn:active{ transform:scale(0.95); }

        .loader{ width:100%; height:8px; background:#052614; border-radius:10px; margin-top:20px; display:none; overflow:hidden; }
        .fill{ width:0%; height:100%; background:#00ff99; transition:2s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Signal Result - Video Style */
        .result-box{ display:none; margin-top:25px; padding:25px; border-radius:35px; background:rgba(255,255,255,0.03); border:3px solid #00ff99; position:relative; }
        .signal-type{ font-family:'Orbitron',sans-serif; font-size:36px; font-weight:900; margin-bottom:5px; }
        .accuracy-box{ display:inline-block; padding:6px 15px; background:#00ff99; color:#001a0d; border-radius:15px; font-weight:900; font-size:12px; margin-bottom:15px; }
        .details{ font-size:11px; color:#aaa; line-height:1.6; }
        .timer{ font-size:14px; color:#ffaa44; font-weight:bold; margin-top:15px; font-family:'Orbitron',sans-serif; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card" id="loginBox">
            <h1 class="title">PAK AI LOGIN</h1>
            <input type="password" id="pass" placeholder="Enter Key" style="width:100%; padding:15px; border-radius:15px; margin-bottom:20px; background:#000; border:1px solid #00ff99; color:white; text-align:center;">
            <button class="btn" onclick="login()">ACTIVATE BOT</button>
        </div>

        <div class="card" id="botBox" style="display:none;">
            <h1 class="title">PAK AI SIGNAL X</h1>
            
            <select id="pair" onchange="loadMarket()">
                <option value="USDBRL">USD/BRL (OTC)</option>
                <option value="USDMXN">USD/MXN (OTC)</option>
                <option value="USDINR">USD/INR (LIVE)</option>
                <option value="EURUSD">EUR/USD (LIVE)</option>
            </select>

            <div id="meter-area">
                <div id="tv-widget"></div>
            </div>

            <button class="btn" id="scanBtn" onclick="getUltraSignal()">⚡ SCAN MARKET</button>

            <div class="loader" id="loader"><div class="fill" id="fill"></div></div>

            <div class="result-box" id="result">
                <div class="accuracy-box" id="acc">ACCURACY 99.1%</div>
                <div class="signal-type" id="sigText">---</div>
                <div class="details" id="desc">Analyzing Volatility...</div>
                <div class="timer" id="countdown">WAITING...</div>
            </div>
        </div>
    </div>

    <script>
        function login(){
            if(document.getElementById('pass').value === 'Pak786'){
                document.getElementById('loginBox').style.display='none';
                document.getElementById('botBox').style.display='block';
                loadMarket();
            } else { alert('Wrong Key!'); }
        }

        function loadMarket(){
            const pair = document.getElementById('pair').value;
            const widget = document.getElementById('tv-widget');
            widget.innerHTML = '';
            const script = document.createElement('script');
            script.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
            script.async = true;
            script.text = JSON.stringify({
                "interval": "1m", "width": "100%", "height": "100%", "isTransparent": true,
                "symbol": `FX_IDC:${pair}`, "showIntervalTabs": false, "locale": "en", "colorTheme": "dark"
            });
            widget.appendChild(script);
        }

        function getUltraSignal(){
            const btn = document.getElementById('scanBtn');
            const loader = document.getElementById('loader');
            const fill = document.getElementById('fill');
            const result = document.getElementById('result');

            btn.disabled = true;
            btn.innerText = "CONNECTING...";
            result.style.display = 'none';
            loader.style.display = 'block';
            fill.style.width = '0%';

            setTimeout(() => { fill.style.width = '100%'; }, 50);

            setTimeout(() => {
                const signals = [
                    { t: "CALL", c: "#00ff99", d: "STRONG BULLISH MOMENTUM DETECTED" },
                    { t: "PUT", c: "#ff4444", d: "STRONG BEARISH REJECTION DETECTED" }
                ];
                
                const pick = signals[Math.floor(Math.random()*2)];
                const accuracy = (98 + Math.random() * 1.8).toFixed(1);

                loader.style.display = 'none';
                btn.disabled = false;
                btn.innerText = "⚡ SCAN MARKET";
                result.style.display = 'block';
                result.style.borderColor = pick.c;

                document.getElementById('sigText').innerText = pick.t;
                document.getElementById('sigText').style.color = pick.c;
                document.getElementById('acc').innerText = `ACCURACY ${accuracy}%`;
                document.getElementById('desc').innerText = pick.d;

                // Precision Timer
                let time = 5;
                const timerDisplay = document.getElementById('countdown');
                const timer = setInterval(() => {
                    timerDisplay.innerText = `ENTRY IN: ${time}s`;
                    time--;
                    if(time < 0){
                        clearInterval(timer);
                        timerDisplay.innerText = "ENTER TRADE NOW!";
                        timerDisplay.style.color = "#00ff99";
                    }
                }, 1000);

            }, 2500);
        }
    </script>
</body>
</html>
