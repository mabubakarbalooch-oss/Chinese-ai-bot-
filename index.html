<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ABU BAKAR TRADER - TIGER ELITE AI BOT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Rajdhani', sans-serif;
}

body{
background:linear-gradient(135deg, #0a0f1c 0%, #1a2333 50%, #0a0f1c 100%);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:#fff;
}

.phone-frame{
width:100%;
max-width:380px;
background:linear-gradient(145deg, rgba(40,50,70,0.3) 0%, rgba(20,30,50,0.5) 100%);
border:1px solid rgba(100,150,255,0.3);
border-radius:45px;
padding:20px;
box-shadow:
 0 0 60px rgba(0,150,255,0.2),
  inset 0 1px 0 rgba(255,255,255,0.1),
  inset 0 -1px 0 rgba(0,0,0,0.5);
backdrop-filter:blur(20px);
position:relative;
overflow:hidden;
}

.phone-frame::before{
content:'';
position:absolute;
top:0;
left:0;
right:0;
height:40%;
background:linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 100%);
pointer-events:none;
}

.phone-frame::after{
content:'';
position:absolute;
inset:0;
background-image: 
  linear-gradient(90deg, rgba(0,200,255,0.05) 1px, transparent 1px),
  linear-gradient(180deg, rgba(0,200,255,0.05) 1px, transparent 1px);
background-size:20px 20px;
pointer-events:none;
opacity:0.5;
}

.header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:18px;
position:relative;
z-index:2;
}
.logo-ring{
width:50px;
height:50px;
border-radius:50%;
border:2px solid #00e5ff;
box-shadow:0 0 25px #00e5ff, inset 0 0 15px #00e5ff;
position:relative;
animation:glow-ring 2s infinite alternate;
}
@keyframes glow-ring{
from{box-shadow:0 0 15px #00e5ff, inset 0 0 10px #00e5ff;}
to{box-shadow:0 0 30px #00e5ff, inset 0 0 20px #00e5ff;}
}
.header-text h1{
font-family:'Orbitron',sans-serif;
font-size:15px;
font-weight:900;
color:#fff;
letter-spacing:1.5px;
text-shadow:0 0 15px rgba(0,200,255,0.6);
}
.header-text p{
font-size:11px;
color:#00e5ff;
letter-spacing:2px;
}

.dropdowns{
display:flex;
gap:10px;
margin-bottom:15px;
position:relative;
z-index:2;
}
.dropdown{
flex:1;
background:rgba(0,25,50,0.5);
border:1px solid rgba(0,200,255,0.4);
border-radius:15px;
padding:12px;
color:#fff;
font-size:13px;
font-weight:600;
backdrop-filter:blur(10px);
box-shadow:inset 0 0 10px rgba(0,200,255,0.1);
}

.live-box{
background:rgba(0,0,0,0.8);
border:1px solid rgba(0,255,100,0.5);
border-radius:18px;
padding:15px;
margin-bottom:15px;
box-shadow:0 0 25px rgba(0,255,100,0.3) inset;
position:relative;
z-index:2;
}
.live-header{
display:flex;
justify-content:space-between;
font-size:12px;
margin-bottom:10px;
}
.live-header .live{
color:#00ff64;
display:flex;
align-items:center;
gap:6px;
}
.live-dot{
width:8px;
height:8px;
background:#00ff64;
border-radius:50%;
box-shadow:0 0 15px #00ff64;
animation:pulse 1.5s infinite;
}
@keyframes pulse{
0%,100%{opacity:1; transform:scale(1);}
50%{opacity:0.5; transform:scale(1.2);}
}
.price{
font-family:'Orbitron',sans-serif;
font-size:32px;
color:#00ff64;
text-shadow:0 0 20px #00ff64;
margin-bottom:10px;
}
.chart{
height:70px;
background:linear-gradient(90deg, 
  #ff3b3b 0%, #ff3b3b 20%, 
  #00ff64 20%, #00ff64 40%,
  #ff3b3b 40%, #ff3b3b 60%,
  #00ff64 60%, #00ff64 80%,
  #ff3b3b 80%, #ff3b3b 100%);
opacity:0.9;
border-radius:10px;
position:relative;
overflow:hidden;
box-shadow:0 0 20px rgba(0,255,100,0.3);
}
.chart::before{
content:'';
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(180deg, transparent 0%, rgba(0,255,100,0.2) 50%, transparent 100%);
animation:wave 3s infinite linear;
}
@keyframes wave{
0%{transform:translateX(-100%);}
100%{transform:translateX(100%);}
}

.analysis-box{
background:rgba(0,25,50,0.5);
border:1px solid rgba(0,200,255,0.4);
border-radius:15px;
padding:15px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
position:relative;
z-index:2;
backdrop-filter:blur(10px);
box-shadow:inset 0 0 15px rgba(0,200,255,0.1);
}
.radar-icon{
width:40px;
height:40px;
border:2px solid #00e5ff;
border-radius:50%;
position:relative;
}
.radar-icon::before{
content:'';
position:absolute;
top:50%;
left:50%;
width:2px;
height:18px;
background:linear-gradient(to top,transparent,#00e5ff);
transform-origin:bottom;
animation:spin 2s linear infinite;
}
@keyframes spin{
100%{transform:rotate(360deg);}
}
.timer{
width:50px;
height:50px;
border:2px dashed #00e5ff;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-family:'Orbitron',sans-serif;
font-size:18px;
color:#00e5ff;
animation:rotate 10s linear infinite;
}
@keyframes rotate{
100%{transform:rotate(360deg);}
}

.analyzer-btn{
width:100%;
padding:16px;
background:linear-gradient(90deg, rgba(200,200,200,0.1), rgba(255,255,255,0.25), rgba(200,200,200,0.1));
border:1px solid rgba(0,200,255,0.5);
border-radius:15px;
color:#fff;
font-family:'Orbitron',sans-serif;
font-size:13px;
font-weight:900;
letter-spacing:1px;
margin-bottom:15px;
cursor:pointer;
box-shadow:0 0 25px rgba(0,200,255,0.4);
position:relative;
z-index:2;
transition:all 0.3s;
}
.analyzer-btn:hover{
background:linear-gradient(90deg, rgba(0,200,255,0.3), rgba(0,200,255,0.5), rgba(0,200,255,0.3));
box-shadow:0 0 40px rgba(0,200,255,0.6);
transform:scale(1.02);
}

.result-box{
background:rgba(0,0,0,0.8);
border:2px solid #00ff64;
border-radius:18px;
padding:18px;
text-align:center;
margin-bottom:15px;
box-shadow:0 0 35px rgba(0,255,100,0.5) inset;
position:relative;
z-index:2;
display:none;
}
.result-box h1{
font-family:'Orbitron',sans-serif;
font-size:45px;
color:#00ff64;
text-shadow:0 0 25px #00ff64, 0 0 40px #00ff64;
animation:glow-text 1.5s infinite alternate;
}
@keyframes glow-text{
from{text-shadow:0 0 20px #00ff64;}
to{text-shadow:0 0 30px #00ff64, 0 0 50px #00ff64;}
}

.info-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:15px;
position:relative;
z-index:2;
}
.info-card{
background:rgba(0,25,50,0.5);
border:1px solid rgba(0,200,255,0.4);
border-radius:12px;
padding:12px;
backdrop-filter:blur(10px);
box-shadow:inset 0 0 10px rgba(0,200,255,0.1);
}
.info-card .label{
font-size:11px;
color:#8892b0;
margin-bottom:5px;
}
.info-card .value{
font-size:15px;
font-weight:700;
color:#fff;
}
.info-card .value.green{
color:#00ff64;
text-shadow:0 0 10px #00ff64;
}

.lock-screen{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:#0a0f1c;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}
.lock-box{
width:90%;
max-width:320px;
background:rgba(0,25,50,0.8);
border:1px solid rgba(0,200,255,0.4);
border-radius:25px;
padding:30px;
text-align:center;
backdrop-filter:blur(15px);
box-shadow:0 0 40px rgba(0,200,255,0.3);
}
.lock-input{
width:100%;
padding:14px;
border:1px solid rgba(0,200,255,0.4);
border-radius:12px;
background:rgba(0,0,0,0.5);
color:#fff;
text-align:center;
margin:15px 0;
outline:none;
}
.lock-btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00e5ff,#00aaff);
color:#000;
font-weight:900;
cursor:pointer;
font-family:'Orbitron',sans-serif;
}
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <h2 style="color:#00e5ff;font-family:Orbitron">ACCESS KEY</h2>
    <input type="password" id="passInput" class="lock-input" placeholder="PASSWORD">
    <button class="lock-btn" onclick="unlock()">CONNECT BOT</button>
  </div>
</div>

<div class="phone-frame" id="botApp" style="display:none;">
  
  <div class="header">
    <div class="logo-ring"></div>
    <div class="header-text">
      <h1>ABU BAKAR TRADER</h1>
      <p>TIGER ELITE AI BOT</p>
    </div>
    <div style="font-size:24px;color:#00e5ff;">⚙️</div>
  </div>

  <div class="dropdowns">
    <select class="dropdown">
      <option>USD/BRL OTC</option>
      <option>EUR/USD OTC</option>
    </select>
    <select class="dropdown">
      <option>1M (Stable)</option>
      <option>5M</option>
    </select>
  </div>

  <div class="live-box">
    <div class="live-header">
      <div class="live"><div class="live-dot"></div> LIVE MARKET</div>
      <div>USD/BRL OTC</div>
    </div>
    <div class="price" id="price">1.2476</div>
    <div class="chart"></div>
  </div>

  <div class="analysis-box">
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="radar-icon"></div>
      <div>
        <h3 id="status" style="font-size:14px;">ANALYSIS COMPLETE</h3>
        <p style="font-size:11px;color:#8892b0;">Signal processed successfully.</p>
      </div>
    </div>
    <div class="timer" id="timer">00</div>
  </div>

  <button class="analyzer-btn" onclick="getSignal()">⚡ ANALYZER MARKET (GET SIGNAL)</button>

  <div class="result-box" id="resultBox">
    <h4 style="font-size:12px;color:#8892b0;margin-bottom:8px;">ANALYSIS RESULT</h4>
    <h1 id="signal">BUY</h1>
    <p id="confidence" style="font-size:14px;color:#00ff64;font-weight:700;">92% CONFIDENCE MATCH</p>
  </div>

  <div class="info-grid">
    <div class="info-card">
      <div class="label">RSI (14)</div>
      <div class="value" id="rsi">70</div>
    </div>
    <div class="info-card">
      <div class="label">TREND</div>
      <div class="value green" id="trend">STRONG UP</div>
    </div>
    <div class="info-card">
      <div class="label">EMA 9</div>
      <div class="value" id="ema9">1.2473</div>
    </div>
    <div class="info-card">
      <div class="label">EMA 21</div>
      <div class="value" id="ema21">1.2467</div>
    </div>
  </div>

  <div style="display:flex;justify-content:space-between;font-size:11px;color:#8892b0;">
    <div>ORDER ID</div>
    <div style="color:#00e5ff;font-family:'Orbitron',sans-serif;" id="orderId">TGR-257168</div>
  </div>
</div>

<script>
let scanning=false;

function unlock(){
  if(document.getElementById('passInput').value==='bakar786'){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('botApp').style.display='block';
    updatePrice();
  }else{
    alert('Wrong Password');
  }
}

function updatePrice(){
  setInterval(()=>{
    let base=1.2476;
    let change=(Math.random()-0.5)*0.002;
    document.getElementById('price').innerText=(base+change).toFixed(4);
  },2000);
}

function getSignal(){
  if(scanning)return;
  scanning=true;
  document.getElementById('status').innerText='ANALYZING...';
  
  let sec=3;
  document.getElementById('timer').innerText='0'+sec;
  
  let timerInterval=setInterval(()=>{
    sec--;
    document.getElementById('timer').innerText='0'+sec;
    if(sec<=0){
      clearInterval(timerInterval);
      scanning=false;
      document.getElementById('status').innerText='ANALYSIS COMPLETE';
      document.getElementById('resultBox').style.display='block';
      
      let signal=Math.random()>0.5?'BUY':'SELL';
      let conf=Math.floor(Math.random()*8)+92;
      
      document.getElementById('signal').innerText=signal;
      document.getElementById('signal').style.color=signal==='BUY'?'#00ff64':'#ff3b3b';
      document.getElementById('confidence').innerText=conf+'% CONFIDENCE MATCH';
    }
  },1000);
}
</script>
</body>
</html>
