<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ABU BAKAR TRADER - TIGER ELITE AI BOT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

body { background: #02060c; color: #e2e8f0; font-family: 'Rajdhani', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }

/* --- GLASSY CONTAINER WITH GLOW --- */
.bot-container {
    width: 100%; max-width: 440px; background: rgba(5, 13, 26, 0.95);
    border: 1px solid rgba(192, 192, 192, 0.4);
    border-radius: 28px; padding: 20px;
    box-shadow: 0 0 40px rgba(192, 192, 192, 0.2), inset 0 0 10px rgba(192, 192, 192, 0.1);
    backdrop-filter: blur(10px); display: none;
}

/* --- GLOWING ELEMENTS --- */
.avatar-ring {
    width: 60px; height: 60px; border-radius: 50%;
    border: 2px solid #C0C0C0;
    box-shadow: 0 0 20px #C0C0C0; /* Silver Glow */
    overflow: hidden;
}

.trigger-action-btn {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #1a1a1a, #000);
    color: #C0C0C0; border: 1px solid #C0C0C0;
    font-weight: 900; cursor: pointer;
    box-shadow: 0 0 20px rgba(192, 192, 192, 0.3);
    text-shadow: 0 0 5px #C0C0C0;
    transition: 0.3s;
}

.signal-txt-output.buy { color: #00ff9d; text-shadow: 0 0 20px #00ff9d; }
.signal-txt-output.sell { color: #ff3b3b; text-shadow: 0 0 20px #ff3b3b; }

.live-price { color: #C0C0C0; text-shadow: 0 0 10px rgba(192,192,192,0.5); }
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#02050a; display:flex; justify-content:center; align-items:center; z-index:9999;">
    <div class="lock-box" style="text-align:center; padding:25px; border:1px solid #C0C0C0; border-radius:20px;">
        <input type="password" id="terminalAccessKey" placeholder="ENTER ACCESS KEY" style="padding:10px; text-align:center; border-radius:10px;">
        <button onclick="unlockTerminalEngine()" style="padding:10px 20px; cursor:pointer;">CONNECT</button>
    </div>
</div>

<div class="bot-container" id="botApp">
    <div class="bot-header" style="display:flex; align-items:center; gap:15px; margin-bottom:20px;">
        <div class="avatar-ring">
            <img src="https://i.imgur.com/example_tiger.png" style="width:100%; height:100%; object-fit:cover;">
        </div>
        <div>
            <div style="font-family:'Orbitron'; font-weight:900;">ABU BAKAR TRADER</div>
            <div style="color:#C0C0C0; font-size:12px;">TIGER ELITE AI BOT</div>
        </div>
    </div>

    <div class="live-price" id="liveTickerPrice" style="font-size:32px; font-weight:900;">1.2476</div>
    
    <button class="trigger-action-btn" id="analyzeBtn" onclick="runMarketAnalysisSequence()">
        ⚡ ANALYZER MARKET (GET SIGNAL)
    </button>

    <div class="core-signal-block" style="text-align:center; margin-top:20px;">
        <div class="signal-txt-output wait" id="signalOutput" style="font-size:50px; font-weight:900;">WAIT</div>
    </div>
</div>

<script>
function unlockTerminalEngine(){
    if(document.getElementById("terminalAccessKey").value === "bakar786"){
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("botApp").style.display = "block";
    }
}
function runMarketAnalysisSequence(){
    const out = document.getElementById("signalOutput");
    out.innerText = "BUY";
    out.className = "signal-txt-output buy";
}
</script>
</body>
</html>
