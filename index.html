<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>LUBNA ABUBAKAR - LIVE AI SIGNAL BOT</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
}

body{
    background:#000;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

body::before{
    content:'';
    position:absolute;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at center,
    rgba(0,255,120,0.15),
    #000 70%);
}

.main{
    width:95%;
    max-width:420px;
    background:rgba(0,20,10,0.9);
    border:1px solid rgba(0,255,120,0.2);
    border-radius:35px;
    padding:30px 20px;
    box-shadow:
    0 0 25px rgba(0,255,120,0.25),
    inset 0 0 20px rgba(0,255,120,0.08);
    position:relative;
}

.logo{
    width:110px;
    height:110px;
    background:#00ff73;
    border-radius:50%;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    color:#000;
    font-weight:900;
    margin-bottom:25px;
    box-shadow:0 0 25px #00ff73;
}

.title{
    text-align:center;
    color:#fff;
    font-size:34px;
    font-weight:700;
    margin-bottom:12px;
}

.sub{
    text-align:center;
    color:#6dffba;
    font-size:18px;
    margin-bottom:35px;
}

.login-box{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.password-box{
    width:100%;
    height:65px;
    background:rgba(0,0,0,0.25);
    border:1px solid rgba(0,255,120,0.15);
    border-radius:18px;
    padding:0 20px;
    color:#fff;
    font-size:22px;
    outline:none;
}

.password-box::placeholder{
    color:#aaa;
}

.btn{
    width:100%;
    height:68px;
    border:none;
    border-radius:20px;
    background:#00ff73;
    color:#000;
    font-size:24px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 18px rgba(0,255,120,0.4);
}

.btn:active{
    transform:scale(0.97);
}

.select{
    width:100%;
    height:68px;
    border:none;
    border-radius:18px;
    background:#02180d;
    color:#fff;
    font-size:24px;
    padding:0 20px;
    outline:none;
    border:1px solid rgba(0,255,120,0.1);
}

.signal-box{
    width:100%;
    margin-top:30px;
    background:rgba(255,255,0,0.08);
    border:1px solid rgba(255,255,0,0.25);
    border-radius:25px;
    padding:35px 20px;
    text-align:center;
    box-shadow:0 0 15px rgba(255,255,0,0.1);
}

.signal{
    font-size:55px;
    color:#ffd500;
    font-weight:900;
}

.stats{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
    gap:15px;
}

.card{
    flex:1;
    background:#02180d;
    border:1px solid rgba(0,255,120,0.15);
    border-radius:22px;
    padding:22px 10px;
    text-align:center;
    color:#fff;
    box-shadow:0 0 12px rgba(0,255,120,0.08);
}

.card h3{
    color:#63ffbc;
    font-size:18px;
    margin-bottom:12px;
}

.card p{
    font-size:20px;
}

.market{
    width:100%;
    margin-top:25px;
    padding:22px;
    border-radius:20px;
    border:1px solid rgba(0,255,120,0.15);
    background:#031d10;
    color:#63ffbc;
    text-align:center;
    font-size:20px;
}

.buy{
    color:#00ff73;
}

.sell{
    color:#ff4040;
}

.wait{
    color:#ffd500;
}

</style>
</head>

<body>

<div class="main">

    <div class="logo">QX</div>

    <div class="title">LUBNA ABUBAKAR</div>

    <div class="sub">LIVE AI SIGNAL BOT</div>

    <div class="login-box">

        <input type="password"
        class="password-box"
        placeholder="ENTER PASSWORD">

        <button class="btn">
            UNLOCK SYSTEM
        </button>

        <select class="select">
            <option>SOL/USDT</option>
            <option>BTC/USDT</option>
            <option>ETH/USDT</option>
            <option>USD/BRL</option>
            <option>USD/MXN</option>
        </select>

        <button class="btn" onclick="generateSignal()">
            GENERATE SIGNAL
        </button>

    </div>

    <div class="signal-box">
        <div class="signal" id="signal">
            ⏳ WAIT
        </div>
    </div>

    <div class="stats">

        <div class="card">
            <h3>RSI</h3>
            <p id="rsi">71</p>
        </div>

        <div class="card">
            <h3>TREND</h3>
            <p id="trend">WAIT</p>
        </div>

        <div class="card">
            <h3>CONF</h3>
            <p id="conf">97%</p>
        </div>

    </div>

    <div class="market" id="market">
        MARKET NOT CLEAR
    </div>

</div>

<script>

function generateSignal(){

    let signals = ["BUY","SELL","WAIT"];

    let random = Math.floor(Math.random()*signals.length);

    let result = signals[random];

    let rsi = Math.floor(Math.random()*40)+50;

    let conf = Math.floor(Math.random()*10)+90;

    document.getElementById("rsi").innerHTML = rsi;

    document.getElementById("conf").innerHTML = conf + "%";

    document.getElementById("trend").innerHTML = result;

    let signalBox = document.getElementById("signal");

    let market = document.getElementById("market");

    if(result=="BUY"){

        signalBox.innerHTML="📈 BUY";
        signalBox.className="signal buy";

        market.innerHTML="UPTREND CONFIRMED";

    }

    else if(result=="SELL"){

        signalBox.innerHTML="📉 SELL";
        signalBox.className="signal sell";

        market.innerHTML="DOWNTREND CONFIRMED";

    }

    else{

        signalBox.innerHTML="⏳ WAIT";
        signalBox.className="signal wait";

        market.innerHTML="MARKET NOT CLEAR";

    }

}

</script>

</body>
</html>
