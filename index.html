<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIGER ELITE AI BOT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');
        
        body { background: #080b10; color: #fff; font-family: 'Rajdhani', sans-serif; display: flex; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .bot-frame { width: 100%; max-width: 450px; background: #0f141d; border: 2px solid #d4af37; border-radius: 20px; padding: 20px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); }
        
        /* Profile & Header */
        .avatar { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #d4af37; margin: 0 auto 15px; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        h1 { color: #d4af37; text-align: center; font-family: 'Orbitron'; font-size: 20px; margin: 0; }
        .sub-title { text-align: center; color: #ffaa00; font-size: 12px; letter-spacing: 2px; }

        /* Stats & Inputs */
        .grid-status { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .box { background: #161c27; padding: 10px; border-radius: 8px; border: 1px solid #333; text-align: center; font-size: 13px; }
        
        /* Signal Result */
        .signal-box { border: 2px solid #d4af37; padding: 20px; border-radius: 15px; text-align: center; margin-top: 20px; }
        .signal-text { font-size: 50px; font-weight: bold; color: #00ff00; font-family: 'Orbitron'; margin: 10px 0; }
        
        .btn { width: 100%; padding: 15px; background: linear-gradient(90deg, #d4af37, #b8860b); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 18px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="bot-frame">
    <div class="avatar">
        <img src="https://i.imgur.com/W2SHevC.jpeg" alt="Abu Bakar">
    </div>
    <h1>ABU BAKAR TRADER</h1>
    <p class="sub-title">TIGER ELITE AI BOT</p>

    <div class="grid-status">
        <div class="box">SERVER: SECURE</div>
        <div class="box">ACCURACY: 95.4%</div>
    </div>

    <select style="width:100%; padding:10px; background:#161c27; color:#fff; border-radius:8px;">
        <option>USD/BRL OTC</option>
    </select>

    <div class="signal-box">
        <p>ANALYSIS RESULT</p>
        <div id="signal" class="signal-text">WAIT</div>
        <div id="accuracy">92% ACCURACY MATCH</div>
    </div>

    <button class="btn" onclick="startAnalysis()">GET SIGNAL</button>

    <div class="grid-status" style="margin-top:20px;">
        <div class="box">RSI: 61</div>
        <div class="box">TREND: STRONG UP</div>
        <div class="box">EMA 9: 1.2450</div>
        <div class="box">EMA 21: 1.2444</div>
    </div>
</div>

<script>
    function startAnalysis() {
        document.getElementById('signal').innerText = "BUY";
        document.getElementById('signal').style.color = "#00ff00";
    }
</script>

</body>
</html>
