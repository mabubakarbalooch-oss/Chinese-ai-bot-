<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>ABU BAKAR TRADER - QUOTEX SIGNAL BOT</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:10px;
overflow-x:hidden;
}

.bot{
width:100%;
max-width:390px;
background:#050505;
border:2px solid #ffd700;
border-radius:25px;
padding:15px;
box-shadow:0 0 25px rgba(255,215,0,0.4);
}

.logo{
width:85px;
height:85px;
border-radius:50%;
background:linear-gradient(135deg,#ffd700,#ffb300);
display:flex;
align-items:center;
justify-content:center;
margin:auto;
font-size:32px;
font-weight:800;
color:#000;
box-shadow:0 0 20px rgba(255,215,0,0.6);
}

.title{
text-align:center;
font-size:28px;
font-weight:800;
margin-top:12px;
color:#ffd700;
}

.sub{
text-align:center;
font-size:12px;
color:#999;
margin-top:4px;
margin-bottom:15px;
}

.select{
width:100%;
background:#0d0d0d;
border:1px solid #ffd700;
border-radius:15px;
padding:14px;
color:#fff;
font-size:16px;
margin-bottom:12px;
outline:none;
}

.pairs{
display:flex;
flex-wrap:wrap;
gap:8px;
justify-content:center;
margin-bottom:12px;
}

.pair{
padding:8px 12px;
border-radius:12px;
background:#111;
border:1px solid #333;
color:#fff;
font-size:13px;
}

.chart{
height:240px;
background:#070707;
border-radius:20px;
border:1px solid #222;
padding:12px;
position:relative;
overflow:hidden;
}

.live{
font-size:14px;
color:#ffd700;
font-weight:700;
}

.price{
font-size:42px;
font-weight:800;
color:#00ff88;
margin-top:5px;
}

.candles{
position:absolute;
bottom:15px;
left:10px;
right:10px;
height:110px;
display:flex;
align-items:flex-end;
gap:4px;
}

.bar{
width:7px;
border-radius:5px;
animation:pulse 1s infinite alternate;
}

.green{
background:#00ff88;
box-shadow:0 0 10px #00ff88;
}

.red{
background:#ff3b3b;
box-shadow:0 0 10px #ff3b3b;
}

@keyframes pulse{
from{opacity:0.6;}
to{opacity:1;}
}

.btn{
width:100%;
padding:17px;
border:none;
border-radius:18px;
margin-top:14px;
font-size:28px;
font-weight:800;
cursor:pointer;
background:linear-gradient(135deg,#ffd700,#ffb300);
color:#000;
box-shadow:0 0 20px rgba(255,215,0,0.4);
}

.signalBox{
margin-top:15px;
background:#080808;
border-radius:20px;
padding:18px;
border:1px solid #222;
text-align:center;
}

.signal{
font-size:62px;
font-weight:800;
}

.buy{
color:#00ff88;
text-shadow:0 0 15px #00ff88;
}

.sell{
color:#ff3b3b;
text-shadow:0 0 15px #ff3b3b;
}

.wait{
color:#ffaa00;
text-shadow:0 0 15px #ffaa00;
}

.conf{
font-size:46px;
font-weight:800;
margin-top:10px;
color:#ffd700;
}

.info{
margin-top:12px;
line-height:1.9;
font-size:15px;
color:#ddd;
}

.lock{
margin-top:10px;
font-size:12px;
text-align:center;
color:#888;
}

</style>
</head>

<body>

<div class="bot">

<div class="logo">QX</div>

<div class="title">ABU BAKAR TRADER</div>

<div class="sub">QUOTEX LIVE SIGNAL BOT</div>

<select class="select" id="pair">

<option value="usdbrl">🇧🇷 USD/BRL OTC</option>
<option value="usdmxn">🇲🇽 USD/MXN OTC</option>
<option value="usdinr">🇮🇳 USD/INR OTC</option>
<option value="usdpkr">🇵🇰 USD/PKR OTC</option>
<option value="eurusd">🇺🇸 EUR/USD OTC</option>
<option value="gbpusd">🇬🇧 GBP/USD OTC</option>
<option value="btcusdt">₿ BTC/USDT LIVE</option>

</select>

<select class="select" id="timeframe">

<option value="15">15 Seconds</option>
<option value="30">30 Seconds</option>
<option value="60">1 Minute</option>
<option value="120">2 Minutes</option>
<option value="300">5 Minutes</option>

</select>

<div class="pairs">

<div class="pair">🇧🇷 USD/BRL</div>
<div class="pair">🇲🇽 USD/MXN</div>
<div class="pair">🇮🇳 USD/INR</div>
<div class="pair">🇵🇰 USD/PKR</div>
<div class="pair">🇺🇸 EUR/USD</div>
<div class="pair">🇬🇧 GBP/USD</div>

</div>

<div class="chart">

<div class="live">LIVE MARKET</div>

<div class="price" id="price">0.0000</div>

<div class="candles" id="candles"></div>

</div>

<button class="btn" onclick="generateSignal()">

GET SIGNAL

</button>

<div class="signalBox">

<div class="signal wait" id="signal">

WAIT

</div>

<div class="conf" id="conf">

0%

</div>

<div class="info">

<div id="rsi">RSI : 0</div>

<div id="ema9">EMA 9 : 0</div>

<div id="ema21">EMA 21 : 0</div>

<div id="macd">MACD : 0</div>

<div id="trend">TREND : WAIT</div>

<div id="time">TIMEFRAME : 15s</div>

</div>

</div>

<div class="lock">

🔒 PASSWORD : 786786

</div>

</div>

<script>

let currentPrice = 5.0000;
let history = [];

function randomMove(){

let move = (Math.random() - 0.5) * 0.02;

currentPrice += move;

if(currentPrice <= 0){
currentPrice = 1;
}

document.getElementById("price").innerHTML =
currentPrice.toFixed(4);

history.push(currentPrice);

if(history.length > 100){
history.shift();
}

drawCandles();

}

setInterval(randomMove,800);

function drawCandles(){

let wrap = document.getElementById("candles");

wrap.innerHTML = "";

for(let i=0;i<40;i++){

let h = Math.floor(Math.random()*90)+20;

let div = document.createElement("div");

div.classList.add("bar");

if(Math.random()>0.5){
div.classList.add("green");
}else{
div.classList.add("red");
}

div.style.height = h+"px";

wrap.appendChild(div);

}

}

function ema(data,period){

if(data.length < period) return 0;

let k = 2/(period+1);

let ema = data[0];

for(let i=1;i<data.length;i++){

ema = data[i]*k + ema*(1-k);

}

return ema;

}

function rsi(data,period=14){

if(data.length < period+1) return 50;

let gains=0;
let losses=0;

for(let i=1;i<=period;i++){

let diff=data[i]-data[i-1];

if(diff>=0){
gains+=diff;
}else{
losses-=diff;
}

}

if(losses===0) return 100;

let rs=gains/losses;

return 100-(100/(1+rs));

}

function macdSignal(){

let ema12 = ema(history,12);

let ema26 = ema(history,26);

return ema12 - ema26;

}

function generateSignal(){

if(history.length < 30){

alert("Waiting Live Market Data...");

return;

}

let RSI = rsi(history,14);

let EMA9 = ema(history,9);

let EMA21 = ema(history,21);

let MACD = macdSignal();

let signal = "WAIT";

let cls = "wait";

let conf = 70;

if(EMA9 > EMA21 && RSI > 55 && MACD > 0){

signal = "BUY";

cls = "buy";

conf = 92;

}

else if(EMA9 < EMA21 && RSI < 45 && MACD < 0){

signal = "SELL";

cls = "sell";

conf = 91;

}

document.getElementById("signal").innerHTML = signal;

document.getElementById("signal").className =
"signal "+cls;

document.getElementById("conf").innerHTML =
conf+"%";

document.getElementById("rsi").innerHTML =
"RSI : "+RSI.toFixed(1);

document.getElementById("ema9").innerHTML =
"EMA 9 : "+EMA9.toFixed(4);

document.getElementById("ema21").innerHTML =
"EMA 21 : "+EMA21.toFixed(4);

document.getElementById("macd").innerHTML =
"MACD : "+MACD.toFixed(4);

document.getElementById("trend").innerHTML =
"TREND : "+signal;

document.getElementById("time").innerHTML =
"TIMEFRAME : "+
document.getElementById("timeframe").value+"s";

}

drawCandles();

</script>

</body>
</html>
