<script>

let sound=true;
let vibration=true;
let scanning=false;
let closes=[];
let socket;

/* CHART */

let chart =
LightweightCharts.createChart(
document.getElementById('chart'),
{
layout:{
background:{color:'#07101d'},
textColor:'#DDD'
},
grid:{
vertLines:{color:'#111'},
horzLines:{color:'#111'}
},
width:350,
height:200
}
);

let candleSeries =
chart.addCandlestickSeries({
upColor:'#00ff88',
downColor:'#ff3b5c',
borderVisible:false,
wickUpColor:'#00ff88',
wickDownColor:'#ff3b5c'
});

/* LOGIN */

function login(){

if(document.getElementById('key').value==='Pak786'){

document.getElementById('loginPage').style.display='none';

document.getElementById('mainPage').style.display='block';

connect();

}else{

alert('Wrong Key');

}

}

/* MARKET NAME */

function marketName(pair){

if(pair==="btcusdt") return "BTC/USDT";
if(pair==="ethusdt") return "ETH/USDT";
if(pair==="bnbusdt") return "BNB/USDT";
if(pair==="xrpusdt") return "XRP/USDT";
if(pair==="solusdt") return "SOL/USDT";
if(pair==="usdtbrl") return "USD/BRL";
if(pair==="usdtinr") return "USD/INR";
if(pair==="usdtmxn") return "USD/MXN";

return pair.toUpperCase();

}

/* CONNECT */

function connect(){

let pair =
document.getElementById('pair').value;

document.getElementById('marketTag').innerText =
marketName(pair)+" LIVE";

closes=[];

if(socket){

socket.close();

}

socket = new WebSocket(
`wss://stream.binance.com:9443/ws/${pair}@kline_1m`
);

socket.onmessage=function(event){

let msg=JSON.parse(event.data);

let k=msg.k;

let candle={

time:k.t/1000,
open:parseFloat(k.o),
high:parseFloat(k.h),
low:parseFloat(k.l),
close:parseFloat(k.c)

};

candleSeries.update(candle);

document.getElementById('price').innerText =
candle.close.toFixed(4);

closes.push(candle.close);

if(closes.length>100){

closes.shift();

}

updateIndicators();

};

}

document.getElementById('pair').onchange=function(){

connect();

}

/* RSI */

function RSI(period=14){

if(closes.length<period){

return 50;

}

let gains=0;
let losses=0;

for(let i=1;i<period;i++){

let diff=
closes[closes.length-i]-
closes[closes.length-i-1];

if(diff>=0){

gains+=diff;

}else{

losses-=diff;

}

}

let rs=gains/(losses||1);

return 100-(100/(1+rs));

}

/* EMA */

function EMA(period){

if(closes.length<period){

return 0;

}

let k=2/(period+1);

let ema=closes[0];

for(let i=1;i<closes.length;i++){

ema=
closes[i]*k+
ema*(1-k);

}

return ema;

}

/* MACD */

function MACD(){

return EMA(12)-EMA(26);

}

/* BBANDS */

function BBANDS(period=20){

if(closes.length<period){

return{
upper:0,
lower:0
};

}

let slice=
closes.slice(-period);

let sma=
slice.reduce((a,b)=>a+b,0)/period;

let variance=
slice.reduce((a,b)=>
a+Math.pow(b-sma,2),0)/period;

let std=Math.sqrt(variance);

return{

upper:sma+(2*std),
lower:sma-(2*std)

};

}

/* UPDATE INDICATORS */

function updateIndicators(){

let rsi=RSI();
let ema9=EMA(9);
let ema21=EMA(21);
let macd=MACD();

document.getElementById('indicatorData').innerHTML=

'RSI : '+rsi.toFixed(1)+
'<br>EMA9 : '+ema9.toFixed(2)+
'<br>EMA21 : '+ema21.toFixed(2)+
'<br>MACD : '+macd.toFixed(2);

}

/* AI SIGNAL */

function generateSignal(){

if(closes.length<30){

return;

}

let rsi=RSI();

let ema9=EMA(9);

let ema21=EMA(21);

let ema50=EMA(50);

let macd=MACD();

let bb=BBANDS();

let last=
closes[closes.length-1];

let prev=
closes[closes.length-2];

let strongUp=
last>ema9 &&
ema9>ema21 &&
ema21>ema50;

let strongDown=
last<ema9 &&
ema9<ema21 &&
ema21<ema50;

let bullish=
(last-prev)>0;

let bearish=
(last-prev)<0;

/* SIDEWAYS FILTER */

let recent=
closes.slice(-15);

let max=
Math.max(...recent);

let min=
Math.min(...recent);

let range=max-min;

let sideways=
(range/last)<0.0015;

let buy=0;
let sell=0;

/* RSI */

if(rsi<32){

buy+=2;

}

if(rsi>68){

sell+=2;

}

/* EMA */

if(strongUp){

buy+=3;

}

if(strongDown){

sell+=3;

}

/* MACD */

if(macd>0){

buy+=2;

}

if(macd<0){

sell+=2;

}

/* BB */

if(last<bb.lower){

buy+=1;

}

if(last>bb.upper){

sell+=1;

}

/* MOMENTUM */

if(bullish){

buy+=1;

}

if(bearish){

sell+=1;

}

/* SIDEWAYS */

if(sideways){

buy=0;
sell=0;

}

/* FINAL */

let signal='WAIT';
let confidence=70;
let badge='WEAK SIGNAL';

if(buy>=6 && buy>sell){

signal='CALL';

confidence=
88+Math.floor(Math.random()*10);

badge='STRONG BUY';

}

else if(sell>=6 && sell>buy){

signal='PUT';

confidence=
88+Math.floor(Math.random()*10);

badge='STRONG SELL';

}

/* SHOW */

document.getElementById('signalBox').style.display='block';

let signalBox=
document.getElementById('signal');

signalBox.innerText=signal;

signalBox.className='signal-text';

if(signal==='CALL'){

signalBox.classList.add('call');

play(1000);

}

else if(signal==='PUT'){

signalBox.classList.add('put');

play(400);

}

else{

signalBox.classList.add('wait');

}

document.getElementById('confidence').innerText =
confidence+'%';

document.getElementById('badge').innerText =
badge;

document.getElementById('details').innerHTML=

'RSI : '+rsi.toFixed(1)+

'<br>EMA9 : '+ema9.toFixed(2)+

'<br>EMA21 : '+ema21.toFixed(2)+

'<br>EMA50 : '+ema50.toFixed(2)+

'<br>MACD : '+macd.toFixed(2)+

'<br>Trend : '+

(strongUp?'BULLISH':
strongDown?'BEARISH':
'SIDEWAYS');

/* HISTORY */

let history=
document.getElementById('historyBox');

let time=
new Date().toLocaleTimeString();

history.innerHTML=

'['+time+'] '+signal+
' • '+confidence+'%<br>'+
history.innerHTML;

}

/* SCAN */

function startScan(){

if(scanning) return;

scanning=true;

document.getElementById('scanLine')
.classList.add('active');

let btn=
document.getElementById('scanBtn');

btn.innerText='SCANNING...';

btn.classList.add('stop');

setTimeout(()=>{

generateSignal();

document.getElementById('scanLine')
.classList.remove('active');

btn.innerText='START AI SCAN';

btn.classList.remove('stop');

if(vibration &&
navigator.vibrate){

navigator.vibrate(300);

}

scanning=false;

},3000);

}

/* SOUND */

function play(freq){

if(!sound) return;

let ctx=
new(window.AudioContext||
window.webkitAudioContext)();

let osc=
ctx.createOscillator();

osc.frequency.value=freq;

osc.connect(ctx.destination);

osc.start();

osc.stop(ctx.currentTime+0.2);

}

/* TOGGLE */

document.getElementById('soundToggle')
.onclick=function(){

sound=!sound;

this.classList.toggle('active');

}

document.getElementById('vibToggle')
.onclick=function(){

vibration=!vibration;

this.classList.toggle('active');

}

</script>
