<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>ABU BAKAR TRADER - ULTRA VIP</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Plus Jakarta Sans',sans-serif;
}

body{
background:#060713;
display:flex;
justify-content:center;
padding:8px;
color:#fff;
background-image:
radial-gradient(circle at 10% 20%, rgba(0,240,255,0.15), transparent 40%),
radial-gradient(circle at 90% 80%, rgba(255,0,127,0.15), transparent 40%);
background-attachment:fixed;
}

.lock-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(6,7,19,0.92);
z-index:9999;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
backdrop-filter:blur(20px);
}

.lock-box{
width:100%;
max-width:350px;
background:rgba(255,255,255,0.03);
border:1px solid rgba(255,255,255,0.1);
border-radius:24px;
padding:35px 25px;
text-align:center;
backdrop-filter:blur(10px);
box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

.lock-title{
font-family:'Orbitron',sans-serif;
font-size:20px;
font-weight:900;
color:#00f0ff;
margin-bottom:20px;
letter-spacing:2px;
}

.lock-input{
width:100%;
padding:15px;
background:rgba(0,0,0,0.4);
border:1px solid rgba(0,240,255,0.3);
border-radius:14px;
color:#fff;
font-size:16px;
text-align:center;
outline:none;
margin-bottom:20px;
letter-spacing:5px;
font-family:'Orbitron',sans-serif;
}

.lock-btn{
width:100%;
padding:15px;
background:linear-gradient(135deg,#00f0ff,#ff007f);
border:none;
border-radius:14px;
color:#fff;
font-size:15px;
font-weight:800;
font-family:'Orbitron',sans-serif;
cursor:pointer;
}

.error-msg{
color:#ff4757;
font-size:13px;
margin-top:12px;
display:none;
font-weight:700;
}

.container{
width:100%;
max-width:390px;
background:rgba(255,255,255,0.02);
border:1px solid rgba(255,255,255,0.08);
border-radius:28px;
padding:20px 16px;
backdrop-filter:blur(15px);
box-shadow:0 25px 50px rgba(0,0,0,0.5);
filter:blur(12px);
pointer-events:none;
transition:0.5s;
}

.logo-container{
position:relative;
width:85px;
height:85px;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
}

.logo-glow{
position:absolute;
width:100%;
height:100%;
background:radial-gradient(circle, rgba(0,240,255,0.4), transparent 70%);
border-radius:50%;
animation:pulseGlow 3s infinite ease-in-out;
}

@keyframes pulseGlow{
0%,100%{transform:scale(0.95);opacity:0.5;}
50%{transform:scale(1.2);opacity:0.9;}
}

.logo{
width:100%;
height:100%;
background:rgba(255,255,255,0.03);
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
border:1px solid rgba(255,255,255,0.15);
position:relative;
z-index:2;
}

.logo::before{
content:'QX';
font-family:'Orbitron',sans-serif;
font-size:32px;
font-weight:900;
background:linear-gradient(135deg,#fff,#00f0ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.title{
font-family:'Orbitron',sans-serif;
text-align:center;
font-size:21px;
font-weight:900;
margin-top:16px;
}

.subtitle{
text-align:center;
font-size:10px;
color:#00f0ff;
margin-bottom:20px;
letter-spacing:3px;
font-weight:700;
}

.select{
width:100%;
padding:15px;
background:rgba(0,0,0,0.3);
border:1px solid rgba(255,255,255,0.08);
border-radius:16px;
color:#fff;
font-size:15px;
margin-bottom:12px;
outline:none;
}

.pairs{
display:flex;
flex-wrap:wrap;
gap:6px;
justify-content:center;
margin-bottom:16px;
}

.pair{
background:rgba(255,255,255,0.03);
border:1px solid rgba(255,255,255,0.05);
padding:9px 14px;
border-radius:12px;
font-size:11px;
cursor:pointer;
color:#a0a0b0;
}

.pair.active{
border-color:#00f0ff;
background:rgba(0,240,255,0.1);
color:#00f0ff;
font-weight:700;
}

.chart-box{
position:relative;
height:220px;
background:rgba(0,0,0,0.4);
border-radius:22px;
padding:14px;
overflow:hidden;
border:1px solid rgba(255,255,255,0.05);
}

.live{
font-family:'Orbitron',sans-serif;
font-size:11px;
font-weight:700;
color:#a0a0b0;
letter-spacing:1.5px;
display:flex;
align-items:center;
gap:6px;
}

.live::before{
content:'';
width:6px;
height:6px;
background:#00ff88;
border-radius:50%;
box-shadow:0 0 8px #00ff88;
}

.price{
font-size:42px;
font-weight:900;
color:#00ff88;
margin-top:2px;
font-family:monospace;
}

.candles{
position:absolute;
bottom:15px;
left:14px;
right:14px;
height:100px;
display:flex;
align-items:flex-end;
gap:5px;
overflow:hidden;
}

.candle{
width:10px;
border-radius:4px;
flex-shrink:0;
transition:0.3s;
}

.green{
background:#00ff88;
box-shadow:0 0 10px rgba(0,255,136,0.7);
}

.red{
background:#ff3b3b;
box-shadow:0 0 10px rgba(255,59,59,0.7);
}

.scan-line{
position:absolute;
top:0;
bottom:0;
width:4px;
background:linear-gradient(to right, transparent,#00f0ff,transparent);
box-shadow:0 0 20px #00f0ff;
display:none;
animation:scan 2s linear infinite;
z-index:5;
}

@keyframes scan{
0%{left:-10px;}
100%{left:100%;}
}

.btn{
font-family:'Orbitron',sans-serif;
width:100%;
padding:16px;
border:none;
border-radius:16px;
margin-top:16px;
background:linear-gradient(135deg,#00f0ff,#0072ff);
color:#fff;
font-size:15px;
font-weight:900;
cursor:pointer;
}

.btn:disabled{
opacity:0.5;
cursor:not-allowed;
}

.result{
margin-top:16px;
background:rgba(0,0,0,0.4);
border-radius:22px;
padding:18px;
border:1px solid rgba(255,255,255,0.08);
display:none;
}

.signal{
font-family:'Orbitron',sans-serif;
font-size:52px;
font-weight:900;
text-align:center;
}

.buy{
color:#00ff88;
}

.sell{
color:#ff3b3b;
}

.wait{
color:#00f0ff;
}

.conf{
font-family:'Orbitron',sans-serif;
text-align:center;
font-size:30px;
font-weight:900;
margin-top:5px;
}

.info-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:12px;
font-size:13px;
}

.info-item{
background:rgba(0,0,0,0.2);
padding:10px;
border-radius:12px;
}

.info-item span{
float:right;
font-weight:700;
}

.footer{
margin-top:18px;
text-align:center;
font-size:10px;
color:#444760;
letter-spacing:1.5px;
font-weight:700;
}
</style>
</head>

<body>

<div class="lock-screen" id="lockScreen">
<div class="lock-box">
<div class="lock-title">QX AI TERMINAL</div>

<input type="password" class="lock-input" id="passInput" placeholder="ACCESS KEY">

<button class="lock-btn" onclick="checkPassword()">
UNLOCK TERMINAL
</button>

<div class="error-msg" id="errorMsg">
❌ INVALID ACCESS KEY
</div>
</div>
</div>

<div class="container" id="botContainer">

<div class="logo-container">
<div class="logo-glow"></div>
<div class="logo"></div>
</div>

<div class="title">ABU BAKAR TRADER</div>
<div class="subtitle">ULTRA VIP GLASS BOT</div>

<select class="select" id="pair" onchange="syncPairSelection(this.value)">
<option value="USD/BRL">🇧🇷 USD/BRL OTC</option>
<option value="USD/MXN">🇲🇽 USD/MXN OTC</option>
<option value="USD/INR">🇮🇳 USD/INR OTC</option>
<option value="USD/PKR">🇵🇰 USD/PKR OTC</option>
<option value="EUR/USD">🇺🇸 EUR/USD OTC</option>
<option value="GBP/USD">🇬🇧 GBP/USD OTC</option>
</select>

<select class="select" id="time">
<option>15 Seconds</option>
<option>30 Seconds</option>
<option>1 Minute</option>
<option>5 Minutes</option>
</select>

<div class="pairs" id="pairBadges">
<div class="pair active" onclick="selectBadge('USD/BRL')">🇧🇷 USD/BRL</div>
<div class="pair" onclick="selectBadge('USD/MXN')">🇲🇽 USD/MXN</div>
<div class="pair" onclick="selectBadge('USD/INR')">🇮🇳 USD/INR</div>
<div class="pair" onclick="selectBadge('USD/PKR')">🇵🇰 USD/PKR</div>
<div class="pair" onclick="selectBadge('EUR/USD')">🇺🇸 EUR/USD</div>
<div class="pair" onclick="selectBadge('GBP/USD')">🇬🇧 GBP/USD</div>
</div>

<div class="chart-box">

<div class="live">SECURE LIVE FEED</div>

<div class="price" id="price">1.2500</div>

<div class="scan-line" id="scanLine"></div>

<div class="candles" id="candles"></div>

</div>

<button class="btn" id="actionBtn" onclick="getSignal()">
ANALYZE MARKET
</button>

<div class="result" id="resultBox">

<div class="signal wait" id="signalText">WAIT</div>

<div class="conf" id="confidence">85%</div>

<div class="info-grid">

<div class="info-item">
RSI
<span id="rsi">50</span>
</div>

<div class="info-item">
PATTERN
<span id="pattern">SIDEWAYS</span>
</div>

<div class="info-item">
EMA 9
<span id="ema9">1.2500</span>
</div>

<div class="info-item">
EMA 21
<span id="ema21">1.2500</span>
</div>

<div class="info-item">
MACD
<span id="macd">WAIT</span>
</div>

<div class="info-item">
TREND
<span id="trend">SIDEWAYS</span>
</div>

</div>
</div>

<div class="footer">
DESIGNED FOR HIGH-PREMIUM TRADING
</div>

</div>

<script>

function checkPassword(){

const input=document.getElementById("passInput").value;

const correctPassword="bakar786";

const lockScreen=document.getElementById("lockScreen");

const botContainer=document.getElementById("botContainer");

const errorMsg=document.getElementById("errorMsg");

if(input===correctPassword){

lockScreen.style.display="none";

botContainer.style.filter="none";

botContainer.style.pointerEvents="auto";

initCandles();

}else{

errorMsg.style.display="block";

document.getElementById("passInput").value="";

}
}

document.getElementById("passInput").addEventListener("keyup",function(event){

if(event.key==="Enter"){
checkPassword();
}

});

const candlesContainer=document.getElementById("candles");

const priceElement=document.getElementById("price");

let candleData=[];

let currentPrice=1.2500;

const pairBases={
"USD/BRL":4.9710,
"USD/MXN":16.8520,
"USD/INR":83.3100,
"USD/PKR":278.2500,
"EUR/USD":1.0845,
"GBP/USD":1.2615
};

function initCandles(){

candlesContainer.innerHTML="";

candleData=[];

let selectedPair=document.getElementById("pair").value;

currentPrice=pairBases[selectedPair] || 1.2500;

for(let i=0;i<28;i++){

let change=(Math.random()-0.5)*0.0015;

currentPrice+=change;

let height=Math.floor(Math.random()*60)+20;

let isGreen=change>=0;

candleData.push({
price:currentPrice,
isGreen:isGreen,
height:height
});

let c=document.createElement("div");

c.classList.add("candle",isGreen ? "green":"red");

c.style.height=height+"px";

candlesContainer.appendChild(c);

}

priceElement.innerText=currentPrice.toFixed(4);

}

function updateLivePrice(){

if(document.getElementById("lockScreen").style.display==="none"){

let oldPrice=currentPrice;

let change=(Math.random()-0.5)*0.0005;

currentPrice+=change;

priceElement.innerText=currentPrice.toFixed(4);

priceElement.style.color=currentPrice>=oldPrice ? "#00ff88":"#ff3b3b";

candleData.shift();

let move=currentPrice>=oldPrice;

let newHeight=Math.floor(Math.random()*60)+20;

candleData.push({
price:currentPrice,
isGreen:move,
height:newHeight
});

candlesContainer.innerHTML="";

candleData.forEach(c=>{

let div=document.createElement("div");

div.className="candle "+(c.isGreen ? "green":"red");

div.style.height=c.height+"px";

candlesContainer.appendChild(div);

});

}
}

setInterval(updateLivePrice,1000);

function syncPairSelection(val){

let badges=document.querySelectorAll("#pairBadges .pair");

badges.forEach(b=>{

if(b.innerText.includes(val)){
b.classList.add("active");
}else{
b.classList.remove("active");
}

});

initCandles();

}

function selectBadge(val){

document.getElementById("pair").value=val;

syncPairSelection(val);

}

function getSignal(){

let scan=document.getElementById("scanLine");

let btn=document.getElementById("actionBtn");

scan.style.display="block";

btn.disabled=true;

document.getElementById("resultBox").style.display="none";

setTimeout(()=>{

scan.style.display="none";

btn.disabled=false;

generateSmartSignal();

},2500);

}

function generateSmartSignal(){

document.getElementById("resultBox").style.display="block";

let greenCandles=candleData.filter(c=>c.isGreen).length;

let redCandles=candleData.length-greenCandles;

let rsi=Math.floor((greenCandles/candleData.length)*100);

let ema9=currentPrice+((greenCandles-redCandles)*0.0001);

let ema21=currentPrice-((redCandles-greenCandles)*0.00005);

let macdValue=ema9-ema21;

let detectedPattern="SIDEWAYS";

if(greenCandles>redCandles+5){

detectedPattern="BULLISH";

}else if(redCandles>greenCandles+5){

detectedPattern="BEARISH";

}

let signal="WAIT";

let trend="SIDEWAYS";

let macdText="WAIT";

let confidence=78;

if(

rsi<45 &&
ema9>ema21 &&
macdValue>0 &&
greenCandles>redCandles

){

signal="BUY";

trend="UPTREND";

macdText="BUY";

confidence=94;

}

else if(

rsi>55 &&
ema9<ema21 &&
macdValue<0 &&
redCandles>greenCandles

){

signal="SELL";

trend="DOWNTREND";

macdText="SELL";

confidence=93;

}

let signalText=document.getElementById("signalText");

signalText.innerText=signal;

signalText.className="signal "+signal.toLowerCase();

document.getElementById("confidence").innerText=confidence+"%";

document.getElementById("rsi").innerText=rsi;

document.getElementById("pattern").innerText=detectedPattern;

document.getElementById("ema9").innerText=ema9.toFixed(4);

document.getElementById("ema21").innerText=ema21.toFixed(4);

document.getElementById("macd").innerText=macdText;

document.getElementById("trend").innerText=trend;

let audio=new Audio(

signal==="BUY"

? "https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"

: signal==="SELL"

? "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"

: "https://actions.google.com/sounds/v1/cartoon/pop.ogg"

);

audio.play();

}

</script>

</body>
</html>
