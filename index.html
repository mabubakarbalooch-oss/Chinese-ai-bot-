<!-- GET SIGNAL PRESS = SCAN LINE START -->
<!-- ABU BAKAR TRADER - QUOTEX STYLE -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>ABU BAKAR TRADER</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
display:flex;
justify-content:center;
padding:8px;
color:#fff;
}

.container{
width:100%;
max-width:390px;
background:#050505;
border:2px solid #ffd000;
border-radius:22px;
padding:12px;
box-shadow:0 0 20px #ffd00055;
overflow:hidden;
}

.logo{
width:80px;
height:80px;
background:#ffd000;
border-radius:50%;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
font-weight:900;
color:#000;
box-shadow:0 0 25px #ffd000;
}

.title{
text-align:center;
font-size:22px;
font-weight:800;
color:#ffd000;
margin-top:10px;
}

.subtitle{
text-align:center;
font-size:12px;
color:#999;
margin-bottom:12px;
}

.select{
width:100%;
padding:13px;
background:#0b0b0b;
border:1px solid #ffd00088;
border-radius:16px;
color:#fff;
font-size:16px;
margin-bottom:10px;
outline:none;
}

.pairs{
display:flex;
flex-wrap:wrap;
gap:6px;
justify-content:center;
margin-bottom:10px;
}

.pair{
background:#101010;
border:1px solid #333;
padding:8px 10px;
border-radius:12px;
font-size:13px;
}

.chart-box{
position:relative;
height:220px;
background:#070707;
border-radius:20px;
padding:10px;
overflow:hidden;
border:1px solid #222;
}

.live{
font-size:14px;
font-weight:700;
color:#ffd000;
}

.price{
font-size:42px;
font-weight:800;
color:#00ff88;
margin-top:5px;
}

.candles{
position:absolute;
bottom:15px;
left:10px;
right:10px;
height:110px;
display:flex;
align-items:flex-end;
gap:4px;
}

.candle{
width:7px;
border-radius:5px;
animation:move 1s infinite alternate;
}

.green{
background:#00ff88;
box-shadow:0 0 8px #00ff88;
}

.red{
background:#ff3b3b;
box-shadow:0 0 8px #ff3b3b;
}

@keyframes move{
from{
transform:scaleY(0.8);
}
to{
transform:scaleY(1);
}
}

.scan-line{
position:absolute;
top:0;
bottom:0;
width:4px;
background:#ffd000;
box-shadow:0 0 20px #ffd000;
display:none;
animation:scan 2s linear infinite;
}

@keyframes scan{
0%{
left:-10px;
}
100%{
left:100%;
}
}

.btn{
width:100%;
padding:18px;
border:none;
border-radius:20px;
margin-top:12px;
background:#ffd000;
color:#000;
font-size:20px;
font-weight:800;
cursor:pointer;
box-shadow:0 0 20px #ffd00066;
}

.result{
margin-top:12px;
background:#090909;
border-radius:20px;
padding:15px;
border:1px solid #222;
display:none;
}

.signal{
font-size:60px;
font-weight:900;
text-align:center;
}

.buy{
color:#00ff88;
text-shadow:0 0 20px #00ff88;
}

.sell{
color:#ff3b3b;
text-shadow:0 0 20px #ff3b3b;
}

.wait{
color:#ffd000;
text-shadow:0 0 20px #ffd000;
}

.conf{
text-align:center;
font-size:35px;
font-weight:800;
color:#ffd000;
margin-top:5px;
}

.info{
margin-top:10px;
line-height:28px;
font-size:14px;
color:#ddd;
}

.footer{
margin-top:10px;
text-align:center;
font-size:12px;
color:#777;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">QX</div>

<div class="title">ABU BAKAR TRADER</div>
<div class="subtitle">QUOTEX LIVE SIGNAL BOT</div>

<select class="select" id="pair">
<option>🇧🇷 USD/BRL OTC</option>
<option>🇲🇽 USD/MXN OTC</option>
<option>🇮🇳 USD/INR OTC</option>
<option>🇵🇰 USD/PKR OTC</option>
<option>🇺🇸 EUR/USD OTC</option>
<option>🇬🇧 GBP/USD OTC</option>
</select>

<select class="select" id="time">
<option>15 Seconds</option>
<option>30 Seconds</option>
<option>1 Minute</option>
<option>5 Minutes</option>
</select>

<div class="pairs">
<div class="pair">🇧🇷 USD/BRL</div>
<div class="pair">🇲🇽 USD/MXN</div>
<div class="pair">🇮🇳 USD/INR</div>
<div class="pair">🇵🇰 USD/PKR</div>
<div class="pair">🇺🇸 EUR/USD</div>
<div class="pair">🇬🇧 GBP/USD</div>
</div>

<div class="chart-box">

<div class="live">LIVE MARKET</div>

<div class="price" id="price">4.9712</div>

<div class="scan-line" id="scanLine"></div>

<div class="candles" id="candles"></div>

</div>

<button class="btn" onclick="getSignal()">
GET SIGNAL
</button>

<div class="result" id="resultBox">

<div class="signal wait" id="signalText">
WAIT
</div>

<div class="conf" id="confidence">
85%
</div>

<div class="info">
RSI : <span id="rsi">52</span><br>
EMA 9 : <span id="ema9">5.221</span><br>
EMA 21 : <span id="ema21">5.201</span><br>
MACD : <span id="macd">BUY</span><br>
TREND : <span id="trend">UPTREND</span><br>
TIMEFRAME : <span id="tf">15s</span>
</div>

</div>

<div class="footer">
ABU BAKAR TRADER ©
</div>

</div>

<script>

const candles=document.getElementById("candles");

for(let i=0;i<40;i++){

let c=document.createElement("div");

let h=Math.floor(Math.random()*90)+20;

c.classList.add("candle");

if(Math.random()>0.5){
c.classList.add("green");
}else{
c.classList.add("red");
}

c.style.height=h+"px";

candles.appendChild(c);
}

function randomPrice(){

let p=(4.8 + Math.random()*0.4).toFixed(4);

document.getElementById("price").innerText=p;
}

setInterval(randomPrice,1000);

function getSignal(){

let scan=document.getElementById("scanLine");

scan.style.display="block";

setTimeout(()=>{

scan.style.display="none";

showSignal();

},3000);

}

function showSignal(){

let result=document.getElementById("resultBox");

result.style.display="block";

let signals=["BUY","SELL","WAIT"];

let signal=signals[Math.floor(Math.random()*signals.length)];

let conf=Math.floor(Math.random()*10)+88;

let rsi=Math.floor(Math.random()*40)+30;

let ema9=(5+Math.random()).toFixed(3);

let ema21=(5+Math.random()).toFixed(3);

let signalText=document.getElementById("signalText");

signalText.innerText=signal;

signalText.className="signal";

if(signal==="BUY"){
signalText.classList.add("buy");
document.getElementById("macd").innerText="BUY";
document.getElementById("trend").innerText="UPTREND";
}
else if(signal==="SELL"){
signalText.classList.add("sell");
document.getElementById("macd").innerText="SELL";
document.getElementById("trend").innerText="DOWNTREND";
}
else{
signalText.classList.add("wait");
document.getElementById("macd").innerText="WAIT";
document.getElementById("trend").innerText="SIDEWAYS";
}

document.getElementById("confidence").innerText=conf+"%";

document.getElementById("rsi").innerText=rsi;

document.getElementById("ema9").innerText=ema9;

document.getElementById("ema21").innerText=ema21;

document.getElementById("tf").innerText=
document.getElementById("time").value;

}

</script>

</body>
</html>
