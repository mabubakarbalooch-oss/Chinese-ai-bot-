<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA ABUBAKAR SIGNAL PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>
body{
margin:0;
font-family:Poppins;
background:#07070c;
color:white;
display:flex;
justify-content:center;
}

.container{
width:100%;
max-width:420px;
padding:15px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.logo{
font-family:Orbitron;
font-size:14px;
font-weight:800;
}

.card{
background:#11121a;
padding:15px;
border-radius:15px;
border:1px solid #222;
margin-bottom:12px;
}

select,button{
width:100%;
padding:12px;
border-radius:10px;
border:none;
margin-top:10px;
font-weight:700;
}

button{
background:#00ff7b;
color:black;
cursor:pointer;
}

#chart{
height:220px;
display:none;
border-radius:12px;
overflow:hidden;
}

.signal{
font-size:26px;
font-weight:900;
text-align:center;
padding:15px;
display:none;
}

.buy{color:#00ff7b}
.sell{color:#ff4d4d}
.wait{color:#ffaa00}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:10px;
}

.stat{
background:#0f0f18;
padding:10px;
text-align:center;
border-radius:10px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="logo">LUBNA ABUBAKAR SIGNAL PRO</div>
</div>

<div class="card">

<label>PAIR</label>
<select id="pair">
<option value="EURUSDT">EUR / USDT</option>
<option value="GBPUSDT">GBP / USDT</option>
<option value="BTCUSDT">BTC / USDT</option>
</select>

<button onclick="start()">GENERATE SIGNAL</button>

</div>

<div id="chart"></div>

<div id="signal" class="signal">WAIT</div>

<div class="stats">
<div class="stat">RSI <div id="rsi">--</div></div>
<div class="stat">TREND <div id="trend">--</div></div>
<div class="stat">CONF <div id="conf">--</div></div>
</div>

</div>

<script>

let chart, series;
let candles = [];

function getData(){

let price = 100;
let data = [];
let time = Math.floor(Date.now()/1000) - 200*60;

for(let i=0;i<200;i++){

let change = (Math.random()-0.5)*2;
let close = price + change;

data.push({
time: time + i*60,
open: price,
high: price+Math.random()*2,
low: price-Math.random()*2,
close: close
});

price = close;

}

return data;
}

function initChart(){

const container = document.getElementById("chart");
container.style.display="block";

chart = LightweightCharts.createChart(container,{
width:container.clientWidth,
height:220,
layout:{background:{color:"#11121a"},textColor:"#ccc"},
grid:{vertLines:{color:"#222"},horzLines:{color:"#222"}}
});

series = chart.addCandlestickSeries();

setTimeout(()=>chart.timeScale().fitContent(),200);
}

function start(){

candles = getData();

initChart();

setTimeout(()=>{

series.setData(candles);

runSignal();

},200);

}

function runSignal(){

let closes = candles.map(c=>c.close);

let rsi = calcRSI(closes);

let trend = closes[closes.length-1] > closes[0];

let buy = rsi < 40 && trend;
let sell = rsi > 60 && !trend;

let signal = document.getElementById("signal");

if(buy){
signal.innerHTML="📈 BUY";
signal.className="signal buy";
document.getElementById("trend").innerText="UP";
document.getElementById("conf").innerText="80%";
}

else if(sell){
signal.innerHTML="📉 SELL";
signal.className="signal sell";
document.getElementById("trend").innerText="DOWN";
document.getElementById("conf").innerText="78%";
}

else{
signal.innerHTML="⏸ WAIT";
signal.className="signal wait";
document.getElementById("trend").innerText="SIDE";
document.getElementById("conf").innerText="50%";
}

document.getElementById("rsi").innerText = Math.floor(rsi);

signal.style.display="block";
}

function calcRSI(closes){

let gains=0,loss=0;

for(let i=1;i<closes.length;i++){
let diff=closes[i]-closes[i-1];
if(diff>0)gains+=diff;
else loss+=Math.abs(diff);
}

let rs = gains/(loss||1);
return 100-(100/(1+rs));
}

window.addEventListener("resize",()=>{

if(chart){
chart.applyOptions({width:document.getElementById("chart").clientWidth});
}

});

</script>

</body>
</html>
