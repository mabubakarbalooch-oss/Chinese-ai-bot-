<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ABU BAKAR TRADER - HEXAGON AI BOT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Rajdhani', sans-serif;
}

body{
background:radial-gradient(circle at 50% 50%, #1a0a2a 0%, #0a0a0a 100%);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
perspective:1200px;
overflow:hidden;
color:#fff;
}

.scene{
width:100%;
max-width:400px;
height:700px;
position:relative;
transform-style:preserve-3d;
animation:float 6s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0px) rotateX(5deg) rotateY(-5deg);}
50%{transform:translateY(-20px) rotateX(-5deg) rotateY(5deg);}
}

/* HEXAGON SHAPE */
.hexagon-3d{
width:100%;
height:100%;
position:relative;
clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
background:linear-gradient(135deg, 
  rgba(138,43,226,0.15) 0%, 
  rgba(0,0,0,0.7) 50%, 
  rgba(138,43,226,0.15) 100%);
border:2px solid rgba(138,43,226,0.6);
padding:30px 20px;
box-shadow:
 0 0 80px rgba(138,43,226,0.5),
 0 0 120px rgba(138,43,226,0.2),
 inset 0 0 30px rgba(138,43,226,0.2);
backdrop-filter:blur(25px);
transform-style:preserve-3d;
overflow:hidden;
}

.hexagon-3d::before{
content:'';
position:absolute;
top:-50%;
left:-50%;
width:200%;
height:200%;
background:conic-gradient(from 0deg, 
  transparent 0deg, 
  rgba(138,43,226,0.4) 60deg, 
  transparent 120deg, 
  rgba(138,43,226,0.4) 240deg, 
  transparent 360deg);
animation:rotate-holo 10s linear infinite;
pointer-events:none;
}

@keyframes rotate-holo{
100%{transform:rotate(360deg);}
}

.header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px;
position:relative;
z-index:2;
transform:translateZ(20px);
}
.logo-ring{
width:55px;
height:55px;
border-radius:50%;
border:3px solid #8A2BE2;
box-shadow:0 0 30px #8A2BE2, inset 0 0 20px #8A2BE2;
animation:pulse-glow 2s infinite alternate;
}
@keyframes pulse-glow{
from{box-shadow:0 0 20px #8A2BE2, inset 0 0 15px #8A2BE2;}
to{box-shadow:0 0 40px #8A2BE2, inset 0 0 25px #8A2BE2;}
}
.header-text h1{
font-family:'Orbitron',sans-serif;
font-size:16px;
font-weight:900;
background:linear-gradient(90deg, #8A2BE2, #DA70D6, #8A2BE2);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
letter-spacing:2px;
text-shadow:0 0 20px rgba(138,43,226,0.8);
}
.header-text p{
font-size:12px;
color:#DA70D6;
letter-spacing:3px;
}

.live-box{
background:rgba(0,0,0,0.8);
border:2px solid rgba(138,43,226,0.6);
border-radius:20px;
padding:18px;
margin-bottom:18px;
box-shadow:0 0 30px rgba(138,43,226,0.4) inset, 0 0 20px rgba(138,43,226,0.3);
position:relative;
z-index:2;
transform:translateZ(25px);
clip-path: polygon(5% 0%, 95% 0%, 100% 50%, 95% 100%, 5% 100%, 0% 50%);
}
.price{
font-family:'Orbitron',sans-serif;
font-size:36px;
color:#DA70D6;
text-shadow:0 0 25px #DA70D6, 0 0 50px #DA70D6;
margin-bottom:15px;
animation:glow-price 2s infinite alternate;
}
@keyframes glow-price{
from{text-shadow:0 0 20px #DA70D6;}
to{text-shadow:0 0 35px #DA70D6, 0 0 60px #DA70D6;}
}

/* 3D HEXAGON CANDLESTICKS */
.chart-3d{
height:90px;
position:relative;
perspective:200px;
}
.candles-3d{
display:flex;
align-items:flex-end;
justify-content:space-around;
height:100%;
transform-style:preserve-3d;
transform:rotateX(20deg);
}
.candle-3d{
width:10px;
height:100%;
position:relative;
transform-style:preserve-3d;
clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
}

.analyzer-btn{
width:100%;
padding:18px;
background:linear-gradient(90deg, 
  rgba(138,43,226,0.2), 
  rgba(218,112,214,0.4), 
  rgba(138,43,226,0.2));
border:2px solid rgba(138,43,226,0.6);
border-radius:0;
clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%);
color:#fff;
font-family:'Orbitron',sans-serif;
font-size:14px;
font-weight:900;
letter-spacing:2px;
margin-bottom:18px;
cursor:pointer;
box-shadow:0 0 30px rgba(138,43,226,0.5);
position:relative;
z-index:2;
transform:translateZ(30px);
transition:all 0.3s;
}
.analyzer-btn:hover{
transform:translateZ(40px) scale(1.05);
box-shadow:0 0 50px rgba(138,43,226,0.8);
}

.result-box{
background:rgba(0,0,0,0.8);
border:3px solid #DA70D6;
border-radius:0;
clip-path: polygon(5% 0%, 95% 0%, 100% 50%, 95% 100%, 5% 100%, 0% 50%);
padding:20px;
text-align:center;
margin-bottom:18px;
box-shadow:0 0 40px rgba(218,112,214,0.6) inset;
position:relative;
z-index:2;
transform:translateZ(35px);
display:none;
}
.result-box h1{
font-family:'Orbitron',sans-serif;
font-size:50px;
color:#DA70D6;
text-shadow:0 0 30px #DA70D6, 0 0 60px #DA70D6;
animation:glow-huge 1.5s infinite alternate;
}
@keyframes glow-huge{
from{text-shadow:0 0 25px #DA70D6;}
to{text-shadow:0 0 40px #DA70D6, 0 0 80px #DA70D6;}
}

.particles{
position:absolute;
inset:0;
pointer-events:none;
z-index:1;
}
.particle{
position:absolute;
width:3px;
height:3px;
background:#8A2BE2;
border-radius:50%;
box-shadow:0 0 15px #8A2BE2;
animation:float-particle 10s infinite linear;
}
@keyframes float-particle{
0%{transform:translateY(100vh) translateX(0);}
100%{transform:translateY(-100vh) translateX(100px);}
}

.lock-screen{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:#0a0a0a;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}
.lock-box{
width:90%;
max-width:320px;
background:rgba(30,0,40,0.8);
border:2px solid rgba(138,43,226,0.5);
clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%);
padding:35px;
text-align:center;
backdrop-filter:blur(20px);
box-shadow:0 0 50px rgba(138,43,226,0.4);
}
.lock-input{
width:100%;
padding:15px;
border:1px solid rgba(138,43,226,0.5);
background:rgba(0,0,0,0.5);
color:#fff;
text-align:center;
margin:15px 0;
outline:none;
}
.lock-btn{
width:100%;
padding:15px;
border:none;
background:linear-gradient(90deg,#8A2BE2,#DA70D6);
color:#000;
font-weight:900;
cursor:pointer;
font-family:'Orbitron',sans-serif;
box-shadow:0 0 20px rgba(138,43,226,0.5);
clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%);
}
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <h2 style="color:#8A2BE2;font-family:Orbitron;font-size:18px;">HEXAGON ACCESS</h2>
    <input type="password" id="passInput" class="lock-input" placeholder="ENTER PASSWORD">
    <button class="lock-btn" onclick="unlock()">ACTIVATE BOT</button>
  </div>
</div>

<div class="scene" id="scene" style="display:none;">
  <div class="hexagon-3d">
    
    <div class="header">
      <div class="logo-ring"></div>
      <div class="header-text">
        <h1>ABU BAKAR TRADER</h1>
        <p>HEXAGON EDITION</p>
      </div>
      <div style="font-size:28px;color:#8A2BE2;">⚙️</div>
    </div>

    <div class="live-box">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:12px;">
        <div style="color:#DA70D6;display:flex;align-items:center;gap:8px;">
          <div style="width:10px;height:10px;background:#DA70D6;border-radius:50%;box-shadow:0 0 15px #DA70D6;animation:pulse 1.5s infinite;"></div>
          LIVE MARKET
        </div>
        <div>USD/BRL OTC</div>
      </div>
      <div class="price" id="price">1.2476</div>
      <div class="chart-3d">
        <div class="candles-3d" id="candles3d"></div>
      </div>
    </div>

    <button class="analyzer-btn" onclick="getSignal()">⚡ ANALYZER MARKET (GET SIGNAL)</button>

    <div class="result-box" id="resultBox">
      <h4 style="font-size:13px;color:#8892b0;margin-bottom:10px;">ANALYSIS RESULT</h4>
      <h1 id="signal">BUY</h1>
      <p id="confidence" style="font-size:15px;color:#DA70D6;font-weight:700;">95% CONFIDENCE MATCH</p>
    </div>

  </div>
</div>

<script>
let scanning=false;

function createParticles(){
  const container = document.getElementById('particles');
  for(let i=0; i<25; i++){
    let p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random()*100 + '%';
    p.style.animationDelay = Math.random()*10 + 's';
    p.style.animationDuration = (8+Math.random()*5) + 's';
    container.appendChild(p);
  }
}

function unlock(){
  if(document.getElementById('passInput').value==='bakar786'){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('scene').style.display='block';
    createParticles();
    generateCandles3D();
    updatePrice();
  }else{
    alert('Wrong Password');
  }
}

function generateCandles3D(){
  const container = document.getElementById('candles3d');
  container.innerHTML = '';
  
  for(let i=0; i<18; i++){
    let candle = document.createElement('div');
    candle.className = 'candle-3d';
    
    let isGreen = Math.random() > 0.5;
    let height = Math.random() * 50 + 30;
    let offset = Math.random() * 20;
    
    candle.style.background = isGreen ? 
      'linear-gradient(180deg, #DA70D6, rgba(0,0,0,0.5))' : 
      'linear-gradient(180deg, #8B0000, rgba(0,0,0,0.5))';
    candle.style.height = height + 'px';
    candle.style.marginTop = (40 - height/2 + offset) + 'px';
    candle.style.boxShadow = '0 0 15px ' + (isGreen ? '#DA70D6' : '#8B0000');
    
    container.appendChild(candle);
  }
}

function updatePrice(){
  setInterval(()=>{
    let base=1.2476;
    let change=(Math.random()-0.5)*0.002;
    document.getElementById('price').innerText=(base+change).toFixed(4);
    
    if(Math.random() > 0.8){
      generateCandles3D();
    }
  },2000);
}

function getSignal(){
  if(scanning)return;
  scanning=true;
  document.getElementById('status').innerText='ANALYZING...';
  
  let sec=3;
  document.getElementById('timer').innerText='0'+sec;
  
  let timerInterval=setInterval(()=>{
    sec--;
    document.getElementById('timer').innerText='0'+sec;
    if(sec<=0){
      clearInterval(timerInterval);
      scanning=false;
      document.getElementById('status').innerText='ANALYSIS COMPLETE';
      document.getElementById('resultBox').style.display='block';
      generateCandles3D();
      
      let signal=Math.random()>0.5?'BUY':'SELL';
      let conf=Math.floor(Math.random()*5)+95;
      
      document.getElementById('signal').innerText=signal;
      document.getElementById('signal').style.color=signal==='BUY'?'#DA70D6':'#8B0000';
      document.getElementById('confidence').innerText=conf+'% CONFIDENCE MATCH';
    }
  },1000);
}
</script>
</body>
</html>
