<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA ABUBAKAR SIGNAL PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06110a;--card:rgba(8,25,15,0.92);--primary:#00ff78;--primary2:#00cc66;--green:#00ff78;--red:#ff4d4d;--text:#ffffff;--muted:#7dffb2;--border:rgba(0,255,120,0.12);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:radial-gradient(circle at top right,#0d2e1c 0%,#06110a 60%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:18px;overflow:hidden;color:var(--text);}
.bg-glow{position:absolute;width:500px;height:500px;background:rgba(0,255,120,0.08);filter:blur(130px);top:-120px;right:-100px;animation:moveGlow 6s infinite alternate;}
@keyframes moveGlow{0%{transform:translate(0,0);}100%{transform:translate(-80px,70px);}}
.container{position:relative;width:100%;max-width:430px;background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:34px;padding:22px;box-shadow:0 0 40px rgba(0,0,0,0.7),0 0 30px rgba(0,255,120,0.08);overflow:hidden;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
.profile-wrap{display:flex;align-items:center;gap:12px;}
.logo{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#00ff78,#00cc66);display:flex;justify-content:center;align-items:center;font-size:22px;font-weight:900;font-family:'Orbitron',sans-serif;color:#04140a;box-shadow:0 0 20px rgba(0,255,120,0.5);}
.profile-wrap h1{font-family:'Orbitron',sans-serif;font-size:15px;line-height:1.4;}
.profile-wrap p{font-size:11px;color:var(--muted);margin-top:3px;}
.live{padding:7px 12px;border-radius:30px;background:rgba(0,255,120,0.08);border:1px solid rgba(0,255,120,0.2);font-size:11px;color:var(--primary);font-weight:700;}
#mainBoard{display:none;}
.label{display:block;margin-bottom:8px;font-size:12px;color:#9fffc7;font-weight:600;}
input,select{width:100%;padding:16px;border-radius:18px;border:1px solid #145c34;background:#0b1d13;color:#fff;outline:none;font-size:14px;margin-bottom:16px;}
.time-box{display:flex;justify-content:center;margin-bottom:18px;}
.time-badge{padding:13px 30px;background:linear-gradient(135deg,rgba(0,255,120,0.18),rgba(0,204,102,0.12));border:1px solid var(--primary);border-radius:16px;text-align:center;font-size:14px;font-weight:700;color:var(--primary);box-shadow:0 0 15px rgba(0,255,120,0.2);}
.btn{width:100%;padding:18px;border:none;border-radius:22px;background:linear-gradient(135deg,var(--primary),var(--primary2));font-family:'Orbitron',sans-serif;font-weight:800;font-size:15px;color:#04140a;cursor:pointer;transition:0.3s;}
.btn:hover{transform:scale(1.02);}
#scanner{margin-top:22px;height:190px;border-radius:26px;background:#0b1d13;border:1px solid #145c34;position:relative;overflow:hidden;display:none;}
.scan-line{position:absolute;width:100%;height:5px;background:linear-gradient(90deg,transparent,var(--primary),transparent);box-shadow:0 0 25px var(--primary);animation:scan 1.4s linear infinite;z-index:10;}
@keyframes scan{0%{top:-5%;}100%{top:105%;}}
.chart{position:absolute;bottom:16px;left:16px;right:16px;display:flex;align-items:flex-end;gap:8px;height:100px;}
.candle{width:15px;border-radius:6px 6px 0 0;animation:pulse 1s infinite alternate;}
.green{background:#00ff78;}
.red{background:#ff4d4d;}
@keyframes pulse{from{opacity:0.5;}to{opacity:1;}}
#signalBox{margin-top:22px;padding:24px;border-radius:28px;text-align:center;font-size:32px;font-family:'Orbitron',sans-serif;font-weight:900;display:none;animation:pop 0.4s ease;}
@keyframes pop{0%{transform:scale(0.8);opacity:0;}100%{transform:scale(1);opacity:1;}}
.buy-style{background:rgba(0,255,120,0.08);border:1px solid rgba(0,255,120,0.40);color:#00ff78;box-shadow:0 0 35px rgba(0,255,120,0.18);}
.sell-style{background:rgba(255,77,77,0.08);border:1px solid rgba(255,77,77,0.40);color:#ff4d4d;box-shadow:0 0 35px rgba(255,77,77,0.18);}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px;}
.stat{background:#102117;border:1px solid #145c34;border-radius:22px;padding:14px;text-align:center;}
.stat h3{font-size:10px;color:#7dffb2;margin-bottom:6px;}
.stat p{font-size:16px;font-weight:700;}
.market-status{margin-top:16px;padding:14px;border-radius:18px;background:#102117;border:1px solid #145c34;text-align:center;font-size:13px;font-weight:700;color:#7dffb2;}
.entry-timer{display:none;margin-top:12px;padding:12px;border-radius:18px;background:rgba(0,255,120,0.08);border:1px solid rgba(0,255,120,0.30);text-align:center;font-size:14px;font-weight:700;color:#00ff78;}
.footer{margin-top:18px;text-align:center;font-size:11px;color:#6dffad;}
</style>
</head>
<body>
<div class="bg-glow"></div>

<div id="loginScreen" class="container">
<div class="header">
<div class="profile-wrap">
<div class="logo">QX</div>
<div><h1>LUBNA ABUBAKAR</h1><p>ELITE ACCESS SYSTEM</p></div>
</div>
<div class="live">● SAFE</div>
</div>
<label class="label">PASSWORD</label>
<input type="password" id="password" placeholder="Enter Password">
<button class="btn" onclick="login()">🔓 UNLOCK SYSTEM</button>
</div>

<div id="mainBoard" class="container">
<div class="header">
<div class="profile-wrap">
<div class="logo">QX</div>
<div><h1>LUBNA ABUBAKAR</h1><p>ULTRA AI SIGNAL</p></div>
</div>
<div class="live">● LIVE</div>
</div>

<label class="label">BROKER</label>
<select><option>Pocket Option</option></select>

<label class="label">CURRENCY PAIR - OTC</label>
<select id="assetSelect" onchange="changeAsset()">
<option value="USDBRL">USDBRL</option>
<option value="USDNGN">USDNGN</option>
<option value="USDIDR">USDIDR</option>
<option value="USDTRY">USDTRY</option>
<option value="USDARS">USDARS</option>
<option value="USDZAR">USDZAR</option>
<option value="USDMXN">USDMXN</option>
<option value="EURUSD">EURUSD</option>
<option value="GBPUSD">GBPUSD</option>
<option value="USDJPY">USDJPY</option>
<option value="AUDUSD">AUDUSD</option>
<option value="EURGBP">EURGBP</option>
</select>

<div class="time-box">
<div class="time-badge">TIMEFRAME: 1 MINUTE</div>
</div>

<button class="btn" onclick="generateSignal()">⚡ GENERATE AI SIGNAL</button>

<div id="scanner"><div class="scan-line"></div><div class="chart"></div></div>
<div id="signalBox">BUY</div>
<div class="entry-timer" id="entryTimer">NEXT ENTRY IN: 00s</div>

<div class="stats">
<div class="stat"><h3>RSI</h3><p id="rsi">--</p></div>
<div class="stat"><h3>TREND</h3><p id="trend">--</p></div>
<div class="stat"><h3>CONF</h3><p id="conf">--</p></div>
<div class="stat"><h3>MACD</h3><p id="macd">--</p></div>
</div>

<div class="market-status" id="marketStatus">MARKET WAITING...</div>
<div class="footer">POWERED BY ABUBAKAR AI ENGINE</div>
</div>

<script>
let pair = 'USDBRL';
let cachedData = null;
let lastFetchTime = 0;
let timerInterval = null;

function login(){
  let pass = document.getElementById('password').value;
  if(pass === 'Lubna786'){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainBoard').style.display = 'block';
  }else{alert('Wrong Password!');}
}

function changeAsset(){
  pair = document.getElementById('assetSelect').value;
  cachedData = null;
}

function randomCandles(){
  let chart = document.querySelector('.chart');
  chart.innerHTML = '';
  for(let i=0;i<11;i++){
    let candle = document.createElement('div');
    let height = Math.floor(Math.random()*75)+20;
    candle.classList.add('candle');
    candle.classList.add(Math.random() > 0.5? 'green' : 'red');
    candle.style.height = height + 'px';
    chart.appendChild(candle);
  }
}

async function getBinanceData(){
  let now = Date.now();
  if(cachedData && (now - lastFetchTime) < 15000){
    return cachedData;
  }
  try{
    let symbol = pair + 'T';
    let response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1m&limit=80`);
    let data = await response.json();
    cachedData = data.map(candle => parseFloat(candle[4]));
    lastFetchTime = now;
    return cachedData;
  }catch(error){
    console.log('API Error', error);
    return cachedData;
  }
}

function calculateEMA(closes, period){
  let k = 2 / (period + 1);
  let ema = [closes[0]];
  for(let i=1; i<closes.length; i++){
    ema.push(closes[i] * k + ema[i-1] * (1 - k));
  }
  return ema;
}

function calculateRSI(closes, period = 14){
  let gains = [];
  let losses = [];
  
  for(let i = 1; i < closes.length; i++){
    let change = closes[i] - closes[i - 1];
    gains.push(change > 0 ? change : 0);
    losses.push(change < 0 ? Math.abs(change) : 0);
  }
  
  let avgGain = gains.slice(0, period).reduce((a, b) => a + b, 0) / period;
  let avgLoss = losses.slice(0, period).reduce((a, b) => a + b, 0) / period;
  
  for(let i = period; i < gains.length; i++){
    avgGain = (avgGain * (period - 1) + gains[i]) / period;
    avgLoss = (avgLoss * (period - 1) + losses[i]) / period;
  }
  
  if(avgLoss === 0) return 100;
  let rs = avgGain / avgLoss;
  return 100 - (100 / (1 + rs));
}

function calculateMACD(closes){
  let ema12 = calculateEMA(closes, 12);
  let ema26 = calculateEMA(closes, 26);
  let macdLine = ema12.map((val, i) => val - ema26[i]);
  let signalLine = calculateEMA(macdLine, 9);
  let histogram = macdLine.map((val, i) => val - signalLine[i]);
  return {macd: macdLine[macdLine.length-1], signal: signalLine[signalLine.length-1], hist: histogram[histogram.length-1]};
}

function startEntryTimer(){
  clearInterval(timerInterval);
  let timerBox = document.getElementById('entryTimer');
  timerBox.style.display = 'block';
  
  function updateTimer(){
    let now = new Date();
    let seconds = now.getSeconds();
    let secondsLeft = 60 - seconds;
    if(secondsLeft === 60) secondsLeft = 0;
    
    timerBox.innerHTML = `NEXT ENTRY IN: ${secondsLeft < 10 ? '0' + secondsLeft : secondsLeft}s`;
    
    if(secondsLeft === 0){
      timerBox.innerHTML = 'ENTRY NOW!';
      timerBox.style.background = 'rgba(0,255,120,0.15)';
    }
  }
  
  updateTimer();
  timerInterval = setInterval(updateTimer, 1000);
}

async function generateSignal(){
  let scanner = document.getElementById('scanner');
  let signalBox = document.getElementById('signalBox');
  let marketStatus = document.getElementById('marketStatus');
  let timerBox = document.getElementById('entryTimer');

  scanner.style.display = 'block';
  signalBox.style.display = 'none';
  timerBox.style.display = 'none';
  marketStatus.innerHTML = 'ANALYZING MARKET...';

  randomCandles();
  let closes = await getBinanceData();

  if(!closes || closes.length < 50){
    marketStatus.innerHTML = 'API ERROR - TRY ANOTHER PAIR';
    scanner.style.display = 'none';
    return;
  }

  setTimeout(()=>{
    scanner.style.display = 'none';
    signalBox.style.display = 'block';

    let rsi = calculateRSI(closes);
    let ema50 = calculateEMA(closes, 50);
    let ema200 = calculateEMA(closes, 200);
    let macd = calculateMACD(closes);
    let lastPrice = closes[closes.length - 1];
    
    let volatility = (Math.max(...closes.slice(-10)) - Math.min(...closes.slice(-10))) / lastPrice * 100;

    let trendUp = ema50[ema50.length-1] > ema200[ema200.length-1] && lastPrice > ema50[ema50.length-1];
    let trendDown = ema50[ema50.length-1] < ema200[ema200.length-1] && lastPrice < ema50[ema50.length-1];
    let macdBull = macd.macd > macd.signal && macd.hist > 0;
    let macdBear = macd.macd < macd.signal && macd.hist < 0;

    let buyScore = 0, sellScore = 0;

    if(rsi >= 30 && rsi <= 70){
      if(rsi < 40) buyScore += 2;
      if(rsi > 60) sellScore += 2;
    }
    
    if(trendUp) buyScore += 3;
    if(trendDown) sellScore += 3;
    
    if(macdBull) buyScore += 2;
    if(macdBear) sellScore += 2;
    
    if(volatility < 0.15){
      buyScore = 0;
      sellScore = 0;
    }

    let confidence = Math.floor((Math.max(buyScore, sellScore) / 8) * 100);

    if(buyScore >= 6){
      signalBox.innerHTML = '📈 BUY';
      signalBox.className = 'buy-style';
      document.getElementById('trend').innerText = 'UP';
      marketStatus.innerHTML = 'STRONG BULLISH SIGNAL';
      startEntryTimer();
    }else if(sellScore >= 6){
      signalBox.innerHTML = '📉 SELL';
      signalBox.className = 'sell-style';
      document.getElementById('trend').innerText = 'DOWN';
      marketStatus.innerHTML = 'STRONG BEARISH SIGNAL';
      startEntryTimer();
    }else{
      signalBox.innerHTML = '⏸ WAIT';
      signalBox.className = '';
      document.getElementById('trend').innerText = 'SIDEWAYS';
      marketStatus.innerHTML = 'NO STRONG SIGNAL - WAIT';
      confidence = 0;
      timerBox.style.display = 'none';
    }

    document.getElementById('rsi').innerText = Math.floor(rsi);
    document.getElementById('conf').innerText = confidence + '%';
    document.getElementById('macd').innerText = macd.hist > 0? 'BULL' : 'BEAR';

    if(buyScore >= 6 || sellScore >= 6){
      let audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
      audio.play();
    }

  },800);
}
</script>
</body>
</html>
