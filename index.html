<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUBNA ABUBAKAR - ULTRA AI BOT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@^3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@^1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.0"></script>

    <style>
        :root{--bg:#05060a;--card:#11131b;--primary:#00ff88;--red:#ff4d67;--text:#ffffff;--muted:#7d8597;--border:#1f2430;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Poppins',sans-serif;background:#05060a;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px;color:white;}
        .container{width:100%;max-width:420px;background:#11131b;border-radius:25px;padding:20px;border:1px solid #1f2430;}
        #chartContainer{height:250px; background:#090b10; border-radius:18px; border:1px solid #1f2430; padding:10px; margin-bottom:15px; position: relative;}
        .btn{width:100%;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,#00ff88,#00c96d);font-family:'Orbitron';font-weight:800;color:#000;cursor:pointer;margin-bottom:15px;}
        /* بقیہ سٹائل آپ کے پرانے کوڈ والے ہی ہیں */
    </style>
</head>

<body>
<div id="mainBoard" class="container">
    <div class="live-price" id="livePrice" style="text-align:center;font-size:30px;color:#00ff88;margin-bottom:15px;">0.0000</div>
    
    <div id="chartContainer">
        <canvas id="candleChart"></canvas>
    </div>

    <button class="btn" onclick="generateSignal()">⚡ GENERATE AI SIGNAL</button>
    <div id="signalBox" style="padding:20px;text-align:center;font-size:24px;border-radius:15px;display:none;"></div>
</div>

<script>
    let chart;
    let liveCandles = [];

    // چارٹ ڈرا کرنے کا فنکشن
    function drawChart() {
        const ctx = document.getElementById('candleChart').getContext('2d');
        if (chart) chart.destroy();

        chart = new Chart(ctx, {
            type: 'candlestick',
            data: {
                datasets: [{
                    label: 'Price',
                    data: liveCandles,
                    color: { up: '#00ff88', down: '#ff4d67' }
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    // ڈیٹا جنریٹ کرنے کا فنکشن
    function initData() {
        for(let i=0; i<20; i++){
            liveCandles.push({
                x: new Date().getTime() + (i * 60000),
                o: 100 + Math.random(),
                h: 102,
                l: 98,
                c: 101
            });
        }
        drawChart();
    }

    function generateSignal() {
        const box = document.getElementById('signalBox');
        box.style.display = 'block';
        box.innerHTML = "📈 BUY";
        box.className = 'buy-style';
    }

    window.onload = initData;
</script>
</body>
</html>
