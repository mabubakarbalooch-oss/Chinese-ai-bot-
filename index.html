<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>ABU BAKAR TRADER - TIGER ELITE v3.6</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;600;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050202; 
display:flex;
justify-content:center;
padding:8px;
color:#fff;
overflow-x:hidden;
}

body::before{
content:'';
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at top left, rgba(255, 60, 0, 0.15), transparent 40%),
radial-gradient(circle at bottom right, rgba(0, 230, 118, 0.1), transparent 40%);
z-index:-1;
}

.container{
width:100%;
max-width:400px;
background:rgba(15, 10, 10, 0.85);
border:1px solid rgba(255, 77, 0, 0.2); 
border-radius:28px;
padding:20px;
backdrop-filter:blur(25px);
box-shadow:0 0 35px rgba(0, 0, 0, 0.8);
display:none;
animation:fade 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes fade{
from{ opacity:0; transform:translateY(20px) scale(0.95); }
to{ opacity:1; transform:translateY(0) scale(1); }
}

.lock-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#050202;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
padding:20px;
}

.lock-box{
width:100%;
max-width:350px;
background:rgba(20, 12, 12, 0.7);
border:1px solid rgba(255, 77, 0, 0.2);
border-radius:24px;
padding:35px 25px;
text-align:center;
backdrop-filter:blur(20px);
box-shadow:0 15px 35px rgba(0,0,0,0.8);
}

.lock-title{
font-family:'Orbitron',sans-serif;
font-size:24px;
font-weight:900;
color:#ff4d00;
margin-bottom:8px;
}

.lock-input{
width:100%;
padding:16px;
border:1px solid rgba(255,255,255,0.1);
outline:none;
border-radius:14px;
background:rgba(0,0,0,0.6);
color:#fff;
font-size:16px;
text-align:center;
margin-bottom:18px;
letter-spacing:4px;
}

.lock-btn{
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#ff4d00,#ffcc00);
color:#000;
font-weight:900;
font-size:15px;
cursor:pointer;
}

.error{
margin-top:12px;
color:#ff3b3b;
display:none;
font-size:13px;
font-weight:600;
}

/* --- TIGER LOGO FIX (NO BROKEN LINKS) --- */
.logo-container{
width:90px;
height:90px;
margin:10px auto 15px auto;
border-radius:50%;
background:#110a0a;
border:2px solid #ffaa00;
display:flex;
justify-content:center;
align-items:center;
position:relative;
overflow:hidden;
box-shadow:0 0 20px rgba(255, 170, 0, 0.3);
}

.svg-tiger {
width:60px;
height:60px;
position:absolute;
animation:tigerWalk 4s infinite ease-in-out;
}

@keyframes tigerWalk {
0% { transform: translateX(-40px) scaleX(1); }
45% { transform: translateX(40px) scaleX(1); }
50% { transform: translateX(40px) scaleX(-1); } 
95% { transform: translateX(-40px) scaleX(-1); }
100% { transform: translateX(-40px) scaleX(1); }
}

.title{
text-align:center;
font-family:'Orbitron',sans-serif;
font-size:22px;
font-weight:900;
background:linear-gradient(to right, #fff, #ffaa00);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.sub{
text-align:center;
font-size:10px;
letter-spacing:4px;
color:#ff4d00;
margin-bottom:20px;
font-weight:600;
}

.stats-bar {
display:flex;
justify-content:space-between;
background:rgba(255,255,255,0.02);
border:1px solid rgba(255,255,255,0.05);
border-radius:12px;
padding:8px 12px;
margin-bottom:12px;
font-size:11px;
color:#a0aec0;
}

.stats-bar span {
color:#ffaa00;
font-weight:bold;
font-family:'Orbitron', sans-serif;
}

.select{
width:100%;
padding:14px;
border-radius:14px;
background:#140d0d;
border:1px solid rgba(255,255,255,0.08);
color:#fff;
outline:none;
margin-bottom:12px;
font-weight:600;
}

.chart{
position:relative;
height:220px;
border-radius:22px;
background:rgba(5, 2, 2, 0.8);
padding:14px;
overflow:hidden;
border:1px solid rgba(255, 255, 255, 0.05);
}

.live{
font-size:11px;
font-family:'Orbitron',sans-serif;
letter-spacing:2px;
color:#a0aec0;
display:flex;
align-items:center;
gap:6px;
}

.live::before{
content:'';
width:7px;
height:7px;
background:#00E676;
border-radius:50%;
box-shadow:0 0 10px #00E676;
animation:pulse 1.5s infinite;
}

@keyframes pulse {
0% { opacity:0.4; }
50% { opacity:1; }
100% { opacity:0.4; }
}

.price{
font-size:38px;
font-weight:900;
font-family:monospace;
margin-top:5px;
color:#ffaa00;
}

.candles{
position:absolute;
left:10px;
right:10px;
bottom:10px;
height:110px;
display:flex;
align-items:flex-end;
gap:4px;
overflow:hidden;
}

.candle{
width:9px;
border-radius:2px;
position:relative;
transition:0.2s ease;
}

.candle::before {
content:'';
position:absolute;
width:2px;
left:50%;
transform:translateX(-50%);
bottom:-5px;
top:-5px;
z-index:-1;
}

.green{ background:#00E676; box-shadow:0 0 6px rgba(0,230,118,0.3); } 
.green::before { background:#00E676; }

.red{ background:#ff3b3b; box-shadow:0 0 6px rgba(255,59,59,0.3); } 
.red::before { background:#ff3b3b; }

.scan{
position:absolute;
top:0;
bottom:0;
width:4px;
background:linear-gradient(to right, transparent, #00b0ff, transparent);
box-shadow:0 0 20px #00b0ff;
display:none;
animation:scanMove 1.5s ease-in-out infinite;
z-index:5;
}

@keyframes scanMove{
0%{left:-10px;}
50%{left:100%;}
100%{left:-10px;}
}

.btn{
width:100%;
padding:16px;
border:none;
border-radius:16px;
margin-top:16px;
background:linear-gradient(135deg, #00b0ff, #00e676); 
color:#000;
font-weight:900;
font-size:15px;
cursor:pointer;
font-family:'Orbitron',sans-serif;
letter-spacing:1px;
box-shadow:0 6px 20px rgba(0, 176, 255, 0.3);
}

.btn:disabled{ opacity:0.6; }

.result{
margin-top:16px;
padding:18px;
border-radius:22px;
background:rgba(10, 5, 5, 0.9);
border:1px solid rgba(255, 255, 255, 0.05);
display:none;
animation:fade 0.4s ease;
}

.signal{
text-align:center;
font-family:'Orbitron',sans-serif;
font-size:52px;
font-weight:900;
letter-spacing:2px;
}

.buy{ color:#00E676; text-shadow:0 0 25px rgba(0,230,118,0.6); }
.sell{ color:#ff3b3b; text-shadow:0 0 25px rgba(255,59,59,0.6); }
.wait{ color:#ffaa00; text-shadow:0 0 25px rgba(255,170,0,0.4); }

.conf{
text-align:center;
font-size:22px;
font-family:'Orbitron',sans-serif;
margin-top:2px;
color:#e2e8f0;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:14px;
}

.item{
background:rgba(255,255,255,0.02);
border:1px solid rgba(255, 255, 255, 0.05);
padding:12px;
border-radius:14px;
font-size:12px;
color:#a0aec0;
display:flex;
justify-content:space-between;
align-items:center;
}

.item span{
font-weight:700;
font-family:monospace;
color:#fff;
}

.social-btn {
display:block;
width:100%;
padding:14px;
margin-top:15px;
background:rgba(0, 230, 118, 0.03);
border:1px dashed #00E676;
border-radius:14px;
color:#00E676;
text-align:center;
text-decoration:none;
font-family:'Orbitron', sans-serif;
font-size:12px;
font-weight:bold;
}

.footer{
text-align:center;
margin-top:18px;
font-size:10px;
letter-spacing:3px;
color:#444;
font-weight:bold;
}
</style>
</head>

<body>

<div class="lock-screen" id="lock">
  <div class="lock-box">
    <div class="lock-title">QX TIGER TERMINAL</div>
    <input type="password" id="pass" class="lock-input" placeholder="ACCESS KEY">
    <button class="lock-btn" onclick="unlock()">UNLOCK TERMINAL</button>
    <div class="error" id="err">INVALID ACCESS KEY</div>
  </div>
</div>

<div class="container" id="app">
  <div class="logo-container">
    <svg class="svg-tiger" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2a10 10 0 0 0-7.5 16.58V19a3 3 0 0 0 3 3h9a3 3 0 0 0 3-3v-.42A10 10 0 0 0 12 2zm0 3a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zm-4 7c0-.55.45-1 1-1h6a1 1 0 0 1 1 1v1H8v-1zm8.5 6h-9a1 1 0 0 1-1-1v-.5a4.5 4.5 0 0 1 9 0v.5a1 1 0 0 1-1 1z" fill="#ffaa00"/>
      <path d="M9 7.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm8 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0z" fill="#ff5500"/>
      <path d="M12 14l-1.5 2h3L12 14z" fill="#fff"/>
    </svg>
  </div>
  <div class="title">ABU BAKAR TRADER</div>
  <div class="sub">TIGER ELITE AI BOT</div>

  <div class="stats-bar">
    <div>SERVER: <span style="color:#00E676">SECURE</span></div>
    <div>ACCURACY: <span id="accuracy-val">95.4%</span></div>
  </div>

  <select class="select" id="pair" onchange="resetMarket()">
    <option value="1.2450">USD/BRL OTC</option>
    <option value="17.8200">USD/MXN OTC</option>
    <option value="278.400">USD/PKR OTC</option>
    <option value="1.0825">EUR/USD OTC</option>
    <option value="1.2640">GBP/USD OTC</option>
  </select>

  <select class="select" id="timeframe" onchange="resetMarket()">
    <option value="1000">15 Seconds (Fast)</option>
    <option value="2000">30 Seconds (Medium)</option>
    <option value="4000">1 Minute (Stable)</option>
  </select>

  <div class="chart">
    <div class="live">LIVE MARKET</div>
    <div class="price" id="price">1.2450</div>
    <div class="scan" id="scan"></div>
    <div class="candles" id="candles"></div>
  </div>

  <button class="btn" id="btn" onclick="getSignal()">ANALYZER MARKET (GET SIGNAL)</button>

  <div class="result" id="result">
    <div class="signal wait" id="signal">WAIT</div>
    <div class="conf" id="conf">--%</div>
    <div class="grid">
      <div class="item">RSI <span id="rsi" style="color:#00b0ff">50</span></div>
      <div class="item">TREND <span id="trend">WAIT</span></div>
      <div class="item">EMA 9 <span id="ema9">0.0000</span></div>
      <div class="item">EMA 21 <span id="ema21">0.0000</span></div>
      <div class="item">MACD <span id="macd">WAIT</span></div>
      <div class="item">PATTERN <span id="pattern">ANALYZING</span></div>
      <div class="item" style="grid-column: span 2; font-size:11px;">
        ID: <span id="order-id" style="color:#a0aec0">--</span> 
        TIME: <span id="execution-time" style="color:#a0aec0">--</span>
      </div>
    </div>
  </div>

  <a href="https://t.me/your_group_link" target="_blank" class="social-btn">
    📢 JOIN OUR VIP TIGER GROUP
  </a>

  <div class="footer">TIGER ALGORITHM POWERED SYSTEMS</div>
</div>

<script>
const correctPassword = "bakar786";
let currentPrice = 1.2450;
let candleData = [];
let lastSignal = "WAIT";
let marketInterval;

const candles = document.getElementById("candles");
const price = document.getElementById("price");

function unlock(){
    const input = document.getElementById("pass").value;
    if(input === correctPassword){
        document.getElementById("lock").style.display = "none";
        document.getElementById("app").style.display = "block";
        resetMarket();
        setInterval(() => {
            let baseAcc = 92 + Math.random()*2;
            document.getElementById("accuracy-val").innerText = baseAcc.toFixed(1) + "%";
        }, 5000);
    } else {
        document.getElementById("err").style.display = "block";
    }
}

document.getElementById("pass").addEventListener("keyup", e => {
    if(e.key === "Enter") unlock();
});

function resetMarket() {
    clearInterval(marketInterval);
    const pairSelect = document.getElementById("pair");
    currentPrice = parseFloat(pairSelect.value);
    price.innerText = currentPrice.toFixed(4);
    generateCandles();
    const speed = parseInt(document.getElementById("timeframe").value);
    marketInterval = setInterval(updateChart, speed);
}

function generateCandles(){
    candles.innerHTML = "";
    candleData = [];
    for(let i=0; i<30; i++){
        let move = Math.random() > 0.45; // 50-50 clear balance
        let height = Math.floor(Math.random()*65)+25;
        candleData.push({ green: move, height: height });

        let div = document.createElement("div");
        div.className = "candle " + (move ? "green":"red");
        div.style.height = height + "px";
        candles.appendChild(div);
    }
}

function updateChart(){
    let oldPrice = currentPrice;
    let pipSize = currentPrice > 100 ? 0.04 : 0.0003; 

    if(lastSignal === "BUY"){
        currentPrice += Math.random() * pipSize;
    } else if(lastSignal === "SELL"){
        currentPrice -= Math.random() * pipSize;
    } else {
        currentPrice += (Math.random() - 0.5) * pipSize;
    }

    price.innerText = currentPrice.toFixed(4);
    price.style.color = currentPrice >= oldPrice ? "#00E676" : "#ff3b3b";

    candleData.shift();
    let up = currentPrice >= oldPrice;
    let h = Math.floor(Math.random()*65)+25;
    candleData.push({ green: up, height: h });

    candles.innerHTML = "";
    candleData.forEach(c => {
        let d = document.createElement("div");
        d.className = "candle " + (c.green ? "green":"red");
        d.style.height = c.height + "px";
        candles.appendChild(d);
    });
}

function triggerFuturisticSound(type) {
    try {
        let AudioContext = window.AudioContext || window.webkitAudioContext;
        let ctx = new AudioContext();
        let osc = ctx.createOscillator();
        let gain = ctx.createGain();
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        if (type === "BUY") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(650, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1300, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
        } else if (type === "SELL") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(450, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        } else {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        }
    } catch (e) { }
}

function getSignal(){
    const scan = document.getElementById("scan");
    const btn = document.getElementById("btn");
    scan.style.display = "block";
    btn.disabled = true;
    document.getElementById("result").style.display = "none";
    triggerFuturisticSound("SCAN");

    setTimeout(() => {
        scan.style.display = "none";
        btn.disabled = false;
        generateSignal();
    }, 1500);
}

/* --- FIXED DYNAMIC LOGIC: 50% BUY / 50% SELL --- */
function generateSignal(){
    document.getElementById("result").style.display = "block";
    
    // Generates absolute 50/50 balance roll for active shifting signals
    let decisionRoll = Math.random() > 0.5;

    let rsi, trend, macd, pattern, signal, confidence, textColor, ema9, ema21;

    if (decisionRoll) {
        signal = "BUY";
        rsi = Math.floor(Math.random() * 15) + 55; 
        trend = "STRONG UP";
        macd = "BULLISH CROSS";
        pattern = "3 WHITE SOLDIERS";
        confidence = Math.floor(Math.random() * 4) + 91;
        textColor = "#00E676"; 
        ema9 = currentPrice + 0.0004;
        ema21 = currentPrice - 0.0002;
    } else {
        signal = "SELL";
        rsi = Math.floor(Math.random() * 15) + 30; 
        trend = "STRONG DOWN";
        macd = "BEARISH CROSS";
        pattern = "EVENING STAR";
        confidence = Math.floor(Math.random() * 4) + 90;
        textColor = "#ff3b3b"; 
        ema9 = currentPrice - 0.0004;
        ema21 = currentPrice + 0.0002;
    }

    lastSignal = signal;
    const signalBox = document.getElementById("signal");
    signalBox.innerText = signal;
    signalBox.className = "signal " + signal.toLowerCase();

    document.getElementById("conf").innerText = confidence + "% ACCURACY MATCH";
    document.getElementById("rsi").innerText = rsi;
    document.getElementById("trend").innerText = trend;
    document.getElementById("trend").style.color = textColor;
    
    document.getElementById("ema9").innerText = ema9.toFixed(4);
    document.getElementById("ema21").innerText = ema21.toFixed(4);
    document.getElementById("macd").innerText = macd;
    document.getElementById("pattern").innerText = pattern;

    document.getElementById("order-id").innerText = "ABX-" + Math.floor(100000 + Math.random() * 900000);
    let now = new Date();
    document.getElementById("execution-time").innerText = now.toLocaleTimeString();

    triggerFuturisticSound(signal);
}
</script>

</body>
</html>
