<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>🇵🇰 PAK AI SIGNAL BOARD</title>  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">  <style>  
  
*{  
margin:0;  
padding:0;  
box-sizing:border-box;  
}  
  
body{  
  
background:#050816;  
  
font-family:'Orbitron',sans-serif;  
  
color:white;  
  
display:flex;  
justify-content:center;  
align-items:center;  
  
min-height:100vh;  
  
padding:15px;  
}  
  
.container{  
  
width:100%;  
max-width:450px;  
}  
  
.card{  
  
background:#0d1328;  
  
border-radius:25px;  
  
padding:20px;  
  
box-shadow:  
0 0 30px rgba(0,255,120,0.15);  
  
border:1px solid rgba(0,255,120,0.15);  
}  
  
.title{  
  
text-align:center;  
  
font-size:24px;  
  
font-weight:900;  
  
margin-bottom:15px;  
  
color:#00ff99;  
}  
  
.live{  
  
display:flex;  
  
justify-content:center;  
align-items:center;  
  
gap:8px;  
  
margin-bottom:15px;  
  
font-size:12px;  
  
color:#baffdc;  
}  
  
.dot{  
  
width:8px;  
height:8px;  
  
background:#00ff99;  
  
border-radius:50%;  
  
animation:blink 1s infinite;  
}  
  
@keyframes blink{  
  
0%,100%{  
opacity:1;  
}  
  
50%{  
opacity:0.2;  
}  
  
}  
  
select{  
  
width:100%;  
  
padding:14px;  
  
border:none;  
  
outline:none;  
  
border-radius:15px;  
  
background:#131d38;  
  
color:white;  
  
font-size:15px;  
  
margin-bottom:15px;  
}  
  
iframe{  
  
width:100%;  
  
height:250px;  
  
border:none;  
  
border-radius:18px;  
  
margin-bottom:15px;  
  
background:black;  
}  
  
.timerBox{  
  
text-align:center;  
  
margin-bottom:15px;  
}  
  
.timer{  
  
font-size:38px;  
  
font-weight:900;  
  
color:#00ff99;  
  
text-shadow:  
0 0 15px #00ff99;  
}  
  
.label{  
  
font-size:11px;  
  
margin-top:5px;  
  
color:#a5ffd0;  
}  
  
.signalBox{  
  
padding:20px;  
  
border-radius:20px;  
  
text-align:center;  
  
margin-top:10px;  
  
transition:0.3s;  
}  
  
.signal{  
  
font-size:30px;  
  
font-weight:900;  
  
margin-bottom:10px;  
}  
  
.buy{  
  
background:rgba(0,255,120,0.12);  
  
border:1px solid #00ff99;  
}  
  
.sell{  
  
background:rgba(255,0,0,0.12);  
  
border:1px solid #ff4444;  
}  
  
.wait{  
  
background:rgba(255,170,0,0.12);  
  
border:1px solid #ffaa00;  
}  
  
.data{  
  
font-size:13px;  
  
line-height:1.7;  
  
margin-top:10px;  
}  
  
.btn{  
  
width:100%;  
  
padding:15px;  
  
margin-top:15px;  
  
border:none;  
  
border-radius:18px;  
  
background:  
linear-gradient(90deg,#00aa55,#00ff99);  
  
color:black;  
  
font-weight:900;  
  
font-size:14px;  
  
cursor:pointer;  
}  
  
.note{  
  
margin-top:15px;  
  
font-size:10px;  
  
line-height:1.6;  
  
color:#c8ffe3;  
  
text-align:center;  
}  
  
</style>  </head>  <body>  <div class="container">  <div class="card">  <div class="title">  
🇵🇰 PAK AI SIGNAL BOARD  
</div>  <div class="live">  <div class="dot"></div>  LIVE MARKET ACTIVE

</div>  <select id="pair" onchange="loadChart()">  <option value="FX:EURUSD">  
EUR/USD  
</option>  <option value="FX:GBPUSD">  
GBP/USD  
</option>  <option value="FX_IDC:USDPKR">  
USD/PKR  
</option>  <option value="FX_IDC:USDINR">  
USD/INR  
</option>  <option value="FX_IDC:USDBRL">  
USD/BRL  
</option>  </select>  <iframe id="chart"></iframe>  <div class="timerBox">  <div class="timer" id="timer">  
60  
</div>  <div class="label">  
QUOTEX STYLE TIMER  
</div>  </div>  <div class="signalBox wait" id="signalBox">  <div class="signal" id="signalText">  
WAIT ⏳  
</div>  <div class="data" id="marketData">  RSI: --
<br>
EMA: --
<br>
TREND: --

</div>  </div>  <button  
class="btn"  
onclick="generateSignal()">

SCAN SIGNAL

</button>  <div class="note">  🎯 RSI + EMA + TREND FILTER SYSTEM

</div>  </div>  </div>  <script>  
  
// LOAD CHART  
  
function loadChart(){  
  
const pair =  
document.getElementById('pair').value;  
  
document.getElementById('chart').src =  
  
`https://s.tradingview.com/widgetembed/?symbol=${pair.replace(":","%3A")}&interval=1&theme=dark&style=1`;  
  
}  
  
loadChart();  
  
// TIMER  
  
let time = 60;  
  
setInterval(()=>{  
  
time--;  
  
if(time <= 0){  
  
time = 60;  
  
generateSignal();  
  
}  
  
document.getElementById('timer').innerHTML =  
time;  
  
},1000);  
  
// SIGNAL ENGINE  
  
function generateSignal(){  
  
// DEMO RSI  
  
let rsi =  
Math.floor(Math.random()*40)+30;  
  
// DEMO EMA  
  
let ema =  
Math.floor(Math.random()*100)+100;  
  
// TREND  
  
let trend =  
"SIDEWAYS";  
  
// SIGNAL  
  
let signal =  
"WAIT ⏳";  
  
// CLASS  
  
let className =  
"signalBox wait";  
  
// BUY LOGIC  
  
if(rsi > 58){  
  
trend =  
"UPTREND";  
  
signal =  
"BUY 📈";  
  
className =  
"signalBox buy";  
  
}  
  
// SELL LOGIC  
  
else if(rsi < 42){  
  
trend =  
"DOWNTREND";  
  
signal =  
"SELL 📉";  
  
className =  
"signalBox sell";  
  
}  
  
// UPDATE UI  
  
document.getElementById('signalText').innerHTML =  
signal;  
  
document.getElementById('signalBox').className =  
className;  
  
document.getElementById('marketData').innerHTML =  
  
`  
RSI: ${rsi}  
<br>  
EMA: ${ema}  
<br>  
TREND: ${trend}  
`;  
  
}  
  
// FIRST SIGNAL  
  
generateSignal();  
  
</script>  </body>  
</html>
