<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PINK PANTHER AI SIGNAL X</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@500;900&display=swap" rel="stylesheet">

<style>
:root{
    --pink:#ff1493;
    --orange:#ff4fd8;
    --dark:#050103;
    --glass:rgba(20,5,12,.92);
    --border:rgba(255,0,127,.3);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--dark);
    background-image:
    radial-gradient(circle at top, rgba(255,20,147,.22), transparent 40%),
    radial-gradient(circle at bottom, rgba(255,105,180,.18), transparent 40%),
    linear-gradient(135deg,#050103,#140014,#1a001f);
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:430px;
    padding:15px;
}

.card{
    position:relative;
    overflow:hidden;
}

.card::before{
    content:'';
    position:absolute;
    width:220px;
    height:220px;
    background:radial-gradient(circle, rgba(255,20,147,.25), transparent 70%);
    top:-80px;
    right:-80px;
    border-radius:50%;
}

.card::after{
    content:'';
    position:absolute;
    width:180px;
    height:180px;
    background:radial-gradient(circle, rgba(255,105,180,.15), transparent 70%);
    bottom:-70px;
    left:-70px;
    border-radius:50%;
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:35px;
    padding:28px 24px;
    backdrop-filter:blur(25px);
    box-shadow:0 30px 80px rgba(255,20,147,.18),0 20px 50px rgba(0,0,0,.85);
    text-align:center;
}

.logo{
    font-size:65px;
    animation:pulse 3s infinite ease-in-out;
    filter:drop-shadow(0 0 18px var(--orange));
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.08)}
}

.title{
    font-family:'Orbitron',sans-serif;
    font-size:24px;
    font-weight:900;
    letter-spacing:3px;
    background:linear-gradient(to right,var(--orange),var(--pink));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    margin:15px 0 25px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(255,106,0,.12);
    color:var(--orange);
    border:1px solid rgba(255,106,0,.3);
    border-radius:40px;
    padding:7px 14px;
    font-size:11px;
    font-weight:800;
    margin-bottom:20px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--orange);
    box-shadow:0 0 10px var(--orange);
}

.input,
select{
    width:100%;
    padding:16px;
    border-radius:16px;
    border:1px solid var(--border);
    background:#10040a;
    color:#fff;
    margin-bottom:18px;
    outline:none;
    font-size:15px;
}

.btn{
    width:100%;
    border:none;
    padding:18px;
    border-radius:18px;
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    letter-spacing:1px;
    cursor:pointer;
    background:linear-gradient(135deg,#ff1493,#ff4fd8,#ff80df);
    color:#fff;
    transition:.3s;
    box-shadow:0 10px 25px rgba(255,0,127,.35);
}

.btn:hover{
    transform:translateY(-3px);
}

iframe{
    width:100%;
    height:240px;
    border:none;
    border-radius:20px;
    margin-bottom:18px;
}

.loader{
    width:100%;
    height:5px;
    background:#1a0510;
    border-radius:10px;
    overflow:hidden;
    margin-top:18px;
    display:none;
}

.fill{
    width:0%;
    height:100%;
    background:linear-gradient(to right,var(--orange),var(--pink));
    transition:2.5s linear;
}

.result{
    display:none;
    margin-top:22px;
    border-radius:24px;
    padding:22px;
    background:rgba(255,255,255,.03);
    border:1px solid var(--border);
}

.signal{
    font-family:'Orbitron',sans-serif;
    font-size:32px;
    font-weight:900;
}

.small{
    margin-top:10px;
    font-size:13px;
    font-weight:bold;
}

.strategy{
    margin-top:12px;
    font-size:10px;
    letter-spacing:2px;
    color:#888;
}

.note{
    margin-top:18px;
    font-size:11px;
    color:#999;
    line-height:1.6;
}
</style>
</head>

<body>

<div class="container">

<div class="card" id="loginBox">
<div class="logo">🐯</div>
<div class="title">PINK PANTHER LOGIN</div>

<input type="password" id="password" class="input" placeholder="ENTER ACCESS KEY">

<button class="btn" onclick="loginBot()">WAKE THE TIGER</button>
</div>

<div id="mainBot" style="display:none;">
<div class="card">

<div class="badge">
<div class="dot"></div>
LIVE AI SCANNER ACTIVE
</div>

<div class="title">PINK PANTHER AI X</div>

<select id="pair" onchange="updateChart()">
<option value="FX_IDC:USDBRL">USD/BRL (OTC)</option>
<option value="FX_IDC:USDMXN">USD/MXN (OTC)</option>
<option value="FX_IDC:USDINR">USD/INR (OTC)</option>
<option value="FX:EURUSD">EUR/USD</option>
<option value="FX:GBPUSD">GBP/USD</option>
<option value="FX:USDJPY">USD/JPY</option>
<option value="CRYPTOCAP:BTC">BITCOIN</option>
</select>

<iframe id="chart" src="https://s.tradingview.com/widgetembed/?symbol=FX%3AEURUSD&interval=1&theme=dark"></iframe>

<button class="btn" onclick="generateSignal()" id="scanBtn">
SCAN MARKET
</button>

<div class="loader" id="loader">
<div class="fill" id="fill"></div>
</div>

<div class="result" id="resultBox">
<div class="signal" id="signalText"></div>
<div class="small" id="accuracy"></div>
<div class="small" id="marketData"></div>
<div class="strategy" id="strategy"></div>
</div>

<div class="note">
یہ signals RSI + EMA logic پر based demo signals ہیں۔
ہمیشہ risk management استعمال کریں۔
</div>

</div>
</div>

</div>

<script>

function loginBot(){
    const pass = document.getElementById('password').value;

    if(pass === 'Tiger786'){
        document.getElementById('loginBox').style.display='none';
        document.getElementById('mainBot').style.display='block';
    }else{
        alert('WRONG ACCESS KEY');
    }
}

function updateChart(){
    const pair = document.getElementById('pair').value.replace(':','%3A');

    document.getElementById('chart').src =
    `https://s.tradingview.com/widgetembed/?symbol=${pair}&interval=1&theme=dark`;
}

function fakeRSI(){
    return Math.floor(Math.random()*100);
}

function fakeEMAFast(){
    return Math.random()*100;
}

function fakeEMASlow(){
    return Math.random()*100;
}

function generateSignal(){

    const loader = document.getElementById('loader');
    const fill = document.getElementById('fill');
    const btn = document.getElementById('scanBtn');
    const result = document.getElementById('resultBox');

    btn.disabled = true;
    btn.innerText = 'ANALYZING...';

    result.style.display='none';

    loader.style.display='block';
    fill.style.width='0%';

    setTimeout(()=>{
        fill.style.width='100%';
    },50);

    setTimeout(()=>{

        loader.style.display='none';
        btn.disabled = false;
        btn.innerText = 'SCAN MARKET';

        const rsi = fakeRSI();
        const emaFast = fakeEMAFast();
        const emaSlow = fakeEMASlow();

        let signal = 'WAIT';
        let color = '#ffaa00';
        let strategy = 'NO STRONG CONFIRMATION';

        if(rsi < 35 && emaFast > emaSlow){
            signal = '↑ CALL';
            color = '#00ff9d';
            strategy = 'RSI OVERSOLD + EMA BULLISH';
        }
        else if(rsi > 65 && emaFast < emaSlow){
            signal = '↓ PUT';
            color = '#ff3131';
            strategy = 'RSI OVERBOUGHT + EMA BEARISH';
        }

        result.style.display='block';

        const signalText = document.getElementById('signalText');
        signalText.innerText = signal;
        signalText.style.color = color;

        document.getElementById('accuracy').innerText =
        'CONFIDENCE: ' + (Math.random()*8 + 88).toFixed(1) + '%';

        document.getElementById('accuracy').style.color = color;

        document.getElementById('marketData').innerText =
        `RSI: ${rsi} | EMA FAST: ${emaFast.toFixed(2)} | EMA SLOW: ${emaSlow.toFixed(2)}`;

        document.getElementById('strategy').innerText = strategy;

        result.style.borderColor = color + '66';
        result.style.boxShadow = `0 0 25px ${color}33`;

    },2500);
}

</script>

</body>
</html>
