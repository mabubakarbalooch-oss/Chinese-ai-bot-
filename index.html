<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA ABUBAKAR SIGNAL PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>
:root{
--bg:#0a0a0f;
--card:#1a1a24;
--primary:#00ff78;
--red:#ff4d4d;
--text:#ffffff;
--muted:#8a8a9e;
--border:#2a2a35;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:var(--bg);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
color:var(--text);
}

.container{
width:100%;
max-width:400px;
background:var(--card);
border-radius:20px;
padding:20px;
border:1px solid var(--border);
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{
display:flex;
align-items:center;
gap:10px;
}

.logo-icon{
width:45px;height:45px;
border-radius:12px;
background:linear-gradient(135deg,#00ff78,#00cc66);
display:flex;
justify-content:center;
align-items:center;
font-weight:900;
font-family:'Orbitron';
color:#000;
font-size:18px;
}

.status{
padding:6px 12px;
border-radius:20px;
background:rgba(0,255,120,0.1);
color:var(--primary);
font-size:11px;
font-weight:700;
}

select,input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid var(--border);
background:#0f0f15;
color:#fff;
margin-bottom:12px;
}

.btn{
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,var(--primary),#00cc66);
font-weight:800;
font-family:'Orbitron';
cursor:pointer;
margin-bottom:10px;
}

#scanner{
height:140px;
display:none;
background:#0f0f15;
border-radius:12px;
margin-bottom:10px;
position:relative;
overflow:hidden;
}

.scan-line{
position:absolute;
width:100%;
height:3px;
background:linear-gradient(90deg,transparent,var(--primary),transparent);
animation:scan 1.5s infinite linear;
}

@keyframes scan{
0%{top:0;}
100%{top:100%;}
}

#chartContainer{
height:200px;
display:none;
border-radius:12px;
margin-bottom:10px;
background:#0f0f15;
}

#signalBox{
display:none;
padding:18px;
text-align:center;
font-size:28px;
font-weight:900;
font-family:'Orbitron';
border-radius:12px;
margin-bottom:10px;
}

.buy-style{
background:rgba(0,255,120,0.1);
color:var(--primary);
border:1px solid rgba(0,255,120,0.3);
}

.sell-style{
background:rgba(255,77,77,0.1);
color:var(--red);
border:1px solid rgba(255,77,77,0.3);
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.stat{
background:#0f0f15;
border:1px solid var(--border);
border-radius:12px;
padding:12px;
text-align:center;
}

.stat h3{font-size:10px;color:var(--muted);}
.stat p{font-size:15px;font-weight:700;}
</style>
</head>

<body>

<div id="loginScreen" class="container">

<div class="header">
<div class="logo">
<div class="logo-icon">QX</div>
<div>
<h1>LUBNA ABUBAKAR</h1>
<p>ELITE ACCESS SYSTEM</p>
</div>
</div>
<div class="status">● SAFE</div>
</div>

<input type="password" id="password" placeholder="Enter Password">
<button class="btn" onclick="login()">UNLOCK SYSTEM</button>

</div>

<div id="mainBoard" class="container" style="display:none;">

<div class="header">
<div class="logo">
<div class="logo-icon">QX</div>
<div>
<h1>LUBNA ABUBAKAR</h1>
<p>ULTRA AI SIGNAL - 1 MINUTE LIVE</p>
</div>
</div>
<div class="status">● LIVE</div>
</div>

<select id="pair">
<option value="btcusdt">BTC/USDT</option>
<option value="ethusdt">ETH/USDT</option>
<option value="bnbusdt">BNB/USDT</option>
</select>

<button class="btn" onclick="start()">GENERATE LIVE SIGNAL</button>

<div id="scanner"><div class="scan-line"></div></div>

<div id="chartContainer"></div>

<div id="signalBox"></div>

<div class="stats">
<div class="stat"><h3>RSI</h3><p id="rsi">--</p></div>
<div class="stat"><h3>TREND</h3><p id="trend">--</p></div>
<div class="stat"><h3>CONF</h3><p id="conf">--</p></div>
<div class="stat"><h3>MACD</h3><p id="macd">--</p></div>
</div>

</div>

<script>

let ws;
let chart;
let series;
let closes=[];

/* LOGIN */
function login(){
if(document.getElementById("password").value==="Lubna786"){
document.getElementById("loginScreen").style.display="none";
document.getElementById("mainBoard").style.display="block";
}else alert("Wrong Password");
}

/* CHART FIXED */
function initChart(){
const el=document.getElementById("chartContainer");
el.innerHTML="";

chart=LightweightCharts.createChart(el,{
width:el.clientWidth,
height:200,
layout:{background:{color:"#0f0f15"},textColor:"#8a8a9e"},
grid:{vertLines:{color:"#2a2a35"},horzLines:{color:"#2a2a35"}},
timeScale:{timeVisible:true}
});

series=chart.addCandlestickSeries({
upColor:"#00ff78",
downColor:"#ff4d4d",
borderVisible:false,
wickUpColor:"#00ff78",
wickDownColor:"#ff4d4d"
});
}

/* RSI */
function RSI(data){
let g=0,l=0;
for(let i=1;i<data.length;i++){
let d=data[i]-data[i-1];
if(d>0)g+=d; else l+=Math.abs(d);
}
if(l===0)return 100;
let rs=(g/data.length)/(l/data.length);
return 100-(100/(1+rs));
}

/* START LIVE */
function start(){

if(ws) ws.close();

initChart();

let pair=document.getElementById("pair").value;

ws=new WebSocket(`wss://stream.binance.com:9443/ws/${pair}@kline_1m`);

ws.onmessage=(e)=>{

let k=JSON.parse(e.data).k;

let candle={
time:k.t/1000,
open:+k.o,
high:+k.h,
low:+k.l,
close:+k.c
};

series.update(candle);

closes.push(candle.close);
if(closes.length>50)closes.shift();

if(closes.length<10)return;

let rsi=RSI(closes);

let box=document.getElementById("signalBox");
box.style.display="block";

let signal="WAIT";

if(rsi<35) signal="BUY";
else if(rsi>65) signal="SELL";

if(signal==="BUY"){
box.innerHTML="📈 BUY";
box.className="buy-style";
}
else if(signal==="SELL"){
box.innerHTML="📉 SELL";
box.className="sell-style";
}
else{
box.innerHTML="⏸ WAIT";
box.className="";
}

document.getElementById("rsi").innerText=Math.floor(rsi);
document.getElementById("trend").innerText=signal;

};

}

/* RESIZE FIX */
window.addEventListener("resize",()=>{
if(chart){
chart.applyOptions({width:document.getElementById("chartContainer").clientWidth});
}
});

</script>

</body>
</html>
