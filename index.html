<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TRADING BOT - ELITE PINK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff007f;
            --pink-dark: #800040;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 0, 127, 0.25);
            --bg-color: #080105;
        }

        body { 
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 0, 127, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 127, 0.08) 0%, transparent 40%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 400px; padding: 20px; }

        .bot-card {
            background: rgba(15, 5, 10, 0.8);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            text-align: center;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--pink);
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
            margin-bottom: 20px;
        }

        .status-badge {
            background: rgba(255, 0, 127, 0.1);
            color: var(--pink);
            padding: 6px 15px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 0.5px solid var(--border);
            margin-bottom: 25px;
        }

        .pulse { width: 8px; height: 8px; background: var(--pink); border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: #150a0f;
            color: #fff;
            border: 1px solid var(--border);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            appearance: none;
            cursor: pointer;
            margin-bottom: 15px;
        }

        #tv-frame { 
            border-radius: 16px; 
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
        }

        .btn-analyze {
            background: var(--pink);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(255, 0, 127, 0.2);
        }

        .btn-analyze:hover { transform: scale(1.02); box-shadow: 0 15px 30px rgba(255, 0, 127, 0.4); }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 18px;
            display: none;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn { from { opacity: 0; filter: blur(10px); } to { opacity: 1; filter: blur(0); } }

        .signal-text { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; }

        .loader-bar { width: 100%; height: 4px; background: #222; border-radius: 10px; margin-top: 20px; display: none; overflow: hidden; }
        .loader-progress { height: 100%; width: 0%; background: var(--pink); transition: 2s linear; }

        .login-input {
            width: 100%; padding: 15px; border-radius: 12px; background: #000; border: 1px solid var(--border); color: #fff;
            text-align: center; font-size: 18px; margin-bottom: 15px; box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Login Screen -->
    <div id="loginSection" class="bot-card">
        <div style="font-size: 30px; margin-bottom: 10px;">👑</div>
        <div class="header-title">ELITE ACCESS</div>
        <input type="password" id="passInput" class="login-input" placeholder="ENTER ACCESS KEY">
        <button class="btn-analyze" onclick="checkPass()">LOGIN SYSTEM</button>
    </div>

    <!-- Main Bot Content -->
    <div id="botContent" style="display: none;">
        <div class="bot-card">
            <div class="status-badge"><div class="pulse"></div> SYSTEM LIVE</div>
            <div class="header-title">ANALYZER</div>
            
            <select id="assetSelect" onchange="updateChart()">
                <option value="FX_IDC:USDBRL">USD/BRL (OTC)</option>
                <option value="CRYPTOCAP:BTC">BITCOIN (Live)</option>
                <option value="FX:EURUSD">EUR/USD (OTC)</option>
            </select>

            <iframe id="tv-frame" src="https://s.tradingview.com/widgetembed/?symbol=FX_IDC%3AUSDBRL&interval=1&theme=dark" width="100%" height="220" frameborder="0"></iframe>

            <button id="analyzeBtn" class="btn-analyze" onclick="getSignal()">START ANALYSIS</button>
            
            <div id="loader" class="loader-bar"><div id="fill" class="loader-progress"></div></div>

            <div id="result">
                <p id="sigText" class="signal-text"></p>
                <div id="accBox" style="font-size: 14px; margin-top: 5px; opacity: 0.8;"></div>
                <div id="strat" style="font-size: 10px; color: #666; margin-top: 10px; text-transform: uppercase;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    function checkPass() {
        if(document.getElementById("passInput").value === "Mybot786") {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("botContent").style.display = "block";
        } else {
            alert("WRONG KEY!");
        }
    }

    function updateChart() {
        const pair = document.getElementById("assetSelect").value.replace(":", "%3A");
        document.getElementById("tv-frame").src = `https://s.tradingview.com/widgetembed/?symbol=${pair}&interval=1&theme=dark`;
    }

    function getSignal() {
        const res = document.getElementById("result");
        const loader = document.getElementById("loader");
        const fill = document.getElementById("fill");
        const btn = document.getElementById("analyzeBtn");

        btn.disabled = true;
        btn.innerText = "PROCESSING...";
        res.style.display = "none";
        loader.style.display = "block";
        fill.style.width = "0%";
        
        setTimeout(() => fill.style.width = "100%", 50);

        setTimeout(function() {
            loader.style.display = "none";
            btn.disabled = false;
            btn.innerText = "START ANALYSIS";
            res.style.display = "block";

            const isUp = Math.random() > 0.5;
            const signal = isUp ? "↑ CALL" : "↓ PUT";
            const color = isUp ? "#00ff9d" : "#ff3131";
            
            const sigEl = document.getElementById("sigText");
            sigEl.innerText = signal;
            sigEl.style.color = color;
            
            document.getElementById("accBox").innerText = `STRENGTH: ${(Math.random() * (99 - 94) + 94).toFixed(2)}%`;
            document.getElementById("strat").innerText = isUp ? "Trend Support Confirmed" : "Resistance Rejection Noted";
            
            res.style.borderColor = color + "44";
        }, 2000);
    }
</script>
</body>
</html>
