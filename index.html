<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP SIGNAL BOT</title>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0b1020;
color:white;
overflow:hidden;
}

.header{
height:60px;
background:#111827;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
box-shadow:0 0 10px rgba(0,0,0,0.5);
}

.logo{
font-size:22px;
font-weight:bold;
color:#00ff99;
}

.live{
color:#00ff99;
font-size:18px;
}

.chart-box{
height:60vh;
width:100%;
}

.panel{
padding:15px;
background:#111827;
position:fixed;
bottom:0;
width:100%;
border-top-left-radius:20px;
border-top-right-radius:20px;
box-shadow:0 -5px 20px rgba(0,0,0,0.5);
}

.row{
display:flex;
justify-content:space-between;
margin-bottom:15px;
}

.card{
width:48%;
background:#1e293b;
padding:15px;
border-radius:15px;
text-align:center;
}

.title{
font-size:15px;
color:#94a3b8;
margin-bottom:8px;
}

.value{
font-size:22px;
font-weight:bold;
}

.buy{
color:#00ff99;
}

.sell{
color:#ff4d4d;
}

.scan{
margin-top:10px;
font-size:16px;
text-align:center;
color:#38bdf8;
}

.buttons{
display:flex;
gap:10px;
margin-top:15px;
}

button{
flex:1;
padding:15px;
font-size:22px;
border:none;
border-radius:15px;
font-weight:bold;
color:white;
cursor:pointer;
}

.up{
background:#00c853;
}

.down{
background:#ff1744;
}

.rsi-box{
margin-top:15px;
background:#1e293b;
padding:15px;
border-radius:15px;
text-align:center;
}

.ma-box{
margin-top:15px;
background:#1e293b;
padding:15px;
border-radius:15px;
text-align:center;
}

.alert{
position:fixed;
top:80px;
left:50%;
transform:translateX(-50%);
background:#00c853;
padding:12px 25px;
border-radius:12px;
font-size:18px;
font-weight:bold;
display:none;
z-index:999;
}

</style>
</head>
<body>

<div class="header">
<div class="logo">🇵🇰 VIP SIGNAL BOT</div>
<div class="live">LIVE</div>
</div>

<div id="tvchart" class="chart-box"></div>

<div class="alert" id="alertBox">
SIGNAL FOUND
</div>

<div class="panel">

<div class="row">
<div class="card">
<div class="title">PAIR</div>
<div class="value" id="pair">BINANCE:BTCUSDT</div>
</div>

<div class="card">
<div class="title">SIGNAL</div>
<div class="value buy" id="signal">BUY</div>
</div>
</div>

<div class="row">
<div class="card">
<div class="title">RSI</div>
<div class="value" id="rsi">63</div>
</div>

<div class="card">
<div class="title">MOVING AVG</div>
<div class="value" id="ma">BULLISH</div>
</div>
</div>

<div class="scan" id="scanner">
📡 Live Market Scanner Running...
</div>

<div class="buttons">
<button class="up" onclick="manualSignal('BUY')">UP</button>
<button class="down" onclick="manualSignal('SELL')">DOWN</button>
</div>

</div>

<audio id="beep">
<source src="https://www.soundjay.com/buttons/sounds/beep-01a.mp3" type="audio/mpeg">
</audio>

<script>

new TradingView.widget({
"container_id": "tvchart",
"width": "100%",
"height": "100%",
"symbol": "BINANCE:BTCUSDT",
"interval": "1",
"timezone": "Asia/Karachi",
"theme": "dark",
"style": "1",
"locale": "en",
"toolbar_bg": "#111827",
"enable_publishing": false,
"hide_top_toolbar": true,
"hide_legend": false,
"save_image": false,
"studies": [
"RSI@tv-basicstudies",
"MASimple@tv-basicstudies"
]
});

const pairs = [
"BINANCE:BTCUSDT",
"BINANCE:ETHUSDT",
"BINANCE:BNBUSDT",
"BINANCE:XRPUSDT",
"BINANCE:SOLUSDT",
"FX:USDINR",
"FX:USDPKR",
"FX:USDBRL"
];

function generateSignal(){

let signal = Math.random() > 0.5 ? 'BUY' : 'SELL';
let rsi = Math.floor(Math.random()*40)+40;

let pair = pairs[Math.floor(Math.random()*pairs.length)];

document.getElementById('pair').innerHTML = pair;
document.getElementById('signal').innerHTML = signal;
document.getElementById('rsi').innerHTML = rsi;

document.getElementById('ma').innerHTML =
signal === 'BUY' ? 'BULLISH' : 'BEARISH';

if(signal === 'BUY'){
document.getElementById('signal').className='value buy';
}else{
document.getElementById('signal').className='value sell';
}

showAlert(signal + ' SIGNAL');

}

function showAlert(text){

let box = document.getElementById('alertBox');
box.innerHTML = text;
box.style.display = 'block';

document.getElementById('beep').play();

setTimeout(()=>{
box.style.display='none';
},3000);

}

function manualSignal(type){
showAlert(type + ' CLICKED');
}

setInterval(()=>{
generateSignal();
},10000);

generateSignal();

</script>

</body>
</html>
