<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PAK AI SIGNAL X - V11.5 PRO</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root {
            --sky: #00d4ff;
            --sky-dim: rgba(0, 212, 255, 0.2);
            --bg: #010a0f;
            --card-bg: rgba(2, 18, 28, 0.95);
            --red: #ff4757;
            --gold: #ffaa00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; overflow: hidden; }

        .app-window {
            width: 100%; max-width: 420px; background: var(--card-bg);
            border: 1px solid var(--sky-dim); border-radius: 40px;
            padding: 25px; box-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
            position: relative; animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        h1 { color: #fff; font-size: 20px; text-align: center; text-shadow: 0 0 10px var(--sky); margin-bottom: 20px; text-transform: uppercase; }

        input, select { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 18px; background: #000; border: 1px solid var(--sky-dim); color: #fff; text-align: center; font-weight: bold; outline: none; }

        .main-btn {
            width: 100%; padding: 18px; border-radius: 50px; border: none;
            background: linear-gradient(135deg, #0088cc, var(--sky));
            color: #000; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        .main-btn:active { transform: scale(0.95); }

        #chart-frame { height: 180px; background: #000; border-radius: 25px; overflow: hidden; border: 1px solid #111; position: relative; margin-bottom: 15px; }
        .laser { position: absolute; width: 100%; height: 3px; background: var(--sky); box-shadow: 0 0 20px var(--sky); top: -10%; display: none; z-index: 10; }
        .scanning .laser { display: block; animation: scan 2s linear infinite; }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

        .result-panel { display: none; margin-top: 15px; padding: 15px; border: 2px solid var(--sky-dim); border-radius: 25px; background: rgba(0,212,255,0.03); text-align: center; }
        .sig-text { font-size: 32px; font-weight: 900; margin: 5px 0; }
        .acc-badge { font-size: 11px; background: var(--sky); color: #000; padding: 3px 10px; border-radius: 8px; font-weight: bold; }

        .history-box { margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }
        .history-box h3 { font-size: 11px; color: var(--sky); margin-bottom: 8px; text-align: left; }
        table { width: 100%; font-size: 11px; color: #ccc; }
        .win { color: var(--sky); font-weight: bold; }

        .risk-note { font-size: 9px; color: #556677; margin-top: 15px; text-align: center; line-height: 1.3; }
    </style>
</head>
<body>

<div class="app-window" id="loginScreen">
    <h1>PAK AI SYSTEM</h1>
    <input type="text" id="userInput" placeholder="ENTER PASSWORD">
    <button class="main-btn" onclick="checkPass()">LOGIN SYSTEM</button>
    <p style="color: #444; font-size: 10px; margin-top: 10px;">Default Key: Pak786</p>
</div>

<div class="app-window" id="botScreen" style="display:none;">
    <h1>SIGNAL MASTER PRO</h1>
    
    <div id="chart-frame">
        <div class="laser" id="laser"></div>
        <div id="tv-mount"></div>
    </div>

    <select id="assetSelect" onchange="switchAsset()">
        <option value="USDBRL">USD/BRL (OTC)</option>
        <option value="USDMXN">USD/MXN (OTC)</option>
        <option value="USDINR">USD/INR (REAL)</option>
        <option value="USDPKR">USD/PKR (REAL)</option>
        <option value="EURUSD">EUR/USD (BINANCE)</option>
        <option value="BTCUSDT">BTC/USDT (CRYPTO)</option>
    </select>

    <button class="main-btn" id="scanBtn" onclick="startScan()">⚡ EXECUTE AI SCAN</button>

    <div class="result-panel" id="resPanel">
        <span class="acc-badge" id="accVal">ACCURACY: 99%</span>
        <div class="sig-text" id="sigVal">---</div>
        <div id="timerVal" style="color: var(--gold); font-weight: bold; font-size: 13px;">READY</div>
    </div>

    <div class="history-box">
        <h3>LATEST SIGNALS</h3>
        <table><tbody id="histList"></tbody></table>
    </div>

    <div class="risk-note">
        PAK AI V11.5 - PROFESSIONAL BRANDING EDITION
    </div>
</div>

<script>
    let audio = null;

    // LOGIN FUNCTION (MAZBOOT LOGIC)
    function checkPass() {
        const input = document.getElementById('userInput').value.trim();
        if(input.toLowerCase() === "pak786") {
            document.getElementById('loginScreen').style.display = "none";
            document.getElementById('botScreen').style.display = "block";
            switchAsset();
            audio = new (window.AudioContext || window.webkitAudioContext)();
        } else {
            alert("Incorrect Password! Please use 'Pak786'");
        }
    }

    function switchAsset() {
        const symbol = document.getElementById('assetSelect').value;
        const mount = document.getElementById('tv-mount');
        mount.innerHTML = '';
        let tvSym = (symbol === "EURUSD" || symbol === "BTCUSDT") ? "BINANCE:" + symbol : "FX_IDC:" + symbol;
        new TradingView.widget({ "width": "100%", "height": 180, "symbol": tvSym, "interval": "1", "theme": "dark", "style": "1", "hide_top_toolbar": true, "container_id": "tv-mount" });
    }

    function playBeep(isCall) {
        if(!audio) return;
        let osc = audio.createOscillator();
        let gn = audio.createGain();
        osc.connect(gn); gn.connect(audio.destination);
        osc.frequency.setValueAtTime(isCall ? 1000 : 400, audio.currentTime);
        gn.gain.setValueAtTime(0.1, audio.currentTime);
        osc.start(); osc.stop(audio.currentTime + 0.3);
    }

    async function startScan() {
        const btn = document.getElementById('scanBtn');
        const frame = document.getElementById('chart-frame');
        const res = document.getElementById('resPanel');
        
        btn.disabled = true; btn.innerText = "🔍 ANALYZING...";
        frame.classList.add('scanning'); res.style.display = 'none';

        await new Promise(r => setTimeout(r, 2500));

        frame.classList.remove('scanning'); btn.disabled = false; btn.innerText = "⚡ EXECUTE AI SCAN";
        res.style.display = 'block';

        const isCall = Math.random() > 0.5;
        const sigVal = document.getElementById('sigVal');
        sigVal.innerText = isCall ? "CALL" : "PUT";
        sigVal.style.color = isCall ? "#00ff99" : "#ff4757";
        document.getElementById('accVal').innerText = "ACCURACY: " + (97 + Math.random() * 2.8).toFixed(1) + "%";
        playBeep(isCall);

        let t = 5;
        const timer = document.getElementById('timerVal');
        const itv = setInterval(() => {
            timer.innerText = "CONFIRM ENTRY: " + t + "s";
            t--;
            if(t < 0) {
                clearInterval(itv);
                timer.innerText = "✅ ENTER NOW";
                timer.style.color = "#00ff99";
                addHist(document.getElementById('assetSelect').value, isCall ? "CALL" : "PUT");
            }
        }, 1000);
    }

    function addHist(p, type) {
        const list = document.getElementById('histList');
        const row = `<tr><td style="padding:4px 0">${p}</td><td>${type}</td><td class="win">WIN</td></tr>`;
        list.innerHTML = row + list.innerHTML;
        if(list.rows.length > 3) list.deleteRow(3);
    }
</script>
</body>
</html>
