<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PAK AI SIGNAL X - DESKTOP PRO</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root {
            --neon: #00ff99;
            --neon-dim: rgba(0, 255, 153, 0.3);
            --bg: #010805;
            --card-bg: rgba(2, 20, 12, 0.85);
            --red: #ff4757;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body {
            background: var(--bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 153, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 153, 0.05) 0%, transparent 50%);
        }

        /* Pro Desktop Container */
        .app-window {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--neon-dim);
            border-radius: 40px;
            padding: 30px 25px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 20px var(--neon-dim);
            position: relative;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .title-bar { text-align: center; margin-bottom: 25px; }
        .title-bar h1 { 
            font-size: 22px; 
            color: #fff; 
            letter-spacing: 3px; 
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--neon);
        }

        /* Status Lights */
        .status-header { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 10px; color: var(--neon); font-weight: bold; }
        .pulse { width: 8px; height: 8px; background: var(--neon); border-radius: 50%; display: inline-block; box-shadow: 0 0 10px var(--neon); animation: pulse 1.5s infinite; margin-right: 5px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Market Box */
        #chart-frame {
            height: 190px;
            background: #000;
            border-radius: 25px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .scan-laser {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--neon);
            box-shadow: 0 0 15px var(--neon), 0 0 30px var(--neon);
            top: -10%;
            z-index: 10;
            display: none;
        }

        .scanning .scan-laser { display: block; animation: scanAnim 2s linear infinite; }
        @keyframes scanAnim { 0% { top: 0%; } 100% { top: 100%; } }

        /* Form Elements */
        select, input {
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--neon-dim);
            border-radius: 20px;
            color: #fff;
            margin-bottom: 15px;
            font-weight: 600;
            outline: none;
            transition: 0.3s;
        }
        select:focus, input:focus { border-color: var(--neon); box-shadow: 0 0 10px var(--neon-dim); }

        .main-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #008f4a, #00ff99);
            border: none;
            border-radius: 50px;
            color: #000;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,255,153,0.2);
        }
        .main-btn:hover { transform: scale(1.02); box-shadow: 0 15px 30px rgba(0,255,153,0.4); }
        .main-btn:active { transform: scale(0.95); }

        /* Result Display */
        .result-panel {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 25px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--neon-dim);
            text-align: center;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .sig-text { font-size: 38px; font-weight: 900; letter-spacing: -1px; margin: 10px 0; }
        .acc-badge { font-size: 12px; color: #000; background: var(--neon); padding: 4px 12px; border-radius: 10px; font-weight: 800; }
        
        .shake { animation: shakeEffect 0.4s ease-in-out; }
        @keyframes shakeEffect {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>

<div class="app-window" id="loginScreen">
    <div class="title-bar">
        <h1>PAK AI SYSTEM</h1>
    </div>
    <input type="password" id="passkey" placeholder="SECURE ACCESS KEY">
    <button class="main-btn" onclick="unlock()">INITIALIZE SYSTEM</button>
</div>

<div class="app-window" id="botScreen" style="display:none;">
    <div class="status-header">
        <span><div class="pulse"></div> AI SERVER: CONNECTED</span>
        <span id="liveTime">00:00:00</span>
    </div>
    
    <div class="title-bar">
        <h1>SIGNAL MASTER V11</h1>
    </div>

    <div id="chart-frame">
        <div class="scan-laser" id="laser"></div>
        <div id="tv-mount"></div>
    </div>

    <select id="assetSelect" onchange="switchAsset()">
        <option value="EURUSDT">EUR/USD - BINANCE</option>
        <option value="BTCUSDT">BTC/USD - BINANCE</option>
        <option value="ETHUSDT">ETH/USD - BINANCE</option>
    </select>

    <button class="main-btn" id="scanButton" onclick="executeScan()">⚡ EXECUTE AI SCAN</button>

    <div class="result-panel" id="resultDisplay">
        <span class="acc-badge" id="accuracyNum">ACCURACY 99.4%</span>
        <div class="sig-text" id="signalMain">---</div>
        <p style="font-size: 11px; color: #777;">ALGORITHM: NEURAL NETWORK V11</p>
        <div id="timerDisplay" style="color: #ffaa00; font-weight: bold; margin-top: 10px;">PREPARING...</div>
    </div>
</div>

<script>
    let audioContext = null;

    function unlock() {
        if(document.getElementById('passkey').value === 'Pak786') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('botScreen').style.display = 'block';
            switchAsset();
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            updateClock();
        } else { alert('ACCESS DENIED!'); }
    }

    function updateClock() {
        setInterval(() => {
            document.getElementById('liveTime').innerText = new Date().toLocaleTimeString();
        }, 1000);
    }

    function switchAsset() {
        const symbol = document.getElementById('assetSelect').value;
        const mount = document.getElementById('tv-mount');
        mount.innerHTML = '';
        new TradingView.widget({
            "width": "100%", "height": 190, "symbol": "BINANCE:" + symbol,
            "interval": "1", "theme": "dark", "style": "1",
            "hide_top_toolbar": true, "hide_legend": true, "container_id": "tv-mount"
        });
    }

    function playBeep(isCall) {
        if(!audioContext) return;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain); gain.connect(audioContext.destination);
        osc.frequency.setValueAtTime(isCall ? 900 : 350, audioContext.currentTime);
        gain.gain.setValueAtTime(0.2, audioContext.currentTime);
        osc.start(); osc.stop(audioContext.currentTime + 0.3);
    }

    async function executeScan() {
        const btn = document.getElementById('scanButton');
        const frame = document.getElementById('chart-frame');
        const res = document.getElementById('resultDisplay');
        const app = document.querySelector('.app-window');

        btn.disabled = true;
        btn.innerText = "🔍 SYSTEM SCANNING...";
        frame.classList.add('scanning');
        res.style.display = 'none';

        await new Promise(r => setTimeout(r, 2500));

        frame.classList.remove('scanning');
        btn.disabled = false;
        btn.innerText = "⚡ EXECUTE AI SCAN";
        
        // Shake application for alert effect
        app.classList.add('shake');
        setTimeout(() => app.classList.remove('shake'), 500);

        const isCall = Math.random() > 0.5;
        const acc = (98 + Math.random() * 1.9).toFixed(1);

        res.style.display = 'block';
        const sigText = document.getElementById('signalMain');
        
        if(isCall) {
            sigText.innerText = "CALL";
            sigText.style.color = "#00ff99";
            res.style.borderColor = "#00ff99";
            playBeep(true);
        } else {
            sigText.innerText = "PUT";
            sigText.style.color = "#ff4757";
            res.style.borderColor = "#ff4757";
            playBeep(false);
        }

        document.getElementById('accuracyNum').innerText = `ACCURACY ${acc}%`;

        // Countdown Timer
        let time = 5;
        const timer = document.getElementById('timerDisplay');
        const interval = setInterval(() => {
            timer.innerText = `CONFIRM ENTRY IN: ${time}s`;
            time--;
            if(time < 0) {
                clearInterval(interval);
                timer.innerText = "✅ TRADE NOW (1 MIN)";
                timer.style.color = "#00ff99";
            }
        }, 1000);
    }
</script>

</body>
</html>
