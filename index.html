<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ABU BAKAR TRADER - CYBER AI BOT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Rajdhani', sans-serif;
}

body{
background:#000;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:#fff;
position:relative;
}

/* Cyberpunk grid background */
body::before{
content:'';
position:absolute;
inset:0;
background-image: 
  linear-gradient(rgba(255,0,255,0.1) 1px, transparent 1px),
  linear-gradient(90deg, rgba(0,255,255,0.1) 1px, transparent 1px);
background-size:40px 40px;
animation:grid-move 20s linear infinite;
}
@keyframes grid-move{
0%{transform:translate(0,0);}
100%{transform:translate(40px,40px);}
}

.cyber-board{
width:380px;
height:680px;
background:linear-gradient(135deg, 
  rgba(255,0,255,0.05) 0%, 
  rgba(0,0,0,0.9) 50%, 
  rgba(0,255,255,0.05) 100%);
border:2px solid transparent;
border-radius:30px;
padding:25px;
position:relative;
overflow:hidden;
box-shadow:
 0 0 50px rgba(255,0,255,0.4),
 0 0 80px rgba(0,255,255,0.3);
clip-path: polygon(0 10%, 10% 0, 90% 0, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0 90%);
}

/* Neon border animation */
.cyber-board::before{
content:'';
position:absolute;
inset:-2px;
background:linear-gradient(45deg, #ff00ff, #00ffff, #ff00ff, #00ffff);
border-radius:30px;
z-index:-1;
animation:border-flow 4s linear infinite;
clip-path: polygon(0 10%, 10% 0, 90% 0, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0 90%);
}
@keyframes border-flow{
0%,100%{filter:hue-rotate(0deg);}
50%{filter:hue-rotate(180deg);}
}

.glitch-text{
font-family:'Orbitron',sans-serif;
font-size:18px;
font-weight:900;
color:#00ffff;
text-shadow: 
 2px 0 #ff00ff,
  -2px 0 #00ffff;
animation:glitch 2s infinite;
letter-spacing:3px;
}
@keyframes glitch{
0%,100%{text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff;}
25%{text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff;}
50%{text-shadow: 2px 0 #00ffff, -2px 0 #ff00ff;}
75%{text-shadow: -2px 0 #00ffff, 2px 0 #ff00ff;}
}

.scan-line{
position:absolute;
top:0;
left:0;
width:100%;
height:2px;
background:linear-gradient(90deg, transparent, #00ffff, transparent);
box-shadow:0 0 20px #00ffff;
animation:scan 3s linear infinite;
}
@keyframes scan{
0%{top:0;}
100%{top:100%;}
}

.hologram-box{
background:rgba(0,255,255,0.05);
border:1px solid rgba(0,255,255,0.3);
border-radius:15px;
padding:20px;
margin:15px 0;
position:relative;
overflow:hidden;
}
.hologram-box::before{
content:'';
position:absolute;
top:-50%;
left:-50%;
width:200%;
height:200%;
background:linear-gradient(45deg, transparent, rgba(0,255,255,0.1), transparent);
animation:holo-sweep 4s linear infinite;
}
@keyframes holo-sweep{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

.cyber-btn{
width:100%;
padding:18px;
background:linear-gradient(90deg, #ff00ff, #00ffff);
border:none;
border-radius:0;
clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
color:#000;
font-family:'Orbitron',sans-serif;
font-size:15px;
font-weight:900;
letter-spacing:2px;
cursor:pointer;
position:relative;
overflow:hidden;
transition:all 0.3s;
}
.cyber-btn:hover{
transform:scale(1.05);
filter:brightness(1.3);
box-shadow:0 0 40px #00ffff;
}

.neon-number{
font-family:'Orbitron',sans-serif;
font-size:42px;
color:#ff00ff;
text-shadow:
 0 0 10px #ff00ff,
 0 0 20px #ff00ff,
 0 0 40px #ff00ff,
 0 0 80px #ff00ff;
animation:flicker 3s infinite;
}
@keyframes flicker{
0%,100%{opacity:1;}
50%{opacity:0.8;}
}

.data-stream{
height:80px;
background:repeating-linear-gradient(
 0deg,
  transparent,
  transparent 2px,
  rgba(0,255,255,0.1) 2px,
  rgba(0,255,255,0.1) 4px
);
position:relative;
overflow:hidden;
margin:15px 0;
}
.data-stream::after{
content:'010110101010101010110101010';
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
color:rgba(0,255,255,0.3);
font-family:monospace;
font-size:10px;
line-height:10px;
animation:data-scroll 5s linear infinite;
}
@keyframes data-scroll{
0%{transform:translateY(-100%);}
100%{transform:translateY(100%);}
}

.lock-screen{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}
.lock-box{
width:90%;
max-width:320px;
background:rgba(255,0,255,0.05);
border:2px solid #ff00ff;
clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
padding:35px;
text-align:center;
box-shadow:0 0 40px rgba(255,0,255,0.5);
}
.lock-input{
width:100%;
padding:15px;
border:1px solid #00ffff;
background:rgba(0,0,0,0.8);
color:#00ffff;
text-align:center;
margin:15px 0;
outline:none;
font-family:monospace;
}
.lock-btn{
width:100%;
padding:15px;
border:none;
background:linear-gradient(90deg,#ff00ff,#00ffff);
color:#000;
font-weight:900;
cursor:pointer;
font-family:'Orbitron',sans-serif;
clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
}
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <h2 class="glitch-text">CYBER ACCESS</h2>
    <input type="password" id="passInput" class="lock-input" placeholder="ENTER KEY">
    <button class="lock-btn" onclick="unlock()">INITIALIZE</button>
  </div>
</div>

<div class="cyber-board" id="botApp" style="display:none;">
  <div class="scan-line"></div>
  
  <div style="text-align:center;margin-bottom:20px;">
    <h1 class="glitch-text">ABU BAKAR TRADER</h1>
    <p style="color:#ff00ff;font-size:12px;letter-spacing:4px;">CYBER SYSTEM V3.0</p>
  </div>

  <div class="hologram-box">
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#00ffff;margin-bottom:10px;">
      <span>LIVE</span>
      <span id="pair">USD/BRL OTC</span>
    </div>
    <div class="neon-number" id="price">1.2476</div>
  </div>

  <div class="data-stream"></div>

  <div class="hologram-box" style="text-align:center;">
    <h4 style="font-size:12px;color:#8892b0;margin-bottom:8px;">SIGNAL STATUS</h4>
    <h1 id="signal" style="font-family:Orbitron;font-size:40px;color:#00ffff;text-shadow:0 0 30px #00ffff;">BUY</h1>
    <p id="confidence" style="font-size:14px;color:#ff00ff;">97% MATCH</p>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0;">
    <div class="hologram-box" style="text-align:center;padding:12px;">
      <div style="font-size:11px;color:#8892b0;">RSI</div>
      <div style="font-size:20px;color:#00ffff;" id="rsi">74</div>
    </div>
    <div class="hologram-box" style="text-align:center;padding:12px;">
      <div style="font-size:11px;color:#8892b0;">TIMER</div>
      <div style="font-size:20px;color:#ff00ff;" id="timer">03</div>
    </div>
  </div>

  <button class="cyber-btn" onclick="getSignal()">⚡ EXECUTE SCAN</button>

</div>

<script>
let scanning=false;

function unlock(){
  if(document.getElementById('passInput').value==='bakar786'){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('botApp').style.display='block';
    updatePrice();
  }else{
    alert('ACCESS DENIED');
  }
}

function updatePrice(){
  setInterval(()=>{
    let base=1.2476;
    let change=(Math.random()-0.5)*0.002;
    document.getElementById('price').innerText=(base+change).toFixed(4);
    document.getElementById('rsi').innerText = Math.floor(Math.random()*15)+70;
  },2000);
}

function getSignal(){
  if(scanning)return;
  scanning=true;
  
  let sec=3;
  document.getElementById('timer').innerText='0'+sec;
  
  let timer=setInterval(()=>{
    sec--;
    document.getElementById('timer').innerText='0'+sec;
    if(sec<=0){
      clearInterval(timer);
      scanning=false;
      
      let signal=Math.random()>0.5?'BUY':'SELL';
      let conf=Math.floor(Math.random()*4)+96;
      
      document.getElementById('signal').innerText=signal;
      document.getElementById('signal').style.color=signal==='BUY'?'#00ffff':'#ff00ff';
      document.getElementById('signal').style.textShadow=signal==='BUY'?'0 0 30px #00ffff':'0 0 30px #ff00ff';
      document.getElementById('confidence').innerText=conf+'% MATCH';
    }
  },1000);
}
</script>
</body>
</html>
