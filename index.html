<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Bot Pro - Trading Signals</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --bg-hover: #243447;
            --text-primary: #f0f2f5;
            --text-secondary: #8b9bb4;
            --text-muted: #4a5568;
            --accent: #00d4aa;
            --accent-glow: rgba(0, 212, 170, 0.2);
            --buy: #00d4aa;
            --buy-glow: rgba(0, 212, 170, 0.3);
            --sell: #ef4444;
            --sell-glow: rgba(239, 68, 68, 0.3);
            --hold: #f59e0b;
            --hold-glow: rgba(245, 158, 11, 0.3);
            --border: #1e293b;
            --border-light: #2d3748;
            --chart-up: #00d4aa;
            --chart-down: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), #00b4d8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 20px;
            color: white;
        }

        .brand {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .brand-tag {
            font-size: 11px;
            color: var(--accent);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid var(--accent);
            border-radius: 20px;
            font-size: 12px;
            color: var(--accent);
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse-dot 2s ease infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .header-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .header-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--accent);
        }

        /* Main Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 16px;
            padding: 16px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Left Panel - Pairs */
        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .panel-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-count {
            background: var(--bg-card);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .panel-body {
            padding: 8px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        .pair-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            border-left: 3px solid transparent;
        }

        .pair-item:hover {
            background: var(--bg-hover);
        }

        .pair-item.active {
            background: var(--bg-hover);
            border-left-color: var(--accent);
        }

        .pair-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .pair-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .pair-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .pair-price {
            text-align: right;
        }

        .price-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .price-change {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
        }

        .price-change.up { color: var(--buy); }
        .price-change.down { color: var(--sell); }

        /* Center Panel - Signals */
        .center-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .signal-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .signal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }

        .signal-card.buy::before { background: linear-gradient(90deg, var(--buy), transparent); }
        .signal-card.sell::before { background: linear-gradient(90deg, var(--sell), transparent); }
        .signal-card.hold::before { background: linear-gradient(90deg, var(--hold), transparent); }

        .signal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .signal-pair {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pair-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
        }

        .pair-icon.btc { background: linear-gradient(135deg, #f7931a, #ffad33); }
        .pair-icon.eth { background: linear-gradient(135deg, #627eea, #8a9ef0); }
        .pair-icon.sol { background: linear-gradient(135deg, #9945ff, #b873ff); }
        .pair-icon.xrp { background: linear-gradient(135deg, #23292f, #3a4550); }
        .pair-icon.bnb { background: linear-gradient(135deg, #f3ba2f, #ffd700); }
        .pair-icon.ada { background: linear-gradient(135deg, #0033ad, #0055ff); }

        .pair-details h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .pair-details span {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .signal-badge {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .signal-badge.buy {
            background: rgba(0, 212, 170, 0.15);
            color: var(--buy);
            border: 1px solid var(--buy);
            box-shadow: 0 0 20px var(--buy-glow);
        }

        .signal-badge.sell {
            background: rgba(239, 68, 68, 0.15);
            color: var(--sell);
            border: 1px solid var(--sell);
            box-shadow: 0 0 20px var(--sell-glow);
        }

        .signal-badge.hold {
            background: rgba(245, 158, 11, 0.15);
            color: var(--hold);
            border: 1px solid var(--hold);
            box-shadow: 0 0 20px var(--hold-glow);
        }

        .signal-body {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 16px;
        }

        .signal-metric {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            text-align: center;
        }

        .metric-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .metric-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .metric-value.buy { color: var(--buy); }
        .metric-value.sell { color: var(--sell); }

        .signal-chart {
            height: 200px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .chart-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        .signal-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .signal-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .signal-actions {
            display: flex;
            gap: 8px;
        }

        .signal-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            border: none;
        }

        .signal-btn.primary {
            background: var(--accent);
            color: white;
        }

        .signal-btn.primary:hover {
            background: #00b894;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .signal-btn.secondary {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
        }

        .signal-btn.secondary:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        /* Right Panel - Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 8px;
        }

        .stat-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-value.positive { color: var(--buy); }
        .stat-value.negative { color: var(--sell); }

        .history-list {
            padding: 8px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .history-item:hover {
            border-color: var(--border-light);
        }

        .history-pair {
            font-size: 13px;
            font-weight: 600;
        }

        .history-signal {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .history-signal.buy {
            background: rgba(0, 212, 170, 0.15);
            color: var(--buy);
        }

        .history-signal.sell {
            background: rgba(239, 68, 68, 0.15);
            color: var(--sell);
        }

        .history-result {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
        }

        .history-result.win { color: var(--buy); }
        .history-result.loss { color: var(--sell); }

        /* Live Ticker */
        .ticker-bar {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 8px 24px;
            display: flex;
            gap: 32px;
            overflow-x: auto;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
        }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .ticker-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .ticker-price {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .ticker-change {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .ticker-change.up {
            background: rgba(0, 212, 170, 0.15);
            color: var(--buy);
        }

        .ticker-change.down {
            background: rgba(239, 68, 68, 0.15);
            color: var(--sell);
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .signal-card {
            animation: slideIn 0.4s ease;
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .new-signal {
            animation: flash 1s ease 3;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* Responsive */
        @media (max-width: 1200px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            .left-panel, .right-panel {
                display: none;
            }
        }
    </style>
</head>

    <script>
        // ==================== TRADING DATA ====================
        const TRADING_PAIRS = [
            { symbol: 'BTC/USDT', name: 'Bitcoin', icon: '₿', class: 'btc', basePrice: 43250.00 },
            { symbol: 'ETH/USDT', name: 'Ethereum', icon: 'Ξ', class: 'eth', basePrice: 2650.00 },
            { symbol: 'SOL/USDT', name: 'Solana', icon: '◎', class: 'sol', basePrice: 98.50 },
            { symbol: 'XRP/USDT', name: 'Ripple', icon: '✕', class: 'xrp', basePrice: 0.62 },
            { symbol: 'BNB/USDT', name: 'Binance', icon: 'B', class: 'bnb', basePrice: 315.00 },
            { symbol: 'ADA/USDT', name: 'Cardano', icon: '₳', class: 'ada', basePrice: 0.58 }
        ];

        let currentPrices = {};
        let signals = [];
        let signalHistory = [];
        let soundEnabled = true;
        let totalSignals = 0;
        let winCount = 0;
        let totalProfit = 0;

        // ==================== AUDIO ====================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSignalSound(type) {
            if (!soundEnabled) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'buy') {
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1);
            } else if (type === 'sell') {
                oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime);
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime + 0.1);
            } else {
                oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime);
            }
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.3);
        }

        // ==================== PRICE SIMULATION ====================
        function updatePrices() {
            TRADING_PAIRS.forEach(pair => {
                const volatility = pair.basePrice * 0.002;
                const change = (Math.random() - 0.5) * volatility;
                currentPrices[pair.symbol] = {
                    price: pair.basePrice + change,
                    change24h: (Math.random() - 0.4) * 5,
                    change: change
                };
            });
            renderPairs();
            renderTicker();
        }

        // ==================== TECHNICAL ANALYSIS ====================
        function calculateRSI(prices) {
            let gains = 0, losses = 0;
            for (let i = 1; i < prices.length; i++) {
                const diff = prices[i] - prices[i-1];
                if (diff > 0) gains += diff;
                else losses -= diff;
            }
            const avgGain = gains / prices.length;
            const avgLoss = losses / prices.length;
            if (avgLoss === 0) return 100;
            const rs = avgGain / avgLoss;
            return 100 - (100 / (1 + rs));
        }

        function calculateMACD(prices) {
            const ema12 = prices.slice(-12).reduce((a, b) => a + b) / 12;
            const ema26 = prices.slice(-26).reduce((a, b) => a + b) / 26;
            return ema12 - ema26;
        }

        function generateSignal(pair) {
            const priceHistory = Array.from({length: 30}, () => 
                pair.basePrice + (Math.random() - 0.5) * pair.basePrice * 0.05
            );
            
            const rsi = calculateRSI(priceHistory);
            const macd = calculateMACD(priceHistory);
            const currentPrice = currentPrices[pair.symbol]?.price || pair.basePrice;
            const ma20 = priceHistory.slice(-20).reduce((a, b) => a + b) / 20;
            const ma50 = priceHistory.slice(-50).reduce((a, b) => a + b, 0) / Math.min(priceHistory.length, 50);
            
            let signal, strength, confidence, targetPrice, stopLoss;
            
            if (rsi < 30 && macd > 0 && currentPrice > ma20) {
                signal = 'buy';
                strength = rsi < 20 ? 'Strong Buy' : 'Buy';
                confidence = Math.floor(70 + Math.random() * 25);
                targetPrice = currentPrice * 1.05;
                stopLoss = currentPrice * 0.97;
            } else if (rsi > 70 && macd < 0 && currentPrice < ma20) {
                signal = 'sell';
                strength = rsi > 80 ? 'Strong Sell' : 'Sell';
                confidence = Math.floor(70 + Math.random() * 25);
                targetPrice = currentPrice * 0.95;
                stopLoss = currentPrice * 1.03;
            } else {
                signal = 'hold';
                strength = 'Hold';
                confidence = Math.floor(50 + Math.random() * 30);
                targetPrice = currentPrice * 1.02;
                stopLoss = currentPrice * 0.98;
            }
            
            return {
                pair: pair,
                signal: signal,
                strength: strength,
                confidence: confidence,
                entryPrice: currentPrice,
                targetPrice: targetPrice,
                stopLoss: stopLoss,
                rsi: rsi.toFixed(1),
                macd: macd.toFixed(4),
                ma20: ma20.toFixed(2),
                timestamp: new Date()
            };
        }

        // ==================== RENDER FUNCTIONS ====================
        function renderPairs() {
            const container = document.getElementById('pairsList');
            container.innerHTML = TRADING_PAIRS.map(pair => {
                const data = currentPrices[pair.symbol];
                if (!data) return '';
                const isUp = data.change24h >= 0;
                return `
                    <div class="pair-item" onclick="focusPair('${pair.symbol}')">
                        <div class="pair-info">
                            <span class="pair-name">${pair.symbol}</span>
                            <span class="pair-time">${pair.name}</span>
                        </div>
                        <div class="pair-price">
                            <div class="price-value">$${data.price.toFixed(pair.basePrice < 1 ? 4 : 2)}</div>
                            <div class="price-change ${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${data.change24h.toFixed(2)}%</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderSignals() {
            const container = document.getElementById('signalsContainer');
            container.innerHTML = signals.map((sig, index) => `
                <div class="signal-card ${sig.signal}">
                    <div class="signal-header">
                        <div class="signal-pair">
                            <div class="pair-icon ${sig.pair.class}">${sig.pair.icon}</div>
                            <div class="pair-details">
                                <h3>${sig.pair.symbol}</h3>
                                <span>${sig.pair.name}</span>
                            </div>
                        </div>
                        <div class="signal-badge ${sig.signal}">${sig.strength}</div>
                    </div>
                    <div class="signal-body">
                        <div class="signal-metric">
                            <div class="metric-label">Confidence</div>
                            <div class="metric-value ${sig.signal}">${sig.confidence}%</div>
                        </div>
                        <div class="signal-metric">
                            <div class="metric-label">Entry Price</div>
                            <div class="metric-value">$${sig.entryPrice.toFixed(sig.entryPrice < 1 ? 4 : 2)}</div>
                        </div>
                        <div class="signal-metric">
                            <div class="metric-label">Target</div>
                            <div class="metric-value ${sig.signal === 'buy' ? 'buy' : sig.signal === 'sell' ? 'sell' : ''}">
                                $${sig.targetPrice.toFixed(sig.targetPrice < 1 ? 4 : 2)}
                            </div>
                        </div>
                        <div class="signal-metric">
                            <div class="metric-label">Stop Loss</div>
                            <div class="metric-value ${sig.signal === 'buy' ? 'sell' : sig.signal === 'sell' ? 'buy' : ''}">
                                $${sig.stopLoss.toFixed(sig.stopLoss < 1 ? 4 : 2)}
                            </div>
                        </div>
                        <div class="signal-metric">
                            <div class="metric-label">RSI</div>
                            <div class="metric-value">${sig.rsi}</div>
                        </div>
                        <div class="signal-metric">
                            <div class="metric-label">MACD</div>
                            <div class="metric-value">${sig.macd}</div>
                        </div>
                    </div>
                    <div class="signal-chart">
                        <canvas id="chart-${index}" width="600" height="200"></canvas>
                    </div>
                    <div class="signal-footer">
                        <span class="signal-time">⏱️ ${sig.timestamp.toLocaleTimeString()}</span>
                        <div class="signal-actions">
                            <button class="signal-btn secondary" onclick="copySignal(${index})">📋 Copy</button>
                            <button class="signal-btn primary" onclick="executeSignal(${index})">⚡ Execute</button>
                        </div>
                    </div>
                </div>
            `).join('');
            
            // Draw charts
            signals.forEach((sig, index) => {
                drawChart(sig, index);
            });
        }

        function drawChart(signal, index) {
            const canvas = document.getElementById(`chart-${index}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            // Generate price data
            const dataPoints = 50;
            const prices = [];
            let price = signal.entryPrice * 0.95;
            for (let i = 0; i < dataPoints; i++) {
                price += (Math.random() - 0.4) * signal.entryPrice * 0.01;
                prices.push(price);
            }
            
            const min = Math.min(...prices);
            const max = Math.max(...prices);
            const range = max - min;
            
            ctx.clearRect(0, 0, width, height);
            
            // Draw grid
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 5; i++) {
                const y = (height / 5) * i;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            
            // Draw line
            const isUp = prices[prices.length - 1] >= prices[0];
            ctx.strokeStyle = isUp ? '#00d4aa' : '#ef4444';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            prices.forEach((p, i) => {
                const x = (i / (dataPoints - 1)) * width;
                const y = height - ((p - min) / range) * (height - 40) - 20;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
            
            // Draw fill
            ctx.fillStyle = isUp ? 'rgba(0, 212, 170, 0.1)' : 'rgba(239, 68, 68, 0.1)';
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.closePath();
            ctx.fill();
            
            // Draw entry point
            const entryX = width * 0.8;
            const entryY = height - ((signal.entryPrice - min) / range) * (height - 40) - 20;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(entryX, entryY, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            container.innerHTML = signalHistory.slice(-10).reverse().map(h => {
                const profit = h.result === 'win' ? ((h.exitPrice - h.entryPrice) / h.entryPrice * 100).toFixed(2) : 
                              ((h.entryPrice - h.exitPrice) / h.entryPrice * 100).toFixed(2);
                return `
                    <div class="history-item">
                        <span class="history-pair">${h.pair}</span>
                        <span class="history-signal ${h.signal}">${h.signal.toUpperCase()}</span>
                        <span class="history-result ${h.result}">${h.result === 'win' ? '+' : '-'}${profit}%</span>
                    </div>
                `;
            }).join('');
            document.getElementById('historyCount').textContent = signalHistory.length;
        }

        function renderTicker() {
            const container = document.getElementById('tickerBar');
            container.innerHTML = TRADING_PAIRS.map(pair => {
                const data = currentPrices[pair.symbol];
                if (!data) return '';
                const isUp = data.change24h >= 0;
                return `
                    <div class="ticker-item">
                        <span class="ticker-name">${pair.symbol}</span>
                        <span class="ticker-price">$${data.price.toFixed(pair.basePrice < 1 ? 4 : 2)}</span>
                        <span class="ticker-change ${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${data.change24h.toFixed(2)}%</span>
                    </div>
                `;
            }).join('');
        }

        // ==================== ACTIONS ====================
        function generateNewSignals() {
            signals = TRADING_PAIRS.map(pair => generateSignal(pair));
            signals.sort((a, b) => b.confidence - a.confidence);
            renderSignals();
            
            signals.forEach(sig => {
                if (sig.signal !== 'hold') {
                    playSignalSound(sig.signal);
                    totalSignals++;
                }
            });
            
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalSignals').textContent = totalSignals;
            document.getElementById('activeSignals').textContent = signals.filter(s => s.signal !== 'hold').length;
            
            const winRate = totalSignals > 0 ? Math.round((winCount / totalSignals) * 100) : 0;
            document.getElementById('winRate').textContent = winRate + '%';
            
            document.getElementById('totalProfit').textContent = (totalProfit >= 0 ? '+' : '') + '$' + totalProfit.toFixed(2);
        }

        function copySignal(index) {
            const sig = signals[index];
            const text = `SIGNAL: ${sig.pair.symbol}\\nType: ${sig.strength}\\nEntry: $${sig.entryPrice.toFixed(2)}\\nTarget: $${sig.targetPrice.toFixed(2)}\\nStop: $${sig.stopLoss.toFixed(2)}\\nConfidence: ${sig.confidence}%`;
            navigator.clipboard.writeText(text).then(() => {
                alert('Signal copied to clipboard!');
            });
        }

        function executeSignal(index) {
            const sig = signals[index];
            const isWin = Math.random() > 0.3; // 70% win rate simulation
            const profit = isWin ? 
                (sig.targetPrice - sig.entryPrice) * (Math.random() * 0.5 + 0.5) :
                -(sig.entryPrice - sig.stopLoss) * (Math.random() * 0.5 + 0.5);
            
            signalHistory.push({
                pair: sig.pair.symbol,
                signal: sig.signal,
                entryPrice: sig.entryPrice,
                exitPrice: isWin ? sig.targetPrice : sig.stopLoss,
                result: isWin ? 'win' : 'loss',
                profit: profit,
                timestamp: new Date()
            });
            
            if (isWin) winCount++;
            totalProfit += profit;
            
            renderHistory();
            updateStats();
            
            alert(`Signal executed!\\nResult: ${isWin ? 'WIN' : 'LOSS'}\\nP&L: ${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}`);
        }

        function focusPair(symbol) {
            const sig = signals.find(s => s.pair.symbol === symbol);
            if (sig) {
                const card = document.querySelector(`.signal-card.${sig.signal}`);
                if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function refreshSignals() {
            generateNewSignals();
            showNotification('Signals refreshed!', 'success');
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            showNotification(soundEnabled ? 'Sound ON' : 'Sound OFF', 'info');
        }

        function showSettings() {
            alert('Settings:\\n- Auto-refresh: ON\\n- Sound alerts: ' + (soundEnabled ? 'ON' : 'OFF') + '\\n- Risk level: Medium\\n- Timeframe: 15m');
        }

        function showNotification(message, type) {
            const notif = document.createElement('div');
            notif.style.cssText = `
                position: fixed; top: 80px; right: 24px; padding: 12px 20px;
                background: ${type === 'success' ? '#00d4aa' : '#0084ff'}; color: white;
                border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 1000;
                animation: slideIn 0.3s ease;
            `;
            notif.textContent = message;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }

        // ==================== INIT ====================
        function init() {
            updatePrices();
            generateNewSignals();
            
            // Auto-refresh prices every 5 seconds
            setInterval(updatePrices, 5000);
            
            // Auto-generate new signals every 30 seconds
            setInterval(generateNewSignals, 30000);
            
            // Simulate history
            for (let i = 0; i < 5; i++) {
                const pair = TRADING_PAIRS[Math.floor(Math.random() * TRADING_PAIRS.length)];
                const isWin = Math.random() > 0.3;
                const signal = Math.random() > 0.5 ? 'buy' : 'sell';
                const entry = pair.basePrice * (1 + (Math.random() - 0.5) * 0.02);
                const exit = isWin ? entry * 1.03 : entry * 0.97;
                
                signalHistory.push({
                    pair: pair.symbol,
                    signal: signal,
                    entryPrice: entry,
                    exitPrice: exit,
                    result: isWin ? 'win' : 'loss',
                    profit: isWin ? (exit - entry) : -(entry - exit),
                    timestamp: new Date(Date.now() - i * 60000)
                });
                
                if (isWin) winCount++;
                totalProfit += signalHistory[signalHistory.length - 1].profit;
            }
            
            renderHistory();
            updateStats();
        }

        // Start
        init();
    </script>
</body>
</html>
