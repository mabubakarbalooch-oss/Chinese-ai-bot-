<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chinese Signal Generator Pro</title>
<style>
    :root { --neon: #00ff88; --danger: #ff4444; --bg: #0b0e14; --card: #151921; }
    body { background: var(--bg); font-family: sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
    .container { width: 90%; max-width: 400px; background: var(--card); border: 1px solid #2a2e39; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { color: var(--neon); font-size: 18px; text-align: center; text-transform: uppercase; margin-bottom: 20px; }
    .label { color: #5f6673; font-size: 11px; margin-bottom: 5px; display: block; }
    select, input { width: 100%; padding: 12px; background: #0b0e14; border: 1px solid #30363d; border-radius: 10px; color: #fff; margin-bottom: 15px; box-sizing: border-box; }
    .gen-btn { width: 100%; padding: 16px; background: var(--neon); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: #000; }
    #priceDisplay { color: #fff; font-size: 14px; text-align: center; margin-bottom: 15px; background: #1a1f26; padding: 8px; border-radius: 8px; }
    #signalBox { padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; display: none; margin-top: 15px; font-size: 18px; }
    .buy-style { border: 1px solid var(--neon); color: var(--neon); background: rgba(0,255,136,0.1); }
    .sell-style { border: 1px solid var(--danger); color: var(--danger); background: rgba(255,68,68,0.1); }
</style>
</head>
<body>

<div id="loginScreen" class="container">
    <h1>🔒 Secure Access</h1>
    <input type="password" id="pass" placeholder="Enter Password">
    <button class="gen-btn" onclick="login()">Unlock</button>
</div>

<div id="mainBoard" class="container" style="display:none;">
    <h1>Signal Pro</h1>
    <label class="label">Broker</label>
    <select><option>Quotex</option><option>Pocket Option</option></select>
    
    <label class="label">Asset</label>
    <select id="asset" onchange="updatePrice()">
        <option value="BTCUSDT">USD/BRL (OTC)</option>
        <option value="BTCUSDT">USD/PKR (OTC)</option>
        <option value="BTCUSDT">USD/MXN (OTC)</option>
        <option value="BTCUSDT">USD/INR (OTC)</option>
        <option value="BTCUSDT">BTC/USDT</option>
    </select>
    
    <div id="priceDisplay">Live Price: Loading...</div>
    <button class="gen-btn" onclick="generateSignal()">⚡ GENERATE SIGNAL ⚡</button>
    <div id="signalBox">---</div>
</div>

<script>
    function login() { if(document.getElementById('pass').value === "bakar786") { document.getElementById('loginScreen').style.display = 'none'; document.getElementById('mainBoard').style.display = 'block'; } else { alert("Wrong Password!"); } }
    
    async function updatePrice() {
        try {
            let res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT`);
            let data = await res.json();
            document.getElementById('priceDisplay').innerText = "Live Price: " + parseFloat(data.price).toFixed(2);
        } catch(e) { document.getElementById('priceDisplay').innerText = "Price: Error"; }
    }

    async function generateSignal() {
        let box = document.getElementById('signalBox');
        box.style.display = 'block';
        let isBuy = Math.random() > 0.5;
        box.innerText = isBuy ? "BUY SIGNAL" : "SELL SIGNAL";
        box.className = isBuy ? "buy-style" : "sell-style";
    }

    setInterval(updatePrice, 3000);
    updatePrice();
</script>
</body>
</html>
