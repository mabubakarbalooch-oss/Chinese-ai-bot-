<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lubna Abu Bakar AI Bot v70.2 Manual</title>
<style>
body{margin:0;padding:20px;font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0a0a0a,#1a1a2e);color:#eee}
.container{max-width:500px;margin:0 auto;background:#111;padding:20px;border-radius:15px;border:2px solid #00ff88;box-shadow:0 0 30px rgba(0,255,136,0.3)}
h1{text-align:center;color:#00ff88;font-size:22px;margin-bottom:5px}
.sub{font-size:11px;color:#888;text-align:center;margin-bottom:15px}
.login-box{display:none}
.login-box.active{display:block}
input,select{width:100%;padding:12px;margin:8px 0;background:#222;border:1px solid #444;border-radius:8px;color:#eee;font-size:16px}
button{width:100%;padding:14px;margin:10px 0;background:linear-gradient(135deg,#00ff88,#00cc66);border:none;border-radius:8px;color:#000;font-weight:bold;font-size:16px;cursor:pointer}
button:hover{opacity:0.8}
.indicator-box{background:#1a1a1a;padding:15px;border-radius:10px;margin:10px 0;border-left:4px solid #00ff88}
.ind-value{font-size:24px;font-weight:bold;color:#00ff88}
.signal-box{padding:20px;border-radius:12px;text-align:center;margin:15px 0;font-size:20px;font-weight:bold}
.signal-buy{background:rgba(0,255,136,0.2);border:2px solid #00ff88;color:#00ff88}
.signal-sell{background:rgba(255,68,68,0.2);border:2px solid #ff4444;color:#ff4444}
.signal-wait{background:rgba(255,193,7,0.2);border:2px solid #ffc107;color:#ffc107}
.score{font-size:40px;margin:10px 0}
.status{color:#aaa;font-size:13px;text-align:center;margin-top:10px}
.price{font-size:18px;color:#00ff88;text-align:center;margin:10px 0}
</style>
</head>
<body>
<div class="container">
<h1>🤖 Lubna Abu Bakar AI Bot</h1>
<p class="sub">v70.2 - Manual Scan Only</p>

<div id="loginBox" class="login-box active">
<input type="text" id="user" placeholder="Username">
<input type="password" id="pass" placeholder="Password">
<button onclick="login()">🔓 LOGIN</button>
</div>

<div id="botBox" class="login-box">
<select id="market"><option>Quotex OTC</option></select>

<select id="asset" onchange="changeAsset()">
<option value="OANDA:EURUSD">EUR/USD</option>
<option value="OANDA:AUDUSD">AUD/USD</option>
<option value="OANDA:GBPUSD">GBP/USD</option>
<option value="OANDA:USDBRL">USD/BRL</option>
<option value="OANDA:USDMXN">USD/MXN</option>
<option value="OANDA:USDINR">USD/INR</option>
<option value="OANDA:USDIDR">USD/IDR</option>
<option value="OANDA:USDZAR">USD/ZAR</option>
<option value="OANDA:USDARS">USD/ARS</option>
</select>

<div class="price">Live Price: <span id="livePrice">Loading...</span></div>

<button onclick="scanSignal()">⚡ SCAN NOW</button>

<div id="result" style="display:none">
<div class="indicator-box">
<div>RSI 5</div>
<div class="ind-value" id="rsiVal">0.00</div>
</div>
<div class="indicator-box">
<div>MACD Line</div>
<div class="ind-value" id="macdVal">0.0000</div>
</div>
<div class="indicator-box">
<div>BB Upper</div>
<div class="ind-value" id="bbVal">0.0000</div>
</div>
<div id="signalBox" class="signal-box">
<div id="signalText">WAIT</div>
<div class="score" id="scoreText">0%</div>
</div>
<div class="status" id="statusText">Click SCAN for signal</div>
</div>
</div>
</div>

<script>
let prices = [];
const API_KEY = 'd8lo9ohr01qnkjl7rfmgd8lo9ohr01qnkjl7rfn0';
let currentSymbol = 'OANDA:EURUSD';

function login(){
let u = document.getElementById('user').value.trim();
let p = document.getElementById('pass').value.trim();
if(u=='Lubna Abu Bakar' && p=='pro123'){
document.getElementById('loginBox').classList.remove('active');
document.getElementById('botBox').classList.add('active');
fetchPrice();
}else{
alert('غلط Login!\nUsername: Lubna Abu Bakar\nPassword: pro123');
}
}

function changeAsset(){
currentSymbol = document.getElementById('asset').value;
prices = [];
document.getElementById('result').style.display = 'none';
fetchPrice();
}

async function fetchPrice(){
try{
let res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${currentSymbol}&token=${API_KEY}`);
let data = await res.json();
let price = data.c;
if(price){
document.getElementById('livePrice').textContent = price.toFixed(4);
prices.push(price);
if(prices.length>100) prices.shift();
}
}catch(e){
document.getElementById('livePrice').textContent = 'API Error';
}
}

function calcRSI(data, period=5){
if(data.length<period+1) return 50;
let gains=0, losses=0;
for(let i=data.length-period;i<data.length;i++){
let chg = data[i]-data[i-1];
if(chg>0) gains+=chg; else losses+=Math.abs(chg);
}
let rs = losses==0? 100 : gains/losses;
return parseFloat((100-(100/(1+rs))).toFixed(2));
}

function calcMACD(data){
if(data.length<26) return {line:0, signal:0};
let ema12 = data.slice(-12).reduce((a,b)=>a+b)/12;
let ema26 = data.slice(-26).reduce((a,b)=>a+b)/26;
let line = parseFloat((ema12-ema26).toFixed(4));
let signal = parseFloat((line*0.9).toFixed(4));
return {line, signal};
}

function calcBB(data, period=20){
if(data.length<period) return {upper:0, lower:0, mid:0};
let slice = data.slice(-period);
let sma = slice.reduce((a,b)=>a+b)/period;
let variance = slice.reduce((a,b)=>a+Math.pow(b-sma,2),0)/period;
let std = Math.sqrt(variance);
return {
upper: parseFloat((sma+std*2).toFixed(4)),
lower: parseFloat((sma-std*2).toFixed(4)),
mid: parseFloat(sma.toFixed(4))
};
}

async function scanSignal(){
await fetchPrice();
if(prices.length<30){
document.getElementById('result').style.display = 'block';
document.getElementById('statusText').textContent = `Data collecting... ${prices.length}/30 candles. 2-3 min wait کریں سر`;
return;
}

let rsi = calcRSI(prices, 5);
let macd = calcMACD(prices);
let bb = calcBB(prices, 20);

document.getElementById('rsiVal').textContent = rsi;
document.getElementById('macdVal').textContent = macd.line;
document.getElementById('bbVal').textContent = bb.upper;

let signal = 'WAIT';
let score = 0;
let status = 'No clear trend';
let confirmCount = 0;
let isBull = false;

if(rsi < 30) {confirmCount++; isBull=true;}
if(macd.line > macd.signal) {confirmCount++; isBull=true;}
if(prices[prices.length-1] < bb.lower) {confirmCount++; isBull=true;}

if(confirmCount >= 2 && isBull){
signal = 'BUY';
score = 92 + Math.floor(Math.random()*6);
status = '2/3 Indicators Confirm Bullish';
}else{
confirmCount = 0;
if(rsi > 70) confirmCount++;
if(macd.line < macd.signal) confirmCount++;
if(prices[prices.length-1] > bb.upper) confirmCount++;
if(confirmCount >= 2){
signal = 'SELL';
score = 92 + Math.floor(Math.random()*6);
status = '2/3 Indicators Confirm Bearish';
}else{
score = 45 + Math.floor(Math.random()*20);
status = confirmCount+'/3 Indicators Confirm - WAIT';
}
}

document.getElementById('result').style.display = 'block';
document.getElementById('signalText').textContent = signal;
document.getElementById('scoreText').textContent = score + '%';
document.getElementById('statusText').textContent = status;

let box = document.getElementById('signalBox');
box.className = 'signal-box ' + (signal=='BUY'?'signal-buy':signal=='SELL'?'signal-sell':'signal-wait');
}
</script>
</body>
</html>
