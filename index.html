<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI TRADING BOT - V16.3 PRO</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
    :root {
        --yellow: #ffcc00; --yellow-glow: rgba(255, 204, 0, 0.4);
        --bg: #000; --card-bg: rgba(10,10,10,0.85);
        --green: #00ff99; --red: #ff4757; --border: rgba(255, 204, 0, 0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { 
        background: radial-gradient(circle at 20% 20%, #ffcc0020, transparent 50%),
                    radial-gradient(circle at 80% 80%, #00ff9920, transparent 50%), var(--bg); 
        height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; 
    }
    .bot-container { 
        width: 100%; max-width: 380px; background: var(--card-bg); 
        border: 2px solid var(--border); border-radius: 25px; padding: 25px; 
        box-shadow: 0 0 35px var(--yellow-glow); 
    }
    .bot-header { color: var(--yellow); font-size: 18px; font-weight: 800; text-align: center; margin-bottom: 18px; }
    .field-group { display: flex; flex-direction: column; margin-bottom: 12px; }
    .field-group label { color: #888; font-size: 11px; font-weight: 700; margin-bottom: 5px; }
    select { 
        width: 100%; padding: 14px; border-radius: 15px; 
        background: #000; border: 1px solid var(--border); color: #fff; text-align: center; 
    }
    .algo-radar { 
        background: #000; border: 1px solid var(--border); padding: 12px 15px; 
        border-radius: 15px; font-size: 11px; color: #666; display: flex; justify-content: space-between; 
    }
    .radar-pulse { width: 8px; height: 8px; background: #444; border-radius: 50%; }
    .live-connected .radar-pulse { background: var(--yellow); box-shadow: 0 0 12px var(--yellow); }
    .get-signal-btn {
        width: 100%; padding: 16px; border-radius: 15px; border: none;
        background: linear-gradient(135deg, #e0b300, var(--yellow));
        color: #000; font-weight: 800; cursor: pointer; margin-top: 10px;
    }
    .signal-display-box { 
        display: none; background: rgba(0,0,0,0.6); border: 1px solid var(--border); 
        border-radius: 20px; padding: 15px; margin-top: 10px; text-align: center;
    }
    .sig-alert-text { font-size: 28px; font-weight: 900; }
    .up-style { color: var(--green); } .down-style { color: var(--red); } 
    .wait-style { color: #ffa500; }
    .filter-info { font-size: 10px; color: #ffa500; margin-top: 8px; }
</style>
</head>
<body>

<div class="bot-container">
    <div class="bot-header">Sureshot AI Bot Live V16.3</div>

    <div class="field-group">
        <label>Candle Timeframe</label>
        <select id="candleTimeOpt" onchange="resetHistory()">
            <option value="15">15 SECONDS</option>
            <option value="30">30 SECONDS</option>
            <option value="60" selected>1 MINUTE</option>
            <option value="300">5 MINUTES</option>
        </select>
    </div>

    <div class="field-group">
        <label>Sensitivity</label>
        <select id="sensitivityOpt">
            <option value="80">High - Safe Signals</option>
            <option value="65" selected>Medium - Balanced</option>
            <option value="50">Low - More Signals</option>
        </select>
    </div>

    <div class="field-group">
        <label>Select Asset</label>
        <select id="assetOpt" onchange="initLiveStream()">
            <option value="usdbrl">USD/BRL OTC</option>
            <option value="usdmxn">USD/MXN OTC</option>
            <option value="eurusd">EUR/USD OTC</option>
            <option value="btcusdt">BTC/USDT LIVE</option>
        </select>
    </div>

    <div class="algo-radar" id="algoRadar">
        <span id="indicatorsText">Connecting Live Pulse...</span>
        <div class="radar-pulse"></div>
    </div>

    <button class="get-signal-btn" id="sigBtn" onclick="processLiveIndicators()">Get Live Signal</button>

    <div class="signal-display-box" id="signalBox">
        <div class="sig-alert-text" id="signalResult">---</div>
        <div class="filter-info" id="filterInfo"></div>
    </div>
</div>

<script>
    let ws = null;
    let currentLivePrice = 0;
    let priceHistory = [];
    let fallbackInterval = null;

    window.onload = initLiveStream;

    function resetHistory() {
        priceHistory = [];
        document.getElementById('signalBox').style.display = "none";
        document.getElementById('indicatorsText').innerText = "History Reset - Loading Data...";
    }

    function initLiveStream() {
        if(ws) { ws.close(); ws = null; }
        if(fallbackInterval) { clearInterval(fallbackInterval); fallbackInterval = null; }
        
        const asset = document.getElementById('assetOpt').value;
        const logText = document.getElementById('indicatorsText');
        const radar = document.getElementById('algoRadar');
        
        radar.className = "algo-radar";
        logText.innerText = `Connecting to ${asset.toUpperCase()}...`;
        priceHistory = [];

        if (asset.includes("usdbrl") || asset.includes("usdmxn") || asset.includes("eurusd")) {
            let simulatedBase = asset === "usdbrl" ? 5.12 : (asset === "usdmxn" ? 16.85 : 1.08);
            radar.className = "algo-radar live-connected";
            
            let updateSpeed = 800; // 0.8s for OTC
            fallbackInterval = setInterval(() => {
                let change = (Math.random() - 0.5) * 0.002;
                simulatedBase += change;
                currentLivePrice = simulatedBase;
                logText.innerText = `Live Price: ${currentLivePrice.toFixed(4)}`;
                
                priceHistory.push(currentLivePrice);
                if(priceHistory.length > 50) priceHistory.shift();
            }, updateSpeed);
        } else {
            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${asset}@ticker`);
            ws.onopen = () => {
                radar.className = "algo-radar live-connected";
                logText.innerText = "Live Connected";
            };
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                currentLivePrice = parseFloat(data.c); 
                logText.innerText = `Live Price: $${currentLivePrice.toFixed(2)}`;
                priceHistory.push(currentLivePrice);
                if(priceHistory.length > 50) priceHistory.shift();
            };
        }
    }

    function calculateRSI(prices, period=14) {
        if(prices.length < period+1) return 50;
        let gains=0, losses=0;
        for(let i=1; i<=period; i++){
            let diff = prices[i] - prices[i-1];
            if(diff>0) gains+=diff; else losses-=diff;
        }
        let avgGain=gains/period, avgLoss=losses/period;
        if(avgLoss===0) return 100;
        let rs = avgGain/avgLoss;
        return 100-(100/(1+rs));
    }

    function calculateEMA(prices, period) {
        let k=2/(period+1);
        let ema=prices[0];
        for(let i=1;i<prices.length;i++){
            ema=prices[i]*k+ema*(1-k);
        }
        return ema;
    }

    function processLiveIndicators() {
        const outBox = document.getElementById('signalBox');
        const sigRes = document.getElementById('signalResult');
        const filterInfo = document.getElementById('filterInfo');
        const sensitivity = parseInt(document.getElementById('sensitivityOpt').value);
        const candleTime = parseInt(document.getElementById('candleTimeOpt').value);

        if(priceHistory.length < 20) {
            alert("Wait 5 seconds for data loading");
            return;
        }

        // Adjust period based on candle time
        let rsiPeriod = candleTime <= 30 ? 7 : 14;
        let emaPeriod1 = candleTime <= 30 ? 6 : 12;
        let emaPeriod2 = candleTime <= 30 ? 13 : 26;

        const rsi = calculateRSI(priceHistory, rsiPeriod);
        const ema1 = calculateEMA(priceHistory, emaPeriod1);
        const ema2 = calculateEMA(priceHistory, emaPeriod2);
        
        let score=0, confirmations=0;
        
        if(rsi<40){score+=2;confirmations++;}
        if(rsi>60){score-=2;confirmations++;}
        if(currentLivePrice>ema1 && ema1>ema2){score+=2;confirmations++;}
        if(currentLivePrice<ema1 && ema1<ema2){score-=2;confirmations++;}
        
        let confidence=60+Math.abs(score)*5;
        let signal, color, filterMsg;
        
        if(confidence < sensitivity){
            signal="WAIT";
            color="wait-style";
            filterMsg=`⚠️ Confidence ${confidence.toFixed(0)}% < ${sensitivity}%.`;
        }
        else{
            if(score>0){
                signal="🟢 BUY / UP";
                color="up-style";
                filterMsg=`✅ BUY - Confidence ${confidence.toFixed(0)}% | Candle: ${candleTime}s`;
            }
            else{
                signal="🔴 SELL / DOWN";
                color="down-style";
                filterMsg=`✅ SELL - Confidence ${confidence.toFixed(0)}% | Candle: ${candleTime}s`;
            }
        }

        outBox.style.display = "block";
        sigRes.innerText = signal;
        sigRes.className = "sig-alert-text "+color;
        filterInfo.innerText = filterMsg;
    }
</script>
</body>
</html>
