<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese AI Signal Bot Pro</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 15px; }
        .login-box { background: #1e1e1e; padding: 25px; border-radius: 15px; display: inline-block; border: 2px solid #ffc107; margin-top: 40px; }
        input, select { padding: 12px; border-radius: 8px; border: 1px solid #444; width: 85%; margin-bottom: 15px; background: #222; color: white; font-size: 16px; }
        button { background: #ffc107; color: black; border: none; padding: 12px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; width: 90%; }
        #botContent { display: none; }
        .header { color: #ffc107; font-size: 22px; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div id="loginSection">
        <div class="login-box">
            <h2 style="color: #ffc107;">🔒 Bot Locked</h2>
            <p>Enter Password to Access</p>
            <input type="password" id="passInput" placeholder="Password yahan likhen...">
            <br>
            <button onclick="checkPass()">Unlock Bot</button>
            <p id="error" style="color: #ff4444; display: none; margin-top: 10px;">❌ Ghalat Password!</p>
        </div>
    </div>

    <div id="botContent">
        <div class="header">CHINESE AI BOT v3.0</div>
        <p style="color: #00ff00; font-size: 12px; margin-bottom: 15px;">● SERVER ACTIVE (QUOTEX SYNC)</p>
        
        <select id="assetSelect" onchange="updateChart()">
            <option value="FX:EURUSD">EUR/USD</option>
            <option value="OANDA:USDBRL">USD/BRL</option>
            <option value="OANDA:USDMXN">USD/MXN</option>
        </select>

        <iframe id="tradingViewFrame" src="https://s.tradingview.com/widgetembed/?symbol=FX%3AEURUSD&interval=1&theme=dark" width="100%" height="400" frameborder="0"></iframe>
        
        <br><br>
        <button onclick="generateSignal()">ANALYZE MARKET CONDITIONS</button>
        <div id="signalResult" style="margin-top: 15px; font-size: 20px; font-weight: bold;"></div>
    </div>

    <script>
        function checkPass() {
            var pass = document.getElementById("passInput").value;
            // Aapka Password: Mybot786
            if(pass === "Mybot786") {
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("botContent").style.display = "block";
            } else {
                document.getElementById("error").style.display = "block";
            }
        }

        function updateChart() {
            var asset = document.getElementById("assetSelect").value;
            document.getElementById("tradingViewFrame").src = "https://s.tradingview.com/widgetembed/?symbol=" + asset + "&interval=1&theme=dark";
        }

        function generateSignal() {
            var res = document.getElementById("signalResult");
            res.innerHTML = "Analyzing...";
            res.style.color = "white";
            setTimeout(function() {
                var signals = ["↑ CALL (UP) 1 MIN", "↓ PUT (DOWN) 1 MIN"];
                var choice = signals[Math.floor(Math.random()*signals.length)];
                res.innerHTML = choice;
                res.style.color = choice.includes("UP") ? "#00ff00" : "#ff4444";
            }, 1500);
        }
    </script>
</body>
</html>
