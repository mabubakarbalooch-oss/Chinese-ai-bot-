<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">

<title>PAK AI SIGNAL BOT PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020817;
display:flex;
justify-content:center;
align-items:flex-start;
min-height:100vh;
padding:8px;
overflow-y:auto;
color:white;
}

.app{
width:100%;
max-width:400px;
background:#050b18;
border:2px solid #00cfff;
border-radius:24px;
overflow:hidden;
box-shadow:
0 0 20px #00cfff44,
0 0 50px #00cfff22;
}

/* HEADER */

.header{
padding:16px;
text-align:center;
position:relative;
border-bottom:1px solid #123;
}

.header h1{
font-size:20px;
font-weight:800;
background:linear-gradient(90deg,#00d9ff,#ffffff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.tag{
margin-top:10px;
display:inline-block;
padding:6px 16px;
border-radius:30px;
font-size:10px;
border:1px solid #00d9ff55;
color:#00d9ff;
}

.gear{
position:absolute;
right:15px;
top:15px;
font-size:22px;
color:#00d9ff;
}

/* MARKET */

.market{
padding:12px;
}

select{
width:100%;
padding:14px;
border-radius:16px;
background:#09111f;
border:1px solid #00d9ff33;
color:white;
font-size:14px;
outline:none;
}

/* CHART */

.chart-box{
margin:0 12px;
background:#07101d;
border-radius:20px;
padding:12px;
border:1px solid #123;
position:relative;
overflow:hidden;
}

.chart-top{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.price{
font-size:22px;
font-weight:700;
color:#00ff88;
}

.chart{
height:240px;
}

/* SCAN LINE */

.scan-line{
position:absolute;
top:0;
bottom:0;
width:2px;
background:#00e1ff;
box-shadow:0 0 15px #00e1ff;
display:none;
}

.scan-line.active{
display:block;
animation:scan 2s linear infinite;
}

@keyframes scan{
0%{
left:0%;
}
100%{
left:100%;
}
}

/* SCAN BOX */

.scan-box{
margin:12px;
padding:15px;
background:#07101d;
border-radius:18px;
display:none;
justify-content:space-between;
align-items:center;
border:1px solid #123;
}

.radar{
width:55px;
height:55px;
border:2px solid #00d9ff;
border-radius:50%;
position:relative;
overflow:hidden;
}

.radar::before{
content:'';
position:absolute;
width:100%;
height:2px;
background:#00d9ff;
top:50%;
transform-origin:left;
animation:radar 2s linear infinite;
}

@keyframes radar{
100%{
transform:rotate(360deg);
}
}

.timer{
width:60px;
height:60px;
border-radius:50%;
border:4px solid #00d9ff;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:700;
color:#00d9ff;
}

/* BUTTON */

.scan-btn{
margin:0 12px 12px;
width:calc(100% - 24px);
padding:15px;
border:none;
border-radius:18px;
font-size:18px;
font-weight:800;
cursor:pointer;
background:linear-gradient(90deg,#0077ff,#00d9ff);
color:black;
box-shadow:0 0 20px #00d9ff55;
}

.scan-btn.stop{
background:linear-gradient(90deg,#ff3b5c,#ff7a8f);
color:white;
}

/* RESULT */

.result{
margin:0 12px 12px;
padding:15px;
background:#07101d;
border-radius:18px;
display:none;
border:1px solid #123;
}

.signal{
font-size:52px;
font-weight:800;
}

.call{
color:#00ff66;
text-shadow:0 0 20px #00ff66;
}

.put{
color:#ff3b5c;
text-shadow:0 0 20px #ff3b5c;
}

.wait{
color:#ffaa00;
}

.conf{
font-size:28px;
font-weight:700;
color:#00d9ff;
}

.details{
margin-top:10px;
font-size:11px;
color:#aaa;
line-height:1.7;
}

/* SETTINGS */

.row{
margin:0 12px 10px;
padding:13px;
background:#07101d;
border-radius:16px;
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid #123;
}

.toggle{
width:50px;
height:26px;
border-radius:30px;
background:#333;
position:relative;
cursor:pointer;
}

.toggle::after{
content:'';
width:20px;
height:20px;
border-radius:50%;
background:white;
position:absolute;
top:3px;
left:3px;
transition:.3s;
}

.toggle.active{
background:#00d9ff;
}

.toggle.active::after{
left:27px;
}

/* LOGIN */

.login{
padding:50px 20px;
text-align:center;
}

.login h2{
font-size:26px;
margin-bottom:20px;
background:linear-gradient(90deg,#00d9ff,#ffffff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.login input{
width:100%;
padding:16px;
border:none;
border-radius:16px;
background:#09111f;
color:white;
font-size:16px;
margin-bottom:15px;
outline:none;
}

.login button{
width:100%;
padding:16px;
border:none;
border-radius:16px;
background:linear-gradient(90deg,#0077ff,#00d9ff);
font-size:18px;
font-weight:700;
}

/* NAV */

.nav{
display:flex;
justify-content:space-around;
padding:12px;
border-top:1px solid #123;
background:#040912;
}

.nav-item{
font-size:10px;
text-align:center;
color:#aaa;
}

.nav-item.active{
color:#00d9ff;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div class="app" id="loginPage">

<div class="login">

<h2>PAK AI SIGNAL BOT PRO</h2>

<input type="password" id="key" placeholder="Enter Key : Pak786">

<button onclick="login()">LOGIN</button>

</div>

</div>

<!-- MAIN -->

<div class="app" id="mainPage" style="display:none;">

<div class="header">

<h1>PAK AI SIGNAL BOT PRO</h1>

<div class="tag">
REAL BINANCE • RSI • EMA • MACD • BBANDS
</div>

<div class="gear">⚙️</div>

</div>

<div class="market">

<select id="pair">

<option value="btcusdt">BTC/USDT</option>
<option value="ethusdt">ETH/USDT</option>
<option value="bnbusdt">BNB/USDT</option>

</select>

</div>

<!-- CHART -->

<div class="chart-box">

<div class="chart-top">

<div>

<div style="font-size:12px;color:#aaa;">
LIVE PRICE
</div>

<div class="price" id="price">
0.00
</div>

</div>

<div style="font-size:12px;color:#00d9ff;">
BINANCE LIVE
</div>

</div>

<div id="chart" class="chart"></div>

<div class="scan-line" id="scanLine"></div>

</div>

<!-- SCAN -->

<div class="scan-box" id="scanBox">

<div style="display:flex;align-items:center;gap:12px;">

<div class="radar"></div>

<div>

<div style="font-size:14px;font-weight:700;color:#00d9ff;">
SCANNING MARKET...
</div>

<div style="font-size:10px;color:#aaa;">
RSI • EMA • MACD • BBANDS
</div>

</div>

</div>

<div class="timer" id="timer">
03
</div>

</div>

<button class="scan-btn" id="scanBtn" onclick="startScan()">
START SCAN
</button>

<!-- RESULT -->

<div class="result" id="result">

<div style="display:flex;justify-content:space-between;align-items:center;">

<div>

<div style="font-size:11px;color:#00d9ff;">
SIGNAL
</div>

<div class="signal call" id="signal">
CALL
</div>

</div>

<div>

<div style="font-size:11px;color:#aaa;">
CONFIDENCE
</div>

<div class="conf" id="confidence">
92%
</div>

</div>

<div style="text-align:center;color:#00d9ff;">
⏰<br>
1 MIN
</div>

</div>

<div class="details" id="details">
RSI: 0 | EMA9: 0 | EMA21: 0 | MACD: 0
</div>

</div>

<!-- SETTINGS -->

<div class="row">

<div>
🔊 SOUND
</div>

<div class="toggle active" id="soundToggle"></div>

</div>

<div class="row">

<div>
📳 VIBRATION
</div>

<div class="toggle active" id="vibToggle"></div>

</div>

<!-- NAV -->

<div class="nav">

<div class="nav-item active">
🏠<br>HOME
</div>

<div class="nav-item">
📈<br>MARKET
</div>

<div class="nav-item">
⚙️<br>SETTINGS
</div>

</div>

</div>

<script>

let sound=true;
let vibration=true;
let scanning=false;

let closes=[];

let chart =
LightweightCharts.createChart(
document.getElementById('chart'),
{
layout:{
background:{color:'#07101d'},
textColor:'#DDD'
},
grid:{
vertLines:{color:'#111'},
horzLines:{color:'#111'}
},
width:360,
height:240
}
);

let candleSeries =
chart.addCandlestickSeries({
upColor:'#00ff88',
downColor:'#ff3b5c',
borderVisible:false,
wickUpColor:'#00ff88',
wickDownColor:'#ff3b5c'
});

let socket;

/* LOGIN */

function login(){

if(document.getElementById('key').value==='Pak786'){

document.getElementById('loginPage').style.display='none';

document.getElementById('mainPage').style.display='block';

connect();

}else{

alert('Wrong Key');

}

}

/* BINANCE */

function connect(){

let pair =
document.getElementById('pair').value;

if(socket){

socket.close();

}

socket = new WebSocket(
`wss://stream.binance.com:9443/ws/${pair}@kline_1m`
);

socket.onmessage = function(event){

let msg = JSON.parse(event.data);

let k = msg.k;

let candle = {
time:k.t/1000,
open:parseFloat(k.o),
high:parseFloat(k.h),
low:parseFloat(k.l),
close:parseFloat(k.c)
};

candleSeries.update(candle);

document.getElementById('price').innerText =
candle.close.toFixed(2);

closes.push(candle.close);

if(closes.length>100){

closes.shift();

}

};

}

document.getElementById('pair').onchange=function(){

connect();

}

/* RSI */

function RSI(period=14){

if(closes.length<period) return 50;

let gains=0;
let losses=0;

for(let i=1;i<period;i++){

let diff =
closes[closes.length-i] -
closes[closes.length-i-1];

if(diff>=0){

gains+=diff;

}else{

losses-=diff;

}

}

let rs=gains/(losses||1);

return 100-(100/(1+rs));

}

/* EMA */

function EMA(period){

if(closes.length<period) return 0;

let k=2/(period+1);

let ema=closes[0];

for(let i=1;i<closes.length;i++){

ema=
closes[i]*k+
ema*(1-k);

}

return ema;

}

/* MACD */

function MACD(){

return EMA(12)-EMA(26);

}

/* BOLLINGER */

function BBANDS(period=20){

if(closes.length<period){

return {upper:0,lower:0};

}

let slice =
closes.slice(-period);

let sma =
slice.reduce((a,b)=>a+b,0)/period;

let variance =
slice.reduce((a,b)=>
a+Math.pow(b-sma,2),0)/period;

let std=Math.sqrt(variance);

return{
upper:sma+2*std,
lower:sma-2*std
};

}

/* SIGNAL */

function generateSignal(){

let rsi=RSI();

let ema9=EMA(9);

let ema21=EMA(21);

let macd=MACD();

let bb=BBANDS();

let last=
closes[closes.length-1];

let signal='WAIT';

let confidence=70;

if(

rsi<55 &&
ema9>ema21 &&
macd>0 &&
last<bb.upper

){

signal='CALL';

confidence=92;

}

else if(

rsi>60 &&
ema9<ema21 &&
macd<0 &&
last>bb.lower

){

signal='PUT';

confidence=90;

}

let signalBox =
document.getElementById('signal');

signalBox.innerText=signal;

signalBox.className='signal';

if(signal==='CALL'){

signalBox.classList.add('call');

play(1000);

}

else if(signal==='PUT'){

signalBox.classList.add('put');

play(400);

}

else{

signalBox.classList.add('wait');

}

document.getElementById('confidence').innerText =
confidence+'%';

document.getElementById('details').innerHTML =

'RSI : '+rsi.toFixed(1)+
'<br>EMA9 : '+ema9.toFixed(2)+
'<br>EMA21 : '+ema21.toFixed(2)+
'<br>MACD : '+macd.toFixed(2)+
'<br>BB Upper : '+bb.upper.toFixed(2)+
'<br>BB Lower : '+bb.lower.toFixed(2);

}

/* SCAN */

function startScan(){

if(scanning) return;

scanning=true;

document.getElementById('scanBox').style.display='flex';

document.getElementById('result').style.display='none';

document.getElementById('scanLine').classList.add('active');

let btn=
document.getElementById('scanBtn');

btn.innerText='SCANNING...';

btn.classList.add('stop');

let t=3;

document.getElementById('timer').innerText=t;

let interval=setInterval(()=>{

t--;

document.getElementById('timer').innerText=t;

if(t<=0){

clearInterval(interval);

generateSignal();

document.getElementById('scanBox').style.display='none';

document.getElementById('result').style.display='block';

document.getElementById('scanLine').classList.remove('active');

btn.innerText='START SCAN';

btn.classList.remove('stop');

if(vibration && navigator.vibrate){

navigator.vibrate(300);

}

scanning=false;

}

},1000);

}

/* SOUND */

function play(freq){

if(!sound) return;

let ctx =
new(window.AudioContext||
window.webkitAudioContext)();

let osc=ctx.createOscillator();

osc.frequency.value=freq;

osc.connect(ctx.destination);

osc.start();

osc.stop(ctx.currentTime+0.2);

}

/* TOGGLE */

document.getElementById('soundToggle').onclick=function(){

sound=!sound;

this.classList.toggle('active');

}

document.getElementById('vibToggle').onclick=function(){

vibration=!vibration;

this.classList.toggle('active');

}

</script>

</body>
</html>
