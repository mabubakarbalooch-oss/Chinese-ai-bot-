<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lubna Abubakar AI Bot Pro - Live Binance</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100dvh;width:100vw;overflow:hidden;background:#0d1117;font-family:'Orbitron',sans-serif;color:#fff;touch-action:none;}

.login-screen{width:100%;height:100dvh;display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0d1117,#161b22);position:fixed;top:0;left:0;z-index:999;}
.login-card{width:90%;max-width:380px;background:#161b22;border:1px solid #30363d;border-radius:24px;padding:40px 28px;box-shadow:0 0 60px rgba(0,255,136,0.15);}
.logo{width:100px;height:100px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,#00ff88,#00cc44);display:flex;justify-content:center;align-items:center;font-size:42px;font-weight:900;color:#000;box-shadow:0 0 40px rgba(0,255,136,0.4);animation:pulseGlow 2s ease-in-out infinite;}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 40px rgba(0,255,136,0.4);}50%{box-shadow:0 0 60px rgba(0,255,136,0.7);}}
.title{text-align:center;font-size:22px;font-weight:900;color:#00ff88;letter-spacing:3px;}
.subtitle{text-align:center;font-size:11px;color:#8b949e;letter-spacing:4px;margin-bottom:30px;margin-top:6px;}
.input-box{margin-bottom:20px;position:relative;}
.input-box label{font-size:10px;color:#8b949e;letter-spacing:2px;margin-bottom:8px;display:block;text-transform:uppercase;font-weight:700;}
.input-box input{width:100%;padding:16px 16px 16px 50px;background:#0d1117;border:1px solid #30363d;border-radius:14px;color:#00ff88;font-size:16px;font-weight:700;outline:none;transition:all 0.3s;}
.input-box input:focus{border-color:#00ff88;box-shadow:0 0 20px rgba(0,255,136,0.15);}
.input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px;color:#6e7681;}
.unlock-btn{width:100%;padding:18px;background:linear-gradient(135deg,#00ff88,#00cc44);border:none;border-radius:14px;font-weight:900;font-size:16px;color:#000;letter-spacing:3px;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 25px rgba(0,255,136,0.3);margin-top:10px;}
.unlock-btn:active{transform:scale(0.97);}

.app-screen{display:none;width:100%;height:100dvh;background:#0d1117;overflow-y:auto;overflow-x:hidden;position:fixed;top:0;left:0;z-index:1;}
.app-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#161b22;border-bottom:1px solid #30363d;position:sticky;top:0;z-index:100;}
.app-header .logo-small{font-size:14px;font-weight:900;color:#00ff88;display:flex;align-items:center;gap:8px;}
.app-header .logo-small::before{content:'◈';font-size:18px;}
.app-header .live-badge{background:#238636;color:#fff;padding:4px 10px;border-radius:20px;font-size:9px;font-weight:700;display:flex;align-items:center;gap:4px;}
.app-header .live-badge::before{content:'';width:6px;height:6px;background:#00ff88;border-radius:50%;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
.app-header .stats{display:flex;gap:12px;}
.app-header .stat-item{font-size:9px;color:#8b949e;display:flex;align-items:center;gap:3px;}
.app-header .stat-item span{color:#ffd700;font-weight:700;}

.price-ticker{background:#0d1117;border-bottom:1px solid #30363d;padding:8px 18px;display:flex;justify-content:space-between;align-items:center;font-size:10px;}
.price-ticker-label{color:#8b949e;}
.price-ticker-value{font-weight:900;font-size:12px;}
.price-ticker-value.up{color:#00ff88;}
.price-ticker-value.down{color:#ff4444;}
.price-ticker-change{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;}
.price-ticker-change.up{background:rgba(0,255,136,0.15);color:#00ff88;}
.price-ticker-change.down{background:rgba(255,68,68,0.15);color:#ff4444;}
.api-status{font-size:8px;color:#00ff88;display:flex;align-items:center;gap:4px;}
.api-status::before{content:'';width:5px;height:5px;background:#00ff88;border-radius:50%;animation:blink 2s infinite;}
.api-status.error{color:#ff4444;}
.api-status.error::before{background:#ff4444;}

.home-screen{padding:16px;}
.home-title{font-size:20px;font-weight:900;text-align:center;margin-bottom:4px;}
.home-subtitle{font-size:11px;color:#8b949e;text-align:center;margin-bottom:20px;}

.stats-row{display:flex;justify-content:center;gap:16px;margin-bottom:24px;}
.stat-box{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:10px 16px;text-align:center;}
.stat-box .stat-num{font-size:16px;font-weight:900;color:#00ff88;}
.stat-box .stat-label{font-size:8px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-top:2px;}

.market-card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:18px;margin-bottom:12px;cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden;}
.market-card:hover{border-color:#00ff88;}
.market-card:active{transform:scale(0.98);}
.market-card.hot{border-color:#ff4444;}
.market-card.pro{border-color:#58a6ff;}

.market-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.market-card-left{display:flex;align-items:center;gap:12px;}
.market-icon{width:44px;height:44px;border-radius:12px;background:#0d1117;display:flex;justify-content:center;align-items:center;font-size:22px;}
.market-card.hot .market-icon{background:rgba(255,68,68,0.1);}
.market-card.pro .market-icon{background:rgba(88,166,255,0.1);}
.market-name{font-size:14px;font-weight:900;}
.market-desc{font-size:10px;color:#8b949e;margin-top:2px;}

.market-badge{font-size:9px;padding:3px 8px;border-radius:6px;font-weight:700;}
.market-badge.hot{background:rgba(255,68,68,0.15);color:#ff4444;}
.market-badge.pro{background:rgba(88,166,255,0.15);color:#58a6ff;}

.market-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.market-tag{font-size:9px;color:#00ff88;background:rgba(0,255,136,0.08);padding:4px 10px;border-radius:6px;font-weight:700;}
.market-tag.gray{color:#8b949e;background:rgba(139,148,158,0.08);}

.market-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid #30363d;}
.market-footer-left{display:flex;gap:12px;}
.market-footer-item{font-size:9px;color:#8b949e;display:flex;align-items:center;gap:4px;}
.market-footer-item::before{content:'●';color:#00ff88;font-size:6px;}
.market-status{font-size:9px;color:#00ff88;font-weight:700;}

.asset-screen{display:none;padding:16px;}
.asset-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.back-btn{width:36px;height:36px;border-radius:10px;background:#161b22;border:1px solid #30363d;display:flex;justify-content:center;align-items:center;font-size:18px;color:#fff;cursor:pointer;}
.asset-header-title{font-size:16px;font-weight:900;}
.asset-header-sub{font-size:10px;color:#8b949e;}

.asset-item{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;cursor:pointer;transition:all 0.3s;}
.asset-item:hover{border-color:#00ff88;}
.asset-item:active{transform:scale(0.98);}
.asset-left{display:flex;align-items:center;gap:12px;}
.asset-flag{width:36px;height:36px;border-radius:50%;background:#0d1117;display:flex;justify-content:center;align-items:center;font-size:20px;}
.asset-name{font-size:13px;font-weight:700;}
.asset-fullname{font-size:9px;color:#8b949e;margin-top:1px;}
.asset-right{display:flex;align-items:center;gap:12px;}
.asset-badge-hot{font-size:8px;padding:2px 8px;border-radius:4px;background:rgba(255,68,68,0.15);color:#ff4444;font-weight:700;}
.asset-change{font-size:13px;font-weight:900;}
.asset-change.up{color:#00ff88;}
.asset-change.down{color:#ff4444;}
.asset-arrow{font-size:18px;color:#8b949e;}
.asset-live-price{font-size:11px;font-weight:700;color:#ffd700;margin-right:4px;min-width:70px;text-align:right;}

.timeframe-screen{display:none;padding:16px;}
.timeframe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;}
.timeframe-card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:20px 10px;text-align:center;cursor:pointer;transition:all 0.3s;}
.timeframe-card:hover{border-color:#00ff88;}
.timeframe-card:active{transform:scale(0.97);}
.timeframe-card.selected{border-color:#00ff88;background:rgba(0,255,136,0.05);}
.timeframe-icon{font-size:28px;margin-bottom:6px;}
.timeframe-num{font-size:22px;font-weight:900;color:#00ff88;}
.timeframe-label{font-size:9px;color:#8b949e;margin-top:3px;text-transform:uppercase;letter-spacing:1px;}
.timeframe-card.mintf{border-color:#58a6ff;}
.timeframe-card.mintf.selected{border-color:#58a6ff;background:rgba(88,166,255,0.08);}
.timeframe-card.mintf .timeframe-num{color:#58a6ff;}
.selected-pair{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:16px;padding:12px;background:#161b22;border-radius:12px;border:1px solid #30363d;}
.selected-pair-text{font-size:11px;color:#8b949e;}
.selected-pair-name{font-size:13px;font-weight:900;color:#00ff88;}

.analyzing-screen{display:none;flex-direction:column;justify-content:center;align-items:center;height:100dvh;padding:20px;text-align:center;}
.brain-container{width:180px;height:180px;position:relative;margin-bottom:30px;}
.brain-ring{width:100%;height:100%;border-radius:50%;border:4px solid #30363d;border-top-color:#00ff88;border-right-color:#ff4444;animation:spinBrain 2s linear infinite;position:absolute;top:0;left:0;}
.brain-ring:nth-child(2){width:80%;height:80%;top:10%;left:10%;animation-direction:reverse;animation-duration:3s;border-top-color:#58a6ff;border-right-color:#ffd700;}
.brain-ring:nth-child(3){width:60%;height:60%;top:20%;left:20%;animation-duration:1.5s;border-top-color:#00ff88;border-right-color:#ff4444;}
@keyframes spinBrain{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.brain-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:50px;z-index:10;}
.analyzing-title{font-size:18px;font-weight:900;margin-bottom:8px;}
.analyzing-subtitle{font-size:11px;color:#8b949e;margin-bottom:30px;}
.analyzing-stats{display:flex;gap:20px;margin-bottom:30px;flex-wrap:wrap;justify-content:center;}
.analyzing-stat{text-align:center;min-width:70px;}
.analyzing-stat-num{font-size:16px;font-weight:900;}
.analyzing-stat-num.bull{color:#00ff88;}
.analyzing-stat-num.bear{color:#ff4444;}
.analyzing-stat-num.neut{color:#ffd700;}
.analyzing-stat-label{font-size:8px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-top:4px;}
.progress-bar{width:80%;height:4px;background:#30363d;border-radius:2px;overflow:hidden;margin-bottom:10px;}
.progress-fill{height:100%;background:linear-gradient(90deg,#00ff88,#58a6ff);border-radius:2px;animation:progressAnim 3s ease-in-out infinite;width:0%;}
@keyframes progressAnim{0%{width:0%;}50%{width:80%;}100%{width:100%;}}
.progress-text{font-size:10px;color:#8b949e;}

.signal-screen{display:none;flex-direction:column;justify-content:flex-start;align-items:center;padding:20px;text-align:center;overflow-y:auto;padding-top:10px;}
.main-signal-box{width:90%;max-width:340px;background:#161b22;border:2px solid #30363d;border-radius:20px;padding:24px;margin-bottom:16px;position:relative;}
.main-signal-box.buy{border-color:#00ff88;box-shadow:0 0 30px rgba(0,255,136,0.15);}
.main-signal-box.sell{border-color:#ff4444;box-shadow:0 0 30px rgba(255,68,68,0.15);}
.main-signal-box.neut{border-color:#ffd700;box-shadow:0 0 30px rgba(255,215,0,0.15);}
.signal-big-circle{width:100px;height:100px;border-radius:50%;display:flex;justify-content:center;align-items:center;margin:0 auto 12px;animation:signalPulse 2s ease-in-out infinite;}
.signal-big-circle.buy{background:linear-gradient(135deg,rgba(0,255,136,0.3),rgba(0,255,136,0.1));border:3px solid #00ff88;}
.signal-big-circle.sell{background:linear-gradient(135deg,rgba(255,68,68,0.3),rgba(255,68,68,0.1));border:3px solid #ff4444;}
.signal-big-circle.neut{background:linear-gradient(135deg,rgba(255,215,0,0.3),rgba(255,215,0,0.1));border:3px solid #ffd700;}
.signal-big-arrow{font-size:48px;font-weight:900;}
.signal-big-arrow.buy{color:#00ff88;}
.signal-big-arrow.sell{color:#ff4444;}
.signal-big-arrow.neut{color:#ffd700;}
.signal-big-text{font-size:28px;font-weight:900;margin-bottom:4px;letter-spacing:2px;}
.signal-big-text.buy{color:#00ff88;}
.signal-big-text.sell{color:#ff4444;}
.signal-big-text.neut{color:#ffd700;}
.signal-big-sub{font-size:11px;color:#8b949e;margin-bottom:8px;}
.signal-pair-name{font-size:13px;color:#8b949e;font-weight:700;}
@keyframes signalPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}

.signal-live-price-box{width:90%;max-width:340px;background:#0d1117;border:1px solid #30363d;border-radius:12px;padding:12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.signal-live-price-label{font-size:9px;color:#8b949e;text-transform:uppercase;}
.signal-live-price-value{font-size:18px;font-weight:900;color:#ffd700;}
.signal-live-price-change{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700;}
.signal-live-price-change.up{background:rgba(0,255,136,0.15);color:#00ff88;}
.signal-live-price-change.down{background:rgba(255,68,68,0.15);color:#ff4444;}

.signal-expired-box{width:90%;max-width:340px;background:rgba(255,68,68,0.1);border:1px solid #ff4444;border-radius:12px;padding:12px;margin-bottom:16px;display:none;}
.signal-expired-box.show{display:flex;justify-content:center;}
.signal-expired-text{font-size:11px;color:#ff4444;font-weight:700;}

.trend-box{width:90%;max-width:340px;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px;margin-bottom:16px;}
.trend-box-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.trend-box-title{font-size:9px;color:#8b949e;text-transform:uppercase;}
.trend-box-value{font-size:13px;font-weight:900;}
.trend-box-value.up{color:#00ff88;}
.trend-box-value.down{color:#ff4444;}
.trend-box-value.neut{color:#ffd700;}

.tf-badge{font-size:9px;padding:3px 10px;border-radius:10px;font-weight:700;margin-bottom:12px;}
.tf-badge.seconds{background:rgba(0,255,136,0.1);color:#00ff88;border:1px solid rgba(0,255,136,0.3);}
.tf-badge.minute{background:rgba(88,166,255,0.1);color:#58a6ff;border:1px solid rgba(88,166,255,0.3);}

.last-update{font-size:9px;color:#6e7681;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.last-update-dot{width:6px;height:6px;background:#00ff88;border-radius:50%;animation:blink 1s infinite;}

.ai-score-box{width:90%;max-width:340px;background:#161b22;border:1px solid #30363d;border-radius:16px;padding:16px;margin-bottom:16px;}
.ai-score-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.ai-score-title{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:2px;}
.ai-score-value{font-size:20px;font-weight:900;}
.ai-score-value.strong{color:#00ff88;}
.ai-score-value.weak{color:#ff4444;}
.ai-score-value.mod{color:#ffd700;}
.ai-score-bar{width:100%;height:8px;background:#0d1117;border-radius:4px;overflow:hidden;margin-bottom:16px;position:relative;}
.ai-score-fill{height:100%;border-radius:4px;transition:width 1s ease;}
.ai-score-fill.strong{background:linear-gradient(90deg,#00ff88,#00cc44);}
.ai-score-fill.weak{background:linear-gradient(90deg,#ff4444,#cc0000);}
.ai-score-fill.mod{background:linear-gradient(90deg,#ffd700,#ffaa00);}
.ai-score-markers{display:flex;justify-content:space-between;font-size:8px;color:#6e7681;margin-top:4px;}

.indicator-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:90%;max-width:340px;margin-bottom:16px;}
.indicator-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px;text-align:left;}
.indicator-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.indicator-name{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;}
.indicator-status{font-size:9px;padding:2px 8px;border-radius:4px;font-weight:700;}
.indicator-status.buy{background:rgba(0,255,136,0.15);color:#00ff88;}
.indicator-status.sell{background:rgba(255,68,68,0.15);color:#ff4444;}
.indicator-status.neut{background:rgba(255,215,0,0.15);color:#ffd700;}
.indicator-value{font-size:16px;font-weight:900;margin-bottom:4px;}
.indicator-value.buy{color:#00ff88;}
.indicator-value.sell{color:#ff4444;}
.indicator-value.neut{color:#ffd700;}
.indicator-desc{font-size:8px;color:#6e7681;line-height:1.4;}

.ai-processing{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.ai-dot{width:8px;height:8px;background:#00ff88;border-radius:50%;animation:aiBlink 1s infinite;}
@keyframes aiBlink{0%,100%{opacity:1;}50%{opacity:0.3;}}
.ai-text{font-size:10px;color:#00ff88;font-weight:700;}

.trade-timer{width:80%;margin-bottom:16px;}
.trade-timer-label{display:flex;justify-content:space-between;font-size:9px;color:#8b949e;margin-bottom:6px;}
.trade-timer-bar{height:4px;background:#30363d;border-radius:2px;overflow:hidden;}
.trade-timer-fill{height:100%;border-radius:2px;animation:timerAnim 10s linear infinite;}
.trade-timer-fill.buy{background:linear-gradient(90deg,#00ff88,#00cc44);}
.trade-timer-fill.sell{background:linear-gradient(90deg,#ff4444,#cc0000);}
.trade-timer-fill.neut{background:linear-gradient(90deg,#ffd700,#ffaa00);}
@keyframes timerAnim{0%{width:100%;}100%{width:0%;}}
.timer-text{font-size:10px;color:#8b949e;margin-top:8px;margin-bottom:12px;}

.generate-btn{width:80%;padding:16px;background:linear-gradient(135deg,#00ff88,#00cc44);border:none;border-radius:14px;font-weight:900;font-size:14px;color:#000;letter-spacing:2px;cursor:pointer;transition:all 0.3s;margin-bottom:10px;}
.generate-btn:active{transform:scale(0.97);}
.refresh-btn{width:80%;padding:14px;background:linear-gradient(135deg,#58a6ff,#0066cc);border:none;border-radius:14px;font-weight:900;font-size:13px;color:#fff;letter-spacing:2px;cursor:pointer;transition:all 0.3s;}
.refresh-btn:active{transform:scale(0.97);}

/* Entry Price Box - COMPLETED */
.entry-price-box{
    width:90%;
    max-width:340px;
    background:#161b22;
    border:1px solid #30363d;
    border-radius:12px;
    padding:14px;
    margin-bottom:16px;
}
.entry-price-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}
.entry-price-row:last-child{
    margin-bottom:0;
}
.entry-price-label{
    font-size:10px;
    color:#8b949e;
    text-transform:uppercase;
    letter-spacing:1px;
}
.entry-price-value{
    font-size:14px;
    font-weight:900;
}
.entry-price-value.entry{color:#00ff88;}
.entry-price-value.tp{color:#58a6ff;}
.entry-price-value.sl{color:#ff4444;}
</style>
</head>
