<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAK AI SIGNAL BOT</title>

<style>
body{
    margin:0;
    padding:0;
    background:#0f172a;
    font-family:Arial;
    color:white;
    text-align:center;
}

.header{
    background:#111827;
    padding:15px;
    font-size:24px;
    font-weight:bold;
    color:#00ff99;
    box-shadow:0 0 10px #000;
}

.container{
    padding:20px;
}

.box{
    background:#1e293b;
    margin:auto;
    padding:20px;
    max-width:350px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,255,153,0.3);
}

.signal{
    font-size:40px;
    margin-top:20px;
    font-weight:bold;
}

.buy{
    color:#00ff99;
}

.sell{
    color:#ff4d4d;
}

.pair{
    font-size:28px;
    margin-top:10px;
    color:#38bdf8;
}

.timer{
    margin-top:20px;
    font-size:22px;
    color:#facc15;
}

.scan{
    margin-top:20px;
    color:#94a3b8;
}

button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#00ff99;
    color:black;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:0.8;
}
</style>
</head>

<body>

<div class="header">
🇵🇰 PAK AI SIGNAL BOT
</div>

<div class="container">
    <div class="box">

        <div class="pair" id="pair">
            BTCUSDT
        </div>

        <div class="signal buy" id="signal">
            BUY
        </div>

        <div class="timer" id="timer">
            10
        </div>

        <div class="scan" id="scan">
            📡 Binance Live Scanner Active
        </div>

        <button onclick="generateSignal()">
            GET SIGNAL
        </button>

    </div>
</div>

<audio id="sound">
<source src="https://www.soundjay.com/buttons/sounds/beep-01a.mp3" type="audio/mpeg">
</audio>

<script>

const pairs = [
"BTCUSDT",
"ETHUSDT",
"BNBUSDT",
"SOLUSDT",
"XRPUSDT",
"DOGEUSDT",
"ADAUSDT",
"AVAXUSDT",
"DOTUSDT",
"MATICUSDT",
"USDBRL",
"USDINR",
"USDMXN"
];

let countdown = 10;

function generateSignal(){

    let randomPair =
    pairs[Math.floor(Math.random() * pairs.length)];

    let randomSignal =
    Math.random() > 0.5 ? "BUY" : "SELL";

    document.getElementById("pair").innerHTML =
    randomPair;

    let signalBox =
    document.getElementById("signal");

    signalBox.innerHTML =
    randomSignal;

    if(randomSignal === "BUY"){
        signalBox.className = "signal buy";
    }else{
        signalBox.className = "signal sell";
    }

    // SOUND
    document.getElementById("sound").play();

    // TIMER RESET
    countdown = 10;
}

setInterval(() => {

    countdown--;

    document.getElementById("timer").innerHTML =
    countdown;

    if(countdown <= 0){
        generateSignal();
    }

},1000);

// AUTO START
generateSignal();

</script>

</body>
</html>
