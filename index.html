<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Signal Generator Pro</title>
<style>
    body { background:#0a0e13; font-family:sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
    .container { width: 90%; max-width: 450px; background:#0f1318; border:2px solid #00ff88; border-radius:25px; padding:25px; box-shadow:0 0 20px rgba(0,255,136,0.3); }
    h1 { color:#00ff88; font-size:20px; text-align:center; }
    .label { color:#8b949e; font-size:13px; margin:10px 0 5px 0; display:block; }
    select, input { width:100%; padding:12px; background:#1a1f26; border:1px solid #30363d; border-radius:10px; color:#fff; box-sizing:border-box; }
    .time-container { display:flex; gap:5px; margin:10px 0; }
    .time-btn { flex:1; padding:10px; background:#1a1f26; border:1px solid #30363d; border-radius:8px; color:#8b949e; cursor:pointer; text-align:center; font-size:12px; }
    .time-btn.active { border:1px solid #00ff88; color:#00ff88; }
    .gen-btn { width:100%; padding:15px; background:#00ff88; border:none; border-radius:10px; font-weight:bold; cursor:pointer; margin-top:15px; color:#000; }
    
    /* Loading Bar */
    #progressContainer { width:100%; height:8px; background:#1a1f26; border-radius:4px; margin-top:15px; display:none; overflow:hidden; }
    #progressBar { width:0%; height:100%; background:#00ff88; transition: width 2s; }

    #signalBox { margin-top:15px; padding:12px; border-radius:10px; text-align:center; font-weight:bold; display:none; }
    .buy-style { background:rgba(0, 255, 136, 0.2); border:1px solid #00ff88; color:#00ff88; }
    .sell-style { background:rgba(255, 68, 68, 0.2); border:1px solid #ff4444; color:#ff4444; }

    /* Indicator Boxes */
    .indicator-container { display:flex; gap:8px; margin-top:15px; }
    .ind-box { flex:1; background:#1a1f26; padding:10px; border-radius:8px; border:1px solid #30363d; text-align:center; font-size:10px; color:#8b949e; }
</style>
</head>
<body>

<div id="loginScreen" class="container">
    <h2 style="color:#00ff88; text-align:center;">🔒 Access Locked</h2>
    <input type="password" id="pass" placeholder="Enter Password">
    <button class="gen-btn" onclick="login()">Unlock Now</button>
</div>

<div id="mainBoard" class="container" style="display:none;">
    <h1>🚀 Chinese Signal Generator</h1>
    <label class="label">Trading Asset</label>
    <select id="asset"><option>NZD/CHF (OTC)</option><option>USD/BRL (OTC)</option><option>USD/MXN (OTC)</option></select>

    <label class="label">Time Frame</label>
    <div class="time-container">
        <div class="time-btn" onclick="setActive(this)">5s</div>
        <div class="time-btn active" onclick="setActive(this)">15s</div>
        <div class="time-btn" onclick="setActive(this)">30s</div>
    </div>

    <button class="gen-btn" onclick="startAnalysis()">⚡ GENERATE SIGNAL ⚡</button>
    
    <div id="progressContainer"><div id="progressBar"></div></div>
    <div id="signalBox">---</div>

    <div class="indicator-container">
        <div class="ind-box">RSI<br><span id="rsi" style="color:#fff">--</span></div>
        <div class="ind-box">Moving Avg<br><span id="ma" style="color:#fff">--</span></div>
        <div class="ind-box">Conf.<br><span id="conf" style="color:#fff">--</span></div>
    </div>
</div>

<script>
    function login() {
        if(document.getElementById('pass').value === "bakar786") {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainBoard').style.display = 'block';
        } else { alert("Wrong Password!"); }
    }
    function setActive(el) {
        document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }
    function startAnalysis() {
        document.getElementById('progressContainer').style.display = 'block';
        document.getElementById('progressBar').style.width = '100%';
        setTimeout(() => {
            let isBuy = Math.random() > 0.5;
            let box = document.getElementById('signalBox');
            box.style.display = 'block';
            box.innerText = isBuy ? "BUY SIGNAL" : "SELL SIGNAL";
            box.className = isBuy ? "buy-style" : "sell-style";
            
            document.getElementById('rsi').innerText = Math.floor(Math.random() * 40 + 30);
            document.getElementById('ma').innerText = "MA(50)";
            document.getElementById('conf').innerText = "96%";
            
            // Sound
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.frequency.value = isBuy ? 600 : 300;
            osc.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.3);
            
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('progressBar').style.width = '0%';
        }, 2000);
    }
</script>
</body>
</html>
