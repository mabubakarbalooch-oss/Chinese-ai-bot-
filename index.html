<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chinese Signal Generator Pro</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { background:#0a0e13; color:#fff; font-family:'Inter', sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }

    #loginScreen { background:#1a1f26; padding:40px; border-radius:20px; border:1px solid #00ff88; text-align:center; width:350px; }
    #loginScreen input { width:100%; padding:15px; margin-bottom:20px; border-radius:12px; border:1px solid #333; background:#0f1318; color:#fff; text-align:center; }
    #loginScreen button { width:100%; padding:15px; background:#00ff88; border:none; border-radius:12px; font-weight:700; cursor:pointer; }

    #mainBoard { display:none; width:420px; background:#0f1318; border:2px solid #00ff88; border-radius:30px; padding:40px; box-shadow:0 0 40px rgba(0,255,136,0.2); }
    h1 { color:#00ff88; font-size:24px; text-align:center; margin-bottom:30px; }
    .label { color:#8b949e; font-size:14px; margin-bottom:10px; margin-top:15px; display:block; }
    .select-box { width:100%; padding:15px; background:#1a1f26; border:1px solid #30363d; border-radius:15px; color:#fff; font-size:16px; margin-bottom:10px; }
    
    .time-container { display:flex; gap:10px; margin-bottom:25px; }
    .time-btn { flex:1; padding:15px 0; background:#1a1f26; border:1px solid #30363d; border-radius:12px; color:#8b949e; cursor:pointer; font-size:14px; text-align:center; transition:0.3s; }
    .time-btn.active { border:1px solid #00ff88; color:#00ff88; background:rgba(0,255,136,0.1); }
    
    .gen-btn { width:100%; padding:20px; background:linear-gradient(90deg, #00ff88, #00d977); border:none; border-radius:15px; font-weight:700; color:#000; cursor:pointer; font-size:18px; margin-top:20px; }
    
    #signalBox { margin-top:25px; padding:20px; border-radius:15px; text-align:center; font-size:22px; font-weight:bold; display:none; }
    .buy-style { background:rgba(0, 255, 136, 0.2); border:1px solid #00ff88; color:#00ff88; }
    .sell-style { background:rgba(255, 68, 68, 0.2); border:1px solid #ff4444; color:#ff4444; }

    .indicator-box { display:flex; gap:15px; margin-top:25px; }
    .ind-card { flex:1; background:#1a1f26; padding:15px; border-radius:15px; border:1px solid #30363d; text-align:center; font-size:12px; }
</style>
</head>
<body>

<div id="loginScreen">
    <h2 style="color:#00ff88; margin-bottom:20px;">🔒 Locked</h2>
    <input type="password" id="pass" placeholder="Enter Password">
    <button onclick="login()">Unlock</button>
</div>

<div id="mainBoard">
    <h1>🚀 Chinese Signal Generator</h1>
    
    <label class="label">Select Broker</label>
    <select class="select-box"><option>Quotex</option></select>
    
    <label class="label">Trading Asset</label>
    <select class="select-box">
        <option>NZD/CHF (OTC)</option>
        <option>USD/BRL (OTC)</option>
        <option>USD/MXN (OTC)</option>
        <option>EUR/USD</option>
    </select>

    <label class="label">Time Frame</label>
    <div class="time-container">
        <div class="time-btn" onclick="selectTime(this)">5s</div>
        <div class="time-btn active" onclick="selectTime(this)">15s</div>
        <div class="time-btn" onclick="selectTime(this)">30s</div>
        <div class="time-btn" onclick="selectTime(this)">1m</div>
    </div>

    <button class="gen-btn" onclick="gen()">⚡ GENERATE SIGNAL ⚡</button>

    <div id="signalBox">---</div>

    <div class="indicator-box">
        <div class="ind-card">RSI<br><strong id="rsi" style="color:#00ff88">--</strong></div>
        <div class="ind-card">Trend<br><strong id="ma" style="color:#00ff88">--</strong></div>
        <div class="ind-card">Acc.<br><strong id="conf" style="color:#00ff88">--</strong></div>
    </div>
</div>

<script>
    function login() {
        if(document.getElementById('pass').value === "bakar786") {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainBoard').style.display = 'block';
        } else { alert("Wrong Password!"); }
    }

    function selectTime(el) {
        document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
        el.classList.add('active');
    }
    
    function gen() {
        let isBuy = Math.random() > 0.5;
        let box = document.getElementById('signalBox');
        
        document.getElementById('rsi').innerText = Math.floor(Math.random() * 40 + 30);
        document.getElementById('ma').innerText = "Bullish";
        document.getElementById('conf').innerText = "96%";
        
        box.style.display = 'block';
        box.innerText = isBuy ? "BUY SIGNAL" : "SELL SIGNAL";
        box.className = isBuy ? "buy-style" : "sell-style";
        
        // Sound
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.frequency.value = isBuy ? 600 : 300;
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
    }
</script>
</body>
</html>
