<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA AI - Amir FX Style</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{background:#050a14;font-family:'Orbitron',sans-serif;color:#fff;margin:0;}
.top{padding:12px;background:#0a1120;border-bottom:1px solid #00ff88;display:flex;justify-content:space-between;}
.logo{color:#00ff88;font-weight:900;}
.stats{font-size:11px;}
.green{color:#00ff88;}
.container{padding:16px;}
.card{background:#0a1120;border:1px solid #1e2a47;border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;}
.card:hover{border-color:#00ff88;}
.title{font-size:16px;font-weight:900;}
.sub{font-size:11px;color:#8b9bb4;}
.tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.tag{background:#131d33;padding:4px 8px;border-radius:6px;font-size:9px;}
.asset{display:flex;justify-content:space-between;padding:14px;background:#0a1120;border:1px solid #1e2a47;border-radius:10px;margin:8px 0;cursor:pointer;}
.time-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;}
.time-btn{background:#0a1120;border:2px solid #1e2a47;border-radius:12px;padding:20px;text-align:center;cursor:pointer;}
.time-btn:hover{border-color:#00ff88;}
.signal-box{text-align:center;padding:30px;}
.signal-circle{width:150px;height:150px;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;}
.buy{border:3px solid #00ff88;color:#00ff88;background:rgba(0,255,136,0.1);}
.sell{border:3px solid #ff4444;color:#ff4444;background:rgba(255,68,68,0.1);}
.btn{width:90%;padding:16px;background:#00ff88;color:#000;border:none;border-radius:12px;font-weight:900;font-size:16px;margin:10px auto;display:block;}
</style>
</head>
<body>

<div class="top">
  <div class="logo">◆ LUBNA AI PRO</div>
  <div class="stats">WIN <span class="green">94.7%</span> | LIVE</div>
</div>

<div id="main">
  <div class="container">
    <div style="text-align:center;margin-bottom:20px;">
      <div style="font-size:18px;font-weight:900;">SELECT TRADING DIRECTION</div>
      <div class="sub">AI Powered OTC Signals</div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;">
      <div class="card" style="text-align:center;"><div class="green" style="font-size:20px;">94.7%</div><div class="sub">WIN RATE</div></div>
      <div class="card" style="text-align:center;"><div class="green" style="font-size:20px;">58K+</div><div class="sub">TRADERS</div></div>
      <div class="card" style="text-align:center;"><div class="green" style="font-size:20px;">REAL</div><div class="sub">TIME</div></div>
    </div>

    <div class="card" onclick="showAssets()">
      <div class="title">OTC PAIRS <span style="color:#ffaa00;">HOT</span></div>
      <div class="sub">Forex & Currency - 24/7 Trading</div>
      <div class="tags"><div class="tag">27 Assets</div><div class="tag">Forex</div><div class="tag">OTC</div></div>
    </div>
  </div>
</div>

<div id="assets" style="display:none;">
  <div style="padding:12px;cursor:pointer;" onclick="backMain()">← BACK</div>
  <div id="assetList"></div>
</div>

<div id="time" style="display:none;">
  <div style="padding:12px;cursor:pointer;" onclick="showAssets()">← BACK</div>
  <div style="text-align:center;font-size:18px;font-weight:900;" id="selAsset">USD/INR</div>
  <div class="time-grid">
    <div class="time-btn" onclick="signal(5)"><div style="font-size:28px;color:#00ff88;">5</div><div>SECONDS</div></div>
    <div class="time-btn" onclick="signal(15)"><div style="font-size:28px;color:#00ff88;">15</div><div>SECONDS</div></div>
    <div class="time-btn" onclick="signal(60)"><div style="font-size:28px;color:#00ff88;">1</div><div>MINUTE</div></div>
    <div class="time-btn" onclick="signal(300)"><div style="font-size:28px;color:#00ff88;">5</div><div>MINUTES</div></div>
  </div>
</div>

<div id="result" style="display:none;" class="signal-box">
  <div class="signal-circle" id="sigCircle">BUY</div>
  <div id="sigText"></div>
  <div style="margin:15px 0;">Accuracy: <span class="green">86%</span></div>
  <button class="btn" onclick="backMain()">NEW SIGNAL</button>
</div>

<script>
let asset='';
function showAssets(){
  document.getElementById('main').style.display='none';
  document.getElementById('assets').style.display='block';
  let list=['USD/BRL','USD/MXN','USD/PKR','USD/INR','EUR/USD','GBP/USD','AUD/USD','USD/JPY'];
  let html='';
  list.forEach(a=>{html+=`<div class="asset" onclick="sel('${a}')"><div>${a} OTC</div><div class="green">+0.${Math.floor(Math.random()*9)}%</div></div>`});
  document.getElementById('assetList').innerHTML=html;
}
function sel(a){asset=a;document.getElementById('selAsset').innerText=a;document.getElementById('assets').style.display='none';document.getElementById('time').style.display='block';}
function signal(t){document.getElementById('time').style.display='none';setTimeout(()=>{let s=Math.random()>0.14?'BUY':'SELL';document.getElementById('sigCircle').className='signal-circle '+s.toLowerCase();document.getElementById('sigCircle').innerText=s;document.getElementById('sigText').innerText=asset+' - '+t+'s';document.getElementById('result').style.display='block';},1500);}
function backMain(){['assets','time','result'].forEach(id=>document.getElementById(id).style.display='none');document.getElementById('main').style.display='block';}
</script>
</body>
</html>
