<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chinese Signal Generator Pro</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { background:#0a0e13; color:#fff; font-family:'Inter', sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }

    #loginScreen { background:#1a1f26; padding:30px; border-radius:20px; border:1px solid #00ff88; text-align:center; width:350px; }
    #loginScreen input { width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid #333; background:#0f1318; color:#fff; text-align:center; }
    #loginScreen button { width:100%; padding:12px; background:#00ff88; border:none; border-radius:8px; font-weight:700; cursor:pointer; }

    #mainBoard { display:none; width:380px; background:#0f1318; border:2px solid #00ff88; border-radius:25px; padding:25px; box-shadow:0 0 30px rgba(0,255,136,0.2); }
    
    h1 { color:#00ff88; font-size:20px; text-align:center; margin-bottom:20px; }
    .select-box { width:100%; padding:12px; background:#1a1f26; border:1px solid #30363d; border-radius:12px; color:#fff; margin-bottom:15px; }
    
    .gen-btn { width:100%; padding:15px; background:linear-gradient(90deg, #00ff88, #00d977); border:none; border-radius:15px; font-weight:700; color:#000; cursor:pointer; margin-top:10px; }
    
    /* سگنل باکس کا ڈیزائن */
    #signalBox { margin-top:20px; padding:15px; border-radius:12px; text-align:center; font-size:20px; font-weight:bold; display:none; }
    .buy-style { background:rgba(0, 255, 136, 0.2); border:1px solid #00ff88; color:#00ff88; }
    .sell-style { background:rgba(255, 68, 68, 0.2); border:1px solid #ff4444; color:#ff4444; }
</style>
</head>
<body>

<div id="loginScreen">
    <h2 style="color:#00ff88; margin-bottom:15px;">🔒 Locked</h2>
    <input type="password" id="pass" placeholder="Enter Password">
    <button onclick="login()">Unlock</button>
</div>

<div id="mainBoard">
    <h1>🚀 Chinese Signal Generator</h1>
    
    <label style="font-size:12px; color:#8b949e;">Select Broker</label>
    <select class="select-box"><option>Quotex</option></select>
    
    <label style="font-size:12px; color:#8b949e;">Trading Asset</label>
    <select class="select-box"><option>NZD/CHF (OTC)</option></select>

    <button class="gen-btn" onclick="gen()">⚡ GENERATE SIGNAL</button>

    <div id="signalBox">---</div>
</div>

<script>
    function login() {
        if(document.getElementById('pass').value === "bakar786") {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainBoard').style.display = 'block';
        } else { alert("Wrong Password!"); }
    }
    
    function gen() {
        let box = document.getElementById('signalBox');
        let isBuy = Math.random() > 0.5;
        
        box.style.display = 'block';
        box.innerText = isBuy ? "BUY SIGNAL" : "SELL SIGNAL";
        box.className = isBuy ? "buy-style" : "sell-style";
        
        // ساؤنڈ پلے کرنا
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.frequency.value = isBuy ? 600 : 300;
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
    }
</script>
</body>
</html>
