<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA ABUBAKAR SIGNAL PRO - FIXED</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#000;
 --card:rgba(15,12,0,0.98);
 --yellow:#ffd700;
 --yellow-glow:rgba(255,215,0,0.5);
 --yellow-dim:#b8860b;
 --black:#000;
 --red:#ff3333;
 --green:#00ff44;
 --text:#ffffff;
 --muted:#888866;
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{
 font-family:'Poppins',sans-serif;
 background:var(--black);
 height:100vh;width:100vw;
 overflow:hidden;color:var(--text);
 display:flex;justify-content:center;align-items:center;
}

.bg-yellow{
 position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;
 background:
   radial-gradient(ellipse at 30% 20%, rgba(255,215,0,0.06) 0%, transparent 50%),
   radial-gradient(ellipse at 70% 80%, rgba(255,170,0,0.04) 0%, transparent 50%);
}

.login-wrapper{width:100%;max-width:400px;position:relative;}
.login-card{
 background:linear-gradient(145deg, rgba(20,18,0,0.98), rgba(10,10,0,0.98));
 border:2px solid var(--yellow);border-radius:24px;
 padding:45px 35px;box-shadow:0 0 60px rgba(255,215,0,0.15), 0 20px 50px rgba(0,0,0,0.8);
}
.login-header{text-align:center;margin-bottom:40px;}
.login-logo{
 width:100px;height:100px;margin:0 auto 25px;border-radius:50%;
 background:linear-gradient(135deg, var(--yellow), #ffaa00);
 display:flex;justify-content:center;align-items:center;
 font-family:'Orbitron',sans-serif;font-weight:900;font-size:40px;color:var(--black);
 box-shadow:0 0 50px var(--yellow-glow);
 border:3px solid var(--yellow);
}
.login-header h1{
 font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;
 color:var(--yellow);letter-spacing:3px;margin-bottom:8px;
}
.input-group{margin-bottom:22px;}
.input-group label{
 display:block;font-size:10px;color:var(--yellow-dim);
 margin-bottom:8px;text-transform:uppercase;letter-spacing:3px;font-weight:700;
}
.input-box input{
 width:100%;padding:16px 20px;border-radius:14px;
 border:2px solid rgba(255,215,0,0.2);background:rgba(0,0,0,0.6);
 color:var(--yellow);font-size:15px;outline:none;
 font-family:'Orbitron',sans-serif;font-weight:700;
}
.unlock-btn{
 width:100%;padding:18px;border:none;border-radius:14px;
 background:linear-gradient(135deg, var(--yellow), #ffaa00);
 font-family:'Orbitron',sans-serif;font-weight:900;font-size:14px;
 color:var(--black);cursor:pointer;letter-spacing:4px;
 box-shadow:0 10px 40px rgba(255,215,0,0.3);border:2px solid var(--yellow);
}

.main-wrapper{
 width:100%;height:100vh;max-width:1400px;
 display:none;padding:10px;flex-direction:column;
}

.dash-header{
 display:flex;justify-content:space-between;align-items:center;
 margin-bottom:10px;padding:0 5px;
}
.dash-brand{display:flex;align-items:center;gap:12px;}
.brand-logo{
 width:45px;height:45px;border-radius:14px;
 background:linear-gradient(135deg, var(--yellow), #ffaa00);
 display:flex;justify-content:center;align-items:center;
 font-family:'Orbitron',sans-serif;font-weight:900;font-size:18px;
 color:var(--black);box-shadow:0 0 25px var(--yellow-glow);
 border:2px solid var(--yellow);
}
.brand-info h1{
 font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;
 color:var(--yellow);letter-spacing:1px;
}
.live-badge{
 display:flex;align-items:center;gap:8px;
 padding:8px 18px;border-radius:50px;
 background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.2);
 font-size:11px;font-weight:700;color:var(--yellow);
 font-family:'Orbitron',sans-serif;letter-spacing:2px;
}
.live-dot{
 width:8px;height:8px;border-radius:50%;
 background:var(--green);box-shadow:0 0 12px var(--green);
}

.dash-grid{
 display:grid;
 grid-template-columns:260px 1fr 280px;
 grid-template-rows:auto auto 1fr auto;
 gap:10px;flex:1;min-height:0;overflow:hidden;
}

.yellow-card{
 background:linear-gradient(145deg, rgba(20,18,0,0.95), rgba(10,10,0,0.95));
 border:1px solid rgba(255,215,0,0.15);border-radius:16px;
 padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,0.5);
}

.yellow-label{
 font-size:9px;color:var(--yellow-dim);margin-bottom:8px;
 text-transform:uppercase;letter-spacing:3px;font-weight:700;
}

.yellow-select{
 width:100%;padding:10px 12px;border-radius:10px;
 border:1px solid rgba(255,215,0,0.2);background:rgba(0,0,0,0.5);
 color:var(--yellow);font-size:12px;margin-bottom:10px;outline:none;
 font-weight:600;
}

.controls-card{grid-column:1;grid-row:1 / 3;}

.pair-card{
 grid-column:2;grid-row:1;display:flex;justify-content:space-between;
 align-items:center;padding:14px 20px;
}
.pair-name{
 font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;
 color:var(--yellow);letter-spacing:1px;
}
.pair-price{
 font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;
 color:var(--yellow);text-shadow:0 0 20px var(--yellow-glow);
}

.timer-card{
 grid-column:3;grid-row:1;text-align:center;
 display:flex;flex-direction:column;justify-content:center;align-items:center;
}
.timer-value{
 font-family:'Orbitron',sans-serif;font-size:36px;font-weight:900;
 color:var(--yellow);text-shadow:0 0 25px var(--yellow-glow);
}

.gen-card{
 grid-column:2;grid-row:2;display:flex;justify-content:center;
 align-items:center;padding:10px;
}
.gen-btn{
 width:100%;max-width:300px;padding:18px;border:none;border-radius:14px;
 background:linear-gradient(135deg, var(--yellow), #ffaa00);
 font-family:'Orbitron',sans-serif;font-weight:900;font-size:15px;
 color:var(--black);cursor:pointer;letter-spacing:4px;
 box-shadow:0 10px 40px rgba(255,215,0,0.3);border:2px solid var(--yellow);
}
.gen-btn:disabled{opacity:0.5;cursor:not-allowed;}

.signal-card{
 grid-column:3;grid-row:2;display:none;border:2px solid;
 animation:signalPop 0.5s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes signalPop{
 0%{opacity:0;transform:scale(0.8);}100%{opacity:1;transform:scale(1);}
}
.signal-card.buy{
 background:linear-gradient(145deg, rgba(0,255,68,0.08), rgba(0,40,0,0.95));
 border-color:rgba(0,255,68,0.3);
}
.signal-card.sell{
 background:linear-gradient(145deg, rgba(255,51,51,0.08), rgba(40,0,0,0.95));
 border-color:rgba(255,51,51,0.3);
}

.signal-type{
 padding:8px 16px;border-radius:50px;
 font-family:'Orbitron',sans-serif;font-weight:900;font-size:14px;
}
.signal-card.buy.signal-type{
 background:rgba(0,255,68,0.15);color:var(--green);
}
.signal-card.sell.signal-type{
 background:rgba(255,51,51,0.15);color:var(--red);
}

.sig-item{
 background:rgba(0,0,0,0.4);border:1px solid rgba(255,215,0,0.1);
 border-radius:10px;padding:8px 10px;text-align:center;margin-top:8px;
}
.sig-item.val{
 font-family:'Orbitron',sans-serif;font-size:14px;font-weight:900;
}
.signal-card.buy.val{color:var(--green);}
.signal-card.sell.val{color:var(--red);}

.conf-bar{
 height:6px;background:rgba(255,255,255,0.05);border-radius:3px;
 overflow:hidden;margin:10px 0;
}
.conf-fill{
 height:100%;border-radius:3px;transition:width 1s ease-out;
}
.signal-card.buy.conf-fill{
 background:linear-gradient(90deg, var(--green), #00cc44);
}
.signal-card.sell.conf-fill{
 background:linear-gradient(90deg, var(--red), #ff6666);
}

.chart-card{
 grid-column:2;grid-row:3;padding:0;display:flex;flex-direction:column;
}
.chart-header{
 display:flex;justify-content:space-between;align-items:center;
 padding:10px 16px;border-bottom:1px solid rgba(255,215,0,0.1);
}
.chart-title{
 font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;
 color:var(--yellow);
}
#chartBox{flex:1;min-height:0;}

.scan-overlay{
 display:none;position:fixed;top:0;left:0;width:100%;height:100%;
 background:rgba(0,0,0,0.92);z-index:1000;
 justify-content:center;align-items:center;flex-direction:column;
}
.scan-text{
 font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;
 color:var(--yellow);margin-top:25px;letter-spacing:4px;
}
</style>
</head>
<body>

<div class="bg-yellow"></div>

<div class="scan-overlay" id="scanOverlay">
 <div class="scan-text">SCANNING...</div>
</div>

<div class="login-wrapper" id="loginScreen">
 <div class="login-card">
   <div class="login-header">
     <div class="login-logo">LA</div>
     <h1>LUBNA ABUBAKAR</h1>
   </div>
   <div class="input-group">
     <label>Username</label>
     <div class="input-box">
       <input type="text" id="username" value="Lubna">
     </div>
   </div>
   <div class="input-group">
     <label>Password</label>
     <div class="input-box">
       <input type="password" id="password" value="pro123">
     </div>
   </div>
   <button class="unlock-btn" onclick="doLogin()">UNLOCK</button>
 </div>
</div>

<div class="main-wrapper" id="mainScreen">
 <div class="dash-header">
   <div class="dash-brand">
     <div class="brand-logo">LA</div>
     <div class="brand-info">
       <h1>LUBNA ABUBAKAR</h1>
     </div>
   </div>
   <div class="live-badge">
     <div class="live-dot"></div>
     <span>BINANCE LIVE</span>
   </div>
 </div>

 <div class="dash-grid">
   <div class="yellow-card controls-card">
     <div class="yellow-label">Pair</div>
     <select class="yellow-select" id="pairSelect" onchange="onPairChange()">
       <option value="BTCUSDT">BTC/USDT</option>
       <option value="ETHUSDT">ETH/USDT</option>
       <option value="BNBUSDT">BNB/USDT</option>
     </select>
   </div>

   <div class="yellow-card pair-card">
     <div class="pair-name" id="pairName">BTC/USDT</div>
     <div class="pair-price" id="pairPrice">0.00</div>
   </div>

   <div class="yellow-card timer-card">
     <div class="yellow-label">Next Signal</div>
     <div class="timer-value" id="timer">60</div>
   </div>

   <div class="yellow-card gen-card">
     <button class="gen-btn" id="genBtn" onclick="generateSignal()">GENERATE SIGNAL</button>
   </div>

   <div class="signal-card" id="signalCard">
     <div class="signal-type" id="signalType">BUY</div>
     <div class="sig-item">
       <div class="lbl">Entry Price</div>
       <div class="val" id="entryPrice">0.00</div>
     </div>
     <div class="sig-item">
       <div class="lbl">Confidence</div>
       <div class="val" id="confValue">95%</div>
     </div>
     <div class="conf-bar">
       <div class="conf-fill" id="confFill"></div>
     </div>
     <div class="sig-item">
       <div class="lbl">Reason</div>
       <div class="val" id="sigReason" style="font-size:11px">EMA + RSI</div>
     </div>
   </div>

   <div class="yellow-card chart-card">
     <div class="chart-header">
       <div class="chart-title" id="chartTitle">BTC/USDT Live Chart</div>
     </div>
     <div id="chartBox"></div>
   </div>
 </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
let currentWidget = null;
let currentPair = 'BTCUSDT';
let candleData = [];
let timerCount = 60;
let scanTimer = null;

function doLogin(){
 let u = document.getElementById('username').value.trim();
 let p = document.getElementById('password').value.trim();

 if(u === 'Lubna' && p === 'pro123'){
   document.getElementById('loginScreen').style.display = 'none';
   document.getElementById('mainScreen').style.display = 'flex';
   loadChart();
   fetchCandles();
   startTimer();
 } else {
   alert('غلط Username یا Password!');
 }
}

function onPairChange(){
 currentPair = document.getElementById('pairSelect').value;
 document.getElementById('pairName').textContent = currentPair.replace('USDT', '/USDT');
 document.getElementById('chartTitle').textContent = currentPair.replace('USDT', '/USDT') + ' Live Chart';
 loadChart();
 fetchCandles();
}

function loadChart(){
 document.getElementById('chartBox').innerHTML = '';
 let symbol = 'BINANCE:' + currentPair;

 if(currentWidget) currentWidget.remove();

 currentWidget = new TradingView.widget({
   "width": "100%",
   "height": "100%",
   "symbol": symbol,
   "interval": "1",
   "timezone": "Asia/Karachi",
   "theme": "dark",
   "style": "1",
   "container_id": "chartBox",
   "hide_top_toolbar": false,
   "backgroundColor": "#000"
 });
}

async function fetchCandles(){
 try{
   let res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${currentPair}&interval=1m&limit=100`);
   let data = await res.json();

   candleData = data.map(c => ({
     time: c[0],
     open: parseFloat(c[1]),
     high: parseFloat(c[2]),
     low: parseFloat(c[3]),
     close: parseFloat(c[4])
   }));

   let lastPrice = candleData[candleData.length-1].close;
   document.getElementById('pairPrice').textContent = lastPrice.toFixed(2);
 }
 catch(e){
   console.log('Error:', e);
 }
}

function calcEMA(prices, period){
 let k = 2/(period+1);
 let ema = prices[0];
 for(let i=1; i<prices.length; i++){
   ema = prices[i]*k + ema*(1-k);
 }
 return ema;
}

function calcRSI(prices, period=14){
 let gains = 0, losses = 0;
 for(let i=1; i<prices.length; i++){
   let diff = prices[i] - prices[i-1];
   if(diff > 0) gains += diff;
   else losses += Math.abs(diff);
 }
 let avgGain = gains/period;
 let avgLoss = losses/period;
 if(avgLoss === 0) return 100;
 let rs = avgGain/avgLoss;
 return 100 - (100/(1+rs));
}

function checkCandles(){
 let last5 = candleData.slice(-5);
 let up = 0, down = 0;
 for(let i=1; i<last5.length; i++){
   if(last5[i].close > last5[i].open) up++;
   else down++;
 }
 return {up, down, trend: up >= 4? 'UP' : down >= 4? 'DOWN' : 'SIDE'};
}

function generateSignal(){
 if(candleData.length < 50){
   alert('ڈیٹا لوڈ ہو رہا ہے، 5 سیکنڈ رکیں');
   fetchCandles();
   return;
 }

 document.getElementById('scanOverlay').style.display = 'flex';
 document.getElementById('genBtn').disabled = true;

 setTimeout(() => {
   document.getElementById('scanOverlay').style.display = 'none';

   let prices = candleData.map(c => c.close);
   let ema10 = calcEMA(prices, 10);
   let ema20 = calcEMA(prices, 20);
   let rsi = calcRSI(prices);
   let candles = checkCandles();
   let lastPrice = prices[prices.length-1];

   let signal = 'WAIT';
   let confirm = 0;
   let reason = '';

   // BUY کنفرمیشن: EMA UP + RSI < 40 + 4/5 UP کینڈل
   if(ema10 > ema20 && rsi < 40 && candles.trend === 'UP'){
     signal = 'BUY';
     confirm = 3;
     reason = 'EMA UP + RSI BUY ZONE + 4/5 UP CANDLE';
   }
   // SELL کنفرمیشن: EMA DOWN + RSI > 60 + 4/5 DOWN کینڈل
   else if(ema10 < ema20 && rsi > 60 && candles.trend === 'DOWN'){
     signal = 'SELL';
     confirm = 3;
     reason = 'EMA DOWN + RSI SELL ZONE + 4/5 DOWN CANDLE';
   }

   if(signal!== 'WAIT'){
     let card = document.getElementById('signalCard');
     card.className = 'signal-card ' + signal.toLowerCase();
     card.style.display = 'block';

     document.getElementById('signalType').textContent = signal;
     document.getElementById('entryPrice').textContent = lastPrice.toFixed(2);
     document.getElementById('confValue').textContent = '99%';
     document.getElementById('confFill').style.width = '99%';
     document.getElementById('sigReason').textContent = reason;
   } else {
     alert('ابھی سگنل نہیں ہے سر۔ 3/3 کنفرمیشن کا انتظار کریں۔');
   }

   document.getElementById('genBtn').disabled = false;
 }, 2000);
}

function startTimer(){
 if(scanTimer) clearInterval(scanTimer);
 timerCount = 60;

 scanTimer = setInterval(() => {
   timerCount--;
   document.getElementById('timer').textContent = timerCount;

   if(timerCount <= 0){
     timerCount = 60;
     fetchCandles();
   }
 }, 1000);
}

document.getElementById('password').addEventListener('keypress', function(e){
 if(e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
