<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ABU BAKAR TRADER - TIGER ELITE AI BOT</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

*{ margin:0; padding:0; box-sizing:border-box; font-family:'Rajdhani', sans-serif; }

body{
    background:#02060c; 
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
    color:#e2e8f0;
    overflow-x:hidden;
}

/* --- PREMIUM GLASS INTERFACE --- */
.bot-container{
    width:100%; max-width:440px;
    background: rgba(10, 15, 25, 0.85);
    border: 1px solid rgba(255, 170, 0, 0.3);
    border-radius: 28px; padding: 18px;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(255, 170, 0, 0.1);
    backdrop-filter: blur(15px);
    position:relative; display:none;
}

/* --- LOCK SCREEN (PREMIUM DARK) --- */
.lock-screen{
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:#02050a; display:flex; justify-content:center; align-items:center; z-index:9999;
}
.lock-box{
    width:90%; max-width:350px; background:#050d1a;
    border:1px solid #ffaa00; border-radius:22px; padding:25px; text-align:center;
    box-shadow: 0 0 30px rgba(255, 170, 0, 0.2);
}
.lock-title{ font-family:'Orbitron',sans-serif; font-size:20px; color:#ffaa00; margin-bottom:15px; font-weight:900; }
.lock-input{ width:100%; padding:12px; border:1px solid #444; border-radius:10px; background:#020710; color:#fff; text-align:center; margin-bottom:15px; outline:none; }
.lock-btn{ width:100%; padding:12px; border:none; border-radius:10px; background:#ffaa00; color:#000; font-weight:bold; cursor:pointer; }

/* --- HEADER --- */
.bot-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:12px; }
.brand-wrapper { display:flex; align-items:center; gap:12px; }
.avatar-ring{ width:54px; height:54px; border-radius:50%; border:2px solid #ffaa00; box-shadow:0 0 15px #ffaa00; overflow:hidden; }
.avatar-ring img{ width:100%; height:100%; object-fit:cover; }
.title-main{ font-family:'Orbitron', sans-serif; font-size:18px; font-weight:900; color:#fff; }
.title-sub{ font-size:11px; letter-spacing:2px; color:#ffaa00; font-weight:700; }

/* --- LIVE VIEWPORT --- */
.live-viewport{ background:rgba(0,0,0,0.4); border:1px solid rgba(255,170,0,0.2); border-radius:16px; padding:12px; margin-bottom:15px; }
.live-price{ font-family:'Orbitron',monospace; font-size:32px; font-weight:900; color:#00e676; text-shadow:0 0 15px #00e676; }

/* --- TRIGGER BUTTON --- */
.trigger-action-btn{
    width:100%; padding:14px; border:none; border-radius:14px;
    background:linear-gradient(135deg, #ffaa00, #ff5500); color:#000;
    font-family:'Orbitron', sans-serif; font-size:14px; font-weight:900;
    box-shadow:0 0 20px rgba(255, 85, 0, 0.4); cursor:pointer;
}

/* --- SIGNAL OUTPUT --- */
.signal-txt-output.buy{ color:#00e676; text-shadow:0 0 25px #00e676; }
.signal-txt-output.sell{ color:#ff3b3b; text-shadow:0 0 25px #ff3b3b; }

/* --- TELEMETRY --- */
.telemetry-matrix{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:15px; }
.matrix-node{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:8px 12px; font-size:12px; color:#fff; }
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <div class="lock-title">TIGER ELITE AI TERMINAL</div>
    <input type="password" id="terminalAccessKey" class="lock-input" placeholder="ENTER ACCESS KEY">
    <button class="lock-btn" onclick="unlockTerminalEngine()">CONNECT BOT</button>
  </div>
</div>

<div class="bot-container" id="botApp">
  </div>

<script>
// Aapka original JavaScript logic waisa ka waisa intact hai
function unlockTerminalEngine(){
    if(document.getElementById("terminalAccessKey").value === "bakar786"){
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("botApp").style.display = "block";
    }
}
</script>

</body>
</html>
