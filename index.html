<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAK AI SIGNAL X</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@500;900&display=swap" rel="stylesheet">

<style>

:root{
    --pink:#ff1493;
    --pink2:#ff4fd8;
    --dark:#050008;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    overflow-x:hidden;

    font-family:'Inter',sans-serif;

    background:
    radial-gradient(circle at top,
    rgba(255,20,147,.22),
    transparent 40%),

    radial-gradient(circle at bottom,
    rgba(255,0,120,.12),
    transparent 40%),

    linear-gradient(
    135deg,
    #050008,
    #140014,
    #1b001f
    );

    color:white;
}

.container{
    width:100%;
    max-width:430px;
}

.card{
    background:rgba(20,0,20,.92);

    border:1px solid rgba(255,20,147,.25);

    border-radius:30px;

    padding:25px 20px;

    backdrop-filter:blur(15px);

    box-shadow:
    0 0 35px rgba(255,20,147,.15),
    0 15px 35px rgba(0,0,0,.75);

    text-align:center;
}

.logo{
    font-size:60px;
    margin-bottom:10px;
}

.title{
    font-family:'Orbitron',sans-serif;

    font-size:24px;

    font-weight:900;

    letter-spacing:2px;

    margin-bottom:22px;

    background:linear-gradient(
    to right,
    #ff4fd8,
    #ff9ae8
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.badge{
    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:8px 15px;

    border-radius:40px;

    background:rgba(255,20,147,.10);

    border:1px solid rgba(255,20,147,.20);

    color:#ff80df;

    font-size:11px;

    font-weight:800;

    margin-bottom:18px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#ff4fd8;
    box-shadow:0 0 10px #ff4fd8;
}

.input,
select{

    width:100%;

    padding:16px;

    margin-bottom:18px;

    border:none;

    border-radius:18px;

    background:#100010;

    border:1px solid rgba(255,20,147,.18);

    color:white;

    font-size:15px;

    outline:none;
}

iframe{
    width:100%;

    height:240px;

    border:none;

    border-radius:20px;

    margin-bottom:18px;
}

.btn{

    width:100%;

    border:none;

    border-radius:18px;

    padding:18px;

    cursor:pointer;

    color:white;

    font-size:14px;

    font-weight:900;

    letter-spacing:1px;

    font-family:'Orbitron',sans-serif;

    background:linear-gradient(
    135deg,
    #ff1493,
    #ff4fd8,
    #ff8ae6
    );

    box-shadow:
    0 10px 25px rgba(255,20,147,.30);

    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.loader{

    width:100%;

    height:5px;

    border-radius:10px;

    background:#1a0018;

    overflow:hidden;

    margin-top:18px;

    display:none;
}

.fill{

    width:0%;

    height:100%;

    background:linear-gradient(
    to right,
    #ff1493,
    #ff80df
    );

    transition:2.5s linear;
}

.result{

    display:none;

    margin-top:22px;

    padding:22px;

    border-radius:22px;

    background:rgba(255,255,255,.03);

    border:1px solid rgba(255,20,147,.18);
}

.signal{

    font-family:'Orbitron',sans-serif;

    font-size:30px;

    font-weight:900;
}

.info{

    margin-top:10px;

    font-size:13px;

    font-weight:bold;
}

.strategy{

    margin-top:12px;

    font-size:10px;

    letter-spacing:2px;

    color:#aaa;
}

.note{

    margin-top:18px;

    font-size:11px;

    color:#999;

    line-height:1.5;
}

</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div class="card" id="loginBox">

<div class="logo">🇵🇰</div>

<div class="title">
PAK AI LOGIN
</div>

<input
type="password"
id="password"
class="input"
placeholder="ENTER ACCESS KEY">

<button
class="btn"
onclick="loginBot()">

ENTER SIGNAL BOT

</button>

</div>

<!-- MAIN BOT -->

<div id="mainBot" style="display:none;">

<div class="card">

<div class="badge">

<div class="dot"></div>

LIVE SIGNAL SCANNER

</div>

<div class="title">

PAK AI SIGNAL X

</div>

<select id="pair" onchange="updateChart()">

<option value="FX_IDC:USDBRL">
USD/BRL (OTC)
</option>

<option value="FX_IDC:USDMXN">
USD/MXN (OTC)
</option>

<option value="FX_IDC:USDINR">
USD/INR (OTC)
</option>

<option value="FX:EURUSD">
EUR/USD
</option>

<option value="FX:GBPUSD">
GBP/USD
</option>

<option value="CRYPTOCAP:BTC">
BITCOIN
</option>

</select>

<iframe
id="chart"
src="https://s.tradingview.com/widgetembed/?symbol=FX_IDC%3AUSDBRL&interval=1&theme=dark">
</iframe>

<button
class="btn"
onclick="generateSignal()"
id="scanBtn">

SCAN MARKET

</button>

<div class="loader" id="loader">
<div class="fill" id="fill"></div>
</div>

<div class="result" id="resultBox">

<div class="signal" id="signalText"></div>

<div class="info" id="accuracy"></div>

<div class="info" id="marketData"></div>

<div class="strategy" id="strategy"></div>

</div>

<div class="note">

AI demo signals using RSI + EMA logic.

</div>

</div>

</div>

</div>

<script>

function loginBot(){

    const pass =
    document.getElementById('password').value;

    if(pass === 'Pak786'){

        document.getElementById('loginBox')
        .style.display='none';

        document.getElementById('mainBot')
        .style.display='block';

    }else{

        alert('WRONG ACCESS KEY');

    }
}

function updateChart(){

    const pair =
    document.getElementById('pair')
    .value.replace(':','%3A');

    document.getElementById('chart').src =

    `https://s.tradingview.com/widgetembed/?symbol=${pair}&interval=1&theme=dark`;
}

function fakeRSI(){

    return Math.floor(Math.random()*100);
}

function fakeEMAFast(){

    return Math.random()*100;
}

function fakeEMASlow(){

    return Math.random()*100;
}

function generateSignal(){

    const loader =
    document.getElementById('loader');

    const fill =
    document.getElementById('fill');

    const btn =
    document.getElementById('scanBtn');

    const result =
    document.getElementById('resultBox');

    btn.disabled=true;

    btn.innerText='ANALYZING...';

    result.style.display='none';

    loader.style.display='block';

    fill.style.width='0%';

    setTimeout(()=>{

        fill.style.width='100%';

    },50);

    setTimeout(()=>{

        loader.style.display='none';

        btn.disabled=false;

        btn.innerText='SCAN MARKET';

        const rsi = fakeRSI();

        const emaFast = fakeEMAFast();

        const emaSlow = fakeEMASlow();

        let signal='WAIT';

        let color='#ffaa00';

        let strategy='NO CONFIRMATION';

        if(rsi < 35 && emaFast > emaSlow){

            signal='↑ CALL';

            color='#00ff9d';

            strategy='RSI OVERSOLD + EMA BULLISH';
        }

        else if(rsi > 65 && emaFast < emaSlow){

            signal='↓ PUT';

            color='#ff3131';

            strategy='RSI OVERBOUGHT + EMA BEARISH';
        }

        result.style.display='block';

        const signalText =
        document.getElementById('signalText');

        signalText.innerText=signal;

        signalText.style.color=color;

        document.getElementById('accuracy')
        .innerText=

        'CONFIDENCE: ' +

        (Math.random()*8+88).toFixed(1)

        + '%';

        document.getElementById('accuracy')
        .style.color=color;

        document.getElementById('marketData')
        .innerText=

        `RSI: ${rsi} | EMA FAST: ${emaFast.toFixed(2)} | EMA SLOW: ${emaSlow.toFixed(2)}`;

        document.getElementById('strategy')
        .innerText=strategy;

        result.style.borderColor=color;

    },2500);
}

</script>

</body>
</html>
