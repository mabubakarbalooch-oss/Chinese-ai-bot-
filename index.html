<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUBNA V10 - CRYPTO TRADING DASHBOARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--primary:#8B5CF6;--success:#22C55E;--danger:#EF4444;--light:#F8FAFC;--dark:#07070A;}
        body{background:var(--dark);color:var(--light);font-family:'Space Grotesk';overflow-x:hidden;height:100dvh;}
        #bg{position:fixed;inset:0;background:radial-gradient(600px at 50% -10%,rgba(139,92,246,0.2),transparent);z-index:-1;}
        
        /* Login Screen */
        .login-screen{width:100%;height:100dvh;display:grid;place-items:center;}
        .login-card{width:92%;max-width:380px;padding:32px;border-radius:28px;background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(139,92,246,0.3);}
        .logo{width:90px;height:90px;margin:0 auto 32px;border-radius:22px;background:linear-gradient(135deg,var(--primary),#FBBF24);display:grid;place-items:center;font-size:34px;font-weight:900;color:var(--dark);}
        .login-form{display:flex;flex-direction:column;gap:24px;}
        .form-group{display:flex;flex-direction:column;gap:8px;}
        .form-group label{color:#9CA3AF;font-size:14px;}
        .form-group input{padding:16px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--light);font-family:'Space Grotesk';font-size:16px;}
        .form-group input::placeholder{color:#9CA3AF;}
        .unlock-btn{padding:17px;border-radius:14px;font-weight:700;letter-spacing:2px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--primary),#FBBF24);color:var(--dark);box-shadow:0 8px 25px rgba(139,92,246,0.4);transition:transform 0.2s;}
        .unlock-btn:hover{transform:translateY(-2px);}
        .error-msg{color:var(--danger);font-size:12px;text-align:center;margin-top:-8px;}
        
        /* App Screen */
        .app-screen{display:none;width:100%;height:100dvh;overflow-y:auto;position:fixed;top:0;left:0;}
        .app-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:rgba(15,15,20,0.9);backdrop-filter:blur(15px);border-bottom:1px solid rgba(139,92,246,0.15);position:sticky;top:0;z-index:10;}
        .price-ticker{display:flex;gap:16px;font-family:'JetBrains Mono';font-size:12px;}
        .price-ticker span{color:#22C55E;}
        
        /* Home Screen */
        .home-screen{padding:24px;}
        .market-card{background:linear-gradient(145deg,rgba(255,255,255,0.07),rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:24px;margin-bottom:24px;}
        .market-card h4{font-size:16px;margin-bottom:12px;}
        .market-card p{font-size:14px;color:#9CA3AF;}
        
        /* Signal Box */
        .signal-box{width:100%;max-width:400px;background:linear-gradient(145deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));border:2px solid transparent;border-radius:28px;padding:28px;text-align:center;margin:0 auto 32px;transition:box-shadow 0.3s, border-color 0.3s;}
        .signal-box:hover{box-shadow:0 0 50px rgba(139,92,246,0.3);}
        .signal-box.buy{border-color:var(--success);}
        .signal-box.sell{border-color:var(--danger);}
        .signal-circle{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;font-size:42px;font-weight:900;}
        .signal-circle.buy{background:radial-gradient(circle,var(--success)15%,rgba(34,197,94,0.05));border:3px solid var(--success);color:var(--success);}
        .signal-circle.sell{background:radial-gradient(circle,var(--danger)15%,rgba(239,68,68,0.05));border:3px solid var(--danger);color:var(--danger);}
        .signal-circle.analyzing{background:rgba(139,92,246,0.15);border:3px dashed var(--primary);color:var(--primary);animation:spin 0.9s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
        
        /* Indicators Grid */
        .indicators-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:24px;}
        .indicator-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:16px;}
        .indicator-card h5{font-size:12px;color:#9CA3AF;margin-bottom:8px;}
        .indicator-card p{font-size:18px;font-family:'JetBrains Mono';font-weight:700;}
        
        /* Bottom Nav */
        .bottom-nav{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:92%;max-width:400px;background:rgba(15,15,20,0.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:28px;padding:16px;display:flex;justify-content:space-around;gap:8px;}
        .bottom-nav a{color:#9CA3AF;font-size:24px;text-decoration:none;transition:color 0.3s;}
        .bottom-nav a:hover{color:var(--primary);}
    </style>
</head>
<body>
    <div id="bg"></div>

    <!-- Login Screen -->
    <div class="login-screen">
        <div class="login-card">
            <div class="logo">L</div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="unlock-btn">LOGIN TO DASHBOARD</button>
                <div id="error-msg" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- App Screen -->
    <div class="app-screen">
        <div class="app-header">
            <h3>LUBNA V10</h3>
            <div class="price-ticker mono">
                BTC: <span>$25,000</span> | ETH: <span>$1,800</span>
            </div>
        </div>

        <div class="home-screen">
            <div class="market-card">
                <h4>MARKET OVERVIEW</h4>
                <p>TOTAL ASSETS: $123,456</p>
                <p>PROFIT/LOSS: +5.2%</p>
            </div>

            <div class="signal-box analyzing">
                <div class="signal-circle analyzing">🔍</div>
                <h3>ANALYZING MARKET...</h3>
                <div class="progress-analyze" style="display:none;">
                    <div class="progress-analyze-fill" style="width:0%;"></div>
                </div>
            </div>

            <div class="indicators-grid">
                <div class="indicator-card">
                    <h5>RSI</h5>
                    <p>52.3</p>
                </div>
                <div class="indicator-card">
                    <h5>MACD</h5>
                    <p>0.02</p>
                </div>
                <div class="indicator-card">
                    <h5>VOLUME</h5>
                    <p>HIGH</p>
                </div>
                <div class="indicator-card">
                    <h5>SMA</h5>
                    <p>200 EMA</p>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="#"><i class="bi bi-house"></i></a>
            <a href="#"><i class="bi bi-bar-chart-line"></i></a>
            <a href="#"><i class="bi bi-bell"></i></a>
            <a href="#"><i class="bi bi-person-circle"></i></a>
        </div>
    </div>

    <script>
        function unlock(e) {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("error-msg");
            const signalBox = document.querySelector(".signal-box");
            const progressFill = signalBox.querySelector(".progress-analyze-fill");

            errorMsg.textContent = "";
            signalBox.classList.remove("analyzing", "buy", "sell");
            progressFill.style.width = "0%";

            // Simulate analysis with progress bar
            signalBox.querySelector(".progress-analyze").style.display = "block";
            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                progressFill.style.width = progress + "%";
                if (progress >= 100) {
                    clearInterval(interval);
                    signalBox.querySelector(".progress-analyze").style.display = "none";

                    // Dummy credentials (replace with real check in production)
                    if (username === "admin" && password === "123456") {
                        signalBox.innerHTML = `
                            <div class="signal-circle buy">✓</div>
                            <h3>BUY SIGNAL: BTC/ETH</h3>
                            <p>Strong uptrend confirmed - Enter at $24,800</p>
                        `;
                        signalBox.classList.add("buy");
                        
                        // Show app screen after 2 seconds
                        setTimeout(() => {
                            document.querySelector(".login-screen").style.display = "none";
                            document.querySelector(".app-screen").style.display = "block";
                        }, 2000);
                    } else {
                        signalBox.innerHTML = `
                            <div class="signal-circle sell">✗</div>
                            <h3>INVALID CREDENTIALS</h3>
                            <p>Username or password incorrect. Try again.</p>
                        `;
                        signalBox.classList.add("sell");
                        errorMsg.textContent = "Incorrect username or password";
                    }
                }
            }, 500);
        }

        document.getElementById("loginForm").addEventListener("submit", unlock);
    </script>
</body>
</html>
