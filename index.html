.toggle::after{

}

#scanner{

.scan-line{

width:100%;
height:4px;
background:linear-gradient(90deg,transparent,#00ff88,transparent);
box-shadow:0 0 20px #00ff88;
animation:scan 1.5s linear infinite;

@keyframes scan{

#chartContainer{

.stats{

.stat{

<div class="header">

QX

<div id="mainBoard" class="container" style="display:none;">

<div class="header">

<div class="logo">

<div class="logo-icon">
QX

<div>

</div>

</div>

<div class="status">

</div>

0.0000
</div>

SELECT PAIR
</label>

<select id="assetSelect" onchange="changePair()">

<option value="BTCUSDT">BTC/USDT</option>
<option value="ETHUSDT">ETH/USDT</option>
<option value="BNBUSDT">BNB/USDT</option>
<option value="SOLUSDT">SOL/USDT</option>
<option value="XRPUSDT">XRP/USDT</option>

<option value="EURUSD-OTC">EUR/USD OTC</option>
<option value="GBPUSD-OTC">GBP/USD OTC</option>
<option value="USDJPY-OTC">USD/JPY OTC</option>

<option value="USDCAD-OTC">USD/CAD OTC</option>
<option value="USDINR-OTC">USD/INR OTC</option>
<option value="USDPKR-OTC">USD/PKR OTC</option>
<option value="USDMXN-OTC">USD/MXN OTC</option>
<option value="USDNGN-OTC">USD/NGN OTC</option>

</select>

<div class="pair-card">

BTC/USDT
</div>

</div>

⚡ GENERATE AI SIGNAL

<script>

let pair = 'BTCUSDT';
let signalActive = true;
let chart;
let liveCandles = [];

function login(){

let pass =
document.getElementById('password').value;

if(pass === 'Lubna786'){

document.getElementById('loginScreen')
.style.display='none';

document.getElementById('mainBoard')
.style.display='block';

startWebSocket();

}else{

alert('Wrong Password');

}

}

function changePair(){

pair =
document.getElementById('assetSelect').value;

document.getElementById('pairName')
.innerText = pair;

startWebSocket();

}

function toggleSignal(){

signalActive = !signalActive;

document.getElementById('toggleBtn')
.classList.toggle('active');

}

async function startWebSocket(){

if(window.ws){
window.ws.close();
}

liveCandles = [];

if(pair.includes('OTC')){

generateOTCData();

return;

}

let response = await fetch(
`https://api.binance.com/api/v3/klines?symbol=${pair}&interval=1m&limit=40`
);

let data = await response.json();

liveCandles = data.map((candle,index)=>({

x:index,

o:parseFloat(candle[1]),

h:parseFloat(candle[2]),

l:parseFloat(candle[3]),

c:parseFloat(candle[4])

}));

drawChart();

window.ws = new WebSocket(
`wss://stream.binance.com:9443/ws/${pair.toLowerCase()}@kline_1m`
);

window.ws.onmessage = function(event){

let msg = JSON.parse(event.data);

if(!msg.k) return;

let k = msg.k;

document.getElementById('livePrice')
.innerText =
parseFloat(k.c).toFixed(2);

let newCandle = {

x:liveCandles.length,

o:parseFloat(k.o),

h:parseFloat(k.h),

l:parseFloat(k.l),

c:parseFloat(k.c)

};

liveCandles[liveCandles.length - 1] = newCandle;

drawChart();

};

}

function generateOTCData(){

let price = 100 + Math.random()*50;

for(let i=0;i<40;i++){

let open = price;

let close =
open + (Math.random()-0.5)*2;

let high =
Math.max(open,close)+Math.random();

let low =
Math.min(open,close)-Math.random();

liveCandles.push({

x:i,
o:open,
h:high,
l:low,
c:close

});

price = close;

}

drawChart();

setInterval(()=>{

let last =
liveCandles[liveCandles.length-1];

let open = last.c;

let close =
open + (Math.random()-0.5)*2;

let high =
Math.max(open,close)+Math.random();

let low =
Math.min(open,close)-Math.random();

liveCandles.push({

x:liveCandles.length,
o:open,
h:high,
l:low,
c:close

});

if(liveCandles.length > 40){

liveCandles.shift();

}

document.getElementById('livePrice')
.innerText =
close.toFixed(2);

drawChart();

},2000);

}

function drawChart(){

const ctx =
document.getElementById('candleChart')
.getContext('2d');

if(chart){
chart.destroy();
}

chart = new Chart(ctx,{

type:'candlestick',

data:{
datasets:[{

label:pair,

data:liveCandles,

color:{
up:'#00ff88',
down:'#ff4d67',
unchanged:'#999'
}

}]
},

options:{

responsive:true,

maintainAspectRatio:false,

plugins:{
legend:{display:false}
},

scales:{

x:{
ticks:{color:'#777'},
grid:{color:'#1f2430'}
},

y:{
ticks:{color:'#777'},
grid:{color:'#1f2430'}
}

}

}

});

}

function calculateEMA(data,period){

let k = 2/(period+1);

let ema = [data[0]];

for(let i=1;i<data.length;i++){

ema.push(
data[i]*k +
ema[i-1]*(1-k)
);

}

return ema;

}

function calculateRSI(data,period=14){

if(data.length < period+1){
return 50;
}

let gains = 0;
let losses = 0;

for(let i=1;i<=period;i++){

let diff = data[i]-data[i-1];

if(diff >= 0){
gains += diff;
}else{
losses -= diff;
}

}

if(losses === 0){
return 100;
}

let rs = gains / losses;

return 100 - (100/(1+rs));

}

function generateSignal(){

if(!signalActive){

alert('Signal OFF');

return;

}

document.getElementById('scanner')
.style.display='block';

document.getElementById('signalBox')
.style.display='none';

setTimeout(()=>{

document.getElementById('scanner')
.style.display='none';

document.getElementById('signalBox')
.style.display='block';

let closes =
liveCandles.map(c=>c.c);

let rsi =
calculateRSI(closes);

let ema20 =
calculateEMA(closes,20);

let ema50 =
calculateEMA(closes,50);

let macd =
ema20[ema20.length-1] -
ema50[ema50.length-1];

let buyScore = 0;
let sellScore = 0;

if(rsi < 35){
buyScore += 3;
}

if(rsi > 65){
sellScore += 3;
}

if(macd > 0){
buyScore += 4;
}

if(macd < 0){
sellScore += 4;
}

let signalBox =
document.getElementById('signalBox');

if(buyScore > sellScore){

signalBox.innerHTML='📈 BUY';

signalBox.className='buy-style';

document.getElementById('trend')
.innerText='UP';

}else if(sellScore > buyScore){

signalBox.innerHTML='📉 SELL';

signalBox.className='sell-style';

document.getElementById('trend')
.innerText='DOWN';

}else{

signalBox.innerHTML='⏸ WAIT';

signalBox.className='wait-style';

document.getElementById('trend')
.innerText='SIDE';

}

document.getElementById('rsi')
.innerText=Math.floor(rsi);

document.getElementById('macd')
.innerText=
macd > 0 ? 'BULL' : 'BEAR';

document.getElementById('conf')
.innerText=
Math.floor(Math.random()*15+85)+'%';

},1200);

}

</script>
