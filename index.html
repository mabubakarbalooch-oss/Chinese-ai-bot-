<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ABU BAKAR TRADER - PINK BLACK AI BOT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Rajdhani', sans-serif;
}

body{
background:radial-gradient(circle at 50% 50%, #2a0a1a 0%, #0a0a0a 100%);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
perspective:1000px;
overflow:hidden;
color:#fff;
}

.scene{
width:100%;
max-width:400px;
height:700px;
position:relative;
transform-style:preserve-3d;
animation:float 6s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0px) rotateX(5deg);}
50%{transform:translateY(-20px) rotateX(-5deg);}
}

.phone-3d{
width:100%;
height:100%;
background:linear-gradient(135deg, 
  rgba(255,20,147,0.15) 0%, 
  rgba(0,0,0,0.6) 50%, 
  rgba(255,20,147,0.15) 100%);
border:1px solid rgba(255,20,147,0.6);
border-radius:50px;
padding:25px;
box-shadow:
 0 0 80px rgba(255,20,147,0.5),
 0 0 120px rgba(255,20,147,0.2),
  inset 0 0 30px rgba(255,20,147,0.2);
backdrop-filter:blur(25px);
transform-style:preserve-3d;
position:relative;
overflow:hidden;
}

.phone-3d::before{
content:'';
position:absolute;
top:-50%;
left:-50%;
width:200%;
height:200%;
background:conic-gradient(from 0deg, 
  transparent 0deg, 
  rgba(255,20,147,0.4) 90deg, 
  transparent 180deg, 
  rgba(255,20,147,0.4) 270deg, 
  transparent 360deg);
animation:rotate-holo 8s linear infinite;
pointer-events:none;
}

@keyframes rotate-holo{
100%{transform:rotate(360deg);}
}

.header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px;
position:relative;
z-index:2;
transform:translateZ(20px);
}
.logo-ring{
width:55px;
height:55px;
border-radius:50%;
border:3px solid #ff1493;
box-shadow:0 0 30px #ff1493, inset 0 0 20px #ff1493;
animation:pulse-glow 2s infinite alternate;
}
@keyframes pulse-glow{
from{box-shadow:0 0 20px #ff1493, inset 0 0 15px #ff1493;}
to{box-shadow:0 0 40px #ff1493, inset 0 0 25px #ff1493;}
}
.header-text h1{
font-family:'Orbitron',sans-serif;
font-size:16px;
font-weight:900;
background:linear-gradient(90deg, #ff1493, #ff69b4, #ff1493);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
letter-spacing:2px;
text-shadow:0 0 20px rgba(255,20,147,0.8);
}
.header-text p{
font-size:12px;
color:#ff69b4;
letter-spacing:3px;
}

.dropdowns{
display:flex;
gap:12px;
margin-bottom:18px;
position:relative;
z-index:2;
transform:translateZ(15px);
}
.dropdown{
flex:1;
background:rgba(30,0,20,0.5);
border:1px solid rgba(255,20,147,0.5);
border-radius:18px;
padding:14px;
color:#fff;
font-size:14px;
font-weight:600;
backdrop-filter:blur(15px);
box-shadow:inset 0 0 15px rgba(255,20,147,0.2);
}

.live-box{
background:rgba(0,0,0,0.8);
border:2px solid rgba(255,20,147,0.6);
border-radius:20px;
padding:18px;
margin-bottom:18px;
box-shadow:0 0 30px rgba(255,20,147,0.4) inset, 0 0 20px rgba(255,20,147,0.3);
position:relative;
z-index:2;
transform:translateZ(25px);
}
.price{
font-family:'Orbitron',sans-serif;
font-size:36px;
color:#ff1493;
text-shadow:0 0 25px #ff1493, 0 0 50px #ff1493;
margin-bottom:15px;
animation:glow-price 2s infinite alternate;
}
@keyframes glow-price{
from{text-shadow:0 0 20px #ff1493;}
to{text-shadow:0 0 35px #ff1493, 0 0 60px #ff1493;}
}

.chart-3d{
height:90px;
position:relative;
perspective:200px;
}
.candles-3d{
display:flex;
align-items:flex-end;
justify-content:space-around;
height:100%;
transform-style:preserve-3d;
transform:rotateX(20deg);
}
.candle-3d{
width:8px;
height:100%;
position:relative;
transform-style:preserve-3d;
}
.candle-face{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(180deg, currentColor, rgba(0,0,0,0.5));
border-radius:2px;
box-shadow:0 0 15px currentColor;
}
.candle-face.green{background:#ff69b4;color:#ff69b4;}
.candle-face.red{background:#8B0000;color:#8B0000;}

.analyzer-btn{
width:100%;
padding:18px;
background:linear-gradient(90deg, 
  rgba(255,20,147,0.2), 
  rgba(255,105,180,0.4), 
  rgba(255,20,147,0.2));
border:2px solid rgba(255,20,147,0.6);
border-radius:18px;
color:#fff;
font-family:'Orbitron',sans-serif;
font-size:14px;
font-weight:900;
letter-spacing:2px;
margin-bottom:18px;
cursor:pointer;
box-shadow:0 0 30px rgba(255,20,147,0.5);
position:relative;
z-index:2;
transform:translateZ(30px);
transition:all 0.3s;
}
.analyzer-btn:hover{
transform:translateZ(40px) scale(1.05);
box-shadow:0 0 50px rgba(255,20,147,0.8);
}

.result-box{
background:rgba(0,0,0,0.8);
border:3px solid #ff69b4;
border-radius:20px;
padding:20px;
text-align:center;
margin-bottom:18px;
box-shadow:0 0 40px rgba(255,105,180,0.6) inset;
position:relative;
z-index:2;
transform:translateZ(35px);
display:none;
}
.result-box h1{
font-family:'Orbitron',sans-serif;
font-size:50px;
color:#ff69b4;
text-shadow:0 0 30px #ff69b4, 0 0 60px #ff69b4;
animation:glow-huge 1.5s infinite alternate;
}
@keyframes glow-huge{
from{text-shadow:0 0 25px #ff69b4;}
to{text-shadow:0 0 40px #ff69b4, 0 0 80px #ff69b4;}
}

.particles{
position:absolute;
inset:0;
pointer-events:none;
z-index:1;
}
.particle{
position:absolute;
width:3px;
height:3px;
background:#ff1493;
border-radius:50%;
box-shadow:0 0 15px #ff1493;
animation:float-particle 10s infinite linear;
}
@keyframes float-particle{
0%{transform:translateY(100vh) translateX(0);}
100%{transform:translateY(-100vh) translateX(100px);}
}

.lock-screen{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:#0a0a0a;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}
.lock-box{
width:90%;
max-width:320px;
background:rgba(30,0,20,0.8);
border:2px solid rgba(255,20,147,0.5);
border-radius:30px;
padding:35px;
text-align:center;
backdrop-filter:blur(20px);
box-shadow:0 0 50px rgba(255,20,147,0.4);
}
.lock-input{
width:100%;
padding:15px;
border:1px solid rgba(255,20,147,0.5);
border-radius:15px;
background:rgba(0,0,0,0.5);
color:#fff;
text-align:center;
margin:15px 0;
outline:none;
}
.lock-btn{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:linear-gradient(90deg,#ff1493,#ff69b4);
color:#000;
font-weight:900;
cursor:pointer;
font-family:'Orbitron',sans-serif;
box-shadow:0 0 20px rgba(255,20,147,0.5);
}
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <h2 style="color:#ff1493;font-family:Orbitron;font-size:20px;">PINK BLACK ACCESS</h2>
    <input type="password" id="passInput" class="lock-input" placeholder="ENTER PASSWORD">
    <button class="lock-btn" onclick="unlock()">ACTIVATE BOT</button>
  </div>
</div>

<div class="scene" id="scene" style="display:none;">
  <div class="phone-3d">
    
    <div class="header">
      <div class="logo-ring"></div>
      <div class="header-text">
        <h1>ABU BAKAR TRADER</h1>
        <p>PINK BLACK EDITION</p>
      </div>
      <div style="font-size:28px;color:#ff1493;">⚙️</div>
    </div>

    <div class="dropdowns">
      <select class="dropdown">
        <option>USD/BRL OTC</option>
        <option>EUR/USD OTC</option>
      </select>
      <select class="dropdown">
        <option>1M (Stable)</option>
        <option>5M</option>
      </select>
    </div>

    <div class="live-box">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:12px;">
        <div style="color:#ff69b4;display:flex;align-items:center;gap:8px;">
          <div style="width:10px;height:10px;background:#ff69b4;border-radius:50%;box-shadow:0 0 15px #ff69b4;animation:pulse 1.5s infinite;"></div>
          LIVE MARKET
        </div>
        <div>USD/BRL OTC</div>
      </div>
      <div class="price" id="price">1.2476</div>
      <div class="chart-3d">
        <div class="candles-3d" id="candles3d"></div>
      </div>
    </div>

    <div style="background:rgba(30,0,20,0.5);border:1px solid rgba(255,20,147,0.5);border-radius:18px;padding:18px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;transform:translateZ(20px);">
      <div style="display:flex;align-items:center;gap:15px;">
        <div style="width:45px;height:45px;border:3px solid #ff1493;border-radius:50%;position:relative;">
          <div style="position:absolute;top:50%;left:50%;width:3px;height:20px;background:linear-gradient(to top,transparent,#ff1493);transform-origin:bottom;animation:spin 2s linear infinite;"></div>
        </div>
        <div>
          <h3 id="status" style="font-size:15px;">ANALYSIS COMPLETE</h3>
          <p style="font-size:12px;color:#8892b0;">Signal processed successfully.</p>
        </div>
      </div>
      <div style="width:55px;height:55px;border:3px dashed #ff1493;border-radius:50%;display:flex;justify-content:center;align-items:center;font-family:'Orbitron',sans-serif;font-size:20px;color:#ff1493;" id="timer">00</div>
    </div>

    <button class="analyzer-btn" onclick="getSignal()">⚡ ANALYZER MARKET (GET SIGNAL)</button>

    <div class="result-box" id="resultBox">
      <h4 style="font-size:13px;color:#8892b0;margin-bottom:10px;">ANALYSIS RESULT</h4>
      <h1 id="signal">BUY</h1>
      <p id="confidence" style="font-size:15px;color:#ff69b4;font-weight:700;">95% CONFIDENCE MATCH</p>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div style="background:rgba(30,0,20,0.5);border:1px solid rgba(255,20,147,0.5);border-radius:15px;padding:14px;">
        <div style="font-size:12px;color:#8892b0;">RSI (14)</div>
        <div style="font-size:16px;font-weight:700;color:#fff;" id="rsi">70</div>
      </div>
      <div style="background:rgba(30,0,20,0.5);border:1px solid rgba(255,20,147,0.5);border-radius:15px;padding:14px;">
        <div style="font-size:12px;color:#8892b0;">TREND</div>
        <div style="font-size:16px;font-weight:700;color:#ff69b4;text-shadow:0 0 10px #ff69b4;" id="trend">STRONG UP</div>
      </div>
    </div>

  </div>
</div>

<script>
let scanning=false;

function createParticles(){
  const container = document.getElementById('particles');
  for(let i=0; i<30; i++){
    let p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random()*100 + '%';
    p.style.animationDelay = Math.random()*10 + 's';
    p.style.animationDuration = (8+Math.random()*5) + 's';
    container.appendChild(p);
  }
}

function unlock(){
  if(document.getElementById('passInput').value==='bakar786'){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('scene').style.display='block';
    createParticles();
    generateCandles3D();
    updatePrice();
  }else{
    alert('Wrong Password');
  }
}

function generateCandles3D(){
  const container = document.getElementById('candles3d');
  container.innerHTML = '';
  
  for(let i=0; i<20; i++){
    let candle = document.createElement('div');
    candle.className = 'candle-3d';
    
    let isGreen = Math.random() > 0.5;
    let height = Math.random() * 50 + 30;
    let offset = Math.random() * 20;
    
    candle.innerHTML = `
      <div class="candle-face front ${isGreen?'green':'red'}" style="height:${height}px;top:${40-height/2+offset}px;"></div>
      <div class="candle-face back ${isGreen?'green':'red'}" style="height:${height}px;top:${40-height/2+offset}px;"></div>
      <div class="candle-face left ${isGreen?'green':'red'}" style="height:${height}px;top:${40-height/2+offset}px;"></div>
      <div class="candle-face right ${isGreen?'green':'red'}" style="height:${height}px;top:${40-height/2+offset}px;"></div>
    `;
    container.appendChild(candle);
  }
}

function updatePrice(){
  setInterval(()=>{
    let base=1.2476;
    let change=(Math.random()-0.5)*0.002;
    document.getElementById('price').innerText=(base+change).toFixed(4);
    
    if(Math.random() > 0.8){
      generateCandles3D();
    }
  },2000);
}

function getSignal(){
  if(scanning)return;
  scanning=true;
  document.getElementById('status').innerText='ANALYZING...';
  
  let sec=3;
  document.getElementById('timer').innerText='0'+sec;
  
  let timerInterval=setInterval(()=>{
    sec--;
    document.getElementById('timer').innerText='0'+sec;
    if(sec<=0){
      clearInterval(timerInterval);
      scanning=false;
      document.getElementById('status').innerText='ANALYSIS COMPLETE';
      document.getElementById('resultBox').style.display='block';
      generateCandles3D();
      
      let signal=Math.random()>0.5?'BUY':'SELL';
      let conf=Math.floor(Math.random()*5)+95;
      
      document.getElementById('signal').innerText=signal;
      document.getElementById('signal').style.color=signal==='BUY'?'#ff69b4':'#8B0000';
      document.getElementById('confidence').innerText=conf+'% CONFIDENCE MATCH';
    }
  },1000);
}
</script>
</body>
</html>
