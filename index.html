<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lubna Abubakar - Advanced Neural AI Analyzer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;500;700&display=swap');

        :root {
            --bg-deep: #050814;
            --neon-blue: #00f2fe;
            --neon-purple: #7928ca;
            --neon-green: #10b981;
            --neon-red: #ff0844;
            --glass-bg: rgba(10, 15, 30, 0.75);
            --glass-border: rgba(0, 242, 254, 0.3);
            --text-color: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 242, 254, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(121, 40, 202, 0.15) 0%, transparent 40%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .holo-card {
            width: 100%;
            max-width: 460px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 
                        inset 0 0 25px rgba(0, 242, 254, 0.05);
            position: relative;
            overflow: hidden;
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 15px;
        }

        .brand-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .brand-title span {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .live-badge {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .control-group {
            margin-bottom: 14px;
        }

        .control-group label {
            display: block;
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 5px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.5px;
        }

        select {
            width: 100%;
            background: rgba(10, 15, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        select:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .execute-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: #ffffff;
            border: none;
            padding: 15px;
            border-radius: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.3);
        }

        .execute-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 242, 254, 0.5);
        }

        /* Live Neural Analyzer Box */
        .analyzer-box {
            display: none;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 18px;
            padding: 16px;
        }

        .step-log {
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: var(--neon-blue);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        .step-log.active {
            opacity: 1;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.5);
        }

        .step-log.done {
            opacity: 0.7;
            color: var(--neon-green);
        }

        /* Final Output UI */
        .output-box {
            display: none;
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 18px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .signal-title {
            font-size: 10px;
            color: var(--text-dim);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        .signal-action {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            margin: 8px 0;
            letter-spacing: 2px;
        }

        .call-up {
            color: var(--neon-green);
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
        }

        .put-down {
            color: var(--neon-red);
            text-shadow: 0 0 20px rgba(255, 8, 68, 0.6);
        }

        .metrics-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 10px;
            text-align: center;
        }

        .metric-card span {
            display: block;
            font-size: 9px;
            color: var(--text-dim);
            margin-bottom: 2px;
        }

        .metric-card strong {
            font-size: 11px;
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body>

    <div class="holo-card">
        <div class="brand-header">
            <div class="brand-title">
                <h1>LUBNA ABUBAKAR</h1>
                <span>Neural AI Analyzer</span>
            </div>
            <div class="live-badge">ONLINE</div>
        </div>

        <div class="control-group">
            <label>Broker Engine</label>
            <select id="broker">
                <option value="Quotex">Quotex OTC Engine Pro</option>
            </select>
        </div>

        <div class="control-group">
            <label>Select Asset Pair</label>
            <select id="pair">
                <option value="GBP/CAD (OTC)">GBP/CAD (OTC)</option>
                <option value="GBP/CHF (OTC)">GBP/CHF (OTC)</option>
                <option value="USD/EGP (OTC)">USD/EGP (OTC)</option>
                <option value="USD/JPY (OTC)">USD/JPY (OTC)</option>
                <option value="NZD/CAD (OTC)">NZD/CAD (OTC)</option>
                <option value="USD/ARS (OTC)">USD/ARS (OTC)</option>
                <option value="AUD/CHF (OTC)">AUD/CHF (OTC)</option>
                <option value="CAD/CHF (OTC)">CAD/CHF (OTC)</option>
                <option value="NZD/CHF (OTC)">NZD/CHF (OTC)</option>
                <option value="AUD/NZD (OTC)">AUD/NZD (OTC)</option>
                <option value="USD/DZD (OTC)">USD/DZD (OTC)</option>
                <option value="AUD/CAD (OTC)">AUD/CAD (OTC)</option>
                <option value="USD/ZAR (OTC)">USD/ZAR (OTC)</option>
                <option value="USD/PHP (OTC)">USD/PHP (OTC)</option>
                <option value="EUR/NZD (OTC)">EUR/NZD (OTC)</option>
                <option value="USD/BDT (OTC)">USD/BDT (OTC)</option>
                <option value="USD/CHF (OTC)">USD/CHF (OTC)</option>
                <option value="USD/CAD (OTC)">USD/CAD (OTC)</option>
                <option value="USD/IDR (OTC)">USD/IDR (OTC)</option>
                <option value="USD/BRL (OTC)">USD/BRL (OTC)</option>
                <option value="EUR/AUD (OTC)">EUR/AUD (OTC)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Execution Expiry</label>
            <select id="timer">
                <option value="1 Minute">1 Minute Expiry</option>
                <option value="5 Seconds">5 Seconds Scalp</option>
                <option value="5 Minutes">5 Minutes Standard</option>
            </select>
        </div>

        <button class="execute-btn" id="scanBtn" onclick="startNeuralAnalysis()">Execute AI Scan</button>

        <div class="analyzer-box" id="analyzerBox">
            <div class="step-log" id="step1">[+] Connecting to Quotex OTC Feed...</div>
            <div class="step-log" id="step2">[+] Scanning Order Book & Liquidity Pools...</div>
            <div class="step-log" id="step3">[+] Calculating RSI, EMA & Bollinger Bands...</div>
            <div class="step-log" id="step4">[+] Running Deep Neural AI Matrix...</div>
        </div>

        <div class="output-box" id="outputBox">
            <div class="signal-title">AI SIGNAL RESULT</div>
            <div class="signal-action" id="signalText">--</div>

            <div class="metrics-row">
                <div class="metric-card">
                    <span>RSI Index</span>
                    <strong id="mRsi">--</strong>
                </div>
                <div class="metric-card">
                    <span>Market Trend</span>
                    <strong id="mTrend">--</strong>
                </div>
                <div class="metric-card">
                    <span>Accuracy</span>
                    <strong id="mAcc">--</strong>
                </div>
            </div>
        </div>
    </div>

    <script>
        function startNeuralAnalysis() {
            const scanBtn = document.getElementById('scanBtn');
            const analyzerBox = document.getElementById('analyzerBox');
            const outputBox = document.getElementById('outputBox');
            
            const s1 = document.getElementById('step1');
            const s2 = document.getElementById('step2');
            const s3 = document.getElementById('step3');
            const s4 = document.getElementById('step4');

            const signalText = document.getElementById('signalText');
            const mRsi = document.getElementById('mRsi');
            const mTrend = document.getElementById('mTrend');
            const mAcc = document.getElementById('mAcc');

            // Reset UI
            outputBox.style.display = 'none';
            analyzerBox.style.display = 'block';
            scanBtn.disabled = true;
            scanBtn.style.opacity = '0.5';

            // Clear previous states
            [s1, s2, s3, s4].forEach(el => {
                el.className = 'step-log';
            });

            // Step 1 Animation
            setTimeout(() => {
                s1.classList.add('active');
            }, 300);

            // Step 2 Animation
            setTimeout(() => {
                s1.classList.remove('active');
                s1.classList.add('done');
                s2.classList.add('active');
            }, 900);

            // Step 3 Animation
            setTimeout(() => {
                s2.classList.remove('active');
                s2.classList.add('done');
                s3.classList.add('active');
            }, 1500);

            // Step 4 Animation
            setTimeout(() => {
                s3.classList.remove('active');
                s3.classList.add('done');
                s4.classList.add('active');
            }, 2100);

            // Final Result Reveal
            setTimeout(() => {
                s4.classList.remove('active');
                s4.classList.add('done');
                
                analyzerBox.style.display = 'none';
                outputBox.style.display = 'block';
                scanBtn.disabled = false;
                scanBtn.style.opacity = '1';

                const isCall = Math.random() >= 0.5;

                if(isCall) {
                    signalText.className = 'signal-action call-up';
                    signalText.innerText = 'CALL (UP)';
                    mRsi.innerText = '62.5 (Bullish)';
                    mTrend.innerText = 'UPWARD';
                } else {
                    signalText.className = 'signal-action put-down';
                    signalText.innerText = 'PUT (DOWN)';
                    mRsi.innerText = '31.4 (Bearish)';
                    mTrend.innerText = 'DOWNWARD';
                }

                mAcc.innerText = (96.5 + Math.random() * 3.2).toFixed(1) + '%';

            }, 2800);
        }
    </script>
</body>
</html>
