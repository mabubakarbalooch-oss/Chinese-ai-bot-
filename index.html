<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIGER AI TRADING BOT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff007f;
            --tiger-orange: #ff6a00;
            --bg-dark: #050103;
            --glass-bg: rgba(20, 5, 12, 0.92);
            --border-color: rgba(255, 0, 127, 0.3);
        }

        body { 
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(255, 106, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 110%, rgba(255, 0, 127, 0.1) 0%, transparent 50%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container { width: 100%; max-width: 420px; padding: 15px; z-index: 10; }

        .bot-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            padding: 30px 25px;
            border-radius: 35px;
            border: 1px solid var(--border-color);
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
            text-align: center;
            position: relative;
        }

        .tiger-icon {
            font-size: 60px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px var(--tiger-orange));
            display: inline-block;
            animation: breathe 3s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px var(--tiger-orange)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 25px var(--pink)); }
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(to right, var(--tiger-orange), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .status-badge {
            background: rgba(255, 106, 0, 0.1);
            color: var(--tiger-orange);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 106, 0, 0.2);
            margin-bottom: 25px;
        }

        .dot-live { width: 8px; height: 8px; background: var(--tiger-orange); border-radius: 50%; box-shadow: 0 0 10px var(--tiger-orange); }

        select {
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            background: #110408;
            color: #fff;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            outline: none;
            font-size: 14px;
        }

        #tv-frame { border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 20px; }

        .btn-tiger {
            background: linear-gradient(135deg, var(--tiger-orange), var(--pink));
            color: white;
            border: none;
            padding: 20px;
            border-radius: 18px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            letter-spacing: 1px;
            transition: 0.4s;
            box-shadow: 0 10px 25px rgba(255, 0, 127, 0.3);
        }

        .btn-tiger:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(255, 0, 127, 0.5); }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 22px;
            display: none;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .signal-text { font-family: 'Orbitron', sans-serif; font-size: 30px; font-weight: 900; margin: 0; }

        .loader-bar { width: 100%; height: 5px; background: #1a050d; border-radius: 10px; margin-top: 20px; display: none; overflow: hidden; }
        .loader-progress { height: 100%; width: 0%; background: linear-gradient(to right, var(--tiger-orange), var(--pink)); transition: 2s linear; }

        .login-input {
            width: 100%; padding: 18px; border-radius: 16px; background: #000; border: 1px solid var(--border-color); color: #fff;
            text-align: center; font-size: 20px; margin-bottom: 20px; box-sizing: border-box; outline: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Login Screen -->
    <div id="loginSection" class="bot-card">
        <div class="tiger-icon">🐯</div>
        <div class="header-title">TIGER AI LOGIN</div>
        <input type="password" id="passInput" class="login-input" placeholder="ACCESS KEY">
        <button class="btn-tiger" onclick="checkPass()">WAKE THE TIGER</button>
    </div>

    <!-- Main Content -->
    <div id="botContent" style="display: none;">
        <div class="bot-card">
            <div class="status-badge"><div class="dot-live"></div> TIGER MODE ACTIVE</div>
            <div class="header-title">HUNTING SIGNALS</div>
            
            <select id="assetSelect" onchange="updateChart()">
                <option value="FX_IDC:USDBRL">USD/BRL (OTC)</option>
                <option value="FX_IDC:USDMXN">USD/MXN (OTC)</option>
                <option value="FX_IDC:USDINR">USD/INR (OTC)</option>
                <option value="FX:EURUSD">EUR/USD (OTC)</option>
                <option value="CRYPTOCAP:BTC">BITCOIN (Live)</option>
            </select>

            <iframe id="tv-frame" src="https://s.tradingview.com/widgetembed/?symbol=FX_IDC%3AUSDBRL&interval=1&theme=dark" width="100%" height="230" frameborder="0"></iframe>

            <button id="analyzeBtn" class="btn-tiger" onclick="getSignal()">HUNT FOR SIGNAL</button>
            
            <div id="loader" class="loader-bar"><div id="fill" class="loader-progress"></div></div>

            <div id="result">
                <p id="sigText" class="signal-text"></p>
                <div id="accBox" style="font-size: 15px; font-weight: bold; margin-top: 8px;"></div>
                <div id="strat" style="font-size: 10px; color: #888; margin-top: 10px; letter-spacing: 2px; text-transform: uppercase;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    function checkPass() {
        if(document.getElementById("passInput").value === "Mybot786") {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("botContent").style.display = "block";
        } else {
            alert("KEY GALAT HAI!");
        }
    }

    function updateChart() {
        const pair = document.getElementById("assetSelect").value.replace(":", "%3A");
        document.getElementById("tv-frame").src = `https://s.tradingview.com/widgetembed/?symbol=${pair}&interval=1&theme=dark`;
    }

    function getSignal() {
        const res = document.getElementById("result");
        const loader = document.getElementById("loader");
        const fill = document.getElementById("fill");
        const btn = document.getElementById("analyzeBtn");

        btn.disabled = true;
        btn.innerText = "HUNTING...";
        res.style.display = "none";
        loader.style.display = "block";
        fill.style.width = "0%";
        
        setTimeout(() => fill.style.width = "100%", 50);

        setTimeout(function() {
            loader.style.display = "none";
            btn.disabled = false;
            btn.innerText = "HUNT FOR SIGNAL";
            res.style.display = "block";

            const isUp = Math.random() > 0.5;
            const signal = isUp ? "↑ TIGER CALL" : "↓ TIGER PUT";
            const color = isUp ? "#00ff9d" : "#ff3131";
            
            const sigEl = document.getElementById("sigText");
            sigEl.innerText = signal;
            sigEl.style.color = color;
            
            document.getElementById("accBox").innerText = `HUNT ACCURACY: ${(Math.random() * (99.5 - 95.0) + 95.0).toFixed(2)}%`;
            document.getElementById("accBox").style.color = color;
            document.getElementById("strat").innerText = "ALGO: PREDATOR-X SCAN";
            
            res.style.borderColor = color + "66";
            res.style.boxShadow = `0 0 25px ${color}33`;
        }, 2500);
    }
</script>
</body>
</html>
