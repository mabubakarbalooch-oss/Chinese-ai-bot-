<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese AI Bot Pro v4.0 - Premium</title>
    <style>
        :root {
            --primary: #00d2ff; /* Cyan color for high-tech feel */
            --bg: #05070a;
            --card: #111418;
            --success: #00ff88;
            --danger: #ff3e3e;
            --accent: #7000ff;
        }

        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Inter', -apple-system, sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 480px; padding: 20px; }

        .bot-card {
            background: var(--card);
            padding: 25px;
            border-radius: 30px;
            border: 1px solid rgba(0, 210, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header-title {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .live-timer {
            font-family: monospace;
            color: var(--primary);
            font-size: 14px;
            margin-bottom: 15px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: #1a1e23;
            color: white;
            border: 1px solid #333;
            margin-bottom: 15px;
        }

        #tv-frame { border-radius: 12px; border: 1px solid #222; margin-bottom: 15px; }

        .btn-analyze {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .btn-analyze:disabled { opacity: 0.5; cursor: not-allowed; }

        #result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 20px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .signal-badge {
            font-size: 28px;
            font-weight: 800;
            display: block;
        }

        .loader-bar {
            width: 100%;
            height: 6px;
            background: #222;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            overflow: hidden;
        }

        .loader-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 3s cubic-bezier(0.1, 0.5, 0.5, 1);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Login system same as before -->
    <div id="loginSection" class="bot-card" style="margin-top: 50px;">
        <h2 style="color:var(--primary)">CHINESE SERVER V4.0</h2>
        <input type="password" id="passInput" placeholder="Enter Access Key..." style="width:90%; padding:15px; border-radius:10px; background:#222; border:1px solid #444; color:white; margin-bottom:15px;">
        <button class="btn-analyze" onclick="checkPass()">LOGIN SYSTEM</button>
    </div>

    <div id="botContent" style="display: none;">
        <div class="bot-card">
            <div class="header-title">AI SIGNAL GENERATOR</div>
            <div id="clock" class="live-timer">00:00:00</div>
            
            <select id="assetSelect" onchange="updateChart()">
                <option value="FX:EURUSD">EUR/USD (OTC)</option>
                <option value="FX:GBPUSD">GBP/USD (OTC)</option>
                <option value="CRYPTOCAP:BTC">BITCOIN (Live)</option>
                <option value="FX:USDJPY">USD/JPY</option>
            </select>

            <iframe id="tv-frame" src="https://s.tradingview.com/widgetembed/?symbol=FX%3AEURUSD&interval=1&theme=dark" width="100%" height="250" frameborder="0"></iframe>

            <button id="analyzeBtn" class="btn-analyze" onclick="getSignal()">ANALYZE MARKET NOW</button>
            
            <div id="loader" class="loader-bar"><div id="fill" class="loader-fill"></div></div>

            <div id="result">
                <span id="sigText" class="signal-badge"></span>
                <div id="accuracyText" style="font-size: 14px; margin-top: 5px; opacity: 0.8;"></div>
                <div style="font-size: 11px; margin-top: 10px; color: #888;">STRATEGY: RSI + BOLLINGER BANDS V4</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Live Clock Function
    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString();
    }, 1000);

    function checkPass() {
        if(document.getElementById("passInput").value === "Mybot786") {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("botContent").style.display = "block";
        }
    }

    function updateChart() {
        const pair = document.getElementById("assetSelect").value;
        document.getElementById("tv-frame").src = `https://s.tradingview.com/widgetembed/?symbol=${pair}&interval=1&theme=dark`;
    }

    function getSignal() {
        const res = document.getElementById("result");
        const loader = document.getElementById("loader");
        const fill = document.getElementById("fill");
        const btn = document.getElementById("analyzeBtn");

        btn.disabled = true;
        res.style.display = "none";
        loader.style.display = "block";
        fill.style.width = "0%";
        
        setTimeout(() => fill.style.width = "100%", 50);

        // Simulated Advanced Logic (RSI + Momentum)
        setTimeout(function() {
            loader.style.display = "none";
            btn.disabled = false;
            res.style.display = "block";

            // Logic: Yahan hum real market ki volatility simulate kar rahe hain
            const chance = Math.random() * 100;
            let signal = "";
            let color = "";
            let bg = "";

            if(chance > 52) {
                signal = "↑ CALL / BUY";
                color = "var(--success)";
                bg = "rgba(0, 255, 136, 0.1)";
            } else {
                signal = "↓ PUT / SELL";
                color = "var(--danger)";
                bg = "rgba(255, 62, 62, 0.1)";
            }

            const accuracy = (Math.random() * (96.5 - 88.2) + 88.2).toFixed(2);
            
            document.getElementById("sigText").innerText = signal;
            document.getElementById("sigText").style.color = color;
            document.getElementById("accuracyText").innerText = `AI CONFIDENCE: ${accuracy}%`;
            res.style.background = bg;
            res.style.border = `1px solid ${color}`;

        }, 3000); // 3 seconds for "Deep Analysis"
    }
</script>
</body>
</html>
