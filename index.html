<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI SIGNAL PRO - BINANCE + POCKET OPTION</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
body{background:#06110a;color:white;font-family:Arial;display:flex;justify-content:center;padding:10px}
.container{width:420px;background:#0b1d13;padding:15px;border-radius:20px;border:1px solid #00ff78}
h2{font-family:Orbitron;color:#00ff78;text-align:center}

select,input,button{
width:100%;padding:12px;margin:6px 0;border-radius:12px;border:1px solid #145c34;background:#102117;color:white}

button{
background:linear-gradient(135deg,#00ff78,#00cc66);
font-weight:bold;color:#04140a;cursor:pointer}

.box{margin-top:10px;padding:12px;border-radius:12px;background:#102117;border:1px solid #145c34}
.signal{font-size:28px;text-align:center;font-weight:bold;font-family:Orbitron}

.buy{color:#00ff78}
.sell{color:#ff4d4d}
.wait{color:#ffaa00}
</style>
</head>

<body>

<div class="container">

<h2>AI SIGNAL PRO</h2>

<label>Broker</label>
<select id="broker" onchange="changeBroker()">
<option value="binance">Binance</option>
<option value="pocket">Pocket Option</option>
<option value="quotex">Quotex</option>
</select>

<label>Asset</label>
<select id="asset"></select>

<button onclick="getSignal()">GET LIVE SIGNAL</button>

<div class="box">
<div id="price">Price: --</div>
<div id="rsi">RSI: --</div>
<div id="ema">EMA Trend: --</div>
</div>

<div class="box signal" id="signal">WAIT</div>

</div>

<script>

let binanceAssets = ["BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT","XRPUSDT"];
let pocketAssets = ["BTCUSD","ETHUSD","EURUSD","GBPUSD","USDJPY"];
let quotexAssets = ["BTCUSD","ETHUSD","US30","NAS100","EURUSD"];

function loadAssets(){
let broker=document.getElementById("broker").value;
let asset=document.getElementById("asset");
asset.innerHTML="";

let list = broker==="binance"?binanceAssets:
            broker==="pocket"?pocketAssets:
            quotexAssets;

list.forEach(a=>{
let opt=document.createElement("option");
opt.value=a;
opt.innerText=a;
asset.appendChild(opt);
});
}

loadAssets();

function changeBroker(){
loadAssets();
}

async function getPrice(symbol){
try{
let url;

if(symbol.includes("USDT")){
url=`https://data-api.binance.vision/api/v3/klines?symbol=${symbol}&interval=1m&limit=50`;
}else{
url=`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=50`;
}

let res=await fetch(url);
let data=await res.json();

return data;
}catch(e){return null}
}

function RSI(closes){
let gain=0,loss=0;
for(let i=1;i<14;i++){
let diff=closes[i]-closes[i-1];
if(diff>0)gain+=diff; else loss+=Math.abs(diff);
}
let rs=gain/(loss||1);
return 100-(100/(1+rs));
}

function EMA(data,period){
let k=2/(period+1);
let ema=[data[0]];
for(let i=1;i<data.length;i++){
ema.push(data[i]*k+ema[i-1]*(1-k));
}
return ema;
}

async function getSignal(){

let symbol=document.getElementById("asset").value;
let data=await getPrice(symbol);

if(!data){alert("API Error");return}

let closes=data.map(c=>parseFloat(c[4]));

let rsi=RSI(closes);
let ema9=EMA(closes,9);
let ema21=EMA(closes,21);

let trend=ema9.at(-1)>ema21.at(-1)?"UP":"DOWN";

document.getElementById("price").innerText="Price: "+closes.at(-1).toFixed(2);
document.getElementById("rsi").innerText="RSI: "+rsi.toFixed(2);
document.getElementById("ema").innerText="EMA Trend: "+trend;

let signalBox=document.getElementById("signal");

if(rsi<30 && trend==="UP"){
signalBox.innerText="BUY";
signalBox.className="signal buy";
}
else if(rsi>70 && trend==="DOWN"){
signalBox.innerText="SELL";
signalBox.className="signal sell";
}
else{
signalBox.innerText="WAIT";
signalBox.className="signal wait";
}

}

</script>

</body>
</html>
