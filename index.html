<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🇵🇰 PAK AI SIGNAL X - ULTRA 99%</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        :root{ --green:#00ff99; --red:#ff4444; --dark:#02140b; }
        body{ min-height:100vh; display:flex; justify-content:center; align-items:center; padding:15px; font-family:'Inter',sans-serif; background: radial-gradient(circle at top left, #003d1f, #02140b 70%); overflow-x:hidden; }
        .container{ width:100%; max-width:450px; position:relative; }
        .card{ background:rgba(0,20,10,0.96); backdrop-filter:blur(20px); border:1px solid rgba(0,255,153,0.3); border-radius:35px; padding:25px; box-shadow: 0 0 30px rgba(0,255,153,0.2); text-align:center; }
        .title{ font-family:'Orbitron',sans-serif; font-size:22px; font-weight:900; background: linear-gradient(135deg, #fff, #00ff99); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:15px; }
        
        /* Analysis Widget */
        #analysis-box { width:100%; height:130px; border-radius:20px; overflow:hidden; border:1px solid rgba(255,255,255,0.1); margin-bottom:15px; background: #000; }
        
        select{ width:100%; padding:15px; margin-bottom:15px; background:#04180d; border:1px solid #00ff99; border-radius:25px; color:white; font-size:14px; outline:none; }

        .btn{ width:100%; border:none; border-radius:40px; padding:18px; font-weight:900; font-family:'Orbitron',sans-serif; font-size:14px; background: linear-gradient(95deg, #008f4a, #00d26f); color:white; cursor:pointer; box-shadow: 0 5px 15px rgba(0,255,153,0.3); }
        
        .loader{ width:100%; height:6px; background:#062014; border-radius:10px; overflow:hidden; margin-top:15px; display:none; }
        .fill{ width:0%; height:100%; background:#00ff99; transition:3s linear; }

        /* Signal Box Style like Video */
        .result{ display:none; margin-top:20px; padding:25px; border-radius:30px; background:rgba(255,255,255,0.05); border:2px solid #00ff99; position:relative; animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from {transform: scale(0.8); opacity:0;} to {transform: scale(1); opacity:1;} }

        .signal-header { font-size: 10px; letter-spacing: 2px; color: #aaa; margin-bottom: 5px; font-weight: 800; }
        .signal-main { font-family:'Orbitron',sans-serif; font-size:32px; font-weight:900; margin-bottom:10px; }
        .accuracy-badge { display:inline-block; padding:5px 15px; border-radius:20px; background:#00ff99; color:#000; font-weight:900; font-size:12px; margin-bottom:10px; }
        .countdown { font-size: 12px; color: #ffaa44; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="loginBox">
            <div class="title" style="font-size:40px;">🇵🇰</div>
            <div class="title">PAK AI SIGNAL X</div>
            <input type="password" id="password" style="width:100%; padding:15px; margin-bottom:15px; border-radius:20px; background:#04180d; color:white; border:1px solid #00ff99;" placeholder="PASSWORD: Pak786">
            <button class="btn" onclick="loginBot()">ACTIVATE 99% AI</button>
        </div>

        <div class="card" id="mainBot" style="display:none;">
            <div id="clock" style="color:#00ff99; margin-bottom:10px; font-weight:bold;">🕒 00:00:00</div>
            <div class="title">ULTRA AI ENGINE</div>
            
            <select id="pair" onchange="updateMarket()">
                <option value="USDBRL">🇧🇷 USD/BRL (OTC) - 99%</option>
                <option value="USDMXN">🇲🇽 USD/MXN (OTC) - 98%</option>
                <option value="USDINR">🇮🇳 USD/INR - 97%</option>
                <option value="EURUSD">🇪🇺 EUR/USD - 99%</option>
            </select>

            <div id="analysis-box">
                <div class="tradingview-widget-container__widget"></div>
            </div>

            <button id="scanBtn" class="btn" onclick="startUltraScan()">⚡ START 99% ANALYSIS</button>
            
            <div class="loader" id="loader"><div class="fill" id="fill"></div></div>

            <div class="result" id="resultBox">
                <div class="signal-header">SIGNAL ALERT</div>
                <div class="signal-main" id="signalText">---</div>
                <div class="accuracy-badge" id="accLabel">99% ACCURACY</div>
                <div id="strategy" style="font-size:11px; color:#fff;">SCANNING MARKET...</div>
                <div class="countdown" id="timer">PREPARING ENTRY...</div>
            </div>
        </div>
    </div>

    <script>
        function loginBot(){
            if(document.getElementById('password').value === 'Pak786'){
                document.getElementById('loginBox').style.display='none';
                document.getElementById('mainBot').style.display='block';
                updateMarket();
            } else { alert('Incorrect Key'); }
        }

        setInterval(() => {
            document.getElementById('clock').innerHTML = "🕒 " + new Date().toLocaleTimeString();
        }, 1000);

        function updateMarket(){
            const pair = document.getElementById('pair').value;
            const widget = document.querySelector('.tradingview-widget-container__widget');
            widget.innerHTML = '';
            const script = document.createElement('script');
            script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js';
            script.async = true;
            script.text = JSON.stringify({
                "interval": "1m", "width": "100%", "isTransparent": true, "height": "100%",
                "symbol": `FX_IDC:${pair}`, "showIntervalTabs": false, "locale": "en", "colorTheme": "dark"
            });
            widget.appendChild(script);
        }

        function startUltraScan(){
            const btn = document.getElementById('scanBtn');
            const loader = document.getElementById('loader');
            const fill = document.getElementById('fill');
            const result = document.getElementById('resultBox');

            btn.disabled = true;
            btn.innerText = '📡 AI CONVERGENCE ACTIVE...';
            result.style.display = 'none';
            loader.style.display = 'block';
            fill.style.width = '0%';

            setTimeout(() => { fill.style.width = '100%'; }, 100);

            setTimeout(() => {
                // High Probability Logic Simulation
                const isCall = Math.random() > 0.5;
                const acc = (98 + Math.random() * 1.9).toFixed(2); // Always 98-99.9%
                
                loader.style.display = 'none';
                btn.disabled = false;
                btn.innerText = '⚡ START 99% ANALYSIS';
                result.style.display = 'block';
                
                const sig = document.getElementById('signalText');
                const box = document.getElementById('resultBox');
                const strat = document.getElementById('strategy');
                
                if(isCall){
                    sig.innerText = "UP (CALL)";
                    sig.style.color = "#00ff99";
                    box.style.borderColor = "#00ff99";
                    strat.innerText = "INDICATORS: RSI OVERSOLD + MACD CROSSOVER";
                } else {
                    sig.innerText = "DOWN (PUT)";
                    sig.style.color = "#ff4444";
                    box.style.borderColor = "#ff4444";
                    strat.innerText = "INDICATORS: RSI OVERBOUGHT + BEARISH ENGULFING";
                }

                document.getElementById('accLabel').innerText = `${acc}% ACCURACY`;

                // Countdown Timer like the video
                let timeLeft = 5;
                const timer = document.getElementById('timer');
                const interval = setInterval(() => {
                    timer.innerText = `PLACE TRADE IN: ${timeLeft}s`;
                    timeLeft--;
                    if(timeLeft < 0) {
                        clearInterval(interval);
                        timer.innerText = "✅ ENTER TRADE NOW!";
                        timer.style.color = "#00ff99";
                    }
                }, 1000);

            }, 3000);
        }
    </script>
</body>
</html>
