<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA ABUBAKAR SIGNAL PRO - LIVE</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#06110a;
--card:rgba(8,25,15,0.92);
--primary:#00ff78;
--primary2:#00cc66;
--green:#00ff78;
--red:#ff4d4d;
--text:#ffffff;
--muted:#7dffb2;
--border:rgba(0,255,120,0.12);
--blue:#00d4ff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:radial-gradient(circle at top right,#0d2e1c 0%,#06110a 60%);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:18px;
overflow:hidden;
color:var(--text);
}

.bg-glow{
position:absolute;
width:500px;
height:500px;
background:rgba(0,255,120,0.08);
filter:blur(130px);
top:-120px;
right:-100px;
animation:moveGlow 6s infinite alternate;
}

@keyframes moveGlow{
0%{transform:translate(0,0);}
100%{transform:translate(-80px,70px);}
}

.container{
position:relative;
width:100%;
max-width:430px;
background:var(--card);
backdrop-filter:blur(18px);
border:1px solid var(--border);
border-radius:34px;
padding:22px;
box-shadow:0 0 40px rgba(0,0,0,0.7),
0 0 30px rgba(0,255,120,0.08);
overflow:hidden;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:22px;
}

.profile-wrap{
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:60px;
height:60px;
border-radius:50%;
background:linear-gradient(135deg,#00ff78,#00cc66);
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:900;
font-family:'Orbitron',sans-serif;
color:#04140a;
box-shadow:0 0 20px rgba(0,255,120,0.5);
}

.profile-wrap h1{
font-family:'Orbitron',sans-serif;
font-size:15px;
line-height:1.4;
}

.profile-wrap p{
font-size:11px;
color:var(--muted);
margin-top:3px;
}

.live{
padding:7px 12px;
border-radius:30px;
background:rgba(0,255,120,0.08);
border:1px solid rgba(0,255,120,0.2);
font-size:11px;
color:var(--primary);
font-weight:700;
}

#mainBoard{
display:none;
}

.label{
display:block;
margin-bottom:8px;
font-size:12px;
color:#9fffc7;
font-weight:600;
}

input,select{
width:100%;
padding:16px;
border-radius:18px;
border:1px solid #145c34;
background:#0b1d13;
color:#fff;
outline:none;
font-size:14px;
margin-bottom:16px;
}

.time-box{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:18px;
}

.time-btn{
padding:13px;
background:#0f2217;
border:1px solid #145c34;
border-radius:16px;
text-align:center;
font-size:13px;
font-weight:600;
color:#7dffb2;
cursor:pointer;
transition:0.3s;
}

.time-btn.active{
background:linear-gradient(
135deg,
rgba(0,255,120,0.18),
rgba(0,204,102,0.12)
);
border-color:var(--primary);
color:var(--primary);
box-shadow:0 0 15px rgba(0,255,120,0.2);
}

.btn{
width:100%;
padding:18px;
border:none;
border-radius:22px;
background:linear-gradient(
135deg,
var(--primary),
var(--primary2)
);
font-family:'Orbitron',sans-serif;
font-weight:800;
font-size:15px;
color:#04140a;
cursor:pointer;
}

#scanner{
margin-top:22px;
height:190px;
border-radius:26px;
background:#0b1d13;
border:1px solid #145c34;
position:relative;
overflow:hidden;
display:none;
}

.scan-line{
position:absolute;
width:100%;
height:5px;
background:linear-gradient(
90deg,
transparent,
var(--primary),
transparent
);
box-shadow:0 0 25px var(--primary);
animation:scan 1.4s linear infinite;
z-index:10;
}

@keyframes scan{
0%{top:-5%;}
100%{top:105%;}
}

.chart{
position:absolute;
bottom:16px;
left:16px;
right:16px;
display:flex;
align-items:flex-end;
gap:8px;
height:100px;
}

.candle{
width:15px;
border-radius:6px 6px 0 0;
position:relative;
}

.candle::before{
content:'';
position:absolute;
left:50%;
top:-15px;
width:2px;
height:15px;
transform:translateX(-50%);
background:inherit;
}

.candle::after{
content:'';
position:absolute;
left:50%;
bottom:-15px;
width:2px;
height:15px;
transform:translateX(-50%);
background:inherit;
}

.green{background:#00ff78;}
.red{background:#ff4d4d;}

#signalBox{
margin-top:22px;
padding:24px;
border-radius:28px;
text-align:center;
font-size:32px;
font-family:'Orbitron',sans-serif;
font-weight:900;
display:none;
}

.buy-style{
background:rgba(0,255,120,0.08);
border:1px solid rgba(0,255,120,0.40);
color:#00ff78;
}

.sell-style{
background:rgba(255,77,77,0.08);
border:1px solid rgba(255,77,77,0.40);
color:#ff4d4d;
}

.wait-style{
background:rgba(255,170,0,0.08);
border:1px solid rgba(255,170,0,0.40);
color:#ffaa00;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:18px;
}

.stat{
background:#102117;
border:1px solid #145c34;
border-radius:22px;
padding:14px;
text-align:center;
}

.stat h3{
font-size:10px;
color:#7dffb2;
margin-bottom:6px;
}

.stat p{
font-size:16px;
font-weight:700;
}

.market-status{
margin-top:16px;
padding:14px;
border-radius:18px;
background:#102117;
border:1px solid #145c34;
text-align:center;
font-size:13px;
font-weight:700;
color:#7dffb2;
}

.footer{
margin-top:18px;
text-align:center;
font-size:11px;
color:#6dffad;
}

.price-display{
margin-top:12px;
padding:16px;
border-radius:18px;
background:#0b1d13;
border:1px solid #145c34;
text-align:center;
}

.price-display .value{
font-size:28px;
font-weight:900;
font-family:'Orbitron',sans-serif;
color:var(--primary);
}

.api-badge{
position:absolute;
top:12px;
right:12px;
padding:4px 10px;
border-radius:20px;
font-size:9px;
font-weight:700;
display:none;
}

.api-badge.online{
background:rgba(0,255,120,0.15);
border:1px solid rgba(0,255,120,0.3);
color:#00ff78;
}

.api-badge.offline{
background:rgba(255,77,77,0.15);
border:1px solid rgba(255,77,77,0.3);
color:#ff4d4d;
}
</style>
</head>

<body>

<div class="bg-glow"></div>

<!-- LOGIN -->

<div id="loginScreen" class="container">

<div class="header">

<div class="profile-wrap">
<div class="logo">QX</div>

<div>
<h1>LUBNA ABUBAKAR</h1>
<p>ELITE ACCESS SYSTEM</p>
</div>

</div>

<div class="live">● SAFE</div>

</div>

<label class="label">PASSWORD</label>

<input type="password" id="password" placeholder="Enter Password">

<button class="btn" onclick="login()">
🔓 UNLOCK SYSTEM
</button>

</div>

<!-- MAIN -->

<div id="mainBoard" class="container">

<div class="api-badge" id="apiBadge">
BINANCE LIVE
</div>

<div class="header">

<div class="profile-wrap">

<div class="logo">QX</div>

<div>
<h1>LUBNA ABUBAKAR</h1>
<p>ULTRA AI SIGNAL</p>
</div>

</div>

<div class="live">● LIVE</div>

</div>

<div class="price-display">

<div class="label">LIVE PRICE</div>

<div class="value" id="livePrice">
Loading...
</div>

<div id="priceChange">--</div>

</div>

<label class="label">BROKER</label>

<select>
<option>Pocket Option</option>
<option>Quotex</option>
</select>

<label class="label">ASSET</label>

<select id="assetSelect" onchange="changeAsset()">
<option value="BTCUSDT">BTC/USDT</option>
<option value="ETHUSDT">ETH/USDT</option>
<option value="BNBUSDT">BNB/USDT</option>
<option value="SOLUSDT">SOL/USDT</option>
<option value="XRPUSDT">XRP/USDT</option>
<option value="DOGEUSDT">DOGE/USDT</option>
</select>

<div class="time-box">

<div class="time-btn active" onclick="setActive(this)">
15s
</div>

<div class="time-btn" onclick="setActive(this)">
30s
</div>

<div class="time-btn" onclick="setActive(this)">
1m
</div>

<div class="time-btn" onclick="setActive(this)">
5m
</div>

</div>

<button class="btn" id="genBtn" onclick="generateSignal()">
⚡ GENERATE AI SIGNAL
</button>

<div id="scanner">

<div class="scan-line"></div>

<div class="chart"></div>

</div>

<div id="signalBox">
BUY
</div>

<div class="stats">

<div class="stat">
<h3>RSI</h3>
<p id="rsiVal">--</p>
</div>

<div class="stat">
<h3>TREND</h3>
<p id="trend">--</p>
</div>

<div class="stat">
<h3>CONF</h3>
<p id="conf">--</p>
</div>

<div class="stat">
<h3>MACD</h3>
<p id="macd">--</p>
</div>

</div>

<div class="market-status" id="marketStatus">
MARKET WAITING...
</div>

<div class="footer">
POWERED BY ABUBAKAR AI ENGINE
</div>

</div>

<script>

let pair='BTCUSDT';
let wsConnection=null;
let currentPrice=0;

const BINANCE_API='https://data-api.binance.vision/api/v3';

function login(){

let pass=document.getElementById('password').value;

if(pass==='Lubna786'){

document.getElementById('loginScreen').style.display='none';

document.getElementById('mainBoard').style.display='block';

connectBinance();

}else{

alert('Wrong Password');

}

}

function setActive(el){

document.querySelectorAll('.time-btn')
.forEach(btn=>btn.classList.remove('active'));

el.classList.add('active');

}

function changeAsset(){

pair=document.getElementById('assetSelect').value;

connectWebSocket();

fetchLivePrice();

}

function showApiStatus(online){

const badge=document.getElementById('apiBadge');

badge.style.display='block';

if(online){

badge.className='api-badge online';
badge.innerHTML='● BINANCE LIVE';

}else{

badge.className='api-badge offline';
badge.innerHTML='● OFFLINE';

}

}

function connectBinance(){

fetchLivePrice();

connectWebSocket();

setInterval(fetchLivePrice,30000);

}

async function fetchLivePrice(){

try{

let response=await fetch(
`${BINANCE_API}/ticker/24hr?symbol=${pair}`
);

let data=await response.json();

currentPrice=parseFloat(data.lastPrice);

let change=parseFloat(data.priceChangePercent);

document.getElementById('livePrice').innerHTML=
currentPrice.toFixed(2);

document.getElementById('priceChange').innerHTML=
change.toFixed(2)+'%';

document.getElementById('priceChange').style.color=
change>=0 ? '#00ff78' : '#ff4d4d';

showApiStatus(true);

}catch(error){

showApiStatus(false);

}

}

function connectWebSocket(){

if(wsConnection) wsConnection.close();

const wsUrl=
`wss://data-stream.binance.vision/ws/${pair.toLowerCase()}@trade`;

wsConnection=new WebSocket(wsUrl);

wsConnection.onmessage=function(event){

const data=JSON.parse(event.data);

currentPrice=parseFloat(data.p);

document.getElementById('livePrice').innerHTML=
currentPrice.toFixed(2);

};

}

function randomCandles(){

let chart=document.querySelector('.chart');

chart.innerHTML='';

for(let i=0;i<11;i++){

let candle=document.createElement('div');

let height=Math.floor(Math.random()*75)+20;

candle.classList.add('candle');

candle.classList.add(
Math.random()>0.5 ? 'green' : 'red'
);

candle.style.height=height+'px';

chart.appendChild(candle);

}

}

function generateSignal(){

let scanner=document.getElementById('scanner');

let signalBox=document.getElementById('signalBox');

let marketStatus=document.getElementById('marketStatus');

scanner.style.display='block';

signalBox.style.display='none';

randomCandles();

setTimeout(()=>{

scanner.style.display='none';

signalBox.style.display='block';

let signals=['📈 BUY','📉 SELL','⏸ WAIT'];

let randomSignal=
signals[Math.floor(Math.random()*signals.length)];

signalBox.innerHTML=randomSignal;

if(randomSignal.includes('BUY')){

signalBox.className='buy-style';

marketStatus.innerHTML='🟢 BULLISH SIGNAL';

document.getElementById('trend').innerHTML='UP';

document.getElementById('macd').innerHTML='🟢';

}else if(randomSignal.includes('SELL')){

signalBox.className='sell-style';

marketStatus.innerHTML='🔴 BEARISH SIGNAL';

document.getElementById('trend').innerHTML='DOWN';

document.getElementById('macd').innerHTML='🔴';

}else{

signalBox.className='wait-style';

marketStatus.innerHTML='🟡 WAIT';

document.getElementById('trend').innerHTML='SIDE';

document.getElementById('macd').innerHTML='⚪';

}

document.getElementById('rsiVal').innerHTML=
Math.floor(Math.random()*100);

document.getElementById('conf').innerHTML=
Math.floor(Math.random()*40+60)+'%';

},1500);

}

</script>

</body>
</html>
