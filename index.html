<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA ABUBAKAR SIGNAL PRO</title>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>
body{margin:0;background:#0a0a0f;color:#fff;font-family:Arial;}
.container{max-width:420px;margin:auto;padding:10px;}

h3{text-align:center;}

#chart{height:240px;background:#111;border-radius:12px;}

select,input,button{
width:100%;padding:12px;margin-top:10px;border-radius:10px;border:0;
}

button{background:#00ff78;font-weight:bold;}

.box{
margin-top:10px;padding:15px;text-align:center;
font-size:26px;font-weight:bold;border-radius:10px;
}

.buy{color:#00ff78;background:rgba(0,255,120,0.1);}
.sell{color:#ff4d4d;background:rgba(255,77,77,0.1);}
.wait{color:#aaa;background:rgba(255,255,255,0.05);}

.small{text-align:center;font-size:12px;opacity:0.8;margin-top:5px;}

.row{display:flex;gap:5px;}
.row button{flex:1;}
</style>
</head>

<body>

<div class="container">

<h3>🔥 LUBNA ABUBAKAR ULTRA PRO</h3>

<input type="password" id="pass" placeholder="Password">
<button onclick="login()">UNLOCK</button>

<div class="row">
<button onclick="setPair('btcusdt')">BTC</button>
<button onclick="setPair('ethusdt')">ETH</button>
<button onclick="setPair('bnbusdt')">BNB</button>
</div>

<div id="chart"></div>

<button onclick="start()">START ULTRA LIVE</button>

<div id="signal" class="box wait">WAIT...</div>
<div class="small" id="info">RSI -- | MACD -- | SCORE --</div>

</div>

<script>

let ws, chart, series;
let pair="btcusdt";
let closes=[];

function login(){
if(document.getElementById("pass").value==="Lubna786"){
alert("Unlocked");
}else alert("Wrong Password");
}

function setPair(p){
pair=p;
closes=[];
start();
}

/* CHART */
function initChart(){
let el=document.getElementById("chart");
el.innerHTML="";

chart=LightweightCharts.createChart(el,{
width:el.clientWidth,
height:240,
layout:{background:{color:"#111"},textColor:"#ccc"},
grid:{vertLines:{color:"#222"},horzLines:{color:"#222"}}
});

series=chart.addCandlestickSeries();
}

/* RSI */
function RSI(data,p=14){
let g=0,l=0;
for(let i=1;i<p;i++){
let d=data[i]-data[i-1];
if(d>0)g+=d; else l+=Math.abs(d);
}
g/=p;l/=p;

for(let i=p;i<data.length;i++){
let d=data[i]-data[i-1];
let gain=d>0?d:0;
let loss=d<0?Math.abs(d):0;
g=(g*(p-1)+gain)/p;
l=(l*(p-1)+loss)/p;
}
if(l===0) return 100;
let rs=g/l;
return 100-(100/(1+rs));
}

/* MACD */
function MACD(data){
function EMA(arr,p){
let k=2/(p+1),e=[arr[0]];
for(let i=1;i<arr.length;i++)
e.push(arr[i]*k+e[i-1]*(1-k));
return e;
}

let e12=EMA(data,12);
let e26=EMA(data,26);

let macd=e12.map((v,i)=>v-e26[i]);
let signal=EMA(macd,9);

return macd[macd.length-1]-signal[signal.length-1];
}

/* LIVE */
function start(){

if(ws) ws.close();
initChart();

ws=new WebSocket(`wss://stream.binance.com:9443/ws/${pair}@kline_1m`);

ws.onmessage=(e)=>{

let k=JSON.parse(e.data).k;

let c={
time:k.t/1000,
open:+k.o,
high:+k.h,
low:+k.l,
close:+k.c
};

series.update(c);

closes.push(c.close);
if(closes.length>60) closes.shift();

if(closes.length<20) return;

let rsi=RSI(closes);
let macd=MACD(closes);

let score=0;

if(rsi<35) score+=3;
if(rsi>65) score-=3;

if(macd>0) score+=2;
if(macd<0) score-=2;

if(c.close>c.open) score+=1;
else score-=1;

let box=document.getElementById("signal");
let info=document.getElementById("info");

let conf=Math.min(100,Math.abs(score)*20);

if(score>=3){
box.innerHTML="📈 BUY";
box.className="box buy";
play();
}
else if(score<=-3){
box.innerHTML="📉 SELL";
box.className="box sell";
play();
}
else{
box.innerHTML="⏸ WAIT";
box.className="box wait";
}

info.innerHTML=`RSI: ${rsi.toFixed(1)} | MACD: ${macd.toFixed(4)} | SCORE: ${score} | CONF: ${conf}%`;
};

}

/* SOUND */
function play(){
let a=new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3");
a.play();
}

window.addEventListener("resize",()=>{
if(chart){
chart.applyOptions({width:document.getElementById("chart").clientWidth});
}
});

</script>

</body>
</html>
