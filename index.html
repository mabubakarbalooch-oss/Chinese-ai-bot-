<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>🇵🇰 PAK PRO SIGNAL BOT</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Inter',sans-serif;

background:
radial-gradient(circle at top left,#01361b,#02140b 70%);

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:15px;

overflow-x:hidden;
}

.container{
width:100%;
max-width:460px;
}

.card{

background:rgba(0,18,9,0.96);

border:1px solid rgba(0,255,153,0.25);

border-radius:30px;

padding:22px;

box-shadow:
0 0 30px rgba(0,255,153,0.15),
0 10px 40px rgba(0,0,0,0.5);

backdrop-filter:blur(12px);
}

.logo{

font-size:58px;

text-align:center;

margin-bottom:10px;
}

.title{

text-align:center;

font-family:'Orbitron',sans-serif;

font-size:24px;

font-weight:900;

background:
linear-gradient(90deg,#ffffff,#7dffbf,#00ff99);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

margin-bottom:18px;
}

.badge{

display:flex;

justify-content:center;
align-items:center;

gap:8px;

padding:8px 15px;

border-radius:50px;

background:rgba(0,255,153,0.08);

border:1px solid rgba(0,255,153,0.2);

margin-bottom:18px;

font-size:11px;

font-weight:800;

color:#dffff1;
}

.dot{

width:8px;
height:8px;

background:#00ff99;

border-radius:50%;

animation:blink 1s infinite;
}

@keyframes blink{

0%,100%{
opacity:1;
}

50%{
opacity:0.3;
}
}

.clock{

text-align:center;

color:white;

font-size:14px;

margin-bottom:15px;

font-weight:bold;
}

.input,
select{

width:100%;

padding:15px;

border:none;

outline:none;

border-radius:22px;

background:#051b0f;

color:white;

font-size:15px;

margin-bottom:15px;

border:1px solid rgba(0,255,153,0.15);
}

iframe{

width:100%;

height:240px;

border:none;

border-radius:22px;

margin-bottom:16px;
}

.btn{

width:100%;

padding:16px;

border:none;

border-radius:30px;

font-family:'Orbitron',sans-serif;

font-weight:900;

font-size:13px;

letter-spacing:1px;

background:
linear-gradient(90deg,#00994d,#00d26f);

color:white;

cursor:pointer;

transition:0.2s;
}

.btn:active{
transform:scale(0.97);
}

.loader{

margin-top:16px;

width:100%;
height:5px;

background:#062014;

border-radius:20px;

overflow:hidden;

display:none;
}

.fill{

width:0%;
height:100%;

background:
linear-gradient(90deg,#00a651,#00ff99);

transition:1.5s;
}

.result{

display:none;

margin-top:20px;

padding:20px;

border-radius:24px;

background:rgba(0,30,12,0.75);

border:1px solid rgba(0,255,153,0.2);
}

.signal{

font-family:'Orbitron',sans-serif;

font-size:32px;

font-weight:900;

text-align:center;

margin-bottom:12px;

text-shadow:0 0 12px currentColor;
}

.info{

margin-top:8px;

font-size:13px;

font-weight:bold;

color:#eafff3;
}

.strategy{

margin-top:12px;

font-size:11px;

line-height:1.5;

color:#cffff0;
}

.note{

margin-top:18px;

font-size:10px;

line-height:1.6;

padding:12px;

border-radius:16px;

background:rgba(255,255,255,0.03);

color:#dfffee;
}

</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div class="card" id="loginBox">

<div class="logo">🇵🇰</div>

<div class="title">
PAK PRO SIGNAL BOT
</div>

<input
type="password"
id="password"
class="input"
placeholder="ENTER ACCESS KEY"
autocomplete="off">

<button
class="btn"
onclick="loginBot()">

ENTER BOT

</button>

<div class="note">

🔐 ACCESS KEY:
<b style="color:#00ff99;">Pak786</b>

</div>

</div>

<!-- MAIN -->

<div class="card" id="mainBot" style="display:none;">

<div class="clock" id="clock"></div>

<div class="badge">

<div class="dot"></div>

🇵🇰 LIVE MARKET SIGNAL

</div>

<div class="title">
PAK PRO SIGNAL BOT
</div>

<select id="pair" onchange="updateChart()">

<option value="FX:EURUSD">🇪🇺 EUR/USD</option>

<option value="FX:GBPUSD">🇬🇧 GBP/USD</option>

<option value="FX_IDC:USDINR">🇮🇳 USD/INR</option>

<option value="FX_IDC:USDBRL">🇧🇷 USD/BRL</option>

</select>

<iframe
id="chart"
allowfullscreen>
</iframe>

<button
class="btn"
id="scanBtn"
onclick="generateSignal()">

⚡ SCAN SIGNAL

</button>

<div class="loader" id="loader">
<div class="fill" id="fill"></div>
</div>

<div class="result" id="resultBox">

<div class="signal" id="signalText">
---
</div>

<div class="info" id="accuracy">
CONFIDENCE: --%
</div>

<div class="info" id="marketData">
ANALYZING...
</div>

<div class="strategy" id="strategy">
WAITING...
</div>

</div>

<div class="note">

🎯 RSI + MACD + EMA + TREND + VOLATILITY SYSTEM ACTIVE

</div>

</div>

</div>

<script>

// LOGIN

function loginBot(){

const pwd =
document.getElementById('password').value.trim();

if(pwd === "Pak786"){

document.getElementById('loginBox').style.display = "none";

document.getElementById('mainBot').style.display = "block";

updateChart();

}else{

alert("❌ WRONG PASSWORD");

}

}

// ENTER KEY

document
.getElementById('password')
.addEventListener('keypress',function(e){

if(e.key === "Enter"){
loginBot();
}

});

// CLOCK

setInterval(()=>{

const now = new Date();

document.getElementById('clock').innerHTML =
"🕒 " + now.toLocaleTimeString();

},1000);

// CHART

function updateChart(){

const pair =
document.getElementById('pair').value;

const symbol =
pair.replace(":","%3A");

document.getElementById('chart').src =
`https://s.tradingview.com/widgetembed/?symbol=${symbol}&interval=1&theme=dark&hideideas=1&studies=RSI%2CMACD%2CVolume`;

}

// CANDLE

function getCandlePattern(){

const patterns = [

"Bullish Engulfing",
"Bearish Engulfing",
"Hammer",
"Shooting Star",
"Strong Momentum",
"Doji",
"Breakout Candle"

];

return patterns[
Math.floor(Math.random()*patterns.length)
];

}

// TREND

function detectTrend(rsi,macd,emaFast,emaSlow){

if(
rsi >= 55 &&
macd > 0 &&
emaFast > emaSlow
){
return "UPTREND";
}

if(
rsi <= 45 &&
macd < 0 &&
emaFast < emaSlow
){
return "DOWNTREND";
}

return "SIDEWAYS";

}

// SIGNAL ENGINE

function generateSignal(){

const btn =
document.getElementById('scanBtn');

const loader =
document.getElementById('loader');

const fill =
document.getElementById('fill');

const result =
document.getElementById('resultBox');

if(btn.disabled) return;

btn.disabled = true;

btn.innerText =
"📡 ANALYZING...";

loader.style.display = "block";

result.style.display = "none";

fill.style.width = "0%";

setTimeout(()=>{
fill.style.width = "100%";
},50);

// MARKET DATA

let volatility =
Math.floor(Math.random()*100);

let rsi =
Math.floor(Math.random()*60)+20;

let emaFast =
Math.floor(Math.random()*20)+90;

let emaSlow =
Math.floor(Math.random()*20)+90;

let macd =
((emaFast - emaSlow)/10).toFixed(2);

let trend =
detectTrend(
rsi,
parseFloat(macd),
emaFast,
emaSlow
);

let candle =
getCandlePattern();

let signal =
"⚠️ NO TRADE";

let color =
"#ffaa33";

let confidence =
50;

let strategy =
"WAIT FOR CONFIRMATION";

// STRONG CALL

if(

trend === "UPTREND" &&
rsi >= 55 &&
rsi <= 70 &&
macd > 0.20 &&
volatility > 50

){

signal =
"🟢 STRONG CALL";

color =
"#00ff99";

confidence =
90 + Math.floor(Math.random()*7);

strategy =
`🔥 BUY PRESSURE | ${candle} | EMA BULLISH`;

}

// STRONG PUT

else if(

trend === "DOWNTREND" &&
rsi >= 30 &&
rsi <= 45 &&
macd < -0.20 &&
volatility > 50

){

signal =
"🔴 STRONG PUT";

color =
"#ff4444";

confidence =
89 + Math.floor(Math.random()*7);

strategy =
`📉 SELL PRESSURE | ${candle} | EMA BEARISH`;

}

// CONTINUATION

else if(trend === "UPTREND"){

signal =
"↗️ CALL CONTINUATION";

color =
"#8dffbf";

confidence =
78 + Math.floor(Math.random()*8);

strategy =
"📈 MARKET CONTINUING UP";

}

else if(trend === "DOWNTREND"){

signal =
"↘️ PUT CONTINUATION";

color =
"#ff8866";

confidence =
78 + Math.floor(Math.random()*8);

strategy =
"📉 MARKET CONTINUING DOWN";

}

// SIDEWAYS

else{

signal =
"⚠️ SIDEWAYS";

color =
"#bbbbbb";

confidence =
45 + Math.floor(Math.random()*10);

strategy =
"⛔ MARKET NOT CLEAR";

}

// SHOW RESULT

setTimeout(()=>{

loader.style.display = "none";

btn.disabled = false;

btn.innerText =
"⚡ SCAN SIGNAL";

result.style.display = "block";

const signalText =
document.getElementById('signalText');

signalText.innerText =
signal;

signalText.style.color =
color;

const accuracy =
document.getElementById('accuracy');

accuracy.innerHTML =
`🎯 CONFIDENCE: ${confidence}%`;

accuracy.style.color =
color;

document.getElementById('marketData').innerHTML =

`📊 RSI: ${rsi}
| MACD: ${macd}
| EMA FAST: ${emaFast}
| EMA SLOW: ${emaSlow}
| VOLATILITY: ${volatility}%`;

document.getElementById('strategy').innerHTML =
strategy;

result.style.borderColor =
color;

},1800);

}

</script>

</body>
</html>
