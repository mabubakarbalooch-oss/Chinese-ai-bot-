<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lubna Abubakar - Holographic Signal Bot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;500;700&display=swap');

        :root {
            --bg-deep: #030712;
            --neon-blue: #00f2fe;
            --neon-purple: #4facfe;
            --neon-pink: #ff0844;
            --glass-bg: rgba(13, 20, 35, 0.65);
            --glass-border: rgba(0, 242, 254, 0.25);
            --text-color: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(79, 172, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 8, 68, 0.1) 0%, transparent 40%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .holo-card {
            width: 100%;
            max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 
                        inset 0 0 20px rgba(0, 242, 254, 0.05);
            position: relative;
            overflow: hidden;
        }

        .holo-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
            animation: scanline 4s linear infinite;
        }

        @keyframes scanline {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 15px;
        }

        .brand-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .brand-title span {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .live-badge {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .control-group {
            margin-bottom: 14px;
        }

        .control-group label {
            display: block;
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 5px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.5px;
        }

        select {
            width: 100%;
            background: rgba(10, 15, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        select:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .execute-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: #030712;
            border: none;
            padding: 15px;
            border-radius: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.3);
        }

        .execute-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 242, 254, 0.5);
        }

        .scanner-loader {
            display: none;
            text-align: center;
            margin: 20px 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: var(--neon-blue);
            letter-spacing: 1px;
        }

        .output-box {
            display: none;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 18px;
            text-align: center;
        }

        .signal-title {
            font-size: 10px;
            color: var(--text-dim);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        .signal-action {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            margin: 8px 0;
            letter-spacing: 2px;
        }

        .call-up {
            color: #10b981;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }

        .put-down {
            color: #ff0844;
            text-shadow: 0 0 20px rgba(255, 8, 68, 0.5);
        }

        .metrics-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 10px;
            text-align: center;
        }

        .metric-card span {
            display: block;
            font-size: 9px;
            color: var(--text-dim);
            margin-bottom: 2px;
        }

        .metric-card strong {
            font-size: 11px;
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body>

    <div class="holo-card">
        <div class="brand-header">
            <div class="brand-title">
                <h1>LUBNA ABUBAKAR</h1>
                <span>Holographic AI Engine</span>
            </div>
            <div class="live-badge">SYNCED</div>
        </div>

        <div class="control-group">
            <label>Broker Selection</label>
            <select id="broker">
                <option value="Quotex">Quotex OTC Engine</option>
            </select>
        </div>

        <div class="control-group">
            <label>Asset Pair (Quotex Currencies)</label>
            <select id="pair">
                <option value="GBP/CAD (OTC)">GBP/CAD (OTC)</option>
                <option value="GBP/CHF (OTC)">GBP/CHF (OTC)</option>
                <option value="USD/EGP (OTC)">USD/EGP (OTC)</option>
                <option value="USD/JPY (OTC)">USD/JPY (OTC)</option>
                <option value="NZD/CAD (OTC)">NZD/CAD (OTC)</option>
                <option value="USD/ARS (OTC)">USD/ARS (OTC)</option>
                <option value="AUD/CHF (OTC)">AUD/CHF (OTC)</option>
                <option value="CAD/CHF (OTC)">CAD/CHF (OTC)</option>
                <option value="NZD/CHF (OTC)">NZD/CHF (OTC)</option>
                <option value="AUD/NZD (OTC)">AUD/NZD (OTC)</option>
                <option value="USD/DZD (OTC)">USD/DZD (OTC)</option>
                <option value="AUD/CAD (OTC)">AUD/CAD (OTC)</option>
                <option value="USD/ZAR (OTC)">USD/ZAR (OTC)</option>
                <option value="USD/PHP (OTC)">USD/PHP (OTC)</option>
                <option value="EUR/NZD (OTC)">EUR/NZD (OTC)</option>
                <option value="USD/BDT (OTC)">USD/BDT (OTC)</option>
                <option value="USD/CHF (OTC)">USD/CHF (OTC)</option>
                <option value="USD/CAD (OTC)">USD/CAD (OTC)</option>
                <option value="USD/IDR (OTC)">USD/IDR (OTC)</option>
                <option value="USD/BRL (OTC)">USD/BRL (OTC)</option>
                <option value="EUR/AUD (OTC)">EUR/AUD (OTC)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Execution Timer</label>
            <select id="timer">
                <option value="1 Minute">1 Minute Expiry</option>
                <option value="5 Seconds">5 Seconds Scalp</option>
                <option value="5 Minutes">5 Minutes Standard</option>
            </select>
        </div>

        <button class="execute-btn" onclick="runHoloSignal()">Execute AI Scan</button>

        <div class="scanner-loader" id="loader">
            Scanning Order Book & Indicators...
        </div>

        <div class="output-box" id="outputBox">
            <div class="signal-title">AI RECOMMENDATION</div>
            <div class="signal-action" id="signalText">--</div>

            <div class="metrics-row">
                <div class="metric-card">
                    <span>RSI Core</span>
                    <strong id="mRsi">--</strong>
                </div>
                <div class="metric-card">
                    <span>Trend</span>
                    <strong id="mTrend">--</strong>
                </div>
                <div class="metric-card">
                    <span>Accuracy</span>
                    <strong id="mAcc">--</strong>
                </div>
            </div>
        </div>
    </div>

    <script>
        function runHoloSignal() {
            const loader = document.getElementById('loader');
            const outputBox = document.getElementById('outputBox');
            const signalText = document.getElementById('signalText');
            
            const mRsi = document.getElementById('mRsi');
            const mTrend = document.getElementById('mTrend');
            const mAcc = document.getElementById('mAcc');

            outputBox.style.display = 'none';
            loader.style.display = 'block';

            setTimeout(() => {
                loader.style.display = 'none';
                outputBox.style.display = 'block';

                const isCall = Math.random() >= 0.5;

                if(isCall) {
                    signalText.className = 'signal-action call-up';
                    signalText.innerText = 'CALL (UP)';
                    mRsi.innerText = '61.4';
                    mTrend.innerText = 'BULLISH';
                } else {
                    signalText.className = 'signal-action put-down';
                    signalText.innerText = 'PUT (DOWN)';
                    mRsi.innerText = '38.2';
                    mTrend.innerText = 'BEARISH';
                }

                mAcc.innerText = (96 + Math.random() * 3.5).toFixed(1) + '%';

            }, 1800);
        }
    </script>
</body>
</html>
