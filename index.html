<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LUBNA ABUBAKAR SIGNAL PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#ffd700;
  --yellow-glow:rgba(255,215,0,0.4);
  --black:#000;
  --green:#00ff44;
  --red:#ff3333;
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  background:var(--black);
  color:white;
  font-family:'Poppins',sans-serif;
  width:100%;
  height:100vh;
  overflow:hidden;
}

/* LOGIN SCREEN */
.login-wrapper{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.login-card{
  width:100%;
  max-width:380px;
  background:linear-gradient(145deg,#141414,#080808);
  border:2px solid var(--yellow);
  border-radius:20px;
  padding:35px 25px;
  box-shadow:0 0 50px var(--yellow-glow);
}
.login-logo{
  width:80px;
  height:80px;
  margin:0 auto 20px;
  background:linear-gradient(135deg,var(--yellow),#ffaa00);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:35px;
  color:var(--black);
  box-shadow:0 0 30px var(--yellow-glow);
}
.login-header h1{
  font-family:'Orbitron',sans-serif;
  font-size:22px;
  color:var(--yellow);
  text-align:center;
  letter-spacing:2px;
  margin-bottom:5px;
}
.login-header p{
  text-align:center;
  font-size:11px;
  color:#888;
  letter-spacing:3px;
  margin-bottom:25px;
}
.input-group{margin-bottom:18px}
.input-group label{
  font-size:10px;
  color:#999;
  text-transform:uppercase;
  letter-spacing:2px;
  font-weight:700;
  margin-bottom:6px;
  display:block;
}
.input-box input{
  width:100%;
  padding:14px;
  background:#080808;
  border:1.5px solid rgba(255,215,0,0.3);
  border-radius:12px;
  color:var(--yellow);
  font-size:14px;
  font-weight:700;
  outline:none;
}
.unlock-btn{
  width:100%;
  padding:16px;
  background:linear-gradient(135deg,var(--yellow),#ffaa00);
  border:none;
  border-radius:12px;
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:14px;
  color:var(--black);
  letter-spacing:3px;
  cursor:pointer;
  margin-top:10px;
}

/* MAIN SCREEN */
.main-wrapper{
  width:100%;
  height:100vh;
  display:none;
  flex-direction:column;
  padding:8px;
  overflow-y:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  flex-shrink:0;
}

.logo{
  display:flex;
  align-items:center;
  gap:8px;
}

.logo-box{
  width:42px;
  height:42px;
  background:linear-gradient(135deg,var(--yellow),#ffaa00);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:18px;
  color:var(--black);
  box-shadow:0 0 20px var(--yellow-glow);
}

.brand h1{
  font-family:'Orbitron',sans-serif;
  font-size:14px;
  color:var(--yellow);
  letter-spacing:1.5px;
}
.brand p{
  font-size:9px;
  color:#999;
  letter-spacing:1.5px;
}

.live-badge{
  display:flex;
  align-items:center;
  gap:5px;
  padding:6px 12px;
  background:rgba(255,215,0,0.08);
  border:1.5px solid var(--yellow);
  border-radius:50px;
  font-size:10px;
  font-weight:900;
  color:var(--yellow);
  font-family:'Orbitron',sans-serif;
}
.live-dot{
  width:7px;
  height:7px;
  background:var(--green);
  border-radius:50%;
  animation:blink 1s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

.card{
  background:linear-gradient(145deg,#141414,#080808);
  border:1.5px solid rgba(255,215,0,0.25);
  border-radius:16px;
  padding:10px 12px;
  margin-bottom:8px;
  flex-shrink:0;
}

.label{
  font-size:8px;
  color:#999;
  text-transform:uppercase;
  letter-spacing:2px;
  font-weight:700;
  margin-bottom:6px;
}

select{
  width:100%;
  padding:11px;
  background:#080808;
  border:1.5px solid rgba(255,215,0,0.3);
  border-radius:10px;
  color:var(--yellow);
  font-size:12px;
  font-weight:700;
  outline:none;
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.timer-box{
  text-align:center;
  padding:14px 8px;
}
.timer-label{
  font-size:8px;
  color:#999;
  text-transform:uppercase;
  letter-spacing:2px;
  font-weight:700;
  margin-bottom:6px;
}
.timer-value{
  font-family:'Orbitron',sans-serif;
  font-size:32px;
  font-weight:900;
  color:var(--yellow);
  text-shadow:0 0 20px var(--yellow-glow);
  line-height:1;
  letter-spacing:2px;
}
.timer-sub{
  font-size:8px;
  color:#666;
  margin-top:4px;
}

.get-btn{
  width:100%;
  padding:18px;
  background:linear-gradient(135deg,var(--yellow),#ffaa00);
  border:none;
  border-radius:16px;
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:15px;
  color:var(--black);
  letter-spacing:3px;
  cursor:pointer;
  box-shadow:0 10px 30px rgba(255,215,0,0.4);
}
.get-btn:disabled{opacity:0.6}

.indicator-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
.ind-box{
  background:#080808;
  border:1.5px solid rgba(255,215,0,0.15);
  border-radius:10px;
  padding:8px 6px;
  text-align:center;
}
.ind-label{
  font-size:7px;
  color:#777;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:4px;
  font-weight:700;
}
.ind-value{
  font-family:'Orbitron',sans-serif;
  font-size:13px;
  font-weight:900;
  color:var(--yellow);
}

.signal-card{
  background:linear-gradient(145deg,#1a0a0a,#0a0505);
  border:2.5px solid var(--red);
  border-radius:16px;
  padding:12px;
  display:none;
  animation:pop 0.5s ease;
}
@keyframes pop{
 0%{transform:scale(0.9);opacity:0}
 100%{transform:scale(1);opacity:1}
.signal-card.buy{
  background:linear-gradient(145deg,#0a1a0a,#050a05);
  border-color:var(--green);
}

.signal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}
.signal-badge{
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 14px;
  border-radius:50px;
  background:rgba(255,51,51,0.25);
  border:2px solid var(--red);
  color:var(--red);
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:13px;
  letter-spacing:2px;
}
.signal-card.buy.signal-badge{
  background:rgba(0,255,68,0.25);
  border-color:var(--green);
  color:var(--green);
}
.signal-time{
  font-size:9px;
  color:#777;
  font-weight:600;
}

.signal-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-bottom:10px;
}
.sig-item{
  background:#080808;
  border:1.5px solid rgba(255,215,0,0.15);
  border-radius:10px;
  padding:8px;
  text-align:center;
}
.sig-label{
  font-size:7px;
  color:#777;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:4px;
  font-weight:700;
}
.sig-value{
  font-family:'Orbitron',sans-serif;
  font-size:15px;
  font-weight:900;
  color:var(--red);
}
.signal-card.buy.sig-value{color:var(--green)}

.conf-bar{
  height:5px;
  background:#080808;
  border-radius:3px;
  overflow:hidden;
  margin:8px 0;
}
.conf-fill{
  height:100%;
  background:linear-gradient(90deg,var(--red),#ff6666);
  width:0%;
  transition:width 1.2s ease-out;
}

.chart-card{
  padding:0;
  overflow:hidden;
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:160px;
}
.chart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 12px;
  border-bottom:1.5px solid rgba(255,215,0,0.15);
  flex-shrink:0;
}
.chart-title{
  font-family:'Orbitron',sans-serif;
  font-size:11px;
  font-weight:900;
  color:var(--yellow);
  letter-spacing:1px;
}
.chart-status{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:8px;
  color:var(--green);
  font-weight:900;
}

#chart{
  width:100%;
  flex:1;
  display:block;
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-wrapper" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">LA</div>
    <div class="login-header">
      <h1>LUBNA ABUBAKAR</h1>
      <p>SIGNAL PRO</p>
    </div>
    <div class="input-group">
      <label>Username</label>
      <div class="input-box">
        <input type="text" id="username" placeholder="Enter username" value="Lubna">
      </div>
    </div>
    <div class="input-group">
      <label>Password</label>
      <div class="input-box">
        <input type="password" id="password" placeholder="Enter password" value="pro123">
      </div>
    </div>
    <button class="unlock-btn" onclick="doLogin()">UNLOCK SYSTEM</button>
  </div>
</div>

<!-- MAIN SCREEN -->
<div class="main-wrapper" id="mainScreen">

  <div class="header">
    <div class="logo">
      <div class="logo-box">LA</div>
      <div class="brand">
        <h1>LUBNA ABUBAKAR</h1>
        <p>SIGNAL PRO</p>
      </div>
    </div>
    <div class="live-badge">
      <div class="live-dot"></div>
      <span>LIVE</span>
    </div>
  </div>

  <div class="card">
    <div class="label">MARKET</div>
    <select id="broker" onchange="updatePairs()">
      <option value="quotex">📱 Quotex OTC</option>
      <option value="pocket">📱 Pocket OTC</option>
      <option value="binance">₿ Binance Crypto</option>
    </select>

    <div class="label" style="margin-top:10px">PAIR</div>
    <select id="pair" onchange="onPairChange()">
      <option value="EURUSD-OTC">💱 EUR/USD OTC</option>
    </select>

    <div class="label" style="margin-top:10px">TIMEFRAME</div>
    <select id="tf" onchange="onTfChange()">
      <option value="15m" selected>15 Minutes</option>
      <option value="5m">5 Minutes</option>
      <option value="1m">1 Minute</option>
    </select>
  </div>

  <div class="grid-2">
    <div class="card timer-box">
      <div class="timer-label">NEXT CANDLE</div>
      <div class="timer-value" id="timer">14:52</div>
      <div class="timer-sub">Signal = 1 Candle Only</div>
    </div>

    <div class="card" style="padding:6px;display:flex;align-items:center">
      <button class="get-btn" id="btn" onclick="getSignal()">🔮 GET SIGNAL</button>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="label">INDICATORS</div>
      <div class="indicator-grid">
        <div class="ind-box">
          <div class="ind-label">RSI 14</div>
          <div class="ind-value" id="rsi">--</div>
        </div>
        <div class="ind-box">
          <div class="ind-label">EMA</div>
          <div class="ind-value" id="ema">--</div>
        </div>
        <div class="ind-box">
          <div class="ind-label">MACD</div>
          <div class="ind-value" id="macd">--</div>
        </div>
        <div class="ind-box">
          <div class="ind-label">TREND</div>
          <div class="ind-value" id="trend">--</div>
        </div>
      </div>
    </div>

    <div class="signal-card" id="signalCard">
      <div class="signal-header">
        <div class="signal-badge" id="badge">
          <span>📉</span>
          <span id="sigText">SELL</span>
        </div>
        <div class="signal-time" id="sigTime">17:15:45</div>
      </div>

      <div class="signal-grid">
        <div class="sig-item">
          <div class="sig-label">ENTRY</div>
          <div class="sig-value" id="entry">1.08091</div>
        </div>
        <div class="sig-item">
          <div class="sig-label">EXPIRY</div>
          <div class="sig-value">1 Candle</div>
        </div>
        <div class="sig-item">
          <div class="sig-label">CONFIDENCE</div>
          <div class="sig-value" id="conf">94%</div>
        </div>
        <div class="sig-item">
          <div class="sig-label">STRENGTH</div>
          <div class="sig-value" id="strength">STRONG</div>
        </div>
      </div>

      <div class="conf-bar">
        <div class="conf-fill" id="confBar"></div>
      </div>
    </div>
  </div>

  <div class="card chart-card">
    <div class="chart-header">
      <div class="chart-title" id="chartTitle">EUR/USD OTC - 15M</div>
      <div class="chart-status">
        <div class="live-dot"></div>
        LIVE
      </div>
    </div>
    <canvas id="chart"></canvas>
  </div>

</div>

<script>
let candleData = [];
let candleSeconds = 900;
let activeSignal = null;

function doLogin(){
  let u = document.getElementById('username').value.trim();
  let p = document.getElementById('password').value.trim();

  if(u === 'Lubna' && p === 'pro123'){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'flex';
    updatePairs();
    startTimer();
  } else {
    alert('غلط! Username: Lubna Password: pro123');
  }
}

const pairs = {
  quotex: ["EURUSD-OTC","GBPUSD-OTC","USDJPY-OTC","AUDUSD-OTC","USDCAD-OTC"],
  pocket: ["EURUSD-OTC","GBPUSD-OTC","USDJPY-OTC","AUDUSD-OTC"],
  binance: ["BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT"]
};

function updatePairs(){
  const broker = document.getElementById('broker').value;
  const pairSel = document.getElementById('pair');
  pairSel.innerHTML = '';
  pairs[broker].forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = '💱 ' + p;
    pairSel.appendChild(opt);
  });
  onPairChange();
}

function onPairChange(){
  const pair = document.getElementById('pair').value;
  const tf = document.getElementById('tf').value;
  document.getElementById('chartTitle').textContent = pair + ' - ' + tf.toUpperCase();
  generateCandles();
  drawChart();
  resetSignal();
}

function onTfChange(){
  const tf = document.getElementById('tf').value;
  candleSeconds = tf === '1m'? 60 : tf === '5m'? 300 : 900;
  onPairChange();
}

function generateCandles(){
  candleData = [];
  let base = 1.0800;
  if(document.getElementById('pair').value.includes('JPY')) base = 150.50;

  for(let i = 0; i < 50; i++){
    let change = (Math.random() - 0.5) * 0.002;
    base += change;
    let open = base;
    let close = base + (Math.random() - 0.5) * 0.0015;
    candleData.push({
      o: open,
      h: Math.max(open, close) + Math.random() * 0.001,
      l: Math.min(open, close) - Math.random() * 0.001,
      c: close
    });
  }
  updateIndicators();
}

function updateIndicators(){
  if(candleData.length < 14) return;

  const closes = candleData.map(c => c.c);

  let gains = 0, losses = 0;
  for(let i = candleData.length - 14; i < candleData.length; i++){
    let diff = closes[i] - closes[i-1];
    if(diff > 0) gains += diff;
    else losses += Math.abs(diff);
  }
  let rs = gains / (losses || 1);
  let rsi = 100 - (100 / (1 + rs));
  document.getElementById('rsi').textContent = rsi.toFixed(1);
  document.getElementById('rsi').style.color = rsi > 70? 'var(--red)' : rsi < 30? 'var(--green)' : 'var(--yellow)';

  function ema(arr, period){
    let k = 2/(period+1);
    let ema = [arr[0]];
    for(let i = 1; i < arr.length; i++){
      ema.push(arr[i] * k + ema[i-1] * (1-k));
    }
    return ema[ema.length-1];
  }
  let ema9 = ema(closes, 9);
  let ema21 = ema(closes, 21);
  let bullish = ema9 > ema21;
  document.getElementById('ema').textContent = bullish? 'BULL ▲' : 'BEAR ▼';
  document.getElementById('ema').style.color = bullish? 'var(--green)' : 'var(--red)';
  document.getElementById('trend').textContent = bullish? 'UP' : 'DOWN';
  document.getElementById('trend').style.color = bullish? 'var(--green)' : 'var(--red)';

  let macd = ema9 - ema21;
  document.getElementById('macd').textContent = macd > 0? '+' + macd.toFixed(4) : macd.toFixed(4);
  document.getElementById('macd').style.color = macd > 0? 'var(--green)' : 'var(--red)';
}

function getSignal(){
  if(candleData.length < 2) return;

  document.getElementById('btn').disabled = true;

  setTimeout(() => {
    const c1 = candleData[candleData.length - 2];
    const c2 = candleData[candleData.length - 1];

    let c1Bull = c1.c > c1.o;
    let c2Bull = c2.c > c2.o;
    let body1 = Math.abs(c1.c - c1.o);
    let body2 = Math.abs(c2.c - c2.o);

    let isBuy = false;
    let conf = 72;

    if(!c1Bull && c2Bull && c2.c > c1.o && body2 > body1 * 1.3){
      isBuy = true;
      conf = 94;
    } else if(c1Bull &&!c2Bull && c2.c < c1.o && body2 > body1 * 1.3){
      isBuy = false;
      conf = 94;
    } else if(c1Bull && c2Bull){
      isBuy = true;
      conf = 84;
    } else if(!c1Bull &&!c2Bull){
      isBuy = false;
      conf = 84;
    } else {
      isBuy = c2Bull;
      conf = 75;
    }

    const now = new Date();
    const timeStr = String(now.getHours()).padStart(2,'0') + ':' +
                    String(now.getMinutes()).padStart(2,'0') + ':' +
                    String(now.getSeconds()).padStart(2,'0');

    activeSignal = {
      type: isBuy? 'buy' : 'sell',
      entry: c2.c,
      conf: conf,
      time: timeStr
    };

    const card = document.getElementById('signalCard');
    card.className = 'signal-card ' + (isBuy? 'buy' : '');
    card.style.display = 'block';

    document.getElementById('badge').innerHTML =
      '<span>' + (isBuy? '📈' : '📉') + '</span><span id="sigText">' + (isBuy? 'BUY' : 'SELL') + '</span>';
    document.getElementById('sigTime').textContent = timeStr;
    document.getElementById('entry').textContent = c2.c.toFixed(5);
    document.getElementById('conf').textContent = conf + '%';
    document.getElementById('strength').textContent = conf > 90? 'STRONG' : 'MODERATE';

    setTimeout(() => {
      document.getElementById('confBar').style.width = conf + '%';
    }, 100);

    document.getElementById('btn').disabled = false;

  }, 1000);
}

function drawChart(){
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const w = canvas.parentElement.clientWidth;
  const h = canvas.parentElement.clientHeight;
  canvas.width = w;
  canvas.height = h;

  ctx.clearRect(0, 0, w, h);

  if(candleData.length < 2) return;

  const visible = candleData.slice(-25);
  const min = Math.min(...visible.map(c => c.l));
  const max = Math.max(...visible.map(c => c.h));
  const range = max - min || 1;
  const spacing = w / visible.length;
  const candleW = spacing * 0.6;

  visible.forEach((c, i) => {
    const x = i * spacing + spacing / 2;
    const oY = h - ((c.o - min) / range) * h * 0.8;
    const cY = h - ((c.c - min) / range) * h * 0.8;
    const hY = h - ((c.h - min) / range) * h * 0.8;
    const lY = h - ((c.l - min) / range) * h * 0.8;

    const isGreen = c.c >= c.o;
    ctx.strokeStyle = isGreen? '#00ff44' : '#ff3333';
    ctx.fillStyle = isGreen? '#00ff44' : '#ff3333';
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(x, hY);
    ctx.lineTo(x, lY);
    ctx.stroke();

    const bodyH = Math.abs(cY - oY);
    const bodyY = Math.min(oY, cY);
    ctx.fillRect(x - candleW/2, bodyY, candleW, Math.max(2, bodyH));
  });
}

function startTimer(){
  setInterval(() => {
    candleSeconds--;
    if(candleSeconds < 0){
      candleSeconds = document.getElementById('tf').value === '1m'? 60 :
                      document.getElementById('tf').value === '5m'? 300 : 900;
      generateCandles();
      drawChart();
    }
    const m = Math.floor(candleSeconds / 60);
    const s = candleSeconds % 60;
    document.getElementById('timer').textContent =
      String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }, 1000);
}

function resetSignal(){
  document.getElementById('signalCard').style.display = 'none';
  activeSignal = null;
}
</script>
</body>
</html>
