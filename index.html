<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PAK AI SIGNAL X - ROUND PRO</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root {
            --sky: #00d4ff;
            --sky-dim: rgba(0, 212, 255, 0.2);
            --bg: #010a0f;
            --card-bg: rgba(2, 18, 28, 0.95);
            --red: #ff4757;
            --green: #00ff99;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; overflow: hidden; }

        .app-window {
            width: 100%; max-width: 420px; background: var(--card-bg);
            border: 1px solid var(--sky-dim); border-radius: 40px;
            padding: 25px; box-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
            text-align: center;
        }

        h1 { color: #fff; font-size: 18px; text-shadow: 0 0 10px var(--sky); margin-bottom: 15px; }

        #chart-frame { height: 160px; background: #000; border-radius: 20px; overflow: hidden; border: 1px solid #111; position: relative; margin-bottom: 15px; }
        .laser { position: absolute; width: 100%; height: 3px; background: var(--sky); top: -10%; display: none; z-index: 10; }
        .scanning .laser { display: block; animation: scan 2s linear infinite; }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

        select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px; background: #000; border: 1px solid var(--sky-dim); color: #fff; text-align: center; outline: none; }

        /* GOOL (ROUND) BUTTON STYLE */
        .round-btn-container { display: flex; justify-content: center; margin: 15px 0; }
        .round-btn {
            width: 100px; height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0088cc, var(--sky));
            border: 4px solid var(--sky-dim);
            color: #000; font-weight: 900; font-size: 14px;
            cursor: pointer; text-transform: uppercase;
            box-shadow: 0 0 20px var(--sky-dim);
            transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
        }
        .round-btn:active { transform: scale(0.9); box-shadow: 0 0 5px var(--sky); }
        .round-btn:disabled { background: #333; color: #777; border-color: #444; }

        .result-panel { display: none; margin-top: 10px; padding: 12px; border-radius: 20px; background: rgba(0,212,255,0.03); border: 2px solid var(--sky-dim); }
        .sig-text { font-size: 30px; font-weight: 900; margin: 5px 0; }
        
        .history-box { margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; font-size: 11px; color: #777; }
    </style>
</head>
<body>

<div class="app-window" id="loginScreen">
    <h1>PAK AI LOGIN</h1>
    <input type="password" id="userInput" placeholder="Password" style="width:100%; padding:14px; margin-bottom:15px; border-radius:12px; background:#000; border:1px solid var(--sky); color:#fff; text-align:center;">
    <button onclick="checkPass()" style="width:100%; padding:15px; border-radius:50px; background:var(--sky); border:none; font-weight:bold; cursor:pointer;">LOGIN</button>
</div>

<div class="app-window" id="botScreen" style="display:none;">
    <h1>SIGNAL MASTER PRO</h1>
    
    <div id="chart-frame"><div class="laser" id="laser"></div><div id="tv-mount"></div></div>

    <select id="assetSelect" onchange="switchAsset()">
        <option value="USDBRL">USD/BRL (OTC)</option>
        <option value="USDMXN">USD/MXN (OTC)</option>
        <option value="USDINR">USD/INR (REAL)</option>
        <option value="USDPKR">USD/PKR (REAL)</option>
    </select>

    <div class="round-btn-container">
        <button class="round-btn" id="scanBtn" onclick="startScan()">
            <span id="btnText">START</span>
            <small id="btnSub" style="font-size:8px;">SCAN</small>
        </button>
    </div>

    <div class="result-panel" id="resPanel">
        <div style="color:var(--sky); font-size:10px; font-weight:bold;">ANALYZING TREND...</div>
        <div class="sig-text" id="sigVal">---</div>
        <div id="timerVal" style="font-size:12px; color:#fff; font-weight:bold;">READY</div>
    </div>

    <div class="history-box">PAK AI V11.8 - SMART ROUND EDITION</div>
</div>

<script>
    let audio = null;
    function checkPass() {
        if(document.getElementById('userInput').value.trim().toLowerCase() === "pak786") {
            document.getElementById('loginScreen').style.display = "none";
            document.getElementById('botScreen').style.display = "block";
            switchAsset();
            audio = new (window.AudioContext || window.webkitAudioContext)();
        } else { alert("Sahi Password!"); }
    }

    function switchAsset() {
        const symbol = document.getElementById('assetSelect').value;
        const mount = document.getElementById('tv-mount');
        mount.innerHTML = '';
        new TradingView.widget({ "width": "100%", "height": 160, "symbol": "FX_IDC:"+symbol, "interval": "1", "theme": "dark", "style": "1", "hide_top_toolbar": true, "container_id": "tv-mount" });
    }

    async function startScan() {
        const btn = document.getElementById('scanBtn');
        const frame = document.getElementById('chart-frame');
        const res = document.getElementById('resPanel');
        const bText = document.getElementById('btnText');
        
        btn.disabled = true; bText.innerText = "...";
        frame.classList.add('scanning'); res.style.display = 'none';

        await new Promise(r => setTimeout(r, 2800));

        frame.classList.remove('scanning'); btn.disabled = false; bText.innerText = "START";
        res.style.display = 'block';

        const isCall = Math.random() > 0.5;
        const sigVal = document.getElementById('sigVal');
        sigVal.innerText = isCall ? "CALL" : "PUT";
        sigVal.style.color = isCall ? "#00ff99" : "#ff4757";
        
        let t = 5;
        const timer = document.getElementById('timerVal');
        const itv = setInterval(() => {
            timer.innerText = "ENTRY IN: " + t + "s";
            t--;
            if(t < 0) { clearInterval(itv); timer.innerText = "✅ TRADE NOW"; timer.style.color = "#00ff99"; }
        }, 1000);
    }
</script>
</body>
</html>
