<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lubna Abubakar Signal Bot</title>
<style>
body {font-family: Arial, sans-serif; background:#0f172a; color:#fff; margin:0; padding:20px; text-align:center;}
.container {max-width:600px; margin:auto; background:#1e293b; padding:20px; border-radius:12px;}
h1 {color:#38bdf8;}
select, button {padding:10px; margin:10px; border-radius:8px; border:none; font-size:16px;}
button {background:#38bdf8; color:#000; cursor:pointer; font-weight:bold;}
button:hover {background:#0ea5e9;}
.card {background:#334155; padding:15px; margin-top:15px; border-radius:10px;}
.sell {color:#f87171;}.buy {color:#4ade80;}.wait {color:#facc15;}
</style>
</head>
<body>
<div class="container">
<h1>Lubna Abubakar Signal Bot</h1>
<p>Password: <b>Lubna786</b></p>

<select id="mode">
  <option value="binance">Binance Live</option>
  <option value="demo">Demo/OTC Mode</option>
</select>

<select id="pair">
  <option value="EURUSDT">EURUSDT</option>
  <option value="BRLUSDT">BRLUSDT</option>
  <option value="GBPUSDT">GBPUSDT</option>
  <option value="AUDUSDT">AUDUSDT</option>
</select>

<button onclick="generateSignal()">Generate Signal</button>

<div id="result"></div>
</div>

<script>
const demoPairs = {
  "EURUSD OTC": {base: 1.08, vol: 0.001},
  "GBPUSD OTC": {base: 1.26, vol: 0.0015},
  "AUDUSD OTC": {base: 0.65, vol: 0.002},
  "USDMXN OTC": {base: 17.5, vol: 0.05},
  "USDINR OTC": {base: 83.2, vol: 0.1},
  "USDPKR OTC": {base: 278, vol: 0.5}
};

async function generateSignal(){
  const mode = document.getElementById('mode').value;
  const pair = document.getElementById('pair').value;
  const resDiv = document.getElementById('result');
  resDiv.innerHTML = "Loading...";

  let price, rsi, macd, trend;

  if(mode === 'binance'){
    try{
      let res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${pair}&interval=1m&limit=50`);
      let data = await res.json();
      let closes = data.map(d => parseFloat(d[4]));
      price = closes[closes.length-1];
      rsi = calcRSI(closes);
      macd = calcMACD(closes);
      trend = closes[closes.length-1] > closes[closes.length-5]? "UP" : "DOWN";
    }catch(e){
      resDiv.innerHTML = "<div class='card'>API Error: Pair not found or rate limited</div>";
      return;
    }
  } else {
    let d = demoPairs[pair] || demoPairs["EURUSD OTC"];
    price = (d.base + (Math.random()-0.5)*d.vol).toFixed(4);
    rsi = (Math.random()*100).toFixed(2);
    macd = (Math.random()-0.5).toFixed(4);
    trend = Math.random() > 0.5? "UP" : "DOWN";
  }

  let signal = "WAIT";
  if(rsi < 30 && macd > 0 && trend === "UP") signal = "BUY";
  if(rsi > 70 && macd < 0 && trend === "DOWN") signal = "SELL";

  resDiv.innerHTML = `
    <div class="card">
      <h2>Pair: ${pair}</h2>
      <p>Price: ${price}</p>
      <p>RSI: ${rsi}</p>
      <p>MACD: ${macd}</p>
      <p>Trend: ${trend}</p>
      <h2 class="${signal.toLowerCase()}">${signal}</h2>
    </div>
  `;
}

function calcRSI(closes, period=14){
  let gains=0, losses=0;
  for(let i=1;i<=period;i++){
    let change = closes[i]-closes[i-1];
    if(change>0) gains+=change; else losses-=change;
  }
  let avgGain=gains/period, avgLoss=losses/period;
  let rs = avgGain/avgLoss;
  return (100 - (100/(1+rs))).toFixed(2);
}

function calcMACD(closes){
  let ema12 = EMA(closes,12);
  let ema26 = EMA(closes,26);
  return (ema12-ema26).toFixed(4);
}

function EMA(closes, period){
  let k=2/(period+1);
  let ema=closes[0];
  for(let i=1;i<closes.length;i++){
    ema = closes[i]*k + ema*(1-k);
  }
  return ema;
}
</script>
</body>
</html>
