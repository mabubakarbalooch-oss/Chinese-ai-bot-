<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABU BAKAR TRADER - ELITE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

body { 
    background: #02060c; color: #e2e8f0; font-family: 'Rajdhani', sans-serif;
    display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
}

.bot-container {
    width: 100%; max-width: 400px; 
    background: linear-gradient(180deg, rgba(10, 15, 25, 0.9), rgba(5, 8, 15, 0.95));
    border: 1px solid rgba(192, 192, 192, 0.3);
    border-radius: 30px; padding: 25px;
    box-shadow: 0 0 50px rgba(0, 255, 255, 0.15);
    backdrop-filter: blur(15px);
}

/* Circuit Pattern Background Effect */
.bot-container::before {
    content: ""; position: absolute; top:0; left:0; width:100%; height:100%;
    background-image: radial-gradient(circle, rgba(0,255,255,0.05) 1px, transparent 1px);
    background-size: 20px 20px; pointer-events: none; border-radius: 30px;
}

.header-row { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
.logo-circle { width: 55px; height: 55px; border: 2px solid #C0C0C0; border-radius: 50%; box-shadow: 0 0 15px #C0C0C0; }

.live-price-box { border: 1px solid #00ff9d; padding: 15px; border-radius: 20px; text-align: center; margin-bottom: 20px; }
.live-price { font-size: 40px; font-weight: 900; color: #00ff9d; font-family: 'Orbitron'; }

.btn-signal {
    width: 100%; padding: 18px; border-radius: 15px;
    background: rgba(255,255,255,0.1); border: 1px solid #fff;
    color: #fff; font-weight: 900; cursor: pointer; text-transform: uppercase;
}

.result-card {
    border: 2px solid #00ff9d; border-radius: 20px; padding: 20px;
    text-align: center; margin: 20px 0; box-shadow: 0 0 20px rgba(0, 255, 157, 0.2);
}

.data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.data-node { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; font-size: 13px; }
</style>
</head>
<body>

<div class="bot-container">
    <div class="header-row">
        <div class="logo-circle"></div>
        <div>
            <div style="font-family:'Orbitron'; font-weight:900;">ABU BAKAR TRADER</div>
            <div style="color:#aaa; font-size:11px;">TIGER ELITE AI BOT</div>
        </div>
    </div>

    <div class="live-price-box">
        <div style="color:#aaa; font-size:12px;">LIVE MARKET</div>
        <div class="live-price">1.2476</div>
    </div>

    <button class="btn-signal">⚡ ANALYZER MARKET (GET SIGNAL)</button>

    <div class="result-card">
        <div style="color:#00ff9d; font-size:45px; font-weight:900;">BUY</div>
        <div style="font-size:13px;">92% CONFIDENCE MATCH</div>
    </div>

    <div class="data-grid">
        <div class="data-node">RSI (14): 70</div>
        <div class="data-node" style="color:#00ff9d;">TREND: STRONG UP</div>
        <div class="data-node">EMA 9: 1.2473</div>
        <div class="data-node">EMA 21: 1.2467</div>
        <div class="data-node" style="grid-column: span 2;">ORDER ID: TGR-257168</div>
    </div>
</div>

</body>
</html>
