<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>ABU BAKAR TRADER - QUOTEX BOT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
background-image:
radial-gradient(circle at top,#ffd00033 0%,transparent 40%),
radial-gradient(circle at bottom,#111 0%,#000 70%);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:10px;
overflow-x:hidden;
}

.bot{
width:100%;
max-width:390px;
background:#050505;
border:2px solid #ffd000;
border-radius:30px;
padding:14px;
box-shadow:0 0 25px #ffd00055;
}

.logoBox{
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
margin-bottom:12px;
}

.logo{
width:75px;
height:75px;
border-radius:50%;
background:linear-gradient(135deg,#ffd000,#000);
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
font-weight:800;
color:#000;
border:3px solid #ffd000;
box-shadow:0 0 25px #ffd00088;
margin-bottom:10px;
}

.title{
font-size:28px;
font-weight:800;
color:#ffd000;
text-align:center;
}

.sub{
font-size:11px;
color:#999;
margin-top:3px;
text-align:center;
}

.monogram{
margin-top:8px;
padding:6px 14px;
border-radius:30px;
background:#111;
border:1px solid #ffd00055;
color:#ffd000;
font-size:11px;
font-weight:700;
}

.select{
margin-top:12px;
}

select{
width:100%;
padding:14px;
background:#0b0b0b;
border:1px solid #ffd00055;
border-radius:16px;
outline:none;
color:#fff;
font-size:17px;
}

.pairs{
display:flex;
flex-wrap:wrap;
gap:7px;
margin-top:12px;
justify-content:center;
}

.pair{
padding:7px 12px;
background:#111;
border:1px solid #ffd00033;
border-radius:20px;
font-size:12px;
color:#fff;
}

.chart{
margin-top:14px;
background:#070707;
border:1px solid #222;
border-radius:24px;
padding:14px;
height:250px;
position:relative;
overflow:hidden;
}

.live{
font-size:13px;
color:#ffd000;
font-weight:700;
}

.price{
font-size:48px;
font-weight:800;
color:#00ff95;
margin-top:5px;
}

.chartBars{
position:absolute;
bottom:20px;
left:12px;
right:12px;
height:90px;
display:flex;
align-items:flex-end;
gap:4px;
}

.bar{
width:7px;
border-radius:10px;
animation:jump 1s infinite alternate;
}

.green{
background:#00ff95;
box-shadow:0 0 10px #00ff95;
}

.red{
background:#ff3b5f;
box-shadow:0 0 10px #ff3b5f;
}

@keyframes jump{
from{
transform:scaleY(.7);
}
to{
transform:scaleY(1.1);
}
}

.scan{
width:100%;
padding:18px;
margin-top:14px;
border:none;
border-radius:18px;
background:linear-gradient(90deg,#ffd000,#ffb300,#000);
color:#000;
font-size:28px;
font-weight:800;
cursor:pointer;
}

.signalBox{
margin-top:15px;
background:#080808;
border-radius:24px;
padding:18px;
border:1px solid #222;
text-align:center;
}

.signal{
font-size:70px;
font-weight:900;
}

.buy{
color:#00ff95;
text-shadow:0 0 15px #00ff95;
}

.sell{
color:#ff3b5f;
text-shadow:0 0 15px #ff3b5f;
}

.wait{
color:#ffd000;
text-shadow:0 0 15px #ffd000;
}

.conf{
font-size:50px;
font-weight:800;
color:#ffd000;
margin-top:5px;
}

.info{
margin-top:12px;
text-align:left;
font-size:15px;
color:#ddd;
line-height:28px;
}

.footer{
margin-top:14px;
display:flex;
justify-content:space-between;
align-items:center;
font-size:12px;
color:#ffd000;
}

.online{
display:flex;
align-items:center;
gap:6px;
}

.dot{
width:10px;
height:10px;
background:#00ff95;
border-radius:50%;
box-shadow:0 0 10px #00ff95;
}

.passScreen{
position:fixed;
inset:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}

.passBox{
width:90%;
max-width:320px;
background:#050505;
padding:25px;
border-radius:25px;
border:2px solid #ffd000;
text-align:center;
}

.passBox h2{
color:#ffd000;
margin-bottom:20px;
}

.passBox input{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#111;
color:#fff;
margin-bottom:15px;
font-size:18px;
text-align:center;
}

.passBox button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#ffd000;
color:#000;
font-size:18px;
font-weight:800;
}

</style>
</head>

<body>

<div class="passScreen" id="lock">

<div class="passBox">

<h2>QUOTEX SECURITY</h2>

<input type="password" id="pass" placeholder="ENTER PASSWORD">

<button onclick="unlockBot()">OPEN BOT</button>

</div>

</div>

<div class="bot">

<div class="logoBox">

<div class="logo">QX</div>

<div class="title">ABU BAKAR TRADER</div>

<div class="sub">LIVE QUOTEX AI SIGNAL BOT</div>

<div class="monogram">🟡 QUOTEX LIVE SYSTEM</div>

</div>

<div class="select">

<select id="pair">

<option value="5.12">🇧🇷 USD/BRL OTC</option>
<option value="17.10">🇲🇽 USD/MXN OTC</option>
<option value="83.10">🇮🇳 USD/INR OTC</option>
<option value="278.50">🇵🇰 USD/PKR OTC</option>
<option value="1.08">🇺🇸 EUR/USD OTC</option>
<option value="1.27">🇬🇧 GBP/USD OTC</option>

</select>

</div>

<div class="select">

<select id="time">

<option value="15">15 Seconds</option>
<option value="20">20 Seconds</option>
<option value="30">30 Seconds</option>
<option value="60">1 Minute</option>
<option value="120">2 Minutes</option>

</select>

</div>

<div class="pairs">

<div class="pair">🇧🇷 USD/BRL</div>
<div class="pair">🇲🇽 USD/MXN</div>
<div class="pair">🇮🇳 USD/INR</div>
<div class="pair">🇵🇰 USD/PKR</div>
<div class="pair">🇺🇸 EUR/USD</div>
<div class="pair">🇬🇧 GBP/USD</div>

</div>

<div class="chart">

<div class="live">LIVE MARKET</div>

<div class="price" id="price">5.1200</div>

<div class="chartBars" id="bars"></div>

</div>

<button class="scan" onclick="signal()">GET SIGNAL</button>

<div class="signalBox">

<div class="signal wait" id="signalText">WAIT</div>

<div class="conf" id="confidence">0%</div>

<div class="info">

<div>RSI : <span id="rsi">0</span></div>

<div>EMA 9 : <span id="ema9">0</span></div>

<div>EMA 21 : <span id="ema21">0</span></div>

<div>MACD : <span id="macd">0</span></div>

<div>BOLLINGER : <span id="bb">0</span></div>

<div>MOMENTUM : <span id="momentum">0</span></div>

<div>TIMEFRAME : <span id="tf">15s</span></div>

</div>

</div>

<div class="footer">

<div class="online">
<div class="dot"></div>
LIVE ACTIVE
</div>

<div>QUOTEX AI</div>

</div>

</div>

<script>

const PASSWORD="786786";

function unlockBot(){

let p=document.getElementById("pass").value;

if(p===PASSWORD){

document.getElementById("lock").style.display="none";

}else{

alert("Wrong Password");

}

}

const bars=document.getElementById("bars");

for(let i=0;i<40;i++){

let d=document.createElement("div");

d.classList.add("bar");

d.classList.add(Math.random()>0.5?"green":"red");

d.style.height=(20+Math.random()*70)+"px";

d.style.animationDelay=(i*0.05)+"s";

bars.appendChild(d);

}

let currentPrice=5.1200;

let prices=[];

function livePrice(){

let base=parseFloat(document.getElementById("pair").value);

currentPrice+=(Math.random()-.5)*0.02;

if(currentPrice<0) currentPrice=base;

prices.push(currentPrice);

if(prices.length>60){

prices.shift();

}

document.getElementById("price").innerText=currentPrice.toFixed(4);

}

setInterval(livePrice,1000);

function EMA(period,data){

let k=2/(period+1);

let ema=data[0];

for(let i=1;i<data.length;i++){

ema=data[i]*k+ema*(1-k);

}

return ema;

}

function RSI(data,period=14){

if(data.length<period+1) return 50;

let gains=0;

let losses=0;

for(let i=1;i<period;i++){

let diff=data[i]-data[i-1];

if(diff>0){

gains+=diff;

}else{

losses-=diff;

}

}

let rs=gains/(losses||1);

return 100-(100/(1+rs));

}

function signal(){

if(prices.length<25){

alert("Loading Live Market Data...");

return;

}

let rsi=RSI(prices);

let ema9=EMA(9,prices);

let ema21=EMA(21,prices);

let macd=(ema9-ema21).toFixed(4);

let momentum=(prices[prices.length-1]-prices[0]).toFixed(4);

let bb=(Math.random()*2).toFixed(2);

let buy=0;

let sell=0;

if(rsi<40) buy+=2;
if(rsi>60) sell+=2;

if(ema9>ema21) buy+=2;
if(ema9<ema21) sell+=2;

if(momentum>0) buy+=1;
if(momentum<0) sell+=1;

let finalSignal="WAIT";
let className="wait";
let confidence=70;

if(buy>sell){

finalSignal="BUY";
className="buy";
confidence=85+buy;

}

if(sell>buy){

finalSignal="SELL";
className="sell";
confidence=85+sell;

}

document.getElementById("signalText").innerText=finalSignal;
document.getElementById("signalText").className="signal "+className;

document.getElementById("confidence").innerText=confidence+"%";

document.getElementById("rsi").innerText=rsi.toFixed(1);

document.getElementById("ema9").innerText=ema9.toFixed(4);

document.getElementById("ema21").innerText=ema21.toFixed(4);

document.getElementById("macd").innerText=macd;

document.getElementById("bb").innerText=bb;

document.getElementById("momentum").innerText=momentum;

document.getElementById("tf").innerText=document.getElementById("time").value+"s";

navigator.vibrate(200);

}

</script>

</body>
</html>
