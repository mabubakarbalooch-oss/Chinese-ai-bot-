<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Signal Generator</title>
<style>
    body { background:#0a0e13; font-family:sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
    
    .container { width: 90%; max-width: 500px; background:#0f1318; border:2px solid #00ff88; border-radius:25px; padding:25px; box-shadow:0 0 20px rgba(0,255,136,0.3); }
    
    h1 { color:#00ff88; font-size:22px; text-align:center; margin-bottom:20px; }
    .label { color:#8b949e; font-size:14px; margin:15px 0 5px 0; display:block; }
    select, input { width:100%; padding:15px; background:#1a1f26; border:1px solid #30363d; border-radius:12px; color:#fff; box-sizing:border-box; }
    
    .time-container { display:flex; gap:5px; margin:10px 0; }
    .time-btn { flex:1; padding:12px; background:#1a1f26; border:1px solid #30363d; border-radius:10px; color:#8b949e; cursor:pointer; text-align:center; font-size:13px; }
    .time-btn.active { border:1px solid #00ff88; color:#00ff88; background:rgba(0,255,136,0.1); }
    
    .gen-btn { width:100%; padding:18px; background:#00ff88; border:none; border-radius:12px; font-weight:bold; cursor:pointer; margin-top:20px; color:#000; }
    
    #signalBox { margin-top:20px; padding:15px; border-radius:12px; text-align:center; font-size:20px; font-weight:bold; display:none; }
    .buy-style { background:rgba(0, 255, 136, 0.2); border:1px solid #00ff88; color:#00ff88; }
    .sell-style { background:rgba(255, 68, 68, 0.2); border:1px solid #ff4444; color:#ff4444; }
</style>
</head>
<body>

<div id="loginScreen" class="container">
    <h2 style="color:#00ff88; text-align:center;">🔒 Access Locked</h2>
    <input type="password" id="pass" placeholder="Enter Password">
    <button class="gen-btn" onclick="login()">Unlock Now</button>
</div>

<div id="mainBoard" class="container" style="display:none;">
    <h1>🚀 Chinese Signal Generator</h1>
    
    <label class="label">Select Broker</label>
    <select><option>Quotex</option></select>
    
    <label class="label">Trading Asset</label>
    <select>
        <option>NZD/CHF (OTC)</option>
        <option>USD/BRL (OTC)</option>
        <option>USD/MXN (OTC)</option>
    </select>

    <label class="label">Time Frame</label>
    <div class="time-container">
        <div class="time-btn" onclick="setActive(this)">5s</div>
        <div class="time-btn active" onclick="setActive(this)">15s</div>
        <div class="time-btn" onclick="setActive(this)">30s</div>
        <div class="time-btn" onclick="setActive(this)">1m</div>
    </div>

    <button class="gen-btn" onclick="gen()">⚡ GENERATE SIGNAL ⚡</button>
    <div id="signalBox">---</div>
</div>

<script>
    function login() {
        if(document.getElementById('pass').value === "bakar786") {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainBoard').style.display = 'block';
        } else { alert("Wrong Password!"); }
    }
    
    function setActive(el) {
        document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }
    
    function gen() {
        let isBuy = Math.random() > 0.5;
        let box = document.getElementById('signalBox');
        box.style.display = 'block';
        box.innerText = isBuy ? "BUY SIGNAL" : "SELL SIGNAL";
        box.className = isBuy ? "buy-style" : "sell-style";
        
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.frequency.value = isBuy ? 600 : 300;
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
    }
</script>
</body>
</html>
