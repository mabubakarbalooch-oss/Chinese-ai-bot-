<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PAK AI SIGNAL X - FIXED PRO</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
:root {
    --sky:#00d4ff;
    --bg:#010a0f;
    --card:#02121c;
    --green:#00ff99;
    --red:#ff4757;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
    background:var(--bg);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    padding:10px;
}

.app{
    width:420px;
    background:var(--card);
    padding:20px;
    border-radius:25px;
    color:#fff;
}

input,select,button{
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:10px;
    border:none;
}

button{
    background:linear-gradient(135deg,#0088cc,var(--sky));
    font-weight:bold;
}

#chart{height:170px;margin-top:10px}

.result{
    display:none;
    text-align:center;
    margin-top:10px;
}

.sig{
    font-size:40px;
    font-weight:bold;
}
.small{
    font-size:12px;
    opacity:0.8;
}
</style>
</head>

<body>

<div class="app">

<h3>PAK AI SIGNAL BOT PRO</h3>

<input type="password" id="pass" placeholder="ENTER PASSWORD">
<button onclick="login()">LOGIN</button>

<div id="panel" style="display:none;">

<select id="asset" onchange="loadChart()">
<option value="USDBRL">USD/BRL</option>
<option value="USDINR">USD/INR</option>
<option value="USDPKR">USD/PKR</option>
</select>

<div id="chart"></div>

<button onclick="scan()">ANALYZE MARKET</button>

<div class="result" id="result">
    <div id="signal" class="sig">---</div>
    <div id="info" class="small"></div>
</div>

</div>
</div>

<script>
let prices = [];

/* ---------------------------
   CANDLE GENERATOR (SIMULATED)
----------------------------*/
function generateCandles(){
    prices = [];
    let base = 100;

    for(let i=0;i<60;i++){
        let noise = (Math.random()-0.5)*1.5;
        base += noise;
        prices.push(base);
    }
}

/* ---------------------------
   EMA CALCULATION
----------------------------*/
function EMA(period){
    let k = 2/(period+1);
    let ema = [prices[0]];

    for(let i=1;i<prices.length;i++){
        ema[i] = prices[i]*k + ema[i-1]*(1-k);
    }
    return ema;
}

/* ---------------------------
   RSI CALCULATION
----------------------------*/
function RSI(period=14){
    let gains=0, losses=0;

    for(let i=prices.length-period;i<prices.length;i++){
        let diff = prices[i]-prices[i-1];
        if(diff>0) gains+=diff;
        else losses-=diff;
    }

    let rs = gains/(losses||1);
    return 100 - (100/(1+rs));
}

/* ---------------------------
   LOGIN
----------------------------*/
function login(){
    if(document.getElementById("pass").value==="pak786"){
        document.getElementById("panel").style.display="block";
        loadChart();
    }else{
        alert("Wrong Password");
    }
}

/* ---------------------------
   CHART
----------------------------*/
function loadChart(){
    document.getElementById("chart").innerHTML="";
    new TradingView.widget({
        symbol:"FX_IDC:"+document.getElementById("asset").value,
        width:"100%",
        height:170,
        theme:"dark",
        container_id:"chart"
    });
}

/* ---------------------------
   SIGNAL ENGINE (FIXED)
----------------------------*/
function scan(){

    generateCandles();

    let ema12 = EMA(12).slice(-1)[0];
    let ema26 = EMA(26).slice(-1)[0];
    let rsi = RSI();

    let signal = "WAIT";
    let color = "#fff";

    /* MAIN LOGIC */
    if(ema12 > ema26 && rsi < 70 && rsi > 40){
        signal = "CALL";
        color = "#00ff99";
    }
    else if(ema12 < ema26 && rsi > 30 && rsi < 60){
        signal = "PUT";
        color = "#ff4757";
    }

    /* OUTPUT */
    document.getElementById("result").style.display="block";
    document.getElementById("signal").innerText=signal;
    document.getElementById("signal").style.color=color;

    document.getElementById("info").innerText =
        "RSI: " + rsi.toFixed(2) +
        " | EMA12: " + ema12.toFixed(2) +
        " | EMA26: " + ema26.toFixed(2);
}
</script>

</body>
</html>
