<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>ABU BAKAR VIP AI BOT</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Rajdhani',sans-serif;
}

body{
background:#030712;
display:flex;
justify-content:center;
padding:10px;
overflow-x:hidden;
color:#fff;
}

.app{
width:100%;
max-width:390px;
background:linear-gradient(180deg,#08111f,#030712);
border-radius:24px;
padding:14px;
border:1px solid rgba(255,170,0,0.15);
box-shadow:0 0 30px rgba(255,170,0,0.12);
}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:14px;
}

.logo{
font-family:'Orbitron',sans-serif;
font-size:16px;
font-weight:900;
line-height:1.4;
}

.logo span{
color:#ffaa00;
}

.vip{
background:#ffaa00;
color:#000;
padding:5px 10px;
border-radius:10px;
font-size:11px;
font-weight:bold;
}

/* MARKET */

.market{
background:#081120;
padding:14px;
border-radius:18px;
border:1px solid rgba(255,255,255,0.05);
}

select{
width:100%;
padding:12px;
background:#111c30;
border:none;
border-radius:12px;
color:#fff;
font-size:15px;
font-weight:bold;
outline:none;
}

.price{
text-align:center;
font-size:28px;
font-family:'Orbitron',sans-serif;
font-weight:900;
color:#ffaa00;
margin:14px 0;
}

canvas{
width:100%;
height:140px;
background:#050b18;
border-radius:14px;
}

/* SCAN */

.scan-box{
margin-top:14px;
background:#081120;
padding:12px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid rgba(255,170,0,0.1);
}

.scan-left{
display:flex;
align-items:center;
gap:12px;
}

.radar{
width:55px;
height:55px;
border-radius:50%;
border:2px solid #ffaa00;
position:relative;
box-shadow:0 0 15px rgba(255,170,0,0.3);
}

.radar::before{
content:'';
position:absolute;
inset:7px;
border-radius:50%;
border:2px dashed #ffaa00;
animation:spin 2s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

.scan-title{
font-size:17px;
font-weight:900;
color:#ffaa00;
}

.scan-sub{
font-size:11px;
color:#94a3b8;
}

.timer{
width:58px;
height:58px;
border-radius:50%;
border:3px solid rgba(255,170,0,0.2);
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
font-weight:900;
font-family:'Orbitron',sans-serif;
color:#ffaa00;
}

/* BUTTON */

.btn{
width:100%;
padding:15px;
margin-top:14px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#ffcc00,#ff7700);
font-size:15px;
font-family:'Orbitron',sans-serif;
font-weight:900;
color:#000;
box-shadow:0 0 20px rgba(255,170,0,0.35);
cursor:pointer;
}

/* RESULT */

.result{
margin-top:14px;
background:#081120;
padding:16px;
border-radius:18px;
border:1px solid rgba(255,170,0,0.1);
}

.signal{
text-align:center;
font-size:55px;
font-family:'Orbitron',sans-serif;
font-weight:900;
}

.buy{
color:#00e676;
text-shadow:0 0 20px rgba(0,230,118,0.5);
}

.sell{
color:#ff3b3b;
text-shadow:0 0 20px rgba(255,59,59,0.5);
}

.conf{
text-align:center;
margin-top:8px;
font-size:15px;
color:#ffaa00;
font-weight:bold;
}

/* INFO */

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:14px;
}

.box{
background:#0d1728;
padding:10px;
border-radius:12px;
font-size:12px;
border:1px solid rgba(255,255,255,0.05);
}

.box span{
float:right;
color:#ffaa00;
font-weight:bold;
}

/* FOOTER */

.footer{
display:flex;
justify-content:space-around;
margin-top:18px;
padding-top:12px;
border-top:1px solid rgba(255,255,255,0.05);
}

.footer div{
text-align:center;
font-size:10px;
color:#ffaa00;
font-weight:bold;
}

.footer i{
display:block;
font-size:20px;
margin-bottom:4px;
}

</style>
</head>

<body>

<div class="app">

<div class="header">
<div class="logo">
ABU BAKAR <br><span>VIP AI BOT</span>
</div>

<div class="vip">
VIP
</div>
</div>

<div class="market">

<select id="asset">

<option value="1.2472">USD/BRL OTC</option>
<option value="278.40">USD/PKR OTC</option>
<option value="83.20">USD/INR OTC</option>
<option value="17.80">USD/MXN OTC</option>
<option value="1.0820">EUR/USD</option>
<option value="1.2640">GBP/USD</option>

</select>

<div class="price" id="price">
1.24720
</div>

<canvas id="chart" width="350" height="140"></canvas>

</div>

<div class="scan-box">

<div class="scan-left">

<div class="radar"></div>

<div>
<div class="scan-title">
AI SCANNING
</div>

<div class="scan-sub">
Analyzing market trend...
</div>
</div>

</div>

<div class="timer" id="timer">
03
</div>

</div>

<button class="btn" onclick="getSignal()">
GET SIGNAL
</button>

<div class="result">

<div class="signal buy" id="signal">
CALL
</div>

<div class="conf" id="confidence">
92% CONFIDENCE
</div>

<div class="info">

<div class="box">
RSI <span id="rsi">62</span>
</div>

<div class="box">
TREND <span id="trend">UP</span>
</div>

<div class="box">
EMA 9 <span id="ema9">1.2478</span>
</div>

<div class="box">
EMA 21 <span id="ema21">1.2469</span>
</div>

</div>

</div>

<div class="footer">

<div>
<i>🏠</i>
HOME
</div>

<div>
<i>📊</i>
CHART
</div>

<div>
<i>🎯</i>
SIGNAL
</div>

<div>
<i>⚙️</i>
SETTING
</div>

</div>

</div>

<script>

let price=1.2472;
let candles=[];

const canvas=document.getElementById("chart");
const ctx=canvas.getContext("2d");

function init(){

price=parseFloat(document.getElementById("asset").value);

candles=[];

for(let i=0;i<70;i++){

price+=(Math.random()-0.5)*0.003;

candles.push(price);

}

drawChart();

setInterval(updateMarket,700);

}

document.getElementById("asset").onchange=function(){

price=parseFloat(this.value);

candles=[];

init();

};

function updateMarket(){

price+=(Math.random()-0.5)*0.002;

candles.push(price);

if(candles.length>80){
candles.shift();
}

document.getElementById("price").innerText=
price.toFixed(5);

drawChart();

}

function drawChart(){

ctx.clearRect(0,0,canvas.width,canvas.height);

let max=Math.max(...candles);
let min=Math.min(...candles);

for(let i=0;i<candles.length;i++){

let x=(i/candles.length)*canvas.width;

let y=canvas.height-
((candles[i]-min)/(max-min))*canvas.height;

ctx.fillStyle=
candles[i]>candles[i-1]
? "#00e676"
: "#ff3b3b";

ctx.fillRect(x,y,3,canvas.height-y);

}

}

function RSI(arr){

let gain=0;
let loss=0;

for(let i=1;i<arr.length;i++){

let d=arr[i]-arr[i-1];

if(d>0) gain+=d;
else loss-=d;

}

let rs=gain/(loss||1);

return 100-(100/(1+rs));

}

function EMA(arr,p){

let k=2/(p+1);

let e=arr[0];

for(let i=1;i<arr.length;i++){

e=arr[i]*k+e*(1-k);

}

return e;

}

function getSignal(){

let timer=3;

document.getElementById("timer").innerText="03";

let t=setInterval(()=>{

timer--;

document.getElementById("timer").innerText=
"0"+timer;

if(timer<=0){

clearInterval(t);

let rsi=RSI(candles);

let ema9=EMA(candles,9);

let ema21=EMA(candles,21);

let signal=
ema9>ema21 ? "CALL" : "PUT";

document.getElementById("signal").innerText=
signal;

document.getElementById("signal").className=
signal==="CALL"
? "signal buy"
: "signal sell";

document.getElementById("confidence").innerText=
(90+Math.floor(Math.random()*8))
+"% CONFIDENCE";

document.getElementById("rsi").innerText=
rsi.toFixed(2);

document.getElementById("trend").innerText=
ema9>ema21 ? "UP" : "DOWN";

document.getElementById("ema9").innerText=
ema9.toFixed(5);

document.getElementById("ema21").innerText=
ema21.toFixed(5);

}

},1000);

}

init();

</script>

</body>
</html>
