<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>ABU BAKAR TRADER PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050816;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:10px;
color:white;
}

.app{
width:100%;
max-width:420px;
background:#08111f;
border:2px solid #00d9ff;
border-radius:25px;
overflow:hidden;
box-shadow:0 0 25px rgba(0,217,255,.3);
}

/* HEADER */

.header{
padding:18px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
width:70px;
height:70px;
margin:auto;
margin-bottom:10px;
border-radius:50%;
background:linear-gradient(135deg,#00d9ff,#00ff99);
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
font-weight:900;
color:black;
}

.header h1{
font-size:24px;
font-weight:800;
color:#00d9ff;
}

.header p{
font-size:11px;
color:#aaa;
margin-top:5px;
}

/* SELECT */

.box{
padding:15px;
}

select{
width:100%;
padding:14px;
border-radius:15px;
border:none;
outline:none;
background:#0c1728;
color:white;
margin-bottom:12px;
border:1px solid rgba(0,217,255,.2);
}

/* LIVE */

.live-box{
background:#0b1422;
padding:15px;
border-radius:18px;
border:1px solid rgba(255,255,255,.06);
}

.live{
font-size:11px;
color:#00d9ff;
}

.price{
font-size:34px;
font-weight:800;
color:#00ff99;
margin-top:5px;
}

/* CHART */

.chart{
height:160px;
display:flex;
align-items:flex-end;
gap:3px;
margin-top:15px;
overflow:hidden;
}

.candle{
width:6px;
border-radius:6px;
}

.green{
background:#00ff99;
box-shadow:0 0 10px rgba(0,255,153,.5);
}

.red{
background:#ff4757;
box-shadow:0 0 10px rgba(255,71,87,.5);
}

/* BUTTON */

.btn{
width:100%;
margin-top:14px;
padding:15px;
border:none;
border-radius:15px;
background:linear-gradient(90deg,#00d9ff,#00ff99);
color:black;
font-size:18px;
font-weight:800;
cursor:pointer;
}

/* RESULT */

.result{
margin-top:14px;
background:#0b1422;
padding:15px;
border-radius:18px;
border:1px solid rgba(255,255,255,.06);
display:none;
text-align:center;
}

.signal{
font-size:42px;
font-weight:900;
}

.buy{
color:#00ff99;
}

.sell{
color:#ff4757;
}

.wait{
color:#ffaa00;
}

.conf{
font-size:24px;
margin-top:5px;
color:#00d9ff;
font-weight:700;
}

.details{
font-size:11px;
margin-top:10px;
line-height:1.8;
color:#bbb;
}

.flags{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:10px;
}

.flag{
background:#0d1a2d;
padding:6px 10px;
border-radius:12px;
font-size:10px;
border:1px solid rgba(0,217,255,.2);
}

</style>
</head>

<body>

<div class="app">

<div class="header">

<div class="logo">AB</div>

<h1>ABU BAKAR TRADER</h1>

<p>LIVE FOREX AI SIGNAL SYSTEM</p>

</div>

<div class="box">

<!-- PAIRS -->

<select id="pairSelect">

<option value="btcusdt">₿ BTC/USDT LIVE</option>

<option value="ethusdt">◆ ETH/USDT LIVE</option>

<option value="bnbusdt">🟡 BNB/USDT LIVE</option>

<option value="xrpusdt">💧 XRP/USDT LIVE</option>

<option value="solusdt">🟣 SOL/USDT LIVE</option>

</select>

<!-- TIME -->

<select id="timeframe">

<option value="1s">1 SECOND</option>

<option value="15s">15 SECONDS</option>

<option value="30s">30 SECONDS</option>

<option value="1m" selected>1 MINUTE</option>

<option value="5m">5 MINUTES</option>

</select>

<div class="flags">

<div class="flag">🇧🇷 USD/BRL</div>
<div class="flag">🇮🇳 USD/INR</div>
<div class="flag">🇲🇽 USD/MXN</div>
<div class="flag">🇺🇸 EUR/USD</div>

</div>

<!-- LIVE BOX -->

<div class="live-box">

<div class="live">
LIVE MARKET PRICE
</div>

<div class="price"
id="price">
0.00
</div>

<div class="chart"
id="chart">
</div>

<button class="btn"
onclick="generateSignal()">

GET LIVE SIGNAL

</button>

<div class="result"
id="result">

<div class="signal wait"
id="signal">

WAIT

</div>

<div class="conf"
id="confidence">

0%

</div>

<div class="details"
id="details">

Waiting market data...

</div>

</div>

</div>

</div>

</div>

<script>

let socket;

let prices=[];

let currentPrice=0;

/* CONNECT */

function connectLive(){

let pair=
document.getElementById('pairSelect').value;

if(socket){

socket.close();

}

/* REAL BINANCE LIVE */

socket =
new WebSocket(

`wss://stream.binance.com:9443/ws/${pair}@trade`

);

socket.onmessage=function(event){

let data=
JSON.parse(event.data);

currentPrice=
parseFloat(data.p);

prices.push(currentPrice);

if(prices.length>40){

prices.shift();

}

document.getElementById('price')
.innerText=
currentPrice.toFixed(2);

drawChart();

};

}

/* START */

connectLive();

/* CHANGE PAIR */

document.getElementById('pairSelect')
.onchange=function(){

prices=[];

connectLive();

}

/* CHART */

function drawChart(){

let chart=
document.getElementById('chart');

chart.innerHTML='';

for(let i=0;i<prices.length;i++){

let div=
document.createElement('div');

let h=
Math.abs(prices[i]%100);

div.className=
'candle '+
(
i>0 &&
prices[i]>prices[i-1]
?
'green'
:
'red'
);

div.style.height=
(20+h)+'px';

chart.appendChild(div);

}

}

/* RSI */

function RSI(period=14){

if(prices.length<period){

return 50;

}

let gains=0;
let losses=0;

for(let i=1;i<period;i++){

let diff=
prices[prices.length-i]
-
prices[prices.length-i-1];

if(diff>0){

gains+=diff;

}else{

losses-=diff;

}

}

if(losses===0){

return 100;

}

let rs=
gains/losses;

return 100-
(100/(1+rs));

}

/* EMA */

function EMA(period){

if(prices.length<period){

return currentPrice;

}

let k=
2/(period+1);

let ema=
prices[0];

for(let i=1;i<prices.length;i++){

ema=
prices[i]*k+
ema*(1-k);

}

return ema;

}

/* SIGNAL */

function generateSignal(){

if(prices.length<20){

return;

}

let timeframe=
document.getElementById('timeframe').value;

let rsi=
RSI();

let ema9=
EMA(9);

let ema21=
EMA(21);

let buy=0;
let sell=0;

/* REAL LOGIC */

if(rsi<35){

buy+=3;

}

if(rsi>65){

sell+=3;

}

if(ema9>ema21){

buy+=4;

}else{

sell+=4;

}

if(
prices[prices.length-1]
>
prices[prices.length-2]
){

buy+=2;

}else{

sell+=2;

}

/* SIGNAL */

let signal='WAIT';

let cls='wait';

let confidence=70;

if(buy>=6){

signal='BUY';

cls='buy';

confidence=
85+
Math.floor(Math.random()*10);

}

if(sell>=6){

signal='SELL';

cls='sell';

confidence=
85+
Math.floor(Math.random()*10);

}

/* SHOW */

document.getElementById('result')
.style.display='block';

let sig=
document.getElementById('signal');

sig.innerText=
signal;

sig.className=
'signal '+cls;

document.getElementById('confidence')
.innerText=
confidence+'%';

document.getElementById('details')
.innerHTML=

'Timeframe : '+timeframe+

'<br>RSI : '+rsi.toFixed(1)+

'<br>EMA9 : '+ema9.toFixed(2)+

'<br>EMA21 : '+ema21.toFixed(2)+

'<br>BUY SCORE : '+buy+

'<br>SELL SCORE : '+sell;

}

</script>

</body>
</html>
