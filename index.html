<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAK AI SIGNAL X - PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root { --gold: #ffd700; --bg: #0a0e27; --card: #151f30; --accent: #00d4ff; --green: #00ff88; --red: #ff4757; }
    body { background: var(--bg); color: #e0e0e0; font-family: 'Poppins', sans-serif; margin: 0; padding: 15px; }
    .container { max-width: 400px; margin: auto; background: var(--card); border: 2px solid var(--gold); border-radius: 25px; padding: 25px; box-shadow: 0 0 40px rgba(255,215,0,0.2); }
    h1 { text-align: center; color: var(--gold); font-family: 'Orbitron', sans-serif; font-size: 20px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
    .label { font-size: 10px; color: var(--accent); text-transform: uppercase; margin-bottom: 5px; margin-top: 15px; }
    select, button { width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid rgba(255,215,0,0.3); background: #0a1628; color: #fff; font-family: inherit; font-weight: 600; }
    button { background: linear-gradient(135deg, var(--gold), #ffaa00); color: #000; font-family: 'Orbitron', sans-serif; font-weight: 900; margin-top: 20px; cursor: pointer; border: none; }
    .result-box { display: none; margin-top: 20px; padding: 20px; border-radius: 15px; text-align: center; border: 2px solid var(--gold); }
    .signal { font-size: 32px; font-weight: 900; font-family: 'Orbitron', sans-serif; margin-bottom: 10px; }
    .chart-container { height: 80px; display: flex; align-items: flex-end; gap: 5px; margin-top: 15px; }
    .candle { flex: 1; border-radius: 2px; }
</style>
</head>
<body>

<div class="container">
    <h1>PAK AI SIGNAL X 🐅</h1>
    
    <div class="label">Select Market</div>
    <select id="market">
        <option value="forex">Forex Live (EUR/USD, USD/INR, USD/PKR)</option>
        <option value="binance">Binance Crypto</option>
    </select>

    <div class="label">Select Asset</div>
    <select id="asset">
        <option value="EURUSD">EUR/USD</option>
        <option value="USDINR">USD/INR</option>
        <option value="USDPKR">USD/PKR</option>
        <option value="BTCUSDT">BTC/USDT</option>
    </select>

    <button onclick="analyzeMarket()">⚡ LIVE SCAN NOW</button>

    <div id="resultBox" class="result-box">
        <div id="signalText" class="signal">--</div>
        <div id="rsiValue">RSI: --</div>
        <div class="chart-container" id="chartPreview"></div>
    </div>
</div>

<script>
function analyzeMarket() {
    const box = document.getElementById('resultBox');
    const signalText = document.getElementById('signalText');
    const chart = document.getElementById('chartPreview');
    
    box.style.display = 'block';
    // Random signal simulation for demo purposes
    let rsi = Math.floor(Math.random() * 100);
    document.getElementById('rsiValue').innerText = "RSI Level: " + rsi;
    
    if (rsi < 30) {
        signalText.innerText = "BUY 🟢";
        signalText.style.color = "var(--green)";
    } else if (rsi > 70) {
        signalText.innerText = "SELL 🔴";
        signalText.style.color = "var(--red)";
    } else {
        signalText.innerText = "WAIT ⚪";
        signalText.style.color = "var(--accent)";
    }

    // Chart Preview
    chart.innerHTML = '';
    for(let i=0; i<10; i++) {
        let h = Math.random() * 60 + 10;
        let c = document.createElement('div');
        c.className = 'candle';
        c.style.height = h + 'px';
        c.style.background = Math.random() > 0.5 ? 'var(--green)' : 'var(--red)';
        chart.appendChild(c);
    }
}
</script>
</body>
</html>
