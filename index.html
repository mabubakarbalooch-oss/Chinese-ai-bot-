<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Signal Generator</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
    body { background:#0a0e13; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }

    .card { background:#0f1318; border:1px solid #1f252d; border-radius:24px; padding:30px; width:100%; max-width:380px; text-align:center; color:#fff; }
    h1 { color:#00ff88; font-size:20px; margin-bottom:15px; }
    .select-box { width:100%; padding:12px; background:#1a1f26; border:1px solid #30363d; border-radius:12px; color:#fff; margin-bottom:15px; }
    
    .gen-btn { width:100%; padding:16px; background:linear-gradient(90deg, #00ff88, #00d977); border:none; border-radius:12px; font-weight:700; cursor:pointer; margin-top:10px; }
    
    #signalArea { margin-top:20px; padding:15px; border-radius:12px; background:#1a1f26; display:none; border:1px solid #00ff88; }
    .indicator-row { display:flex; justify-content:space-between; margin-bottom:10px; font-size:13px; color:#8b949e; }
    .result-text { font-size:22px; font-weight:700; margin-top:10px; }
</style>
</head>
<body>

<div class="card">
    <h1>🚀 AI Signal Generator</h1>
    <select class="select-box" id="asset">
        <option>NZD/CHF (OTC)</option>
        <option>EUR/USD</option>
        <option>GBP/USD</option>
    </select>

    <button class="gen-btn" onclick="generate()">⚡ ANALYZE MARKET</button>

    <div id="signalArea">
        <div class="indicator-row">
            <span>RSI (14):</span> <span id="rsiVal">--</span>
        </div>
        <div class="indicator-row">
            <span>Moving Avg:</span> <span id="maVal">--</span>
        </div>
        <div id="resSignal" class="result-text">---</div>
    </div>
</div>

<script>
    function generate() {
        // RSI اور MA کی رینڈم ویلیوز جنریٹ کرنا
        let rsi = Math.floor(Math.random() * (75 - 25) + 25);
        let trend = Math.random() > 0.5 ? "Bullish" : "Bearish";
        
        // سگنل لاجک: اگر RSI 30 سے کم ہے تو BUY، اگر 70 سے زیادہ ہے تو SELL
        let signal = (rsi < 35) ? "BUY (Strong)" : (rsi > 65) ? "SELL (Strong)" : "WAIT";
        let conf = Math.floor(Math.random() * 8 + 91);
        
        document.getElementById('signalArea').style.display = 'block';
        document.getElementById('rsiVal').innerText = rsi;
        document.getElementById('maVal').innerText = trend;
        
        let resText = document.getElementById('resSignal');
        resText.innerText = (signal === "WAIT") ? "MARKET STABLE - WAIT" : signal + " " + conf + "%";
        resText.style.color = (signal.includes("BUY")) ? "#00ff88" : (signal.includes("SELL")) ? "#ff4444" : "#ffffff";
    }
</script>

</body>
</html>
