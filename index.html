<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese AI Bot Pro v3.0</title>
    <style>
        :root {
            --primary: #ffc107;
            --bg: #0a0a0b;
            --card: #16161a;
            --success: #00ff88;
            --danger: #ff4d4d;
        }

        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
        }

        /* Glassmorphism Effect */
        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-box, .bot-card {
            background: var(--card);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 193, 7, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .header-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .status-dot {
            height: 8px;
            width: 8px;
            background-color: var(--success);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--success);
            margin-right: 5px;
        }

        .status-text {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* Inputs & Buttons */
        input, select {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 12px;
            background: #222;
            color: white;
            border: 1px solid #333;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); }

        button {
            background: var(--primary);
            color: black;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
        }

        button:active { transform: scale(0.98); }
        button:hover { box-shadow: 0 0 20px rgba(255, 193, 7, 0.4); }

        /* Results Area */
        #result {
            margin-top: 20px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            font-size: 22px;
            font-weight: bold;
            transition: 0.5s;
        }

        .loader-bar {
            width: 100%;
            height: 4px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            display: none;
            margin-top: 10px;
        }

        .loader-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 1.5s linear;
        }

        #tv-frame {
            border-radius: 16px;
            margin: 15px 0;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login Section -->
        <div id="loginSection" class="login-box">
            <div style="font-size: 50px; margin-bottom: 10px;">🔐</div>
            <h2 style="margin: 0;">AI ENCRYPTION</h2>
            <p style="color: #666; font-size: 14px;">Enter Access Key for Chinese Server v3.0</p>
            <input type="password" id="passInput" placeholder="Password...">
            <button onclick="checkPass()">Unlock Dashboard</button>
            <p id="error" style="color: var(--danger); display: none; font-size: 13px; margin-top: 10px;">❌ Invalid Access Key!</p>
        </div>

        <!-- Bot Main Content -->
        <div id="botContent" style="display: none;">
            <div class="bot-card">
                <div class="header-title">Chinese AI Bot</div>
                <div class="status-text"><span class="status-dot"></span> Signal Server: Active</div>
                
                <select id="assetSelect" onchange="updateChart()">
                    <option value="FX:EURUSD">EUR/USD (OTC)</option>
                    <option value="FX:GBPUSD">GBP/USD (OTC)</option>
                    <option value="FX:USDJPY">USD/JPY</option>
                    <option value="CRYPTOCAP:BTC">BITCOIN</option>
                </select>

                <iframe id="tv-frame" src="https://s.tradingview.com/widgetembed/?symbol=FX%3AEURUSD&interval=1&theme=dark" width="100%" height="300" frameborder="0"></iframe>

                <button id="analyzeBtn" onclick="getSignal()">Start Market Analysis</button>
                
                <div id="loader" class="loader-bar"><div id="fill" class="loader-fill"></div></div>
                <div id="result"></div>
            </div>
        </div>
    </div>

    <script>
        function checkPass() {
            const pass = document.getElementById("passInput").value;
            if(pass === "Mybot786") {
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("botContent").style.display = "block";
            } else {
                const err = document.getElementById("error");
                err.style.display = "block";
                setTimeout(() => err.style.display = "none", 2000);
            }
        }

        function updateChart() {
            const pair = document.getElementById("assetSelect").value;
            document.getElementById("tv-frame").src = `https://s.tradingview.com/widgetembed/?symbol=${pair}&interval=1&theme=dark`;
        }

        function getSignal() {
            const res = document.getElementById("result");
            const loader = document.getElementById("loader");
            const fill = document.getElementById("fill");
            const btn = document.getElementById("analyzeBtn");

            btn.disabled = true;
            btn.innerText = "Scanning Market...";
            res.innerHTML = "SYSTEM CALCULATING...";
            res.style.color = "#ffc107";
            res.style.background = "transparent";
            
            loader.style.display = "block";
            setTimeout(() => fill.style.width = "100%", 100);

            setTimeout(function() {
                const sigs = ["↑ CALL / BUY", "↓ PUT / SELL"];
                const pick = sigs[Math.floor(Math.random() * sigs.length)];
                const accuracy = Math.floor(Math.random() * (98 - 85 + 1) + 85);
                
                fill.style.width = "0%";
                loader.style.display = "none";
                btn.disabled = false;
                btn.innerText = "Start Market Analysis";

                res.innerHTML = `<div>${pick}</div><div style="font-size:12px; opacity:0.7">Accuracy: ${accuracy}% | 1 MIN</div>`;
                
                if(pick.includes("CALL")) {
                    res.style.color = "#00ff88";
                    res.style.background = "rgba(0, 255, 136, 0.1)";
                    res.style.border = "1px solid rgba(0, 255, 136, 0.3)";
                } else {
                    res.style.color = "#ff4d4d";
                    res.style.background = "rgba(255, 77, 77, 0.1)";
                    res.style.border = "1px solid rgba(255, 77, 77, 0.3)";
                }
            }, 2000);
        }
    </script>
</body>
</html>
