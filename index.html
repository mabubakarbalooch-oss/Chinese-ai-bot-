<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🇵🇰 PAK PRO SIGNAL BOT</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Inter',sans-serif;

background:
radial-gradient(circle at top,#013220,#000);

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:15px;

overflow-x:hidden;

color:white;
}

.container{
width:100%;
max-width:460px;
}

.card{

background:rgba(0,20,10,0.92);

border:1px solid rgba(0,255,153,0.2);

border-radius:30px;

padding:22px;

backdrop-filter:blur(15px);

box-shadow:
0 0 35px rgba(0,255,153,0.2);
}

.logo{

font-size:60px;

text-align:center;

margin-bottom:10px;
}

.title{

text-align:center;

font-family:'Orbitron',sans-serif;

font-size:24px;

font-weight:900;

margin-bottom:18px;

background:
linear-gradient(90deg,#ffffff,#00ff99);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;
}

.badge{

display:flex;

justify-content:center;
align-items:center;

gap:8px;

padding:8px 14px;

border-radius:50px;

background:rgba(0,255,153,0.08);

border:1px solid rgba(0,255,153,0.2);

margin-bottom:18px;

font-size:11px;

font-weight:800;
}

.dot{

width:8px;
height:8px;

background:#00ff99;

border-radius:50%;

animation:blink 1s infinite;
}

@keyframes blink{

0%,100%{
opacity:1;
}

50%{
opacity:0.2;
}

}

.clock{

text-align:center;

margin-bottom:15px;

font-size:14px;

font-weight:bold;
}

.input,
select{

width:100%;

padding:15px;

border:none;

outline:none;

border-radius:20px;

background:#071d12;

color:white;

font-size:15px;

margin-bottom:15px;

border:1px solid rgba(0,255,153,0.12);
}

iframe{

width:100%;

height:240px;

border:none;

border-radius:22px;

background:black;

margin-bottom:15px;
}

.btn{

width:100%;

padding:16px;

border:none;

border-radius:30px;

font-family:'Orbitron',sans-serif;

font-size:13px;

font-weight:900;

letter-spacing:1px;

background:
linear-gradient(90deg,#00994d,#00d26f);

color:white;

cursor:pointer;

transition:0.3s;

box-shadow:
0 0 20px rgba(0,255,153,0.4);
}

.btn:hover{

transform:translateY(-2px);

box-shadow:
0 0 30px rgba(0,255,153,0.7);

}

.loader{

margin-top:15px;

width:100%;

height:5px;

background:#062014;

border-radius:20px;

overflow:hidden;

display:none;
}

.fill{

width:0%;

height:100%;

background:
linear-gradient(90deg,#00aa55,#00ff99);

transition:2s;
}

.result{

display:none;

margin-top:20px;

padding:20px;

border-radius:24px;

background:rgba(0,30,12,0.8);

border:1px solid rgba(0,255,153,0.2);
}

.signal{

font-family:'Orbitron',sans-serif;

font-size:32px;

font-weight:900;

text-align:center;

margin-bottom:12px;

text-shadow:
0 0 15px currentColor,
0 0 25px currentColor;

animation:pulse 1s infinite;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.04);
}

100%{
transform:scale(1);
}

}

.info{

margin-top:8px;

font-size:13px;

font-weight:bold;
}

.note{

margin-top:18px;

font-size:10px;

line-height:1.6;

padding:12px;

border-radius:16px;

background:rgba(255,255,255,0.03);
}

.powerWrap{

margin-top:15px;

height:10px;

border-radius:20px;

overflow:hidden;

background:#111;
}

.powerBar{

height:100%;

width:90%;

background:
linear-gradient(90deg,#00ff99,#00ccff);

border-radius:20px;

transition:1s;
}

</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div class="card" id="loginBox">

<div class="logo">🇵🇰</div>

<div class="title">
PAK PRO SIGNAL BOT
</div>

<input
type="password"
id="password"
class="input"
placeholder="ENTER ACCESS KEY">

<button
class="btn"
onclick="loginBot()">

ENTER BOT

</button>

<div class="note">

🔐 ACCESS KEY:
<b style="color:#00ff99;">Pak786</b>

</div>

</div>

<!-- MAIN -->

<div class="card" id="mainBot" style="display:none;">

<div class="clock" id="clock"></div>

<div class="badge">

<div class="dot"></div>

LIVE MARKET SIGNAL

</div>

<div class="title">
PAK PRO SIGNAL BOT
</div>

<select id="pair" onchange="updateChart()">

<option value="FX:EURUSD">EUR/USD</option>

<option value="FX:GBPUSD">GBP/USD</option>

<option value="FX:USDJPY">USD/JPY</option>

<option value="FX:AUDUSD">AUD/USD</option>

</select>

<iframe id="chart" allowfullscreen></iframe>

<button
class="btn"
id="scanBtn"
onclick="generateSignal()">

⚡ SCAN SIGNAL

</button>

<div class="loader" id="loader">
<div class="fill" id="fill"></div>
</div>

<div class="result" id="resultBox">

<div class="signal" id="signalText">
---
</div>

<div class="info" id="accuracy">
CONFIDENCE: --%
</div>

<div class="info" id="marketData">
ANALYZING...
</div>

<div class="info" id="strategy">
WAITING...
</div>

<div class="powerWrap">
<div class="powerBar" id="powerBar"></div>
</div>

</div>

<div class="note">

🎯 RSI + MACD + EMA + TREND FILTER ACTIVE

</div>

</div>

</div>

<script>

// LOGIN

function loginBot(){

const pwd =
document.getElementById('password').value.trim();

if(pwd === "Pak786"){

document.getElementById('loginBox').style.display = "none";

document.getElementById('mainBot').style.display = "block";

updateChart();

}else{

alert("❌ WRONG PASSWORD");

}

}

// ENTER KEY

document
.getElementById('password')
.addEventListener('keypress',function(e){

if(e.key === "Enter"){
loginBot();
}

});

// CLOCK

setInterval(()=>{

const now = new Date();

document.getElementById('clock').innerHTML =
"🕒 " + now.toLocaleTimeString();

},1000);

// CHART

function updateChart(){

const pair =
document.getElementById('pair').value;

document.getElementById('chart').src =

`https://s.tradingview.com/widgetembed/?symbol=${pair}&interval=1&theme=dark`;

}

// SIGNAL

function generateSignal(){

const btn =
document.getElementById('scanBtn');

const loader =
document.getElementById('loader');

const fill =
document.getElementById('fill');

const result =
document.getElementById('resultBox');

btn.disabled = true;

btn.innerHTML =
"📡 ANALYZING...";

loader.style.display = "block";

result.style.display = "none";

fill.style.width = "0%";

setTimeout(()=>{
fill.style.width = "100%";
},50);

// DATA

let rsi =
Math.floor(Math.random()*40)+30;

let macd =
(Math.random()*2-1).toFixed(2);

let volatility =
Math.floor(Math.random()*40)+60;

let confidence =
90 + Math.floor(Math.random()*7);

let signal =
"🟢 STRONG CALL";

let color =
"#00ff99";

let strategy =
"🔥 BUY PRESSURE ACTIVE";

// PUT

if(macd < 0){

signal =
"🔴 STRONG PUT";

color =
"#ff4444";

strategy =
"📉 SELL PRESSURE ACTIVE";

}

// RESULT

setTimeout(()=>{

loader.style.display = "none";

btn.disabled = false;

btn.innerHTML =
"⚡ SCAN SIGNAL";

result.style.display = "block";

const signalText =
document.getElementById('signalText');

signalText.innerHTML =
signal;

signalText.style.color =
color;

document.getElementById('accuracy').innerHTML =

`🎯 CONFIDENCE:
${confidence}%`;

document.getElementById('accuracy').style.color =
color;

document.getElementById('marketData').innerHTML =

`📊 RSI:
${rsi}
 | MACD:
${macd}
 | VOLATILITY:
${volatility}%`;

document.getElementById('strategy').innerHTML =
strategy;

document.getElementById('powerBar').style.width =
confidence + "%";

result.style.borderColor =
color;

},2200);

}

</script>

</body>
</html>
