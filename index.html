<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ABU BAKAR TRADER - SPREADSHEET v1.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Roboto Mono', monospace;
}

body{
background:#f0f0f0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:#000;
}

.spreadsheet{
width:380px;
height:640px;
background:#ffffff;
border:1px solid #000;
position:relative;
}

/* Menu bar */
.menu-bar{
background:#e0e0e0;
border-bottom:1px solid #000;
padding:6px 10px;
font-size:12px;
display:flex;
gap:20px;
}
.menu-bar span{
cursor:pointer;
padding:2px 6px;
}
.menu-bar span:hover{
background:#000;
color:#fff;
}

/* Toolbar */
.toolbar{
background:#f5f5f5;
border-bottom:1px solid #000;
padding:8px 10px;
display:flex;
gap:10px;
align-items:center;
}
.toolbar-btn{
padding:4px 10px;
border:1px solid #000;
background:#ffffff;
font-size:12px;
cursor:pointer;
}
.toolbar-btn:active{
background:#000;
color:#fff;
}

/* Formula bar */
.formula-bar{
background:#ffffff;
border-bottom:1px solid #000;
padding:6px 10px;
display:flex;
align-items:center;
gap:10px;
font-size:13px;
}
.formula-bar input{
flex:1;
border:1px solid #000;
padding:4px 6px;
font-family:'Roboto Mono', monospace;
outline:none;
}

.content{
padding:15px;
}

/* Table style */
.table{
width:100%;
border-collapse:collapse;
margin-bottom:15px;
}
.table th{
background:#000;
color:#ffffff;
padding:8px;
text-align:left;
font-size:12px;
font-weight:700;
border:1px solid #000;
}
.table td{
border:1px solid #000;
padding:8px;
font-size:13px;
background:#ffffff;
}
.table tr:nth-child(even) td{
background:#f5f5f5;
}

.big-display{
border:2px solid #000;
padding:20px;
text-align:center;
margin:15px 0;
background:#ffffff;
}
.big-display .label{
font-size:11px;
text-transform:uppercase;
letter-spacing:1px;
margin-bottom:5px;
}
.big-display .value{
font-size:36px;
font-weight:700;
}

.signal-row{
display:flex;
gap:10px;
margin:15px 0;
}
.signal-box{
flex:1;
border:2px solid #000;
padding:15px;
text-align:center;
}
.signal-box.black{
background:#000;
color:#ffffff;
}

.btn{
width:100%;
padding:10px;
background:#ffffff;
border:2px solid #000;
font-family:'Roboto Mono', monospace;
font-size:13px;
font-weight:700;
cursor:pointer;
margin:5px 0;
}
.btn:active{
background:#000;
color:#ffffff;
}

.status-bar{
position:absolute;
bottom:0;
left:0;
right:0;
background:#000;
color:#ffffff;
padding:5px 10px;
font-size:11px;
display:flex;
justify-content:space-between;
}

.lock-screen{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:#f0f0f0;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}
.lock-box{
width:90%;
max-width:320px;
border:2px solid #000;
background:#ffffff;
padding:25px;
}
.lock-input{
width:100%;
padding:10px;
border:1px solid #000;
background:#ffffff;
font-family:'Roboto Mono', monospace;
margin:12px 0;
outline:none;
}
.lock-btn{
width:100%;
padding:10px;
border:2px solid #000;
background:#000;
color:#ffffff;
font-weight:700;
cursor:pointer;
}
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <div style="text-align:center;font-weight:700;margin-bottom:15px;">
      ABU BAKAR TRADER
    </div>
    <div style="font-size:12px;margin-bottom:8px;">Password:</div>
    <input type="password" id="passInput" class="lock-input">
    <button class="lock-btn" onclick="unlock()">LOGIN</button>
  </div>
</div>

<div class="spreadsheet" id="botApp" style="display:none;">
  
  <div class="menu-bar">
    <span>File</span>
    <span>Edit</span>
    <span>View</span>
    <span>Tools</span>
    <span>Help</span>
  </div>

  <div class="toolbar">
    <button class="toolbar-btn">Save</button>
    <button class="toolbar-btn">Refresh</button>
    <button class="toolbar-btn">Export</button>
  </div>

  <div class="formula-bar">
    <span>fx</span>
    <input type="text" value="=ANALYZE(MARKET)" readonly>
  </div>

  <div class="content">
    
    <table class="table">
      <tr>
        <th>Parameter</th>
        <th>Value</th>
      </tr>
      <tr>
        <td>Pair</td>
        <td>USD/BRL OTC</td>
      </tr>
      <tr>
        <td>Price</td>
        <td id="price">1.2476</td>
      </tr>
      <tr>
        <td>RSI(14)</td>
        <td id="rsi">72</td>
      </tr>
      <tr>
        <td>Trend</td>
        <td>UP</td>
      </tr>
    </table>

    <div class="big-display">
      <div class="label">Signal</div>
      <div class="value" id="signal">BUY</div>
      <div style="font-size:13px;margin-top:5px;" id="confidence">Confidence: 96%</div>
    </div>

    <div class="signal-row">
      <div class="signal-box">
        <div style="font-size:11px;">Timer</div>
        <div style="font-size:24px;font-weight:700;" id="timer">03</div>
      </div>
      <div class="signal-box black">
        <div style="font-size:11px;">Status</div>
        <div style="font-size:16px;font-weight:700;">READY</div>
      </div>
    </div>

    <button class="btn" onclick="getSignal()">RUN ANALYSIS</button>
    <button class="btn">CLEAR DATA</button>

  </div>

  <div class="status-bar">
    <span>Ready</span>
    <span>Sheet 1</span>
  </div>

</div>

<script>
let scanning=false;

function unlock(){
  if(document.getElementById('passInput').value==='bakar786'){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('botApp').style.display='block';
    updatePrice();
  }else{
    alert('WRONG PASSWORD');
  }
}

function updatePrice(){
  setInterval(()=>{
    let base=1.2476;
    let change=(Math.random()-0.5)*0.002;
    document.getElementById('price').innerText=(base+change).toFixed(4);
    document.getElementById('rsi').innerText = Math.floor(Math.random()*15)+70;
  },2000);
}

function getSignal(){
  if(scanning)return;
  scanning=true;
  
  let sec=3;
  document.getElementById('timer').innerText='0'+sec;
  
  let timer=setInterval(()=>{
    sec--;
    document.getElementById('timer').innerText='0'+sec;
    if(sec<=0){
      clearInterval(timer);
      scanning=false;
      
      let signal=Math.random()>0.5?'BUY':'SELL';
      let conf=Math.floor(Math.random()*4)+96;
      
      document.getElementById('signal').innerText=signal;
      document.getElementById('confidence').innerText='Confidence: '+conf+'%';
      
      // Toggle black/white for SELL
      let box = document.querySelector('.big-display');
      if(signal==='SELL'){
        box.style.background='#000';
        box.style.color='#ffffff';
      }else{
        box.style.background='#ffffff';
        box.style.color='#000';
      }
    }
  },1000);
}
</script>
</body>
</html>
