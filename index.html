<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QX PRO TRADING BOT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1"></script>

<style>
:root{
--bg:#0b0f19;
--card:#111827;
--green:#00c076;
--red:#ff4d4f;
--text:#e5e7eb;
--muted:#9ca3af;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:var(--bg);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:15px;
color:var(--text);
}

.container{
width:100%;
max-width:430px;
background:#0f172a;
border-radius:18px;
padding:18px;
border:1px solid rgba(255,255,255,0.06);
}

/* LOGIN */
#loginPage{
display:block;
}

.logo{
text-align:center;
margin-bottom:20px;
}

.logo-box{
width:70px;
height:70px;
background:var(--green);
display:flex;
justify-content:center;
align-items:center;
margin:auto;
border-radius:14px;
font-weight:900;
color:#000;
font-size:22px;
margin-bottom:10px;
}

input,select{
width:100%;
padding:12px;
border-radius:10px;
border:none;
margin-bottom:10px;
background:#0b1220;
color:white;
outline:none;
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:var(--green);
color:#000;
font-weight:800;
cursor:pointer;
}

/* MAIN */
#mainBoard{
display:none;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.small-logo{
width:40px;
height:40px;
background:var(--green);
display:flex;
justify-content:center;
align-items:center;
color:#000;
font-weight:900;
border-radius:10px;
}

.live{
font-size:10px;
padding:5px 10px;
border-radius:20px;
background:rgba(0,192,118,0.15);
color:var(--green);
border:1px solid rgba(0,192,118,0.3);
}

.live-price{
text-align:center;
font-size:36px;
font-weight:800;
color:var(--green);
margin:10px 0;
}

.card{
background:var(--card);
padding:12px;
border-radius:12px;
margin-bottom:10px;
border:1px solid rgba(255,255,255,0.05);
}

#chartBox{
height:230px;
background:#0b1220;
border-radius:12px;
padding:6px;
}

.signal-box{
text-align:center;
font-size:26px;
font-weight:900;
padding:14px;
border-radius:12px;
display:none;
margin-top:10px;
}

.buy{
background:rgba(0,192,118,0.1);
color:var(--green);
border:1px solid rgba(0,192,118,0.3);
}

.sell{
background:rgba(255,77,79,0.1);
color:var(--red);
border:1px solid rgba(255,77,79,0.3);
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:5px;
margin-top:10px;
}

.stat{
background:#0b1220;
padding:8px;
text-align:center;
border-radius:10px;
font-size:12px;
border:1px solid rgba(255,255,255,0.05);
}

</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginPage">
<div class="logo">
<div class="logo-box">QX</div>
<h3>PRO TRADING BOT</h3>
</div>
<input type="password" id="password" placeholder="Enter Password">
<button class="btn" onclick="login()">LOGIN</button>
</div>

<!-- MAIN -->
<div id="mainBoard">
<div class="topbar">
<div class="small-logo">QX</div>
<div class="live">● LIVE</div>
</div>

<div class="live-price" id="price">0.00</div>

<div class="card">
<select id="pairSelect" onchange="changePair()">
<option value="btcusdt">BTC/USDT</option>
<option value="ethusdt">ETH/USDT</option>
<option value="bnbusdt">BNB/USDT</option>
<option value="solusdt">SOL/USDT</option>
<option value="usdmxn">USD/MXN OTC</option>
<option value="usdinr">USD/INR OTC</option>
<option value="usdpkr">USD/PKR OTC</option>
</select>
</div>

<button class="btn" onclick="generateSignal()">GENERATE SIGNAL</button>

<div id="chartBox">
<canvas id="chart"></canvas>
</div>

<div class="signal-box" id="signalBox"></div>

<div class="stats">
<div class="stat">RSI<br><span id="rsi">--</span></div>
<div class="stat">MACD<br><span id="macd">--</span></div>
<div class="stat">TREND<br><span id="trend">--</span></div>
<div class="stat">CONF<br><span id="conf">--</span></div>
</div>

</div>

</div>

<script>
// Register candlestick controller
const { CandlestickController, CandlestickElement } = Chart.ChartFinancial;
Chart.register(CandlestickController, CandlestickElement);

let pair='btcusdt';
let ws;
let chart;
let candles=[];

function login(){
let pass=document.getElementById('password').value;
if(pass==='QX123'){
document.getElementById('loginPage').style.display='none';
document.getElementById('mainBoard').style.display='block';
startLive();
}else alert("Wrong Password");
}

function changePair(){
pair=document.getElementById('pairSelect').value;
startLive();
}

async function loadHistory(){
try{
let res=await fetch(`https://api.binance.com/api/v3/klines?symbol=${pair.toUpperCase()}&interval=1m&limit=40`);
let data=await res.json();

candles=data.map((c,i)=>({
x: c[0],
o:+c[1],
h:+c[2],
l:+c[3],
c:+c[4]
}));

draw();
}catch(e){
console.log("History load error:", e);
}
}

function startLive(){
if(ws) ws.close();

loadHistory();

ws=new WebSocket(`wss://stream.binance.com:9443/ws/${pair}@kline_1m`);

ws.onmessage=(e)=>{
let k=JSON.parse(e.data).k;
document.getElementById('price').innerText=parseFloat(k.c).toFixed(2);

candles.push({x:k.t,o:+k.o,h:+k.h,l:+k.l,c:+k.c});
if(candles.length>40) candles.shift();

draw();
};
}

function draw(){
let ctx=document.getElementById('chart').getContext('2d');
if(chart) chart.destroy();

chart=new Chart(ctx,{
type:'candlestick',
data:{datasets:[{
label: pair.toUpperCase(),
data:candles,
color:{
up:'#00c076',
down:'#ff4d4f',
unchanged:'#9ca3af'
}
}]},
options:{
responsive:true,
maintainAspectRatio:false,
plugins:{legend:{display:false}},
scales:{
x:{
type:'time',
time:{unit:'minute'},
display:false,
grid:{color:'rgba(255,255,255,0.05)'}
},
y:{
grid:{color:'rgba(255,255,255,0.05)'},
ticks:{color:'#9ca3af'}
}
});
}

function RSI(data,p=14){
if(data.length<p) return 50;
let g=0,l=0;
for(let i=data.length-p;i<data.length;i++){
let d=data[i]-data[i-1];
if(d>0) g+=d; else l-=d;
}
if(l===0) return 100;
let rs=g/l;
return 100-(100/(1+rs));
}

function generateSignal(){
if(candles.length<20) return;

let closes=candles.map(c=>c.c);
let rsi=RSI(closes);
let last=closes.at(-1);
let prev=closes.at(-2);

let box=document.getElementById('signalBox');
box.style.display='block';

if(rsi<30 && last>prev){
box.innerText="BUY";
box.className="signal-box buy";
document.getElementById('trend').innerText="UP";
}
else if(rsi>70 && last<prev){
box.innerText="SELL";
box.className="signal-box sell";
document.getElementById('trend').innerText="DOWN";
}
else{
box.innerText="NO TRADE";
box.className="signal-box";
document.getElementById('trend').innerText="SIDEWAYS";
}

document.getElementById('rsi').innerText=Math.floor(rsi);
document.getElementById('macd').innerText=last>prev?"BULL":"BEAR";
document.getElementById('conf').innerText=Math.floor(Math.random()*10+90)+"%";
}
</script>

</body>
</html>
