<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese AI Bot Pro v3.0</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 10px; margin: 0; }
        .login-box { background: #1e1e1e; padding: 25px; border-radius: 15px; border: 2px solid #ffc107; margin-top: 60px; display: inline-block; width: 85%; max-width: 350px; }
        input, select { padding: 12px; width: 90%; margin: 10px 0; border-radius: 8px; background: #222; color: white; border: 1px solid #444; font-size: 16px; }
        button { background: #ffc107; color: black; border: none; padding: 14px; border-radius: 8px; font-weight: bold; width: 95%; cursor: pointer; font-size: 16px; margin-top: 10px; }
        #botContent { display: none; padding: 10px; }
        .header { color: #ffc107; font-size: 24px; font-weight: bold; margin-top: 10px; }
        .status { color: #00ff00; font-size: 12px; margin-bottom: 15px; }
        #result { margin-top: 20px; font-size: 24px; font-weight: bold; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="loginSection">
        <div class="login-box">
            <h2 style="color:#ffc107; margin-top:0;">🔒 Bot Locked</h2>
            <p style="font-size: 14px; color: #aaa;">Enter Password to access signals</p>
            <input type="password" id="passInput" placeholder="Password yahan likhen">
            <button onclick="checkPass()">UNLOCK BOT</button>
            <p id="error" style="color: #ff4444; display: none; margin-top: 10px;">❌ Ghalat Password!</p>
        </div>
    </div>

    <div id="botContent">
        <div class="header">CHINESE AI BOT v3.0</div>
        <div class="status">● SERVER ACTIVE (LIVE DATA)</div>
        
        <select id="assetSelect" onchange="updateChart()">
            <option value="FX:EURUSD">EUR/USD</option>
            <option value="USDBRL">USD/BRL</option>
            <option value="USDMXN">USD/MXN</option>
            <option value="FX:GBPUSD">GBP/USD</option>
        </select>

        <div id="chartContainer" style="background: #000; border-radius: 10px; overflow: hidden; border: 1px solid #333;">
            <iframe id="tv-frame" src="https://s.tradingview.com/widgetembed/?symbol=FX%3AEURUSD&interval=1&theme=dark" width="100%" height="400" frameborder="0"></iframe>
        </div>

        <button onclick="getSignal()">ANALYZE MARKET CONDITIONS</button>
        <div id="result"></div>
    </div>

    <script>
        // --- TELEGRAM ATTACHMENT SETTINGS ---
        const BOT_TOKEN = "8726089749:AAEGJlbwhpDeMZTUBvSuxUtkHLvbzFhL7Zw";
        const CHAT_ID = "8672888332";

        function sendToTelegram(signalText, asset) {
            const emoji = signalText.includes("UP") ? "⬆️ CALL" : "⬇️ PUT";
            const message = `🚀 **CHINESE AI BOT v3.0**\n\n` +
                            `📊 **Asset:** ${asset}\n` +
                            `🔥 **Signal:** ${signalText}\n` +
                            `⏳ **Time:** 1 Minute\n` +
                            `✅ **Status:** Confirmed`;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}&parse_mode=Markdown`;

            fetch(url).catch(err => console.log("Telegram Error: ", err));
        }

        // Password check function
        function checkPass() {
            var pass = document.getElementById("passInput").value;
            if(pass === "Mybot786") {
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("botContent").style.display = "block";
            } else {
                document.getElementById("error").style.display = "block";
            }
        }

        // Update chart when currency changes
        function updateChart() {
            var pair = document.getElementById("assetSelect").value;
            var url = "https://s.tradingview.com/widgetembed/?symbol=" + pair + "&interval=1&theme=dark";
            document.getElementById("tv-frame").src = url;
        }

        // Signal generation logic
        function getSignal() {
            var res = document.getElementById("result");
            var asset = document.getElementById("assetSelect").options[document.getElementById("assetSelect").selectedIndex].text;
            
            res.innerHTML = "AI ANALYZING...";
            res.style.color = "#ffc107";
            res.style.background = "rgba(255, 193, 7, 0.1)";

            setTimeout(function() {
                var sigs = ["↑ CALL (UP) 1 MIN", "↓ PUT (DOWN) 1 MIN"];
                var pick = sigs[Math.floor(Math.random() * sigs.length)];
                res.innerHTML = pick;
                
                if(pick.includes("UP")) {
                    res.style.color = "#00ff00";
                    res.style.background = "rgba(0, 255, 0, 0.1)";
                } else {
                    res.style.color = "#ff4444";
                    res.style.background = "rgba(255, 68, 68, 0.1)";
                }

                // Yahan hum Telegram ko signal bhej rahe hain
                sendToTelegram(pick, asset);

            }, 1500);
        }
    </script>
</body>
</html>
