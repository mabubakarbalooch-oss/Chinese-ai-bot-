<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA ABUBAKAR SIGNAL PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
--bg:#06110a;
--card:rgba(8,25,15,0.92);
--primary:#00ff78;
--primary2:#00cc66;
--green:#00ff78;
--red:#ff4d4d;
--yellow:#ffd000;
--text:#ffffff;
--muted:#7dffb2;
--border:rgba(0,255,120,0.12);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:radial-gradient(circle at top right,#0d2e1c 0%,#06110a 60%);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:18px;
overflow:hidden;
color:var(--text);
}

.bg-glow{
position:absolute;
width:450px;height:450px;
background:rgba(0,255,120,0.08);
filter:blur(120px);
top:-100px;right:-100px;
}

.container{
width:100%;
max-width:430px;
background:var(--card);
backdrop-filter:blur(18px);
border:1px solid var(--border);
border-radius:34px;
padding:22px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:22px;
}

.logo{
width:60px;height:60px;
border-radius:50%;
background:linear-gradient(135deg,#00ff78,#00cc66);
display:flex;
justify-content:center;
align-items:center;
font-weight:900;
color:#04140a;
font-family:'Orbitron';
}

.live{
padding:7px 12px;
border-radius:30px;
background:rgba(0,255,120,0.08);
border:1px solid rgba(0,255,120,0.2);
font-size:11px;
color:var(--primary);
font-weight:700;
}

#mainBoard{display:none;}

.label{font-size:12px;color:#9fffc7;margin:8px 0;}

input,select{
width:100%;
padding:14px;
border-radius:18px;
border:1px solid #145c34;
background:#0b1d13;
color:#fff;
margin-bottom:12px;
}

.time-box{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:18px;
}

.time-btn{
padding:12px;
background:#0f2217;
border:1px solid #145c34;
border-radius:16px;
text-align:center;
font-size:13px;
cursor:pointer;
}

.time-btn.active{
border-color:var(--primary);
color:var(--primary);
}

.btn{
width:100%;
padding:16px;
border:none;
border-radius:22px;
background:linear-gradient(135deg,var(--primary),var(--primary2));
font-family:'Orbitron';
font-weight:800;
cursor:pointer;
}

#scanner{
margin-top:18px;
height:160px;
border-radius:20px;
background:#0b1d13;
display:none;
position:relative;
overflow:hidden;
}

.scan-line{
position:absolute;
width:100%;
height:5px;
background:linear-gradient(90deg,transparent,var(--primary),transparent);
animation:scan 1s linear infinite;
}

@keyframes scan{
0%{top:-5%;}
100%{top:105%;}
}

#signalBox{
margin-top:18px;
padding:22px;
border-radius:24px;
text-align:center;
font-size:28px;
font-family:'Orbitron';
display:none;
}

.buy-style{background:rgba(0,255,120,0.08);color:var(--green);}
.sell-style{background:rgba(255,77,77,0.08);color:var(--red);}
.wait-style{background:rgba(255,208,0,0.08);color:var(--yellow);}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:15px;
}

.stat{
background:#102117;
border-radius:18px;
padding:12px;
text-align:center;
}

.stat h3{font-size:11px;color:#7dffb2;}
.stat p{font-size:18px;font-weight:700;}

</style>
</head>

<body>

<div class="bg-glow"></div>

<!-- LOGIN -->
<div id="loginScreen" class="container">

<div class="header">
<div class="logo">QX</div>
<div class="live">● SAFE</div>
</div>

<label class="label">PASSWORD</label>
<input type="password" id="password">
<button class="btn" onclick="login()">UNLOCK</button>

</div>

<!-- MAIN -->
<div id="mainBoard" class="container">

<div class="header">
<div class="logo">QX</div>
<div class="live">● LIVE</div>
</div>

<label class="label">BROKER</label>
<select>
<option>Quotex</option>
<option>Pocket Option</option>
</select>

<label class="label">ASSET</label>
<select>
<option>USD/PKR</option>
<option>BTC/USDT</option>
</select>

<div class="time-box">
<div class="time-btn active" onclick="setActive(this)">15s</div>
<div class="time-btn" onclick="setActive(this)">30s</div>
<div class="time-btn" onclick="setActive(this)">1m</div>
<div class="time-btn" onclick="setActive(this)">5m</div>
</div>

<button class="btn" onclick="generateSignal()">GENERATE SIGNAL</button>

<div id="scanner">
<div class="scan-line"></div>
</div>

<div id="signalBox"></div>

<div class="stats">
<div class="stat"><h3>RSI</h3><p id="rsi">--</p></div>
<div class="stat"><h3>TREND</h3><p id="trend">--</p></div>
<div class="stat"><h3>CONF</h3><p id="conf">--</p></div>
</div>

</div>

<script>

function login(){
let pass=document.getElementById('password').value;
if(pass==="bakar786"){
document.getElementById('loginScreen').style.display="none";
document.getElementById('mainBoard').style.display="block";
}else{
alert("Wrong Password");
}
}

function setActive(el){
document.querySelectorAll('.time-btn').forEach(b=>b.classList.remove('active'));
el.classList.add('active');
}

/* FAST SIGNAL ENGINE */
function generateSignal(){

let scanner=document.getElementById('scanner');
let box=document.getElementById('signalBox');

scanner.style.display="block";
box.style.display="none";

setTimeout(()=>{

scanner.style.display="none";
box.style.display="block";

let rsi=Math.floor(Math.random()*100);
let score=(rsi>50?30:-30)+Math.floor(Math.random()*40-20);

let result,style,trend,conf;

if(score>25){
result="📈 BUY";style="buy-style";trend="BULLISH";conf="85%";
}
else if(score<-25){
result="📉 SELL";style="sell-style";trend="BEARISH";conf="82%";
}
else{
result="⏳ WAIT";style="wait-style";trend="SIDEWAYS";conf="NO TRADE";
}

box.innerHTML=result;
box.className=style;

document.getElementById('rsi').innerText=rsi;
document.getElementById('trend').innerText=trend;
document.getElementById('conf').innerText=conf;

},700);

}

</script>

</body>
</html>
