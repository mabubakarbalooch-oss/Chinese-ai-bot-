<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA ABUBAKAR LIVE BOT</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
padding:0;
font-family:Poppins,sans-serif;
background:#06110a;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:white;
overflow:hidden;
}

.container{
width:95%;
max-width:420px;
background:#0b1d13;
border:1px solid #145c34;
border-radius:30px;
padding:20px;
box-shadow:0 0 30px rgba(0,255,120,0.15);
}

.logo{
width:65px;
height:65px;
border-radius:50%;
background:linear-gradient(135deg,#00ff78,#00cc66);
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
font-weight:900;
color:#04140a;
margin:auto;
font-family:Orbitron,sans-serif;
}

h1{
text-align:center;
font-size:18px;
font-family:Orbitron,sans-serif;
margin-top:15px;
}

p{
text-align:center;
color:#7dffb2;
font-size:12px;
margin-bottom:20px;
}

input,select{
width:100%;
padding:15px;
margin-bottom:15px;
border:none;
outline:none;
border-radius:15px;
background:#102117;
color:white;
font-size:14px;
}

.btn{
width:100%;
padding:17px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#00ff78,#00cc66);
font-size:15px;
font-weight:700;
font-family:Orbitron,sans-serif;
cursor:pointer;
color:#04140a;
}

#scanner{
margin-top:20px;
height:180px;
border-radius:25px;
background:#102117;
overflow:hidden;
position:relative;
display:none;
border:1px solid #145c34;
}

.scan-line{
position:absolute;
width:100%;
height:4px;
background:#00ff78;
box-shadow:0 0 20px #00ff78;
animation:scan 1.5s linear infinite;
}

@keyframes scan{
0%{top:-10px;}
100%{top:100%;}
}

.chart{
position:absolute;
bottom:15px;
left:10px;
right:10px;
display:flex;
align-items:flex-end;
gap:6px;
height:100px;
}

.candle{
width:14px;
border-radius:5px 5px 0 0;
}

.green{
background:#00ff78;
}

.red{
background:#ff4d4d;
}

#signalBox{
margin-top:20px;
padding:25px;
border-radius:25px;
text-align:center;
font-size:32px;
font-weight:900;
font-family:Orbitron,sans-serif;
display:none;
}

.buy{
background:rgba(0,255,120,0.08);
border:1px solid rgba(0,255,120,0.4);
color:#00ff78;
}

.sell{
background:rgba(255,77,77,0.08);
border:1px solid rgba(255,77,77,0.4);
color:#ff4d4d;
}

.wait{
background:rgba(255,215,0,0.08);
border:1px solid rgba(255,215,0,0.4);
color:#ffd700;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:18px;
}

.stat{
background:#102117;
padding:14px;
border-radius:18px;
text-align:center;
border:1px solid #145c34;
}

.stat h3{
font-size:11px;
color:#7dffb2;
margin-bottom:5px;
}

.stat p{
font-size:18px;
color:white;
margin:0;
}

.status{
margin-top:15px;
background:#102117;
padding:14px;
border-radius:16px;
text-align:center;
font-size:12px;
color:#7dffb2;
border:1px solid #145c34;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">QX</div>

<h1>LUBNA ABUBAKAR</h1>

<p>LIVE AI SIGNAL BOT</p>

<input type="password" id="password" placeholder="Enter Password">

<button class="btn" onclick="login()">
UNLOCK SYSTEM
</button>

<div id="main" style="display:none;">

<select id="pair">

<option value="BTCUSDT">BTC/USDT</option>

<option value="ETHUSDT">ETH/USDT</option>

<option value="BNBUSDT">BNB/USDT</option>

<option value="SOLUSDT">SOL/USDT</option>

</select>

<button class="btn" onclick="generateSignal()">
GENERATE SIGNAL
</button>

<div id="scanner">

<div class="scan-line"></div>

<div class="chart" id="chart"></div>

</div>

<div id="signalBox"></div>

<div class="stats">

<div class="stat">
<h3>RSI</h3>
<p id="rsi">--</p>
</div>

<div class="stat">
<h3>TREND</h3>
<p id="trend">--</p>
</div>

<div class="stat">
<h3>CONF</h3>
<p id="conf">--</p>
</div>

</div>

<div class="status" id="status">
WAITING MARKET...
</div>

</div>

</div>

<script>

function login(){

let pass =
document.getElementById('password').value;

if(pass === 'bakar786'){

document.getElementById('main')
.style.display='block';

}else{

alert('Wrong Password');

}

}

function randomCandles(){

let chart =
document.getElementById('chart');

chart.innerHTML='';

for(let i=0;i<12;i++){

let candle =
document.createElement('div');

let height =
Math.floor(Math.random()*80)+20;

candle.classList.add('candle');

if(Math.random()>0.5){

candle.classList.add('green');

}else{

candle.classList.add('red');

}

candle.style.height=height+'px';

chart.appendChild(candle);

}

}

async function getData(){

let pair =
document.getElementById('pair').value;

try{

let response =
await fetch(
`https://api.binance.com/api/v3/klines?symbol=${pair}&interval=1m&limit=50`
);

let data =
await response.json();

return data.map(
x => parseFloat(x[4])
);

}catch{

return null;

}

}

function rsi(closes){

let gains=0;
let losses=0;

for(let i=1;i<15;i++){

let diff =
closes[i]-closes[i-1];

if(diff>=0){

gains+=diff;

}else{

losses+=Math.abs(diff);

}

}

let rs =
gains/(losses||1);

return Math.floor(
100-(100/(1+rs))
);

}

function ema(data,period){

let k = 2/(period+1);

let value=data[0];

for(let i=1;i<data.length;i++){

value=data[i]*k+
value*(1-k);

}

return value;

}

async function generateSignal(){

let scanner =
document.getElementById('scanner');

let signalBox =
document.getElementById('signalBox');

let status =
document.getElementById('status');

scanner.style.display='block';

signalBox.style.display='none';

status.innerHTML=
'CONNECTING BINANCE...';

randomCandles();

let closes =
await getData();

if(!closes){

status.innerHTML=
'API ERROR';

return;

}

setTimeout(()=>{

scanner.style.display='none';

signalBox.style.display='block';

let myRsi =
rsi(closes);

let fast =
ema(closes,9);

let slow =
ema(closes,21);

let conf =
Math.floor(Math.random()*5)+95;

if(myRsi < 45 && fast > slow){

signalBox.innerHTML='📈 BUY';

signalBox.className='buy';

document.getElementById('trend')
.innerText='UP';

status.innerHTML=
'LIVE BULLISH MARKET';

}else if(myRsi > 60 && fast < slow){

signalBox.innerHTML='📉 SELL';

signalBox.className='sell';

document.getElementById('trend')
.innerText='DOWN';

status.innerHTML=
'LIVE BEARISH MARKET';

}else{

signalBox.innerHTML='⏳ WAIT';

signalBox.className='wait';

document.getElementById('trend')
.innerText='WAIT';

status.innerHTML=
'MARKET NOT CLEAR';

}

document.getElementById('rsi')
.innerText=myRsi;

document.getElementById('conf')
.innerText=conf+'%';

},2000);

}

</script>

</body>
</html>
