<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA ABUBAKAR - AI ELITE</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial"></script>

<style>

:root{
--bg:#050816;
--card:#0f172a;
--green:#00ffae;
--red:#ff4d6d;
--blue:#00cfff;
--text:#ffffff;
--muted:#7f8da3;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:
radial-gradient(circle at top,#0d1630,#050816);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
overflow:hidden;
color:white;
}

body::before{
content:'';
position:absolute;
width:200%;
height:200%;
background:
linear-gradient(
45deg,
transparent,
rgba(0,255,174,0.03),
transparent
);
animation:bgmove 12s linear infinite;
}

@keyframes bgmove{

0%{
transform:rotate(0deg);
}

100%{
transform:rotate(360deg);
}

}

.container{
width:100%;
max-width:430px;
background:rgba(15,23,42,0.92);
backdrop-filter:blur(20px);
border-radius:32px;
padding:20px;
border:1px solid rgba(255,255,255,0.06);
box-shadow:
0 0 40px rgba(0,255,174,0.15);
position:relative;
z-index:2;
}

/* LOGIN */

#loginPage{
animation:fade 1s ease;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.logo{
display:flex;
flex-direction:column;
align-items:center;
margin-bottom:25px;
}

.logo-box{
width:95px;
height:95px;
border-radius:28px;
background:
linear-gradient(
135deg,
#00ffae,
#00cfff
);
display:flex;
justify-content:center;
align-items:center;
font-size:34px;
font-family:'Orbitron';
font-weight:900;
color:#000;
box-shadow:
0 0 40px rgba(0,255,174,0.45);
margin-bottom:15px;
animation:pulse 2s infinite;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.05);
}

100%{
transform:scale(1);
}

}

.logo h1{
font-size:22px;
font-family:'Orbitron';
margin-bottom:5px;
}

.logo p{
font-size:12px;
color:var(--muted);
}

.input-box{
margin-bottom:18px;
}

.label{
font-size:12px;
margin-bottom:8px;
display:block;
color:var(--muted);
font-weight:600;
}

input,select{
width:100%;
padding:16px;
border-radius:18px;
background:#0a1020;
border:1px solid rgba(255,255,255,0.06);
color:white;
font-size:14px;
outline:none;
}

.btn{
width:100%;
padding:17px;
border:none;
border-radius:20px;
background:
linear-gradient(
135deg,
#00ffae,
#00cfff
);
font-family:'Orbitron';
font-size:14px;
font-weight:800;
cursor:pointer;
color:#000;
box-shadow:
0 0 30px rgba(0,255,174,0.25);
transition:0.3s;
margin-bottom:15px;
}

.btn:hover{
transform:scale(1.02);
}

/* MAIN */

#mainBoard{
display:none;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.top-left{
display:flex;
align-items:center;
gap:12px;
}

.small-logo{
width:55px;
height:55px;
border-radius:18px;
background:
linear-gradient(
135deg,
#00ffae,
#00cfff
);
display:flex;
justify-content:center;
align-items:center;
font-family:'Orbitron';
font-size:22px;
font-weight:900;
color:#000;
box-shadow:
0 0 25px rgba(0,255,174,0.35);
}

.live{
padding:8px 15px;
border-radius:30px;
background:rgba(0,255,174,0.08);
border:1px solid rgba(0,255,174,0.15);
color:var(--green);
font-size:11px;
font-weight:700;
}

.live-price{
text-align:center;
font-size:42px;
font-family:'Orbitron';
font-weight:900;
margin-bottom:15px;
color:var(--green);
text-shadow:
0 0 20px rgba(0,255,174,0.45);
}

.card{
background:#0a1020;
border-radius:22px;
padding:15px;
margin-bottom:15px;
border:1px solid rgba(255,255,255,0.05);
}

.card-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.market-name{
font-size:19px;
font-weight:700;
}

.market-info{
font-size:11px;
line-height:1.8;
color:var(--muted);
}

#scanner{
height:170px;
border-radius:22px;
background:#0a1020;
overflow:hidden;
position:relative;
display:none;
margin-bottom:15px;
border:1px solid rgba(255,255,255,0.05);
}

.scan-line{
position:absolute;
width:100%;
height:4px;
background:
linear-gradient(
90deg,
transparent,
#00ffae,
transparent
);
box-shadow:
0 0 20px #00ffae;
animation:scan 1.4s linear infinite;
}

@keyframes scan{

0%{
top:0;
}

100%{
top:100%;
}

}

#chartBox{
height:250px;
background:#0a1020;
border-radius:22px;
padding:10px;
margin-bottom:15px;
border:1px solid rgba(255,255,255,0.05);
}

.signal-box{
padding:24px;
border-radius:22px;
text-align:center;
font-size:34px;
font-family:'Orbitron';
font-weight:900;
margin-bottom:15px;
display:none;
}

.buy{
background:rgba(0,255,174,0.08);
border:1px solid rgba(0,255,174,0.2);
color:var(--green);
}

.sell{
background:rgba(255,77,109,0.08);
border:1px solid rgba(255,77,109,0.2);
color:var(--red);
}

.wait{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
color:white;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.stat{
background:#0a1020;
padding:12px;
border-radius:16px;
text-align:center;
border:1px solid rgba(255,255,255,0.05);
}

.stat h3{
font-size:10px;
margin-bottom:5px;
color:var(--muted);
}

.stat p{
font-size:15px;
font-weight:700;
}

</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginPage">

<div class="logo">

<div class="logo-box">
QX
</div>

<h1>LUBNA ABUBAKAR</h1>

<p>QUOTEX AI ELITE SYSTEM</p>

</div>

<div class="input-box">

<label class="label">
PASSWORD
</label>

<input type="password" id="password" placeholder="Enter Password">

</div>

<button class="btn" onclick="login()">
🔓 ACCESS SYSTEM
</button>

</div>

<!-- MAIN BOARD -->

<div id="mainBoard">

<div class="topbar">

<div class="top-left">

<div class="small-logo">
QX
</div>

<div>
<h3>LUBNA ABUBAKAR</h3>
<p style="font-size:11px;color:#7f8da3;">
LIVE AI MARKET
</p>
</div>

</div>

<div class="live">
● LIVE
</div>

</div>

<div class="live-price" id="price">
0.0000
</div>

<div class="card">

<div class="card-top">

<div class="market-name" id="pairName">
BTCUSDT
</div>

</div>

<div class="market-info">

<div>● Binance Live Connected</div>
<div>● AI Scanner Active</div>
<div>● 1 Minute Signals</div>
<div>● OTC Supported</div>

</div>

</div>

<label class="label">
SELECT MARKET
</label>

<select id="pairSelect" onchange="changePair()">

<option value="btcusdt">
BTC/USDT
</option>

<option value="ethusdt">
ETH/USDT
</option>

<option value="bnbusdt">
BNB/USDT
</option>

<option value="solusdt">
SOL/USDT
</option>

</select>

<button class="btn" onclick="generateSignal()">
⚡ GENERATE SIGNAL
</button>

<div id="scanner">
<div class="scan-line"></div>
</div>

<div id="chartBox">
<canvas id="chart"></canvas>
</div>

<div class="signal-box" id="signalBox">
BUY
</div>

<div class="stats">

<div class="stat">
<h3>RSI</h3>
<p id="rsi">--</p>
</div>

<div class="stat">
<h3>MACD</h3>
<p id="macd">--</p>
</div>

<div class="stat">
<h3>TREND</h3>
<p id="trend">--</p>
</div>

<div class="stat">
<h3>CONF</h3>
<p id="conf">--</p>
</div>

</div>

</div>

</div>

<script>

let pair = 'btcusdt';

let ws;

let chart;

let candles = [];

function login(){

let pass =
document.getElementById('password').value;

if(pass === 'Lubna786'){

document.getElementById('loginPage')
.style.display='none';

document.getElementById('mainBoard')
.style.display='block';

startLiveMarket();

}else{

alert('Wrong Password');

}

}

function changePair(){

pair =
document.getElementById('pairSelect').value;

document.getElementById('pairName')
.innerText = pair.toUpperCase();

startLiveMarket();

}

async function loadHistory(){

let response = await fetch(
`https://api.binance.com/api/v3/klines?symbol=${pair.toUpperCase()}&interval=1m&limit=40`
);

let data = await response.json();

candles = data.map((candle,index)=>({

x:index,

o:parseFloat(candle[1]),

h:parseFloat(candle[2]),

l:parseFloat(candle[3]),

c:parseFloat(candle[4])

}));

drawChart();

}

async function startLiveMarket(){

if(ws){
ws.close();
}

await loadHistory();

ws = new WebSocket(
`wss://stream.binance.com:9443/ws/${pair}@kline_1m`
);

ws.onmessage = function(event){

let data = JSON.parse(event.data);

let k = data.k;

let candle = {

x:candles.length,

o:parseFloat(k.o),

h:parseFloat(k.h),

l:parseFloat(k.l),

c:parseFloat(k.c)

};

document.getElementById('price')
.innerText =
parseFloat(k.c).toFixed(2);

candles[candles.length - 1] = candle;

drawChart();

};

}

function drawChart(){

const ctx =
document.getElementById('chart')
.getContext('2d');

if(chart){
chart.destroy();
}

chart = new Chart(ctx,{

type:'candlestick',

data:{
datasets:[{

label:pair,

data:candles,

color:{
up:'#00ffae',
down:'#ff4d6d',
unchanged:'#999'
}

}]
},

options:{

responsive:true,

maintainAspectRatio:false,

plugins:{
legend:{display:false}
},

scales:{

x:{
ticks:{color:'#777'},
grid:{color:'#1b2236'}
},

y:{
ticks:{color:'#777'},
grid:{color:'#1b2236'}
}

}

}

});

}

function calculateRSI(data,period=14){

let gains = 0;
let losses = 0;

for(let i=1;i<=period;i++){

let diff = data[i]-data[i-1];

if(diff >= 0){
gains += diff;
}else{
losses -= diff;
}

}

if(losses === 0){
return 100;
}

let rs = gains / losses;

return 100 - (100/(1+rs));

}

function generateSignal(){

document.getElementById('scanner')
.style.display='block';

document.getElementById('signalBox')
.style.display='none';

setTimeout(()=>{

document.getElementById('scanner')
.style.display='none';

let closes =
candles.map(c=>c.c);

let rsi =
calculateRSI(closes);

let last =
closes[closes.length-1];

let prev =
closes[closes.length-2];

let signalBox =
document.getElementById('signalBox');

signalBox.style.display='block';

if(last > prev){

signalBox.innerHTML='📈 BUY';

signalBox.className='signal-box buy';

document.getElementById('trend')
.innerText='UP';

}else{

signalBox.innerHTML='📉 SELL';

signalBox.className='signal-box sell';

document.getElementById('trend')
.innerText='DOWN';

}

document.getElementById('rsi')
.innerText =
Math.floor(rsi);

document.getElementById('macd')
.innerText =
last > prev ? 'BULL' : 'BEAR';

document.getElementById('conf')
.innerText =
Math.floor(Math.random()*10+90)+'%';

},1500);

}

</script>

</body>
</html>
