<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese AI Bot Pro v4.5 - Premium</title>
    <style>
        :root {
            --primary: #00d2ff;
            --bg: #05070a;
            --card: #111418;
            --success: #00ff88;
            --danger: #ff3e3e;
            --accent: #7000ff;
        }

        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 480px; padding: 15px; }

        .bot-card {
            background: var(--card);
            padding: 20px;
            border-radius: 25px;
            border: 1px solid rgba(0, 210, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            text-align: center;
        }

        .header-title {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .live-timer { font-family: monospace; color: var(--primary); font-size: 13px; margin-bottom: 10px; }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: #1a1e23;
            color: white;
            border: 1px solid #333;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #tv-frame { border-radius: 15px; border: 1px solid #222; margin-bottom: 15px; height: 280px; }

        .btn-analyze {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            font-size: 16px;
        }

        .btn-analyze:disabled { opacity: 0.6; }

        #result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 18px;
            display: none;
            border-left: 5px solid transparent;
        }

        .signal-badge { font-size: 24px; font-weight: 800; display: block; }

        .loader-bar {
            width: 100%;
            height: 5px;
            background: #222;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            overflow: hidden;
        }

        .loader-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 2.5s ease-in-out;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="loginSection" class="bot-card" style="margin-top: 40px;">
        <h2 style="color:var(--primary)">CHINESE AI SERVER</h2>
        <p style="font-size: 12px; color: #888;">Enter Key for v4.5 Access</p>
        <input type="password" id="passInput" placeholder="Password..." style="width:85%; padding:14px; border-radius:10px; background:#1a1e23; border:1px solid #444; color:white; margin-bottom:15px; text-align:center;">
        <button class="btn-analyze" onclick="checkPass()">UNLOCK BOT</button>
    </div>

    <div id="botContent" style="display: none;">
        <div class="bot-card">
            <div class="header-title">AI SIGNAL BOT PRO</div>
            <div id="clock" class="live-timer">00:00:00</div>
            
            <select id="assetSelect" onchange="updateChart()">
                <option value="FX_IDC:USDBRL">USD/BRL (Brazilian Real)</option>
                <option value="FX_IDC:USDMXN">USD/MXN (Mexican Peso)</option>
                <option value="FX_IDC:USDINR">USD/INR (Indian Rupee)</option>
                <option value="FX:EURUSD">EUR/USD (OTC)</option>
                <option value="FX:GBPUSD">GBP/USD (OTC)</option>
                <option value="CRYPTOCAP:BTC">BITCOIN (Live)</option>
                <option value="FX:USDJPY">USD/JPY</option>
            </select>

            <iframe id="tv-frame" src="https://s.tradingview.com/widgetembed/?symbol=FX_IDC%3AUSDBRL&interval=1&theme=dark" width="100%" frameborder="0"></iframe>

            <button id="analyzeBtn" class="btn-analyze" onclick="getSignal()">START AI SCANNING</button>
            
            <div id="loader" class="loader-bar"><div id="fill" class="loader-fill"></div></div>

            <div id="result">
                <span id="sigText" class="signal-badge"></span>
                <div id="accuracyText" style="font-size: 14px; margin-top: 5px; font-weight: bold;"></div>
                <div id="logicText" style="font-size: 10px; margin-top: 8px; color: #aaa; text-transform: uppercase;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString();
    }, 1000);

    function checkPass() {
        // Password is still Mybot786 as per your design
        if(document.getElementById("passInput").value === "Mybot786") {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("botContent").style.display = "block";
        }
    }

    function updateChart() {
        const pair = document.getElementById("assetSelect").value;
        // Fix for symbol colon encoding
        const encodedPair = pair.replace(":", "%3A");
        document.getElementById("tv-frame").src = `https://s.tradingview.com/widgetembed/?symbol=${encodedPair}&interval=1&theme=dark`;
    }

    function getSignal() {
        const res = document.getElementById("result");
        const loader = document.getElementById("loader");
        const fill = document.getElementById("fill");
        const btn = document.getElementById("analyzeBtn");

        btn.disabled = true;
        btn.innerText = "ALGO ANALYZING...";
        res.style.display = "none";
        loader.style.display = "block";
        fill.style.width = "0%";
        
        setTimeout(() => fill.style.width = "100%", 50);

        setTimeout(function() {
            loader.style.display = "none";
            btn.disabled = false;
            btn.innerText = "START AI SCANNING";
            res.style.display = "block";

            // ADVANCED LOGIC: RSI Simulation
            // 0-30: Oversold (Strong Buy), 70-100: Overbought (Strong Sell)
            const rsiValue = Math.floor(Math.random() * 100);
            let signal = "";
            let color = "";
            let bg = "";
            let strategy = "";

            if(rsiValue > 50) {
                signal = "↓ PUT / SELL";
                color = "var(--danger)";
                bg = "rgba(255, 62, 62, 0.1)";
                strategy = rsiValue > 75 ? "RSI OVERBOUGHT - REVERSAL" : "BEARISH MOMENTUM";
            } else {
                signal = "↑ CALL / BUY";
                color = "var(--success)";
                bg = "rgba(0, 255, 136, 0.1)";
                strategy = rsiValue < 25 ? "RSI OVERSOLD - REVERSAL" : "BULLISH MOMENTUM";
            }

            const accuracy = (Math.random() * (98.8 - 91.5) + 91.5).toFixed(2);
            
            document.getElementById("sigText").innerText = signal;
            document.getElementById("sigText").style.color = color;
            document.getElementById("accuracyText").innerText = `CONFIDENCE: ${accuracy}%`;
            document.getElementById("accuracyText").style.color = color;
            document.getElementById("logicText").innerText = `LOGIC: ${strategy}`;
            res.style.background = bg;
            res.style.borderColor = color;

        }, 2500);
    }
</script>
</body>
</html>
