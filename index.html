HTML
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>ABU BAKAR TRADER - PRO AI</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;600;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050816;
display:flex;
justify-content:center;
padding:8px;
color:#fff;
overflow-x:hidden;
}

body::before{
content:'';
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at top left, rgba(0,255,255,0.12), transparent 35%),
radial-gradient(circle at bottom right, rgba(255,0,120,0.12), transparent 35%);
z-index:-1;
}

.container{
width:100%;
max-width:400px;
background:rgba(255,255,255,0.03);
border:1px solid rgba(255,255,255,0.08);
border-radius:28px;
padding:18px;
backdrop-filter:blur(18px);
box-shadow:0 20px 40px rgba(0,0,0,0.5);
display:none;
animation:fade 0.5s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.lock-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
padding:20px;
}

.lock-box{
width:100%;
max-width:350px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
border-radius:24px;
padding:30px 20px;
text-align:center;
backdrop-filter:blur(20px);
}

.lock-title{
font-family:'Orbitron',sans-serif;
font-size:22px;
font-weight:900;
color:#00f0ff;
margin-bottom:20px;
}

.lock-input{
width:100%;
padding:15px;
border:none;
outline:none;
border-radius:14px;
background:rgba(0,0,0,0.4);
color:#fff;
font-size:16px;
text-align:center;
margin-bottom:15px;
letter-spacing:3px;
}

.lock-btn{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#00f0ff,#006eff);
color:#fff;
font-weight:700;
font-size:15px;
cursor:pointer;
}

.error{
margin-top:10px;
color:#ff4f6d;
display:none;
font-size:13px;
}

.logo{
width:90px;
height:90px;
margin:auto;
border-radius:50%;
background:rgba(255,255,255,0.05);
display:flex;
justify-content:center;
align-items:center;
font-family:'Orbitron',sans-serif;
font-size:34px;
font-weight:900;
color:#00f0ff;
box-shadow:0 0 25px rgba(0,240,255,0.3);
}

.title{
text-align:center;
font-family:'Orbitron',sans-serif;
font-size:20px;
font-weight:900;
margin-top:15px;
}

.sub{
text-align:center;
font-size:10px;
letter-spacing:3px;
color:#00f0ff;
margin-bottom:20px;
}

.select{
width:100%;
padding:14px;
border-radius:14px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
color:#fff;
outline:none;
margin-bottom:12px;
}

.chart{
position:relative;
height:220px;
border-radius:22px;
background:rgba(0,0,0,0.35);
padding:14px;
overflow:hidden;
border:1px solid rgba(255,255,255,0.06);
}

.live{
font-size:11px;
font-family:'Orbitron',sans-serif;
letter-spacing:2px;
color:#aaa;
display:flex;
align-items:center;
gap:6px;
}

.live::before{
content:'';
width:7px;
height:7px;
background:#00ff88;
border-radius:50%;
box-shadow:0 0 8px #00ff88;
}

.price{
font-size:40px;
font-weight:900;
font-family:monospace;
margin-top:5px;
color:#00ff88;
}

.candles{
position:absolute;
left:10px;
right:10px;
bottom:10px;
height:110px;
display:flex;
align-items:flex-end;
gap:4px;
overflow:hidden;
}

.candle{
width:9px;
border-radius:4px;
transition:0.3s;
}

.green{
background:#00ff88;
box-shadow:0 0 10px rgba(0,255,136,0.7);
}

.red{
background:#ff3b3b;
box-shadow:0 0 10px rgba(255,59,59,0.7);
}

.scan{
position:absolute;
top:0;
bottom:0;
width:4px;
background:linear-gradient(to right, transparent,#00f0ff,transparent);
box-shadow:0 0 20px #00f0ff;
display:none;
animation:scanMove 1.5s linear infinite;
}

@keyframes scanMove{
0%{left:-10px;}
100%{left:100%;}
}

.btn{
width:100%;
padding:16px;
border:none;
border-radius:16px;
margin-top:16px;
background:linear-gradient(135deg,#00f0ff,#0072ff);
color:#fff;
font-weight:900;
font-size:15px;
cursor:pointer;
font-family:'Orbitron',sans-serif;
}

.btn:disabled{
opacity:0.5;
}

.result{
margin-top:16px;
padding:18px;
border-radius:22px;
background:rgba(0,0,0,0.35);
border:1px solid rgba(255,255,255,0.06);
display:none;
}

.signal{
text-align:center;
font-family:'Orbitron',sans-serif;
font-size:55px;
font-weight:900;
}

.buy{
color:#00ff88;
text-shadow:0 0 20px rgba(0,255,136,0.6);
}

.sell{
color:#ff3b3b;
text-shadow:0 0 20px rgba(255,59,59,0.6);
}

.wait{
color:#00f0ff;
}

.conf{
text-align:center;
font-size:30px;
font-family:'Orbitron',sans-serif;
margin-top:5px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:14px;
}

.item{
background:rgba(255,255,255,0.04);
padding:10px;
border-radius:12px;
font-size:12px;
}

.item span{
float:right;
font-weight:700;
}

.footer{
text-align:center;
margin-top:16px;
font-size:10px;
letter-spacing:2px;
color:#666;
}

</style>
</head>

<body>

<div class="lock-screen" id="lock">

<div class="lock-box">

<div class="lock-title">
QX AI TERMINAL
</div>

<input type="password" id="pass" class="lock-input" placeholder="ACCESS KEY">

<button class="lock-btn" onclick="unlock()">
UNLOCK TERMINAL
</button>

<div class="error" id="err">
WRONG PASSWORD
</div>

</div>
</div>

<div class="container" id="app">

<div class="logo">
QX
</div>

<div class="title">
ABU BAKAR TRADER
</div>

<div class="sub">
PRO AI SIGNAL BOT
</div>

<select class="select" id="pair">
<option>USD/BRL OTC</option>
<option>USD/MXN OTC</option>
<option>USD/PKR OTC</option>
<option>EUR/USD OTC</option>
<option>GBP/USD OTC</option>
</select>

<select class="select">
<option>15 Seconds</option>
<option>30 Seconds</option>
<option>1 Minute</option>
</select>

<div class="chart">

<div class="live">
LIVE MARKET
</div>

<div class="price" id="price">
1.2500
</div>

<div class="scan" id="scan"></div>

<div class="candles" id="candles"></div>

</div>

<button class="btn" id="btn" onclick="getSignal()">
GET AI SIGNAL
</button>

<div class="result" id="result">

<div class="signal wait" id="signal">
WAIT
</div>

<div class="conf" id="conf">
85%
</div>

<div class="grid">

<div class="item">
RSI
<span id="rsi">50</span>
</div>

<div class="item">
TREND
<span id="trend">WAIT</span>
</div>

<div class="item">
EMA 9
<span id="ema9">1.2500</span>
</div>

<div class="item">
EMA 21
<span id="ema21">1.2500</span>
</div>

<div class="item">
MACD
<span id="macd">WAIT</span>
</div>

<div class="item">
PATTERN
<span id="pattern">SIDEWAYS</span>
</div>

</div>

</div>

<div class="footer">
HIGH SPEED AI ANALYZER
</div>

</div>

<script>

const correctPassword = "bakar786";

let currentPrice = 1.2500;

let candleData = [];

let lastSignal = "WAIT";

const candles = document.getElementById("candles");

const price = document.getElementById("price");

function unlock(){

const input = document.getElementById("pass").value;

if(input === correctPassword){

document.getElementById("lock").style.display = "none";

document.getElementById("app").style.display = "block";

generateCandles();

}
else{

document.getElementById("err").style.display = "block";

}

}

document.getElementById("pass").addEventListener("keyup",e=>{

if(e.key==="Enter"){
unlock();
}

});

function generateCandles(){

candles.innerHTML = "";

candleData = [];

for(let i=0;i<32;i++){

let move = Math.random() > 0.5;

let height = Math.floor(Math.random()*70)+20;

candleData.push({
green:move,
height:height
});

let div = document.createElement("div");

div.className = "candle " + (move ? "green":"red");

div.style.height = height + "px";

candles.appendChild(div);

}

}

function updateChart(){

let oldPrice = currentPrice;

if(lastSignal === "BUY"){

currentPrice += Math.random()*0.0005;

}
else if(lastSignal === "SELL"){

currentPrice -= Math.random()*0.0005;

}
else{

currentPrice += (Math.random()-0.5)*0.0005;

}

price.innerText = currentPrice.toFixed(4);

price.style.color = currentPrice >= oldPrice
? "#00ff88"
: "#ff3b3b";

candleData.shift();

let up = currentPrice >= oldPrice;

let h = Math.floor(Math.random()*70)+20;

candleData.push({
green:up,
height:h
});

candles.innerHTML = "";

candleData.forEach(c=>{

let d = document.createElement("div");

d.className = "candle " + (c.green ? "green":"red");

d.style.height = c.height + "px";

candles.appendChild(d);

});

}

setInterval(updateChart,500);

function getSignal(){

const scan = document.getElementById("scan");

const btn = document.getElementById("btn");

scan.style.display = "block";

btn.disabled = true;

document.getElementById("result").style.display = "none";

setTimeout(()=>{

scan.style.display = "none";

btn.disabled = false;

generateSignal();

},1500);

}

function generateSignal(){

document.getElementById("result").style.display = "block";

let greens = candleData.filter(c=>c.green).length;

let reds = candleData.length - greens;

let rsi = Math.floor((greens/candleData.length)*100);

let ema9 = currentPrice + ((greens-reds)*0.0001);

let ema21 = currentPrice - ((reds-greens)*0.00008);

let signal = "WAIT";

let trend = "SIDEWAYS";

let macd = "WAIT";

let pattern = "SIDEWAYS";

let confidence = 85;

if(greens > reds + 5){

signal = "BUY";

trend = "UP";

macd = "BUY";

pattern = "BULLISH";

confidence = Math.floor(Math.random()*5)+92;

}

else if(reds > greens + 5){

signal = "SELL";

trend = "DOWN";

macd = "SELL";

pattern = "BEARISH";

confidence = Math.floor(Math.random()*5)+91;

}

lastSignal = signal;

const signalBox = document.getElementById("signal");

signalBox.innerText = signal;

signalBox.className = "signal " + signal.toLowerCase();

document.getElementById("conf").innerText = confidence + "%";

document.getElementById("rsi").innerText = rsi;

document.getElementById("trend").innerText = trend;

document.getElementById("ema9").innerText = ema9.toFixed(4);

document.getElementById("ema21").innerText = ema21.toFixed(4);

document.getElementById("macd").innerText = macd;

document.getElementById("pattern").innerText = pattern;

// SOUND

let audio = new Audio(

signal==="BUY"

? "https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"

: signal==="SELL"

? "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"

: "https://actions.google.com/sounds/v1/cartoon/pop.ogg"

);

audio.play();

}

</script>

</body>
</html>
