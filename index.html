<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Signal Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter', sans-serif;}

body{background:#0a0e13;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;}

/* Password Screen */
.login-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0e13;display:flex;justify-content:center;align-items:center;z-index:9999;}
.login-box{background:#1a1f26;border:1px solid rgba(0,255,136,0.3);border-radius:16px;padding:30px 25px;width:90%;max-width:380px;box-shadow:0 0 40px rgba(0,255,136,0.15);text-align:center;}
.login-box h2{color:#00ff88;margin-bottom:10px;font-size:20px;}
.login-box p{color:#8b949e;font-size:13px;margin-bottom:20px;}
.login-box input{width:100%;padding:14px;background:#0a0e13;border:1px solid #30363d;border-radius:12px;color:#fff;font-size:15px;margin-bottom:15px;outline:none;text-align:center;letter-spacing:2px;}
.login-box button{width:100%;padding:14px;background:linear-gradient(90deg, #00ff88, #00d977);border:none;border-radius:12px;color:#000;font-size:15px;font-weight:700;cursor:pointer;}
.error{color:#ff4444;font-size:13px;margin-top:10px;display:none;}

/* Main Board */
.container{width:100%;max-width:380px;display:none;}
.container.show{display:block;}
.card{background:linear-gradient(180deg, #1a1f26 0%, #13171c 100%);border:1px solid rgba(0,255,136,0.4);border-radius:20px;padding:24px 20px;box-shadow:0 0 30px rgba(0,255,136,0.2);}
.header{text-align:center;margin-bottom:25px;}
.header h1{color:#00ff88;font-size:18px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px;}
.header p{color:#8b949e;font-size:12px;line-height:1.4;}
.label{color:#8b949e;font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.select-box{width:100%;padding:14px 16px;background:#0f1318;border:1px solid #2a2f36;border-radius:12px;color:#fff;font-size:14px;margin-bottom:18px;cursor:pointer;outline:none;}
.timeframe{display:flex;gap:8px;margin-bottom:20px;}
.time-btn{flex:1;padding:12px 0;background:#0f1318;border:1px solid #2a2f36;border-radius:10px;color:#8b949e;font-size:13px;font-weight:600;cursor:pointer;transition:0.2s;}
.time-btn.active{background:rgba(0,255,136,0.15);border:1px solid #00ff88;color:#00ff88;box-shadow:0 0 15px rgba(0,255,136,0.3);}
.gen-btn{width:100%;padding:15px;background:linear-gradient(90deg, #00ff88, #00d977);border:none;border-radius:12px;color:#000;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 0 25px rgba(0,255,136,0.4);}

/* Modal Popup */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);display:none;justify-content:center;align-items:center;z-index:9999;}
.modal-overlay.show{display:flex;}
.modal{background:#1e2329;border:1px solid rgba(0,255,136,0.3);border-radius:16px;padding:25px;width:90%;max-width:320px;box-shadow:0 0 40px rgba(0,255,136,0.25);text-align:center;}
.modal h3{color:#00ff88;margin-bottom:15px;font-size:20px;}
.modal p{color:#c9d1d9;margin-bottom:10px;font-size:15px;}
.modal-signal{font-size:22px;font-weight:700;}
.modal-btn{width:100%;padding:14px;background:#00ff88;border:none;border-radius:12px;color:#000;font-weight:700;font-size:16px;cursor:pointer;margin-top:15px;}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2>🔒 Access Locked</h2>
    <p>Password enter کریں بورڈ کھولنے کے لیے</p>
    <input type="password" id="passwordInput" placeholder="••••">
    <button onclick="checkPassword()">Unlock</button>
    <div class="error" id="errorMsg">Wrong Password!</div>
  </div>
</div>

<div class="container" id="mainBoard">
  <div class="card">
    <div class="header">
      <h1>🚀 Chinese Signal Generator 🚀</h1>
      <p>Generate high-precision trading signals with advanced AI algorithms</p>
    </div>

    <div class="label">⬜ Select Broker</div>
    <select class="select-box" id="broker">
      <option>Quotex</option>
      <option>Pocket Option</option>
      <option>IQ Option</option>
    </select>

    <div class="label">🔄 Trading Asset</div>
    <select class="select-box" id="asset">
      <option>NZD/CHF (OTC)</option>
      <option>USD/BRL (OTC)</option>
      <option>EUR/USD</option>
      <option>USD/JPY</option>
      <option>GBP/USD</option>
    </select>

    <div class="label">⏱ Time Frame</div>
    <div class="timeframe" id="timeframe">
      <div class="time-btn" data-time="5s">5s</div>
      <div class="time-btn active" data-time="15s">15s</div>
      <div class="time-btn" data-time="30s">30s</div>
      <div class="time-btn" data-time="1m">1m</div>
      <div class="time-btn" data-time="5m">5m</div>
    </div>

    <button class="gen-btn" onclick="generateSignal()">⚡ GENERATE SIGNAL ⚡</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>Signal Generated!</h3>
    <p><strong>Asset:</strong> <span id="modalAsset"></span></p>
    <p><strong>Timeframe:</strong> <span id="modalTime"></span></p>
    <p><strong>Signal:</strong> <span id="modalSignal" class="modal-signal"></span></p>
    <button class="modal-btn" onclick="closeModal()">OK</button>
  </div>
</div>

<script>
let selectedTime = '15s';
const correctPassword = "bakar786";

function checkPassword(){
  let input = document.getElementById('passwordInput').value.trim();
  if(input === correctPassword){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainBoard').classList.add('show');
  } else {
    document.getElementById('errorMsg').style.display = 'block';
    document.getElementById('passwordInput').value = '';
  }
}

document.querySelectorAll('.time-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.time-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    selectedTime = btn.dataset.time;
  }
});

function generateSignal(){
  let signal = Math.random() > 0.5 ? "BUY" : "SELL";
  let confidence = Math.floor(Math.random() * 10 + 88);
  let asset = document.getElementById('asset').value;
  let signalEl = document.getElementById('modalSignal');
  
  document.getElementById('modalAsset').innerText = asset;
  document.getElementById('modalTime').innerText = selectedTime;
  
  // سگنل کا رنگ سیٹ کرنا
  signalEl.innerText = `${signal} ${confidence}%`;
  signalEl.style.color = (signal === "BUY") ? "#00ff88" : "#ff4444";
  
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('passwordInput').addEventListener('keypress', function(e){
  if(e.key === 'Enter') checkPassword();
});
</script>

</body>
</html>
