<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TRADING BOT - ELITE PINK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff007f;
            --pink-glow: rgba(255, 0, 127, 0.4);
            --bg-color: #080105;
            --card-bg: rgba(15, 5, 10, 0.9);
            --border: rgba(255, 0, 127, 0.2);
        }

        body { 
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(255, 0, 127, 0.15) 0%, transparent 35%),
                radial-gradient(circle at 100% 100%, rgba(255, 0, 127, 0.1) 0%, transparent 35%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 420px; padding: 15px; box-sizing: border-box; }

        .bot-card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            padding: 25px;
            border-radius: 28px;
            border: 1px solid var(--border);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            text-align: center;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--pink);
            text-shadow: 0 0 15px var(--pink-glow);
            margin-bottom: 15px;
        }

        .status-badge {
            background: rgba(255, 0, 127, 0.12);
            color: var(--pink);
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 9px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .pulse { width: 6px; height: 6px; background: var(--pink); border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0.3; transform: scale(1); } }

        .input-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 10px; color: #888; margin-left: 5px; text-transform: uppercase; letter-spacing: 1px; }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            background: #12050b;
            color: #fff;
            border: 1px solid var(--border);
            font-size: 14px;
            margin-top: 5px;
            outline: none;
            cursor: pointer;
            transition: 0.3s;
        }

        #tv-frame { 
            border-radius: 18px; 
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
            background: #000;
        }

        .btn-analyze {
            background: linear-gradient(135deg, var(--pink), #b0005a);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(255, 0, 127, 0.3);
        }

        .btn-analyze:active { transform: scale(0.97); }

        #result {
            margin-top: 20px;
            padding: 18px;
            border-radius: 20px;
            display: none;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .signal-text { font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900; margin: 5px 0; }

        .loader-bar { width: 100%; height: 4px; background: #1a0a12; border-radius: 10px; margin-top: 20px; display: none; overflow: hidden; }
        .loader-progress { height: 100%; width: 0%; background: var(--pink); box-shadow: 0 0 10px var(--pink); transition: 2s linear; }

        .login-input {
            width: 100%; padding: 16px; border-radius: 14px; background: #000; border: 1px solid var(--border); color: #fff;
            text-align: center; font-size: 18px; margin-bottom: 15px; box-sizing: border-box; outline: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="loginSection" class="bot-card">
        <div style="font-size: 35px; margin-bottom: 10px;">🔐</div>
        <div class="header-title">ELITE ACCESS</div>
        <input type="password" id="passInput" class="login-input" placeholder="PASSKEY">
        <button class="btn-analyze" onclick="checkPass()">ACTIVATE AI</button>
    </div>

    <div id="botContent" style="display: none;">
        <div class="bot-card">
            <div class="status-badge"><div class="pulse"></div> AI ANALYZER ACTIVE</div>
            <div class="header-title">PREMIUM PANEL</div>
            
            <div class="input-group">
                <label>Select Market Asset</label>
                <select id="assetSelect" onchange="updateChart()">
                    <option value="FX_IDC:USDBRL">USD/BRL (OTC)</option>
                    <option value="FX_IDC:USDMXN">USD/MXN (OTC)</option>
                    <option value="FX_IDC:USDINR">USD/INR (OTC)</option>
                    <option value="FX:EURUSD">EUR/USD (OTC)</option>
                    <option value="CRYPTOCAP:BTC">BITCOIN (Live)</option>
                </select>
            </div>

            <iframe id="tv-frame" src="https://s.tradingview.com/widgetembed/?symbol=FX_IDC%3AUSDBRL&interval=1&theme=dark" width="100%" height="230" frameborder="0"></iframe>

            <button id="analyzeBtn" class="btn-analyze" onclick="getSignal()">ANALYZE MARKET</button>
            
            <div id="loader" class="loader-bar"><div id="fill" class="loader-progress"></div></div>

            <div id="result">
                <p id="sigText" class="signal-text"></p>
                <div id="accBox" style="font-size: 14px; font-weight: bold; margin-top: 5px;"></div>
                <div id="strat" style="font-size: 10px; color: #777; margin-top: 10px; letter-spacing: 1px;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    function checkPass() {
        if(document.getElementById("passInput").value === "Mybot786") {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("botContent").style.display = "block";
        } else {
            alert("ACCESS DENIED!");
        }
    }

    function updateChart() {
        const pair = document.getElementById("assetSelect").value.replace(":", "%3A");
        document.getElementById("tv-frame").src = `https://s.tradingview.com/widgetembed/?symbol=${pair}&interval=1&theme=dark`;
    }

    function getSignal() {
        const res = document.getElementById("result");
        const loader = document.getElementById("loader");
        const fill = document.getElementById("fill");
        const btn = document.getElementById("analyzeBtn");

        btn.disabled = true;
        btn.innerText = "SCANNING...";
        res.style.display = "none";
        loader.style.display = "block";
        fill.style.width = "0%";
        
        setTimeout(() => fill.style.width = "100%", 50);

        setTimeout(function() {
            loader.style.display = "none";
            btn.disabled = false;
            btn.innerText = "ANALYZE MARKET";
            res.style.display = "block";

            const isUp = Math.random() > 0.5;
            const signal = isUp ? "↑ CALL / BUY" : "↓ PUT / SELL";
            const color = isUp ? "#00ff9d" : "#ff3131";
            
            const sigEl = document.getElementById("sigText");
            sigEl.innerText = signal;
            sigEl.style.color = color;
            
            document.getElementById("accBox").innerText = `AI CONFIDENCE: ${(Math.random() * (99.1 - 94.2) + 94.2).toFixed(2)}%`;
            document.getElementById("accBox").style.color = color;
            document.getElementById("strat").innerText = isUp ? "ALGORITHM: BULLISH VOLUMETRIC SCAN" : "ALGORITHM: BEARISH BREAKOUT DETECTED";
            
            res.style.borderColor = color + "55";
            res.style.boxShadow = `0 0 20px ${color}22`;
        }, 2000);
    }
</script>
</body>
</html>
