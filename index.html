<script>

let currentPrice = 5.1200;
let prices = [];
let trendDirection = 1;
let trendStrength = 0.0025;

/* ========================= */
/* SMART LIVE MARKET ENGINE */
/* ========================= */

function livePrice(){

let base =
parseFloat(
document.getElementById("pair").value
);

/* TREND CHANGE */

if(Math.random() > 0.94){

trendDirection *= -1;

}

/* MARKET WAVE */

let wave =
Math.sin(Date.now()/2500) * 0.0018;

/* TREND MOVE */

let move =
(trendDirection * trendStrength)
+
wave
+
((Math.random()-0.5) * 0.0008);

/* PRICE UPDATE */

currentPrice += move;

/* SAFETY LIMIT */

if(currentPrice < base * 0.90){

currentPrice = base;

}

if(currentPrice > base * 1.10){

currentPrice = base;

}

/* SAVE HISTORY */

prices.push(currentPrice);

if(prices.length > 150){

prices.shift();

}

/* UPDATE PRICE */

document.getElementById("price")
.innerText =
currentPrice.toFixed(4);

/* UPDATE CHART */

drawChart();

}

/* ========================= */
/* LIVE CHART */
/* ========================= */

function drawChart(){

const bars =
document.getElementById("bars");

bars.innerHTML = "";

let recent =
prices.slice(-40);

let max =
Math.max(...recent);

let min =
Math.min(...recent);

recent.forEach((p,i)=>{

let div =
document.createElement("div");

let h =
((p-min)/(max-min+0.0001))*80+10;

div.className =
"bar " +
(i>0 && p>recent[i-1]
? "green"
: "red");

div.style.height =
h + "px";

bars.appendChild(div);

});

}

/* ========================= */
/* EMA */
/* ========================= */

function EMA(period,data){

if(data.length < period){

return data[data.length-1];

}

let k = 2/(period+1);

let ema = data[0];

for(let i=1;i<data.length;i++){

ema =
data[i]*k +
ema*(1-k);

}

return ema;

}

/* ========================= */
/* RSI */
/* ========================= */

function RSI(data,period=14){

if(data.length < period+1){

return 50;

}

let gains = 0;
let losses = 0;

for(let i=data.length-period;i<data.length;i++){

let diff =
data[i] - data[i-1];

if(diff > 0){

gains += diff;

}else{

losses -= diff;

}

}

let avgGain =
gains/period;

let avgLoss =
losses/period;

if(avgLoss === 0){

return 100;

}

let rs =
avgGain/avgLoss;

return 100 -
(100/(1+rs));

}

/* ========================= */
/* SMA */
/* ========================= */

function SMA(period,data){

if(data.length < period){

return data[data.length-1];

}

let slice =
data.slice(-period);

let sum =
slice.reduce((a,b)=>a+b,0);

return sum/period;

}

/* ========================= */
/* MACD */
/* ========================= */

function MACD(data){

let ema12 =
EMA(12,data);

let ema26 =
EMA(26,data);

let macd =
ema12 - ema26;

let signal =
macd * 0.9;

return {

macd: macd,
signal: signal

};

}

/* ========================= */
/* BOLLINGER BANDS */
/* ========================= */

function Bollinger(data,period=20){

let sma =
SMA(period,data);

let variance = 0;

let slice =
data.slice(-period);

slice.forEach(p=>{

variance +=
Math.pow(p-sma,2);

});

variance /= period;

let std =
Math.sqrt(variance);

return {

upper:
sma + (2*std),

lower:
sma - (2*std),

mid:
sma

};

}

/* ========================= */
/* MOMENTUM */
/* ========================= */

function Momentum(data){

if(data.length < 10){

return 0;

}

return
data[data.length-1]
-
data[data.length-10];

}

/* ========================= */
/* AI SIGNAL ENGINE */
/* ========================= */

function detectTrend(){

if(prices.length < 60){

alert(
"Loading Real Market Data..."
);

return;

}

/* INDICATORS */

let rsi =
RSI(prices);

let ema9 =
EMA(9,prices);

let ema21 =
EMA(21,prices);

let ema50 =
EMA(50,prices);

let macd =
MACD(prices);

let bb =
Bollinger(prices);

let momentum =
Momentum(prices);

let current =
prices[prices.length-1];

/* SCORE */

let buyScore = 0;
let sellScore = 0;

/* RSI */

if(rsi < 35){

buyScore += 2;

}

if(rsi > 65){

sellScore += 2;

}

/* EMA TREND */

if(
ema9 > ema21 &&
ema21 > ema50
){

buyScore += 3;

}

if(
ema9 < ema21 &&
ema21 < ema50
){

sellScore += 3;

}

/* MACD */

if(
macd.macd >
macd.signal &&
macd.macd > 0
){

buyScore += 2;

}

if(
macd.macd <
macd.signal &&
macd.macd < 0
){

sellScore += 2;

}

/* MOMENTUM */

if(momentum > 0){

buyScore += 1;

}

if(momentum < 0){

sellScore += 1;

}

/* BOLLINGER */

if(current < bb.lower){

buyScore += 2;

}

if(current > bb.upper){

sellScore += 2;

}

/* SIDEWAYS FILTER */

let recent =
prices.slice(-15);

let max =
Math.max(...recent);

let min =
Math.min(...recent);

let range =
max - min;

/* FINAL */

let signal = "WAIT";
let className = "wait";
let confidence = 65;

/* NO TRADE ZONE */

if(range < 0.0025){

signal = "WAIT";

className = "wait";

confidence = 68;

}

/* BUY */

else if(
buyScore >= 7 &&
buyScore > sellScore
){

signal = "BUY";

className = "buy";

confidence =
88 + buyScore;

}

/* SELL */

else if(
sellScore >= 7 &&
sellScore > buyScore
){

signal = "SELL";

className = "sell";

confidence =
88 + sellScore;

}

/* UPDATE UI */

document.getElementById("signalText")
.innerText =
signal;

document.getElementById("signalText")
.className =
"signal " + className;

document.getElementById("confidence")
.innerText =
confidence + "%";

document.getElementById("rsi")
.innerText =
rsi.toFixed(1);

document.getElementById("ema9")
.innerText =
ema9.toFixed(4);

document.getElementById("ema21")
.innerText =
ema21.toFixed(4);

document.getElementById("macd")
.innerText =
macd.macd.toFixed(4);

document.getElementById("bb")
.innerText =
bb.mid.toFixed(4);

document.getElementById("momentum")
.innerText =
momentum.toFixed(4);

document.getElementById("tf")
.innerText =
document.getElementById("time")
.value + "s";

/* SOUND */

navigator.vibrate([200,100,200]);

}

/* ========================= */
/* AUTO START */
/* ========================= */

setInterval(livePrice,1000);

/* BUTTON */

document.querySelector(".scan")
.onclick =
detectTrend;

</script>
