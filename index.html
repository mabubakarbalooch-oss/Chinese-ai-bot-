<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAK AI SIGNAL BOT PRO V9.1</title>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
    body{background:#0a0e1a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px;}
    .app{width:100%;max-width:420px;background:linear-gradient(180deg,#0d1424,#0a0e1a);border-radius:25px;border:1px solid #1e2a4a;overflow:hidden;}
    
    .header{padding:18px;text-align:center;}
    .header h1{font-size:18px;color:#00d9ff;font-weight:800;letter-spacing:1px;}
    .header .tag{font-size:10px;color:#00ff99;background:#00ff9915;padding:4px 10px;border-radius:20px;display:inline-block;margin-top:6px;}
    
    .chart-box{background:#0f1729;margin:12px;border-radius:15px;padding:10px;border:1px solid #1e2a4a;}
    #mini-chart{height:180px;border-radius:10px;overflow:hidden;position:relative;}
    .scan-text{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);color:#00d9ff;font-size:12px;font-weight:600;display:none;}
    .scan-text.active{display:block;}
    
    .pair-select{margin:12px;background:#0f1729;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;border:1px solid #1e2a4a;}
    .pair-select select{flex:1;background:transparent;border:none;color:#fff;font-weight:600;font-size:14px;outline:none;}
    
    .btn{width:calc(100% - 24px);margin:0 12px 12px;padding:16px;border-radius:12px;border:none;background:linear-gradient(90deg,#00d9ff,#00aaff);color:#000;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
    .btn:disabled{background:#2a3447;color:#666;cursor:not-allowed;}
    .btn.stop{background:linear-gradient(90deg,#ff4757,#ff6b7a);}
    
    .scan-box{margin:12px;background:#0f1729;border-radius:15px;padding:15px;border:1px solid #1e2a4a;display:none;align-items:center;gap:15px;}
    .circle-progress{width:50px;height:50px;position:relative;}
    .circle-progress svg{transform:rotate(-90deg);}
    .circle-progress circle{fill:none;stroke-width:3;stroke-linecap:round;}
    .circle-bg{stroke:#1e2a4a;}
    .circle-fg{stroke:#00ff99;stroke-dasharray:138;stroke-dashoffset:138;transition:stroke-dashoffset 1s linear;}
    .scan-info{flex:1;}
    .scan-info h3{color:#00d9ff;font-size:14px;}
    .scan-info p{font-size:11px;color:#8892b0;margin-top:3px;}
    .timer{font-size:24px;font-weight:800;color:#00ff99;}
    
    .result-box{margin:12px;background:#0f1729;border-radius:15px;padding:15px;border:1px solid #1e2a4a;display:none;}
    .result-grid{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;gap:10px;margin-top:10px;}
    .result-label{font-size:10px;color:#8892b0;}
    .result-value{font-size:18px;font-weight:800;margin-top:5px;}
    .call{color:#00ff99;}
    .put{color:#ff4757;}
    .details{font-size:11px;color:#8892b0;margin-top:8px;text-align:center;}
    
    .accuracy-circle{width:60px;height:60px;position:relative;margin:auto;}
    .accuracy-circle svg{transform:rotate(-90deg);}
    .accuracy-circle circle{fill:none;stroke-width:4;stroke-linecap:round;}
    .accuracy-bg{stroke:#1e2a4a;}
    .accuracy-fg{stroke:#00ff99;stroke-dasharray:157;stroke-dashoffset:157;}
    .accuracy-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;font-weight:800;color:#00ff99;}
    
    .settings{margin:12px;background:#0f1729;border-radius:15px;padding:12px;border:1px solid #1e2a4a;display:flex;justify-content:space-between;align-items:center;}
    .toggle{width:45px;height:24px;background:#2a3447;border-radius:12px;position:relative;cursor:pointer;transition:0.3s;}
    .toggle.active{background:#00d9ff;}
    .toggle::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:0.3s;}
    .toggle.active::after{left:24px;}
    
    .login{padding:40px 20px;text-align:center;}
    .login input{width:100%;padding:14px;border-radius:12px;background:#0f1729;border:1px solid #1e2a4a;color:#fff;text-align:center;margin-bottom:15px;}
</style>
</head>
<body>

<div class="app" id="login">
    <div class="login">
        <h2 style="color:#00d9ff;margin-bottom:20px;">PAK AI SIGNAL BOT PRO</h2>
        <input type="password" id="key" placeholder="Enter Key: Pak786">
        <button class="btn" onclick="startApp()">LOGIN</button>
    </div>
</div>

<div class="app" id="main" style="display:none;">
    <div class="header">
        <h1>PAK AI SIGNAL BOT PRO</h1>
        <span class="tag">AI POWERED • SMART ANALYSIS • HIGH ACCURACY</span>
    </div>
    
    <div class="chart-box">
        <div id="mini-chart">
            <div class="scan-text" id="scanText">SCANNING MARKET...</div>
        </div>
    </div>
    
    <div class="pair-select">
        <span>🌍</span>
        <select id="pairList" onchange="changeMarket()">
            <optgroup label="Binance Pairs">
                <option value="EURUSDT">EUR/USDT</option>
                <option value="BTCUSDT">BTC/USDT</option>
                <option value="ETHUSDT">ETH/USDT</option>
            </optgroup>
            <optgroup label="OTC Pairs">
                <option value="EURUSD">EUR/USD OTC</option>
                <option value="GBPUSD">GBP/USD OTC</option>
                <option value="USDJPY">USD/JPY OTC</option>
            </optgroup>
        </select>
    </div>
    
    <button class="btn" id="scanBtn" onclick="runScan()">⚡ ANALYZE MARKET</button>
    
    <div class="scan-box" id="scanBox">
        <div class="circle-progress">
            <svg width="50" height="50">
                <circle class="circle-bg" cx="25" cy="25" r="22"/>
                <circle class="circle-fg" id="circleFg" cx="25" cy="25" r="22"/>
            </svg>
        </div>
        <div class="scan-info">
            <h3>SCANNING MARKET...</h3>
            <p>Analyzing RSI, EMA, SMA & Trend</p>
        </div>
        <div class="timer" id="timer">03</div>
    </div>
    
    <div class="result-box" id="resultBox">
        <div style="text-align:center;font-size:12px;color:#00d9ff;margin-bottom:10px;">ANALYSIS RESULT</div>
        <div class="result-grid">
            <div>
                <div style="font-size:20px;">⬆️</div>
                <div class="result-value call" id="signal">CALL</div>
                <div style="font-size:20px;">⬆️</div>
            </div>
            <div>
                <div class="result-label">CONFIDENCE</div>
                <div class="accuracy-circle">
                    <svg width="60" height="60">
                        <circle class="accuracy-bg" cx="30" cy="30" r="25"/>
                        <circle class="accuracy-fg" id="accuracyFg" cx="30" cy="30" r="25"/>
                    </svg>
                    <div class="accuracy-text" id="accuracy">92%</div>
                </div>
            </div>
            <div>
                <div class="result-label">EXPIRY TIME</div>
                <div style="font-size:20px;margin-top:5px;">⏰</div>
                <div class="result-value">1 MIN</div>
            </div>
        </div>
        <div class="details" id="details">RSI: 62.46 | EMA12: 100.22 | EMA26: 99.91</div>
    </div>
    
    <div class="settings">
        <div>
            <div style="font-size:13px;font-weight:600;">🔔 SOUND ALERT</div>
            <div style="font-size:11px;color:#8892b0;">Enabled</div>
        </div>
        <div class="toggle active" id="soundToggle" onclick="toggleSound()"></div>
    </div>
</div>

<script>
let currentPair = "EURUSDT";
let audioCtx;
let scanning = false;
let scanInterval;

function startApp(){
    if(document.getElementById('key').value === 'Pak786'){
        document.getElementById('login').style.display='none';
        document.getElementById('main').style.display='block';
        loadChart(currentPair);
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } else { 
        alert('Wrong Key! Correct key: Pak786'); 
    }
}

function loadChart(symbol){
    document.getElementById('mini-chart').innerHTML = '<div class="scan-text" id="scanText">SCANNING MARKET...</div>';
    let tvSymbol = symbol.includes('USDT') ? "BINANCE:"+symbol : "FX:"+symbol;
    new TradingView.widget({
        "width":"100%","height":180,"symbol":tvSymbol,
        "interval":"1","theme":"dark","style":"1",
        "hide_top_toolbar":true,"hide_legend":true,"container_id":"mini-chart"
    });
}

function changeMarket(){
    currentPair = document.getElementById('pairList').value;
    loadChart(currentPair);
}

async function getCandles(symbol){
    try{
        if(symbol.includes('USDT')){
            let proxy = "https://api.allorigins.win/raw?url=";
            let url = proxy + encodeURIComponent(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1m&limit=50`);
            let res = await fetch(url);
            let data = await res.json();
            return data.map(c => parseFloat(c[4]));
        }else{
            let demo = []; let base = 1.1640 + Math.random()*0.1;
            for(let i=0;i<50;i++){base += (Math.random()-0.5)*0.002;demo.push(base);}
            return demo;
        }
    }catch(e){
        let demo = []; let base = 1.1640;
        for(let i=0;i<50;i++){base += (Math.random()-0.5)*0.001;demo.push(base);}
        return demo;
    }
}

function calculateRSI(prices,period=14){
    let gains=0,losses=0;
    for(let i=1;i<=period;i++){
        let diff=prices[i]-prices[i-1];
        if(diff>0)gains+=diff;else losses-=diff;
    }
    let avgGain=gains/period,avgLoss=losses/period;
    if(avgLoss===0)return 100;
    let rs=avgGain/avgLoss;
    return 100-(100/(1+rs));
}

function calculateEMA(prices,period){
    let k=2/(period+1);
    let ema=prices[0];
    for(let i=1;i<prices.length;i++){
        ema=prices[i]*k+ema*(1-k);
    }
    return ema;
}

function playBeep(type){
    if(!audioCtx || !document.getElementById('soundToggle').classList.contains('active'))return;
    try{
        let osc=audioCtx.createOscillator();
        let gain=audioCtx.createGain();
        osc.connect(gain);gain.connect(audioCtx.destination);
        osc.frequency.value=type==="CALL"?1000:400;
        gain.gain.value=0.3;
        osc.start();osc.stop(audioCtx.currentTime+0.2);
    }catch(e){}
}

function toggleSound(){
    document.getElementById('soundToggle').classList.toggle('active');
}

function stopScan(){
    scanning=false;
    clearInterval(scanInterval);
    document.getElementById('scanBox').style.display='none';
    document.getElementById('scanText').classList.remove('active');
    document.getElementById('scanBtn').disabled=false;
    document.getElementById('scanBtn').innerText="⚡ ANALYZE MARKET";
    document.getElementById('scanBtn').classList.remove('stop');
    document.getElementById('scanBtn').onclick=runScan;
}

async function runScan(){
    if(scanning)return;
    scanning=true;
    
    let btn=document.getElementById('scanBtn');
    let scanBox=document.getElementById('scanBox');
    let scanText=document.getElementById('scanText');
    let timer=document.getElementById('timer');
    let circleFg=document.getElementById('circleFg');
    let resultBox=document.getElementById('resultBox');
    
    btn.disabled=true;
    btn.innerText="⏹️ STOP SCAN";
    btn.classList.add('stop');
    btn.onclick=stopScan;
    scanBox.style.display='flex';
    scanText.classList.add('active');
    resultBox.style.display='none';
    
    let count=3;
    timer.innerText=count.toString().padStart(2,'0');
    circleFg.style.strokeDashoffset=138;
    
    scanInterval=setInterval(()=>{
        count--;
        timer.innerText=count.toString().padStart(2,'0');
        circleFg.style.strokeDashoffset=138-(138*(3-count)/3);
        
        if(count<=0){
            clearInterval(scanInterval);
            generateSignal();
        }
    },1000);
}

async function generateSignal(){
    let prices=await getCandles(currentPair);
    let rsi=calculateRSI(prices);
    let ema12=calculateEMA(prices,12);
    let ema26=calculateEMA(prices,26);
    let lastPrice=prices[prices.length-1];
    
    let signal,color,confidence=65;
    let trend = ema12 > ema26 ? "BULLISH" : "BEARISH";
    
    if(rsi<40 && lastPrice>ema12 && ema12>ema26){
        signal="CALL";color="call";confidence=85+Math.floor(Math.random()*10);
        playBeep("CALL");
    }else if(rsi>60 && lastPrice<ema12 && ema12<ema26){
        signal="PUT";color="put";confidence=85+Math.floor(Math.random()*10);
        playBeep("PUT");
    }else if(rsi<50 && lastPrice>ema12){
        signal="CALL";color="call";confidence=70+Math.floor(Math.random()*10);
        playBeep("CALL");
    }else if(rsi>50 && lastPrice<ema12){
        signal="PUT";color="put";confidence=70+Math.floor(Math.random()*10);
        playBeep("PUT");
    }else{
        signal="WAIT";color="call";confidence=50;
    }
    
    document.getElementById('signal').innerText=signal;
    document.getElementById('signal').className='result-value '+color;
    document.getElementById('accuracy').innerText=confidence+'%';
    document.getElementById('accuracyFg').style.strokeDashoffset=157-(157*confidence/100);
    document.getElementById('details').innerText=`RSI:${rsi.toFixed(2)} | EMA12:${ema12.toFixed(4)} | EMA26:${ema26.toFixed(4)} | Trend:${trend}`;
    document.getElementById('resultBox').style.display='block';
    
    stopScan();
}
</script>
</body>
</html>
