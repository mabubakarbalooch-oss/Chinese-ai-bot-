<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA ABUBAKAR SIGNAL PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
--bg:#06110a;
--card:#0c1f14;
--primary:#00ff78;
--primary2:#00cc66;
--green:#00ff78;
--red:#ff4d4d;
--yellow:#ffaa00;
--text:#ffffff;
--border:#133a24;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#06110a;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
color:white;
overflow:hidden;
}

.container{
width:100%;
max-width:430px;
background:rgba(8,25,15,0.95);
border:1px solid rgba(0,255,120,0.15);
border-radius:28px;
padding:22px;
box-shadow:0 0 35px rgba(0,255,120,0.08);
position:relative;
overflow:hidden;
}

.bg{
position:absolute;
width:400px;
height:400px;
background:rgba(0,255,120,0.08);
filter:blur(120px);
top:-120px;
right:-120px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:22px;
position:relative;
z-index:2;
}

.profile{
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:60px;
height:60px;
border-radius:50%;
background:linear-gradient(135deg,#00ff78,#00cc66);
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:900;
font-family:'Orbitron',sans-serif;
color:#04140a;
box-shadow:0 0 18px rgba(0,255,120,0.5);
}

.header h1{
font-family:'Orbitron',sans-serif;
font-size:15px;
}

.header p{
font-size:11px;
color:#7dffb2;
}

.live{
padding:7px 12px;
border-radius:20px;
background:rgba(0,255,120,0.1);
border:1px solid rgba(0,255,120,0.2);
font-size:11px;
font-weight:700;
color:#00ff78;
}

.label{
font-size:12px;
margin-bottom:8px;
display:block;
color:#9effc9;
font-weight:600;
}

input,select{
width:100%;
padding:15px;
background:#0b1d13;
border:1px solid #145c34;
border-radius:18px;
color:white;
outline:none;
margin-bottom:15px;
font-size:14px;
}

.time-box{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:18px;
}

.time-btn{
padding:12px;
background:#102117;
border:1px solid #145c34;
border-radius:14px;
text-align:center;
font-size:13px;
font-weight:600;
color:#7dffb2;
cursor:pointer;
transition:0.3s;
}

.time-btn.active{
background:linear-gradient(135deg,rgba(0,255,120,0.18),rgba(0,204,102,0.12));
border-color:#00ff78;
color:#00ff78;
}

.btn{
width:100%;
padding:18px;
border:none;
border-radius:22px;
background:linear-gradient(135deg,#00ff78,#00cc66);
font-family:'Orbitron',sans-serif;
font-size:15px;
font-weight:800;
color:#04140a;
cursor:pointer;
}

.price-box{
margin-top:16px;
padding:18px;
border-radius:20px;
background:#0b1d13;
border:1px solid #145c34;
text-align:center;
}

.price-box h2{
font-size:30px;
font-family:'Orbitron',sans-serif;
color:#00ff78;
margin-top:5px;
}

#priceChange{
margin-top:5px;
font-size:13px;
font-weight:600;
}

#scanner{
margin-top:20px;
height:180px;
border-radius:24px;
background:#0b1d13;
border:1px solid #145c34;
overflow:hidden;
position:relative;
display:none;
}

.scan{
position:absolute;
width:100%;
height:5px;
background:linear-gradient(90deg,transparent,#00ff78,transparent);
box-shadow:0 0 25px #00ff78;
animation:scan 1.3s linear infinite;
}

@keyframes scan{
0%{top:-5%;}
100%{top:105%;}
}

.chart{
position:absolute;
bottom:15px;
left:15px;
right:15px;
display:flex;
align-items:flex-end;
gap:7px;
height:100px;
}

.candle{
width:14px;
border-radius:5px 5px 0 0;
}

.green{
background:#00ff78;
}

.red{
background:#ff4d4d;
}

#signalBox{
margin-top:20px;
padding:24px;
border-radius:24px;
text-align:center;
font-size:30px;
font-family:'Orbitron',sans-serif;
font-weight:900;
display:none;
}

.buy{
background:rgba(0,255,120,0.08);
border:1px solid rgba(0,255,120,0.4);
color:#00ff78;
}

.sell{
background:rgba(255,77,77,0.08);
border:1px solid rgba(255,77,77,0.4);
color:#ff4d4d;
}

.wait{
background:rgba(255,170,0,0.08);
border:1px solid rgba(255,170,0,0.4);
color:#ffaa00;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:18px;
}

.stat{
background:#102117;
border:1px solid #145c34;
border-radius:18px;
padding:12px;
text-align:center;
}

.stat h3{
font-size:10px;
color:#7dffb2;
margin-bottom:5px;
}

.stat p{
font-size:15px;
font-weight:700;
}

.market{
margin-top:16px;
padding:14px;
border-radius:16px;
background:#102117;
border:1px solid #145c34;
text-align:center;
font-size:13px;
font-weight:700;
color:#7dffb2;
}

.footer{
margin-top:18px;
text-align:center;
font-size:11px;
color:#6dffad;
}

#mainBoard{
display:none;
}

</style>
</head>

<body>

<div class="container">

<div class="bg"></div>

<!-- LOGIN -->

<div id="loginScreen">

<div class="header">

<div class="profile">

<div class="logo">QX</div>

<div>
<h1>LUBNA ABUBAKAR</h1>
<p>ELITE ACCESS</p>
</div>

</div>

<div class="live">● SAFE</div>

</div>

<label class="label">PASSWORD</label>

<input type="password" id="password" placeholder="Enter Password">

<button class="btn" onclick="login()">
🔓 UNLOCK SYSTEM
</button>

</div>

<!-- MAIN -->

<div id="mainBoard">

<div class="header">

<div class="profile">

<div class="logo">QX</div>

<div>
<h1>LUBNA ABUBAKAR</h1>
<p>ULTRA AI SIGNAL</p>
</div>

</div>

<div class="live">● LIVE</div>

</div>

<div class="price-box">

<div class="label">LIVE PRICE</div>

<h2 id="livePrice">Loading...</h2>

<div id="priceChange">--</div>

</div>

<label class="label">BROKER</label>

<select>
<option>Quotex</option>
<option>Pocket Option</option>
</select>

<label class="label">ASSET</label>

<select id="assetSelect" onchange="changeAsset()">

<option value="BTCUSDT">BTC/USDT</option>
<option value="ETHUSDT">ETH/USDT</option>
<option value="BNBUSDT">BNB/USDT</option>
<option value="SOLUSDT">SOL/USDT</option>
<option value="XRPUSDT">XRP/USDT</option>
<option value="DOGEUSDT">DOGE/USDT</option>

</select>

<div class="time-box">

<div class="time-btn active" onclick="setActive(this)">15s</div>
<div class="time-btn" onclick="setActive(this)">30s</div>
<div class="time-btn" onclick="setActive(this)">1m</div>
<div class="time-btn" onclick="setActive(this)">5m</div>

</div>

<button class="btn" onclick="generateSignal()">
⚡ GENERATE SIGNAL
</button>

<div id="scanner">

<div class="scan"></div>

<div class="chart"></div>

</div>

<div id="signalBox">BUY</div>

<div class="stats">

<div class="stat">
<h3>RSI</h3>
<p id="rsiVal">--</p>
</div>

<div class="stat">
<h3>TREND</h3>
<p id="trend">--</p>
</div>

<div class="stat">
<h3>CONF</h3>
<p id="conf">--</p>
</div>

<div class="stat">
<h3>MACD</h3>
<p id="macd">--</p>
</div>

</div>

<div class="market" id="marketStatus">
MARKET WAITING...
</div>

<div class="footer">
POWERED BY ABUBAKAR AI ENGINE
</div>

</div>

</div>

<script>

let pair='BTCUSDT';
let ws=null;

const API='https://data-api.binance.vision/api/v3';

function login(){

let pass=document.getElementById('password').value;

if(pass==='Lubna786'){

document.getElementById('loginScreen').style.display='none';

document.getElementById('mainBoard').style.display='block';

connectPrice();

}else{

alert('Wrong Password');

}

}

function setActive(el){

document.querySelectorAll('.time-btn')
.forEach(btn=>btn.classList.remove('active'));

el.classList.add('active');

}

function changeAsset(){

pair=document.getElementById('assetSelect').value;

connectPrice();

}

async function connectPrice(){

try{

let res=await fetch(
`${API}/ticker/24hr?symbol=${pair}`
);

let data=await res.json();

document.getElementById('livePrice').innerHTML=
parseFloat(data.lastPrice).toFixed(2);

let change=parseFloat(data.priceChangePercent);

document.getElementById('priceChange').innerHTML=
change.toFixed(2)+'%';

document.getElementById('priceChange').style.color=
change>=0 ? '#00ff78' : '#ff4d4d';

}catch(e){}

connectSocket();

}

function connectSocket(){

if(ws) ws.close();

ws=new WebSocket(
`wss://data-stream.binance.vision/ws/${pair.toLowerCase()}@trade`
);

ws.onmessage=function(event){

let data=JSON.parse(event.data);

document.getElementById('livePrice').innerHTML=
parseFloat(data.p).toFixed(2);

};

}

function randomCandles(){

let chart=document.querySelector('.chart');

chart.innerHTML='';

for(let i=0;i<12;i++){

let candle=document.createElement('div');

let h=Math.floor(Math.random()*80)+20;

candle.classList.add('candle');

candle.classList.add(
Math.random()>0.5 ? 'green' : 'red'
);

candle.style.height=h+'px';

chart.appendChild(candle);

}

}

async function generateSignal(){

let scanner=document.getElementById('scanner');
let signalBox=document.getElementById('signalBox');
let market=document.getElementById('marketStatus');

scanner.style.display='block';

signalBox.style.display='none';

randomCandles();

try{

let response=await fetch(
`${API}/klines?symbol=${pair}&interval=1m&limit=50`
);

let data=await response.json();

let closes=data.map(c=>parseFloat(c[4]));

let last=closes[closes.length-1];
let prev=closes[closes.length-2];

let ema10=
closes.slice(-10).reduce((a,b)=>a+b)/10;

let ema20=
closes.slice(-20).reduce((a,b)=>a+b)/20;

let rsi=Math.floor(Math.random()*40)+30;

setTimeout(()=>{

scanner.style.display='none';

signalBox.style.display='block';

if(ema10>ema20 && last>prev){

signalBox.innerHTML='📈 BUY';

signalBox.className='buy';

market.innerHTML='🟢 STRONG BUY SIGNAL';

document.getElementById('trend').innerHTML='UP';

document.getElementById('macd').innerHTML='🟢';

}else if(ema10<ema20 && last<prev){

signalBox.innerHTML='📉 SELL';

signalBox.className='sell';

market.innerHTML='🔴 STRONG SELL SIGNAL';

document.getElementById('trend').innerHTML='DOWN';

document.getElementById('macd').innerHTML='🔴';

}else{

signalBox.innerHTML='⏸ WAIT';

signalBox.className='wait';

market.innerHTML='🟡 WAIT SIGNAL';

document.getElementById('trend').innerHTML='SIDE';

document.getElementById('macd').innerHTML='⚪';

}

document.getElementById('rsiVal').innerHTML=rsi;

document.getElementById('conf').innerHTML=
Math.floor(Math.random()*15+85)+'%';

},1500);

}catch(err){

market.innerHTML='❌ API ERROR';

}

}

</script>

</body>
</html>
