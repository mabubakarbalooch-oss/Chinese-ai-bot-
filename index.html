<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Signal Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter', sans-serif;
}

body{
background:#0d1117;
min-height:100vh;
padding:15px;
color:#fff;
display:flex;
justify-content:center;
align-items:flex-start;
}

.container{
width:100%;
max-width:450px;
display:flex;
flex-direction:column;
gap:15px;
}

.card{
background:#161b22;
border:1px solid rgba(0,255,136,0.2);
border-radius:16px;
padding:18px;
box-shadow:0 0 25px rgba(0,255,136,0.1);
}

.select-box{
background:#0d1117;
border:1px solid #30363d;
border-radius:12px;
padding:14px;
color:#fff;
font-size:15px;
margin-bottom:15px;
cursor:pointer;
display:flex;
justify-content:space-between;
align-items:center;
}

.label{
display:flex;
align-items:center;
gap:8px;
font-size:13px;
color:#8b949e;
margin-bottom:8px;
}

.timeframe{
display:flex;
gap:8px;
margin:15px 0;
}
.time-btn{
flex:1;
padding:12px;
background:#21262d;
border:1px solid #30363d;
border-radius:10px;
color:#8b949e;
font-size:14px;
font-weight:600;
cursor:pointer;
transition:0.2s;
}
.time-btn.active{
background:rgba(0,255,136,0.15);
border:1px solid #00ff88;
color:#00ff88;
box-shadow:0 0 15px rgba(0,255,136,0.3);
}

.gen-btn{
width:100%;
padding:14px;
background:linear-gradient(90deg, #00ff88, #00d977);
border:none;
border-radius:12px;
color:#000;
font-size:15px;
font-weight:700;
cursor:pointer;
margin:15px 0 10px;
box-shadow:0 0 20px rgba(0,255,136,0.4);
}
.gen-btn:active{
transform:scale(0.98);
}

.footer{
text-align:center;
font-size:11px;
color:#6e7681;
}

/* Asset dropdown list */
.asset-dropdown{
background:#161b22;
border:1px solid rgba(0,255,136,0.2);
border-radius:16px;
padding:10px;
max-height:0;
overflow:hidden;
transition:max-height 0.3s ease;
}
.asset-dropdown.open{
max-height:400px;
overflow-y:auto;
}

.asset-item{
padding:14px 12px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #21262d;
font-size:14px;
color:#c9d1d9;
cursor:pointer;
}
.asset-item:last-child{
border-bottom:none;
}
.asset-item.active{
color:#00ff88;
}

.radio{
width:20px;
height:20px;
border:2px solid #30363d;
border-radius:50%;
position:relative;
}
.radio.active{
border-color:#00ff88;
}
.radio.active::after{
content:'';
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:10px;
height:10px;
background:#00ff88;
border-radius:50%;
box-shadow:0 0 10px #00ff88;
}

/* Scrollbar */
.asset-dropdown::-webkit-scrollbar{
width:4px;
}
.asset-dropdown::-webkit-scrollbar-thumb{
background:#30363d;
border-radius:10px;
}
</style>
</head>
<body>

<div class="container">
  
  <!-- Main Generator Card -->
  <div class="card">
    
    <div class="select-box">Quotex</div>
    
    <div class="label">🔄 Trading Asset</div>
    <div class="select-box" id="assetSelect" onclick="toggleAssetList()">
      <span id="selectedAsset">NZD/CHF (OTC)</span>
      <span>▼</span>
    </div>
    
    <!-- Asset List - Hidden by default -->
    <div class="asset-dropdown" id="assetDropdown">
      <div class="asset-item">USD/پاکستان (OTC) <div class="radio"></div></div>
      <div class="asset-item">USD/PHP (OTC) <div class="radio"></div></div>
      <div class="asset-item">EUR/SGD (OTC) <div class="radio"></div></div>
      <div class="asset-item">USD/BRL (OTC) <div class="radio"></div></div>
      <div class="asset-item active">NZD/CHF (OTC) <div class="radio active"></div></div>
      <div class="asset-item">USD/TRY (OTC) <div class="radio"></div></div>
      <div class="asset-item">USD/PKR (OTC) <div class="radio"></div></div>
      <div class="asset-item">USD/COP (OTC) <div class="radio"></div></div>
      <div class="asset-item">USD/MXN (OTC) <div class="radio"></div></div>
      <div class="asset-item">EUR/USD <div class="radio"></div></div>
      <div class="asset-item">EUR/GBP <div class="radio"></div></div>
      <div class="asset-item">EUR/JPY <div class="radio"></div></div>
    </div>
    
    <div class="label">⏱ Time Frame</div>
    <div class="timeframe" id="timeframe">
      <div class="time-btn" data-time="5s">5s</div>
      <div class="time-btn active" data-time="15s">15s</div>
      <div class="time-btn" data-time="30s">30s</div>
      <div class="time-btn" data-time="1m">1m</div>
      <div class="time-btn" data-time="5m">5m</div>
    </div>
    
    <button class="gen-btn" onclick="generateSignal()">⚡ GENERATE SIGNAL ⚡</button>
    
    <div class="footer">For educational purposes only. No financial advice.</div>
  </div>

</div>

<script>
let selectedTime = '15s';
let selectedAsset = 'NZD/CHF (OTC)';

// Toggle asset list
function toggleAssetList(){
  document.getElementById('assetDropdown').classList.toggle('open');
}

// Timeframe selection
document.querySelectorAll('.time-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.time-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    selectedTime = btn.dataset.time;
  }
});

// Asset selection
document.querySelectorAll('.asset-item').forEach(item=>{
  item.onclick=()=>{
    document.querySelectorAll('.asset-item').forEach(i=>i.classList.remove('active'));
    document.querySelectorAll('.radio').forEach(r=>r.classList.remove('active'));
    item.classList.add('active');
    item.querySelector('.radio').classList.add('active');
    selectedAsset = item.textContent.trim();
    document.getElementById('selectedAsset').innerText = selectedAsset;
    document.getElementById('assetDropdown').classList.remove('open');
  }
});

function generateSignal(){
  alert(`Signal Generated!\nAsset: ${selectedAsset}\nTimeframe: ${selectedTime}\n\nYahan apna bot API connect karo.`);
}

// Close dropdown when clicking outside
document.addEventListener('click', function(e){
  if(!e.target.closest('#assetSelect') && !e.target.closest('#assetDropdown')){
    document.getElementById('assetDropdown').classList.remove('open');
  }
});
</script>

</body>
</html>
