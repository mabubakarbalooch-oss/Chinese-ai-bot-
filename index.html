<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA ABUBAKAR AI</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d1117;font-family:'Orbitron',sans-serif;color:#fff;overflow:hidden;}
.login-screen{width:100%;height:100dvh;display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0d1117,#161b22);}
.login-card{width:90%;max-width:380px;background:#161b22;border:1px solid #30363d;border-radius:24px;padding:40px 28px;box-shadow:0 0 60px rgba(0,255,136,0.15);}
.logo{width:100px;height:100px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,#00ff88,#00cc44);display:flex;justify-content:center;align-items:center;font-size:42px;font-weight:900;color:#000;box-shadow:0 0 40px rgba(0,255,136,0.4);}
.title{text-align:center;font-size:22px;font-weight:900;color:#00ff88;letter-spacing:3px;}
.subtitle{text-align:center;font-size:11px;color:#8b949e;letter-spacing:4px;margin-bottom:30px;}
.input-box{margin-bottom:20px;}
.input-box input{width:100%;padding:16px;background:#0d1117;border:1px solid #30363d;border-radius:14px;color:#00ff88;font-size:16px;font-weight:700;}
.unlock-btn{width:100%;padding:18px;background:linear-gradient(135deg,#00ff88,#00cc44);border:none;border-radius:14px;font-weight:900;font-size:16px;color:#000;letter-spacing:3px;margin-top:10px;box-shadow:0 0 20px rgba(0,255,136,0.3);}
.app-screen{display:none;width:100%;height:100dvh;background:#0d1117;overflow-y:auto;}
.app-header{padding:14px 18px;background:#161b22;border-bottom:1px solid #30363d;text-align:center;}
.indicators-bar{display:flex;gap:6px;margin:16px;overflow-x:auto;padding:8px;background:#161b22;border:1px solid #30363d;border-radius:12px;}
.ind-item{flex:1;min-width:70px;text-align:center;}
.ind-label{font-size:7px;color:#8b949e;} .ind-value{font-size:11px;font-weight:900;color:#00ff88;}
.asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
.asset-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.asset-card:hover{border-color:#00ff88;box-shadow:0 0 15px rgba(0,255,136,0.2);}
.flag{font-size:20px;} .asset-name{font-size:12px;font-weight:700;color:#00ff88;}
.analyze-btn{width:90%;margin:20px auto;display:block;padding:18px;background:linear-gradient(135deg,#00ff88,#00cc44);border:none;border-radius:14px;font-weight:900;font-size:18px;color:#000;letter-spacing:3px;box-shadow:0 0 30px rgba(0,255,136,0.4);}
.signal-box{margin:16px;padding:25px;background:#161b22;border:2px solid #00ff88;border-radius:16px;text-align:center;box-shadow:0 0 20px rgba(0,255,136,0.2);}
.signal{font-size:36px;font-weight:900;}
.buy{color:#00ff88;text-shadow:0 0 20px #00ff88;} .sell{color:#ff4444;text-shadow:0 0 20px #ff4444;} .wait{color:#ffd700;}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="logo">LA</div>
    <div class="title">LUBNA ABUBAKAR</div>
    <div class="subtitle">AI BOT PRO - REAL-TIME SIGNALS</div>
    <div class="input-box"><input type="text" id="username" value="Lubna"></div>
    <div class="input-box"><input type="password" id="password" value="Abubakar786"></div>
    <button class="unlock-btn" onclick="doLogin()">UNLOCK AI BOT PRO</button>
  </div>
</div>

<div class="app-screen" id="appScreen">
  <div class="app-header"><div class="title">SELECT TRADING DIRECTION</div></div>

  <div class="indicators-bar">
    <div class="ind-item"><div class="ind-label">RSI 14</div><div class="ind-value" id="rsi">--</div></div>
    <div class="ind-item"><div class="ind-label">EMA 21/50</div><div class="ind-value" id="ema">--</div></div>
    <div class="ind-item"><div class="ind-label">MACD</div><div class="ind-value" id="macd">--</div></div>
    <div class="ind-item"><div class="ind-label">BB</div><div class="ind-value" id="bb">--</div></div>
    <div class="ind-item"><div class="ind-label">5-CANDLE</div><div class="ind-value" id="candle5">--</div></div>
  </div>

  <div class="asset-grid" id="assetGrid"></div>

  <!-- بڑا والا GENERATE SIGNAL بٹن -->
  <button class="analyze-btn" onclick="analyzeMarket()">🚀 GENERATE SIGNAL</button>

  <div class="signal-box">
    <div id="signal" class="signal wait">WAIT</div>
    <div>Confidence: <span id="conf">--</span>% | SL: 2% | TP: 4%</div>
  </div>
</div>

<script>
let selectedAsset = '';

// ویڈیو والے تمام 27 OTC
let assets = [
  {flag:'🇺🇸🇧🇷', name:'USD/BRL OTC'}, {flag:'🇺🇸🇲🇽', name:'USD/MXN OTC'}, {flag:'🇺🇸🇵🇰', name:'USD/PKR OTC'},
  {flag:'🇺🇸🇮🇳', name:'USD/INR OTC'}, {flag:'🇺🇸🇦🇷', name:'USD/ARS OTC'}, {flag:'🇺🇸🇨🇱', name:'USD/CLP OTC'},
  {flag:'🇺🇸🇨🇴', name:'USD/COP OTC'}, {flag:'🇺🇸🇵🇪', name:'USD/PEN OTC'}, {flag:'🇺🇸🇻🇪', name:'USD/VES OTC'},
  {flag:'🇺🇸🇮🇩', name:'USD/IDR OTC'}, {flag:'🇺🇸🇻🇳', name:'USD/VND OTC'}, {flag:'🇺🇸🇳🇬', name:'USD/NGN OTC'},
  {flag:'🇺🇸🇿🇦', name:'USD/ZAR OTC'}, {flag:'🇺🇸🇧🇩', name:'USD/BDT OTC'}, {flag:'🇪🇺🇺🇸', name:'EUR/USD OTC'},
  {flag:'🇬🇧🇺🇸', name:'GBP/USD OTC'}, {flag:'🇦🇺🇺🇸', name:'AUD/USD OTC'}, {flag:'🇨🇦🇺🇸', name:'CAD/USD OTC'},
  {flag:'🇨🇭🇺🇸', name:'CHF/USD OTC'}, {flag:'🇯🇵🇺🇸', name:'JPY/USD OTC'}, {flag:'🇳🇿🇺🇸', name:'NZD/USD OTC'},
  {flag:'🇪🇺🇬🇧', name:'EUR/GBP OTC'}, {flag:'🇪🇺🇯🇵', name:'EUR/JPY OTC'}, {flag:'🇬🇧🇯🇵', name:'GBP/JPY OTC'},
  {flag:'🇦🇺🇯🇵', name:'AUD/JPY OTC'}, {flag:'🇪🇺🇨🇭', name:'EUR/CHF OTC'}, {flag:'🇨🇷🇺🇸', name:'CRC/USD OTC'},
];

function doLogin(){
  if(document.getElementById('username').value == 'Lubna' && document.getElementById('password').value == 'Abubakar786'){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    loadAssets();
    setInterval(scanIndicators, 3000);
  }
}

function loadAssets(){
  let grid = document.getElementById('assetGrid');
  grid.innerHTML = '';
  assets.forEach(a=>{
    grid.innerHTML += `<div class="asset-card" onclick="selectAsset('${a.name}')"><div class="flag">${a.flag}</div><div class="asset-name">${a.name}</div></div>`;
  });
}

function selectAsset(name){ selectedAsset = name; }

function scanIndicators(){
  document.getElementById('rsi').innerText = (30 + Math.random()*40).toFixed(1);
  document.getElementById('ema').innerText = Math.random() > 0.5 ? 'UP' : 'DOWN';
  document.getElementById('macd').innerText = Math.random() > 0.5 ? 'BUY' : 'SELL';
  document.getElementById('bb').innerText = Math.random() > 0.5 ? 'UP' : 'DOWN';
  document.getElementById('candle5').innerText = Math.floor(Math.random()*5)+1 + '/' + Math.floor(Math.random()*5)+1;
}

function analyzeMarket(){
  if(selectedAsset == ''){ alert('سر پہلے کوئی Asset Select کریں'); return; }
  let signal = Math.random() > 0.2 ? 'BUY' : 'SELL'; // 8/10 Logic
  let conf = Math.floor(Math.random()*15)+85;
  document.getElementById('signal').className = 'signal ' + signal.toLowerCase();
  document.getElementById('signal').innerText = signal;
  document.getElementById('conf').innerText = conf;
}
</script>
</body>
</html>
