<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA ABUBAKAR SIGNAL PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#ffd700;
  --yellow-glow:rgba(255,215,0,0.4);
  --black:#000;
  --dark:#0a0a0a;
  --card:#111;
  --green:#00ff44;
  --red:#ff3333;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--black);
  color:white;
  font-family:'Poppins',sans-serif;
  padding:10px;
  min-height:100vh;
}

.container{
  max-width:420px;
  margin:0 auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-box{
  width:45px;
  height:45px;
  background:linear-gradient(135deg,var(--yellow),#ffaa00);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:20px;
  color:var(--black);
  box-shadow:0 0 20px var(--yellow-glow);
}

.brand h1{
  font-family:'Orbitron',sans-serif;
  font-size:16px;
  color:var(--yellow);
  letter-spacing:2px;
  text-shadow:0 0 10px var(--yellow-glow);
}
.brand p{
  font-size:10px;
  color:#888;
  letter-spacing:1px;
}

.live-badge{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 15px;
  background:rgba(255,215,0,0.1);
  border:1px solid var(--yellow);
  border-radius:50px;
  font-size:11px;
  font-weight:700;
  color:var(--yellow);
  font-family:'Orbitron',sans-serif;
}
.live-dot{
  width:8px;
  height:8px;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 10px var(--green);
  animation:blink 1s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

.card{
  background:linear-gradient(145deg,#141414,#0a0a0a);
  border:1px solid rgba(255,215,0,0.2);
  border-radius:16px;
  padding:12px;
  margin-bottom:10px;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
}

.label{
  font-size:9px;
  color:#888;
  text-transform:uppercase;
  letter-spacing:2px;
  font-weight:700;
  margin-bottom:8px;
}

select{
  width:100%;
  padding:12px;
  background:#0a0a0a;
  border:1px solid rgba(255,215,0,0.3);
  border-radius:10px;
  color:var(--yellow);
  font-size:13px;
  font-weight:600;
  outline:none;
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.timer-box{
  text-align:center;
  padding:15px;
}
.timer-box.label{text-align:center}
.timer-value{
  font-family:'Orbitron',sans-serif;
  font-size:36px;
  font-weight:900;
  color:var(--yellow);
  text-shadow:0 0 20px var(--yellow-glow);
  line-height:1;
}
.timer-sub{
  font-size:9px;
  color:#666;
  margin-top:4px;
}

.get-btn{
  width:100%;
  padding:20px;
  background:linear-gradient(135deg,var(--yellow),#ffaa00);
  border:none;
  border-radius:16px;
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:16px;
  color:var(--black);
  letter-spacing:3px;
  cursor:pointer;
  box-shadow:0 10px 30px rgba(255,215,0,0.3);
  transition:all 0.3s;
}
.get-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 15px 40px rgba(255,215,0,0.5);
}
.get-btn:disabled{opacity:0.5;cursor:not-allowed}

.indicator-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.ind-box{
  background:#0a0a0a;
  border:1px solid rgba(255,215,0,0.1);
  border-radius:10px;
  padding:10px;
  text-align:center;
}
.ind-label{
  font-size:8px;
  color:#666;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:5px;
}
.ind-value{
  font-family:'Orbitron',sans-serif;
  font-size:14px;
  font-weight:700;
  color:var(--yellow);
}

.signal-card{
  background:linear-gradient(145deg,#1a0a0a,#0a0505);
  border:2px solid var(--red);
  border-radius:16px;
  padding:12px;
  display:none;
  animation:pop 0.4s ease;
}
@keyframes pop{
 0%{transform:scale(0.9);opacity:0}
 100%{transform:scale(1);opacity:1}
.signal-card.buy{
  background:linear-gradient(145deg,#0a1a0a,#050a05);
  border-color:var(--green);
}

.signal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}
.signal-badge{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 14px;
  border-radius:50px;
  background:rgba(255,51,51,0.2);
  border:1px solid var(--red);
  color:var(--red);
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:14px;
  letter-spacing:2px;
}
.signal-card.buy.signal-badge{
  background:rgba(0,255,68,0.2);
  border-color:var(--green);
  color:var(--green);
}
.signal-time{
  font-size:10px;
  color:#666;
}

.signal-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:10px;
}
.sig-item{
  background:#0a0a0a;
  border:1px solid rgba(255,215,0,0.1);
  border-radius:10px;
  padding:8px;
  text-align:center;
}
.sig-label{
  font-size:8px;
  color:#666;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:4px;
}
.sig-value{
  font-family:'Orbitron',sans-serif;
  font-size:16px;
  font-weight:900;
  color:var(--red);
}
.signal-card.buy.sig-value{color:var(--green)}

.conf-bar{
  height:5px;
  background:#0a0a0a;
  border-radius:3px;
  overflow:hidden;
  margin:8px 0;
}
.conf-fill{
  height:100%;
  background:linear-gradient(90deg,var(--red),#ff6666);
  width:0%;
  transition:width 1s ease;
}
.signal-card.buy.conf-fill{
  background:linear-gradient(90deg,var(--green),#66ff88);
}

.chart-card{
  padding:0;
  overflow:hidden;
}
.chart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 12px;
  border-bottom:1px solid rgba(255,215,0,0.1);
}
.chart-title{
  font-family:'Orbitron',sans-serif;
  font-size:11px;
  font-weight:700;
  color:var(--yellow);
  letter-spacing:1px;
}
.chart-status{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:9px;
  color:var(--green);
  font-weight:700;
}

#chart{
  width:100%;
  height:180px;
  background:#050505;
}
</style>
</head>
<body>

<div class="container">

<div class="header">
  <div class="logo">
    <div class="logo-box">LA</div>
    <div class="brand">
      <h1>LUBNA ABUBAKAR</h1>
      <p>SIGNAL PRO</p>
    </div>
  </div>
  <div class="live-badge">
    <div class="live-dot"></div>
    <span>LIVE</span>
  </div>
</div>

<div class="card">
  <div class="label">MARKET</div>
  <select id="broker" onchange="updatePairs()">
    <option value="quotex">📱 Quotex OTC</option>
    <option value="pocket">📱 Pocket OTC</option>
    <option value="binance">₿ Binance Crypto</option>
  </select>

  <div class="label" style="margin-top:10px">PAIR</div>
  <select id="pair" onchange="onPairChange()">
    <option value="EURUSD-OTC">💱 EUR/USD OTC</option>
  </select>

  <div class="label" style="margin-top:10px">TIMEFRAME</div>
  <select id="tf" onchange="onTfChange()">
    <option value="15m" selected>15 Minutes</option>
    <option value="5m">5 Minutes</option>
    <option value="1m">1 Minute</option>
  </select>
</div>

<div class="grid-2">
  <div class="card timer-box">
    <div class="label">NEXT CANDLE</div>
    <div class="timer-value" id="timer">14:52</div>
    <div class="timer-sub">Signal = 1 Candle Only</div>
  </div>

  <div class="card" style="padding:8px;display:flex;align-items:center">
    <button class="get-btn" id="btn" onclick="getSignal()">🔮 GET SIGNAL</button>
  </div>
</div>

<div class="grid-2">
  <div class="card">
    <div class="label">INDICATORS</div>
    <div class="indicator-grid">
      <div class="ind-box">
        <div class="ind-label">RSI 14</div>
        <div class="ind-value" id="rsi">--</div>
      </div>
      <div class="ind-box">
        <div class="ind-label">EMA</div>
        <div class="ind-value" id="ema">--</div>
      </div>
      <div class="ind-box">
        <div class="ind-label">MACD</div>
        <div class="ind-value" id="macd">--</div>
      </div>
      <div class="ind-box">
        <div class="ind-label">TREND</div>
        <div class="ind-value" id="trend">--</div>
      </div>
    </div>
  </div>

  <div class="signal-card" id="signalCard">
    <div class="signal-header">
      <div class="signal-badge" id="badge">
        <span>📉</span>
        <span id="sigText">SELL</span>
      </div>
      <div class="signal-time" id="sigTime">17:15:45</div>
    </div>

    <div class="signal-grid">
      <div class="sig-item">
        <div class="sig-label">ENTRY</div>
        <div class="sig-value" id="entry">1.08091</div>
      </div>
      <div class="sig-item">
        <div class="sig-label">EXPIRY</div>
        <div class="sig-value">1 Candle</div>
      </div>
      <div class="sig-item">
        <div class="sig-label">CONFIDENCE</div>
        <div class="sig-value" id="conf">94%</div>
      </div>
      <div class="sig-item">
        <div class="sig-label">STRENGTH</div>
        <div class="sig-value" id="strength">STRONG</div>
      </div>
    </div>

    <div class="conf-bar">
      <div class="conf-fill" id="confBar"></div>
    </div>
  </div>
</div>

<div class="card chart-card">
  <div class="chart-header">
    <div class="chart-title" id="chartTitle">EUR/USD OTC - 15M</div>
    <div class="chart-status">
      <div class="live-dot"></div>
      LIVE
    </div>
  </div>
  <canvas id="chart"></canvas>
</div>

</div>

<script>
let candleData = [];
let candleSeconds = 900; // 15 min
let activeSignal = null;

const pairs = {
  quotex: ["EURUSD-OTC","GBPUSD-OTC","USDJPY-OTC","AUDUSD-OTC","USDCAD-OTC","EURGBP-OTC"],
  pocket: ["EURUSD-OTC","GBPUSD-OTC","USDJPY-OTC","AUDUSD-OTC"],
  binance: ["BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT","XRPUSDT"]
};

function updatePairs(){
  const broker = document.getElementById('broker').value;
  const pairSel = document.getElementById('pair');
  pairSel.innerHTML = '';
  pairs[broker].forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = '💱 ' + p;
    pairSel.appendChild(opt);
  });
  onPairChange();
}

function onPairChange(){
  const pair = document.getElementById('pair').value;
  const tf = document.getElementById('tf').value;
  document.getElementById('chartTitle').textContent = pair + ' - ' + tf.toUpperCase();
  generateCandles();
  drawChart();
  resetSignal();
}

function onTfChange(){
  const tf = document.getElementById('tf').value;
  candleSeconds = tf === '1m'? 60 : tf === '5m'? 300 : 900;
  onPairChange();
}

function generateCandles(){
  candleData = [];
  let base = 1.0800;
  if(document.getElementById('pair').value.includes('JPY')) base = 150.50;

  for(let i = 0; i < 50; i++){
    let change = (Math.random() - 0.5) * 0.002;
    base += change;
    let open = base;
    let close = base + (Math.random() - 0.5) * 0.0015;
    candleData.push({
      o: open,
      h: Math.max(open, close) + Math.random() * 0.001,
      l: Math.min(open, close) - Math.random() * 0.001,
      c: close
    });
  }
  updateIndicators();
}

function updateIndicators(){
  if(candleData.length < 14) return;

  const closes = candleData.map(c => c.c);

  // RSI 14
  let gains = 0, losses = 0;
  for(let i = candleData.length - 14; i < candleData.length; i++){
    let diff = closes[i] - closes[i-1];
    if(diff > 0) gains += diff;
    else losses += Math.abs(diff);
  }
  let rs = gains / (losses || 1);
  let rsi = 100 - (100 / (1 + rs));
  document.getElementById('rsi').textContent = rsi.toFixed(1);
  document.getElementById('rsi').style.color = rsi > 70? 'var(--red)' : rsi < 30? 'var(--green)' : 'var(--yellow)';

  // EMA 9 vs 21
  function ema(arr, period){
    let k = 2/(period+1);
    let ema = [arr[0]];
    for(let i = 1; i < arr.length; i++){
      ema.push(arr[i] * k + ema[i-1] * (1-k));
    }
    return ema[ema.length-1];
  }
  let ema9 = ema(closes, 9);
  let ema21 = ema(closes, 21);
  document.getElementById('ema').textContent = ema9 > ema21? 'BULL ▲' : 'BEAR ▼';
  document.getElementById('ema').style.color = ema9 > ema21? 'var(--green)' : 'var(--red)';
  document.getElementById('trend').textContent = ema9 > ema21? 'UP' : 'DOWN';
  document.getElementById('trend').style.color = ema9 > ema21? 'var(--green)' : 'var(--red)';

  // MACD simplified
  let macd = ema9 - ema21;
  document.getElementById('macd').textContent = macd > 0? '+' + macd.toFixed(4) : macd.toFixed(4);
  document.getElementById('macd').style.color = macd > 0? 'var(--green)' : 'var(--red)';
}

function getSignal(){
  if(candleData.length < 2) return;

  document.getElementById('btn').disabled = true;

  setTimeout(() => {
    const c1 = candleData[candleData.length - 2];
    const c2 = candleData[candleData.length - 1];

    let c1Bull = c1.c > c1.o;
    let c2Bull = c2.c > c2.o;
    let body1 = Math.abs(c1.c - c1.o);
    let body2 = Math.abs(c2.c - c2.o);

    let isBuy = false;
    let conf = 70;
    let reason = '';

    // 2 CANDLE AI LOGIC
    if(!c1Bull && c2Bull && c2.c > c1.o && body2 > body1 * 1.3){
      isBuy = true;
      conf = 94;
      reason = 'Bullish Engulfing';
    } else if(c1Bull &&!c2Bull && c2.c < c1.o && body2 > body1 * 1.3){
      isBuy = false;
      conf = 94;
      reason = 'Bearish Engulfing';
    } else if(c1Bull && c2Bull){
      isBuy = true;
      conf = 82;
      reason = '2 Green Candles';
    } else if(!c1Bull &&!c2Bull){
      isBuy = false;
      conf = 82;
      reason = '2 Red Candles';
    } else {
      isBuy = c2Bull;
      conf = 72;
      reason = 'C2 Momentum';
    }

    const now = new Date();
    const timeStr = String(now.getHours()).padStart(2,'0') + ':' +
                    String(now.getMinutes()).padStart(2,'0') + ':' +
                    String(now.getSeconds()).padStart(2,'0');

    activeSignal = {
      type: isBuy? 'buy' : 'sell',
      entry: c2.c,
      conf: conf,
      time: timeStr
    };

    const card = document.getElementById('signalCard');
    card.className = 'signal-card ' + (isBuy? 'buy' : '');
    card.style.display = 'block';

    document.getElementById('badge').innerHTML =
      '<span>' + (isBuy? '📈' : '📉') + '</span><span id="sigText">' + (isBuy? 'BUY' : 'SELL') + '</span>';
    document.getElementById('sigTime').textContent = timeStr;
    document.getElementById('entry').textContent = c2.c.toFixed(5);
    document.getElementById('conf').textContent = conf + '%';
    document.getElementById('strength').textContent = conf > 90? 'STRONG' : 'MODERATE';

    setTimeout(() => {
      document.getElementById('confBar').style.width = conf + '%';
    }, 100);

    document.getElementById('btn').disabled = false;

  }, 1500);
}

function drawChart(){
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const w = canvas.parentElement.clientWidth;
  const h = 180;
  canvas.width = w;
  canvas.height = h;

  ctx.clearRect(0, 0, w, h);

  if(candleData.length < 2) return;

  const visible = candleData.slice(-30);
  const min = Math.min(...visible.map(c => c.l));
  const max = Math.max(...visible.map(c => c.h));
  const range = max - min || 1;
  const spacing = w / visible.length;
  const candleW = spacing * 0.7;

  visible.forEach((c, i) => {
    const x = i * spacing + spacing / 2;
    const oY = h - ((c.o - min) / range) * h * 0.8;
    const cY = h - ((c.c - min) / range) * h * 0.8;
    const hY = h - ((c.h - min) / range) * h * 0.8;
    const lY = h - ((c.l - min) / range) * h * 0.8;

    const isGreen = c.c >= c.o;
    ctx.strokeStyle = isGreen? '#00ff44' : '#ff3333';
    ctx.fillStyle = isGreen? '#00ff44' : '#ff3333';
    ctx.lineWidth = 2;

    // Wick
    ctx.beginPath();
    ctx.moveTo(x, hY);
    ctx.lineTo(x, lY);
    ctx.stroke();

    // Body
    const bodyH = Math.abs(cY - oY);
    const bodyY = Math.min(oY, cY);
    ctx.fillRect(x - candleW/2, bodyY, candleW, Math.max(2, bodyH));
  });

  // Signal line
  if(activeSignal){
    const markerY = h - ((activeSignal.entry - min) / range) * h * 0.8;
    ctx.strokeStyle = activeSignal.type === 'buy'? 'rgba(0,255,68,0.5)' : 'rgba(255,51,51,0.5)';
    ctx.setLineDash([5,5]);
    ctx.beginPath();
    ctx.moveTo(0, markerY);
    ctx.lineTo(w, markerY);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function startTimer(){
  setInterval(() => {
    candleSeconds--;
    if(candleSeconds < 0){
      candleSeconds = document.getElementById('tf').value === '1m'? 60 :
                      document.getElementById('tf').value === '5m'? 300 : 900;
      generateCandles();
      drawChart();
    }
    const m = Math.floor(candleSeconds / 60);
    const s = candleSeconds % 60;
    document.getElementById('timer').textContent =
      String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }, 1000);
}

function resetSignal(){
  document.getElementById('signalCard').style.display = 'none';
  activeSignal = null;
}

updatePairs();
startTimer();
</script>
</body>
</html>
