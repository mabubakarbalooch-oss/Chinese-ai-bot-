<script>

// ===== LOGIN =====
function doLogin(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('mainScreen').style.display='flex';

  initChart();

  connectBinance();

  startCandleTimer();
}

// ===== PAIR DATA =====
const pairData={
  forex:{
    pairs:['btcusdt','ethusdt','bnbusdt','xrpusdt','solusdt'],
    icons:['₿','Ξ','🟡','✕','🪙'],
    descs:['Bitcoin','Ethereum','BNB','Ripple','Solana']
  }
};

// ===== UPDATE PAIRS =====
function updatePairs(){

  const select=document.getElementById('pairSelect');

  select.innerHTML='';

  pairData.forex.pairs.forEach((p,i)=>{

    const opt=document.createElement('option');

    opt.value=p;

    opt.textContent=
      pairData.forex.icons[i]+' '+p.toUpperCase();

    select.appendChild(opt);

  });

  onPairChange();
}

// ===== PAIR CHANGE =====
function onPairChange(){

  const pair=document.getElementById('pairSelect').value;

  const idx=pairData.forex.pairs.indexOf(pair);

  document.getElementById('pairIcon').textContent=
    pairData.forex.icons[idx];

  document.getElementById('pairDesc').textContent=
    pairData.forex.descs[idx];

  document.getElementById('pairName').textContent=
    pair.toUpperCase();

  updateChartTitle();

  connectBinance();
}

// ===== TIMEFRAME =====
function onTfChange(){

  candleSeconds=getTimeframeSeconds();

  updateChartTitle();

  connectBinance();
}

function updateChartTitle(){

  const pair=document.getElementById('pairSelect').value;

  const tf=document.getElementById('timeframe').value;

  document.getElementById('chartTitle').textContent=
    pair.toUpperCase()+' - '+tf.toUpperCase();
}

// ===== TIMER =====
let candleSeconds=900;

function startCandleTimer(){

  setInterval(()=>{

    candleSeconds--;

    if(candleSeconds<0){

      candleSeconds=getTimeframeSeconds();

      checkSignalResult();
    }

    const m=Math.floor(candleSeconds/60);

    const s=candleSeconds%60;

    document.getElementById('timerDisplay').textContent=
      String(m).padStart(2,'0')+
      ':'+
      String(s).padStart(2,'0');

  },1000);
}

function getTimeframeSeconds(){

  const tf=document.getElementById('timeframe').value;

  if(tf==='1m') return 60;

  if(tf==='5m') return 300;

  if(tf==='15m') return 900;

  if(tf==='1h') return 3600;

  return 900;
}

// ===== BINANCE LIVE =====
const BINANCE_WS="wss://stream.binance.com:9443/ws";

let socket=null;

let liveCandles=[];

let currentPrice=0;

function connectBinance(){

  if(socket){

    socket.close();
  }

  const pair=
    document.getElementById('pairSelect')
    .value
    .toLowerCase();

  const tf=
    document.getElementById('timeframe')
    .value;

  socket=new WebSocket(
    `${BINANCE_WS}/${pair}@kline_${tf}`
  );

  socket.onmessage=(event)=>{

    const msg=JSON.parse(event.data);

    const k=msg.k;

    const candle={

      time:Math.floor(k.t/1000),

      open:parseFloat(k.o),

      high:parseFloat(k.h),

      low:parseFloat(k.l),

      close:parseFloat(k.c)
    };

    currentPrice=parseFloat(k.c);

    document.getElementById('livePrice').textContent=
      currentPrice.toFixed(2);

    const change=
      ((candle.close-candle.open)/candle.open)*100;

    const ch=document.getElementById('priceChange');

    ch.textContent=
      (change>0?'+':'')+
      change.toFixed(2)+'%';

    ch.style.color=
      change>0
      ?'var(--primary)'
      :'var(--red)';

    candleSeries.update(candle);

    liveCandles.push(candle);

    if(liveCandles.length>200){

      liveCandles.shift();
    }
  };

  socket.onclose=()=>{

    setTimeout(connectBinance,3000);
  };
}

// ===== INDICATORS =====
function calculateEMA(period,data){

  const k=2/(period+1);

  let ema=data[0].close;

  for(let i=1;i<data.length;i++){

    ema=data[i].close*k+
      ema*(1-k);
  }

  return ema;
}

function calculateRSI(period,data){

  let gains=0;

  let losses=0;

  for(
    let i=data.length-period;
    i<data.length-1;
    i++
  ){

    const diff=
      data[i+1].close-data[i].close;

    if(diff>0){

      gains+=diff;

    }else{

      losses+=Math.abs(diff);
    }
  }

  if(losses===0) return 100;

  const rs=gains/losses;

  return 100-(100/(1+rs));
}

// ===== SIGNAL =====
let activeSignal=null;

let signalHistory=[];

function generateSignal(){

  const btn=document.getElementById('genBtn');

  btn.disabled=true;

  btn.textContent='⏳...';

  const overlay=
    document.getElementById('scanOverlay');

  overlay.style.display='flex';

  setTimeout(()=>{

    overlay.style.display='none';

    if(liveCandles.length<50){

      alert('Waiting for live candles');

      btn.disabled=false;

      btn.textContent='🔮 GENERATE';

      return;
    }

    const ema9=
      calculateEMA(9,liveCandles);

    const ema21=
      calculateEMA(21,liveCandles);

    const rsi=
      calculateRSI(14,liveCandles);

    const last=
      liveCandles[liveCandles.length-1];

    let signalType=null;

    // ===== BUY =====
    if(

      ema9>ema21 &&

      rsi>52 &&

      last.close>last.open

    ){

      signalType='buy';
    }

    // ===== SELL =====
    if(

      ema9<ema21 &&

      rsi<48 &&

      last.close<last.open

    ){

      signalType='sell';
    }

    if(!signalType){

      alert('No strong signal');

      btn.disabled=false;

      btn.textContent='🔮 GENERATE';

      return;
    }

    const confidence=
      Math.floor(Math.random()*8)+90;

    const entry=
      currentPrice.toFixed(2);

    const now=new Date();

    const timeStr=
      String(now.getHours())
      .padStart(2,'0')+

      ':'+

      String(now.getMinutes())
      .padStart(2,'0');

    activeSignal={

      type:signalType,

      entry:parseFloat(entry),

      confidence,

      time:now,

      pair:
      document.getElementById('pairSelect').value,

      tf:
      document.getElementById('timeframe').value
    };

    const card=
      document.getElementById('signalCard');

    card.className=
      'signal-card '+signalType;

    card.style.display='block';

    const isBuy=
      signalType==='buy';

    document.getElementById('signalIcon')
    .textContent=isBuy?'📈':'📉';

    document.getElementById('signalText')
    .textContent=isBuy?'BUY':'SELL';

    document.getElementById('signalTime')
    .textContent=timeStr;

    document.getElementById('entryPrice')
    .textContent=entry;

    document.getElementById('confidenceVal')
    .textContent=confidence+'%';

    document.getElementById('strengthVal')
    .textContent='STRONG';

    document.getElementById('confidencePercent')
    .textContent=confidence+'%';

    document.getElementById('signalReason')
    .textContent=
      isBuy
      ?'EMA bullish crossover with RSI confirmation.'
      :'EMA bearish crossover with RSI confirmation.';

    setTimeout(()=>{

      document.getElementById('confidenceBar')
      .style.width=confidence+'%';

    },100);

    addSignalMarker(isBuy,entry);

    btn.disabled=false;

    btn.textContent='🔮 GENERATE';

    document.getElementById('historyCard')
    .style.display='block';

  },1800);
}

// ===== RESULT =====
function checkSignalResult(){

  if(!activeSignal) return;

  const priceChange=
    currentPrice-activeSignal.entry;

  const isWin=

    (
      activeSignal.type==='buy' &&
      priceChange>0
    )

    ||

    (
      activeSignal.type==='sell' &&
      priceChange<0
    );

  signalHistory.unshift({

    ...activeSignal,

    result:isWin?'win':'loss',

    exit:currentPrice.toFixed(2)
  });

  updateHistory();

  activeSignal=null;

  document.getElementById('signalCard')
  .style.display='none';

  document.getElementById('confidenceBar')
  .style.width='0%';
}

// ===== HISTORY =====
function updateHistory(){

  const list=
    document.getElementById('historyList');

  document.getElementById('historyCount')
  .textContent=
    signalHistory.length+' signals';

  list.innerHTML='';

  signalHistory
  .slice(0,20)
  .forEach(sig=>{

    const item=document.createElement('div');

    item.className=
      'history-item '+sig.type;

    const t=
      String(sig.time.getHours())
      .padStart(2,'0')+

      ':'+

      String(sig.time.getMinutes())
      .padStart(2,'0');

    item.innerHTML=`

      <div class="side-icon">
        ${sig.type==='buy'?'📈':'📉'}
      </div>

      <div class="info">

        <div class="pair">
          ${sig.pair.toUpperCase()}
        </div>

        <div class="time">
          ${t} | ${sig.confidence}%
        </div>

      </div>

      <div class="result ${sig.result}">
        ${sig.result.toUpperCase()}
      </div>
    `;

    list.appendChild(item);
  });
}

// ===== CHART =====
let chart;

let candleSeries;

let markers=[];

function initChart(){

  const container=
    document.getElementById('chart-container');

  chart=
    LightweightCharts.createChart(container,{

    layout:{
      background:{color:'transparent'},
      textColor:'#8a8a9e',
      fontFamily:'Poppins'
    },

    grid:{
      vertLines:{
        color:'rgba(255,255,255,0.02)'
      },

      horzLines:{
        color:'rgba(255,255,255,0.02)'
      }
    },

    rightPriceScale:{
      borderColor:'rgba(255,255,255,0.04)'
    },

    timeScale:{
      borderColor:'rgba(255,255,255,0.04)',
      timeVisible:true
    }
  });

  candleSeries=
    chart.addCandlestickSeries({

    upColor:'#00ff88',

    downColor:'#ff2d55',

    borderUpColor:'#00ff88',

    borderDownColor:'#ff2d55',

    wickUpColor:'#00ff88',

    wickDownColor:'#ff2d55'
  });

  const ro=new ResizeObserver(()=>{

    chart.applyOptions({

      width:container.clientWidth,

      height:container.clientHeight
    });
  });

  ro.observe(container);
}

// ===== MARKERS =====
function addSignalMarker(isBuy){

  const now=
    Math.floor(Date.now()/1000);

  markers.push({

    time:now,

    position:
      isBuy
      ?'belowBar'
      :'aboveBar',

    color:
      isBuy
      ?'#00ff88'
      :'#ff2d55',

    shape:
      isBuy
      ?'arrowUp'
      :'arrowDown',

    text:
      isBuy
      ?'BUY'
      :'SELL'
  });

  candleSeries.setMarkers(markers);
}

// ===== START =====
updatePairs();

</script>
