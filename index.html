<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUBNA ABUBAKAR SIGNAL PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#06110a;
--card:#0b1d13;
--green:#00ff78;
--red:#ff4d4d;
--yellow:#ffaa00;
--border:#145c34;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:var(--bg);
color:white;
display:flex;
justify-content:center;
padding:10px;
}

.container{
width:100%;
max-width:430px;
background:#08190f;
border:1px solid #145c34;
border-radius:20px;
padding:15px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.logo{
width:45px;height:45px;border-radius:50%;
background:linear-gradient(135deg,#00ff78,#00aa55);
display:flex;align-items:center;justify-content:center;
font-weight:900;font-family:Orbitron;
color:#04140a;
}

.btn{
width:100%;
padding:14px;
background:linear-gradient(135deg,#00ff78,#00aa55);
border:none;
border-radius:15px;
font-weight:800;
cursor:pointer;
margin-top:10px;
}

input,select{
width:100%;
padding:12px;
margin:8px 0;
border-radius:12px;
border:1px solid #145c34;
background:#0b1d13;
color:white;
}

.price{
text-align:center;
font-size:24px;
color:#00ff78;
margin:10px 0;
font-family:Orbitron;
}

.signal{
text-align:center;
padding:15px;
border-radius:15px;
margin-top:10px;
font-weight:900;
display:none;
font-family:Orbitron;
}

.buy{background:#052a18;color:#00ff78;border:1px solid #00ff78;}
.sell{background:#2a0505;color:#ff4d4d;border:1px solid #ff4d4d;}
.wait{background:#2a2205;color:#ffaa00;border:1px solid #ffaa00;}

.small{
font-size:12px;color:#8affc0;text-align:center;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="logo">QX</div>
<h3>AI SIGNAL PRO</h3>
</div>

<div id="login">
<input type="password" id="pass" placeholder="Password">
<button class="btn" onclick="login()">Unlock</button>
</div>

<div id="app" style="display:none">

<div class="price" id="price">Loading...</div>

<select id="pair" onchange="changePair()">
<option value="BTCUSDT">BTC</option>
<option value="ETHUSDT">ETH</option>
<option value="BNBUSDT">BNB</option>
<option value="SOLUSDT">SOL</option>
</select>

<button class="btn" onclick="signal()">Generate Signal</button>

<div id="signalBox" class="signal">--</div>

<div class="small" id="info"></div>

</div>

</div>

<script>

let pair="BTCUSDT";
const API="https://data-api.binance.vision/api/v3";

function login(){
let p=document.getElementById("pass").value;
if(p==="Lubna786"){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
loadPrice();
setInterval(loadPrice,5000);
}else alert("Wrong Password");
}

function changePair(){
pair=document.getElementById("pair").value;
loadPrice();
}

async function loadPrice(){
try{
let r=await fetch(`${API}/ticker/24hr?symbol=${pair}`);
let d=await r.json();
document.getElementById("price").innerText=parseFloat(d.lastPrice).toFixed(2);
}catch(e){}
}

// EMA FIXED (proper start SMA)
function EMA(data,period){
let k=2/(period+1);
let ema=[];

let sma=data.slice(0,period).reduce((a,b)=>a+b)/period;
ema[period-1]=sma;

for(let i=period;i<data.length;i++){
ema[i]=data[i]*k + ema[i-1]*(1-k);
}
return ema;
}

// RSI FIXED
function RSI(closes){
let gains=0,losses=0;

for(let i=1;i<14;i++){
let diff=closes[i]-closes[i-1];
if(diff>0) gains+=diff;
else losses+=Math.abs(diff);
}

let rs=gains/(losses||1);
return 100-(100/(1+rs));
}

async function signal(){

let box=document.getElementById("signalBox");
box.style.display="none";

let res=await fetch(`${API}/klines?symbol=${pair}&interval=1m&limit=100`);
let data=await res.json();

let closes=data.map(x=>parseFloat(x[4]));

let ema10=EMA(closes,10);
let ema20=EMA(closes,20);
let ema50=EMA(closes,50);

let rsi=RSI(closes);

let last=closes.at(-1);
let prev=closes.at(-2);

let bullish=
ema10.at(-1)>ema20.at(-1) &&
ema20.at(-1)>ema50.at(-1) &&
rsi>50 &&
last>prev;

let bearish=
ema10.at(-1)<ema20.at(-1) &&
ema20.at(-1)<ema50.at(-1) &&
rsi<50 &&
last<prev;

box.style.display="block";

if(bullish){
box.innerText="BUY 📈";
box.className="signal buy";
}
else if(bearish){
box.innerText="SELL 📉";
box.className="signal sell";
}
else{
box.innerText="WAIT ⏸";
box.className="signal wait";
}

document.getElementById("info").innerText=
"RSI: "+Math.floor(rsi);
}

</script>

</body>
</html>
