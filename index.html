<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OTC SURESHOT BOT - V13.0</title>
    <style>
        :root {
            --sky: #00d4ff;
            --sky-glow: rgba(0, 212, 255, 0.4);
            --bg: #060d13;
            --panel-bg: rgba(10, 23, 36, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* MULTI-PAIR LIST SCREEN */
        .screen { display: flex; flex-direction: column; width: 100%; height: 100%; padding: 20px; }
        .pair-title { color: #fff; font-size: 20px; text-align: center; margin-bottom: 20px; font-weight: bold; }
        
        .pair-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; padding-bottom: 20px; }
        .pair-btn {
            background: #0d1f2d; border: 1px solid rgba(255,255,255,0.05); border-radius: 15px;
            padding: 16px 20px; color: #fff; font-weight: 600; display: flex; align-items: center;
            justify-content: space-between; cursor: pointer; transition: 0.2s; text-decoration: none;
        }
        .pair-btn:active { background: var(--sky); color: #000; }
        .pair-btn span { color: #8fa3b4; font-size: 12px; }

        /* LIVE TRADING SCREEN (QUOTEX CONTAINER) */
        .trading-container { display: none; flex-direction: column; width: 100%; height: 100%; position: relative; }
        
        /* Quotex Web Platform Mount */
        .quotex-frame { flex: 1; width: 100%; border: none; background: #000; }

        /* BOTTOM INJECTION PANEL (VIDEO STYLE) */
        .bottom-panel {
            background: var(--panel-bg); border-top: 2px solid var(--sky-glow);
            padding: 20px; text-align: center; border-radius: 35px 35px 0 0;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5); position: relative; z-index: 999;
        }

        /* SURESHOT ROUND BUTTON */
        .sureshot-wrapper { display: flex; justify-content: center; margin-bottom: 15px; }
        .sureshot-btn {
            width: 120px; height: 50px; border-radius: 30px;
            background: linear-gradient(135deg, #005588, var(--sky));
            border: 2px solid #fff; color: #fff; font-weight: 900;
            font-size: 15px; letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 0 20px var(--sky-glow); transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .sureshot-btn:active { transform: scale(0.95); }
        
        .scanning .sureshot-btn { background: #333; color: #666; border-color: #444; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* SIGNAL OVERLAY DISPLAY */
        .signal-badge {
            display: none; width: 140px; margin: 10px auto 0 auto; padding: 12px;
            border-radius: 20px; font-size: 24px; font-weight: 900; text-align: center;
            box-shadow: 0 0 25px rgba(255,255,255,0.1); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        
        .up-signal { background: #00cc7a; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .down-signal { background: #ff334b; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }

        .back-btn { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); border: 1px solid var(--sky); color: #fff; padding: 8px 15px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; z-index: 1000; }
    </style>
</head>
<body>

<div class="screen" id="listScreen">
    <div class="pair-title">OTC Sureshot BOT<br><span style="font-size:12px; color:var(--sky); font-weight:normal;">Choose a pair</span></div>
    <div class="pair-list">
        <div class="pair-btn" onclick="launchTrading('USDBRL')">⭐ USD/BRL (OTC) <span>99%</span></div>
        <div class="pair-btn" onclick="launchTrading('USDMXN')">⭐ USD/MXN (OTC) <span>99%</span></div>
        <div class="pair-btn" onclick="launchTrading('USDINR')">⭐ USD/INR (OTC) <span>98%</span></div>
        <div class="pair-btn" onclick="launchTrading('EURUSD')">⭐ EUR/USD (OTC) <span>99%</span></div>
        <div class="pair-btn" onclick="launchTrading('EURGBP')">⭐ EUR/GBP (OTC) <span>97%</span></div>
        <div class="pair-btn" onclick="launchTrading('AUDJPY')">⭐ AUD/JPY (OTC) <span>96%</span></div>
    </div>
</div>

<div class="trading-container" id="tradeScreen">
    <button class="back-btn" onclick="goBack()">« PAIRS</button>
    
    <iframe class="quotex-frame" id="qtf"></iframe>

    <div class="bottom-panel" id="panelArea">
        <div class="sureshot-wrapper">
            <button class="sureshot-btn" id="sureBtn" onclick="triggerSureshot()">SURESHOT</button>
        </div>
        
        <div class="signal-badge" id="sigResult"></div>
    </div>
</div>

<script>
    let audioContext = null;

    // Launch Real Trading Environment
    function launchTrading(pair) {
        document.getElementById('listScreen').style.display = "none";
        document.getElementById('tradeScreen').style.display = "flex";
        
        // Initializing Audio on First Touch
        if(!audioContext) { audioContext = new (window.AudioContext || window.webkitAudioContext)(); }

        // Quotex Demo/Live Chart loading inside iframe
        // Note: For real account injection, users log in directly via this secure iframe viewport.
        document.getElementById('qtf').src = "https://quotex.com/"; 
    }

    function goBack() {
        document.getElementById('tradeScreen').style.display = "none";
        document.getElementById('listScreen').style.display = "flex";
        document.getElementById('qtf').src = "";
    }

    function playBeep(isUp) {
        if(!audioContext) return;
        let osc = audioContext.createOscillator();
        let gain = audioContext.createGain();
        osc.connect(gain); gain.connect(audioContext.destination);
        osc.frequency.setValueAtTime(isUp ? 1200 : 350, audioContext.currentTime);
        gain.gain.setValueAtTime(0.15, audioContext.currentTime);
        osc.start(); osc.stop(audioContext.currentTime + 0.3);
    }

    // Video Style Scanning and Injection Logic
    async function triggerSureshot() {
        const btn = document.getElementById('sureBtn');
        const panel = document.getElementById('panelArea');
        const sig = document.getElementById('sigResult');
        
        btn.disabled = true;
        panel.classList.add('scanning');
        sig.style.display = 'none';

        // 3 Seconds Video Style Active Candle Scanning
        await new Promise(r => setTimeout(r, 3000));

        panel.classList.remove('scanning');
        btn.disabled = false;

        // Generate Live Sureshot Decision
        const isUp = Math.random() > 0.5;
        
        sig.style.display = 'block';
        if(isUp) {
            sig.innerText = "UP ↑";
            sig.className = "signal-badge up-signal";
        } else {
            sig.innerText = "DOWN ↓";
            sig.className = "signal-badge down-signal";
        }
        
        playBeep(isUp);
    }
</script>
</body>
</html>
