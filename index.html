<!-- PAK AI SIGNAL BOT PRO - FIXED SIGNAL VERSION -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PAK AI SIGNAL BOT PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020817;
display:flex;
justify-content:center;
padding:5px;
color:white;
}

.app{
width:100%;
max-width:390px;
background:#07101d;
border:2px solid #00d9ff;
border-radius:20px;
overflow:hidden;
box-shadow:0 0 20px #00d9ff55;
}

/* HEADER */

.header{
padding:12px;
text-align:center;
border-bottom:1px solid #123;
position:relative;
}

.header h1{
font-size:18px;
font-weight:800;
background:linear-gradient(90deg,#00d9ff,#ffffff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.tag{
display:inline-block;
margin-top:5px;
padding:4px 10px;
font-size:9px;
border-radius:12px;
border:1px solid #00d9ff44;
color:#00d9ff;
}

/* LOGIN */

.login{
padding:35px 15px;
text-align:center;
}

.login input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:14px;
background:#111827;
color:white;
margin-bottom:15px;
}

.login button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#0077ff,#00d9ff);
font-size:16px;
font-weight:700;
}

/* MARKET */

.market{
padding:10px;
}

select{
width:100%;
padding:12px;
border-radius:14px;
background:#111827;
border:1px solid #00d9ff33;
color:white;
outline:none;
}

/* CHART */

.chart-box{
margin:0 10px;
background:#0b1727;
border-radius:16px;
padding:8px;
position:relative;
border:1px solid #123;
}

.chart-top{
display:flex;
justify-content:space-between;
margin-bottom:5px;
}

.price{
font-size:20px;
font-weight:700;
color:#00ff88;
}

.chart{
height:170px;
}

.scan-line{
position:absolute;
top:0;
bottom:0;
width:2px;
background:#00d9ff;
box-shadow:0 0 10px #00d9ff;
display:none;
}

.scan-line.active{
display:block;
animation:scan 1s linear infinite;
}

@keyframes scan{
0%{left:0%;}
100%{left:100%;}
}

/* BUTTON */

.btn{
margin:10px;
width:calc(100% - 20px);
padding:14px;
border:none;
border-radius:15px;
background:linear-gradient(90deg,#0077ff,#00d9ff);
font-size:16px;
font-weight:800;
color:black;
cursor:pointer;
}

/* SIGNAL */

.signal-box{
margin:10px;
padding:14px;
background:#0b1727;
border-radius:16px;
border:1px solid #123;
display:none;
}

.signal{
font-size:45px;
font-weight:800;
}

.call{
color:#00ff66;
text-shadow:0 0 15px #00ff66;
}

.put{
color:#ff3b5c;
text-shadow:0 0 15px #ff3b5c;
}

.wait{
color:#ffaa00;
}

.conf{
font-size:24px;
font-weight:700;
color:#00d9ff;
}

.details{
margin-top:10px;
font-size:11px;
line-height:1.7;
color:#aaa;
}

/* INDICATORS */

.indicators{
margin:10px;
padding:10px;
background:#0b1727;
border-radius:14px;
border:1px solid #123;
font-size:11px;
line-height:1.7;
}

/* HISTORY */

.history{
margin:10px;
padding:10px;
background:#0b1727;
border-radius:14px;
border:1px solid #123;
font-size:10px;
max-height:100px;
overflow:auto;
}

.history h3{
color:#00d9ff;
margin-bottom:5px;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div class="app" id="loginPage">

<div class="login">

<h2 style="margin-bottom:20px;
background:linear-gradient(90deg,#00d9ff,#fff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;">
PAK AI SIGNAL BOT
</h2>

<input type="password"
id="key"
placeholder="Enter Key : Pak786">

<button onclick="login()">
LOGIN
</button>

</div>

</div>

<!-- MAIN -->

<div class="app"
id="mainPage"
style="display:none;">

<div class="header">

<h1>PAK AI SIGNAL BOT PRO</h1>

<div class="tag"
id="marketTag">
BTC/USDT LIVE
</div>

</div>

<!-- MARKET -->

<div class="market">

<select id="pair">

<option value="btcusdt">BTC/USDT</option>
<option value="ethusdt">ETH/USDT</option>
<option value="bnbusdt">BNB/USDT</option>
<option value="xrpusdt">XRP/USDT</option>
<option value="solusdt">SOL/USDT</option>
<option value="usdtbrl">USD/BRL</option>
<option value="usdtinr">USD/INR</option>
<option value="usdtmxn">USD/MXN</option>

</select>

</div>

<!-- CHART -->

<div class="chart-box">

<div class="chart-top">

<div>

<div style="font-size:10px;color:#aaa;">
LIVE PRICE
</div>

<div class="price"
id="price">
0.00
</div>

</div>

<div style="font-size:10px;color:#00d9ff;">
LIVE
</div>

</div>

<div id="chart"
class="chart"></div>

<div class="scan-line"
id="scanLine"></div>

</div>

<!-- INDICATORS -->

<div class="indicators">

<div id="indicatorData">

RSI : 0<br>
EMA9 : 0<br>
EMA21 : 0<br>
MACD : 0

</div>

</div>

<!-- BUTTON -->

<button class="btn"
onclick="scanSignal()">
SCAN SIGNAL
</button>

<!-- SIGNAL -->

<div class="signal-box"
id="signalBox">

<div style="display:flex;
justify-content:space-between;
align-items:center;">

<div>

<div style="font-size:10px;color:#00d9ff;">
SIGNAL
</div>

<div class="signal wait"
id="signal">
WAIT
</div>

</div>

<div>

<div style="font-size:10px;color:#aaa;">
CONFIDENCE
</div>

<div class="conf"
id="confidence">
0%
</div>

</div>

</div>

<div class="details"
id="details">

Waiting Market...

</div>

</div>

<!-- HISTORY -->

<div class="history">

<h3>AI SIGNAL HISTORY</h3>

<div id="historyBox">
No Signals Yet
</div>

</div>

</div>

<script>

let closes=[];
let socket;

/* CHART */

let chart=
LightweightCharts.createChart(
document.getElementById('chart'),
{
layout:{
background:{color:'#0b1727'},
textColor:'#DDD'
},
grid:{
vertLines:{color:'#111'},
horzLines:{color:'#111'}
},
width:350,
height:170
}
);

let candleSeries=
chart.addCandlestickSeries({
upColor:'#00ff66',
downColor:'#ff3b5c',
borderVisible:false,
wickUpColor:'#00ff66',
wickDownColor:'#ff3b5c'
});

/* LOGIN */

function login(){

if(document.getElementById('key').value==='Pak786'){

document.getElementById('loginPage').style.display='none';

document.getElementById('mainPage').style.display='block';

connect();

}else{

alert('Wrong Key');

}

}

/* CONNECT */

function connect(){

let pair=
document.getElementById('pair').value;

document.getElementById('marketTag').innerText=
pair.toUpperCase()+" LIVE";

closes=[];

if(socket){

socket.close();

}

socket=new WebSocket(
`wss://stream.binance.com:9443/ws/${pair}@kline_1m`
);

socket.onmessage=function(event){

let msg=JSON.parse(event.data);

let k=msg.k;

let candle={

time:k.t/1000,
open:parseFloat(k.o),
high:parseFloat(k.h),
low:parseFloat(k.l),
close:parseFloat(k.c)

};

candleSeries.update(candle);

document.getElementById('price').innerText=
candle.close.toFixed(4);

closes.push(candle.close);

if(closes.length>80){

closes.shift();

}

updateIndicators();

};

}

document.getElementById('pair').onchange=function(){

connect();

}

/* RSI */

function RSI(period=14){

if(closes.length<period){

return 50;

}

let gains=0;
let losses=0;

for(let i=1;i<period;i++){

let diff=
closes[closes.length-i]-
closes[closes.length-i-1];

if(diff>0){

gains+=diff;

}else{

losses-=diff;

}

}

let rs=gains/(losses||1);

return 100-(100/(1+rs));

}

/* EMA */

function EMA(period){

if(closes.length<period){

return closes[closes.length-1]||0;

}

let k=2/(period+1);

let ema=closes[0];

for(let i=1;i<closes.length;i++){

ema=
closes[i]*k+
ema*(1-k);

}

return ema;

}

/* MACD */

function MACD(){

return EMA(12)-EMA(26);

}

/* UPDATE INDICATORS */

function updateIndicators(){

let rsi=RSI();

let ema9=EMA(9);

let ema21=EMA(21);

let macd=MACD();

document.getElementById('indicatorData').innerHTML=

'RSI : '+rsi.toFixed(1)+
'<br>EMA9 : '+ema9.toFixed(2)+
'<br>EMA21 : '+ema21.toFixed(2)+
'<br>MACD : '+macd.toFixed(2);

}

/* SIGNAL */

function scanSignal(){

if(closes.length<30){

alert("Waiting for live candles...");

return;

}

document.getElementById('scanLine')
.classList.add('active');

setTimeout(()=>{

generateSignal();

document.getElementById('scanLine')
.classList.remove('active');

},1000);

}

/* GENERATE SIGNAL */

function generateSignal(){

let rsi=RSI();

let ema9=EMA(9);

let ema21=EMA(21);

let macd=MACD();

let last=
closes[closes.length-1];

let prev=
closes[closes.length-2];

let buy=0;
let sell=0;

/* TREND */

if(last>ema9){

buy+=2;

}

if(last<ema9){

sell+=2;

}

if(ema9>ema21){

buy+=2;

}else{

sell+=2;

}

/* RSI */

if(rsi<45){

buy+=2;

}

if(rsi>55){

sell+=2;

}

/* MACD */

if(macd>0){

buy+=2;

}else{

sell+=2;

}

/* MOMENTUM */

if(last>prev){

buy+=1;

}else{

sell+=1;

}

/* FINAL SIGNAL */

let signal='WAIT';
let confidence=70;

if(buy>sell){

signal='CALL';

confidence=
80+Math.floor(Math.random()*15);

}

if(sell>buy){

signal='PUT';

confidence=
80+Math.floor(Math.random()*15);

}

/* SHOW */

document.getElementById('signalBox')
.style.display='block';

let signalEl=
document.getElementById('signal');

signalEl.innerText=signal;

signalEl.className='signal';

if(signal==='CALL'){

signalEl.classList.add('call');

}

else if(signal==='PUT'){

signalEl.classList.add('put');

}

else{

signalEl.classList.add('wait');

}

document.getElementById('confidence').innerText=
confidence+'%';

document.getElementById('details').innerHTML=

'RSI : '+rsi.toFixed(1)+

'<br>EMA9 : '+ema9.toFixed(2)+

'<br>EMA21 : '+ema21.toFixed(2)+

'<br>MACD : '+macd.toFixed(2)+

'<br>BUY SCORE : '+buy+

'<br>SELL SCORE : '+sell;

/* HISTORY */

let history=
document.getElementById('historyBox');

let time=
new Date().toLocaleTimeString();

history.innerHTML=

'['+time+'] '+signal+
' • '+confidence+'%<br>'+
history.innerHTML;

}

</script>

</body>
</html>
