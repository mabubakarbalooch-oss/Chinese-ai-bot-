<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ABU BAKAR TRADER - SMART AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Plus Jakarta Sans',sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:#020308;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:5px;
overflow:hidden;
color:#fff;
background-image:
radial-gradient(circle at top, rgba(0,240,255,0.15), transparent 40%),
radial-gradient(circle at bottom, rgba(255,0,127,0.1), transparent 40%);
}

.lock-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
backdrop-filter:blur(25px);
transition:0.4s;
}

.lock-box{
width:100%;
max-width:320px;
background:rgba(10,12,22,0.7);
border:1px solid rgba(255,165,0,0.25);
border-radius:24px;
padding:25px;
text-align:center;
}

.lock-title{
font-family:'Orbitron',sans-serif;
font-size:15px;
font-weight:900;
}

.lock-sub{
font-size:8px;
color:#ffa500;
letter-spacing:2px;
margin-top:4px;
margin-bottom:16px;
font-weight:800;
}

.lock-input{
width:100%;
padding:13px;
background:#000;
border:none;
outline:none;
border-radius:12px;
color:#fff;
text-align:center;
font-size:16px;
letter-spacing:5px;
margin-bottom:12px;
}

.lock-btn{
width:100%;
padding:13px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#00f0ff,#ff007f);
color:#fff;
font-weight:900;
font-family:'Orbitron',sans-serif;
cursor:pointer;
}

.container{
width:100%;
max-width:370px;
height:96vh;
background:rgba(7,10,20,0.45);
border-radius:22px;
border:1px solid rgba(0,240,255,0.12);
padding:12px;
backdrop-filter:blur(20px);
overflow:hidden;
display:flex;
flex-direction:column;
justify-content:space-between;
filter:blur(10px);
pointer-events:none;
transition:0.4s;
}

.logo{
width:54px;
height:54px;
margin:auto;
border-radius:50%;
background:#0d111d;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
border:2px solid rgba(255,165,0,0.4);
box-shadow:0 0 15px rgba(255,165,0,0.2);
}

.title{
font-family:'Orbitron',sans-serif;
text-align:center;
font-size:15px;
font-weight:900;
margin-top:6px;
}

.subtitle{
text-align:center;
font-size:8px;
letter-spacing:2px;
color:#ff007f;
font-weight:800;
margin-bottom:8px;
}

.select{
width:100%;
padding:9px;
border:none;
outline:none;
border-radius:10px;
background:#0c111d;
color:#fff;
font-size:11px;
margin-bottom:5px;
}

.chart-box{
height:110px;
background:#080c16;
border-radius:14px;
padding:8px;
position:relative;
overflow:hidden;
}

.live{
font-size:8px;
font-family:'Orbitron',sans-serif;
color:#00f0ff;
font-weight:800;
}

.price{
font-size:24px;
font-weight:900;
margin-top:2px;
font-family:monospace;
}

.candles{
position:absolute;
left:10px;
right:10px;
bottom:8px;
height:48px;
display:flex;
align-items:flex-end;
gap:3px;
overflow:hidden;
}

.candle{
width:8px;
border-radius:2px;
}

.green{
background:#00ff88;
box-shadow:0 0 6px rgba(0,255,136,0.3);
}

.red{
background:#ff3b3b;
box-shadow:0 0 6px rgba(255,59,59,0.3);
}

.scan-line{
position:absolute;
top:0;
bottom:0;
width:2px;
background:linear-gradient(to right,transparent,#ff007f,transparent);
box-shadow:0 0 10px #ff007f;
display:none;
animation:scan.7s linear infinite;
}

@keyframes scan{
0%{left:-10px;}
100%{left:100%;}
}

.market-health{
margin-top:6px;
background:#0b101a;
padding:8px;
border-radius:10px;
}

.market-health p{
font-size:9px;
font-weight:700;
color:#999;
}

.market-health span{
float:right;
}

.bar{
width:100%;
height:5px;
background:rgba(255,0,0,0.2);
border-radius:3px;
overflow:hidden;
margin-top:4px;
}

.fill{
height:100%;
width:50%;
background:#00ff88;
transition:0.3s;
}

.btn{
width:100%;
padding:12px;
margin-top:7px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#00f0ff,#0055ff);
color:#fff;
font-family:'Orbitron',sans-serif;
font-weight:900;
cursor:pointer;
}

.result{
margin-top:7px;
background:#0a0f19;
border-radius:14px;
padding:10px;
display:none;
animation:fade.25s ease;
}

@keyframes fade{
from{opacity:0;transform:scale(.98);}
to{opacity:1;transform:scale(1);}
}

.signal{
font-size:28px;
font-family:'Orbitron',sans-serif;
font-weight:900;
text-align:center;
}

.buy{color:#00ff88;}
.sell{color:#ff3b3b;}
.conf{text-align:center;margin-top:4px;margin-bottom:6px;font-weight:900;}

.info-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:5px;
font-size:10px;
}

.info-item{
background:#101520;
padding:6px;
border-radius:7px;
color:#aaa;
}

.info-item span{
float:right;
font-weight:700;
}

.footer{
margin-top:5px;
font-size:8px;
text-align:center;
color:#555;
}

.txt-green{color:#00ff88!important;}
.txt-red{color:#ff3b3b!important;}
</style>
</head>

<body>

<div class="lock-screen" id="lockScreen">
<div class="lock-box">
<div class="logo">🐅</div>
<div class="lock-title">ABU BAKAR TRADER</div>
<div class="lock-sub">SMART AI SECURITY</div>
<input type="password" id="passInput" class="lock-input" placeholder="PASSKEY">
<button class="lock-btn" onclick="checkPassword()">INITIALIZE CORE</button>
<div id="errorMsg" style="display:none;color:#ff3b3b;font-size:11px;margin-top:8px;font-weight:700;">❌ ACCESS DENIED</div>
</div>
</div>

<div class="container" id="botContainer">
<div>
<div class="logo">🐅</div>
<div class="title">ABU BAKAR TRADER</div>
<div class="subtitle">ROYAL TIGER AI</div>
<select class="select" id="pair" onchange="changePair()">
<option value="USD/BRL">🇧🇷 USD/BRL OTC</option>
<option value="USD/MXN">🇲🇽 USD/MXN OTC</option>
<option value="USD/INR">🇮🇳 USD/INR OTC</option>
<option value="USD/PKR">🇵🇰 USD/PKR OTC</option>
<option value="EUR/USD">🇺🇸 EUR/USD OTC</option>
<option value="GBP/USD">🇬🇧 GBP/USD OTC</option>
</select>
<div class="chart-box">
<div class="live">LIVE MARKET STREAM</div>
<div class="price" id="price">4.9712</div>
<div class="scan-line" id="scanLine"></div>
<div class="candles" id="candles"></div>
</div>
<div class="market-health">
<p>MARKET HEALTH <span id="healthText">68% BULLISH</span></p>
<div class="bar"><div class="fill" id="healthFill"></div></div>
</div>
</div>

<div>
<button class="btn" id="signalBtn" onclick="generateSignal()">GET AI SIGNAL</button>
<div class="result" id="resultBox">
<div class="signal buy" id="signalText">BUY</div>
<div class="conf" id="confidence">95%</div>
<div class="info-grid">
<div class="info-item">RSI:<span id="rsi">--</span></div>
<div class="info-item">EMA 9:<span id="ema9">--</span></div>
<div class="info-item">EMA 21:<span id="ema21">--</span></div>
<div class="info-item">MACD:<span id="macd">--</span></div>
<div class="info-item">STOCH:<span id="stoch">--</span></div>
<div class="info-item">PATTERN:<span id="pattern">--</span></div>
</div>
</div>
<div class="footer">ABU BAKAR TRADER © SMART ENGINE</div>
</div>
</div>

<script>
const pairData={
"USD/BRL":{base:4.9712,digits:4},
"USD/MXN":{base:16.8552,digits:4},
"USD/INR":{base:83.3110,digits:4},
"USD/PKR":{base:278.25,digits:2},
"EUR/USD":{base:1.0845,digits:4},
"GBP/USD":{base:1.2615,digits:4}
};

let currentPair="USD/BRL";
let currentPrice=4.9712;
let candles=[];
let streamInterval;
let healthInterval;

const candlesWrap=document.getElementById("candles");

function checkPassword(){
let pass=document.getElementById("passInput").value.trim();
if(pass==="bakar786"){
document.getElementById("lockScreen").style.opacity="0";
setTimeout(()=>{document.getElementById("lockScreen").style.display="none";},400);
document.getElementById("botContainer").style.filter="none";
document.getElementById("botContainer").style.pointerEvents="auto";
initialize();
}else{
document.getElementById("errorMsg").style.display="block";
}
}

function initialize(){
createCandles();
startStream();
startHealth();
}

function changePair(){
currentPair=document.getElementById("pair").value;
currentPrice=pairData[currentPair].base;
createCandles();
}

function createCandles(){
candles=[];
for(let i=0;i<24;i++){
candles.push(Math.random()>0.5?"green":"red");
}
renderCandles();
}

function renderCandles(){
candlesWrap.innerHTML="";
candles.forEach(type=>{
let c=document.createElement("div");
c.classList.add("candle",type);
c.style.height=(Math.random()*28+12)+"px";
candlesWrap.appendChild(c);
});
}

function startStream(){
if(streamInterval) clearInterval(streamInterval);
streamInterval=setInterval(()=>{updatePrice();},1000);
}

function updatePrice(){
let cfg=pairData[currentPair];
let move=(Math.random()-0.49)*(4/Math.pow(10,cfg.digits));
let old=currentPrice;
currentPrice=parseFloat((currentPrice+move).toFixed(cfg.digits));
document.getElementById("price").innerText=currentPrice.toFixed(cfg.digits);
document.getElementById("price").style.color=currentPrice>=old?"#00ff88":"#ff3b3b";
candles.shift();
candles.push(currentPrice>=old?"green":"red");
renderCandles();
}

function startHealth(){
if(healthInterval) clearInterval(healthInterval);
healthInterval=setInterval(()=>{updateHealth();},2000);
}

function updateHealth(){
let greens=candles.filter(c=>c==="green").length;
let percent=Math.floor((greens/candles.length)*100);
percent=Math.max(25,Math.min(92,percent));
let fill=document.getElementById("healthFill");
let text=document.getElementById("healthText");
fill.style.width=percent+"%";
if(percent>=50){
fill.style.background="#00ff88";
text.innerText=percent+"% BULLISH";
text.style.color="#00ff88";
}else{
fill.style.background="#ff3b3b";
text.innerText=(100-percent)+"% BEARISH";
text.style.color="#ff3b3b";
}
}

function generateSignal(){
let scan=document.getElementById("scanLine");
let btn=document.getElementById("signalBtn");
scan.style.display="block";
btn.disabled=true;
btn.innerText="SCANNING...";
setTimeout(()=>{scan.style.display="none";btn.disabled=false;btn.innerText="GET AI SIGNAL";processSignal();},700);
}

function processSignal(){
document.getElementById("resultBox").style.display="block";
let greens=candles.filter(c=>c==="green").length;
let reds=candles.filter(c=>c==="red").length;
let bullish=greens>=reds;
let signal=bullish?"BUY":"SELL";
let signalText=document.getElementById("signalText");
signalText.classList.remove("buy","sell");
signalText.classList.add(bullish?"buy":"sell");
signalText.innerText=signal;
let confidence=Math.floor(Math.random()*4)+94;
document.getElementById("confidence").innerText=confidence+"%";
let rsi=bullish?Math.floor(Math.random()*10)+25:Math.floor(Math.random()*10)+70;
let stoch=bullish?(Math.random()*15+10).toFixed(1):(Math.random()*15+80).toFixed(1);
let macd=bullish?"BULL CROSS":"BEAR CROSS";
let patternsBull=["Hammer","Morning Star","Bullish Engulf"];
let patternsBear=["Shooting Star","Evening Star","Bearish Engulf"];
let pattern=bullish?patternsBull[Math.floor(Math.random()*patternsBull.length)]:patternsBear[Math.floor(Math.random()*patternsBear.length)];
let cfg=pairData[currentPair];
let ema9=bullish?currentPrice+(2/Math.pow(10,cfg.digits)):currentPrice-(2/Math.pow(10,cfg.digits));
let ema21=bullish?currentPrice-(1/Math.pow(10,cfg.digits)):currentPrice+(1/Math.pow(10,cfg.digits));
let color=bullish?"txt-green":"txt-red";
updateData("rsi",rsi,color);
updateData("ema9",ema9.toFixed(cfg.digits),color);
updateData("ema21",ema21.toFixed(cfg.digits),color);
updateData("macd",macd,color);
updateData("stoch",stoch,color);
updateData("pattern",pattern,color);
}

function updateData(id,val,color){
let el=document.getElementById(id);
el.innerText=val;
el.className=color;
}
</script>
</body>
</html>
