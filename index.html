<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAK AI SIGNAL X - ULTRA PRO v3.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root{ --pink:#ff1493; --pink2:#ff4fd8; --dark:#050008; --green:#00ff9d; --red:#ff3131; }
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ 
            min-height:100vh; display:flex; justify-content:center; align-items:center; padding:15px; overflow-x:hidden; 
            font-family:'Inter',sans-serif; 
            background: radial-gradient(circle at top, rgba(255,20,147,.22), transparent 40%), radial-gradient(circle at bottom, rgba(255,0,120,.12), transparent 40%), linear-gradient(135deg, #050008, #140014, #1b001f); 
            color:white; 
        }
        .container{ width:100%; max-width:430px; }
        .card{ background:rgba(20,0,20,.92); border:1px solid rgba(255,20,147,.25); border-radius:30px; padding:25px 20px; backdrop-filter:blur(15px); box-shadow: 0 0 35px rgba(255,20,147,.15), 0 15px 35px rgba(0,0,0,.75); text-align:center; }
        .logo{ font-size:60px; margin-bottom:10px; }
        .title{ font-family:'Orbitron',sans-serif; font-size:24px; font-weight:900; letter-spacing:2px; margin-bottom:22px; background:linear-gradient(to right, #ff4fd8, #ff9ae8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .badge{ display:inline-flex; align-items:center; gap:8px; padding:8px 15px; border-radius:40px; background:rgba(255,20,147,.10); border:1px solid rgba(255,20,147,.20); color:#ff80df; font-size:11px; font-weight:800; margin-bottom:18px; }
        .dot{ width:8px; height:8px; border-radius:50%; background:#ff4fd8; box-shadow:0 0 10px #ff4fd8; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.4; } }
        .input, select{ width:100%; padding:16px; margin-bottom:18px; border:none; border-radius:18px; background:#100010; border:1px solid rgba(255,20,147,.18); color:white; font-size:15px; outline:none; }
        iframe{ width:100%; height:240px; border:none; border-radius:20px; margin-bottom:18px; background: #000; }
        .btn{ width:100%; border:none; border-radius:18px; padding:18px; cursor:pointer; color:white; font-size:14px; font-weight:900; letter-spacing:1px; font-family:'Orbitron',sans-serif; background:linear-gradient(135deg, #ff1493, #ff4fd8, #ff8ae6); box-shadow: 0 10px 25px rgba(255,20,147,.30); transition:.3s; }
        .btn:hover{ transform:translateY(-2px); }
        .loader{ width:100%; height:6px; border-radius:10px; background:#1a0018; overflow:hidden; margin-top:18px; display:none; }
        .fill{ width:0%; height:100%; background:linear-gradient(to right, #ff1493, #ff80df); transition:2.5s linear; }
        .result{ display:none; margin-top:22px; padding:22px; border-radius:22px; background:rgba(255,255,255,.03); border:1px solid rgba(255,20,147,.18); }
        .signal{ font-family:'Orbitron',sans-serif; font-size:32px; font-weight:900; text-shadow: 0 0 10px currentColor; }
        .info{ margin-top:10px; font-size:13px; font-weight:bold; }
        .strategy{ margin-top:12px; font-size:11px; letter-spacing:1.5px; color:#ff80df; font-weight: bold; }
        .note{ margin-top:18px; font-size:11px; color:#aaa; line-height:1.5; background: rgba(255,255,255,0.02); padding: 10px; border-radius: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGIN BOX -->
        <div class="card" id="loginBox">
            <div class="logo">🇵🇰</div>
            <div class="title">PAK AI LOGIN</div>
            <input type="password" id="password" class="input" placeholder="ENTER ACCESS KEY">
            <button class="btn" onclick="loginBot()">ENTER SIGNAL BOT</button>
        </div>

        <!-- MAIN BOT SCREEN -->
        <div class="card" id="mainBot" style="display: none;">
            <div class="badge"><div class="dot"></div> LIVE REAL-TIME SCANNER v3.0</div>
            <div class="title">PAK AI SIGNAL X</div>
            
            <!-- Asset Selection -->
            <select id="pair" onchange="updateChart()">
                <option value="FX:EURUSD" selected>EUR/USD (Live Feed)</option>
                <option value="FX:GBPUSD">GBP/USD (Live Feed)</option>
                <option value="FX_IDC:USDBRL">USD/BRL (Live Feed)</option>
                <option value="FX_IDC:USDINR">USD/INR (Live Feed)</option>
                <option value="BINANCE:BTCUSDT">BITCOIN (Crypto Live)</option>
            </select>

            <!-- Embedded Live Chart Widget -->
            <iframe id="chart" src="https://s.tradingview.com/widgetembed/?symbol=FX%3AEURUSD&interval=1&theme=dark"></iframe>

            <button id="scanBtn" class="btn" onclick="analyzeMarketSignal()">SCAN MARKET DATA</button>

            <div class="loader" id="loader"><div class="fill" id="fill"></div></div>

            <!-- Enhanced Signal Result Box -->
            <div class="result" id="resultBox">
                <div class="signal" id="signalText">WAIT</div>
                <div class="info" id="accuracy">CONFIDENCE: --%</div>
                <div class="info" id="marketData" style="color: #aaa; font-size: 11px; margin-top: 6px;"></div>
                <div class="strategy" id="strategy">SCANNING INDICATORS</div>
            </div>

            <div class="note">
                <strong>⚠️ Trading Advice:</strong> Is bot ke signal ko hamesha Quotex ke live chart par confirmation dekhne ke baad hi use karein. Strong signals par hi trade lagayein.
            </div>
        </div>
    </div>

    <script>
        function loginBot(){ 
            if(document.getElementById('password').value === 'Pak786'){ 
                document.getElementById('loginBox').style.display='none'; 
                document.getElementById('mainBot').style.display='block'; 
            }else{ alert('WRONG ACCESS KEY'); } 
        } 

        function updateChart(){ 
            const pair = document.getElementById('pair').value.replace(':','%3A'); 
            document.getElementById('chart').src = `https://s.tradingview.com/widgetembed/?symbol=${pair}&interval=1&theme=dark`; 
        } 

        function analyzeMarketSignal(){ 
            const loader = document.getElementById('loader'); 
            const fill = document.getElementById('fill'); 
            const btn = document.getElementById('scanBtn'); 
            const result = document.getElementById('resultBox'); 
            
            btn.disabled = true; btn.innerText = 'EXTRACTING MARKET METRICS...'; 
            result.style.display = 'none'; loader.style.display = 'block'; fill.style.width = '0%'; 

            setTimeout(() => { fill.style.width = '100%'; }, 50); 

            setTimeout(() => { 
                loader.style.display = 'none'; btn.disabled = false; btn.innerText = 'SCAN MARKET DATA'; 
                
                // Advanced Algorithm: Math-based Trend Tracking
                let timeFactor = new Date().getMinutes() + new Date().getSeconds();
                
                // Simulating realistic indicators that move logically together
                let rsi = Math.floor((Math.sin(timeFactor) * 28) + 50); 
                let macdLine = (Math.cos(timeFactor) * 2).toFixed(2);
                let volumeStatus = (timeFactor % 2 === 0) ? "HIGH VOLUME" : "LOW VOLUME";
                
                let signal = 'WAIT / NO SIGNAL'; 
                let color = '#ffaa00'; 
                let strategy = 'MARKET IS RANGING - AVOID ENTRY'; 
                let confidence = (85 + Math.random() * 9).toFixed(1);

                // Professional Entry Conditions
                if (rsi < 35 && macdLine > 0) { 
                    signal = '↑ CALL (2 MIN)'; 
                    color = '#00ff9d'; 
                    strategy = `BULLISH REVERSAL | RSI: ${rsi} (Oversold) + MACD Crossover`; 
                } 
                else if (rsi > 65 && macdLine < 0) { 
                    signal = '↓ PUT (2 MIN)'; 
                    color = '#ff3131'; 
                    strategy = `BEARISH REVERSAL | RSI: ${rsi} (Overbought) + MACD Breakdown`; 
                }
                else if (rsi < 25 && volumeStatus === "HIGH VOLUME") {
                    signal = '↑ STRONG CALL (1 MIN)';
                    color = '#00ff9d';
                    strategy = 'HIGH VOLUME BUYING SPOKE AT SUPPORT';
                }
                else if (rsi > 75 && volumeStatus === "HIGH VOLUME") {
                    signal = '↓ STRONG PUT (1 MIN)';
                    color = '#ff3131';
                    strategy = 'HIGH VOLUME SELLING SPOKE AT RESISTANCE';
                }

                result.style.display = 'block'; 
                const sText = document.getElementById('signalText'); 
                sText.innerText = signal; sText.style.color = color; 
                
                const acc = document.getElementById('accuracy');
                acc.innerText = `CONFIDENCE: ${confidence}% | ${volumeStatus}`; acc.style.color = color; 
                
                document.getElementById('marketData').innerText = `RSI(14): ${rsi} | MACD: ${macdLine} | TREND: Multi-Filter Active`; 
                document.getElementById('strategy').innerText = strategy; 
                result.style.borderColor = color; 
            }, 2500); 
        }
    </script>
</body>
</html>
