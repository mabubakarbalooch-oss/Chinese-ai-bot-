<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binance Signal Pro</title>
<style>
    body { background:#0a0e13; font-family:sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
    .container { width: 90%; max-width: 450px; background:#0f1318; border:2px solid #00ff88; border-radius:25px; padding:25px; box-shadow:0 0 20px rgba(0,255,136,0.3); }
    h1 { color:#00ff88; font-size:20px; text-align:center; }
    .label { color:#8b949e; font-size:13px; margin:10px 0 5px 0; display:block; }
    select, input { width:100%; padding:12px; background:#1a1f26; border:1px solid #30363d; border-radius:10px; color:#fff; box-sizing:border-box; }
    .gen-btn { width:100%; padding:15px; background:#00ff88; border:none; border-radius:10px; font-weight:bold; cursor:pointer; margin-top:15px; color:#000; }
    #signalBox { margin-top:15px; padding:12px; border-radius:10px; text-align:center; font-weight:bold; display:none; font-size: 18px; }
    .buy-style { background:rgba(0, 255, 136, 0.2); border:1px solid #00ff88; color:#00ff88; }
    .sell-style { background:rgba(255, 68, 68, 0.2); border:1px solid #ff4444; color:#ff4444; }
</style>
</head>
<body>

<div id="loginScreen" class="container">
    <h2 style="color:#00ff88; text-align:center;">🔒 Access Locked</h2>
    <input type="password" id="pass" placeholder="Enter Password">
    <button class="gen-btn" onclick="login()">Unlock Now</button>
</div>

<div id="mainBoard" class="container" style="display:none;">
    <h1>🚀 Binance Live Signal</h1>
    <label class="label">Select Asset</label>
    <select id="symbol">
        <option value="BTCUSDT">BTC/USDT</option>
        <option value="ETHUSDT">ETH/USDT</option>
        <option value="BNBUSDT">BNB/USDT</option>
    </select>
    <button class="gen-btn" onclick="getBinanceSignal()">⚡ ANALYZE LIVE MARKET ⚡</button>
    <div id="signalBox">---</div>
    <p id="priceInfo" style="color:#8b949e; font-size:12px; text-align:center; margin-top:10px;"></p>
</div>

<script>
    function login() {
        if(document.getElementById('pass').value === "bakar786") {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainBoard').style.display = 'block';
        } else { alert("Wrong Password!"); }
    }

    async function getBinanceSignal() {
        let symbol = document.getElementById('symbol').value;
        let box = document.getElementById('signalBox');
        
        try {
            // بائننس کی API سے لائیو ڈیٹا کال کرنا
            let response = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${symbol}`);
            let data = await response.json();
            
            let priceChange = parseFloat(data.priceChangePercent);
            document.getElementById('priceInfo').innerText = `24h Change: ${priceChange}%`;
            
            box.style.display = 'block';
            if(priceChange > 0) {
                box.innerText = "BUY SIGNAL (Bullish)";
                box.className = "buy-style";
            } else {
                box.innerText = "SELL SIGNAL (Bearish)";
                box.className = "sell-style";
            }
        } catch(e) {
            alert("Error connecting to Binance API");
        }
    }
</script>
</body>
</html>
