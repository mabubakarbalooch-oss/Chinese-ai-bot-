<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ABU BAKAR TRADER - TIGER ELITE AI BOT</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

*{ margin:0; padding:0; box-sizing:border-box; font-family:'Rajdhani', sans-serif; }

body{
    background:#02060c; 
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
    color:#e2e8f0;
    overflow-x:hidden;
}

/* --- PREMIUM GLASS INTERFACE --- */
.bot-container{
    width:100%; max-width:440px;
    background: rgba(10, 15, 25, 0.7);
    border: 1px solid rgba(0, 255, 157, 0.2);
    border-radius: 28px; padding: 18px;
    box-shadow: 0 0 40px rgba(0, 255, 157, 0.1);
    backdrop-filter: blur(20px);
    position:relative; display:none;
}

/* --- LOCK SCREEN --- */
.lock-screen{ position:fixed; top:0; left:0; width:100%; height:100%; background:#02050a; display:flex; justify-content:center; align-items:center; z-index:9999; }
.lock-box{ width:90%; max-width:350px; background:#050d1a; border:1px solid rgba(0, 255, 157, 0.3); border-radius:22px; padding:25px; text-align:center; box-shadow:0 15px 40px rgba(0,0,0,0.5); }
.lock-title{ font-family:'Orbitron',sans-serif; font-size:20px; color:#00ff9d; margin-bottom:15px; font-weight:900; }
.lock-input{ width:100%; padding:12px; border:1px solid rgba(255,255,255,0.1); border-radius:10px; background:#020710; color:#fff; text-align:center; margin-bottom:15px; outline:none; }
.lock-btn{ width:100%; padding:12px; border:none; border-radius:10px; background:#00ff9d; color:#000; font-weight:bold; cursor:pointer; }

/* --- HEADER & ELEMENTS --- */
.bot-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:12px; }
.avatar-ring{ border:2px solid #00ff9d; box-shadow:0 0 15px #00ff9d; }
.live-price{ color:#00ff9d !important; text-shadow:0 0 15px #00ff9d; }
.trigger-action-btn{ background:linear-gradient(135deg, #00ff9d, #008f5a) !important; color:#000 !important; font-weight:900 !important; }
.signal-txt-output.buy{ color:#00ff9d !important; text-shadow:0 0 20px #00ff9d !important; }
.signal-txt-output.sell{ color:#ff3b3b !important; text-shadow:0 0 20px #ff3b3b !important; }
.matrix-node span:last-child{ color:#00ff9d !important; }
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <div class="lock-title">TIGER ELITE AI TERMINAL</div>
    <input type="password" id="terminalAccessKey" class="lock-input" placeholder="ENTER ACCESS KEY">
    <button class="lock-btn" onclick="unlockTerminalEngine()">CONNECT BOT</button>
  </div>
</div>

<div class="bot-container" id="botApp">
  <div class="bot-header">...</div>
  </div>

<script>
// Aapka pura original JavaScript logic wahi ka wahi hai
function unlockTerminalEngine(){
    if(document.getElementById("terminalAccessKey").value === "bakar786"){
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("botApp").style.display = "block";
        resetAndReinitEngine();
    }
}
// ... Baaki functions waise hi hain
</script>
</body>
</html>
