<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quotex Signal Bot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: auto;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    h1, h2 {
      margin-top: 0;
    }
    button {
      background: #22c55e;
      border: none;
      padding: 12px 20px;
      color: white;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #16a34a;
    }
    .sell { color: #ef4444; font-weight: bold; }
    .buy { color: #22c55e; font-weight: bold; }
    .neutral { color: #facc15; font-weight: bold; }
    textarea {
      width: 100%;
      height: 180px;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      border: none;
      resize: vertical;
    }
    .small {
      color: #cbd5e1;
      font-size: 14px;
    }
    .result {
      font-size: 20px;
      margin-top: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media(max-width: 700px){
      .grid {
        grid-template-columns: 1fr;
      }
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-top: 8px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .metric {
      background: #334155;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quotex Signal Bot</h1>
    <p class="small">
      Candle data paste کریں JSON format میں۔ Example:
      [{"open":100,"high":105,"low":99,"close":104},{"open":104,"high":106,"low":103,"close":105}]
    </p>

    <div class="grid">
      <div class="card">
        <h2>Market Data Input</h2>
        <textarea id="candleInput">[
  {"open":100,"high":101,"low":99,"close":100.5},
  {"open":100.5,"high":102,"low":100,"close":101.8},
  {"open":101.8,"high":103,"low":101.5,"close":102.9},
  {"open":102.9,"high":103.2,"low":101.8,"close":102.1},
  {"open":102.1,"high":104.5,"low":102,"close":104.1},
  {"open":104.1,"high":105,"low":103.5,"close":104.7},
  {"open":104.7,"high":105.2,"low":104,"close":104.3},
  {"open":104.3,"high":106.1,"low":104.1,"close":105.9},
  {"open":105.9,"high":106.5,"low":105.1,"close":106.2},
  {"open":106.2,"high":107.3,"low":105.9,"close":107.0},
  {"open":107.0,"high":107.5,"low":106.3,"close":106.6},
  {"open":106.6,"high":108.2,"low":106.5,"close":107.9},
  {"open":107.9,"high":108.7,"low":107.1,"close":108.3},
  {"open":108.3,"high":108.9,"low":107.6,"close":108.0},
  {"open":108.0,"high":109.4,"low":107.8,"close":109.1},
  {"open":109.1,"high":110.0,"low":108.9,"close":109.8},
  {"open":109.8,"high":110.3,"low":109.0,"close":109.4},
  {"open":109.4,"high":111.0,"low":109.2,"close":110.6},
  {"open":110.6,"high":111.3,"low":110.1,"close":111.0},
  {"open":111.0,"high":111.5,"low":110.2,"close":110.8}
]</textarea>
        <button onclick="generateSignal()">Generate Signal</button>
      </div>

      <div class="card">
        <h2>Signal Result</h2>
        <div id="signalResult" class="result neutral">Waiting for analysis...</div>
        <div id="confidence" class="metric">Confidence: --</div>
        <div id="trend" class="metric">Trend: --</div>
        <div id="rsiBox" class="metric">RSI: --</div>
        <div id="emaBox" class="metric">EMA(5/10): --</div>
        <div id="macdBox" class="metric">Momentum: --</div>
      </div>
    </div>
  </div>

  <script>
    function ema(values, period) {
      const k = 2 / (period + 1);
      let emaArray = [];
      let prevEma = values[0];
      emaArray.push(prevEma);

      for (let i = 1; i < values.length; i++) {
        const currentEma = values[i] * k + prevEma * (1 - k);
        emaArray.push(currentEma);
        prevEma = currentEma;
      }
      return emaArray;
    }

    function rsi(closes, period = 14) {
      if (closes.length <= period) return null;

      let gains = 0;
      let losses = 0;

      for (let i = 1; i <= period; i++) {
        let diff = closes[i] - closes[i - 1];
        if (diff >= 0) gains += diff;
        else losses -= diff;
      }

      let avgGain = gains / period;
      let avgLoss = losses / period;

      for (let i = period + 1; i < closes.length; i++) {
        let diff = closes[i] - closes[i - 1];
        let gain = diff > 0 ? diff : 0;
        let loss = diff < 0 ? -diff : 0;

        avgGain = (avgGain * (period - 1) + gain) / period;
        avgLoss = (avgLoss * (period - 1) + loss) / period;
      }

      if (avgLoss === 0) return 100;
      const rs = avgGain / avgLoss;
      return 100 - (100 / (1 + rs));
    }

    function generateSignal() {
      const input = document.getElementById("candleInput").value;
      let candles;

      try {
        candles = JSON.parse(input);
      } catch (e) {
        alert("Invalid JSON format");
        return;
      }

      if (!Array.isArray(candles) || candles.length < 15) {
        alert("At least 15 candles are required.");
        return;
      }

      const closes = candles.map(c => c.close);
      const opens = candles.map(c => c.open);

      const ema5 = ema(closes, 5);
      const ema10 = ema(closes, 10);

      const latestEma5 = ema5[ema5.length - 1];
      const latestEma10 = ema10[ema10.length - 1];
      const latestClose = closes[closes.length - 1];
      const latestOpen = opens[opens.length - 1];

      const currentRsi = rsi(closes, 14);

      const momentum = closes[closes.length - 1] - closes[closes.length - 4];
      const candleStrength = latestClose - latestOpen;

      let buyScore = 0;
      let sellScore = 0;

      // EMA trend logic
      if (latestEma5 > latestEma10) buyScore += 30;
      else sellScore += 30;

      // RSI logic
      if (currentRsi < 35) buyScore += 25;
      else if (currentRsi > 65) sellScore += 25;
      else {
        if (latestEma5 > latestEma10) buyScore += 10;
        else sellScore += 10;
      }

      // Momentum logic
      if (momentum > 0.8) buyScore += 20;
      else if (momentum < -0.8) sellScore += 20;

      // Last candle strength
      if (candleStrength > 0.3) buyScore += 15;
      else if (candleStrength < -0.3) sellScore += 15;

      // Price above/below EMA
      if (latestClose > latestEma5) buyScore += 10;
      else sellScore += 10;

      let signal = "NEUTRAL";
      let signalClass = "neutral";
      let confidence = Math.max(buyScore, sellScore);

      if (buyScore >= 60 && buyScore > sellScore) {
        signal = "BUY";
        signalClass = "buy";
      } else if (sellScore >= 60 && sellScore > buyScore) {
        signal = "SELL";
        signalClass = "sell";
      }

      const trend = latestEma5 > latestEma10 ? "UPTREND" : "DOWNTREND";

      document.getElementById("signalResult").innerHTML =
        `Signal: <span class="${signalClass}">${signal}</span>`;

      document.getElementById("confidence").innerText =
        `Confidence: ${confidence}%`;

      document.getElementById("trend").innerText =
        `Trend: ${trend}`;

      document.getElementById("rsiBox").innerText =
        `RSI: ${currentRsi ? currentRsi.toFixed(2) : '--'}`;

      document.getElementById("emaBox").innerText =
        `EMA(5): ${latestEma5.toFixed(2)} | EMA(10): ${latestEma10.toFixed(2)}`;

      document.getElementById("macdBox").innerText =
        `Momentum: ${momentum.toFixed(2)} | Candle Strength: ${candleStrength.toFixed(2)}`;
    }
  </script>
</body>
</html>
